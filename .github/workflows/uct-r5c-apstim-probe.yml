name: UCT R5C APStim index only

on:
  push:
    branches:
      - ops/uct-r5c-apstim-probe-20260928

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch APStim index
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,json
          from urllib.parse import urljoin
          rows=[]
          for u in ["https://epi.fizica.unibuc.ro/apstim/","http://epi.fizica.unibuc.ro/apstim/"]:
              item={"url":u}
              try:
                  r=requests.get(u,timeout=(5,12),allow_redirects=True)
                  item.update(status=r.status_code,final_url=r.url,content_type=r.headers.get("content-type"),text_len=len(r.text))
                  item["links"]=sorted(set(urljoin(r.url,x) for x in re.findall(r'''(?:href|src)=["']([^"']+)''',r.text,re.I)))
                  open("out/index.html","w",encoding="utf-8",errors="ignore").write(r.text)
              except Exception as e:
                  item["error"]=repr(e)
              rows.append(item)
          open("out/index_probe.json","w").write(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uct-r5c-apstim-index-only
          path: out/
          retention-days: 7
