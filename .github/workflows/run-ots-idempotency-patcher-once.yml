name: Run OTS idempotency patcher once

on:
  push:
    branches: [agent/ots-idempotency-retire-spent-writers-20260828]
    paths: [.github/workflows/run-ots-idempotency-patcher-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ots-idempotency-retire-spent-writers-20260828
      - name: Apply exact patch and self-clean
        run: |
          set -euo pipefail
          python3 scripts/patch_ots_idempotency_once.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/patch_ots_idempotency_once.py .github/workflows/run-ots-idempotency-patcher-once.yml
          git add .github/workflows/chronicle-sidechain-ots-anchor.yml .github/workflows/chronicle-sidechain-ots-bitcoin-closure.yml scripts/patch_ots_idempotency_once.py .github/workflows/run-ots-idempotency-patcher-once.yml
          git commit -m "fix: make sidechain OTS lifecycle idempotent"
          git push origin HEAD:agent/ots-idempotency-retire-spent-writers-20260828
