name: Run OTS idempotency patcher once

on:
  push:
    branches: [agent/ots-idempotency-retire-spent-writers-20260828]
    paths: [.github/workflows/run-ots-idempotency-patcher-once.yml]

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/ots-idempotency-retire-spent-writers-20260828
      - name: Generate exact candidate workflows
        run: |
          set -euo pipefail
          python3 scripts/patch_ots_idempotency_once.py
          git diff --check
          git diff -- .github/workflows/chronicle-sidechain-ots-anchor.yml .github/workflows/chronicle-sidechain-ots-bitcoin-closure.yml > /tmp/ots-idempotency.patch
          test -s /tmp/ots-idempotency.patch
      - name: Upload exact candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ots-idempotency-candidates
          path: |
            .github/workflows/chronicle-sidechain-ots-anchor.yml
            .github/workflows/chronicle-sidechain-ots-bitcoin-closure.yml
            /tmp/ots-idempotency.patch
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
