name: Full Project Preservation Bundle

on:
  push:
    branches: [main]
    paths:
      - .github/full-project-preservation-trigger-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-project-preservation-bundle-v1
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUNDLE_DIR: ${{ runner.temp }}/full-project-preservation-bundle
    steps:
      - name: Checkout exact source baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install verification dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Record staging capacity and source identity
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)"
          echo "source_tree=$(git rev-parse 'HEAD^{tree}')"
          df -h . "$RUNNER_TEMP"
          git status --short

      - name: Verify preservation prerequisites
        run: |
          set -euo pipefail
          python3 scripts/audit_recovery_readiness.py
          python3 scripts/build_final_evidence_inventory.py --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('archive/chronicle-sidechain-zenodo-state.json').read_text())
          assert state['doi']=='10.5281/zenodo.22012616'
          assert state['remote_full_readback_sha256_verified'] is True
          assert state['public_file_sha256']['chronicle-sidechain-evidence-v2-f64cc872b3b5.tar.gz']=='64152b7fc861dbf8aa9cec447ab7078a6a815136ccfc1b9bb0285aaca2ff1572'
          print('preservation prerequisites PASS')
          PY

      - name: Build complete content-addressed project bundle with live heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE_DIR"
          BUILD_LOG="$RUNNER_TEMP/full-project-preservation-build.log"
          HEARTBEAT_LOG="$RUNNER_TEMP/full-project-preservation-heartbeat.log"
          LAST_HEARTBEAT="$RUNNER_TEMP/full-project-preservation-last-heartbeat.txt"
          : > "$BUILD_LOG"
          : > "$HEARTBEAT_LOG"
          : > "$LAST_HEARTBEAT"

          echo "[observer] starting full preservation builder at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/build_full_project_preservation_bundle.py \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$BUNDLE_DIR" \
            > >(tee "$BUILD_LOG") 2>&1 &
          build_pid=$!
          echo "[observer] builder_pid=$build_pid"

          heartbeat=0
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 30
            heartbeat=$((heartbeat + 1))
            timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

            last_event=""
            if last_event_read=$(tail -n 1 "$BUILD_LOG" 2>/dev/null); then
              last_event=$last_event_read
            fi

            object_count=0
            if object_count_read=$(find "$BUNDLE_DIR/objects/sha256" -type f 2>/dev/null | wc -l | tr -d ' '); then
              object_count=$object_count_read
            fi

            object_bytes=0
            if object_bytes_read=$(du -sb "$BUNDLE_DIR/objects" 2>/dev/null | awk '{print $1}'); then
              object_bytes=${object_bytes_read:-0}
            fi

            bundle_bytes=0
            if bundle_bytes_read=$(du -sb "$BUNDLE_DIR" 2>/dev/null | awk '{print $1}'); then
              bundle_bytes=${bundle_bytes_read:-0}
            fi

            free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')

            partial=none
            if partial_read=$(find "$RUNNER_TEMP" /tmp \
              -path '*trinity-full-preservation-*' \
              -type f -name '*.part-*' \
              -printf '%s %p\n' 2>/dev/null | sort -nr | sed -n '1p'); then
              if [ -n "$partial_read" ]; then
                partial=$partial_read
              fi
            fi

            {
              echo "[observer-heartbeat] n=$heartbeat utc=$timestamp"
              echo "[observer-heartbeat] last_event=${last_event:-none}"
              echo "[observer-heartbeat] unique_objects_now=$object_count object_bytes_now=$object_bytes bundle_bytes_now=$bundle_bytes free_kb=$free_kb"
              echo "[observer-heartbeat] largest_active_partial=$partial"
            } | tee -a "$HEARTBEAT_LOG" "$LAST_HEARTBEAT"

            # Keep LAST_HEARTBEAT bounded to the most recent heartbeat only.
            tail -n 4 "$HEARTBEAT_LOG" > "$LAST_HEARTBEAT.tmp"
            mv "$LAST_HEARTBEAT.tmp" "$LAST_HEARTBEAT"
          done

          set +e
          wait "$build_pid"
          rc=$?
          set -e
          echo "[observer] builder_exit_code=$rc at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" | tee -a "$HEARTBEAT_LOG"
          if [ "$rc" -ne 0 ]; then
            echo "[observer] BUILD FAILED; last 100 build-log lines follow"
            if [ -f "$BUILD_LOG" ]; then
              tail -n 100 "$BUILD_LOG"
            else
              echo "[observer] build log is unavailable"
            fi
            echo "[observer] latest heartbeat snapshot"
            if [ -s "$LAST_HEARTBEAT" ]; then
              cat "$LAST_HEARTBEAT"
            else
              echo "[observer] no heartbeat snapshot was recorded"
            fi
            exit "$rc"
          fi
          echo "[observer] BUILD PASS"

      - name: Independently verify staged bundle offline
        run: |
          set -euo pipefail
          echo "[stage] offline independent verification START $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 scripts/verify_full_project_preservation_bundle.py \
            --bundle-dir "$BUNDLE_DIR" \
            --report "$RUNNER_TEMP/full-project-preservation-verification.json"
          diff -u \
            "$BUNDLE_DIR/verification-report.json" \
            "$RUNNER_TEMP/full-project-preservation-verification.json"
          echo "[stage] offline independent verification PASS $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Emit preservation telemetry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['BUNDLE_DIR'])/'full-project-manifest.json'
          m=json.loads(p.read_text())
          c=m['coverage']
          print(f"bundle_identity_sha256={m['bundle_identity_sha256']}")
          print(f"source_sha={m['source_git_commit_sha']}")
          print(f"release_count={c['release_count']}")
          print(f"release_asset_count={c['release_asset_count']}")
          print(f"release_downloaded_bytes={c['release_downloaded_bytes']}")
          print(f"release_duplicate_bytes_deduplicated={c['release_duplicate_bytes_deduplicated']}")
          print(f"unique_object_count={c['unique_object_count']}")
          print(f"unique_object_bytes={c['unique_object_bytes']}")
          print(f"logical_bytes_before_sha256_deduplication={c['logical_bytes_before_sha256_deduplication']}")
          summary=Path(os.environ['GITHUB_STEP_SUMMARY'])
          summary.write_text(
            '# Full Project Preservation Bundle\n\n'
            f"- Source commit: `{m['source_git_commit_sha']}`\n"
            f"- Bundle identity: `{m['bundle_identity_sha256']}`\n"
            f"- Releases enumerated: **{c['release_count']}**\n"
            f"- Custom Release assets captured: **{c['release_asset_count']}**\n"
            f"- Unique content-addressed objects: **{c['unique_object_count']}**\n"
            f"- Unique bytes: **{c['unique_object_bytes']}**\n"
            '- Current repository GitHub-zero cold restore: **PASS**\n'
            '- Polygon/Base DOI public-byte readback: **PASS**\n'
            '- Live build heartbeat: **ENABLED (30 s)**\n'
            '- Arweave write: **NONE**\n'
            '- External Dataverse publication: **NOT PERFORMED by this staging workflow**\n',
            encoding='utf-8'
          )
          PY
          du -sh "$BUNDLE_DIR"
          df -h . "$RUNNER_TEMP"

      - name: Upload compact audit index
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-project-preservation-audit-index
          path: |
            ${{ runner.temp }}/full-project-preservation-build.log
            ${{ runner.temp }}/full-project-preservation-heartbeat.log
            ${{ runner.temp }}/full-project-preservation-last-heartbeat.txt
            ${{ runner.temp }}/full-project-preservation-verification.json
            ${{ runner.temp }}/toolchain-provenance.json
            ${{ runner.temp }}/full-project-preservation-bundle/full-project-manifest.json
            ${{ runner.temp }}/full-project-preservation-bundle/SHA256SUMS
            ${{ runner.temp }}/full-project-preservation-bundle/verification-report.json
            ${{ runner.temp }}/full-project-preservation-bundle/verify-and-restore-full-project.py
          retention-days: 90
          if-no-files-found: warn

      - name: Record bundle size before artifact upload
        run: |
          set -euo pipefail
          echo "[stage] artifact upload will begin next"
          du -sh "$BUNDLE_DIR"
          find "$BUNDLE_DIR/objects/sha256" -type f | wc -l | xargs echo "unique_objects_to_upload="

      - name: Upload complete staged preservation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-project-preservation-bundle
          path: ${{ runner.temp }}/full-project-preservation-bundle
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
