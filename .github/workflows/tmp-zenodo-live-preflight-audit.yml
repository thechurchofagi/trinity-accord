name: Temporary Zenodo and Live Preflight Audit

on:
  push:
    branches:
      - agent/zenodo-idempotency-live-preflight

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install current CI dependencies
        env:
          PIP_PREFER_BINARY: "1"
          PIP_ONLY_BINARY: "cryptography,cffi"
        run: python3 -m pip install -r requirements-ci.txt

      - name: Prove consumed Zenodo refresh is secret-independent
        run: |
          set -euo pipefail
          env -u ZENODO_ACCESS_TOKEN -u PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK \
            bash scripts/run_repository_preservation_refresh_ci.sh

      - name: Run production no-write action preflight matrix
        run: |
          set -euo pipefail
          python3 scripts/smoke_live_record_action_preflight.py \
            --output "$RUNNER_TEMP/live-record-action-preflight-report.json"

      - name: Upload live preflight proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-record-action-preflight-proof
          path: ${{ runner.temp }}/live-record-action-preflight-report.json
          if-no-files-found: warn
          retention-days: 30
