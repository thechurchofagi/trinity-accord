name: One-time Arweave cost-boundary fix

on:
  push:
    branches:
      - fix/arweave-cost-boundaries-20260731
    paths:
      - .github/workflows/one-time-arweave-cost-boundary-fix.yml

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/arweave-cost-boundaries-20260731
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Apply repair patch
        run: python scripts/_apply_arweave_cost_boundary_fix.py

      - name: Validate syntax and focused regressions
        run: |
          set -euo pipefail
          python -m py_compile \
            apps/record_chain_intake_gateway/secure_entrypoint.py \
            scripts/arweave_daily_spend_guard.py \
            scripts/process_archive_backlog.py \
            scripts/record_chain_arweave_incremental.py \
            scripts/run_record_chain_arweave_incremental.py \
            scripts/run_native_ots_upgrade_verify.py
          node --check scripts/arweave_cost_gate.mjs
          python -m pytest -q \
            tests/test_arweave_cost_boundaries.py \
            tests/test_record_chain_arweave_incremental.py \
            tests/test_record_chain_intake_protection.py \
            tests/test_record_chain_secure_entrypoint.py

      - name: Remove one-time patch machinery
        run: |
          rm -f scripts/_apply_arweave_cost_boundary_fix.py
          rm -f .github/workflows/one-time-arweave-cost-boundary-fix.yml

      - name: Commit repaired implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No repair changes produced."
            exit 1
          fi
          git commit -m "fix: enforce global Arweave cost boundaries"
          git push origin HEAD:fix/arweave-cost-boundaries-20260731
