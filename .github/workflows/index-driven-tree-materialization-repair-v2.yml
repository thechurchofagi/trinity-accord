name: Index-Driven Tree Materialization Repair V2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/index-driven-tree-materialization-repair-v2.yml
      - tests/test_preservation_capsule_index_materialization.py

permissions:
  contents: write

concurrency:
  group: index-driven-tree-materialization-repair-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    if: github.head_ref == 'fix/index-driven-tree-materialization-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout repair branch with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/index-driven-tree-materialization-20260802
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Replace worktree materialization with exact index reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_preservation_capsule.py')
          text = path.read_text(encoding='utf-8')
          old = '''def materialize_commit_tree_repository(\n    source: Path,\n    target: Path,\n    tree_oid: str,\n    tracked: dict[str, Any],\n) -> None:\n    """Create a clean history-free repository containing only the frozen tree.\n\n    Building from a bare clone leaks source-repository storage state, including\n    shallow-clone boundaries and pack layout, into the recovery bundle bytes.\n    Materializing the exact tracked blobs into a new repository makes the\n    published bundle a pure function of the frozen tree and controlled commit\n    metadata.\n    """\n    run(["git", "init", "-b", "main", str(target)])\n    git_text(target, "config", "core.filemode", "true")\n    blobs = batch_blob_bytes(\n        source, (item["git_blob_oid"] for item in tracked["files"])\n    )\n    for item in tracked["files"]:\n        destination = target / item["path"]\n        destination.parent.mkdir(parents=True, exist_ok=True)\n        destination.write_bytes(blobs[item["git_blob_oid"]])\n        destination.chmod(0o755 if item["mode"] == "100755" else 0o644)\n    git_text(target, "add", "-A")\n    rebuilt_tree = git_text(target, "write-tree")\n    if rebuilt_tree != tree_oid:\n        raise SystemExit(\n            "clean recovery repository tree mismatch: "\n            f"expected {tree_oid}, observed {rebuilt_tree}"\n        )\n'''
          new = '''def materialize_commit_tree_repository(\n    source: Path,\n    target: Path,\n    tree_oid: str,\n    tracked: dict[str, Any],\n) -> None:\n    """Create a clean history-free repository containing only the frozen tree.\n\n    The frozen tree is reconstructed directly in the Git index from its exact\n    modes, blob OIDs, and paths. This deliberately avoids a worktree and\n    ``git add`` so repository ignore rules, filesystem permissions, checkout\n    filters, and clone depth cannot alter the published recovery object graph.\n    """\n    run(["git", "init", "-b", "main", str(target)])\n    blobs = batch_blob_bytes(\n        source, (item["git_blob_oid"] for item in tracked["files"])\n    )\n    for item in tracked["files"]:\n        expected_oid = item["git_blob_oid"]\n        observed_oid = run(\n            ["git", "hash-object", "-w", "--stdin"],\n            cwd=target,\n            input_bytes=blobs[expected_oid],\n        ).decode("ascii").strip()\n        if observed_oid != expected_oid:\n            raise SystemExit(\n                "clean recovery blob identity mismatch: "\n                f"{item['path']}: expected {expected_oid}, observed {observed_oid}"\n            )\n        git_text(\n            target,\n            "update-index",\n            "--add",\n            "--cacheinfo",\n            item["mode"],\n            expected_oid,\n            item["path"],\n        )\n    rebuilt_tree = git_text(target, "write-tree")\n    if rebuilt_tree != tree_oid:\n        raise SystemExit(\n            "clean recovery repository tree mismatch: "\n            f"expected {tree_oid}, observed {rebuilt_tree}"\n        )\n'''
          if old not in text:
              if new in text:
                  print('repair already applied')
              else:
                  raise SystemExit('materialization function did not match expected source')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused and ignored-file regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-ci.txt
          python3 -m pytest \
            tests/test_preservation_capsule.py \
            tests/test_preservation_capsule_index_materialization.py \
            -q

      - name: Build the real repository twice and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "$current" \
            --output-dir "$RUNNER_TEMP/real-a"
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "$current" \
            --output-dir "$RUNNER_TEMP/real-b"
          diff -qr "$RUNNER_TEMP/real-a" "$RUNNER_TEMP/real-b"

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/build_preservation_capsule.py; then
            echo 'Source repair already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_preservation_capsule.py
          git commit -m 'fix: reconstruct frozen tree directly in Git index'
          git push origin HEAD:fix/index-driven-tree-materialization-20260802
