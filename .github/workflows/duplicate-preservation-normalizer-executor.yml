name: Duplicate Preservation Normalizer Executor

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/duplicate-preservation-normalizer-executor.yml
      - scripts/fix_duplicate_preservation_normalizers.py

permissions:
  contents: read

jobs:
  execute-authorized-repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'thechurchofagi' &&
      github.event.pull_request.head.ref == 'agent/fix-duplicate-preservation-normalizers-20260802' &&
      github.event.pull_request.title == 'fix: remove duplicate preservation normalizers'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull-request branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: agent/fix-duplicate-preservation-normalizers-20260802

      - name: Execute repair twice and verify idempotence
        run: |
          set -euo pipefail
          python3 scripts/fix_duplicate_preservation_normalizers.py
          python3 scripts/fix_duplicate_preservation_normalizers.py
          python3 -m py_compile scripts/repository_preservation_refresh.py

      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/repository_preservation_refresh.py
          if git diff --cached --quiet; then
            echo "Duplicate definitions are already removed."
            exit 0
          fi
          git commit -m "fix: remove duplicate preservation normalizers"
          git push origin HEAD:agent/fix-duplicate-preservation-normalizers-20260802
