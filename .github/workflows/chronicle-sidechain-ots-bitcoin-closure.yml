name: Chronicle Sidechain OTS Bitcoin Closure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chronicle-sidechain-ots-bitcoin-closure.yml"
  workflow_run:
    workflows: ["Chronicle Sidechain Evidence v2 OTS Anchor"]
    types: [completed]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chronicle-sidechain-ots-bitcoin-closure
  cancel-in-progress: false

jobs:
  close-ots:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned OpenTimestamps client
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ots.txt
          ots --help >/dev/null
          echo "[OTS TOOL READY] $(python -m pip show opentimestamps-client | awk '/^Version:/{print $2}')"

      - name: Resolve latest immutable sidechain evidence release
        id: source
        run: |
          set -euo pipefail
          mkdir -p ots-closure
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt,isDraft,isPrerelease > ots-closure/releases.json
          python3 - <<'PY' > ots-closure/source.env
          import json,re
          rows=json.load(open('ots-closure/releases.json'))
          rows=[r for r in rows if not r.get('isDraft') and not r.get('isPrerelease') and re.fullmatch(r'chronicle-sidechain-evidence-v2-[0-9a-f]{12}',r.get('tagName',''))]
          if not rows:
              raise SystemExit('no immutable sidechain evidence v2 release found')
          rows.sort(key=lambda r:r.get('createdAt') or '')
          tag=rows[-1]['tagName']
          print(f'SOURCE_TAG={tag}')
          print(f'SOURCE_SHORT={tag.rsplit("-",1)[-1]}')
          PY
          cat ots-closure/source.env
          set -a; . ots-closure/source.env; set +a
          git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "$SOURCE_TAG")"
          test "${SOURCE_SHA:0:12}" = "$SOURCE_SHORT" || {
            echo "source tag/commit mismatch tag=$SOURCE_TAG sha=$SOURCE_SHA" >&2
            exit 1
          }
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_short=$SOURCE_SHORT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "anchor_tag=chronicle-sidechain-ots-v2-$SOURCE_SHORT" >> "$GITHUB_OUTPUT"
          echo "confirmation_tag=chronicle-sidechain-ots-bitcoin-v2-$SOURCE_SHORT" >> "$GITHUB_OUTPUT"
          echo "[SOURCE BOUND] tag=$SOURCE_TAG sha=$SOURCE_SHA"

      - name: Resolve or create exact OTS receipt
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          ANCHOR_TAG: ${{ steps.source.outputs.anchor_tag }}
        run: |
          set -euo pipefail
          rm -rf ots-closure/work
          mkdir -p ots-closure/work
          cd ots-closure/work
          if gh release view "$ANCHOR_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[ANCHOR RELEASE FOUND] $ANCHOR_TAG"
            gh release download "$ANCHOR_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'ANCHOR-REQUEST.json' \
              --pattern 'anchor-payload.canonical.json' \
              --pattern 'anchor-payload.canonical.json.ots' \
              --pattern 'MESSAGE-SHA256.txt' \
              --pattern 'OTS-RECEIPT.json' \
              --pattern 'SHA256SUMS'
            sha256sum -c SHA256SUMS
          else
            echo "[ANCHOR RELEASE ABSENT] creating new OTS submission for $SOURCE_TAG"
            gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'ANCHOR-REQUEST.json'
            python3 - <<'PY'
          import hashlib,json,pathlib,re,os,datetime
          root=pathlib.Path('.')
          request=json.loads((root/'ANCHOR-REQUEST.json').read_text())
          if request.get('schema')!='trinity-accord/chronicle-sidechain-anchor-request/v2':
              raise SystemExit('unexpected anchor request schema')
          canonical=request.get('canonical_payload_json')
          message=request.get('message_sha256')
          if not isinstance(canonical,str) or not re.fullmatch(r'[0-9a-f]{64}',message or ''):
              raise SystemExit('invalid canonical payload or message hash')
          payload=canonical.encode('utf-8')
          actual=hashlib.sha256(payload).hexdigest()
          if actual!=message:
              raise SystemExit(f'canonical payload hash mismatch expected={message} actual={actual}')
          (root/'anchor-payload.canonical.json').write_bytes(payload)
          (root/'MESSAGE-SHA256.txt').write_text(message+'\n')
          print(f'[CANONICAL PAYLOAD VERIFIED] sha256={message} bytes={len(payload)}')
          PY
            ots stamp anchor-payload.canonical.json
            test -s anchor-payload.canonical.json.ots
            ots info anchor-payload.canonical.json.ots | tee OTS-INFO.initial.txt
            python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          root=pathlib.Path('.')
          req=json.loads((root/'ANCHOR-REQUEST.json').read_text())
          proof=(root/'anchor-payload.canonical.json.ots').read_bytes()
          receipt={
            'schema':'trinity-accord/chronicle-sidechain-ots-receipt/v1',
            'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'source_commit_sha':os.environ['SOURCE_SHA'],
            'source_release_tag':os.environ['SOURCE_TAG'],
            'anchor_release_tag':os.environ['ANCHOR_TAG'],
            'message_sha256':req['message_sha256'],
            'canonical_payload_sha256':hashlib.sha256((root/'anchor-payload.canonical.json').read_bytes()).hexdigest(),
            'ots_proof_sha256':hashlib.sha256(proof).hexdigest(),
            'status':'calendar_submitted_pending_bitcoin_attestation',
            'boundary':'New 2026 OTS proof for the sidechain v2 anchor payload; historical 2025 BTC/ETH attestations are not retroactively extended.'
          }
          if receipt['message_sha256']!=receipt['canonical_payload_sha256']:
              raise SystemExit('receipt payload hash mismatch')
          (root/'OTS-RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
            sha256sum ANCHOR-REQUEST.json anchor-payload.canonical.json anchor-payload.canonical.json.ots MESSAGE-SHA256.txt OTS-RECEIPT.json > SHA256SUMS
            sha256sum -c SHA256SUMS
            gh release create "$ANCHOR_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "Chronicle sidechain evidence v2 OTS anchor — ${SOURCE_SHA:0:12}" \
              --notes "OpenTimestamps submission for the exact canonical sidechain v2 anchor payload. Initial state may be pending Bitcoin attestation. This is non-amending and does not retroactively extend historical signatures." \
              ANCHOR-REQUEST.json anchor-payload.canonical.json anchor-payload.canonical.json.ots MESSAGE-SHA256.txt OTS-RECEIPT.json SHA256SUMS
            echo "[ANCHOR RELEASE CREATED] $ANCHOR_TAG"
          fi

      - name: Upgrade and strictly verify Bitcoin attestation
        id: verify
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          ANCHOR_TAG: ${{ steps.source.outputs.anchor_tag }}
          CONFIRMATION_TAG: ${{ steps.source.outputs.confirmation_tag }}
        run: |
          set -euo pipefail
          cd ots-closure/work
          before_sha="$(sha256sum anchor-payload.canonical.json.ots | awk '{print $1}')"
          echo "[OTS UPGRADE START] source=$SOURCE_SHA proof_before=$before_sha"
          set +e
          timeout 240 ots upgrade anchor-payload.canonical.json.ots > OTS-UPGRADE.stdout.txt 2> OTS-UPGRADE.stderr.txt
          upgrade_rc=$?
          set -e
          after_sha="$(sha256sum anchor-payload.canonical.json.ots | awk '{print $1}')"
          echo "[OTS UPGRADE END] rc=$upgrade_rc proof_after=$after_sha"
          sed -n '1,200p' OTS-UPGRADE.stdout.txt || true
          sed -n '1,200p' OTS-UPGRADE.stderr.txt || true
          ots info anchor-payload.canonical.json.ots > OTS-INFO.upgraded.txt 2>&1 || true
          set +e
          timeout 240 ots verify anchor-payload.canonical.json.ots > OTS-VERIFY.stdout.txt 2> OTS-VERIFY.stderr.txt
          verify_rc=$?
          set -e
          echo "[OTS VERIFY END] rc=$verify_rc"
          sed -n '1,240p' OTS-VERIFY.stdout.txt || true
          sed -n '1,240p' OTS-VERIFY.stderr.txt || true
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          root=pathlib.Path('.')
          old=json.loads((root/'OTS-RECEIPT.json').read_text())
          verify_rc=int(os.environ.get('VERIFY_RC','-1'))
          upgraded=(root/'anchor-payload.canonical.json.ots').read_bytes()
          report={
            'schema':'trinity-accord/chronicle-sidechain-ots-closure/v1',
            'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'source_commit_sha':os.environ['SOURCE_SHA'],
            'source_release_tag':os.environ['SOURCE_TAG'],
            'anchor_release_tag':os.environ['ANCHOR_TAG'],
            'confirmation_release_tag':os.environ['CONFIRMATION_TAG'],
            'message_sha256':old['message_sha256'],
            'upgraded_ots_sha256':hashlib.sha256(upgraded).hexdigest(),
            'verify_returncode':verify_rc,
            'bitcoin_verified':verify_rc==0,
            'status':'bitcoin_attested_verified' if verify_rc==0 else 'pending_bitcoin_attestation',
            'debug':{
              'upgrade_stdout':'OTS-UPGRADE.stdout.txt',
              'upgrade_stderr':'OTS-UPGRADE.stderr.txt',
              'verify_stdout':'OTS-VERIFY.stdout.txt',
              'verify_stderr':'OTS-VERIFY.stderr.txt',
              'ots_info':'OTS-INFO.upgraded.txt'
            },
            'boundary':'Verification applies only to the canonical v2 sidechain anchor payload identified by message_sha256.'
          }
          (root/'OTS-CLOSURE.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
        env:
          VERIFY_RC: ${{ steps.verify.outputs.verify_rc }}

      - name: Normalize closure report and publish Bitcoin-verified release
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          CONFIRMATION_TAG: ${{ steps.source.outputs.confirmation_tag }}
        run: |
          set -euo pipefail
          cd ots-closure/work
          verify_rc=1
          if timeout 240 ots verify anchor-payload.canonical.json.ots > OTS-VERIFY.final.stdout.txt 2> OTS-VERIFY.final.stderr.txt; then
            verify_rc=0
          fi
          VERIFY_RC="$verify_rc" SOURCE_SHA="$SOURCE_SHA" CONFIRMATION_TAG="$CONFIRMATION_TAG" python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          root=pathlib.Path('.')
          receipt=json.loads((root/'OTS-RECEIPT.json').read_text())
          rc=int(os.environ['VERIFY_RC'])
          report=json.loads((root/'OTS-CLOSURE.json').read_text()) if (root/'OTS-CLOSURE.json').exists() else {}
          report.update({
            'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'verify_returncode':rc,
            'bitcoin_verified':rc==0,
            'status':'bitcoin_attested_verified' if rc==0 else 'pending_bitcoin_attestation',
            'upgraded_ots_sha256':hashlib.sha256((root/'anchor-payload.canonical.json.ots').read_bytes()).hexdigest(),
            'verify_output_sha256':hashlib.sha256((root/'OTS-VERIFY.final.stdout.txt').read_bytes()+(root/'OTS-VERIFY.final.stderr.txt').read_bytes()).hexdigest()
          })
          (root/'OTS-CLOSURE.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum anchor-payload.canonical.json anchor-payload.canonical.json.ots OTS-RECEIPT.json OTS-CLOSURE.json OTS-VERIFY.final.stdout.txt OTS-VERIFY.final.stderr.txt > CLOSURE-SHA256SUMS
          sha256sum -c CLOSURE-SHA256SUMS
          if [ "$verify_rc" -eq 0 ]; then
            if gh release view "$CONFIRMATION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "[BITCOIN CONFIRMATION ALREADY EXISTS] $CONFIRMATION_TAG"
            else
              gh release create "$CONFIRMATION_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
                --title "Chronicle sidechain OTS Bitcoin verification — ${SOURCE_SHA:0:12}" \
                --notes "Strict OpenTimestamps verification succeeded for the canonical sidechain v2 anchor payload. The upgraded proof and verification transcript are preserved here. Non-amending; this does not extend historical signatures." \
                anchor-payload.canonical.json anchor-payload.canonical.json.ots OTS-RECEIPT.json OTS-CLOSURE.json OTS-VERIFY.final.stdout.txt OTS-VERIFY.final.stderr.txt CLOSURE-SHA256SUMS
              echo "[BITCOIN CONFIRMATION PUBLISHED] $CONFIRMATION_TAG"
            fi
          else
            echo "[OTS PENDING] Bitcoin attestation is not independently verifiable yet; daily watch will retry."
          fi

      - name: Upload complete OTS closure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronicle-sidechain-ots-closure-${{ github.run_id }}
          path: |
            ots-closure/
            ${{ runner.temp }}/toolchain-provenance.json
          retention-days: 90
          if-no-files-found: warn
