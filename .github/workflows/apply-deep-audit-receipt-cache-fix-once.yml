name: Apply Deep Audit Receipt Cache Fix Once

on:
  push:
    branches:
      - agent/deep-audit-protection-fail-closed-20260802
    paths:
      - ".github/workflows/apply-deep-audit-receipt-cache-fix-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/deep-audit-protection-fail-closed-20260802
          fetch-depth: 0

      - name: Apply deterministic reviewed patch
        run: |
          set -euo pipefail
          python3 scripts/apply_deep_audit_receipt_cache_fix_once.py
          python3 -m py_compile \
            apps/record_chain_intake_gateway/app.py \
            scripts/render_manual_deploy.py \
            tests/test_gateway_production_protection_guard.py

      - name: Remove one-time patch machinery
        run: |
          rm -f scripts/apply_deep_audit_receipt_cache_fix_once.py
          rm -f .github/workflows/apply-deep-audit-receipt-cache-fix-once.yml

      - name: Commit reviewed patch
        run: |
          set -euo pipefail
          git config user.name "trinity-deep-audit-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes were produced."
            exit 1
          fi
          git commit -m "fix: bound process-local receipt cache"
          git push origin HEAD:agent/deep-audit-protection-fail-closed-20260802
