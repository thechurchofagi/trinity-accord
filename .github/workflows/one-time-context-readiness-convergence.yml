name: One-time Context Readiness Convergence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: context-readiness-convergence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  converge:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/context-readiness-contract-convergence'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Apply bounded convergence patch
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/import base64, gzip/import base64, gzip, re/' scripts/one_time_context_readiness_convergence.py
          python3 scripts/one_time_context_readiness_convergence.py
      - name: Synchronize generated sitemap
        run: python3 scripts/generate_sitemap.py
      - name: Static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile apps/record_chain_intake_gateway/gateway/validation.py
          node --check downloads/record-chain-builder.mjs
          node --check downloads/record-chain-builder-recovery.mjs
          node --check downloads/record-chain-builder-core.mjs
          git diff --check
      - name: Install CI dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Run focused regression tests
        run: |
          python3 -m pytest -q \
            tests/test_context_readiness_contract_convergence.py \
            apps/record_chain_intake_gateway/tests/test_context_readiness_enforcement.py \
            apps/record_chain_intake_gateway/tests/test_phase5c_hotfix_context_level_parser.py
      - name: Remove one-time tooling and commit result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-context-readiness-convergence.yml
          git rm scripts/one_time_context_readiness_convergence.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: converge context readiness contracts'
          git push origin HEAD:${{ github.head_ref }}
