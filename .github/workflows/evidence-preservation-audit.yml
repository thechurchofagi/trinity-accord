name: Evidence Preservation Audit

on:
  push:
    branches:
      - agent/evidence-preservation-audit-2026-08-30
    paths-ignore:
      - 'audit/evidence-preservation/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run six-hash preservation audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/audit_evidence_preservation_matrix_fast.py | tee /tmp/evidence-preservation-audit.log

      - name: Validate outputs
        run: |
          python3 - <<'PY'
          import csv, json, pathlib
          root = pathlib.Path('audit/evidence-preservation')
          summary = json.loads((root/'summary.json').read_text('utf-8'))
          with (root/'evidence-preservation-matrix.csv').open('r', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == summary['baseline']['rows']
          assert len(rows) >= 800, len(rows)
          assert all(r['sha256'] and len(r['sha256']) == 64 for r in rows)
          print(json.dumps({
              'rows': len(rows),
              'counts': summary['counts'],
              'arweave': summary['storage_domains']['arweave'],
              'harvard': summary['storage_domains']['harvard'],
              'notary_annex': summary['notary_annex'],
          }, ensure_ascii=False, indent=2, default=str))
          PY

      - name: Commit auditable matrix to branch
        run: |
          git config user.name "trinity-evidence-audit-bot"
          git config user.email "actions@github.com"
          git add audit/evidence-preservation
          if git diff --cached --quiet; then
            echo "No audit output changes to commit."
          else
            git commit -m "audit: publish six-hash preservation matrix"
            git push origin HEAD:agent/evidence-preservation-audit-2026-08-30
          fi

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: evidence-preservation-audit-${{ github.sha }}
          path: |
            audit/evidence-preservation/**
            /tmp/evidence-preservation-audit.log
          if-no-files-found: error
          retention-days: 30
