name: Cancel Stale Bitcoin Checkpoint Rerun

on:
  push:
    paths:
      - '.github/workflows/cancel-stale-bitcoin-rerun.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stale run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/33368399155/cancel" || true
