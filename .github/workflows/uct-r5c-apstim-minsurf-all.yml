name: UCT R5C recover minimal historical FreeSurfer assets

on:
  push:
    branches:
      - ops/uct-r5c-apstim-minsurf-all-20260928

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        patient: ["1","3","10","11","12","13","14","17","18","20","23","26"]
    steps:
      - name: Install remotezip
        run: python -m pip install remotezip
      - name: Extract minimal FreeSurfer assets with HTTP range
        env:
          P: ${{ matrix.patient }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          from remotezip import RemoteZip
          P=os.environ["P"]
          url=f"http://epi.fizica.unibuc.ro/apstim/Patient{P}.zip"
          wanted=[
            "FreeSurfer/surf/lh.pial",
            "FreeSurfer/surf/rh.pial",
            "FreeSurfer/surf/lh.sphere.reg",
            "FreeSurfer/surf/rh.sphere.reg",
            "FreeSurfer/mri/orig/001.mgh",
          ]
          manifest=[]
          with RemoteZip(url) as z:
              names=z.namelist()
              for suf in wanted:
                  hits=[n for n in names if n.endswith(suf)]
                  if len(hits)!=1:
                      raise RuntimeError(f"Patient{P} {suf}: {hits}")
                  n=hits[0]
                  data=z.read(n)
                  rel=Path(suf)
                  dest=Path("out")/f"Patient{P}"/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
                  manifest.append({
                    "patient_folder":f"Patient{P}",
                    "source_zip":url,
                    "member":n,
                    "relative_path":str(rel),
                    "bytes":len(data),
                    "sha256":hashlib.sha256(data).hexdigest()
                  })
          Path("out/manifest.json").write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload minimal surface asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uct-r5c-Patient${{ matrix.patient }}-minsurf
          path: out/
          retention-days: 7
          compression-level: 6
