name: Preservation Runtime Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/preservation-runtime-diagnostics-trigger-v1

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: preservation-runtime-diagnostics-v1
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Actionlint preservation workflows
        shell: bash
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/preservation-actionlint.txt"
          set +e
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            .github/workflows/full-project-preservation-bundle.yml \
            .github/workflows/publish-full-project-preservation-to-harvard.yml \
            >"$OUT" 2>&1
          rc=$?
          set -e
          echo "actionlint_exit_code=$rc"
          cat "$OUT"

      - name: Read Actions runtime state and publish machine diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SOURCE_SHA: 07cd79ba7b98294a0ff9bc45d76f305609f8a0aa
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, json, os, re, urllib.error, urllib.parse, urllib.request, zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; target_sha=os.environ['TARGET_SOURCE_SHA']
          api='https://api.github.com'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'trinity-accord-preservation-diagnostics/1.4'}

          def request(url, method='GET', body=None):
              data=None if body is None else json.dumps(body).encode(); h=dict(headers)
              if body is not None: h['Content-Type']='application/json'
              req=urllib.request.Request(url,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(req,timeout=120) as r: return r.status,r.read()
              except urllib.error.HTTPError as e: return e.code,e.read()

          def get_json(url):
              status,raw=request(url)
              if status!=200: raise SystemExit(f'GET failed HTTP={status} url={url} body={raw[:1000]!r}')
              return json.loads(raw)

          def read_logs(run_id):
              status,raw=request(f'{api}/repos/{repo}/actions/runs/{run_id}/logs')
              if status!=200: return False,status,''
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                      text='\n'.join(zf.read(n).decode('utf-8',errors='replace') for n in zf.namelist() if not n.endswith('/'))
                  return True,status,text
              except zipfile.BadZipFile: return False,status,''

          def extract(text):
              out={'build_pass':'[observer] BUILD PASS' in text,'harvard_complete':'HARVARD PRESERVATION COMPLETE' in text}
              scalar={'persistent_id':r'(?:persistent_id=|HARVARD PRESERVATION COMPLETE persistent_id=)([^\s]+)','artifact_bytes':r'artifact_bytes=(\d+)','artifact_sha256':r'artifact_sha256=([0-9a-f]{64})','bundle_identity_sha256':r'bundle_identity_sha256=([0-9a-f]{64})','release_count':r'release_count=(\d+)','release_asset_count':r'release_asset_count=(\d+)','unique_object_count':r'unique_object_count=(\d+)','unique_object_bytes':r'unique_object_bytes=(\d+)','logical_bytes_before_sha256_deduplication':r'logical_bytes_before_sha256_deduplication=(\d+)'}
              for key,pat in scalar.items():
                  ms=list(re.finditer(pat,text))
                  if ms:
                      v=ms[-1].group(1); out[key]=int(v) if key.endswith('_count') or key.endswith('_bytes') or key=='logical_bytes_before_sha256_deduplication' else v
              ms=list(re.finditer(r'PUBLIC BYTE READBACK PASS bytes=(\d+) sha256=([0-9a-f]{64})',text))
              if ms:
                  m=ms[-1]; out.update(public_readback_verified=True,public_readback_bytes=int(m.group(1)),public_readback_sha256=m.group(2))
              fails=[ln[-1200:] for ln in text.splitlines() if '[harvard-preservation] FAIL ' in ln or '[observer] BUILD FAILED' in ln]
              if fails: out['failure_lines']=fails[-5:]
              return out

          def summarize_run(r):
              return {k:r.get(k) for k in ('id','name','event','status','conclusion','head_sha','created_at','updated_at','html_url','check_suite_id')}

          workflows={'bundle':'full-project-preservation-bundle.yml','harvard':'publish-full-project-preservation-to-harvard.yml'}
          lint_path=Path(os.environ['RUNNER_TEMP'])/'preservation-actionlint.txt'
          result={'schema':'trinity-accord/preservation-runtime-status/v5','generated_at':datetime.now(timezone.utc).isoformat(),'repository':repo,'target_source_sha':target_sha,'actionlint_output':lint_path.read_text(errors='replace')[-12000:] if lint_path.exists() else 'actionlint output missing','workflows':{}}
          for key,wf in workflows.items():
              runs=get_json(f'{api}/repos/{repo}/actions/workflows/{urllib.parse.quote(wf)}/runs?branch=main&per_page=20').get('workflow_runs',[])
              target=next((r for r in runs if r.get('head_sha')==target_sha),None)
              workflow_run_event=next((r for r in runs if r.get('event')=='workflow_run' and r.get('head_sha')==target_sha),None)
              if key=='harvard' and workflow_run_event is not None:
                  target=workflow_run_event
              entry={'workflow_file':wf,'found':bool(runs),'recent_runs':[summarize_run(r) for r in runs],'workflow_run_event_found':workflow_run_event is not None,'target_found':target is not None}
              if target:
                  rid=int(target['id']); jobs=get_json(f'{api}/repos/{repo}/actions/runs/{rid}/jobs?per_page=100').get('jobs',[]); logs_ok,logs_status,text=read_logs(rid)
                  entry.update(target_run=summarize_run(target),jobs=[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion')} for j in jobs],logs_available=logs_ok,logs_http_status=logs_status)
                  entry.update(extract(text))
              result['workflows'][key]=entry

          path='api/preservation-runtime-status.json'; url=f'{api}/repos/{repo}/contents/{path}'
          status,raw=request(url); sha=None
          if status==200: sha=json.loads(raw)['sha']
          elif status!=404: raise SystemExit(f'status lookup HTTP={status}')
          payload={'message':'ops: publish preservation runtime diagnostics','content':base64.b64encode((json.dumps(result,ensure_ascii=False,indent=2)+'\n').encode()).decode(),'branch':'main'}
          if sha: payload['sha']=sha
          status,raw=request(url,'PUT',payload)
          if status not in (200,201): raise SystemExit(f'status write HTTP={status} body={raw[:1500]!r}')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
