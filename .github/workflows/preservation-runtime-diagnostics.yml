name: Preservation Runtime Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/preservation-runtime-diagnostics-trigger-v1

permissions:
  actions: read
  contents: write

concurrency:
  group: preservation-runtime-diagnostics-v1
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read Actions runtime state and publish machine diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, json, os, re, urllib.error, urllib.parse, urllib.request, zipfile
          from datetime import datetime, timezone

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          api='https://api.github.com'
          headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'trinity-accord-preservation-diagnostics/1.0',
          }

          def request(url, method='GET', body=None):
              data=None if body is None else json.dumps(body).encode()
              h=dict(headers)
              if body is not None:
                  h['Content-Type']='application/json'
              req=urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return r.status, r.read(), dict(r.headers)
              except urllib.error.HTTPError as e:
                  return e.code, e.read(), dict(e.headers)

          def get_json(url):
              status, raw, _ = request(url)
              if status != 200:
                  raise SystemExit(f'GET failed HTTP={status} url={url} body={raw[:1000]!r}')
              return json.loads(raw)

          def read_logs(run_id):
              status, raw, _ = request(f'{api}/repos/{repo}/actions/runs/{run_id}/logs')
              if status != 200:
                  return {'available': False, 'http_status': status, 'text': ''}
              try:
                  with zipfile.ZipFile(io.BytesIO(raw)) as zf:
                      parts=[]
                      for name in zf.namelist():
                          if not name.endswith('/'):
                              parts.append(zf.read(name).decode('utf-8', errors='replace'))
                  return {'available': True, 'http_status': status, 'text': '\n'.join(parts)}
              except zipfile.BadZipFile:
                  return {'available': False, 'http_status': status, 'text': ''}

          def extract(text):
              patterns={
                  'persistent_id': r'(?:persistent_id=|HARVARD PRESERVATION COMPLETE persistent_id=)([^\s]+)',
                  'artifact_bytes': r'artifact_bytes=(\d+)',
                  'artifact_sha256': r'artifact_sha256=([0-9a-f]{64})',
                  'bundle_identity_sha256': r'bundle_identity_sha256=([0-9a-f]{64})',
                  'release_count': r'release_count=(\d+)',
                  'release_asset_count': r'release_asset_count=(\d+)',
                  'unique_object_count': r'unique_object_count=(\d+)',
                  'unique_object_bytes': r'unique_object_bytes=(\d+)',
                  'logical_bytes_before_sha256_deduplication': r'logical_bytes_before_sha256_deduplication=(\d+)',
                  'public_readback': r'PUBLIC BYTE READBACK PASS bytes=(\d+) sha256=([0-9a-f]{64})',
              }
              out={}
              for key, pat in patterns.items():
                  matches=list(re.finditer(pat, text))
                  if not matches:
                      continue
                  m=matches[-1]
                  if key == 'public_readback':
                      out['public_readback_verified']=True
                      out['public_readback_bytes']=int(m.group(1))
                      out['public_readback_sha256']=m.group(2)
                  elif key.endswith('_count') or key.endswith('_bytes') or key=='logical_bytes_before_sha256_deduplication':
                      out[key]=int(m.group(1))
                  else:
                      out[key]=m.group(1)
              fail=[line[-1000:] for line in text.splitlines() if '[harvard-preservation] FAIL ' in line or '[observer] BUILD FAILED' in line]
              if fail:
                  out['failure_lines']=fail[-5:]
              out['build_pass']='[observer] BUILD PASS' in text
              out['harvard_complete']='HARVARD PRESERVATION COMPLETE' in text
              return out

          workflows={
              'bundle': 'full-project-preservation-bundle.yml',
              'harvard': 'publish-full-project-preservation-to-harvard.yml',
          }
          result={
              'schema':'trinity-accord/preservation-runtime-status/v1',
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'repository':repo,
              'workflows':{},
          }
          for key, wf in workflows.items():
              url=f'{api}/repos/{repo}/actions/workflows/{urllib.parse.quote(wf)}/runs?branch=main&per_page=20'
              runs=get_json(url).get('workflow_runs',[])
              if not runs:
                  result['workflows'][key]={'workflow_file':wf,'found':False}
                  continue
              run=runs[0]
              rid=int(run['id'])
              jobs=get_json(f'{api}/repos/{repo}/actions/runs/{rid}/jobs?per_page=100').get('jobs',[])
              log=read_logs(rid)
              entry={
                  'workflow_file':wf,
                  'found':True,
                  'run_id':rid,
                  'name':run.get('name'),
                  'event':run.get('event'),
                  'status':run.get('status'),
                  'conclusion':run.get('conclusion'),
                  'head_sha':run.get('head_sha'),
                  'created_at':run.get('created_at'),
                  'updated_at':run.get('updated_at'),
                  'html_url':run.get('html_url'),
                  'jobs':[{
                      'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),
                      'conclusion':j.get('conclusion'),'started_at':j.get('started_at'),'completed_at':j.get('completed_at')
                  } for j in jobs],
                  'logs_available':log['available'],
                  'logs_http_status':log['http_status'],
              }
              entry.update(extract(log['text']))
              result['workflows'][key]=entry

          path='api/preservation-runtime-status.json'
          target=f'{api}/repos/{repo}/contents/{path}'
          status, raw, _ = request(target)
          sha=None
          if status == 200:
              sha=json.loads(raw)['sha']
          elif status != 404:
              raise SystemExit(f'status-file lookup failed HTTP={status}')
          content=(json.dumps(result, ensure_ascii=False, indent=2)+'\n').encode()
          body={
              'message':'ops: publish preservation runtime diagnostics',
              'content':base64.b64encode(content).decode(),
              'branch':'main',
          }
          if sha:
              body['sha']=sha
          put_status, put_raw, _ = request(target, method='PUT', body=body)
          if put_status not in (200,201):
              raise SystemExit(f'status-file write failed HTTP={put_status} body={put_raw[:1500]!r}')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
