name: Chronicle Polygon Ethereum Settlement Proof

on:
  push:
    branches: [main]
    paths:
      - "scripts/capture-chronicle-polygon-ethereum-settlement.py"
      - "scripts/test_chronicle_polygon_ethereum_settlement.py"
      - "scripts/ci_observe.py"
      - ".github/workflows/chronicle-polygon-ethereum-settlement.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: chronicle-polygon-ethereum-settlement
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ETH_RPC_URL: ${{ secrets.ETHEREUMMAINNET }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
      CHRONICLE_ETH_RPC_FALLBACK_URLS: "https://ethereum-rpc.publicnode.com,https://eth.drpc.org"
      CHRONICLE_POLYGON_RPC_FALLBACK_URLS: "https://polygon-bor-rpc.publicnode.com,https://polygon.drpc.org"
      CHRONICLE_SETTLEMENT_HTTP_TIMEOUT_SECONDS: "45"
      CHRONICLE_SETTLEMENT_HTTP_RETRIES: "2"
      CHRONICLE_STATUS_CONTEXT: "trinity/settlement"
      CHRONICLE_OBSERVABILITY_HEARTBEAT_SECONDS: "120"
      CHRONICLE_OBSERVABILITY_STALL_WARN_SECONDS: "600"

    steps:
      - name: Checkout proof implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Initialize observable run
        run: |
          set -euo pipefail
          mkdir -p artifacts/chronicle-polygon-ethereum-settlement
          python3 scripts/ci_observe.py status \
            --state pending \
            --stage "01-init" \
            --message "run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} sha=${GITHUB_SHA:0:12}"
          {
            echo "## Polygon → Ethereum settlement proof"
            echo ""
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Status context: \`trinity/settlement\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/ci_observe.py status --state pending --stage "02-toolchain" --message "recording toolchain provenance"
          python3 scripts/toolchain_provenance.py | tee artifacts/chronicle-polygon-ethereum-settlement/TOOLCHAIN-PROVENANCE.json
          python3 scripts/ci_observe.py status --state pending --stage "02-toolchain" --message "toolchain provenance recorded"

      - name: Bind implementation to event source
        run: |
          set -euo pipefail
          python3 scripts/ci_observe.py status --state pending --stage "03-bind" --message "binding checkout to event SHA"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "[IMPLEMENTATION BOUND] sha=$actual"
          python3 scripts/ci_observe.py status --state pending --stage "03-bind" --message "bound sha=${actual:0:12}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install proof dependencies
        run: |
          set -euo pipefail
          python3 scripts/ci_observe.py status --state pending --stage "04-deps" --message "installing dependencies and running unit tests"
          python3 -m pip install -r requirements-ci.txt
          python3 scripts/test_chronicle_polygon_ethereum_settlement.py
          python3 -m py_compile scripts/capture-chronicle-polygon-ethereum-settlement.py scripts/ci_observe.py
          python3 scripts/ci_observe.py status --state pending --stage "04-deps" --message "dependencies/tests passed"

      - name: Resolve latest immutable sidechain evidence release
        id: source
        run: |
          set -euo pipefail
          python3 scripts/ci_observe.py status --state pending --stage "05-source" --message "resolving immutable sidechain release"
          mkdir -p "$RUNNER_TEMP/sidechain-source"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt,isDraft,isPrerelease > "$RUNNER_TEMP/sidechain-source/releases.json"
          python3 - <<'PY' > "$RUNNER_TEMP/sidechain-source/source.env"
          import json,re,os
          p=os.environ['RUNNER_TEMP']+'/sidechain-source/releases.json'
          rows=json.load(open(p))
          rows=[r for r in rows if not r.get('isDraft') and not r.get('isPrerelease') and re.fullmatch(r'chronicle-sidechain-evidence-v2-[0-9a-f]{12}',r.get('tagName',''))]
          if not rows: raise SystemExit('no immutable sidechain evidence release')
          rows.sort(key=lambda r:r.get('createdAt') or '')
          tag=rows[-1]['tagName']; short=tag.rsplit('-',1)[-1]
          print(f'SOURCE_TAG={tag}'); print(f'SOURCE_SHORT={short}')
          PY
          set -a
          . "$RUNNER_TEMP/sidechain-source/source.env"
          set +a
          git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "$SOURCE_TAG")"
          test "${SOURCE_SHA:0:12}" = "$SOURCE_SHORT"
          archive="chronicle-sidechain-evidence-v2-${SOURCE_SHORT}.tar.gz"
          echo "[SOURCE] tag=$SOURCE_TAG sha=$SOURCE_SHA archive=$archive"
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/sidechain-source" --pattern "$archive" --pattern "$archive.sha256"
          cd "$RUNNER_TEMP/sidechain-source"
          sha256sum -c "$archive.sha256"
          mkdir extracted
          tar -xzf "$archive" -C extracted
          test -s extracted/chronicle-sidechain-scan/evidence-v2/SIDECHAIN-NFT-IDENTITY-INDEX.json
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_short=$SOURCE_SHORT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "[SOURCE VERIFIED] tag=$SOURCE_TAG sha=$SOURCE_SHA archive=$archive"
          cd "$GITHUB_WORKSPACE"
          python3 scripts/ci_observe.py status --state pending --stage "05-source" --message "verified tag=${SOURCE_TAG} sha=${SOURCE_SHA:0:12}"

      - name: Re-run source sidechain offline verification after cold extraction
        env:
          CHRONICLE_OUT: ${{ runner.temp }}/sidechain-source/extracted/chronicle-sidechain-scan
        run: |
          set -euo pipefail
          python3 scripts/ci_observe.py run \
            --stage "06-cold-verify" \
            --heartbeat-seconds 120 \
            -- python3 scripts/verify-chronicle-sidechain-evidence.py
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['CHRONICLE_OUT'])/'evidence-v2'/'OFFLINE-VERIFICATION.json'
          r=json.loads(p.read_text())
          if not r.get('pass'): raise SystemExit('cold-extracted source offline verification failed')
          print(f"[SOURCE OFFLINE PASS] records={r.get('records')} cars={r.get('car_files_checked')} l2={r.get('l2_records_checked')}")
          PY
          python3 scripts/ci_observe.py status --state pending --stage "06-cold-verify" --message "source offline verification passed"

      - name: Capture Polygon to Ethereum checkpoint proofs
        env:
          CHRONICLE_SOURCE_DIR: ${{ runner.temp }}/sidechain-source/extracted/chronicle-sidechain-scan
          CHRONICLE_POLYGON_ETH_OUT: artifacts/chronicle-polygon-ethereum-settlement
        run: |
          set -euo pipefail
          python3 scripts/ci_observe.py run \
            --stage "07-settlement-proof" \
            --debug-file artifacts/chronicle-polygon-ethereum-settlement/DEBUG.jsonl \
            --heartbeat-seconds 120 \
            --stall-warn-seconds 600 \
            -- python3 scripts/capture-chronicle-polygon-ethereum-settlement.py
          python3 - <<'PY'
          import json
          r=json.load(open('artifacts/chronicle-polygon-ethereum-settlement/POLYGON-ETHEREUM-SETTLEMENT.json'))
          if not r.get('pass'): raise SystemExit('settlement report did not pass')
          if not r.get('polygon_block_membership_pass'): raise SystemExit('Polygon checkpoint membership incomplete')
          if not r.get('ethereum_checkpoint_receipt_inclusion_pass'): raise SystemExit('Ethereum receipt inclusion incomplete')
          print(f"[SETTLEMENT PASS] records={r['polygon_records']} blocks={r['unique_polygon_blocks']} checkpoints={r['unique_checkpoints']}")
          PY
          python3 scripts/ci_observe.py status --state pending --stage "07-settlement-proof" --message "full proof passed"

      - name: Build immutable supplementary archive
        id: package
        env:
          SOURCE_SHORT: ${{ steps.source.outputs.source_short }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
        run: |
          set -euo pipefail
          python3 scripts/ci_observe.py status --state pending --stage "08-package" --message "building immutable supplementary archive"
          root=artifacts/chronicle-polygon-ethereum-settlement
          python3 - <<'PY'
          import datetime,json,os,pathlib
          root=pathlib.Path('artifacts/chronicle-polygon-ethereum-settlement')
          receipt={
            'schema':'trinity-accord/chronicle-polygon-ethereum-settlement-release/v1',
            'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'source_sidechain_release_tag':os.environ['SOURCE_TAG'],
            'source_sidechain_commit_sha':os.environ['SOURCE_SHA'],
            'proof_implementation_commit_sha':os.environ['GITHUB_SHA'],
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'workflow_run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'boundary':'Supplementary non-amending proof. It does not rewrite the immutable source sidechain release.'
          }
          (root/'SOURCE-BINDING.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          archive="chronicle-polygon-ethereum-settlement-v1-${SOURCE_SHORT}.tar.gz"
          tar -C artifacts -czf "$archive" chronicle-polygon-ethereum-settlement
          sha256sum "$archive" > "$archive.sha256"
          tag="chronicle-polygon-ethereum-settlement-v1-${SOURCE_SHORT}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "[PACKAGE READY] tag=$tag archive=$archive sha256=$(awk '{print $1}' "$archive.sha256")"
          python3 scripts/ci_observe.py status --state pending --stage "08-package" --message "package ready tag=${tag}"

      - name: Publish or verify immutable Polygon Ethereum settlement release
        env:
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_observe.py status --state pending --stage "09-release" --message "publishing or verifying immutable release"
          root=artifacts/chronicle-polygon-ethereum-settlement
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[RELEASE EXISTS] $TAG; immutable assets will not be mutated."
            verify_dir="$RUNNER_TEMP/settlement-existing-release"
            mkdir -p "$verify_dir"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir" \
              --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256" \
              --pattern "POLYGON-ETHEREUM-SETTLEMENT.json" \
              --pattern "SUMMARY.json" \
              --pattern "MANIFEST.sha256.json" \
              --pattern "MANIFEST.sha256" \
              --pattern "SOURCE-BINDING.json"
            (
              cd "$verify_dir"
              sha256sum -c "$ARCHIVE.sha256"
            )
            VERIFY_DIR="$verify_dir" python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['VERIFY_DIR'])
          report=json.loads((root/'POLYGON-ETHEREUM-SETTLEMENT.json').read_text())
          binding=json.loads((root/'SOURCE-BINDING.json').read_text())
          expected=os.environ['SOURCE_SHA']
          if report.get('pass') is not True:
              raise SystemExit('existing immutable settlement release report is not PASS')
          if report.get('polygon_block_membership_pass') is not True:
              raise SystemExit('existing release Polygon membership is not PASS')
          if report.get('ethereum_checkpoint_receipt_inclusion_pass') is not True:
              raise SystemExit('existing release Ethereum receipt inclusion is not PASS')
          if binding.get('source_sidechain_commit_sha') != expected:
              raise SystemExit(f"existing release source SHA mismatch expected={expected} actual={binding.get('source_sidechain_commit_sha')}")
          print(f"[EXISTING RELEASE VERIFIED] source_sha={expected}")
          PY
            python3 scripts/ci_observe.py status --state success --stage "09-release" --message "existing immutable release verified tag=${TAG}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "Chronicle Polygon → Ethereum settlement proof — ${SOURCE_SHA:0:12}" \
              --notes "Supplementary non-amending proof that locally verifies Polygon Bor origin block hashes into Ethereum RootChain checkpoint roots and locally verifies the corresponding NewHeaderBlock receipts into Ethereum execution block receiptsRoots. The Ethereum finalized tag is recorded only as an RPC boundary; independent Beacon ancestry is a separate layer." \
              "$ARCHIVE" "$ARCHIVE.sha256" \
              "$root/POLYGON-ETHEREUM-SETTLEMENT.json" "$root/SUMMARY.json" \
              "$root/MANIFEST.sha256.json" "$root/MANIFEST.sha256" "$root/SOURCE-BINDING.json" \
              "$root/WORKFLOW-OBSERVABILITY.jsonl" "$root/CURRENT-STAGE.json"
            echo "[RELEASE PUBLISHED] $TAG"
            python3 scripts/ci_observe.py status --state success --stage "09-release" --message "published tag=${TAG}"
          fi

      - name: Finalize observable run status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success
            message="workflow complete run=${GITHUB_RUN_ID}"
          elif [[ "$JOB_STATUS" == "cancelled" ]]; then
            state=error
            message="workflow cancelled run=${GITHUB_RUN_ID}"
          else
            state=failure
            message="workflow failed run=${GITHUB_RUN_ID}; inspect previous stage"
          fi
          python3 scripts/ci_observe.py status --state "$state" --stage "10-final" --message "$message"
          {
            echo "- Final job status: **${JOB_STATUS}**"
            echo "- Finished: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [[ -f artifacts/chronicle-polygon-ethereum-settlement/CURRENT-STAGE.json ]]; then
              echo ""
              echo "### Last observable state"
              echo '```json'
              cat artifacts/chronicle-polygon-ethereum-settlement/CURRENT-STAGE.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete settlement diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronicle-polygon-ethereum-settlement-${{ github.run_id }}
          path: artifacts/chronicle-polygon-ethereum-settlement/
          retention-days: 90
          if-no-files-found: warn
