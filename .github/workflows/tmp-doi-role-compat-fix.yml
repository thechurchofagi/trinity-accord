name: Temporary DOI role compatibility fix

on:
  push:
    branches:
      - agent/full-project-preservation-staging-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-project-preservation-staging-v1
          fetch-depth: 1
      - name: Apply DOI role compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('.')

          def sub1(path: str, pattern: str, replacement: str) -> None:
              p = root / path
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.M | re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {count}')
              p.write_text(updated, encoding='utf-8')

          sub1(
              'scripts/current_baseline_publication_v2.py',
              r'^                    elif sequence4_status == "consumed":\n.*?(?=^                    else:\n)',
              '''                    elif sequence4_status == "consumed":
                        # Sequence 4 is an immutable evidence checkpoint. Later
                        # repository refreshes may advance latest_* without
                        # changing sequence-4 history.
                        require_equal(state.get("publication_status"), "published_and_publicly_restored", "sequence4 state")
                        versions_by_doi = {
                            item.get("doi"): item
                            for item in state.get("versions", [])
                            if isinstance(item, dict)
                        }
                        checkpoint = versions_by_doi.get(sequence4.get("published_doi"))
                        if not isinstance(checkpoint, dict):
                            raise SystemExit("preservation history no longer contains sequence-4 DOI")
                        require_equal(checkpoint.get("git_commit_sha"), sequence4.get("published_source_baseline_commit_sha"), "sequence4 historical source")
                        require_equal(checkpoint.get("package_identity_sha256"), sequence4.get("published_package_identity_sha256"), "sequence4 historical package")
                        current = versions_by_doi.get(state.get("latest_doi"))
                        if not isinstance(current, dict):
                            raise SystemExit("current repository DOI is missing from preservation history")
                        require_equal(current.get("record_id"), state.get("latest_record_id"), "current repository record")
                        require_equal(current.get("git_commit_sha"), state.get("latest_git_commit_sha"), "current repository source")
                        require_equal(current.get("package_identity_sha256"), state.get("latest_package_identity_sha256"), "current repository package")
                        if not isinstance(refresh, dict):
                            raise SystemExit("sequence4 recovery publication_refresh missing")
                        require_equal(refresh.get("sequence"), 4, "sequence4 recovery sequence")
                        require_equal(refresh.get("status"), "published_verified_and_consumed", "sequence4 recovery status")
''',
          )

          sub1(
              'scripts/monitor_public_recovery_topology.py',
              r'^    catalog_checkpoint = core_catalog\.get\("current_evidence_checkpoint", \{\}\)\n.*?(?=^    require\(\n        catalog_checkpoint\.get\("status"\))',
              '''    catalog_checkpoint = core_catalog.get("current_evidence_checkpoint", {})
    public_checkpoint = site_status.get("current_evidence_checkpoint", {})
    checkpoint_doi = catalog_checkpoint.get("version_doi")
    checkpoint_matches = [
        item
        for item in checkpoint_state.get("versions", [])
        if isinstance(item, dict) and item.get("doi") == checkpoint_doi
    ]
    require(len(checkpoint_matches) == 1, "evidence checkpoint is missing or duplicated in repository preservation history")
    checkpoint_version = checkpoint_matches[0]
    require(
        checkpoint_version.get("doi") == public_checkpoint.get("published_version_doi"),
        "public status evidence checkpoint DOI drift",
    )
    require(
        checkpoint_version.get("git_commit_sha")
        == catalog_checkpoint.get("source_baseline_commit_sha")
        == public_checkpoint.get("published_source_baseline_commit_sha"),
        "public status evidence checkpoint source drift",
    )
    require(
        checkpoint_version.get("package_identity_sha256")
        == catalog_checkpoint.get("package_identity_sha256"),
        "evidence checkpoint package identity drift",
    )
''',
          )

          sub1(
              'tests/test_repository_preservation_refresh_contract.py',
              r'^    active = seq4 if seq4\["status"\] == "consumed" else seq3\n    assert state\["latest_doi"\] == active\["published_doi"\]\n    assert state\["latest_git_commit_sha"\] == active\["published_source_baseline_commit_sha"\]\n    assert state\["latest_package_identity_sha256"\] == active\["published_package_identity_sha256"\]\n',
              '''    current_version = versions[state["latest_doi"]]
    assert current_version["record_id"] == state["latest_record_id"]
    assert current_version["git_commit_sha"] == state["latest_git_commit_sha"]
    assert current_version["package_identity_sha256"] == state["latest_package_identity_sha256"]
''',
          )

          sub1(
              'tests/test_external_binary_annex_v2.py',
              r'^    active = seq4 if seq4\["status"\] == "consumed" else seq3\n    assert current\["latest_doi"\] == active\["published_doi"\]\n    assert current\["latest_git_commit_sha"\] == active\["published_source_baseline_commit_sha"\]\n    assert current\["latest_package_identity_sha256"\] == active\["published_package_identity_sha256"\]\n',
              '''    current_versions = {entry["doi"]: entry for entry in current["versions"]}
    current_version = current_versions[current["latest_doi"]]
    assert current_version["record_id"] == current["latest_record_id"]
    assert current_version["git_commit_sha"] == current["latest_git_commit_sha"]
    assert current_version["package_identity_sha256"] == current["latest_package_identity_sha256"]
''',
          )

          state = json.loads((root / 'preservation/repository-preservation-state-v2.json').read_text(encoding='utf-8'))
          versions = {item['doi']: item for item in state['versions']}
          latest = versions[state['latest_doi']]

          index_path = root / 'api/recovery-index.json'
          index = json.loads(index_path.read_text(encoding='utf-8'))
          repo = index['latest_trusted_release']['repository_preservation']
          repo.update({
              'doi': state['latest_doi'],
              'record_id': state['latest_record_id'],
              'concept_doi': state['concept_doi'],
              'git_commit_sha': state['latest_git_commit_sha'],
              'git_tree_oid': latest['git_tree_oid'],
              'package_identity_sha256': state['latest_package_identity_sha256'],
              'coverage_status': 'latest_verified_repository_version',
          })
          canonical = dict(index)
          canonical.pop('source_digest', None)
          raw = json.dumps(canonical, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          index['source_digest'] = hashlib.sha256(raw).hexdigest()[:16]
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          annex_path = root / 'preservation/external-binary-annex-state.json'
          annex = json.loads(annex_path.read_text(encoding='utf-8'))
          annex['current_core_repository_latest_version_doi'] = state['latest_doi']
          historical = annex['core_repository_preservation_doi']
          concept = annex['current_core_repository_concept_doi']
          annex['core_repository_reference_note'] = (
              f'{historical} is a historical version reference, not the current Concept DOI. '
              f'The Concept DOI is {concept}; the current verified repository version is {state["latest_doi"]}. '
              'Evidence checkpoint v4 remains an immutable historical checkpoint and does not own the moving latest pointer.'
          )
          annex_path.write_text(json.dumps(annex, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit DOI role compatibility patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            scripts/current_baseline_publication_v2.py \
            scripts/monitor_public_recovery_topology.py \
            tests/test_repository_preservation_refresh_contract.py \
            tests/test_external_binary_annex_v2.py \
            api/recovery-index.json \
            preservation/external-binary-annex-state.json
          git diff --cached --check
          git commit -m "fix: separate historical evidence checkpoint from latest DOI"
          git push origin HEAD:agent/full-project-preservation-staging-v1
