name: Temporary DOI role compatibility fix

on:
  push:
    branches:
      - agent/full-project-preservation-staging-v1

permissions:
  contents: write

concurrency:
  group: tmp-doi-role-compat-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-project-preservation-staging-v1
          fetch-depth: 1
      - name: Patch legacy DOI role semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch target, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'scripts/current_baseline_publication_v2.py',
              '''                    elif sequence4_status == "consumed":\n                        require_equal(state.get("latest_doi"), sequence4.get("published_doi"), "sequence4 latest DOI")\n                        require_equal(state.get("publication_status"), "published_and_publicly_restored", "sequence4 state")\n                        if not isinstance(refresh, dict):\n                            raise SystemExit("sequence4 recovery publication_refresh missing")\n                        require_equal(refresh.get("sequence"), 4, "sequence4 recovery sequence")\n                        require_equal(refresh.get("status"), "published_verified_and_consumed", "sequence4 recovery status")\n''',
              '''                    elif sequence4_status == "consumed":\n                        # Sequence 4 is an immutable evidence checkpoint. A later\n                        # repository-preservation refresh may legitimately advance\n                        # latest_* while sequence-4 remains present in history.\n                        require_equal(state.get("publication_status"), "published_and_publicly_restored", "sequence4 state")\n                        versions_by_doi = {\n                            item.get("doi"): item\n                            for item in state.get("versions", [])\n                            if isinstance(item, dict)\n                        }\n                        checkpoint = versions_by_doi.get(sequence4.get("published_doi"))\n                        if not isinstance(checkpoint, dict):\n                            raise SystemExit("preservation history no longer contains sequence-4 DOI")\n                        require_equal(\n                            checkpoint.get("git_commit_sha"),\n                            sequence4.get("published_source_baseline_commit_sha"),\n                            "sequence4 historical source",\n                        )\n                        require_equal(\n                            checkpoint.get("package_identity_sha256"),\n                            sequence4.get("published_package_identity_sha256"),\n                            "sequence4 historical package",\n                        )\n                        current = versions_by_doi.get(state.get("latest_doi"))\n                        if not isinstance(current, dict):\n                            raise SystemExit("current repository DOI is missing from preservation history")\n                        require_equal(current.get("record_id"), state.get("latest_record_id"), "current repository record")\n                        require_equal(current.get("git_commit_sha"), state.get("latest_git_commit_sha"), "current repository source")\n                        require_equal(\n                            current.get("package_identity_sha256"),\n                            state.get("latest_package_identity_sha256"),\n                            "current repository package",\n                        )\n                        if not isinstance(refresh, dict):\n                            raise SystemExit("sequence4 recovery publication_refresh missing")\n                        require_equal(refresh.get("sequence"), 4, "sequence4 recovery sequence")\n                        require_equal(refresh.get("status"), "published_verified_and_consumed", "sequence4 recovery status")\n''',
          )

          replace_once(
              'scripts/monitor_public_recovery_topology.py',
              '''    catalog_checkpoint = core_catalog.get("current_evidence_checkpoint", {})\n    public_checkpoint = site_status.get("current_evidence_checkpoint", {})\n    require(\n        checkpoint_state.get("latest_doi")\n        == catalog_checkpoint.get("version_doi")\n        == public_checkpoint.get("published_version_doi"),\n        "public status evidence checkpoint DOI drift",\n    )\n    require(\n        checkpoint_state.get("latest_git_commit_sha")\n        == catalog_checkpoint.get("source_baseline_commit_sha")\n        == public_checkpoint.get("published_source_baseline_commit_sha"),\n        "public status evidence checkpoint source drift",\n    )\n    require(\n        checkpoint_state.get("latest_package_identity_sha256")\n        == catalog_checkpoint.get("package_identity_sha256"),\n        "evidence checkpoint package identity drift",\n    )\n''',
              '''    catalog_checkpoint = core_catalog.get("current_evidence_checkpoint", {})\n    public_checkpoint = site_status.get("current_evidence_checkpoint", {})\n    checkpoint_doi = catalog_checkpoint.get("version_doi")\n    checkpoint_matches = [\n        item\n        for item in checkpoint_state.get("versions", [])\n        if isinstance(item, dict) and item.get("doi") == checkpoint_doi\n    ]\n    require(\n        len(checkpoint_matches) == 1,\n        "evidence checkpoint is missing or duplicated in repository preservation history",\n    )\n    checkpoint_version = checkpoint_matches[0]\n    require(\n        checkpoint_version.get("doi")\n        == public_checkpoint.get("published_version_doi"),\n        "public status evidence checkpoint DOI drift",\n    )\n    require(\n        checkpoint_version.get("git_commit_sha")\n        == catalog_checkpoint.get("source_baseline_commit_sha")\n        == public_checkpoint.get("published_source_baseline_commit_sha"),\n        "public status evidence checkpoint source drift",\n    )\n    require(\n        checkpoint_version.get("package_identity_sha256")\n        == catalog_checkpoint.get("package_identity_sha256"),\n        "evidence checkpoint package identity drift",\n    )\n''',
          )

          for path in (
              'tests/test_repository_preservation_refresh_contract.py',
              'tests/test_external_binary_annex_v2.py',
          ):
              replace_once(
                  path,
                  '''    active = seq4 if seq4["status"] == "consumed" else seq3\n    assert state["latest_doi"] == active["published_doi"]\n    assert state["latest_git_commit_sha"] == active["published_source_baseline_commit_sha"]\n    assert state["latest_package_identity_sha256"] == active["published_package_identity_sha256"]\n'''
                  if 'repository_preservation' in path else
                  '''    active = seq4 if seq4["status"] == "consumed" else seq3\n    assert current["latest_doi"] == active["published_doi"]\n    assert current["latest_git_commit_sha"] == active["published_source_baseline_commit_sha"]\n    assert current["latest_package_identity_sha256"] == active["published_package_identity_sha256"]\n''',
                  '''    current_version = versions[state["latest_doi"]]\n    assert current_version["record_id"] == state["latest_record_id"]\n    assert current_version["git_commit_sha"] == state["latest_git_commit_sha"]\n    assert current_version["package_identity_sha256"] == state["latest_package_identity_sha256"]\n'''
                  if 'repository_preservation' in path else
                  '''    versions = {entry["doi"]: entry for entry in current["versions"]}\n    current_version = versions[current["latest_doi"]]\n    assert current_version["record_id"] == current["latest_record_id"]\n    assert current_version["git_commit_sha"] == current["latest_git_commit_sha"]\n    assert current_version["package_identity_sha256"] == current["latest_package_identity_sha256"]\n''',
              )

          # Avoid a duplicate `versions = ...` assignment introduced in the external-annex test.
          p = ROOT / 'tests/test_external_binary_annex_v2.py'
          text = p.read_text(encoding='utf-8')
          duplicate = '''    versions = {entry["doi"]: entry for entry in current["versions"]}\n    current_version = versions[current["latest_doi"]]\n    assert current_version["record_id"] == current["latest_record_id"]\n    assert current_version["git_commit_sha"] == current["latest_git_commit_sha"]\n    assert current_version["package_identity_sha256"] == current["latest_package_identity_sha256"]\n\n    versions = {entry["doi"]: entry for entry in current["versions"]}\n'''
          collapsed = '''    versions = {entry["doi"]: entry for entry in current["versions"]}\n    current_version = versions[current["latest_doi"]]\n    assert current_version["record_id"] == current["latest_record_id"]\n    assert current_version["git_commit_sha"] == current["latest_git_commit_sha"]\n    assert current_version["package_identity_sha256"] == current["latest_package_identity_sha256"]\n\n'''
          if duplicate not in text:
              raise SystemExit('external-annex test: expected duplicate versions assignment not found')
          p.write_text(text.replace(duplicate, collapsed, 1), encoding='utf-8')

          state = json.loads((ROOT / 'preservation/repository-preservation-state-v2.json').read_text(encoding='utf-8'))
          versions = {item['doi']: item for item in state['versions']}
          latest = versions[state['latest_doi']]

          index_path = ROOT / 'api/recovery-index.json'
          index = json.loads(index_path.read_text(encoding='utf-8'))
          repo = index['latest_trusted_release']['repository_preservation']
          repo.update({
              'doi': state['latest_doi'],
              'record_id': state['latest_record_id'],
              'concept_doi': state['concept_doi'],
              'git_commit_sha': state['latest_git_commit_sha'],
              'git_tree_oid': latest['git_tree_oid'],
              'package_identity_sha256': state['latest_package_identity_sha256'],
              'coverage_status': 'latest_verified_repository_version',
          })
          canonical = dict(index)
          canonical.pop('source_digest', None)
          raw = json.dumps(canonical, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
          index['source_digest'] = hashlib.sha256(raw).hexdigest()[:16]
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          annex_path = ROOT / 'preservation/external-binary-annex-state.json'
          annex = json.loads(annex_path.read_text(encoding='utf-8'))
          annex['current_core_repository_latest_version_doi'] = state['latest_doi']
          historical = annex['core_repository_preservation_doi']
          concept = annex['current_core_repository_concept_doi']
          annex['core_repository_reference_note'] = (
              f'{historical} is a historical version reference, not the current Concept DOI. '
              f'The Concept DOI is {concept}; the current verified repository version is {state["latest_doi"]}. '
              'Evidence checkpoint v4 remains an immutable historical checkpoint and does not own the moving latest pointer.'
          )
          annex_path.write_text(json.dumps(annex, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Run targeted compatibility tests
        shell: bash
        run: |
          python3 -m pip install -r requirements-ci.txt
          python3 -m pytest -q \
            tests/test_current_baseline_publication_contract.py \
            tests/test_current_baseline_publication_v2_contract.py \
            tests/test_external_binary_annex_v2.py \
            tests/test_public_recovery_availability_monitor.py \
            tests/test_recent_pr_review_fixes.py \
            tests/test_repository_preservation_refresh_contract.py
      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            scripts/current_baseline_publication_v2.py \
            scripts/monitor_public_recovery_topology.py \
            tests/test_repository_preservation_refresh_contract.py \
            tests/test_external_binary_annex_v2.py \
            api/recovery-index.json \
            preservation/external-binary-annex-state.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: separate historical evidence checkpoint from latest DOI"
          git push origin HEAD:agent/full-project-preservation-staging-v1
