name: Temporary Apply Zenodo and Live Preflight Gate

on:
  push:
    branches:
      - agent/zenodo-idempotency-live-preflight

permissions:
  contents: write

concurrency:
  group: tmp-apply-zenodo-live-preflight-gate
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Repair generated test delimiter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_apply_zenodo_live_preflight_gate.py')
          text = path.read_text(encoding='utf-8')
          old = '    build_pos = workflow.index("\\n  build:\\n")'
          new = '    build_pos = workflow.index("  build:")'
          if old not in text:
              raise SystemExit('generated-test delimiter anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply and validate permanent files
        run: |
          set -euo pipefail
          python3 scripts/tmp_apply_zenodo_live_preflight_gate.py
          python3 -m json.tool api/record-chain-intake-gateway.v1.json >/dev/null
          python3 -m py_compile \
            scripts/smoke_live_record_action_preflight.py \
            tests/test_preservation_refresh_and_live_preflight_gate.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('tests/test_preservation_refresh_and_live_preflight_gate.py')
          spec = importlib.util.spec_from_file_location('permanent_gate_tests', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.test_consumed_preservation_refresh_is_secret_independent()
          module.test_publication_credentials_remain_required_before_nonterminal_work()
          module.test_gateway_descriptor_exposes_current_action_minimums()
          module.test_live_preflight_gate_covers_changed_routes_without_submit()
          module.test_pages_deploy_runs_live_preflight_after_gateway_rollout()
          PY

      - name: Commit validated non-workflow result
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/deploy-pages.yml
          rm -f scripts/tmp_apply_zenodo_live_preflight_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/record-chain-intake-gateway.v1.json \
            tests/test_preservation_refresh_and_live_preflight_gate.py \
            scripts/tmp_apply_zenodo_live_preflight_gate.py
          git commit -m "fix: close preservation idempotency and test gaps"
          git push origin HEAD:agent/zenodo-idempotency-live-preflight
