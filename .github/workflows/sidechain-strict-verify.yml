name: Sidechain Strict Verification Boundary

on:
  push:
    branches: [main]
    paths:
      - "scripts/verify-chronicle-sidechain-strict.py"
      - "scripts/test_chronicle_sidechain_strict.py"
      - "scripts/verify_chronicle_base_derivation.py"
      - "scripts/verify_ethereum_beacon_ssz.mjs"
      - "scripts/verify_base_blob_kzg.go"
      - "scripts/yq_chain_id_compat.py"
      - "docs/SIDECHAIN_STRICT_VERIFICATION.md"
      - "evidence/chronicle-sidechain-historical-payload-exceptions.json"
      - "evidence/chronicle-sidechain-seven-root-provenance-review.v1.json"
      - ".github/workflows/sidechain-strict-verify.yml"
  pull_request:
    paths:
      - "scripts/verify-chronicle-sidechain-strict.py"
      - "scripts/test_chronicle_sidechain_strict.py"
      - "scripts/verify_chronicle_base_derivation.py"
      - "scripts/verify_ethereum_beacon_ssz.mjs"
      - "scripts/verify_base_blob_kzg.go"
      - "scripts/yq_chain_id_compat.py"
      - "docs/SIDECHAIN_STRICT_VERIFICATION.md"
      - "evidence/chronicle-sidechain-historical-payload-exceptions.json"
      - "evidence/chronicle-sidechain-seven-root-provenance-review.v1.json"
      - ".github/workflows/sidechain-strict-verify.yml"
  workflow_dispatch:
    inputs:
      require_complete:
        description: "Fail unless every content and finality layer is complete"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sidechain-strict-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.25.1"
          cache: false

      - name: Install and test strict verifier
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd zip
          python3 -m pip install -r requirements-ci.txt
          npm ci
          python3 -m py_compile scripts/verify-chronicle-sidechain-strict.py
          python3 scripts/test_chronicle_sidechain_strict.py

      - name: Download immutable source and Polygon settlement releases
        id: evidence
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sidechain-strict"
          mkdir -p "$root/source" "$root/settlement" "$root/finality-release"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft,isPrerelease > "$root/releases.json"
          python3 - <<'PY' > "$root/source.env"
          import json,os,re
          rows=json.load(open(os.environ['RUNNER_TEMP']+'/sidechain-strict/releases.json'))
          rows=[r for r in rows if not r['isDraft'] and not r['isPrerelease'] and re.fullmatch(r'chronicle-sidechain-evidence-v2-[0-9a-f]{12}',r['tagName'])]
          if not rows: raise SystemExit('no immutable sidechain evidence release')
          rows.sort(key=lambda r:r.get('createdAt') or '')
          tag=rows[-1]['tagName']; short=tag.rsplit('-',1)[-1]
          print(f'SOURCE_TAG={tag}'); print(f'SOURCE_SHORT={short}')
          print(f'SETTLEMENT_TAG=chronicle-polygon-ethereum-settlement-v1-{short}')
          PY
          set -a; . "$root/source.env"; set +a
          git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "$SOURCE_TAG")"
          test "${SOURCE_SHA:0:12}" = "$SOURCE_SHORT"
          archive="chronicle-sidechain-evidence-v2-${SOURCE_SHORT}.tar.gz"
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root/source" --pattern "$archive" --pattern "$archive.sha256"
          (cd "$root/source" && sha256sum -c "$archive.sha256")
          mkdir "$root/extracted"
          tar --no-same-owner -xzf "$root/source/$archive" -C "$root/extracted"
          gh release download "$SETTLEMENT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root/settlement" --pattern POLYGON-ETHEREUM-SETTLEMENT.json --pattern SOURCE-BINDING.json
          FINALITY_TAG="chronicle-sidechain-finality-v1-${SOURCE_SHORT}"
          finality=""
          if finality_draft="$(gh release view "$FINALITY_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            :
          else
            finality_draft="missing"
          fi
          if [[ "$finality_draft" == "false" ]]; then
            gh release download "$FINALITY_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root/finality-release"
            (cd "$root/finality-release" && sha256sum -c RELEASE-ASSETS-SHA256.txt)
            finality_archive="chronicle-sidechain-finality-v1-${SOURCE_SHORT}.tar.zst"
            expected="$(jq -r '.archive_sha256' "$root/finality-release/RELEASE-ASSETS.json")"
            actual="$(cat "$root/finality-release"/"$finality_archive".part-* | sha256sum | awk '{print $1}')"
            test "$actual" = "$expected"
            mkdir "$root/finality-extracted"
            cat "$root/finality-release"/"$finality_archive".part-* | zstd -d -c | tar --no-same-owner -xf - -C "$root/finality-extracted"
            finality="$root/finality-extracted/chronicle-sidechain-finality"
            (cd "$finality" && sha256sum -c MANIFEST.sha256)
          fi
          echo "source=$root/extracted/chronicle-sidechain-scan" >> "$GITHUB_OUTPUT"
          echo "settlement=$root/settlement" >> "$GITHUB_OUTPUT"
          echo "finality=$finality" >> "$GITHUB_OUTPUT"

      - name: Cold-verify identity, CAR DAGs, and L2 inclusion
        env:
          CHRONICLE_OUT: ${{ steps.evidence.outputs.source }}
        run: |
          set -euo pipefail
          python3 scripts/verify-chronicle-sidechain-evidence.py

      - name: Build pinned OP verifier for published finality bundle
        if: steps.evidence.outputs.finality != ''
        id: op
        env:
          OPTIMISM_COMMIT: c6f39182c975db976aaaa01ef32884c41b1c9660
          SUPERCHAIN_REGISTRY_COMMIT: 5b055be4d294ce43814a44c8839d89b2436dc8aa
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/strict-op-tools"
          mkdir -p "$tools/bin"
          git clone --filter=blob:none --no-checkout https://github.com/ethereum-optimism/optimism.git "$tools/optimism"
          git -C "$tools/optimism" checkout "$OPTIMISM_COMMIT"
          git -C "$tools/optimism" submodule update --init superchain-registry
          git -C "$tools/optimism/superchain-registry" fetch origin "$SUPERCHAIN_REGISTRY_COMMIT"
          git -C "$tools/optimism/superchain-registry" checkout "$SUPERCHAIN_REGISTRY_COMMIT"
          cp scripts/yq_chain_id_compat.py "$tools/bin/yq"
          chmod +x "$tools/bin/yq"
          PATH="$tools/bin:$PATH" OP_CORE_SYNC_SUPERCHAIN=1 "$tools/optimism/op-core/superchain/sync-superchain.sh"
          (
            cd "$tools/optimism"
            go build -trimpath -o "$tools/bin/batch-decoder" ./op-node/cmd/batch_decoder
            cp "$GITHUB_WORKSPACE/scripts/verify_base_blob_kzg.go" verify_base_blob_kzg.go
            go build -trimpath -o "$tools/bin/verify-base-blob-kzg" verify_base_blob_kzg.go
          )
          echo "bin=$tools/bin" >> "$GITHUB_OUTPUT"

      - name: Recompute published Base and Beacon proof layers offline
        if: steps.evidence.outputs.finality != ''
        env:
          FINALITY: ${{ steps.evidence.outputs.finality }}
          TOOL_BIN: ${{ steps.op.outputs.bin }}
        run: |
          set -euo pipefail
          "$TOOL_BIN/verify-base-blob-kzg" "$FINALITY/base/decoder/transactions" "$FINALITY/base/decoder/blobs"
          rm -rf "$RUNNER_TEMP/strict-fresh-channels"
          "$TOOL_BIN/batch-decoder" reassemble \
            --in "$FINALITY/base/decoder/transactions" \
            --out "$RUNNER_TEMP/strict-fresh-channels" --l2-chain-id 8453
          PYTHONPATH=scripts python3 scripts/verify_chronicle_base_derivation.py \
            --evidence "$FINALITY/base" --base-timeline "$FINALITY/BASE-TIMELINE.json" \
            --channels "$RUNNER_TEMP/strict-fresh-channels"
          node scripts/verify_ethereum_beacon_ssz.mjs "$FINALITY/beacon"

      - name: Recompute Polygon settlement and classify all missing layers
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_COMPLETE: ${{ inputs.require_complete }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUIRE_COMPLETE" == "true" ]]; then extra+=(--require-complete); fi
          if [[ -n "${{ steps.evidence.outputs.finality }}" ]]; then extra+=(--finality-dir "${{ steps.evidence.outputs.finality }}"); fi
          python3 scripts/verify-chronicle-sidechain-strict.py \
            --source-dir "${{ steps.evidence.outputs.source }}" \
            --polygon-settlement "${{ steps.evidence.outputs.settlement }}/POLYGON-ETHEREUM-SETTLEMENT.json" \
            --polygon-binding "${{ steps.evidence.outputs.settlement }}/SOURCE-BINDING.json" \
            --output artifacts/sidechain-strict-verification.json "${extra[@]}"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('artifacts/sidechain-strict-verification.json'))
          print('# Sidechain strict verification')
          print(f"\n- Audit integrity: **{'PASS' if r['audit_pass'] else 'FAIL'}**")
          print(f"- Strict completion: **{r['strict_completion']}**")
          for name, layer in r['layers'].items(): print(f"- `{name}`: **{layer['status']}**")
          print('\nA green audit verifies the classification; it does not turn NOT_CAPTURED or INCOMPLETE layers into PASS.')
          PY

      - name: Upload machine-readable strict report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidechain-strict-verification-${{ github.run_id }}
          path: |
            artifacts/sidechain-strict-verification.json
            ${{ runner.temp }}/toolchain-provenance.json
          retention-days: 30
          if-no-files-found: warn
