name: Sidechain Strict Verification Boundary

on:
  push:
    branches: [main]
    paths:
      - "scripts/verify-chronicle-sidechain-strict.py"
      - "scripts/test_chronicle_sidechain_strict.py"
      - "docs/SIDECHAIN_STRICT_VERIFICATION.md"
      - "evidence/chronicle-sidechain-historical-payload-exceptions.json"
      - "evidence/chronicle-sidechain-seven-root-provenance-review.v1.json"
      - ".github/workflows/sidechain-strict-verify.yml"
  pull_request:
    paths:
      - "scripts/verify-chronicle-sidechain-strict.py"
      - "scripts/test_chronicle_sidechain_strict.py"
      - "docs/SIDECHAIN_STRICT_VERIFICATION.md"
      - "evidence/chronicle-sidechain-historical-payload-exceptions.json"
      - "evidence/chronicle-sidechain-seven-root-provenance-review.v1.json"
      - ".github/workflows/sidechain-strict-verify.yml"
  workflow_dispatch:
    inputs:
      require_complete:
        description: "Fail unless every content and finality layer is complete"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sidechain-strict-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install and test strict verifier
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-ci.txt
          python3 -m py_compile scripts/verify-chronicle-sidechain-strict.py
          python3 scripts/test_chronicle_sidechain_strict.py

      - name: Download immutable source and Polygon settlement releases
        id: evidence
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sidechain-strict"
          mkdir -p "$root/source" "$root/settlement"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft,isPrerelease > "$root/releases.json"
          python3 - <<'PY' > "$root/source.env"
          import json,os,re
          rows=json.load(open(os.environ['RUNNER_TEMP']+'/sidechain-strict/releases.json'))
          rows=[r for r in rows if not r['isDraft'] and not r['isPrerelease'] and re.fullmatch(r'chronicle-sidechain-evidence-v2-[0-9a-f]{12}',r['tagName'])]
          if not rows: raise SystemExit('no immutable sidechain evidence release')
          rows.sort(key=lambda r:r.get('createdAt') or '')
          tag=rows[-1]['tagName']; short=tag.rsplit('-',1)[-1]
          print(f'SOURCE_TAG={tag}'); print(f'SOURCE_SHORT={short}')
          print(f'SETTLEMENT_TAG=chronicle-polygon-ethereum-settlement-v1-{short}')
          PY
          set -a; . "$root/source.env"; set +a
          git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "$SOURCE_TAG")"
          test "${SOURCE_SHA:0:12}" = "$SOURCE_SHORT"
          archive="chronicle-sidechain-evidence-v2-${SOURCE_SHORT}.tar.gz"
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root/source" --pattern "$archive" --pattern "$archive.sha256"
          (cd "$root/source" && sha256sum -c "$archive.sha256")
          mkdir "$root/extracted"
          tar --no-same-owner -xzf "$root/source/$archive" -C "$root/extracted"
          gh release download "$SETTLEMENT_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root/settlement" --pattern POLYGON-ETHEREUM-SETTLEMENT.json --pattern SOURCE-BINDING.json
          echo "source=$root/extracted/chronicle-sidechain-scan" >> "$GITHUB_OUTPUT"
          echo "settlement=$root/settlement" >> "$GITHUB_OUTPUT"

      - name: Cold-verify identity, CAR DAGs, and L2 inclusion
        env:
          CHRONICLE_OUT: ${{ steps.evidence.outputs.source }}
        run: |
          set -euo pipefail
          python3 scripts/verify-chronicle-sidechain-evidence.py

      - name: Recompute Polygon settlement and classify all missing layers
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_COMPLETE: ${{ inputs.require_complete }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUIRE_COMPLETE" == "true" ]]; then extra+=(--require-complete); fi
          python3 scripts/verify-chronicle-sidechain-strict.py \
            --source-dir "${{ steps.evidence.outputs.source }}" \
            --polygon-settlement "${{ steps.evidence.outputs.settlement }}/POLYGON-ETHEREUM-SETTLEMENT.json" \
            --polygon-binding "${{ steps.evidence.outputs.settlement }}/SOURCE-BINDING.json" \
            --output artifacts/sidechain-strict-verification.json "${extra[@]}"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('artifacts/sidechain-strict-verification.json'))
          print('# Sidechain strict verification')
          print(f"\n- Audit integrity: **{'PASS' if r['audit_pass'] else 'FAIL'}**")
          print(f"- Strict completion: **{r['strict_completion']}**")
          for name, layer in r['layers'].items(): print(f"- `{name}`: **{layer['status']}**")
          print('\nA green audit verifies the classification; it does not turn NOT_CAPTURED or INCOMPLETE layers into PASS.')
          PY

      - name: Upload machine-readable strict report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sidechain-strict-verification-${{ github.run_id }}
          path: |
            artifacts/sidechain-strict-verification.json
            ${{ runner.temp }}/toolchain-provenance.json
          retention-days: 30
          if-no-files-found: warn
