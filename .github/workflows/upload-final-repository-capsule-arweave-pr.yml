name: Execute Authorized Repository Capsule Arweave Upload

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/upload-final-repository-capsule-arweave-pr.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: final-repository-capsule-arweave-upload-once
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event.pull_request.head.repo.full_name == 'thechurchofagi/trinity-accord' &&
      github.head_ref == 'agent/upload-final-repository-capsule-arweave-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE_ARTIFACT_ID: "8831907405"
      EXPECTED_CAPSULE_ID: repository-81b151245d70
      EXPECTED_SOURCE_COMMIT: 81b151245d70f6b775418de60f7b8a1366f28944
      EXPECTED_GIT_TREE_OID: c63cb393713f9824970bab80b07c214dc79e561a
      EXPECTED_RECOVERY_COMMIT: 247f254229de1d148f299a2cbfacf7102950d5df
      EXPECTED_PACKAGE_IDENTITY_SHA256: ab3e0c54dce4b51330060e88133399553442f091d6f98adf06b8439e27be00c2
      EXPECTED_PAYLOAD_BYTES: "36925440"
      EXPECTED_PAYLOAD_SHA256: 132cc58496f903990447f06847325b7393d1dedf8b4eae24ad888f4145b1df14
      MAX_REWARD_WINSTON: "400000000000"
      MIN_REMAINING_WINSTON: "250000000000"
      ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}

    steps:
      - name: Checkout locked uploader dependency set
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.EXPECTED_SOURCE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download the previously verified no-spend evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$ARKEY"
          mkdir -p "$RUNNER_TEMP/evidence"
          curl --fail --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/evidence.zip"
          unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/evidence"
          payload="$(find "$RUNNER_TEMP/evidence" -type f -name 'trinity-accord-repository-capsule-81b151245d70.tar' -print -quit)"
          test -n "$payload"
          printf '%s\n' "$payload" > "$RUNNER_TEMP/payload-path.txt"
          test "$(stat -c %s "$payload")" = "$EXPECTED_PAYLOAD_BYTES"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          echo "VERIFIED_ARTIFACT_PAYLOAD_OK"

      - name: Idempotency-check, enforce cost and reserve, sign, upload, and read back
        env:
          PAYLOAD_PATH_FILE: ${{ runner.temp }}/payload-path.txt
          RESULT_PATH: ${{ runner.temp }}/arweave-upload-result.json
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/upload.mjs" <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import Arweave from 'arweave';

          const rawKey = (process.env.ARKEY || '').trim();
          if (!rawKey) throw new Error('ARKEY is unavailable');
          let jwk;
          try { jwk = JSON.parse(rawKey); }
          catch { jwk = JSON.parse(Buffer.from(rawKey, 'base64').toString('utf8')); }

          const data = fs.readFileSync(fs.readFileSync(process.env.PAYLOAD_PATH_FILE, 'utf8').trim());
          const sha = crypto.createHash('sha256').update(data).digest('hex');
          if (data.length !== Number(process.env.EXPECTED_PAYLOAD_BYTES)) throw new Error('payload size mismatch');
          if (sha !== process.env.EXPECTED_PAYLOAD_SHA256) throw new Error('payload hash mismatch');

          const arweave = Arweave.init({host:'arweave.net',port:443,protocol:'https',timeout:60000,logging:false});
          const maxReward = BigInt(process.env.MAX_REWARD_WINSTON);
          const reserve = BigInt(process.env.MIN_REMAINING_WINSTON);
          const address = await arweave.wallets.jwkToAddress(jwk);

          const query = `query($tags:[TagFilter!]){transactions(first:10,tags:$tags){edges{node{id}}}}`;
          const tags = [
            {name:'App-Name',values:['Trinity-Accord']},
            {name:'Artifact-Type',values:['Repository-Preservation-Capsule']},
            {name:'Package-Identity-SHA256',values:[process.env.EXPECTED_PACKAGE_IDENTITY_SHA256]},
            {name:'Payload-SHA256',values:[sha]},
          ];
          const graph = await arweave.api.post('graphql',{query,variables:{tags}});
          const existing = graph?.data?.data?.transactions?.edges || [];

          async function readback(txid, gateway, attempts=120) {
            let last='not attempted';
            for (let i=1;i<=attempts;i+=1) {
              try {
                const response=await fetch(`${gateway}/${txid}`,{redirect:'follow'});
                if (response.ok) {
                  const bytes=Buffer.from(await response.arrayBuffer());
                  const observed=crypto.createHash('sha256').update(bytes).digest('hex');
                  if (bytes.length===data.length && observed===sha) return {verified:true,gateway,attempts:i,bytes:bytes.length,sha256:observed};
                  last=`mismatch bytes=${bytes.length} sha=${observed}`;
                } else last=`HTTP ${response.status}`;
              } catch(error) { last=error.message; }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw new Error(`readback failed ${gateway}: ${last}`);
          }

          if (existing.length) {
            const txid=existing[0].node.id;
            const primary=await readback(txid,'https://arweave.net');
            const result={result:'already_present_exact_payload',txid,payload_bytes:data.length,payload_sha256:sha,package_identity_sha256:process.env.EXPECTED_PACKAGE_IDENTITY_SHA256,primary_readback:primary,ar_spent_this_run:'0.000000000000'};
            fs.writeFileSync(process.env.RESULT_PATH,JSON.stringify(result,null,2)+'\n');
            console.log(JSON.stringify(result,null,2));
            process.exit(0);
          }

          const balance=BigInt(await arweave.wallets.getBalance(address));
          const quote=BigInt(await arweave.transactions.getPrice(data.length));
          if (quote>maxReward) throw new Error(`quote exceeds 0.40 AR cap: ${quote}`);
          if (balance-quote<reserve) throw new Error('quote violates 0.25 AR reserve');

          const tx=await arweave.createTransaction({data},jwk);
          const reward=BigInt(tx.reward);
          if (reward>maxReward) throw new Error(`transaction reward exceeds cap: ${reward}`);
          if (balance-reward<reserve) throw new Error('transaction violates reserve');

          const txTags={
            'App-Name':'Trinity-Accord',
            'Artifact-Type':'Repository-Preservation-Capsule',
            'Capsule-ID':process.env.EXPECTED_CAPSULE_ID,
            'Source-Git-Commit':process.env.EXPECTED_SOURCE_COMMIT,
            'Git-Tree-OID':process.env.EXPECTED_GIT_TREE_OID,
            'Recovery-Commit-SHA':process.env.EXPECTED_RECOVERY_COMMIT,
            'Package-Identity-SHA256':process.env.EXPECTED_PACKAGE_IDENTITY_SHA256,
            'Payload-SHA256':sha,
            'Payload-Bytes':String(data.length),
            'Content-Type':'application/x-tar',
            'Canonical-Authority':'Bitcoin-Originals-only',
            'Non-Amending':'true',
            'Repository-Recovery-Status':'full_exact_publication_baseline',
          };
          for (const [name,value] of Object.entries(txTags)) tx.addTag(name,value);
          await arweave.transactions.sign(tx,jwk);
          const uploader=await arweave.transactions.getUploader(tx);
          while(!uploader.isComplete){await uploader.uploadChunk();console.log(`upload=${uploader.pctComplete}% chunks=${uploader.uploadedChunks}/${uploader.totalChunks}`);}

          const primary=await readback(tx.id,'https://arweave.net');
          let alternate;
          try { alternate=await readback(tx.id,'https://g8way.io',30); }
          catch(error){ alternate={verified:false,gateway:'https://g8way.io',error:error.message}; }
          const observedBalance=BigInt(await arweave.wallets.getBalance(address));
          const result={result:'uploaded_and_primary_readback_verified',txid:tx.id,payload_bytes:data.length,payload_sha256:sha,capsule_id:process.env.EXPECTED_CAPSULE_ID,source_commit:process.env.EXPECTED_SOURCE_COMMIT,git_tree_oid:process.env.EXPECTED_GIT_TREE_OID,recovery_commit_sha:process.env.EXPECTED_RECOVERY_COMMIT,package_identity_sha256:process.env.EXPECTED_PACKAGE_IDENTITY_SHA256,quoted_reward_winston:quote.toString(),transaction_reward_winston:reward.toString(),transaction_reward_ar:arweave.ar.winstonToAr(reward.toString()),balance_before_winston:balance.toString(),estimated_remaining_winston:(balance-reward).toString(),observed_balance_after_winston:observedBalance.toString(),minimum_remaining_winston:reserve.toString(),primary_readback:primary,alternate_readback:alternate,transaction_signed:true,transaction_uploaded:true};
          fs.writeFileSync(process.env.RESULT_PATH,JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          JS
          node "$RUNNER_TEMP/upload.mjs"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authorized-repository-capsule-arweave-upload-result
          path: ${{ runner.temp }}/arweave-upload-result.json
          if-no-files-found: warn
          retention-days: 90
