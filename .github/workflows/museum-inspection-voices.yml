name: Museum inspection voices
on:
  push:
    branches: [codex/museum-voice-retakes]
    paths: ['.github/workflows/museum-inspection-voices.yml']
permissions:
  contents: read
jobs:
  narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stop: [8,9,10]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: museum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned synthesis and acoustic review
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install faster-whisper==1.2.0 soundfile==0.13.1
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2'
      - name: Stage existing inspection scripts without changing their text
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('museum/dist/data/guide-audio.json');d=json.loads(p.read_text());d['tracks']=[dict(t,stop=8+t['flaw']) for t in d['inspectionTracks'] if t['language']=='en'];assert len(d['tracks'])==3;p.write_text(json.dumps(d,ensure_ascii=False))
          PY
      - name: Render matching synthetic voice and new captions
        env:
          HF_HUB_DISABLE_XET: '1'
          OMP_NUM_THREADS: '3'
          TOKENIZERS_PARALLELISM: 'false'
        run: python museum/scripts/retake_expressive_guide.py --stop ${{ matrix.stop }} --output "$RUNNER_TEMP/inspection-voice"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inspection-voice-${{ matrix.stop }}
          path: ${{ runner.temp }}/inspection-voice
          retention-days: 7
          if-no-files-found: warn
