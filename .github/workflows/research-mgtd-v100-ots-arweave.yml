# Historical v1.0.0 workflow. Superseded by the author's explicit instruction
# on 2026-10-08: Arweave preservation only for the newest corrected version.
# The existing v1.0.0 Zenodo DOI and detached OTS receipt are immutable history.
# This workflow has NO schedule, no secret access, no stamping and NO paid posts.
name: MGTD v1.0.0 historical (AR disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archived:
    runs-on: ubuntu-24.04
    steps:
      - name: State supersession explicitly
        run: |
          echo "MGTD v1.0.0 AR permanently disabled by author instruction."
          echo "Do not upgrade or re-submit v1.0.0 OTS in this workflow."
          echo "Only corrected v1.0.1 can enter OTS then guarded Arweave."
