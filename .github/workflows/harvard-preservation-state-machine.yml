name: Harvard Dataverse Preservation State Machine

on:
  push:
    branches:
      - main
      - harvard-review-finalization
    paths:
      - .github/harvard-review-state-machine-trigger-v1
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: harvard-preservation-state-machine-v1
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
      HARVARD_PID: doi:10.7910/DVN/YUCG12
      HARVARD_ARCHIVE_NAME: trinity-accord-full-project-preservation-bundle.github-artifact.zip.bin
      HARVARD_ARTIFACT_BYTES: '1951603950'
      HARVARD_ARTIFACT_SHA256: 9c3c8bd513dfe4919efe56084c138fce18de313f59d67cd7c9484d9b5b75c9f2
      HARVARD_BUNDLE_IDENTITY_SHA256: 4930b9d6cd4968f3ba75de9dc46a396af7f37f97d128d1619ae829239656989d
      HARVARD_SOURCE_RUN_ID: '32368866492'
      HARVARD_SOURCE_GIT_SHA: 07cd79ba7b98294a0ff9bc45d76f305609f8a0aa
    steps:
      - name: Checkout exact workflow branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'

      - name: Advance Harvard preservation state
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/harvard-state-machine
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python3 scripts/harvard_preservation_state_machine.py \
            --output-dir "$OUTPUT_DIR" \
            --state-path preservation/harvard-dataverse-state.json \
            2>&1 | tee "$RUNNER_TEMP/harvard-state-machine.log"
          cp preservation/harvard-dataverse-state.json \
            "$OUTPUT_DIR/harvard-dataverse-state-observed.json"

      - name: Validate machine state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('preservation/harvard-dataverse-state.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          allowed={
              'submitted_for_review_v1_0',
              'submitted_for_review_v1_1',
              'complete',
          }
          status=data.get('status')
          if status not in allowed:
              raise SystemExit(f'unexpected Harvard preservation status: {status!r}')
          if data.get('persistent_id') != 'doi:10.7910/DVN/YUCG12':
              raise SystemExit('Harvard PID changed unexpectedly')
          if data.get('source', {}).get('artifact_sha256') != '9c3c8bd513dfe4919efe56084c138fce18de313f59d67cd7c9484d9b5b75c9f2':
              raise SystemExit('Harvard source artifact SHA-256 changed unexpectedly')
          print(f"state_validation PASS status={status}")
          PY

      - name: Commit state transition to repository
        shell: bash
        run: |
          set -euo pipefail
          old_status="$(git show HEAD:preservation/harvard-dataverse-state.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
          new_status="$(python3 -c 'import json; print(json.load(open("preservation/harvard-dataverse-state.json", encoding="utf-8")).get("status",""))')"
          echo "old_status=$old_status new_status=$new_status"
          if [ "$old_status" = "$new_status" ]; then
            git restore -- preservation/harvard-dataverse-state.json
            echo "Harvard status unchanged; observation retained only in audit artifact."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- preservation/harvard-dataverse-state.json
            git commit -m "preservation: Harvard state ${old_status} -> ${new_status}"
            git push
          fi

      - name: Upload state-machine audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harvard-preservation-state-machine-audit
          path: |
            ${{ runner.temp }}/harvard-state-machine.log
            ${{ runner.temp }}/harvard-state-machine/harvard-publication-receipt.json
            ${{ runner.temp }}/harvard-state-machine/harvard-dataverse-state-observed.json
            preservation/harvard-dataverse-state.json
          retention-days: 90
          if-no-files-found: warn
