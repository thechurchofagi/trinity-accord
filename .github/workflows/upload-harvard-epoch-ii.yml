name: Upload Harvard Preservation Epoch II

on:
  pull_request:
    paths:
      - .github/workflows/upload-harvard-epoch-ii.yml
      - scripts/upload_harvard_epoch_ii.py
      - tests/test_upload_harvard_epoch_ii.py
      - preservation/epoch-ii/frozen/**
      - .github/harvard-epoch-ii-full-upload-authorized-v1
      - .github/harvard-epoch-ii-full-upload-resume-v3
  push:
    branches: [main]
    paths:
      - .github/harvard-epoch-ii-full-upload-authorized-v1
      - .github/harvard-epoch-ii-full-upload-resume-v2
      - .github/harvard-epoch-ii-full-upload-resume-v3

permissions:
  actions: read
  contents: read

concurrency:
  group: harvard-preservation-epoch-ii-dvn-w9y3iv
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  HARVARD_PID: doi:10.7910/DVN/W9Y3IV
  FROZEN_DIR: control/preservation/epoch-ii/frozen
  MANIFEST: control/preservation/epoch-ii/frozen/DATASET-MANIFEST.json
  HARVARD_SUMS: control/preservation/epoch-ii/frozen/HARVARD-EPOCH-II-SHA256SUMS

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-contract.json"
      - name: Verify immutable upload contract
        working-directory: control
        run: |
          set -euo pipefail
          test "$(cat .github/harvard-epoch-ii-full-upload-authorized-v1)" = \
            "Harvard Preservation Epoch II full upload authorized: doi:10.7910/DVN/W9Y3IV dataset-id=14229992 files=419 candidate=cd0bd263f548d23060422021408ab1705e8c48c1c1028f1a440eb89d1e88d7e8"
          test "$(cat .github/harvard-epoch-ii-full-upload-resume-v2)" = \
            "Harvard Preservation Epoch II idempotent resume authorized after signed x-amz-tagging fix: doi:10.7910/DVN/W9Y3IV dataset-id=14229992"
          test "$(cat .github/harvard-epoch-ii-full-upload-resume-v3)" = \
            "Harvard Preservation Epoch II idempotent resume authorized after serializing Dataverse dataset writes: doi:10.7910/DVN/W9Y3IV dataset-id=14229992"
          python3 -m unittest tests.test_upload_harvard_epoch_ii

  upload-repository-and-controls:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Checkout frozen source commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: source
          ref: 3bdf9121fb9e98cd9ba9de62a2466367d0968e4e
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-repository.json"
      - name: Upload 206 frozen repository files and two controls
        run: |
          set -euo pipefail
          python3 control/scripts/upload_harvard_epoch_ii.py \
            --manifest "$MANIFEST" --sums "$HARVARD_SUMS" upload \
            --group repository --source-repo source \
            --work-dir "$RUNNER_TEMP/upload-work" \
            --receipt "$RUNNER_TEMP/receipt-repository.json"
      - name: Preserve PASS receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-receipt-repository
          path: |
            ${{ runner.temp }}/receipt-repository.json
            ${{ runner.temp }}/toolchain-provenance-repository.json
          retention-days: 90
          if-no-files-found: error

  # Dataverse serializes Dataset mutations internally; keep every add-file call in one lane.
  upload-release-assets:
    if: github.event_name == 'push'
    needs: upload-repository-and-controls
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-release-${{ matrix.shard }}.json"
      - name: Download, verify, upload and full-readback Release shard
        run: |
          set -euo pipefail
          python3 control/scripts/upload_harvard_epoch_ii.py \
            --manifest "$MANIFEST" --sums "$HARVARD_SUMS" upload \
            --group release --shard-index '${{ matrix.shard }}' --shard-count 8 \
            --work-dir "$RUNNER_TEMP/upload-work" \
            --receipt "$RUNNER_TEMP/receipt-release-${{ matrix.shard }}.json"
      - name: Preserve PASS receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-receipt-release-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/receipt-release-${{ matrix.shard }}.json
            ${{ runner.temp }}/toolchain-provenance-release-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: error

  rebuild-verify-and-upload-candidate:
    if: github.event_name == 'push'
    needs: upload-release-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Checkout frozen source commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: source
          ref: 3bdf9121fb9e98cd9ba9de62a2466367d0968e4e
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-candidate.json"
      - name: Reuse exact successful frozen audit artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10297254508/zip"
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url" -o "$RUNNER_TEMP/inventory.zip"
          echo 'a0e975e93ab3f36b21cff2809d4f6cacff3bd6a7ab9843fdfe0ca48b103b3418  '"$RUNNER_TEMP/inventory.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/inventory"
          unzip -q "$RUNNER_TEMP/inventory.zip" -d "$RUNNER_TEMP/inventory"
      - name: Populate verified object cache once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys
          source = pathlib.Path('source').resolve()
          sys.path.insert(0, str(source / 'scripts'))
          import build_epoch_ii_content_candidate as build
          inventory = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'inventory/epoch-ii-audit'
          store = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'objects'
          rows = build.load_json(inventory / 'RELEASE-ASSETS.json')
          objects = build.validate_release_rows(build.selected_release_rows(rows))
          build.verify_or_download_objects(store, objects, True, 8)
          PY
      - name: Rebuild exact frozen candidate and prove every byte
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate"
          python3 source/scripts/build_epoch_ii_content_candidate.py \
            --repository-root source \
            --inventory-dir "$RUNNER_TEMP/inventory/epoch-ii-audit" \
            --object-store "$RUNNER_TEMP/objects" \
            --output-dir "$candidate" --workers 8
          cp "$FROZEN_DIR/CONTENT-CANDIDATE.json" "$candidate/CONTENT-CANDIDATE.json"
          cp "$FROZEN_DIR/CANDIDATE-SHA256SUMS" "$candidate/SHA256SUMS"
          (cd "$candidate" && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import pathlib, os
          candidate=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate'
          expected={line.split('  ',1)[1] for line in (candidate/'SHA256SUMS').read_text().splitlines()}
          actual={p.relative_to(candidate).as_posix() for p in candidate.rglob('*') if p.is_file() and p.name!='SHA256SUMS'}
          if actual != expected:
              raise SystemExit(f'candidate file-set drift missing={expected-actual} extra={actual-expected}')
          print('candidate exact-byte identity PASS')
          PY
      - name: Clean-environment cold recovery and project verification
        run: |
          set -euo pipefail
          python3 source/scripts/verify_epoch_ii_content_candidate.py \
            --candidate-dir "$RUNNER_TEMP/candidate" \
            --object-store "$RUNNER_TEMP/objects" \
            --report "$RUNNER_TEMP/cold-recovery.json"
          python3 - <<'PY'
          import json, os, pathlib
          value=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'cold-recovery.json').read_text())
          if value.get('result') != 'pass': raise SystemExit(value)
          print('clean cold recovery PASS')
          PY
      - name: Upload 21 exact verification and cold-recovery files
        run: |
          set -euo pipefail
          python3 control/scripts/upload_harvard_epoch_ii.py \
            --manifest "$MANIFEST" --sums "$HARVARD_SUMS" upload \
            --group candidate --candidate-dir "$RUNNER_TEMP/candidate" \
            --work-dir "$RUNNER_TEMP/upload-work" \
            --receipt "$RUNNER_TEMP/receipt-candidate.json"
      - name: Preserve PASS receipts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-receipt-candidate
          path: |
            ${{ runner.temp }}/receipt-candidate.json
            ${{ runner.temp }}/cold-recovery.json
            ${{ runner.temp }}/toolchain-provenance-candidate.json
          retention-days: 90
          if-no-files-found: error

  verify-and-submit-once:
    if: github.event_name == 'push'
    needs:
      - upload-repository-and-controls
      - upload-release-assets
      - rebuild-verify-and-upload-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-final.json"
      - name: Download all PASS receipts from this run
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: epoch-ii-receipt-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true
      - name: Verify 419-file closure and submit exactly once
        run: |
          set -euo pipefail
          python3 control/scripts/upload_harvard_epoch_ii.py \
            --manifest "$MANIFEST" --sums "$HARVARD_SUMS" finalize \
            --receipt-dir "$RUNNER_TEMP/receipts" \
            --cold-receipt "$RUNNER_TEMP/receipts/cold-recovery.json" \
            --final-receipt "$RUNNER_TEMP/final-submission-receipt.json"
      - name: Preserve final receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-final-submission-receipt
          path: |
            ${{ runner.temp }}/final-submission-receipt.json
            ${{ runner.temp }}/toolchain-provenance-final.json
          retention-days: 90
          if-no-files-found: warn
