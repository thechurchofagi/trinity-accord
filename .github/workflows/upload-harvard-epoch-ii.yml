name: Upload Harvard Preservation Epoch II

on:
  pull_request:
    paths:
      - .github/workflows/upload-harvard-epoch-ii.yml
      - scripts/upload_harvard_epoch_ii.py
      - tests/test_upload_harvard_epoch_ii.py
      - preservation/epoch-ii/frozen/**
      - .github/harvard-epoch-ii-full-upload-authorized-v1
      - .github/harvard-epoch-ii-full-upload-resume-v3
      - .github/harvard-epoch-ii-full-upload-resume-v4
  push:
    branches: [main]
    paths:
      - .github/harvard-epoch-ii-full-upload-authorized-v1
      - .github/harvard-epoch-ii-full-upload-resume-v2
      - .github/harvard-epoch-ii-full-upload-resume-v3
      - .github/harvard-epoch-ii-full-upload-resume-v4

permissions:
  actions: read
  contents: read

concurrency:
  group: harvard-preservation-epoch-ii-dvn-w9y3iv
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  HARVARD_PID: doi:10.7910/DVN/W9Y3IV
  FROZEN_DIR: control/preservation/epoch-ii/frozen
  MANIFEST: control/preservation/epoch-ii/frozen/DATASET-MANIFEST.json
  HARVARD_SUMS: control/preservation/epoch-ii/frozen/HARVARD-EPOCH-II-SHA256SUMS

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-contract.json"
      - name: Verify immutable upload contract
        working-directory: control
        run: |
          set -euo pipefail
          test "$(cat .github/harvard-epoch-ii-full-upload-authorized-v1)" = \
            "Harvard Preservation Epoch II full upload authorized: doi:10.7910/DVN/W9Y3IV dataset-id=14229992 files=419 candidate=cd0bd263f548d23060422021408ab1705e8c48c1c1028f1a440eb89d1e88d7e8"
          test "$(cat .github/harvard-epoch-ii-full-upload-resume-v2)" = \
            "Harvard Preservation Epoch II idempotent resume authorized after signed x-amz-tagging fix: doi:10.7910/DVN/W9Y3IV dataset-id=14229992"
          test "$(cat .github/harvard-epoch-ii-full-upload-resume-v3)" = \
            "Harvard Preservation Epoch II idempotent resume authorized after serializing Dataverse dataset writes: doi:10.7910/DVN/W9Y3IV dataset-id=14229992"
          test "$(cat .github/harvard-epoch-ii-full-upload-resume-v4)" = \
            "Harvard Preservation Epoch II idempotent resume authorized after streaming readback error-path fix: doi:10.7910/DVN/W9Y3IV dataset-id=14229992"
          python3 -m unittest tests.test_upload_harvard_epoch_ii

  upload-repository-and-controls:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Checkout frozen source commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: source
          ref: 3bdf9121fb9e98cd9ba9de62a2466367d0968e4e
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-repository.json"
      - name: Upload 206 frozen repository files and two controls
        run: |
          set -euo pipefail
          python3 control/scripts/upload_harvard_epoch_ii.py \
            --manifest "$MANIFEST" --sums "$HARVARD_SUMS" upload \
            --group repository --source-repo source \
            --work-dir "$RUNNER_TEMP/upload-work" \
            --receipt "$RUNNER_TEMP/receipt-repository.json"
      - name: Preserve PASS receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-receipt-repository
          path: |
            ${{ runner.temp }}/receipt-repository.json
            ${{ runner.temp }}/toolchain-provenance-repository.json
          retention-days: 90
          if-no-files-found: error

  # Dataverse serializes Dataset mutations internally; keep every add-file call in one lane.
  upload-release-assets:
    if: github.event_name == 'push'
    needs: upload-repository-and-controls
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-release-${{ matrix.shard }}.json"
      - name: Download, verify, upload and full-readback Release shard
        run: |
          set -euo pipefail
          python3 control/scripts/upload_harvard_epoch_ii.py \
            --manifest "$MANIFEST" --sums "$HARVARD_SUMS" upload \
            --group release --shard-index '${{ matrix.shard }}' --shard-count 8 \
            --work-dir "$RUNNER_TEMP/upload-work" \
            --receipt "$RUNNER_TEMP/receipt-release-${{ matrix.shard }}.json"
      - name: Preserve PASS receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-receipt-release-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/receipt-release-${{ matrix.shard }}.json
            ${{ runner.temp }}/toolchain-provenance-release-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: error

  reuse-successful-pass-receipts:
    if: github.event_name == 'push'
    needs: upload-release-assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-reused.json"
      - name: Reuse exact successful candidate and Release-shard receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reused-receipts"
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10300896597/zip" \
            -o "$RUNNER_TEMP/candidate-receipt.zip"
          echo '91f53898060bb8fa03d50c0d333526c10d3ba4554ced7be97017a4d478822ca8  '"$RUNNER_TEMP/candidate-receipt.zip" | sha256sum -c -
          curl --fail --location --retry 5 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10301127155/zip" \
            -o "$RUNNER_TEMP/release-3-receipt.zip"
          echo 'ef6a8c578912a9e6973a8cd2cddfd56551ee41148d816704dc2577aec8585c95  '"$RUNNER_TEMP/release-3-receipt.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/candidate-receipt.zip" -d "$RUNNER_TEMP/reused-receipts"
          unzip -q "$RUNNER_TEMP/release-3-receipt.zip" -d "$RUNNER_TEMP/reused-receipts"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reused-receipts'
          expected = {'receipt-candidate.json': 21, 'receipt-release-3.json': 24}
          for name, count in expected.items():
              value = json.loads((root / name).read_text())
              assert value['schema'] == 'trinityaccord.harvard-epoch-ii-upload-receipt.v1'
              assert value['status'] == 'pass'
              assert value['files_verified'] == count == len(value['rows'])
          cold = json.loads((root / 'cold-recovery.json').read_text())
          assert str(cold.get('result', '')).lower() == 'pass'
          print('immutable successful receipts and clean cold recovery reused: PASS')
          PY
      - name: Preserve reused PASS receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-receipt-reused-successes
          path: |
            ${{ runner.temp }}/reused-receipts/receipt-candidate.json
            ${{ runner.temp }}/reused-receipts/receipt-release-3.json
            ${{ runner.temp }}/reused-receipts/cold-recovery.json
            ${{ runner.temp }}/reused-receipts/toolchain-provenance-candidate.json
            ${{ runner.temp }}/reused-receipts/toolchain-provenance-release-3.json
            ${{ runner.temp }}/toolchain-provenance-reused.json
          retention-days: 90
          if-no-files-found: error

  verify-and-submit-once:
    if: github.event_name == 'push'
    needs:
      - upload-repository-and-controls
      - upload-release-assets
      - reuse-successful-pass-receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: control
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        working-directory: control
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-final.json"
      - name: Download all PASS receipts from this run
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: epoch-ii-receipt-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true
      - name: Verify 419-file closure and submit exactly once
        run: |
          set -euo pipefail
          python3 control/scripts/upload_harvard_epoch_ii.py \
            --manifest "$MANIFEST" --sums "$HARVARD_SUMS" finalize \
            --receipt-dir "$RUNNER_TEMP/receipts" \
            --cold-receipt "$RUNNER_TEMP/receipts/cold-recovery.json" \
            --final-receipt "$RUNNER_TEMP/final-submission-receipt.json"
      - name: Preserve final receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-final-submission-receipt
          path: |
            ${{ runner.temp }}/final-submission-receipt.json
            ${{ runner.temp }}/toolchain-provenance-final.json
          retention-days: 90
          if-no-files-found: warn
