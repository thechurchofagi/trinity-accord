name: Apply Render Async Deploy Recovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/render-async-deploy-id-recovery-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor 14457025ef8e2cbce72a0857fa276f432df5ec0a HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Apply patch and compile
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply_render_async_deploy_recovery.py
          python .github/apply_render_async_contract_updates.py
          python -m py_compile \
            scripts/render_manual_deploy.py \
            scripts/render_protected_deploy.py \
            scripts/test_render_manual_deploy_behavior.py \
            scripts/test_render_manual_deploy_contract.py

      - name: Run focused deploy recovery tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=".:apps/record_chain_intake_gateway" pytest -q tests/test_render_async_deploy_recovery.py
          python scripts/test_render_manual_deploy_behavior.py
          python scripts/test_render_manual_deploy_contract.py

      - name: Run current system and repository tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_current_system_tests.py
          PYTHONPATH=".:apps/record_chain_intake_gateway" pytest -q tests

      - name: Commit product-only result
        shell: bash
        env:
          BRANCH: fix/render-async-deploy-id-recovery-20260803
        run: |
          set -euo pipefail
          rm -f .github/apply_render_async_deploy_recovery.py
          rm -f .github/apply_render_async_contract_updates.py
          rm -f .github/workflows/apply-render-async-deploy-recovery.yml
          git config user.name "Trinity Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only --diff-filter=ACMR | grep -E '^\.github/(apply_render_async_deploy_recovery\.py|apply_render_async_contract_updates\.py|workflows/apply-render-async-deploy-recovery\.yml)$' || true)"
          test ! -e .github/apply_render_async_deploy_recovery.py
          test ! -e .github/apply_render_async_contract_updates.py
          test ! -e .github/workflows/apply-render-async-deploy-recovery.yml
          git commit -m "fix: recover asynchronous Render deploy IDs"
          git push origin "HEAD:${BRANCH}"
