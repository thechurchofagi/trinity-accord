name: Museum candidate check
on:
  push:
    branches: [codex/museum-six-rooms-guardian-v1-1]
    paths: ['.github/workflows/museum-candidate-check.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: museum-final-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: museum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: expressive-guide-*
          run-id: 34173312397
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/speech-input
          merge-multiple: true
      - name: Install acoustic and browser inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install faster-whisper==1.2.0 requests==2.32.5 num2words==0.5.14 numpy==1.26.4 playwright==1.55.0
          python -c 'from faster_whisper import WhisperModel; import requests'
          python -m playwright install chromium
          cd museum && npm ci
      - name: Independently audit and bind new English speech
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -euo pipefail
          python museum/scripts/audit_expressive_narration.py --input "$RUNNER_TEMP/speech-input" --dist museum/dist 2>&1 | tee "$RUNNER_TEMP/acoustic.log"
      - name: Bind inventory and run all regressions
        run: |
          set -euo pipefail
          python museum/scripts/finish_spatial_edition.py
          node museum/scripts/build_runtime.mjs
          python museum/scripts/build_archive.py
          python museum/scripts/validate.py
          for script in museum/scripts/check_*.mjs; do echo "$script"; node "$script"; done
      - name: Render desktop/mobile and play both actual language tracks
        env:
          MUSEUM_QA_OUTPUT: ${{ runner.temp }}/candidate-browser
        run: python museum/scripts/check_browser.py
      - name: Commit candidate only to the existing PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/museum-six-rooms-guardian-v1-1
          git add museum
          if git diff --cached --name-only | grep -qv '^museum/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='museum-edition-builder' -c user.email='actions@github.com' commit -m 'feat(museum): integrate acoustically reviewed expressive English narration'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/museum-six-rooms-guardian-v1-1
          unset AUTH
      - name: Preserve candidate and audit even on failure
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/candidate-head.txt"
          if [ -f museum/dist/data/expressive-audio-audit.json ]; then cp museum/dist/data/expressive-audio-audit.json "$RUNNER_TEMP/expressive-audio-audit.json"; fi
          tar --exclude='node_modules' --exclude='__pycache__' -czf "$RUNNER_TEMP/museum-candidate.tar.gz" museum
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: museum-candidate-review
          path: |
            ${{ runner.temp }}/museum-candidate.tar.gz
            ${{ runner.temp }}/candidate-head.txt
            ${{ runner.temp }}/candidate-browser
            ${{ runner.temp }}/acoustic.log
            ${{ runner.temp }}/expressive-audio-audit.json
          retention-days: 7
          if-no-files-found: error
