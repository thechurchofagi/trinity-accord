name: Publish UCT Paper C exact reviewed Zenodo package
on:
  push:
    branches: [research/uct-paper-c-v1-20261004]
    paths:
      - research/unified-consciousness-theory-iii/PUBLISH-AUTHORIZATION.json
      - research/unified-consciousness-theory-iii/visual-review.json
      - .github/workflows/publish-uct-paper-c.yml
permissions:
  contents: write
concurrency:
  group: uct-paper-c-zenodo-v1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta23-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/uct-paper-c-v1-20261004
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"
      - name: Run focused offline gate tests
        run: python3 research/unified-consciousness-theory-iii/test_publication.py
      - name: Check immutable package before credential access
        run: python3 research/unified-consciousness-theory-iii/publication.py verify
      - name: Publish only the authorized reviewed package
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/unified-consciousness-theory-iii/publication.py publish
      - name: Preserve same-record state even after uncertainty
        if: always()
        run: python3 research/unified-consciousness-theory-iii/publication.py persist
      - name: Retain exact publication state and public readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uct-paper-c-publication-${{ github.run_id }}
          path: research/unified-consciousness-theory-iii/
          retention-days: 30
