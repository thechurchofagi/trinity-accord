# Corrected MGTD v1.0.1, version DOI 10.5281/zenodo.23241982: verified OTS before any guarded AR.
# guarded Arweave paid readback third. No upload can precede verified OTS.
name: Research MGTD v1.0.1 OTS and Arweave

on:
  push:
    branches: [main]
    paths: [.github/workflows/research-mgtd-v101-ots-arweave.yml]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: research/mgtd-method-v1-0-1-20261008
  BATCH: research/paper-timestamps/2026-10-08-mgtd-v101

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  preserve:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authorize workflow actor
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          GUARDIAN_REGISTRY_WORKFLOW_ACTORS: ${{ vars.GUARDIAN_REGISTRY_WORKFLOW_ACTORS }}
        run: |
          set -euo pipefail
          ALLOWLIST="${GUARDIAN_REGISTRY_WORKFLOW_ACTORS:-thechurchofagi}"
          if [ "$ACTOR" = 'github-actions[bot]' ]; then exit 0; fi
          case ",$ALLOWLIST," in
            *",$ACTOR,"*) echo "Authorized actor: $ACTOR" ;;
            *) echo "Unauthorized actor $ACTOR" >&2; exit 1 ;;
          esac
      - name: Checkout only the DOI-published research branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact DOI publication and skip completed batches
        id: validate
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys,urllib.request,urllib.parse
          root=pathlib.Path(os.environ['BATCH'])
          c=json.loads((root/'targets.json').read_text())
          assert c['batch']=='2026-10-08-mgtd-v101' and c['paper_count']==1
          p=c['papers'][0]
          assert (p['report'],p['record_id'],p['doi'],p['version'])==('METHOD20261008',23241982,'10.5281/zenodo.23241982','1.0.1')
          sys.path.insert(0, 'scripts')
          from research_paper_ots import validate_config
          papers,n=validate_config(root,c)
          assert n==1 and papers[0]['pdfs'][0]['sha256']=='98abef0e92d0bb599146cdf525d98acb7045a168912ec9e87ba7723bc958097c'
          complete=(root/'status.json').exists() and json.loads((root/'status.json').read_text()).get('state')=='ARWEAVE_READBACK_PASS'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'done={str(complete).lower()}\n')
          print('DOI_RELEASE_VERIFIED; BATCH_COMPLETE=',complete)
          PY
      - name: Record existing toolchain provenance
        if: steps.validate.outputs.done != 'true'
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.validate.outputs.done != 'true'
        with:
          python-version: '3.11'
      - name: Install pinned OTS client and test shared lifecycle contract
        if: steps.validate.outputs.done != 'true'
        run: |
          python3 -m pip install -r requirements-ots.txt
          python3 -m unittest tests.test_research_paper_ots -v
          node --check scripts/research_paper_budget.mjs
          node --check scripts/arweave_upload_payload.mjs
      - name: Upgrade, verify, or stamp only exact published PDF
        if: steps.validate.outputs.done != 'true'
        id: ots
        continue-on-error: true
        env:
          OTS_BITCOIN_NODE_URL: http://127.0.0.1:18443/
        run: |
          set -euo pipefail
          python3 scripts/bitcoin_esplora_rpc_proxy.py --host 127.0.0.1 --port 18443 \
            --trace "$RUNNER_TEMP/mgtd-ots-proxy.jsonl" --timeout 20 > "$RUNNER_TEMP/mgtd-ots-proxy.log" 2>&1 &
          proxy_pid=$!
          cleanup_proxy() {
            if kill -0 "$proxy_pid" 2>/dev/null; then kill "$proxy_pid"; fi
          }
          trap cleanup_proxy EXIT
          python3 scripts/research_paper_ots.py lifecycle --batch "${BATCH}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.ots.outputs.ready == 'true'
        with:
          node-version-file: .node-version
      - name: Confirm v1.0.1 remains the newest publicly resolved Zenodo version before AR
        if: steps.ots.outputs.ready == 'true'
        id: latest
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.parse,urllib.request
          v=json.loads(pathlib.Path('research/map-guided-theory-development/LATEST_AR_VERSION.json').read_text())
          assert (v['current_version'],v['doi'],v['record_id'])==('1.0.1','10.5281/zenodo.23241982',23241982)
          assert v['previous_version']['arweave']=='PERMANENTLY_DISABLED'
          good=False
          try:
              req=urllib.request.Request('https://doi.org/'+v['concept_doi'],headers={'User-Agent':'MGTD-Latest-Arweave-Gate/1.0'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  u=urllib.parse.urlsplit(resp.url)
                  good=u.hostname=='zenodo.org' and u.path.rstrip('/') in ('/record/23241982','/records/23241982')
          except Exception as exc:
              print('Concept DOI readback pending:',type(exc).__name__)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('current='+str(good).lower()+'\n')
          print('LATEST_VERSION_CONFIRMED' if good else 'LATEST_DOI_NOT_VERIFIED_ARWEAVE_BLOCKED')
          PY
      - name: Check strictly-limited dedicated paper budget
        if: steps.ots.outputs.ready == 'true' && steps.latest.outputs.current == 'true'
        id: budget
        run: node scripts/research_arweave_allowance.mjs "${BATCH}"
      - name: Install existing Arweave uploader dependencies
        if: steps.ots.outputs.ready == 'true' && steps.budget.outputs.allowed == 'true'
        run: npm ci
      - name: Persist one payload-bound paid-intent checkpoint
        if: steps.ots.outputs.ready == 'true' && steps.budget.outputs.allowed == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['BATCH'])
          bundle=root/'arweave-bundle.json'
          digest=hashlib.sha256(bundle.read_bytes()).hexdigest()
          intent=root/'paid-intent.json'
          receipt=root/'arweave-receipt.json'
          prior=json.loads(receipt.read_text()) if receipt.exists() else {}
          if intent.exists():
              old=json.loads(intent.read_text())
              if old.get('payload_sha256')!=digest:raise RuntimeError('Paid intent changed payload identity')
              if not (prior.get('tx_id') or prior.get('txid')):
                  raise RuntimeError('Ambiguous previous paid attempt; no automatic second transaction')
          elif prior.get('tx_id') or prior.get('txid'):
              raise RuntimeError('Paid receipt without prior frozen intent')
          else:
              intent.write_text(json.dumps({'state':'PAID_ATTEMPT_INTENT','payload_sha256':digest,
                  'report':'METHOD20261008','doi':'10.5281/zenodo.23241982',
                  'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT']},indent=2)+'\n')
          PY
          git config user.name 'trinity-ots-bot'
          git config user.email 'actions@github.com'
          git add "${BATCH}/paid-intent.json"
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] MGTD payload-bound paid intent before first archive attempt'
            git push origin HEAD:"${TARGET_BRANCH}"
          fi
      - name: Post one guarded Arweave transaction and verify public bytes
        if: steps.ots.outputs.ready == 'true' && steps.budget.outputs.allowed == 'true'
        id: upload
        continue-on-error: true
        env:
          ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
          NODE_OPTIONS: --import=./scripts/arweave_runtime_spend_guard.mjs
          ARWEAVE_MINIMUM_REMAINING_AR: '0.25'
          ARWEAVE_MAX_PAYLOAD_BYTES: '4194304'
          ARWEAVE_MAX_TRANSACTION_REWARD_AR: '0.099999999999'
          ARWEAVE_ROLLING_30_DAY_SPEND_LIMIT_AR: '0.50'
          ARWEAVE_READBACK_MAX_SECONDS: '420'
          ARWEAVE_HTTP_TIMEOUT_MS: '30000'
        run: python3 scripts/research_paper_ots.py upload --batch "${BATCH}"
      - name: Retain exact proofs, pending proofs, budget, and paid outcomes
        if: always() && steps.validate.outputs.done != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mgtd-ots-arweave-${{ github.run_id }}
          path: |
            research/paper-timestamps/2026-10-08-mgtd-v101/
            ${{ runner.temp }}/mgtd-ots-proxy.jsonl
            ${{ runner.temp }}/toolchain-provenance.json
          retention-days: 90
          if-no-files-found: warn
      - name: Commit actual stage receipts to the separate research branch
        if: always() && steps.validate.outputs.done != 'true'
        run: |
          set -euo pipefail
          git config user.name 'trinity-ots-bot'
          git config user.email 'actions@github.com'
          git add "${BATCH}" record-chain/arweave-wallet-ledger.json api/arweave-wallet-status.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[skip ci] Preserve MGTD v1.0.1 OTS and Arweave verified stage'
          for attempt in 1 2 3; do
            if git push origin HEAD:"${TARGET_BRANCH}"; then exit 0; fi
            git fetch origin "${TARGET_BRANCH}" --prune
            git rebase "origin/${TARGET_BRANCH}" || { git rebase --abort; exit 1; }
          done
          echo 'Remote stage conflict: inspect retained workflow artifact before re-execution.' >&2
          exit 1
      - name: Signal only real failing stages
        if: always()
        env:
          OTS_OUTCOME: ${{ steps.ots.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python3 - <<'PY'
          import os
          failed=[n for n in ('OTS_OUTCOME','UPLOAD_OUTCOME') if os.environ.get(n)=='failure']
          if failed:raise SystemExit('Stages still incomplete: '+', '.join(failed))
          print('Pending OTS confirmations will be revisited on next scheduled run; no premature Arweave upload.')
          PY
