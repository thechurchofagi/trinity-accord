name: Harvard Software Review Components v2

on:
  push:
    branches:
      - main
    paths:
      - .github/harvard-software-review-components-trigger-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harvard-software-review-components-v2
  cancel-in-progress: false

jobs:
  upload-review-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
      HARVARD_PID: doi:10.7910/DVN/YUCG12
      HARVARD_DATASET_ID: '14153533'
      HARVARD_ARCHIVE_FILE_ID: '14153535'
      HARVARD_ARCHIVE_NAME: trinity-accord-full-project-preservation-bundle.github-artifact.zip.bin
      HARVARD_ARTIFACT_BYTES: '1951603950'
      HARVARD_ARTIFACT_SHA256: 9c3c8bd513dfe4919efe56084c138fce18de313f59d67cd7c9484d9b5b75c9f2
      HARVARD_BUNDLE_IDENTITY_SHA256: 4930b9d6cd4968f3ba75de9dc46a396af7f37f97d128d1619ae829239656989d
      HARVARD_TERMS_SHA256: 81499f397fa433c9fa50ce36def425bb3ae318e28fe7eab9b0f5e02063b5b140
      SOURCE_COMMIT: 07cd79ba7b98294a0ff9bc45d76f305609f8a0aa
    steps:
      - name: Checkout current control state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
          lfs: false

      - name: Fetch exact preserved source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"

      - name: Build reviewable software-sharing companions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harvard-review"
          SOURCE_SHORT="${SOURCE_COMMIT:0:12}"
          SOURCE_ZIP="trinity-accord-source-${SOURCE_SHORT}.zip"
          SOURCE_WRAPPER="trinity-accord-source-${SOURCE_SHORT}.upload-wrapper.zip"
          git archive --format=zip \
            --prefix=trinity-accord-07cd79ba7b98/ \
            -o "$RUNNER_TEMP/harvard-review/$SOURCE_ZIP" \
            "$SOURCE_COMMIT"
          git show "$SOURCE_COMMIT:README.md" > "$RUNNER_TEMP/harvard-review/README-07cd79ba7b98.md"
          git show "$SOURCE_COMMIT:CITATION.cff" > "$RUNNER_TEMP/harvard-review/CITATION-07cd79ba7b98.cff"
          git show "$SOURCE_COMMIT:package.json" > "$RUNNER_TEMP/harvard-review/package-07cd79ba7b98.json"
          git show "$SOURCE_COMMIT:package-lock.json" > "$RUNNER_TEMP/harvard-review/package-lock-07cd79ba7b98.json"
          git show "$SOURCE_COMMIT:requirements-ci.txt" > "$RUNNER_TEMP/harvard-review/requirements-ci-07cd79ba7b98.txt"
          git show "$SOURCE_COMMIT:requirements-ots.txt" > "$RUNNER_TEMP/harvard-review/requirements-ots-07cd79ba7b98.txt"
          git ls-tree -r -l "$SOURCE_COMMIT" > "$RUNNER_TEMP/harvard-review/SOURCE-TREE-07cd79ba7b98.txt"
          test "$(wc -l < "$RUNNER_TEMP/harvard-review/SOURCE-TREE-07cd79ba7b98.txt")" -eq 5379
          cp preservation/SOFTWARE-REVIEW-README-v2.md "$RUNNER_TEMP/harvard-review/SOFTWARE-REVIEW-README-v2.md"
          test "$(sha256sum "$RUNNER_TEMP/harvard-review/SOFTWARE-REVIEW-README-v2.md" | cut -d' ' -f1)" = "37dc90e492d8b98823167169d9e6775f4a423715b086264c43edbfefe1272029"
          python3 - <<'PY'
          import hashlib, os, shutil, zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'harvard-review'
          short=os.environ['SOURCE_COMMIT'][:12]
          source=root/f'trinity-accord-source-{short}.zip'
          wrapper=root/f'trinity-accord-source-{short}.upload-wrapper.zip'
          info=zipfile.ZipInfo(source.name, date_time=(1980, 1, 1, 0, 0, 0))
          info.compress_type=zipfile.ZIP_STORED
          info.external_attr=0o100644 << 16
          with zipfile.ZipFile(wrapper, 'w', allowZip64=True) as zf:
              with source.open('rb') as src, zf.open(info, 'w', force_zip64=True) as dst:
                  shutil.copyfileobj(src, dst, length=1024*1024)
          def sha256_stream(stream):
              h=hashlib.sha256(); size=0
              for chunk in iter(lambda:stream.read(1024*1024), b''):
                  size += len(chunk); h.update(chunk)
              return size,h.hexdigest()
          with source.open('rb') as src:
              source_size,source_sha=sha256_stream(src)
          with zipfile.ZipFile(wrapper) as zf:
              if zf.namelist() != [source.name]:
                  raise SystemExit('double-ZIP transport contains unexpected entries')
              with zf.open(source.name) as inner:
                  inner_size,inner_sha=sha256_stream(inner)
              if (inner_size,inner_sha) != (source_size,source_sha):
                  raise SystemExit('double-ZIP transport verification failed')
          PY
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'harvard-review'
          short=os.environ['SOURCE_COMMIT'][:12]
          source_name=f'trinity-accord-source-{short}.zip'
          wrapper_name=f'trinity-accord-source-{short}.upload-wrapper.zip'
          def file_sha256(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              return h.hexdigest()
          files=[]
          for p in sorted(root.iterdir()):
              if p.name in {wrapper_name, 'harvard-software-review-manifest-v2.json', 'SHA256SUMS-v2.txt'}:
                  continue
              h=hashlib.sha256(); size=0
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''):
                      size += len(chunk); h.update(chunk)
              files.append({'filename':p.name,'bytes':size,'sha256':h.hexdigest()})
          manifest={
              'schema':'trinity-accord.harvard-software-review-manifest.v2',
              'purpose':'Supplementary review companions requested by Harvard Dataverse curator; these files improve software-resource inspectability and do not replace or amend the preserved archive.',
              'persistent_id':os.environ['HARVARD_PID'],
              'dataset_id':int(os.environ['HARVARD_DATASET_ID']),
              'source_commit':os.environ['SOURCE_COMMIT'],
              'preserved_archive':{
                  'file_id':int(os.environ['HARVARD_ARCHIVE_FILE_ID']),
                  'filename':os.environ['HARVARD_ARCHIVE_NAME'],
                  'bytes':int(os.environ['HARVARD_ARTIFACT_BYTES']),
                  'sha256':os.environ['HARVARD_ARTIFACT_SHA256'],
                  'bundle_identity_sha256':os.environ['HARVARD_BUNDLE_IDENTITY_SHA256'],
                  'replaced':False,
                  'reuploaded':False,
              },
              'authority':{
                  'deposit_role':'second_institutional_non_amending_mirror',
                  'canonical_authority':'three Bitcoin Originals only',
                  'canonical_authority_changed':False,
              },
              'software_packaging':{
                  'tracked_file_count':sum(1 for _ in (root/'SOURCE-TREE-07cd79ba7b98.txt').open('r',encoding='utf-8')),
                  'source_zip':source_name,
                  'source_zip_generation':'git archive from exact source_commit',
                  'dataverse_zip_ingest_limit':1500,
                  'upload_transport':'single-entry outer ZIP; outer layer is ingested and inner source ZIP remains as one DataFile',
              },
              'transport_wrapper':{
                  'filename':wrapper_name,
                  'bytes':(root/wrapper_name).stat().st_size,
                  'sha256':file_sha256(root/wrapper_name),
              },
              'review_components':files,
          }
          (root/'harvard-software-review-manifest-v2.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          find "$RUNNER_TEMP/harvard-review" -maxdepth 1 -type f \
            ! -name "$SOURCE_WRAPPER" ! -name 'SHA256SUMS-v2.txt' -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed "s#${RUNNER_TEMP}/harvard-review/##" \
            > "$RUNNER_TEMP/harvard-review/SHA256SUMS-v2.txt"

      - name: Verify live Harvard draft and upload only supplementary review files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'httpx==0.27.0'
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import httpx

          SERVER='https://dataverse.harvard.edu'
          token=os.environ['HD_API_TOKEN'].strip()
          if not token: raise SystemExit('HD_API_TOKEN missing')
          pid=os.environ['HARVARD_PID']
          dataset_id=int(os.environ['HARVARD_DATASET_ID'])
          archive_file_id=int(os.environ['HARVARD_ARCHIVE_FILE_ID'])
          archive_name=os.environ['HARVARD_ARCHIVE_NAME']
          archive_bytes=int(os.environ['HARVARD_ARTIFACT_BYTES'])
          archive_sha=os.environ['HARVARD_ARTIFACT_SHA256'].lower()
          bundle_identity=os.environ['HARVARD_BUNDLE_IDENTITY_SHA256'].lower()
          terms_sha=os.environ['HARVARD_TERMS_SHA256'].lower()
          root=Path(os.environ['RUNNER_TEMP'])/'harvard-review'
          headers={'X-Dataverse-key':token,'User-Agent':'trinity-accord-harvard-review-components-v2'}

          def req_ok(r, expected, label):
              if r.status_code not in expected:
                  raise SystemExit(f'{label}: HTTP {r.status_code}: {r.text[:1500]}')
              return r
          def latest_version(data):
              v=data.get('latestVersion') or data.get('latestVersionInfo')
              if not isinstance(v,dict): raise SystemExit('Harvard latestVersion missing')
              return v
          def files_in(v): return [x for x in (v.get('files') or []) if isinstance(x,dict)]
          def file_meta(item):
              df=item.get('dataFile') or {}
              return int(df.get('id') or -1), str(df.get('filename') or ''), int(df.get('filesize') or -1)
          def digest(path, algorithm):
              h=hashlib.new(algorithm)
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              return h.hexdigest().lower()
          def verify_existing(item, path, label):
              file_id,name,size=file_meta(item)
              if size != path.stat().st_size:
                  raise SystemExit(f'{label}: existing file size mismatch id={file_id} observed={size} expected={path.stat().st_size}')
              checksum=(item.get('dataFile') or {}).get('checksum') or {}
              ctype=str(checksum.get('type') or '').upper()
              cvalue=str(checksum.get('value') or '').lower()
              algorithms={'MD5':'md5','SHA-1':'sha1','SHA-256':'sha256','SHA-512':'sha512'}
              if ctype not in algorithms or not cvalue:
                  raise SystemExit(f'{label}: existing file has no supported checksum id={file_id} type={ctype!r}')
              if cvalue != digest(path,algorithms[ctype]):
                  raise SystemExit(f'{label}: existing file checksum mismatch id={file_id} type={ctype}')
              print(f'COMPANION VERIFIED existing id={file_id} name={name} checksum_type={ctype}')
          def upload(client, path, upload_name, mime, description, category):
              meta=json.dumps({'description':description,'directoryLabel':'software-review','categories':[category],'restrict':'false','tabIngest':'false'})
              with path.open('rb') as f:
                  response=client.post(f'{SERVER}/api/datasets/:persistentId/add',headers=headers,params={'persistentId':pid},files={'file':(upload_name,f,mime)},data={'jsonData':meta},timeout=600)
              req_ok(response,{200,201},f'upload {upload_name}')
              print(f'UPLOAD PASS {upload_name}')

          with httpx.Client(follow_redirects=True, timeout=httpx.Timeout(120.0,read=300.0)) as c:
              r=req_ok(c.get(f'{SERVER}/api/datasets/:persistentId/',headers=headers,params={'persistentId':pid}),{200},'dataset read')
              data=r.json().get('data') or {}
              if int(data.get('id') or -1) != dataset_id: raise SystemExit('dataset id mismatch')
              v=latest_version(data)
              if str(v.get('versionState') or '') != 'DRAFT': raise SystemExit(f'expected returned DRAFT, got {v.get("versionState")!r}')
              lock=req_ok(c.get(f'{SERVER}/api/datasets/{dataset_id}/locks',headers=headers,params={'type':'InReview'}),{200},'lock read').json().get('data') or []
              if any(isinstance(x,dict) and x.get('lockType')=='InReview' for x in lock): raise SystemExit('InReview lock present; refusing review-component mutation')
              terms=str(v.get('termsOfUse') or '').replace('\r\n','\n').replace('\r','\n').strip()
              if hashlib.sha256(terms.encode('utf-8')).hexdigest().lower() != terms_sha: raise SystemExit('frozen Terms of Use hash mismatch; refusing upload')

              items=files_in(v)
              archive=[x for x in items if file_meta(x)[1]==archive_name]
              if len(archive)!=1: raise SystemExit('required preserved archive not uniquely present')
              aid,aname,asize=file_meta(archive[0])
              if aid!=archive_file_id or aname!=archive_name or asize!=archive_bytes: raise SystemExit(f'preserved archive identity mismatch id={aid} name={aname} size={asize}')

              state=json.loads(Path('preservation/harvard-dataverse-state.json').read_text(encoding='utf-8'))
              src=state.get('source') or {}
              invariants=(state.get('persistent_id')==pid and int(state.get('dataset_id') or -1)==dataset_id and int(state.get('archive_file_id') or -1)==archive_file_id and state.get('authenticated_readback_verified') is True and int(state.get('authenticated_readback_bytes') or -1)==archive_bytes and str(state.get('authenticated_readback_sha256') or '').lower()==archive_sha and str(src.get('artifact_filename') or '')==archive_name and int(src.get('artifact_bytes') or -1)==archive_bytes and str(src.get('artifact_sha256') or '').lower()==archive_sha and str(src.get('bundle_identity_sha256') or '').lower()==bundle_identity)
              if not invariants: raise SystemExit('immutable archive/readback invariants do not match; refusing supplementary upload')

              existing={file_meta(x)[1]:x for x in items}
              components={
                  'README-07cd79ba7b98.md':('text/markdown','Human-readable project overview from the exact preserved source commit.','Documentation'),
                  'CITATION-07cd79ba7b98.cff':('application/x-yaml','Citation metadata from the exact preserved source commit.','Documentation'),
                  'package-07cd79ba7b98.json':('application/json','Node.js direct dependency metadata from the exact preserved source commit.','Code'),
                  'package-lock-07cd79ba7b98.json':('application/json','Node.js locked dependency graph from the exact preserved source commit.','Code'),
                  'requirements-ci-07cd79ba7b98.txt':('text/plain','Python verification and CI dependency metadata from the exact preserved source commit.','Code'),
                  'requirements-ots-07cd79ba7b98.txt':('text/plain','Python OpenTimestamps dependency metadata from the exact preserved source commit.','Code'),
                  'SOURCE-TREE-07cd79ba7b98.txt':('text/plain','Complete Git tree listing with blob identities and sizes for the exact preserved source commit.','Documentation'),
                  'SOFTWARE-REVIEW-README-v2.md':('text/markdown','Software-resource packaging, inspection, execution, dependency, output, rights, and authority guide.','Documentation'),
                  'harvard-software-review-manifest-v2.json':('application/json','Machine-readable manifest tying review companions to the unchanged preserved archive.','Documentation'),
                  'SHA256SUMS-v2.txt':('text/plain','SHA-256 checksums for the supplementary review companions.','Documentation'),
              }
              # Verify every pre-existing partial v1/v2 component before making
              # any new mutation. A same-name mismatch is never silently skipped.
              for name in components:
                  if name in existing:
                      verify_existing(existing[name],root/name,name)

              # The failed v1 attempt proved that Harvard expands ZIP uploads and
              # enforces a 1,500-entry limit. A single-entry outer ZIP is the
              # Dataverse-supported workaround: only the outer layer is ingested,
              # leaving the exact 5,379-file git-archive ZIP as one DataFile.
              source_name='trinity-accord-source-07cd79ba7b98.zip'
              source_path=root/source_name
              if source_name in existing:
                  verify_existing(existing[source_name],source_path,source_name)
              else:
                  wrapper=root/'trinity-accord-source-07cd79ba7b98.upload-wrapper.zip'
                  upload(c,wrapper,wrapper.name,'application/zip','Transport wrapper containing exactly one reviewable source ZIP; used only to satisfy Dataverse ZIP-ingest limits.','Code')

              # Add the small open-format companions only after the source-package
              # transport succeeds, minimizing partial draft changes on failure.
              for name,(mime,desc,category) in components.items():
                  if name not in existing:
                      upload(c,root/name,name,mime,desc,category)

              r=req_ok(c.get(f'{SERVER}/api/datasets/:persistentId/',headers=headers,params={'persistentId':pid}),{200},'post-upload dataset read')
              data2=r.json().get('data') or {}
              if int(data2.get('id') or -1)!=dataset_id: raise SystemExit('dataset id changed after upload')
              v2=latest_version(data2)
              if str(v2.get('versionState') or '')!='DRAFT': raise SystemExit('version state changed during companion upload')
              terms2=str(v2.get('termsOfUse') or '').replace('\r\n','\n').replace('\r','\n').strip()
              if hashlib.sha256(terms2.encode('utf-8')).hexdigest().lower()!=terms_sha: raise SystemExit('terms changed during companion upload')
              items2=files_in(v2)
              amap=[x for x in items2 if file_meta(x)[1]==archive_name]
              if len(amap)!=1 or file_meta(amap[0])!=(archive_file_id,archive_name,archive_bytes): raise SystemExit('archive identity changed during companion upload')
              by_name2={file_meta(x)[1]:x for x in items2}
              required_names=list(components)+[source_name]
              missing=[n for n in required_names if n not in by_name2]
              if missing: raise SystemExit(f'review companions missing after upload: {missing}')
              for name in required_names:
                  verify_existing(by_name2[name],root/name,name)
              if 'trinity-accord-source-07cd79ba7b98.upload-wrapper.zip' in by_name2:
                  raise SystemExit('Dataverse preserved the outer transport wrapper instead of exposing the inner reviewable source ZIP')
              sr=c.post(f'{SERVER}/api/datasets/:persistentId/submitForReview',headers=headers,params={'persistentId':pid},timeout=120)
              req_ok(sr,{200,201,202},'submit for review')
              print('HARVARD SOFTWARE REVIEW COMPONENTS SUBMITTED')
          PY

      - name: Upload audit manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harvard-software-review-components-v2
          path: ${{ runner.temp }}/harvard-review/
          retention-days: 90
          if-no-files-found: warn
