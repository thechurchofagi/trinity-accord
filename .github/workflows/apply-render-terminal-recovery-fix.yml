name: Apply Render Terminal Recovery Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/render-skip-terminal-recovery-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm exact branch boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git merge-base --is-ancestor c982e86db76e1d4dd5958442f9b187cc283bd116 HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Apply product patch and compile
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply_render_terminal_recovery_fix.py
          python -m py_compile scripts/render_manual_deploy.py

      - name: Run focused Render recovery tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=".:apps/record_chain_intake_gateway" pytest -q \
            tests/test_render_async_deploy_recovery.py
          python scripts/test_render_manual_deploy_behavior.py
          python scripts/test_render_manual_deploy_contract.py

      - name: Run Current System and repository tests
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain)"
          test -z "$before"
          python scripts/run_current_system_tests.py
          PYTHONPATH=".:apps/record_chain_intake_gateway" pytest -q tests
          after="$(git status --porcelain)"
          test -z "$after"

      - name: Commit product-only result
        shell: bash
        env:
          BRANCH: fix/render-skip-terminal-recovery-20260803
        run: |
          set -euo pipefail
          rm -f .github/apply_render_terminal_recovery_fix.py
          rm -f .github/workflows/apply-render-terminal-recovery-fix.yml
          git config user.name "Trinity Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only --diff-filter=ACMR | grep -E '^\.github/(apply_render_terminal_recovery_fix\.py|workflows/apply-render-terminal-recovery-fix\.yml)$' || true)"
          test ! -e .github/apply_render_terminal_recovery_fix.py
          test ! -e .github/workflows/apply-render-terminal-recovery-fix.yml
          git commit -m "fix: skip terminal Render deploys during recovery"
          git push origin "HEAD:${BRANCH}"
