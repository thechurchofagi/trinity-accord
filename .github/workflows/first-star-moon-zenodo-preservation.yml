name: First Star-Moon Witness Zenodo Preservation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: ${{ vars.ZENODO_API_BASE || 'https://zenodo.org/api' }}
      RELEASE_TAG: first-star-moon-witness-encrypted-archive-v1
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py

      - name: Validate publisher and authorization
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish_second_star_moon_to_zenodo.py
          if [ -z "${ZENODO_ACCESS_TOKEN:-}" ]; then
            echo "ZENODO_ACCESS_TOKEN is not configured" >&2
            exit 1
          fi
          echo "[ZENODO AUTH] token_configured=true api_base=$ZENODO_API_BASE"

      - name: Download complete source Release
        id: source
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/first-star-moon-release"
          mkdir -p "$src"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,url,publishedAt > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os
          row=json.load(open(os.environ['RUNNER_TEMP']+'/release.json'))
          if row.get('tagName') != os.environ['RELEASE_TAG']:
              raise SystemExit('release tag mismatch')
          if row.get('isDraft') or row.get('isPrerelease'):
              raise SystemExit('source release is not a final public release')
          print('[SOURCE RELEASE] '+json.dumps(row, sort_keys=True))
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$src"
          count="$(find "$src" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          echo "[SOURCE DOWNLOAD] files=$count bytes=$(du -sb "$src" | awk '{print $1}')"
          echo "source_dir=$src" >> "$GITHUB_OUTPUT"

      - name: Publish, reconcile, and full-readback verify Zenodo record
        id: publish
        run: |
          set -euo pipefail
          python3 scripts/publish_second_star_moon_to_zenodo.py \
            --source-dir "${{ steps.source.outputs.source_dir }}" \
            --state-file archive/first-star-moon-zenodo-state.json \
            --api-base "$ZENODO_API_BASE" | tee "$RUNNER_TEMP/zenodo-publish.log"
          test -s archive/first-star-moon-zenodo-state.json
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('archive/first-star-moon-zenodo-state.json')
          row=json.loads(p.read_text())
          if row.get('remote_full_readback_sha256_verified') is not True:
              raise SystemExit('remote readback verification not PASS')
          if row.get('verified_file_count') != 18:
              raise SystemExit('unexpected Zenodo file count')
          if row.get('verified_total_bytes') != 1233214975:
              raise SystemExit('unexpected total byte count')
          doi=row.get('doi')
          rid=row.get('record_id')
          if not doi or not rid:
              raise SystemExit('DOI or record id missing')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'doi={doi}\nrecord_id={rid}\n')
          print(f'[ZENODO VERIFIED] doi={doi} record_id={rid} files=18 bytes=1233214975')
          PY

      - name: Record verified Zenodo state in repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/first-star-moon-zenodo-state.json
          if git diff --cached --quiet; then
            echo "Zenodo state already recorded"
            exit 0
          fi
          git commit -m "archive: record Second Star-Moon Zenodo DOI"
          for attempt in 1 2 3 4; do
            git fetch origin main --prune
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "state push attempt $attempt failed; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "failed to persist Zenodo state after publication" >&2
          exit 1

      - name: Write publication summary
        if: always()
        run: |
          {
            echo "## First Star-Moon Witness — Zenodo preservation"
            echo
            if [ -s archive/first-star-moon-zenodo-state.json ]; then
              python3 - <<'PY'
          import json
          r=json.load(open('archive/first-star-moon-zenodo-state.json'))
          print(f"- DOI: `{r.get('doi')}`")
          print(f"- Record: https://zenodo.org/records/{r.get('record_id')}")
          print(f"- Files verified: {r.get('verified_file_count')}")
          print(f"- Bytes verified: {r.get('verified_total_bytes')}")
          print(f"- Full remote SHA-256 readback: {r.get('remote_full_readback_sha256_verified')}")
          PY
            else
              echo "- State file not produced; inspect the failed step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
