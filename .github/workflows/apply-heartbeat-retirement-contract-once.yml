name: Apply Heartbeat Retirement Contract Once

on:
  pull_request:
    types: [synchronize, opened, reopened]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: heartbeat-retirement-contract-once
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'thechurchofagi/trinity-accord' &&
      github.event.pull_request.number == 825 &&
      github.event.pull_request.head.ref == 'feat/weekly-continuity-archive-zenodo'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: feat/weekly-continuity-archive-zenodo

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply exact contract migration
        run: python3 scripts/patch_waiting_heartbeat_retirement_contract_once.py

      - name: Run focused heartbeat contract
        run: python3 scripts/test_waiting_heartbeat_summary_metrics.py

      - name: Commit final test and remove temporary machinery
        run: |
          set -euo pipefail
          rm .github/workflows/apply-heartbeat-retirement-contract-once.yml
          rm scripts/patch_waiting_heartbeat_retirement_contract_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: retire standalone heartbeat capsule workflow contract"
          git push origin HEAD:feat/weekly-continuity-archive-zenodo
