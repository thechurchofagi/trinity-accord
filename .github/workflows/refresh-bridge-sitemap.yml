name: Refresh published bridge sitemap
on:
  push:
    branches: [release/abundance-bridge-v1-doi-22895832]
    paths: [.github/workflows/refresh-bridge-sitemap.yml]
permissions:
  contents: write
concurrency:
  group: bridge-release-sitemap-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: release/abundance-bridge-v1-doi-22895832
          fetch-depth: 1
          show-progress: false
      - name: Regenerate only the existing sitemap artifact
        run: |
          python3 scripts/generate_sitemap.py
          python3 scripts/generate_sitemap.py --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: include two published bridge sources in generated sitemap'
          git push origin HEAD:release/abundance-bridge-v1-doi-22895832
