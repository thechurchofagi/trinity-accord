name: Reserve TA-TR-2026-02 v1.3 Zenodo DOI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reserve-ta-tr-2026-02-v1.3-zenodo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reserve-ta-tr-2026-02-v1.3-zenodo
  cancel-in-progress: false

jobs:
  reserve:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      RESERVATION_FILE: research/writing-before-the-outcome/zenodo-reservation.json
      PAPER_TITLE: "Writing Before the Outcome: Historical Position, Human-AI Authorship, and the Trinity Accord"
      PAPER_VERSION: "1.3"
    steps:
      - name: Checkout triggering main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify publication credential is present
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"

      - name: Recover or reserve one Zenodo DOI
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RESERVATION_FILE")"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          base = os.environ['ZENODO_API_BASE'].rstrip('/')
          token = os.environ['ZENODO_ACCESS_TOKEN']
          title = os.environ['PAPER_TITLE']
          version = os.environ['PAPER_VERSION']
          out = Path(os.environ['RESERVATION_FILE'])

          def request(method, url, payload=None):
              data = None
              headers = {'Authorization': f'Bearer {token}'}
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode('utf-8'))

          if out.exists():
              existing = json.loads(out.read_text(encoding='utf-8'))
              dep = request('GET', f"{base}/deposit/depositions/{existing['deposition_id']}")
              doi = dep.get('metadata', {}).get('prereserve_doi', {}).get('doi') or dep.get('doi')
              if doi != existing['doi']:
                  raise SystemExit('Existing reservation file does not match Zenodo draft.')
              print(f"Recovered existing reservation: {doi}")
              raise SystemExit(0)

          params = urllib.parse.urlencode({'status': 'draft', 'sort': '-mostrecent', 'size': 100})
          drafts = request('GET', f'{base}/deposit/depositions?{params}')
          matches = [
              d for d in drafts
              if d.get('metadata', {}).get('title') == title
              and str(d.get('metadata', {}).get('version', '')) == version
              and not d.get('submitted', False)
          ]
          if len(matches) > 1:
              raise SystemExit('Multiple matching unpublished Zenodo drafts exist; refusing to choose.')
          if matches:
              dep = matches[0]
          else:
              metadata = {
                  'title': title,
                  'upload_type': 'publication',
                  'publication_type': 'preprint',
                  'publication_date': '2026-08-12',
                  'creators': [{'name': 'Liu, Hongju'}],
                  'description': (
                      'A dated critical archival study of historical-position identity, hybrid human-AI authorship, '
                      'canonical closure, and future audit through the Trinity Accord case. This is a noncanonical '
                      'academic preprint and does not amend, supersede, or interpretively bind the three Bitcoin Originals.'
                  ),
                  'access_right': 'open',
                  'license': 'cc-by-4.0',
                  'language': 'eng',
                  'version': version,
                  'keywords': [
                      'historical position', 'human-AI authorship', 'future-directed communication',
                      'archival provenance', 'digital authenticity', 'AI agents', 'time capsules',
                      'interstellar messaging', 'hindsight bias', 'Trinity Accord'
                  ],
                  'notes': (
                      'Technical report TA-TR-2026-02. Version 1.3, frozen 12 August 2026. '
                      'Not part of the Trinity Accord Canon. AI-assisted research and drafting are disclosed in the manuscript. '
                      'Peer review: none.'
                  ),
                  'prereserve_doi': True,
              }
              dep = request('POST', f'{base}/deposit/depositions', {'metadata': metadata})

          doi = dep.get('metadata', {}).get('prereserve_doi', {}).get('doi')
          if not doi:
              raise SystemExit('Zenodo draft did not return a reserved DOI.')
          receipt = {
              'schema': 'trinityaccord.zenodo-reservation.v1',
              'title': title,
              'technical_report': 'TA-TR-2026-02',
              'version': version,
              'deposition_id': dep['id'],
              'record_id': dep.get('record_id') or dep['id'],
              'doi': doi,
              'state': dep.get('state'),
              'submitted': dep.get('submitted', False),
              'bucket_url': dep.get('links', {}).get('bucket'),
              'reserved_at_workflow_sha': os.environ.get('GITHUB_SHA'),
              'publication_status': 'reserved_not_published',
          }
          out.write_text(json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({k: receipt[k] for k in ('deposition_id','doi','publication_status')}, indent=2))
          PY

      - name: Commit reservation receipt to main
        run: |
          set -euo pipefail
          if git diff --quiet -- "$RESERVATION_FILE" && git ls-files --error-unmatch "$RESERVATION_FILE" >/dev/null 2>&1; then
            echo "Reservation already recorded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESERVATION_FILE"
          git commit -m "research: record reserved DOI for TA-TR-2026-02 v1.3"
          git push origin HEAD:main

      - name: Summary
        run: |
          set -euo pipefail
          doi="$(jq -r '.doi' "$RESERVATION_FILE")"
          dep="$(jq -r '.deposition_id' "$RESERVATION_FILE")"
          {
            echo "## TA-TR-2026-02 DOI reservation"
            echo
            echo "- DOI reserved: \`$doi\`"
            echo "- Zenodo deposition: \`$dep\`"
            echo "- State: reserved, not yet published"
          } >> "$GITHUB_STEP_SUMMARY"
