name: Publish Bitcoin12 DOI Closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-bitcoin12-external-closure.yml
      - preservation/bitcoin12-external-closure-authorization-v1.json

permissions:
  contents: write

concurrency:
  group: main-write-lock
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'thechurchofagi'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      RIGHTS_ACK: TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED
    steps:
      - name: Checkout exact main baseline with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-ci.txt

      - name: Verify DOI-only authorization and 12-item proof state
        id: preflight
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor 1b30048505af6968ef8fab61eb444a9ecb41ba1e "$source_sha"
          python3 evidence/bitcoin-inscription-proof-annex-v2/verification/verify_annex.py
          python3 scripts/build_final_evidence_inventory.py --check
          python3 - <<'PY'
          import json
          auth=json.load(open('preservation/bitcoin12-external-closure-authorization-v1.json'))
          required={
            'schema':'trinityaccord.bitcoin12-external-closure-authorization.v1',
            'sequence':1,'status':'pending','authorized_by':'thechurchofagi',
            'publication_scope':'doi_only_arweave_deferred',
            'required_ancestor_commit_sha':'1b30048505af6968ef8fab61eb444a9ecb41ba1e',
            'current_address_snapshot':12,'pre_canonical_formation':4,
            'canonical_originals':3,'post_canonical_non_amending':5,
            'core_concept_doi':'10.5281/zenodo.21739343',
            'publish_new_repository_doi_version':True,
            'publish_new_repository_arweave_capsule':False,
            'arweave_publication_status':'deferred_by_owner',
            'public_doi_cold_restore_required':True,
            'public_arweave_readback_required':False,
            'non_amending_boundary':True,
            'three_bitcoin_originals_remain_canonical':True,
          }
          for k,v in required.items():
              if auth.get(k)!=v: raise SystemExit(f'authorization mismatch: {k}')
          manifest=json.load(open('bitcoin-inscription-mirrors/address-wide/manifest.json'))
          if manifest.get('count')!=12: raise SystemExit('address-wide count is not 12')
          obj=next(x for x in manifest['objects'] if x['id'].startswith('8e81cf6054d37dc1'))
          if obj.get('inscription_metadata_length')!=2941: raise SystemExit('8e81 metadata length mismatch')
          if obj.get('inscription_metadata_sha256')!='1c51702f58b230caba573250769caecd0534f6c8002e16f2f182a16b19a27dcc': raise SystemExit('8e81 metadata hash mismatch')
          report=json.load(open('evidence/bitcoin-inscription-proof-annex-v2/reports/OFFLINE-VERIFICATION.json'))
          if report.get('result')!='PASS': raise SystemExit('Bitcoin v2 report not PASS')
          print('DOI-only preflight PASS: 12/12 v2, CBOR bound, Arweave explicitly deferred.')
          PY

      - name: Build exact repository preservation capsule
        id: capsule
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/repository-capsule"
          python3 scripts/build_preservation_capsule.py --repository-root . --commit "$SOURCE_SHA" --output-dir "$out"
          CAPSULE_DIR="$out" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from preservation_capsule import verify_local_package
          package=verify_local_package(Path(os.environ['CAPSULE_DIR']))
          print(f"capsule_id={package['capsule_id']}")
          print(f"package_sha={package['package_identity_sha256']}")
          print(f"git_tree_oid={package['git_tree_oid']}")
          PY

      - name: Prove local GitHub-zero cold recovery
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/repository-capsule/restore-trinity-accord.py" \
            --deposit-dir "$RUNNER_TEMP/repository-capsule" \
            --output-dir "$RUNNER_TEMP/local-restore"
          REPORT="$RUNNER_TEMP/local-restore/recovery-report.json" python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['REPORT']))
          if r.get('result')!='pass': raise SystemExit('local cold restore failed')
          if r.get('source_git_commit_sha')!=os.environ['SOURCE_SHA']: raise SystemExit('local cold restore source mismatch')
          PY

      - name: Publish or reconcile new Zenodo repository version
        id: zenodo
        run: |
          set -euo pipefail
          cp preservation/zenodo-state.json preservation/bitcoin12-zenodo-work-state.json
          previous_doi="$(python3 - <<'PY'
          import json
          s=json.load(open('preservation/bitcoin12-zenodo-work-state.json'))
          print(s.get('latest_doi',''))
          PY
          )"
          python3 scripts/publish_preservation_capsule_to_zenodo_v3.py \
            --capsule-dir "$RUNNER_TEMP/repository-capsule" \
            --state preservation/bitcoin12-zenodo-work-state.json \
            --api-base "$ZENODO_API_BASE" \
            --rights-boundary-ack "$RIGHTS_ACK"
          PREVIOUS_DOI="$previous_doi" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          s=json.load(open('preservation/bitcoin12-zenodo-work-state.json'))
          if s.get('concept_doi')!='10.5281/zenodo.21739343': raise SystemExit('Concept DOI mismatch')
          if not s.get('latest_doi'): raise SystemExit('published DOI missing')
          if s.get('latest_doi')==os.environ.get('PREVIOUS_DOI'): raise SystemExit('Zenodo did not advance to a new repository version')
          print(f"doi={s['latest_doi']}")
          print(f"record_id={s['latest_record_id']}")
          print(f"package_sha={s['latest_package_identity_sha256']}")
          PY

      - name: Prove public DOI-only cold recovery
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
          RECORD_ID: ${{ steps.zenodo.outputs.record_id }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/repository-capsule/restore-trinity-accord.py" \
            --zenodo-record-id "$RECORD_ID" \
            --output-dir "$RUNNER_TEMP/doi-restore"
          REPORT="$RUNNER_TEMP/doi-restore/recovery-report.json" python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['REPORT']))
          if r.get('result')!='pass': raise SystemExit('public DOI cold restore failed')
          if r.get('source_git_commit_sha')!=os.environ['SOURCE_SHA']: raise SystemExit('public DOI source mismatch')
          PY

      - name: Seal durable DOI observation while leaving Arweave unchanged
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
          CAPSULE_ID: ${{ steps.capsule.outputs.capsule_id }}
          PACKAGE_SHA: ${{ steps.capsule.outputs.package_sha }}
          GIT_TREE_OID: ${{ steps.capsule.outputs.git_tree_oid }}
          DOI: ${{ steps.zenodo.outputs.doi }}
          RECORD_ID: ${{ steps.zenodo.outputs.record_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          auth_path=Path('preservation/bitcoin12-external-closure-authorization-v1.json')
          auth=json.loads(auth_path.read_text())
          auth.update({
            'status':'doi_published_arweave_deferred',
            'published_source_baseline_commit_sha':os.environ['SOURCE_SHA'],
            'published_repository_doi':os.environ['DOI'],
            'published_repository_record_id':int(os.environ['RECORD_ID']),
            'published_package_identity_sha256':os.environ['PACKAGE_SHA'],
            'arweave_publication_status':'deferred_by_owner'
          })
          auth_path.write_text(json.dumps(auth,ensure_ascii=False,indent=2)+'\n')
          observation={
            'schema':'trinityaccord.bitcoin12-doi-closure-observation.v1',
            'status':'passed',
            'source_git_commit_sha':os.environ['SOURCE_SHA'],
            'git_tree_oid':os.environ['GIT_TREE_OID'],
            'capsule_id':os.environ['CAPSULE_ID'],
            'package_identity_sha256':os.environ['PACKAGE_SHA'],
            'repository_doi':os.environ['DOI'],
            'zenodo_record_id':int(os.environ['RECORD_ID']),
            'public_doi_only_cold_restore':'passed',
            'arweave_publication_status':'deferred_by_owner',
            'new_arweave_transaction_created':False,
            'bitcoin_l1_l2_l3':'12/12 PASS',
            'tag5_metadata_present':1,
            'tag5_metadata_absent_verified':11,
            'non_amending_boundary':True,
            'three_bitcoin_originals_remain_canonical':True,
            'future_arweave_must_preserve_this_capsule_identity':True,
            'live_main_equivalence_claimed':False
          }
          Path('preservation/bitcoin12-doi-closure-observation-v1.json').write_text(
            json.dumps(observation,ensure_ascii=False,indent=2)+'\n')
          state=json.load(open('preservation/bitcoin12-zenodo-work-state.json'))
          Path('preservation/zenodo-state.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
          catalog_path=Path('preservation/recovery-catalog.json')
          catalog=json.loads(catalog_path.read_text())
          core=catalog['core_repository']
          core['current_verified_version_doi']=os.environ['DOI']
          core['current_verified_source_git_commit_sha']=os.environ['SOURCE_SHA']
          core['current_verified_package_identity_sha256']=os.environ['PACKAGE_SHA']
          core['current_verified_record_id']=int(os.environ['RECORD_ID'])
          core['current_repository_arweave_publication_status']='deferred_by_owner'
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')
          PY
          rm preservation/bitcoin12-zenodo-work-state.json
          git config user.name actions-user
          git config user.email actions@github.com
          git add preservation/bitcoin12-external-closure-authorization-v1.json \
            preservation/bitcoin12-doi-closure-observation-v1.json \
            preservation/zenodo-state.json preservation/recovery-catalog.json
          git diff --cached --check
          git commit -m 'preservation: seal 12-item DOI closure; defer Arweave'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
