name: Temporary PR 1071 issue driver

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  patch-pr-branch:
    if: >-
      github.event.issue.number == 1071 &&
      github.event.comment.body == '/run-pr1071-scholarly-closure-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0

      - name: Extract guarded patch from PR branch workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-close-scholarly-parser-p2.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index('          PY', start)
          code_lines = []
          for line in lines[start:end]:
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected patch indentation: {line!r}')
              code_lines.append(line[10:])
          Path('/tmp/apply_scholarly_patch.py').write_text(
              '\n'.join(code_lines) + '\n', encoding='utf-8'
          )
          PY
          python /tmp/apply_scholarly_patch.py
          python -m pytest -q tests/test_scholarly_parser_edge_cases.py
          python -m py_compile scripts/check_deployment_freshness.py
          python -m ruff check scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py || ruff check scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git diff --check

      - name: Remove temporary PR files and push final state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/tmp-close-scholarly-parser-p2.yml .github/workflows/tmp-run-scholarly-parser-closure.yml .tmp-scholarly-parser-trigger
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          echo "Staged paths:"
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/tmp-close-scholarly-parser-p2.yml .github/workflows/tmp-run-scholarly-parser-closure.yml .tmp-scholarly-parser-trigger scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py "
          git commit -m "fix: close final scholarly parser review gaps"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
