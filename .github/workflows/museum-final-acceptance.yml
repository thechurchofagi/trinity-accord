name: Museum final acceptance
on:
  push:
    branches: [codex/museum-six-rooms-guardian-v1-1]
    paths: ['.github/workflows/museum-final-acceptance.yml']
permissions:
  contents: read
  actions: read
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: museum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: expressive-guide-*
          run-id: 34173312397
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/first-voice
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: retake-guide-*
          run-id: 34173946588
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/retaken-voice
      - name: Install final build and browser tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
          cd museum && npm ci
      - name: Adopt only script-matching reviewed voice files
        run: |
          set -euo pipefail
          python museum/scripts/adopt_expressive_guide.py --first "$RUNNER_TEMP/first-voice" --retakes "$RUNNER_TEMP/retaken-voice"
          sed -i 's/#flaw-content/#flaw-view/g' museum/scripts/check_presentation.py
          if [ -f museum/dist/data/CHATERBOX-NARRATION-LICENSE.txt ]; then mv museum/dist/data/CHATERBOX-NARRATION-LICENSE.txt museum/dist/data/CHATTERBOX-NARRATION-LICENSE.txt; fi
          python museum/scripts/finish_spatial_edition.py
          node museum/scripts/build_runtime.mjs
          python museum/scripts/build_archive.py
          python museum/scripts/validate.py
          node --check museum/dist/museum.js
          for script in museum/scripts/check_*.mjs; do echo "$script"; node "$script"; done
      - name: Exercise production bundle at desktop and phone dimensions
        env:
          MUSEUM_QA_OUTPUT: ${{ runner.temp }}/final-browser
        run: python museum/scripts/check_browser.py
      - name: Review real presentation states, lyrics and original photographs
        env:
          MUSEUM_QA_OUTPUT: ${{ runner.temp }}/final-presentation
        run: python museum/scripts/check_presentation.py
      - name: Revalidate inventory after temporary harness removal
        run: |
          set -euo pipefail
          test ! -e museum/dist/__presentation_qa.js
          test ! -e museum/dist/__presentation_qa.html
          python museum/scripts/validate.py
      - name: Commit accepted output to the PR branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/museum-six-rooms-guardian-v1-1
          git add museum
          if git diff --cached --name-only | grep -qv '^museum/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='museum-edition-builder' -c user.email='actions@github.com' commit -m 'feat(museum): complete expressive narration and final exhibition acceptance'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/museum-six-rooms-guardian-v1-1
          unset AUTH
      - name: Save final reviewed output and diagnostics
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/final-head.txt"
          tar --exclude='node_modules' --exclude='__pycache__' -czf "$RUNNER_TEMP/museum-final.tar.gz" museum
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: museum-final-review
          path: |
            ${{ runner.temp }}/museum-final.tar.gz
            ${{ runner.temp }}/final-head.txt
            ${{ runner.temp }}/final-browser
            ${{ runner.temp }}/final-presentation
          retention-days: 7
          if-no-files-found: error
