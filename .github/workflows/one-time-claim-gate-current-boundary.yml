name: One-time Claim Gate current boundary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-time-claim-gate-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'audit/current-public-guidance-alignment'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add current public verification boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('api/claim-gate-rules.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('schema') != 'trinityaccord.claim-gate-rules.v1':
              raise SystemExit('unexpected Claim Gate schema')

          data['version'] = 'v1.1'
          data['note'] = (
              'This JSON preserves executable historical compatibility rules used by scripts/claim_gate.py. '
              'For current public work, V0–V5 are compatibility metadata only; V4+, V6, V7, and V8 are historical-only labels. '
              'Claim Gate output is an intermediate evidence artifact and must be represented through the current multidimensional '
              'verification model before Record-Chain submission. Bitcoin Originals remain final authority.'
          )
          data['current_public_verification_boundary'] = {
              'claim_gate_required_only_for_strict_machine_evaluated_technical_evidence_claims': True,
              'ordinary_echo_does_not_require_claim_gate': True,
              'output_is_intermediate_evidence_artifact': True,
              'output_is_not_current_public_record_by_itself': True,
              'current_public_record_type': 'verification',
              'current_record_builder': '/downloads/record-chain-builder.mjs',
              'current_dimensions': [
                  'digital_profile',
                  'relationships_checked',
                  'physical_observation',
                  'external_witness',
                  'coverage_scope',
                  'limitations',
                  'claims_not_made',
                  'corrections_or_supersession_checked',
              ],
          }
          compatibility = {'V0', 'V1', 'V2', 'V3', 'V4', 'V5'}
          historical = {'V4+', 'V6', 'V7', 'V8'}
          seen = set()
          for rule in data.get('protocol_level_rules', []):
              level = rule.get('level')
              seen.add(level)
              if level in compatibility:
                  rule['current_public_status'] = 'compatibility_metadata_only'
              elif level in historical:
                  rule['current_public_status'] = 'historical_only_for_new_work'
          expected = compatibility | historical
          if not expected.issubset(seen):
              raise SystemExit(f'missing expected protocol levels: {sorted(expected-seen)}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/validate_json_strict.py

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/one-time-claim-gate-current-boundary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/claim-gate-rules.json .github/workflows/one-time-claim-gate-current-boundary.yml
          git commit -m 'fix: mark Claim Gate levels as compatibility only'
          git push origin HEAD:${{ github.head_ref }}
