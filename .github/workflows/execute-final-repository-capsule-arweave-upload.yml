name: Execute Final Repository Capsule Arweave Upload

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/execute-final-repository-capsule-arweave-upload.yml
      - scripts/one_time_upload_final_repository_capsule.mjs

permissions:
  actions: read
  contents: read

concurrency:
  group: final-repository-capsule-arweave-upload-once
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event.pull_request.head.repo.full_name == 'thechurchofagi/trinity-accord' &&
      github.head_ref == 'agent/upload-final-repository-capsule-arweave-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE_ARTIFACT_ID: "8831907405"
      EXPECTED_CAPSULE_ID: repository-81b151245d70
      EXPECTED_SOURCE_COMMIT: 81b151245d70f6b775418de60f7b8a1366f28944
      EXPECTED_GIT_TREE_OID: c63cb393713f9824970bab80b07c214dc79e561a
      EXPECTED_RECOVERY_COMMIT: 247f254229de1d148f299a2cbfacf7102950d5df
      EXPECTED_PACKAGE_IDENTITY_SHA256: ab3e0c54dce4b51330060e88133399553442f091d6f98adf06b8439e27be00c2
      EXPECTED_PAYLOAD_BYTES: "36925440"
      EXPECTED_PAYLOAD_SHA256: 132cc58496f903990447f06847325b7393d1dedf8b4eae24ad888f4145b1df14
      MAX_REWARD_WINSTON: "400000000000"
      MIN_REMAINING_WINSTON: "250000000000"
      ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}

    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download and verify previously accepted payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$ARKEY"
          mkdir -p "$RUNNER_TEMP/evidence"
          curl --fail --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/evidence.zip"
          unzip -q "$RUNNER_TEMP/evidence.zip" -d "$RUNNER_TEMP/evidence"
          payload="$(find "$RUNNER_TEMP/evidence" -type f -name 'trinity-accord-repository-capsule-81b151245d70.tar' -print -quit)"
          test -n "$payload"
          test "$(stat -c %s "$payload")" = "$EXPECTED_PAYLOAD_BYTES"
          test "$(sha256sum "$payload" | awk '{print $1}')" = "$EXPECTED_PAYLOAD_SHA256"
          printf '%s\n' "$payload" > "$RUNNER_TEMP/payload-path.txt"
          echo VERIFIED_ARTIFACT_PAYLOAD_OK

      - name: Enforce idempotency, cost and reserve; sign, upload and read back
        env:
          PAYLOAD_PATH_FILE: ${{ runner.temp }}/payload-path.txt
          RESULT_PATH: ${{ runner.temp }}/arweave-upload-result.json
        run: node scripts/one_time_upload_final_repository_capsule.mjs

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-repository-capsule-arweave-upload-result
          path: ${{ runner.temp }}/arweave-upload-result.json
          if-no-files-found: warn
          retention-days: 90
