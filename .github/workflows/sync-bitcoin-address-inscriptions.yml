name: Sync Bitcoin authority-address inscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: "47 8 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bitcoin-authority-address-inscription-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/bitcoin-address-inscription-snapshot
  ARCHIVE_DIR: bitcoin-inscription-mirrors/address-wide

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Sync complete stable address snapshot
        run: python3 scripts/sync_bitcoin_address_inscriptions.py

      - name: Verify dedicated sync contract
        run: python3 -m pytest -q tests/test_bitcoin_address_inscription_sync.py

      - name: Preserve curated Bitcoin mirror boundary
        run: python3 scripts/verify_bitcoin_inscription_mirrors.py --offline --all

      - name: Publish snapshot branch and open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- "$ARCHIVE_DIR" \
             && [[ -z "$(git ls-files --others --exclude-standard "$ARCHIVE_DIR")" ]]; then
            echo "Address-wide mirror already matches main; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$SYNC_BRANCH"
          git add -- "$ARCHIVE_DIR"
          git diff --cached --check
          git commit -m "archive: sync all Bitcoin authority-address inscriptions"

          # Fetch the previous automation branch, if any, so force-with-lease is safe.
          git fetch origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"

          existing="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --head "$SYNC_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$existing" ]]; then
            echo "Updated existing snapshot PR #$existing"
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$SYNC_BRANCH" \
            --draft \
            --title "archive: sync all Bitcoin authority-address inscriptions" \
            --body "Automated address-wide Ordinals snapshot. The inscription set is discovered from the authority address at runtime with no fixed expected count. Exact content bytes, metadata, lengths, and SHA-256 hashes are mirrored under bitcoin-inscription-mirrors/address-wide/. The three Bitcoin Originals remain the only canonical body; same-address archival records do not amend or interpret them."
