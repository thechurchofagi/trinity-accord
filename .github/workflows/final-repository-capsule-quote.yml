name: Final Repository Capsule Quote

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/final-repository-capsule-quote.yml

permissions:
  contents: read

concurrency:
  group: final-repository-capsule-quote-20260802
  cancel-in-progress: false

jobs:
  build-restore-quote:
    if: github.head_ref == 'ops/final-repository-capsule-quote-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_MAIN: 64760a8da3b154da3fb438d3086f79c9818656bb
      ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
    steps:
      - name: Checkout exact freeze candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Require exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_MAIN}"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build two independent capsules and require byte identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "${EXPECTED_MAIN}" \
            --output-dir "$RUNNER_TEMP/capsule-a"
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "${EXPECTED_MAIN}" \
            --output-dir "$RUNNER_TEMP/capsule-b"
          python3 - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from preservation_capsule import verify_local_package

          a = Path('${{ runner.temp }}/capsule-a')
          b = Path('${{ runner.temp }}/capsule-b')
          va = verify_local_package(a)
          vb = verify_local_package(b)
          if va['package_identity_sha256'] != vb['package_identity_sha256']:
              raise SystemExit('independent package identities differ')
          names_a = sorted(path.name for path in a.iterdir() if path.is_file())
          names_b = sorted(path.name for path in b.iterdir() if path.is_file())
          if names_a != names_b:
              raise SystemExit('independent published file sets differ')
          files = []
          for name in names_a:
              raw_a = (a / name).read_bytes()
              raw_b = (b / name).read_bytes()
              if raw_a != raw_b:
                  raise SystemExit(f'independent published bytes differ: {name}')
              files.append({
                  'name': name,
                  'bytes': len(raw_a),
                  'sha256': hashlib.sha256(raw_a).hexdigest(),
                  'mode': format((a / name).stat().st_mode & 0o777, '04o'),
              })
          summary = {
              'schema': 'trinityaccord.repository-capsule-final-build.v1',
              'source_commit': '${{ env.EXPECTED_MAIN }}',
              'capsule_id': va['capsule_id'],
              'git_tree_oid': va['git_tree_oid'],
              'recovery_commit_sha': va['manifest']['git']['recovery_commit_sha'],
              'tracked_file_count': va['tracked_file_count'],
              'package_identity_sha256': va['package_identity_sha256'],
              'production_tag_identity_count': va['manifest']['git']['production_tag_identity_count'],
              'independent_builds_byte_identical': True,
              'published_files': files,
              'published_file_bytes_total': sum(item['bytes'] for item in files),
          }
          if summary['production_tag_identity_count'] != 0:
              raise SystemExit('mutable live tag refs leaked into capsule identity')
          Path('${{ runner.temp }}/capsule-build-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Perform standalone GitHub-zero cold restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bootstrap"
          cp "$RUNNER_TEMP/capsule-a/restore-trinity-accord.py" \
            "$RUNNER_TEMP/bootstrap/restore-trinity-accord.py"
          cd "$RUNNER_TEMP/bootstrap"
          python3 restore-trinity-accord.py \
            --deposit-dir "$RUNNER_TEMP/capsule-a" \
            --output-dir "$RUNNER_TEMP/restored"
          test "$(git -C "$RUNNER_TEMP/restored/repository" rev-parse HEAD)" = \
            "$(jq -r '.recovery_commit_sha' "$RUNNER_TEMP/capsule-build-summary.json")"
          test "$(git -C "$RUNNER_TEMP/restored/repository" rev-parse 'HEAD^{tree}')" = \
            "$(jq -r '.git_tree_oid' "$RUNNER_TEMP/capsule-build-summary.json")"
          test -z "$(git -C "$RUNNER_TEMP/restored/repository" status --porcelain)"
          python3 "$RUNNER_TEMP/restored/repository/scripts/audit_recovery_readiness.py"

      - name: Create deterministic uncompressed Arweave transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          source = Path('${{ runner.temp }}/capsule-a')
          build = json.loads(Path('${{ runner.temp }}/capsule-build-summary.json').read_text())
          short = build['source_commit'][:12]
          output = Path('${{ runner.temp }}') / f'trinity-accord-repository-capsule-{short}.tar'
          with tarfile.open(output, 'w', format=tarfile.GNU_FORMAT) as archive:
              for path in sorted(source.iterdir(), key=lambda item: item.name):
                  if not path.is_file():
                      continue
                  info = archive.gettarinfo(str(path), arcname=path.name)
                  info.mtime = 0
                  info.uid = 0
                  info.gid = 0
                  info.uname = ''
                  info.gname = ''
                  with path.open('rb') as handle:
                      archive.addfile(info, handle)
          raw = output.read_bytes()
          transport = {
              'schema': 'trinityaccord.repository-capsule-arweave-transport.v1',
              'source_commit': build['source_commit'],
              'git_tree_oid': build['git_tree_oid'],
              'recovery_commit_sha': build['recovery_commit_sha'],
              'capsule_id': build['capsule_id'],
              'package_identity_sha256': build['package_identity_sha256'],
              'filename': output.name,
              'bytes': len(raw),
              'sha256': hashlib.sha256(raw).hexdigest(),
              'format': 'deterministic-uncompressed-gnu-tar',
              'contents': [item['name'] for item in build['published_files']],
          }
          Path('${{ runner.temp }}/transport-summary.json').write_text(
              json.dumps(transport, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('${{ runner.temp }}/transport-path.txt').write_text(str(output) + '\n')
          print(json.dumps(transport, indent=2, sort_keys=True))
          PY

      - name: Query live AR reward and reserve without signing or posting
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARKEY}"
          cat > "$GITHUB_WORKSPACE/quote-final-repository-capsule.mjs" <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import Arweave from 'arweave';

          const rawKey = process.env.ARKEY.trim();
          const jwk = rawKey.startsWith('{')
            ? JSON.parse(rawKey)
            : JSON.parse(Buffer.from(rawKey, 'base64').toString('utf8'));
          const data = fs.readFileSync(process.env.TRANSPORT_PATH);
          const arweave = Arweave.init({
            host: 'arweave.net',
            port: 443,
            protocol: 'https',
            timeout: 60000,
            logging: false,
          });
          const address = await arweave.wallets.jwkToAddress(jwk);
          const balance = BigInt(await arweave.wallets.getBalance(address));
          const tx = await arweave.createTransaction({ data }, jwk);
          const reward = BigInt(tx.reward);
          const hardMax = 300000000000n;
          const reserve = 250000000000n;
          const toAr = (value) =>
            `${value / 1000000000000n}.${(value % 1000000000000n)
              .toString().padStart(12, '0')}`;
          if (reward > hardMax) {
            throw new Error(`reward ${reward} exceeds 0.30 AR hard cap`);
          }
          if (balance - reward < reserve) {
            throw new Error(`remaining ${balance - reward} falls below 0.25 AR reserve`);
          }
          const result = {
            schema: 'trinityaccord.repository-capsule-arweave-quote.v1',
            payload_bytes: data.length,
            payload_sha256: crypto.createHash('sha256').update(data).digest('hex'),
            reward_winston: reward.toString(),
            reward_ar: toAr(reward),
            wallet_address_sha256: crypto.createHash('sha256').update(address).digest('hex'),
            balance_before_winston: balance.toString(),
            balance_before_ar: toAr(balance),
            estimated_remaining_winston: (balance - reward).toString(),
            estimated_remaining_ar: toAr(balance - reward),
            hard_cap_ar: '0.300000000000',
            minimum_remaining_ar: '0.250000000000',
            transaction_created_for_quote_only: true,
            transaction_signed: false,
            transaction_posted: false,
          };
          fs.writeFileSync(process.env.QUOTE_PATH, JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          JS
          TRANSPORT_PATH="$(cat "$RUNNER_TEMP/transport-path.txt")" \
          QUOTE_PATH="$RUNNER_TEMP/arweave-quote.json" \
          node "$GITHUB_WORKSPACE/quote-final-repository-capsule.mjs"
          rm -f "$GITHUB_WORKSPACE/quote-final-repository-capsule.mjs"

      - name: Upload verified no-cost evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-repository-capsule-quote-evidence
          path: |
            ${{ runner.temp }}/capsule-a/
            ${{ runner.temp }}/capsule-build-summary.json
            ${{ runner.temp }}/restored/recovery-report.json
            ${{ runner.temp }}/transport-summary.json
            ${{ runner.temp }}/arweave-quote.json
          retention-days: 365
          if-no-files-found: warn
