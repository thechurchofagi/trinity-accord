name: Full Versus Shallow Capsule Diagnosis

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/final-repository-capsule-quote.yml

permissions:
  contents: read

concurrency:
  group: full-versus-shallow-capsule-diagnosis-20260802
  cancel-in-progress: false

jobs:
  compare-clone-depths:
    if: github.head_ref == 'ops/final-repository-capsule-quote-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FROZEN_COMMIT: 64760a8da3b154da3fb438d3086f79c9818656bb
    steps:
      - name: Checkout full exact repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 64760a8da3b154da3fb438d3086f79c9818656bb
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Require exact full source and build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FROZEN_COMMIT}"
          test -z "$(git status --porcelain)"
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "${FROZEN_COMMIT}" \
            --output-dir "$RUNNER_TEMP/capsule-full"

      - name: Create a true depth-one clone of the same exact commit and build
        shell: bash
        run: |
          set -euo pipefail
          shallow="$RUNNER_TEMP/shallow-repository"
          git init "$shallow"
          git -C "$shallow" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$shallow" fetch --depth=1 --no-tags origin "${FROZEN_COMMIT}"
          git -C "$shallow" checkout --detach FETCH_HEAD
          test "$(git -C "$shallow" rev-parse HEAD)" = "${FROZEN_COMMIT}"
          test "$(git -C "$shallow" rev-parse --is-shallow-repository)" = "true"
          cp scripts/build_preservation_capsule.py "$shallow/scripts/build_preservation_capsule.py"
          cp scripts/preservation_capsule.py "$shallow/scripts/preservation_capsule.py"
          python3 "$shallow/scripts/build_preservation_capsule.py" \
            --repository-root "$shallow" \
            --commit "${FROZEN_COMMIT}" \
            --output-dir "$RUNNER_TEMP/capsule-shallow"

      - name: Emit exact per-file and structural differences
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import hashlib
          import json
          from pathlib import Path

          full = Path('${{ runner.temp }}/capsule-full')
          shallow = Path('${{ runner.temp }}/capsule-shallow')
          names = sorted(
              {path.name for path in full.iterdir() if path.is_file()}
              | {path.name for path in shallow.iterdir() if path.is_file()}
          )
          report = {
              'schema': 'trinityaccord.full-versus-shallow-capsule-diagnosis.v1',
              'source_commit': '${{ env.FROZEN_COMMIT }}',
              'files': [],
              'differing_files': [],
          }
          for name in names:
              full_raw = (full / name).read_bytes() if (full / name).exists() else None
              shallow_raw = (shallow / name).read_bytes() if (shallow / name).exists() else None
              item = {
                  'name': name,
                  'full_bytes': len(full_raw) if full_raw is not None else None,
                  'shallow_bytes': len(shallow_raw) if shallow_raw is not None else None,
                  'full_sha256': hashlib.sha256(full_raw).hexdigest() if full_raw is not None else None,
                  'shallow_sha256': hashlib.sha256(shallow_raw).hexdigest() if shallow_raw is not None else None,
                  'byte_identical': full_raw == shallow_raw,
              }
              if full_raw != shallow_raw:
                  report['differing_files'].append(name)
                  if name.endswith('.json') and full_raw is not None and shallow_raw is not None:
                      try:
                          a = json.dumps(json.loads(full_raw), indent=2, sort_keys=True, ensure_ascii=False).splitlines()
                          b = json.dumps(json.loads(shallow_raw), indent=2, sort_keys=True, ensure_ascii=False).splitlines()
                          item['normalized_json_diff'] = list(
                              difflib.unified_diff(a, b, fromfile=f'full/{name}', tofile=f'shallow/{name}', lineterm='')
                          )[:500]
                      except Exception as exc:
                          item['json_diff_error'] = str(exc)
                  elif name.endswith(('.txt', '.sha256', '.py')) and full_raw is not None and shallow_raw is not None:
                      try:
                          a = full_raw.decode('utf-8').splitlines()
                          b = shallow_raw.decode('utf-8').splitlines()
                          item['text_diff'] = list(
                              difflib.unified_diff(a, b, fromfile=f'full/{name}', tofile=f'shallow/{name}', lineterm='')
                          )[:500]
                      except Exception as exc:
                          item['text_diff_error'] = str(exc)
              report['files'].append(item)
          report['all_files_byte_identical'] = not report['differing_files']
          Path('${{ runner.temp }}/full-versus-shallow-diff.json').write_text(
              json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False))
          PY

      - name: Compare semantic bundle identities
        shell: bash
        run: |
          set -euo pipefail
          for side in full shallow; do
            bundle="$RUNNER_TEMP/capsule-${side}/trinity-accord-recovery.bundle"
            target="$RUNNER_TEMP/${side}.git"
            git init --bare "$target" >/dev/null
            git -C "$target" fetch "$bundle" refs/heads/main:refs/heads/main >/dev/null
            git -C "$target" rev-parse refs/heads/main > "$RUNNER_TEMP/${side}-recovery-commit.txt"
            git -C "$target" rev-parse 'refs/heads/main^{tree}' > "$RUNNER_TEMP/${side}-tree.txt"
            git -C "$target" fsck --full > "$RUNNER_TEMP/${side}-fsck.txt"
          done
          diff -u "$RUNNER_TEMP/full-recovery-commit.txt" "$RUNNER_TEMP/shallow-recovery-commit.txt" || true
          diff -u "$RUNNER_TEMP/full-tree.txt" "$RUNNER_TEMP/shallow-tree.txt" || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-versus-shallow-capsule-diagnosis
          path: |
            ${{ runner.temp }}/capsule-full/
            ${{ runner.temp }}/capsule-shallow/
            ${{ runner.temp }}/full-versus-shallow-diff.json
            ${{ runner.temp }}/*-recovery-commit.txt
            ${{ runner.temp }}/*-tree.txt
            ${{ runner.temp }}/*-fsck.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Fail on clone-depth-dependent bytes
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.all_files_byte_identical == true' "$RUNNER_TEMP/full-versus-shallow-diff.json" >/dev/null
