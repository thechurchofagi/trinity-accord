name: Final Repository Capsule Balance Report

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/final-repository-capsule-quote.yml

permissions:
  contents: read

concurrency:
  group: final-repository-capsule-balance-report-20260802
  cancel-in-progress: false

jobs:
  exact-quote-and-balance:
    if: github.head_ref == 'ops/final-repository-capsule-quote-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FROZEN_COMMIT: 64760a8da3b154da3fb438d3086f79c9818656bb
      EXPECTED_PACKAGE_IDENTITY: e7880ef2aba832946faba065d9a01052d1a6ed923d61f103bcb7aa9b7fb3e079
      EXPECTED_TRANSPORT_SHA256: 87fa27191bbe2bcabb6f0e7b69cd36a34f432ffd7937154367541dad6ad7bb80
      EXPECTED_TRANSPORT_BYTES: '36362240'
      CONFIGURED_CAP_WINSTON: '300000000000'
      MINIMUM_RESERVE_WINSTON: '250000000000'
      ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
    steps:
      - name: Checkout exact frozen commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 64760a8da3b154da3fb438d3086f79c9818656bb
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies and require clean exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${FROZEN_COMMIT}"
          test -z "$(git status --porcelain)"
          npm ci

      - name: Rebuild and verify the exact known capsule transport
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "${FROZEN_COMMIT}" \
            --output-dir "$RUNNER_TEMP/capsule"
          python3 - <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path

          sys.path.insert(0, 'scripts')
          from preservation_capsule import verify_local_package

          source = Path('${{ runner.temp }}/capsule')
          verified = verify_local_package(source)
          expected_identity = '${{ env.EXPECTED_PACKAGE_IDENTITY }}'
          if verified['package_identity_sha256'] != expected_identity:
              raise SystemExit(
                  f"package identity mismatch: {verified['package_identity_sha256']} != {expected_identity}"
              )

          output = Path('${{ runner.temp }}/trinity-accord-repository-capsule-64760a8da3b1.tar')
          with tarfile.open(output, 'w', format=tarfile.GNU_FORMAT) as archive:
              for path in sorted(source.iterdir(), key=lambda item: item.name):
                  if not path.is_file():
                      continue
                  info = archive.gettarinfo(str(path), arcname=path.name)
                  info.mtime = 0
                  info.uid = 0
                  info.gid = 0
                  info.uname = ''
                  info.gname = ''
                  with path.open('rb') as handle:
                      archive.addfile(info, handle)

          raw = output.read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          expected_digest = '${{ env.EXPECTED_TRANSPORT_SHA256 }}'
          expected_bytes = int('${{ env.EXPECTED_TRANSPORT_BYTES }}')
          if digest != expected_digest:
              raise SystemExit(f'transport digest mismatch: {digest} != {expected_digest}')
          if len(raw) != expected_bytes:
              raise SystemExit(f'transport size mismatch: {len(raw)} != {expected_bytes}')

          result = {
              'schema': 'trinityaccord.repository-capsule-exact-quote-input.v1',
              'source_commit': '${{ env.FROZEN_COMMIT }}',
              'capsule_id': verified['capsule_id'],
              'git_tree_oid': verified['git_tree_oid'],
              'recovery_commit_sha': verified['manifest']['git']['recovery_commit_sha'],
              'tracked_file_count': verified['tracked_file_count'],
              'package_identity_sha256': verified['package_identity_sha256'],
              'transport_filename': output.name,
              'transport_bytes': len(raw),
              'transport_sha256': digest,
          }
          Path('${{ runner.temp }}/exact-quote-input.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Read live network price and wallet balance without creating, signing, or posting a transaction
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARKEY}"
          cat > "$GITHUB_WORKSPACE/report-final-repository-capsule-balance.mjs" <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import Arweave from 'arweave';

          const rawKey = process.env.ARKEY.trim();
          const jwk = rawKey.startsWith('{')
            ? JSON.parse(rawKey)
            : JSON.parse(Buffer.from(rawKey, 'base64').toString('utf8'));
          const data = fs.readFileSync(process.env.TRANSPORT_PATH);
          const arweave = Arweave.init({
            host: 'arweave.net',
            port: 443,
            protocol: 'https',
            timeout: 60000,
            logging: false,
          });
          const address = await arweave.wallets.jwkToAddress(jwk);
          const balance = BigInt(await arweave.wallets.getBalance(address));
          const reward = BigInt(await arweave.transactions.getPrice(data.length));
          const cap = BigInt(process.env.CONFIGURED_CAP_WINSTON);
          const reserve = BigInt(process.env.MINIMUM_RESERVE_WINSTON);
          const remaining = balance - reward;

          const toAr = (value) => {
            const negative = value < 0n;
            const absolute = negative ? -value : value;
            const rendered = `${absolute / 1000000000000n}.${(absolute % 1000000000000n)
              .toString().padStart(12, '0')}`;
            return negative ? `-${rendered}` : rendered;
          };

          const report = {
            schema: 'trinityaccord.repository-capsule-arweave-balance-report.v1',
            observed_at: new Date().toISOString(),
            payload_bytes: data.length,
            payload_sha256: crypto.createHash('sha256').update(data).digest('hex'),
            reward_winston: reward.toString(),
            reward_ar: toAr(reward),
            configured_cap_winston: cap.toString(),
            configured_cap_ar: toAr(cap),
            amount_above_cap_winston: (reward > cap ? reward - cap : 0n).toString(),
            amount_above_cap_ar: toAr(reward > cap ? reward - cap : 0n),
            within_configured_cap: reward <= cap,
            wallet_address_sha256: crypto.createHash('sha256').update(address).digest('hex'),
            balance_before_winston: balance.toString(),
            balance_before_ar: toAr(balance),
            estimated_remaining_winston: remaining.toString(),
            estimated_remaining_ar: toAr(remaining),
            minimum_reserve_winston: reserve.toString(),
            minimum_reserve_ar: toAr(reserve),
            reserve_satisfied_after_upload: remaining >= reserve,
            network_price_method: 'arweave.transactions.getPrice(payload_bytes)',
            transaction_object_created: false,
            transaction_signed: false,
            transaction_posted: false,
            ar_spent: '0.000000000000',
          };
          fs.writeFileSync(process.env.REPORT_PATH, JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          JS
          TRANSPORT_PATH="$RUNNER_TEMP/trinity-accord-repository-capsule-64760a8da3b1.tar" \
          REPORT_PATH="$RUNNER_TEMP/arweave-balance-report.json" \
          node "$GITHUB_WORKSPACE/report-final-repository-capsule-balance.mjs"
          rm -f "$GITHUB_WORKSPACE/report-final-repository-capsule-balance.mjs"

      - name: Upload no-spend quote and balance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-repository-capsule-balance-report
          path: |
            ${{ runner.temp }}/exact-quote-input.json
            ${{ runner.temp }}/arweave-balance-report.json
          retention-days: 90
          if-no-files-found: error
