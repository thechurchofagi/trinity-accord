name: Record Chain Arweave Archive
# Paid uploads are daily or explicitly human-dispatched. Upstream workflow events
# are dry-run only. The orchestrator never repeats a paid upload after rebase or
# push conflict; it carries the first transaction metadata forward instead.

on:
  workflow_run:
    workflows:
      - "Record Chain Head OTS Anchor"
      - "Native OTS Upgrade Watch"
    types: [completed]
  workflow_dispatch:
    inputs:
      upload_mode:
        description: "Arweave upload mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
  schedule:
    # At most one automated paid Record-Chain archive attempt per UTC day.
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  archive:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements-ci.txt
          npm ci

      - name: Resolve upload mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTOR: ${{ github.actor }}
          REQUESTED_MODE: ${{ github.event.inputs.upload_mode || 'dry-run' }}
        run: |
          set -euo pipefail
          mode="dry-run"
          if [ "$EVENT_NAME" = "schedule" ]; then
            mode="live"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$EVENT_ACTOR" != "github-actions[bot]" ]; then
            mode="$REQUESTED_MODE"
          fi
          case "$mode" in
            dry-run|live) ;;
            *) echo "Invalid upload mode: $mode" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved Arweave mode: $mode"

      - name: Run one bounded incremental archive attempt
        env:
          ARWEAVE_UPLOAD_MODE: ${{ steps.mode.outputs.mode }}
          ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
          ARWEAVE_UPLOAD_TIMEOUT_SECONDS: "600"
          ARWEAVE_HTTP_TIMEOUT_MS: "30000"
          ARWEAVE_READBACK_MAX_RETRIES: "30"
          ARWEAVE_READBACK_DELAY_MS: "10000"
          ARWEAVE_READBACK_MAX_SECONDS: "420"
        run: python3 scripts/run_record_chain_arweave_workflow_once.py
