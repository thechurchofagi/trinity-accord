name: Publish RT paper v1.0.0 with exact public readback
on:
  push:
    branches: [research/task-relative-continuity-v1-20261009]
    paths: [research/task-relative-continuity/PUBLISH-AUTHORIZATION.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rt-paper-zenodo-v1-create-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout only the frozen RT publication branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/task-relative-continuity-v1-20261009
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify frozen publication without credentials
        run: python research/task-relative-continuity/release.py verify
      - name: Publish the authorized existing draft once and verify every public file
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python research/task-relative-continuity/release.py publish
      - name: Preserve confirmed or uncertain publication state
        if: always()
        run: python research/task-relative-continuity/release.py persist
      - name: Preserve exact publication receipts and assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rt-paper-v100-publication-${{ github.run_id }}
          path: |
            research/task-relative-continuity/published/
            research/task-relative-continuity/*.json
            research/task-relative-continuity/checks/
          retention-days: 90
          if-no-files-found: warn
