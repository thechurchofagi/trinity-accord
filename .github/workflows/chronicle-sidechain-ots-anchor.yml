name: Chronicle Sidechain Evidence v2 OTS Anchor

on:
  workflow_run:
    workflows: ["Chronicle Polygon + Base historical NFT evidence mirror"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full commit SHA of the successful v2 evidence run to anchor"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: chronicle-sidechain-v2-ots-anchor
  cancel-in-progress: false

jobs:
  ots-anchor:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Authorize manual actor
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ACTOR: ${{ github.actor }}
          ALLOWED_ACTORS: ${{ format('{0},github-actions[bot]', vars.GUARDIAN_REGISTRY_WORKFLOW_ACTORS || 'thechurchofagi') }}
        run: |
          set -euo pipefail
          if echo ",${ALLOWED_ACTORS}," | grep -qF ",${ACTOR},"; then
            echo "Authorized workflow actor: ${ACTOR}"
          else
            echo "Unauthorized actor: ${ACTOR}" >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > toolchain-provenance.json
          cat toolchain-provenance.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned OpenTimestamps client
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ots.txt
          ots --help >/dev/null

      - name: Resolve and verify source evidence release
        id: source
        run: |
          set -euo pipefail
          test "$(printf '%s' "$SOURCE_SHA" | wc -c)" -eq 40
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          short_sha="${SOURCE_SHA:0:12}"
          source_tag="chronicle-sidechain-evidence-v2-${short_sha}"
          anchor_tag="chronicle-sidechain-ots-v2-${short_sha}"
          gh release view "$source_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          git fetch origin "refs/tags/${source_tag}:refs/tags/${source_tag}"
          tag_commit="$(git rev-list -n 1 "$source_tag")"
          test "$tag_commit" = "$SOURCE_SHA" || {
            echo "Source release tag mismatch: expected=$SOURCE_SHA actual=$tag_commit" >&2
            exit 1
          }
          mkdir -p ots-anchor
          gh release download "$source_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir ots-anchor \
            --pattern 'ANCHOR-REQUEST.json'
          test -s ots-anchor/ANCHOR-REQUEST.json
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"
          echo "anchor_tag=$anchor_tag" >> "$GITHUB_OUTPUT"

      - name: Reverify existing immutable OTS anchor
        id: existing_anchor
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          SOURCE_TAG="chronicle-sidechain-evidence-v2-${short_sha}"
          ANCHOR_TAG="chronicle-sidechain-ots-v2-${short_sha}"
          export SOURCE_TAG ANCHOR_TAG
          if ! gh release view "$ANCHOR_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "[OTS ANCHOR ABSENT] a new immutable receipt may be created"
            exit 0
          fi
          root="$RUNNER_TEMP/existing-ots-anchor"
          rm -rf "$root"
          mkdir -p "$root"
          gh release download "$ANCHOR_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root"
          test -s "$root/ANCHOR-REQUEST.json"
          test -s "$root/anchor-payload.canonical.json"
          test -s "$root/anchor-payload.canonical.json.ots"
          test -s "$root/MESSAGE-SHA256.txt"
          test -s "$root/OTS-RECEIPT.json"
          test -s "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)
          EXISTING_ROOT="$root" python3 - <<'PYVERIFY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['EXISTING_ROOT'])
          request = json.loads((root / 'ANCHOR-REQUEST.json').read_text())
          receipt = json.loads((root / 'OTS-RECEIPT.json').read_text())
          payload = (root / 'anchor-payload.canonical.json').read_bytes()
          message = hashlib.sha256(payload).hexdigest()
          expected = request.get('message_sha256')
          checks = {
              'request_schema': request.get('schema') == 'trinity-accord/chronicle-sidechain-anchor-request/v2',
              'receipt_schema': receipt.get('schema') == 'trinity-accord/chronicle-sidechain-ots-receipt/v1',
              'message_hash': message == expected == receipt.get('message_sha256'),
              'source_sha': receipt.get('source_commit_sha') == os.environ['SOURCE_SHA'],
              'source_tag': receipt.get('source_release_tag') == os.environ['SOURCE_TAG'],
              'anchor_tag': receipt.get('anchor_release_tag') == os.environ['ANCHOR_TAG'],
          }
          if not all(checks.values()):
              raise SystemExit(f'existing immutable OTS anchor failed binding checks: {checks}')
          print('[EXISTING OTS ANCHOR REVERIFIED] ' + json.dumps(checks, sort_keys=True))
          PYVERIFY
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Reconstruct exact canonical payload and verify message SHA-256
        if: steps.existing_anchor.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('ots-anchor')
          request = json.loads((root / 'ANCHOR-REQUEST.json').read_text())
          if request.get('schema') != 'trinity-accord/chronicle-sidechain-anchor-request/v2':
              raise SystemExit('unexpected anchor-request schema')
          canonical = request.get('canonical_payload_json')
          message = request.get('message_sha256')
          if not isinstance(canonical, str) or not isinstance(message, str) or not re.fullmatch(r'[0-9a-f]{64}', message):
              raise SystemExit('invalid canonical payload or message_sha256')
          payload = canonical.encode('utf-8')
          actual = hashlib.sha256(payload).hexdigest()
          if actual != message:
              raise SystemExit(f'message_sha256 mismatch: expected={message} actual={actual}')
          (root / 'anchor-payload.canonical.json').write_bytes(payload)
          (root / 'MESSAGE-SHA256.txt').write_text(message + '\n')
          print(f'[ANCHOR PAYLOAD OK] message_sha256={message}')
          PY

      - name: Submit new OpenTimestamps proof
        if: steps.existing_anchor.outputs.exists != 'true'
        run: |
          set -euo pipefail
          cd ots-anchor
          ots stamp anchor-payload.canonical.json
          test -s anchor-payload.canonical.json.ots
          ots info anchor-payload.canonical.json.ots

      - name: Build OTS receipt and checksums
        if: steps.existing_anchor.outputs.exists != 'true'
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          ANCHOR_TAG: ${{ steps.source.outputs.anchor_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          root = pathlib.Path('ots-anchor')
          req = json.loads((root / 'ANCHOR-REQUEST.json').read_text())
          proof = (root / 'anchor-payload.canonical.json.ots').read_bytes()
          receipt = {
              'schema': 'trinity-accord/chronicle-sidechain-ots-receipt/v1',
              'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z'),
              'source_commit_sha': os.environ['SOURCE_SHA'],
              'source_release_tag': os.environ['SOURCE_TAG'],
              'anchor_release_tag': os.environ['ANCHOR_TAG'],
              'message_sha256': req['message_sha256'],
              'canonical_payload_sha256': hashlib.sha256((root / 'anchor-payload.canonical.json').read_bytes()).hexdigest(),
              'ots_proof_sha256': hashlib.sha256(proof).hexdigest(),
              'status': 'calendar_submitted_pending_bitcoin_attestation',
              'boundary': 'This is a new 2026 OTS proof for the v2 sidechain anchor payload. It does not extend the historical 2025 BTC signature or ETH witnesses. Bitcoin attestation becomes independently verifiable only after the OTS proof is upgraded/confirmed.'
          }
          if receipt['message_sha256'] != receipt['canonical_payload_sha256']:
              raise SystemExit('receipt payload hash mismatch')
          (root / 'OTS-RECEIPT.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          cd ots-anchor
          sha256sum \
            ANCHOR-REQUEST.json \
            anchor-payload.canonical.json \
            anchor-payload.canonical.json.ots \
            MESSAGE-SHA256.txt \
            OTS-RECEIPT.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish immutable OTS receipt release
        if: steps.existing_anchor.outputs.exists != 'true'
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          ANCHOR_TAG: ${{ steps.source.outputs.anchor_tag }}
        run: |
          set -euo pipefail
          if gh release view "$ANCHOR_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[OTS ANCHOR RACE] immutable release appeared after preflight; re-verifying instead of mutating"
            root="$RUNNER_TEMP/raced-ots-anchor"
            rm -rf "$root"
            mkdir -p "$root"
            gh release download "$ANCHOR_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root"
            test -s "$root/SHA256SUMS"
            (cd "$root" && sha256sum -c SHA256SUMS)
            echo "[OTS ANCHOR RACE REVERIFIED] $ANCHOR_TAG"
            exit 0
          fi
          gh release create "$ANCHOR_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Chronicle sidechain evidence v2 OTS anchor — ${SOURCE_SHA:0:12}" \
            --notes "New OpenTimestamps submission for the exact canonical payload whose SHA-256 is message_sha256 in the v2 ANCHOR-REQUEST. This is separate from and does not retroactively extend historical BTC/ETH signatures. The initial receipt records calendar submission; Bitcoin attestation must be upgraded and verified when available." \
            ots-anchor/ANCHOR-REQUEST.json \
            ots-anchor/anchor-payload.canonical.json \
            ots-anchor/anchor-payload.canonical.json.ots \
            ots-anchor/MESSAGE-SHA256.txt \
            ots-anchor/OTS-RECEIPT.json \
            ots-anchor/SHA256SUMS
