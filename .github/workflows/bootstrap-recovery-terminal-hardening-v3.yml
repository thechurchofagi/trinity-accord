name: Bootstrap Recovery Terminal Hardening V3

on:
  push:
    branches:
      - agent/harden-submission-recovery-terminal-status

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/harden-submission-recovery-terminal-status
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Execute reviewed V2 patch with repository test path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/bootstrap-recovery-terminal-hardening-v2.yml').read_text(encoding='utf-8')
          step_marker = '      - name: Harden recovery verification and add regression tests\n'
          step_start = source.index(step_marker)
          run_marker = '        run: |\n'
          script_start = source.index(run_marker, step_start) + len(run_marker)
          script_end = source.index('\n      - name: Commit hardened recovery boundary', script_start)
          raw_lines = source[script_start:script_end].splitlines(keepends=True)
          script = ''.join(line[10:] if line.startswith('          ') else line for line in raw_lines)
          old = 'python3 -m pytest -q \\\n'
          new = 'PYTHONPATH="apps/record_chain_intake_gateway:." python3 -m pytest -q \\\n'
          if script.count(old) != 1:
              raise SystemExit('expected one pytest launch in reviewed V2 script')
          Path('/tmp/recovery-hardening.sh').write_text(
              '#!/usr/bin/env bash\nset -euo pipefail\n' + script.replace(old, new),
              encoding='utf-8',
          )
          PY
          chmod +x /tmp/recovery-hardening.sh
          /tmp/recovery-hardening.sh
      - name: Commit hardened recovery boundary
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/record_chain_intake_gateway/secure_entrypoint.py \
            apps/record_chain_intake_gateway/tests/test_secure_recovery_terminal_validation.py
          git commit -m "fix: fully verify recovery terminal state"
          git push origin HEAD:agent/harden-submission-recovery-terminal-status
