name: Materialize Bitcoin 12-item evidence surfaces

on:
  push:
    branches:
      - evidence/finalize-bitcoin-12-parity
    paths:
      - .github/workflows/finalize-bitcoin-12-parity-surfaces.yml
      - scripts/finalize_bitcoin_12_parity.py

permissions:
  contents: write

concurrency:
  group: finalize-bitcoin-12-parity-surfaces
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: evidence/finalize-bitcoin-12-parity

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Re-verify frozen Bitcoin v2 proof before deriving surfaces
        run: |
          python3 evidence/bitcoin-inscription-proof-annex-v2/verification/verify_annex.py > "$RUNNER_TEMP/bitcoin-v2-report.json"
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'bitcoin-v2-report.json')
          r = json.load(open(p))
          assert r['result'] == 'PASS'
          assert r['L1_INSCRIPTION_CONTENT_METADATA_AND_TAPROOT_BINDING']['inscriptions'] == 12
          assert r['L1_INSCRIPTION_CONTENT_METADATA_AND_TAPROOT_BINDING']['tag5_metadata_present'] == 1
          assert r['L1_INSCRIPTION_CONTENT_METADATA_AND_TAPROOT_BINDING']['tag5_metadata_absent_verified'] == 11
          assert r['L2_BLOCK_AND_WITNESS_INCLUSION']['reveal_transactions'] == 12
          assert r['L3_CHECKPOINT_RELATIVE_POW_ANCESTRY']['anchors'] == 12
          PY

      - name: Finalize current Bitcoin evidence surfaces
        run: python3 scripts/finalize_bitcoin_12_parity.py

      - name: Verify converged machine truth and publication boundary
        run: |
          python3 - <<'PY'
          import json
          inv = json.load(open('api/final-evidence-inventory.v1.json'))
          btc = inv['evidence_sets']['bitcoin_inscriptions']
          assert btc['count'] == 12
          assert btc['pre_canonical_formation'] == 4
          assert btc['canonical_originals'] == 3
          assert btc['post_canonical_non_amending'] == 5
          assert btc['manifest'].endswith('bitcoin-inscription-proof-annex-v2/ANNEX-MANIFEST.json')
          assert btc['historical_proof_checkpoint_v1']['count'] == 8

          live = json.load(open('api/evidence-manifest.json'))['current_cryptographic_proof_state']
          assert live['bitcoin_inscriptions']['inscription_count'] == 12
          assert live['bitcoin_inscriptions']['tag5_metadata_present'] == 1
          assert live['repository_preservation']['latest_published_version_doi'] == '10.5281/zenodo.21859437'
          assert live['repository_preservation']['live_repository_delta']['new_doi_publication'] == 'required_for_current_git_delta_not_yet_claimed_here'

          rel = json.load(open('api/evidence-relationship-map.v1.json'))
          nodes = {n['id']: n for n in rel['nodes']}
          assert nodes['bitcoin_inscription_proof_annex']['scope']['total'] == 12
          assert nodes['bitcoin_inscription_proof_annex']['historical_v1_checkpoint']['total'] == 8

          recovery = json.load(open('preservation/recovery-catalog.json'))
          assert recovery['core_repository']['current_git_verified_bitcoin_proof']['count'] == 12
          assert recovery['core_repository']['current_verified_version_doi'] == '10.5281/zenodo.21859437'
          PY
          grep -q 'v2 L1/L2/L3 PASS' authority-address-inscriptions.md
          grep -q 'bitcoin-inscription-proof-annex-v2/verification/verify_annex.py' bitcoin-inscription-mirrors/README.md
          if grep -q "do not yet have the curated set's checked-in L1/L2/L3" authority-address-inscriptions.md; then
            echo '::error::stale four-record proof-gap language remains'
            exit 1
          fi

      - name: Run focused repository contracts
        run: |
          python3 -m pip install -r requirements-ci.txt
          python3 -m pytest -q \
            tests/test_bitcoin_address_inscription_classification.py \
            tests/test_bitcoin_inscription_proof_annex_v2_contract.py

      - name: Commit derived evidence surfaces
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            api/final-evidence-inventory.v1.json \
            api/evidence-manifest.json \
            api/evidence-relationship-map.v1.json \
            preservation/recovery-catalog.json \
            authority-address-inscriptions.md \
            bitcoin-inscription-mirrors/README.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No derived evidence surface changes required.'
            exit 0
          fi
          git commit -m 'evidence: converge current Bitcoin proof scope on 12-item v2'
          git push origin HEAD:evidence/finalize-bitcoin-12-parity
