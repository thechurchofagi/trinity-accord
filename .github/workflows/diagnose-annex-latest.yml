name: Diagnose Annex Latest

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-latest.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect NFT backup manifest coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ASSET_ID: "408658898"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Accept: application/octet-stream" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/releases/assets/$ASSET_ID" \
            --output "$RUNNER_TEMP/nft-cars-manifest.tar.gz"
          mkdir "$RUNNER_TEMP/manifest"
          tar -xzf "$RUNNER_TEMP/nft-cars-manifest.tar.gz" \
            -C "$RUNNER_TEMP/manifest"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "manifest/manifest.json")
              .read_text(encoding="utf-8")
          )
          summary = {}
          for key in (
              "contracts", "downloaded", "failed", "files", "nfts",
              "timestamp", "total_txids"
          ):
              item = value.get(key)
              if isinstance(item, (list, dict)):
                  summary[key + "_type"] = type(item).__name__
                  summary[key + "_length"] = len(item)
                  if isinstance(item, list):
                      summary[key + "_first"] = item[0] if item else None
                      summary[key + "_last"] = item[-1] if item else None
                  else:
                      summary[key + "_keys"] = sorted(item)[:20]
              else:
                  summary[key] = item
          files = value.get("files")
          if isinstance(files, list):
              names = []
              for item in files:
                  if isinstance(item, dict):
                      names.append(
                          item.get("path") or item.get("name") or item.get("file")
                      )
                  else:
                      names.append(item)
              summary["file_name_sample_first"] = names[:10]
              summary["file_name_sample_last"] = names[-10:]
          print("NFT_BACKUP_MANIFEST_COVERAGE " + json.dumps(
              summary, ensure_ascii=False, sort_keys=True
          ))
          PY
