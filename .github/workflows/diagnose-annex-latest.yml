name: Diagnose Annex Latest

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-latest.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect NFT release asset inventories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trinity-nft-release-diagnosis/1.0",
          }
          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          for tag in ("nft-arweave-mirror-175-v1", "nft-backup-v1"):
              release = get(
                  f"https://api.github.com/repos/{repo}/releases/tags/"
                  + urllib.parse.quote(tag)
              )
              release_id = int(release["id"])
              assets = []
              for page in range(1, 20):
                  values = get(
                      f"https://api.github.com/repos/{repo}/releases/{release_id}/assets"
                      f"?per_page=100&page={page}"
                  )
                  assets.extend(values)
                  if len(values) < 100:
                      break
              print("NFT_RELEASE " + json.dumps({
                  "tag": tag,
                  "release_id": release_id,
                  "name": release.get("name"),
                  "draft": release.get("draft"),
                  "prerelease": release.get("prerelease"),
                  "published_at": release.get("published_at"),
                  "body": release.get("body"),
                  "asset_count": len(assets),
                  "assets": [
                      {
                          "id": item.get("id"),
                          "name": item.get("name"),
                          "size": item.get("size"),
                          "content_type": item.get("content_type"),
                      }
                      for item in assets
                  ],
              }, ensure_ascii=False, sort_keys=True))
          PY
