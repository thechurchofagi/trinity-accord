name: Diagnose Annex Latest

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-latest.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract Zenodo publisher failure context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_JOB_ID: "91441586308"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/jobs/$TARGET_JOB_ID/logs" \
            --output "$RUNNER_TEMP/annex-publisher.log"
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "annex-publisher.log"
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
          needles = (
              "Publish or reconcile final V3 annex records",
              "Traceback",
              "SystemExit",
              "Zenodo",
              "HTTP ",
              "mismatch",
              "duplicate",
              "published annex",
              "record lacks",
              "metadata",
              "checksum",
              "failed",
              "Error:",
              "error:",
          )
          matches = [
              index for index, line in enumerate(lines)
              if any(needle.lower() in line.lower() for needle in needles)
          ]
          selected = set()
          for index in matches:
              selected.update(range(max(0, index - 8), min(len(lines), index + 16)))
          print("ZENODO_FAILURE_CONTEXT_BEGIN")
          for index in sorted(selected):
              print(f"{index + 1}: {lines[index]}")
          print("ZENODO_FAILURE_CONTEXT_END")
          PY
