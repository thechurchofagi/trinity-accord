name: Diagnose Annex Latest

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-latest.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print latest annex production runs and jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trinity-annex-production-diagnosis/1.0",
          }
          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          value = get(
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "external-binary-annex-publication.yml/runs?branch=main&per_page=5"
          )
          print("LATEST_ANNEX_RUNS_BEGIN")
          for run in value.get("workflow_runs", []):
              print("RUN " + json.dumps({
                  "id": run.get("id"),
                  "run_number": run.get("run_number"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
                  "created_at": run.get("created_at"),
                  "run_started_at": run.get("run_started_at"),
                  "updated_at": run.get("updated_at"),
              }, sort_keys=True))
              jobs = get(run["jobs_url"]).get("jobs", [])
              for job in jobs:
                  print("JOB " + json.dumps({
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "steps": [
                          {
                              "name": step.get("name"),
                              "status": step.get("status"),
                              "conclusion": step.get("conclusion"),
                          }
                          for step in job.get("steps", [])
                      ],
                  }, sort_keys=True))
          print("LATEST_ANNEX_RUNS_END")
          PY
