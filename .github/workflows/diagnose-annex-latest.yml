name: Diagnose Annex Latest

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-latest.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect public Zenodo V3 annex metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          queries = [
              'metadata.title:"Trinity Accord External Evidence Binary Annex"',
              'metadata.version:"external-evidence-annex-v3"',
              'metadata.title:"Trinity Accord Chronicle NFT Media Binary Annex"',
              'metadata.version:"chronicle-nft-media-annex-v3"',
          ]
          headers = {
              "Accept": "application/json",
              "User-Agent": "trinity-public-zenodo-diagnosis/1.0",
          }
          for query in queries:
              url = "https://zenodo.org/api/records?" + urllib.parse.urlencode(
                  {"q": query, "size": 20, "sort": "mostrecent"}
              )
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  value = json.loads(response.read().decode("utf-8"))
              hits = (value.get("hits") or {}).get("hits") if isinstance(value, dict) else None
              if not isinstance(hits, list):
                  hits = []
              print("ZENODO_QUERY " + json.dumps({
                  "query": query,
                  "hit_count": len(hits),
              }, sort_keys=True))
              for record in hits:
                  metadata = record.get("metadata") if isinstance(record, dict) else None
                  if not isinstance(metadata, dict):
                      metadata = {}
                  print("ZENODO_RECORD " + json.dumps({
                      "id": record.get("id"),
                      "created": record.get("created"),
                      "updated": record.get("updated"),
                      "pids": record.get("pids"),
                      "parent": record.get("parent"),
                      "access": record.get("access"),
                      "title": metadata.get("title"),
                      "version": metadata.get("version"),
                      "publication_date": metadata.get("publication_date"),
                      "license": metadata.get("license"),
                      "rights": metadata.get("rights"),
                      "creators": metadata.get("creators"),
                      "related_identifiers": metadata.get("related_identifiers"),
                      "notes": metadata.get("notes"),
                      "files": record.get("files"),
                  }, ensure_ascii=False, sort_keys=True))
          PY
