name: Diagnose Annex Latest

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-latest.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current main validation code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
      - name: Replay public Evidence V3 metadata validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          import urllib.request
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "scripts"))
          import publish_external_binary_annexes_to_zenodo_v2 as publisher

          record_id = 21753254
          headers = {
              "Accept": "application/json",
              "User-Agent": "trinity-public-metadata-replay/1.0",
          }
          with urllib.request.urlopen(
              urllib.request.Request(
                  f"https://zenodo.org/api/records/{record_id}", headers=headers
              ),
              timeout=120,
          ) as response:
              record = json.loads(response.read().decode("utf-8"))
          with urllib.request.urlopen(
              urllib.request.Request(
                  f"https://zenodo.org/api/records/{record_id}/files/zenodo-metadata.json/content",
                  headers=headers,
              ),
              timeout=120,
          ) as response:
              expected = json.loads(response.read().decode("utf-8"))

          observed = record.get("metadata") or {}
          print("DIRECT_RECORD " + json.dumps(record, ensure_ascii=False, sort_keys=True))
          print("EXPECTED_METADATA " + json.dumps(expected, ensure_ascii=False, sort_keys=True))
          print("LICENSE_REPLAY " + json.dumps({
              "expected_license": expected.get("license"),
              "observed_license": observed.get("license"),
              "observed_rights": observed.get("rights"),
              "record_license": record.get("license"),
              "record_rights": record.get("rights"),
              "license_ids_from_metadata": sorted(publisher._license_ids(observed)),
              "access_right": observed.get("access_right"),
              "record_access_right": record.get("access_right"),
              "record_access": record.get("access"),
          }, ensure_ascii=False, sort_keys=True))
          try:
              publisher.validate_public_metadata(record, expected)
          except SystemExit as exc:
              print("VALIDATION_RESULT failure=" + str(exc))
          else:
              print("VALIDATION_RESULT passed")
          PY
