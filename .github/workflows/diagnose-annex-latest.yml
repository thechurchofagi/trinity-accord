name: Diagnose Annex Latest

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-latest.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Extract failed NFT annex log context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_JOB_ID: "91440650811"
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/jobs/$TARGET_JOB_ID/logs" \
            --output "$RUNNER_TEMP/annex-job.log"
          echo "NFT_FAILURE_MATCHES_BEGIN"
          grep -n -E -i \
            'Build complete paginated Chronicle NFT annex V3|error|exception|traceback|systemexit|failed|mismatch|duplicate|no space|required release|asset' \
            "$RUNNER_TEMP/annex-job.log" | tail -n 120 || true
          echo "NFT_FAILURE_MATCHES_END"
          echo "NFT_FAILURE_TAIL_BEGIN"
          tail -n 160 "$RUNNER_TEMP/annex-job.log"
          echo "NFT_FAILURE_TAIL_END"
