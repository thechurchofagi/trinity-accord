name: TA14 v1.2 reviewed revision
on:
  push:
    branches: [research/claim-architecture-transition-v1-2-20260922]
    paths:
      - 'research/claim-architecture-transition/v1.2/**'
      - '.github/workflows/research-paper-14-v12.yml'
permissions:
  contents: write
concurrency:
  group: ta14-v12-same-concept
  cancel-in-progress: false
jobs:
  revision:
    if: github.repository == 'thechurchofagi/trinity-accord' && (contains(github.event.head_commit.message, '[ta14-v12-build]') || contains(github.event.head_commit.message, '[ta14-v12-publish]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      MODE: ${{ contains(github.event.head_commit.message, '[ta14-v12-publish]') && 'publish' || 'prepare' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/claim-architecture-transition-v1-2-20260922
          fetch-depth: 0
      - name: Install document toolchain for preparation only
        if: env.MODE == 'prepare'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-lang-chinese fonts-texgyre fonts-noto-cjk poppler-utils
      - name: Record repository toolchain provenance
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/ta14-v12-toolchain.json"
      - name: Execute only the selected guarded phase
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/claim-architecture-transition/v1.2/pipeline.py "$MODE"
      - name: Preserve any recoverable same-record state
        if: always()
        run: python3 research/claim-architecture-transition/v1.2/pipeline.py persist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ta14-v12-${{ env.MODE }}
          path: |
            research/claim-architecture-transition/v1.2/
            ${{ runner.temp }}/ta14-v12-toolchain.json
          retention-days: 90
          if-no-files-found: error
