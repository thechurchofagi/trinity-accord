name: Prepare Set-Valued Causal Inheritance TA17
on:
  push:
    branches: [research/set-valued-causal-inheritance-v1-20260925]
    paths:
      - '.github/workflows/prepare-set-valued-causal-inheritance.yml'
      - 'research/set-valued-causal-inheritance/prepare_zenodo.py'
permissions:
  contents: write
concurrency:
  group: set-valued-causal-inheritance-zenodo-v1
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta17-prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/set-valued-causal-inheritance-v1-20260925
          fetch-depth: 1

      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex fonts-dejavu-core poppler-utils

      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py

      - name: Reserve exactly one TA17 Zenodo record and build the DOI-bound package
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/set-valued-causal-inheritance/prepare_zenodo.py

      - name: Verify exact local package
        run: python3 research/set-valued-causal-inheritance/verify_package.py

      - name: Persist reservation and generated exact package
        if: always()
        run: python3 research/set-valued-causal-inheritance/publication_common.py --persist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ta17-set-valued-causal-inheritance-preparation
          path: |
            research/set-valued-causal-inheritance/published/
            research/set-valued-causal-inheritance/deposit.json
            research/set-valued-causal-inheritance/EXPECTED-PUBLICATION.json
            research/set-valued-causal-inheritance/format-checks.json
            research/set-valued-causal-inheritance/preparation-attempt.json
          retention-days: 90
          if-no-files-found: warn
