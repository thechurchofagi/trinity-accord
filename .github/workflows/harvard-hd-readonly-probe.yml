name: Harvard HD Read-only Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harvard-hd-readonly-probe.yml
      - scripts/harvard_hd_readonly_probe.py
      - tests/test_harvard_hd_readonly_probe.py
  pull_request:
    paths:
      - .github/workflows/harvard-hd-readonly-probe.yml
      - scripts/harvard_hd_readonly_probe.py
      - tests/test_harvard_hd_readonly_probe.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Prove the probe contract
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tests/test_harvard_hd_readonly_probe.py')
          spec = importlib.util.spec_from_file_location('harvard_probe_tests', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in sorted(item for item in dir(module) if item.startswith('test_')):
              getattr(module, name)()
              print(f'PASS {name}')
          PY

      - name: Query Harvard with GET only
        env:
          PROBE_OUTPUT: ${{ runner.temp }}/harvard-hd-readonly-probe.json
        run: python3 scripts/harvard_hd_readonly_probe.py

      - name: Upload redacted result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harvard-hd-readonly-probe
          path: ${{ runner.temp }}/harvard-hd-readonly-probe.json
          retention-days: 1
          if-no-files-found: error
