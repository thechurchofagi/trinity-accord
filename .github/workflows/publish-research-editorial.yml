name: Publish dated research editorial supplement
on:
  push:
    branches: [research/editorial-doi-preservation-20260919]
    paths:
      - '.github/workflows/publish-research-editorial.yml'
      - 'research/editorial-supplement/manage.py'
      - 'research/editorial-supplement/publish_retry.py'
      - 'tests/test_research_editorial_update.py'
permissions:
  contents: write
concurrency:
  group: research-editorial-supplement-20260919
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/editorial-doi-preservation-20260919
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing OTS client and pinned text renderer
        run: |
          python3 -m pip install -r requirements-ots.txt Markdown==3.7
      - name: Test append-only metadata and publication identity rules
        run: python3 -m unittest discover -s tests -p test_research_editorial_update.py -v
      - name: Publish one editorial supplement and add links to six existing DOIs
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/editorial-supplement/publish_retry.py
      - name: Stamp the newly published file manifest and try Bitcoin upgrade
        if: always()
        env:
          OTS_BITCOIN_NODE_URL: http://127.0.0.1:18443/
        run: |
          if [ ! -f research/editorial-supplement/2026-09-19/publication-record.json ]; then exit 0; fi
          python3 scripts/bitcoin_esplora_rpc_proxy.py --host 127.0.0.1 --port 18443 --trace "$RUNNER_TEMP/editorial-proxy.jsonl" --timeout 20 > "$RUNNER_TEMP/editorial-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          python3 research/editorial-supplement/manage.py preserve
      - name: Retain all prepared files and partial-completion receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-editorial-publication-${{ github.run_id }}
          path: |
            research/editorial-supplement/2026-09-19/
            ${{ runner.temp }}/editorial-proxy.jsonl
          retention-days: 90
          if-no-files-found: warn
      - name: Commit receipts without touching any published paper or Original
        if: always()
        run: |
          if [ ! -d research/editorial-supplement/2026-09-19 ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/editorial-supplement/2026-09-19
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'research: retain editorial DOI and OTS execution receipts [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:research/editorial-doi-preservation-20260919; then exit 0; fi
            git fetch origin research/editorial-doi-preservation-20260919
            git rebase origin/research/editorial-doi-preservation-20260919 || { git rebase --abort; exit 1; }
          done
          echo 'Receipts remain in the artifact; recover before any retry.' >&2
          exit 1
