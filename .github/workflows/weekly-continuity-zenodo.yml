name: Weekly Continuity Zenodo Deposit

# This workflow deliberately does not publish a GitHub Release from this
# repository. The existing GitHub/Zenodo integration is already used for a
# research preprint, and mixing weekly dataset releases into that repository
# series would conflate two different research objects.
on:
  workflow_run:
    workflows: ["Record Chain Arweave Archive"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  deposit:
    # Automated upstream workflow events are normally dry-run. DOI publication
    # follows only the scheduled weekly paid archive window. An operator may
    # also dispatch this workflow explicitly for reconciliation.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: ${{ vars.ZENODO_API_BASE || 'https://zenodo.org/api' }}
      WEEKLY_CONTINUITY_ZENODO_RIGHTS_ACK: ${{ vars.WEEKLY_CONTINUITY_ZENODO_RIGHTS_ACK }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build deterministic weekly continuity deposit
        id: build
        run: python3 scripts/build_weekly_continuity_deposit.py

      - name: Prove package series can cold-start restore
        if: steps.build.outputs.deposit_available == 'true'
        env:
          DEPOSIT_DIR: ${{ steps.build.outputs.deposit_dir }}
        run: |
          set -euo pipefail
          recovery_args=()
          while IFS= read -r directory; do
            recovery_args+=(--deposit-dir "$directory")
          done < <(
            find record-chain/weekly-continuity-deposits \
              -mindepth 1 -maxdepth 1 -type d -print | sort
          )
          test "${#recovery_args[@]}" -gt 0
          expected_latest_record_id="$(
            python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1]))["coverage"]["current_latest_record_id"])' \
              "$DEPOSIT_DIR/weekly-continuity-bundle.json"
          )"
          python3 scripts/restore_weekly_continuity_archive.py \
            "${recovery_args[@]}" \
            --output-dir "$RUNNER_TEMP/weekly-continuity-restore" \
            --expected-latest-record-id "$expected_latest_record_id"

      - name: Commit preservation package before external publication
        if: steps.build.outputs.deposit_available == 'true'
        env:
          DEPOSIT_SERIES_DIR: ${{ steps.build.outputs.deposit_series_dir }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEPOSIT_SERIES_DIR"
          if git diff --cached --quiet; then
            echo "Weekly continuity package already committed."
            exit 0
          fi
          git commit -m "archive: prepare weekly continuity deposit"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            python3 scripts/build_weekly_continuity_deposit.py
            git add "$DEPOSIT_SERIES_DIR"
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Failed to preserve weekly continuity package on main."
          exit 1

      - name: Resolve Zenodo publication availability
        id: zenodo
        if: steps.build.outputs.deposit_available == 'true'
        run: |
          set -euo pipefail
          token_configured=false
          rights_approved=false
          if [ -z "${ZENODO_ACCESS_TOKEN:-}" ]; then
            printf '%s\n' "ZENODO_ACCESS_TOKEN is not configured."
            printf '%s\n' "The verified package remains preserved in GitHub and Arweave; DOI publication is deferred."
          else
            token_configured=true
          fi
          if [ "${WEEKLY_CONTINUITY_ZENODO_RIGHTS_ACK:-}" = \
            "TRINITY_WEEKLY_CONTINUITY_RIGHTS_V2_APPROVED" ]; then
            rights_approved=true
          else
            printf '%s\n' "The versioned mixed-rights boundary is not approved; DOI publication is deferred."
          fi
          echo "token_configured=$token_configured" >> "$GITHUB_OUTPUT"
          echo "rights_approved=$rights_approved" >> "$GITHUB_OUTPUT"
          if [ "$token_configured" = true ] && [ "$rights_approved" = true ]; then
            echo "publication_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "publication_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish independent Zenodo dataset version
        id: publish
        if: >-
          steps.build.outputs.deposit_available == 'true' &&
          steps.zenodo.outputs.publication_enabled == 'true'
        env:
          DEPOSIT_DIR: ${{ steps.build.outputs.deposit_dir }}
        run: >-
          python3 scripts/publish_weekly_continuity_to_zenodo.py
          --deposit-dir "$DEPOSIT_DIR"
          --api-base "$ZENODO_API_BASE"
          --rights-boundary-ack "$WEEKLY_CONTINUITY_ZENODO_RIGHTS_ACK"

      - name: Commit Zenodo DOI state
        if: >-
          steps.build.outputs.deposit_available == 'true' &&
          steps.zenodo.outputs.publication_enabled == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add record-chain/weekly-continuity-zenodo-state.json
          if git diff --cached --quiet; then
            echo "Zenodo state already current."
            exit 0
          fi
          git commit -m "archive: record weekly continuity DOI"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            git add record-chain/weekly-continuity-zenodo-state.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Zenodo published but DOI state could not be pushed; operator reconciliation is required."
          exit 1

      - name: Upload weekly continuity package as workflow artifact
        if: always() && steps.build.outputs.deposit_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-continuity-${{ steps.build.outputs.archive_id }}
          path: ${{ steps.build.outputs.deposit_dir }}/
          retention-days: 90
          if-no-files-found: error

      - name: Upload cold-start recovery report
        if: always() && steps.build.outputs.deposit_available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-continuity-recovery-${{ steps.build.outputs.archive_id }}
          path: ${{ runner.temp }}/weekly-continuity-restore/recovery-report.json
          retention-days: 90
          if-no-files-found: error

      - name: Deposit summary
        if: always()
        run: |
          printf 'deposit_available=%s\n' "${{ steps.build.outputs.deposit_available }}"
          printf 'archive_id=%s\n' "${{ steps.build.outputs.archive_id }}"
          printf 'deposit_dir=%s\n' "${{ steps.build.outputs.deposit_dir }}"
          printf 'zenodo_token_configured=%s\n' "${{ steps.zenodo.outputs.token_configured }}"
          printf 'zenodo_rights_approved=%s\n' "${{ steps.zenodo.outputs.rights_approved }}"
          printf 'zenodo_publication_enabled=%s\n' "${{ steps.zenodo.outputs.publication_enabled }}"
          printf 'version_doi=%s\n' "${{ steps.publish.outputs.doi }}"
          printf 'concept_doi=%s\n' "${{ steps.publish.outputs.concept_doi }}"
