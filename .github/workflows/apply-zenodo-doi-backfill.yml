name: Apply Zenodo DOI Backfill

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-zenodo-doi-backfill.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

env:
  TRACKING_ISSUE: "792"

jobs:
  apply:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout immutable bootstrap source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > toolchain-provenance.json
          cat toolchain-provenance.json

      - name: Announce DOI backfill run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf -v body '%s\n\n- Run: %s\n- Source commit: `%s`\n- DOI: `10.5281/zenodo.21699878`' \
            '### Zenodo DOI backfill started' \
            "$run_url" \
            "$GITHUB_SHA"
          jq -n --arg body "$body" '{body: $body}' > issue-comment.json
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments" \
            --input issue-comment.json \
            >/dev/null

      - name: Authorize one-time metadata writer
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$ACTOR" in
            thechurchofagi|"github-actions[bot]")
              echo "Authorized DOI metadata actor: $ACTOR"
              ;;
            *)
              echo "Unauthorized DOI metadata actor: $ACTOR" >&2
              exit 1
              ;;
          esac

      - name: Rebase before DOI update
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git rebase origin/main

      - name: Apply DOI backfill
        run: |
          set -euo pipefail
          rm scripts/test_research_preprint_doi_sync.py
          python3 scripts/apply_zenodo_doi_backfill.py

      - name: Validate DOI synchronization
        run: |
          set -euo pipefail
          python3 scripts/test_research_preprint_doi_sync.py
          python3 scripts/test_arxiv_research_preprint_builder.py
          python3 -m json.tool api/research-preprint.v1.json >/dev/null
          python3 -m json.tool \
            research/trinity-accord-design-and-limits/zenodo-publication-record.json \
            >/dev/null
          (
            cd research/trinity-accord-design-and-limits
            sha256sum -c checksums.sha256
          )

      - name: Run complete repository gates
        run: |
          set -euo pipefail
          python3 scripts/run_ci_group.py p0-current
          python3 scripts/run_current_system_tests.py

      - name: Commit, rebase, revalidate, and push DOI metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply_zenodo_doi_backfill.py
          rm .github/workflows/apply-zenodo-doi-backfill.yml
          git add -A
          git diff --cached --check
          git commit -m "research: publish Zenodo DOI metadata"

          git fetch origin main --prune
          git rebase origin/main
          python3 scripts/test_research_preprint_doi_sync.py
          python3 scripts/run_ci_group.py p0-current
          python3 scripts/run_current_system_tests.py
          test -z "$(git status --porcelain)"
          git push origin HEAD:main

      - name: Report DOI backfill success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf -v body '%s\n\n- Run: %s\n- DOI: `10.5281/zenodo.21699878`\n- Result: current citation and discovery metadata synchronized; deposited v1.1 PDF unchanged.' \
            '### Zenodo DOI backfill completed' \
            "$run_url"
          jq -n --arg body "$body" '{body: $body}' > issue-comment.json
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments" \
            --input issue-comment.json \
            >/dev/null

      - name: Report DOI backfill failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf -v body '%s\n\n- Run: %s\n- DOI: `10.5281/zenodo.21699878`\n- Result: failed closed; no DOI metadata commit was pushed.' \
            '### Zenodo DOI backfill failed' \
            "$run_url"
          jq -n --arg body "$body" '{body: $body}' > issue-comment.json
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$TRACKING_ISSUE/comments" \
            --input issue-comment.json \
            >/dev/null
