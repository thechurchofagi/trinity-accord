name: Apply Zenodo DOI Backfill

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      ${{
        github.repository == 'thechurchofagi/trinity-accord' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.title == 'Run Zenodo DOI Backfill 10.5281/zenodo.21699878'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout reviewed main source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > toolchain-provenance.json
          cat toolchain-provenance.json
          echo "DOI_BACKFILL_RUN=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install locked Python CI dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install locked Node dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --ignore-scripts --prefix examples/github-app-backend

      - name: Authorize one-time metadata writer
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$ACTOR" in
            thechurchofagi|"github-actions[bot]")
              echo "Authorized DOI metadata actor: $ACTOR"
              ;;
            *)
              echo "Unauthorized DOI metadata actor: $ACTOR" >&2
              exit 1
              ;;
          esac

      - name: Rebase before DOI update
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git rebase origin/main

      - name: Apply DOI backfill
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_zenodo_doi_backfill.py")
          text = path.read_text(encoding="utf-8")
          old = '    require("doi         = {" + DOI + "}," in bib, "BibTeX DOI missing")'
          new = '    require(DOI in bib and "doi         =" in bib, "BibTeX DOI missing")'
          if text.count(old) != 1:
              raise SystemExit("FAIL: BibTeX assertion source contract drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm scripts/test_research_preprint_doi_sync.py
          python3 scripts/apply_zenodo_doi_backfill.py

      - name: Validate DOI synchronization
        run: |
          set -euo pipefail
          python3 scripts/test_research_preprint_doi_sync.py
          python3 scripts/test_arxiv_research_preprint_builder.py
          python3 -m json.tool api/research-preprint.v1.json >/dev/null
          python3 -m json.tool \
            research/trinity-accord-design-and-limits/zenodo-publication-record.json \
            >/dev/null
          (
            cd research/trinity-accord-design-and-limits
            sha256sum -c checksums.sha256
          )

      - name: Run complete repository gates
        run: |
          set -euo pipefail
          python3 scripts/run_ci_group.py p0-current
          python3 scripts/run_current_system_tests.py

      - name: Commit, rebase, revalidate, and push DOI metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply_zenodo_doi_backfill.py
          rm .github/workflows/apply-zenodo-doi-backfill.yml
          git add -A
          git diff --cached --check
          git commit -m "research: publish Zenodo DOI metadata"

          git fetch origin main --prune
          git rebase origin/main
          python3 scripts/test_research_preprint_doi_sync.py
          python3 scripts/run_ci_group.py p0-current
          python3 scripts/run_current_system_tests.py
          test -z "$(git status --porcelain)"
          git push origin HEAD:main

      - name: Record successful completion
        run: |
          set -euo pipefail
          echo "ZENODO_DOI_BACKFILL_OK doi=10.5281/zenodo.21699878"
          echo "Deposited v1.1 PDF remained byte-identical."
