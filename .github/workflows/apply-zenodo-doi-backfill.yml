name: Apply Zenodo DOI Backfill

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      ${{
        github.repository == 'thechurchofagi/trinity-accord' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.title == 'Run Zenodo DOI Backfill 10.5281/zenodo.21699878'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout reviewed main source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > toolchain-provenance.json
          cat toolchain-provenance.json
          echo "DOI_BACKFILL_RUN=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install locked Python CI dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install locked Node dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --ignore-scripts --prefix examples/github-app-backend

      - name: Authorize one-time metadata writer
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$ACTOR" in
            thechurchofagi|"github-actions[bot]")
              echo "Authorized DOI metadata actor: $ACTOR"
              ;;
            *)
              echo "Unauthorized DOI metadata actor: $ACTOR" >&2
              exit 1
              ;;
          esac

      - name: Rebase before DOI update
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git rebase origin/main

      - name: Apply DOI and discovery backfill
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_zenodo_doi_backfill.py")
          text = path.read_text(encoding="utf-8")
          old = '    require("doi         = {" + DOI + "}," in bib, "BibTeX DOI missing")'
          new = '    require(DOI in bib and "doi         =" in bib, "BibTeX DOI missing")'
          if text.count(old) != 1:
              raise SystemExit("FAIL: BibTeX assertion source contract drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          rm scripts/test_research_preprint_doi_sync.py
          python3 scripts/apply_zenodo_doi_backfill.py

          python3 - <<'PY'
          from pathlib import Path

          doi = "10.5281/zenodo.21699878"
          doi_url = f"https://doi.org/{doi}"
          record_url = "https://zenodo.org/records/21699878"

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"FAIL: {path} expected one discovery migration, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              Path("ai.txt"),
              "# No DOI exists until the named author publishes an external repository deposit.",
              f"# DOI: {doi_url} (Zenodo record: {record_url}; preferred citation for TA-TR-2026-01 v1.1).",
          )

          contract = Path("scripts/test_discovery_visibility_contract.py")
          replace_once(
              contract,
              '    require(preprint.get("status", {}).get("doi") is None, "unminted DOI must remain null")',
              f'    require(preprint.get("status", {{}}).get("doi") == "{doi}", "published DOI drift")',
          )
          replace_once(
              contract,
              '    require(\n'
              '        preprint.get("status", {}).get("doiState") == "not_yet_deposited",\n'
              '        "DOI state must not imply a completed deposit",\n'
              '    )',
              '    require(\n'
              '        preprint.get("status", {}).get("doiState") == "published",\n'
              '        "published DOI state drift",\n'
              '    )',
          )
          replace_once(
              contract,
              '    require("No DOI exists" in ai_text, "ai.txt DOI boundary missing")',
              f'    require("{doi_url}" in ai_text, "ai.txt DOI URL missing")\n'
              f'    require("{record_url}" in ai_text, "ai.txt Zenodo record URL missing")',
          )

          sync_test = Path("scripts/test_research_preprint_doi_sync.py")
          replace_once(
              sync_test,
              '    require("byte-identical" in landing, "deposited-PDF immutability note missing")\n\n'
              '    record = json.loads((ROOT / "api/research-preprint.v1.json").read_text(encoding="utf-8"))',
              '    require("byte-identical" in landing, "deposited-PDF immutability note missing")\n\n'
              '    ai_text = (ROOT / "ai.txt").read_text(encoding="utf-8")\n'
              '    require(DOI_URL in ai_text, "ai.txt DOI URL missing")\n'
              '    require(RECORD_URL in ai_text, "ai.txt Zenodo record URL missing")\n\n'
              '    record = json.loads((ROOT / "api/research-preprint.v1.json").read_text(encoding="utf-8"))',
          )
          PY

      - name: Validate DOI synchronization
        run: |
          set -euo pipefail
          python3 scripts/test_research_preprint_doi_sync.py
          python3 scripts/test_discovery_visibility_contract.py
          python3 scripts/test_arxiv_research_preprint_builder.py
          python3 -m json.tool api/research-preprint.v1.json >/dev/null
          python3 -m json.tool \
            research/trinity-accord-design-and-limits/zenodo-publication-record.json \
            >/dev/null
          (
            cd research/trinity-accord-design-and-limits
            sha256sum -c checksums.sha256
          )

      - name: Run complete repository gates
        run: |
          set -euo pipefail
          python3 scripts/run_ci_group.py p0-current
          python3 scripts/run_current_system_tests.py

      - name: Commit, rebase, revalidate, and push DOI metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/apply_zenodo_doi_backfill.py
          rm .github/workflows/apply-zenodo-doi-backfill.yml
          git add -A
          git diff --cached --check
          git commit -m "research: publish Zenodo DOI metadata"

          git fetch origin main --prune
          git rebase origin/main
          python3 scripts/test_research_preprint_doi_sync.py
          python3 scripts/test_discovery_visibility_contract.py
          python3 scripts/run_ci_group.py p0-current
          python3 scripts/run_current_system_tests.py
          test -z "$(git status --porcelain)"
          git push origin HEAD:main

      - name: Record successful completion
        run: |
          set -euo pipefail
          echo "ZENODO_DOI_BACKFILL_OK doi=10.5281/zenodo.21699878"
          echo "Deposited v1.1 PDF remained byte-identical."
