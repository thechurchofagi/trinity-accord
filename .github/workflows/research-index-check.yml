name: Research index check
on:
  pull_request:
    paths:
      - 'research/**'
      - '_layouts/default.html'
      - 'scripts/test_reading_research_index.py'
      - '.github/workflows/research-index-check.yml'
permissions:
  contents: read
jobs:
  research-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check bounded research-index source contracts
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
          python3 scripts/test_reading_research_index.py
          python3 scripts/test_research_preprint_doi_sync.py
      - name: Build the existing Jekyll site without deploying
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Check rendered metadata, full text, and exact PDF mirror
        run: python3 scripts/test_reading_research_index.py --site-dir _site
