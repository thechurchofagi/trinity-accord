name: Align TA-TR-2026-02 Zenodo title check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ta-tr-2026-02-title-check.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Match the already-reserved Zenodo metadata title
        run: |
          set -euo pipefail
          p=.github/workflows/publish-ta-tr-2026-02-final.yml
          python3 - "$p" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          old='TITLE: "Writing Before the Outcome: Historical Position, Human–AI Authorship, and the Trinity Accord"'
          new='TITLE: "Writing Before the Outcome: Historical Position, Human-AI Authorship, and the Trinity Accord"'
          if old not in s:
              raise SystemExit('expected title line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          git commit -m 'research: align reserved Zenodo metadata title'
          git pull --rebase origin main
          git push origin HEAD:main
