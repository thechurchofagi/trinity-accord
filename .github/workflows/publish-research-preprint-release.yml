name: Publish Research Preprint Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-research-preprint-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-research-preprint-release-v1-1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04

    env:
      RELEASE_TAG: ta-tr-2026-01-v1.1
      RELEASE_TITLE: Trinity Accord Research Preprint v1.1 (TA-TR-2026-01)
      RESEARCH_DIR: research/trinity-accord-design-and-limits
      PAPER_FILE: research/trinity-accord-design-and-limits/trinity-accord-design-and-limits-v1.1.pdf
      PAPER_SHA256: 2facb19a2cfbd6d18573b7c1b18b52a7667cf0202e163c5d847ceb7a31cea4f2

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > toolchain-provenance.json
          cat toolchain-provenance.json

      - name: Authorize release writer
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$ACTOR" in
            thechurchofagi|"github-actions[bot]")
              echo "Authorized release actor: $ACTOR"
              ;;
            *)
              echo "Unauthorized release actor: $ACTOR" >&2
              exit 1
              ;;
          esac

      - name: Verify immutable preprint source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s  %s\n' "$PAPER_SHA256" "$PAPER_FILE" | sha256sum -c -

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          record = json.loads(
              (root / "api/research-preprint.v1.json").read_text(encoding="utf-8")
          )
          assert record["version"] == "1.1"
          assert record["nonAuthoritativeInterpretation"] is True
          assert record["primaryDraftingSystem"]["softwareVersion"] == "OpenAI GPT-5.6 Sol"
          assert record["primaryDraftingSystem"]["configuration"] == "Extra High reasoning"
          assert record["primaryDraftingSystem"]["notScholarlyAuthor"] is True
          assert record["author"]["name"] == "Hongju Liu"
          assert record["status"]["peerReviewed"] is False
          assert record["status"]["doi"] is None

          paper_source = (
              root / "research/trinity-accord-design-and-limits/index.md"
          ).read_text(encoding="utf-8")
          assert "Non-authoritative interpretation notice." in paper_source
          assert "**Primary drafting system:**" in paper_source
          assert (
              "ChatGPT with OpenAI GPT-5.6 Sol (Extra High reasoning)"
              in paper_source
          )
          PY

      - name: Prepare release notes and assets
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          # Trinity Accord Research Preprint v1.1

          This release archives the repository state containing:

          **Designing a Verifiable, Non-Amending Civilizational Memory Record for Future AI Agents: The Trinity Accord Case Study**

          Technical Report TA-TR-2026-01, Version 1.1

          - Primary drafting system: ChatGPT with OpenAI GPT-5.6 Sol (Extra High reasoning)
          - Responsible human author and project initiator: Hongju Liu
          - Status: author-produced, AI-drafted preprint; not peer reviewed and not independently verified
          - License for the paper: CC BY 4.0

          ## Interpretive boundary

          The paper is an analytical and descriptive research artifact. It has no interpretive authority over the Trinity Accord or its three Bitcoin Originals. It does not amend, supersede, extend, authenticate, govern, or prescribe the meaning of the Canon.

          ## Integrity

          PDF SHA-256:

          `2facb19a2cfbd6d18573b7c1b18b52a7667cf0202e163c5d847ceb7a31cea4f2`

          Creating this GitHub Release is intended to trigger the repository's enabled Zenodo archival integration. A Zenodo DOI is not claimed until an independently retrievable Zenodo record exists.
          EOF

      - name: Create or recover draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local ref_json object_sha object_type
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            if [ "$object_type" = "tag" ]; then
              object_sha="$(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object.sha'
              )"
            fi
            printf '%s\n' "$object_sha"
          }

          tag_exists=false
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              >/dev/null 2>&1; then
            tag_exists=true
            test "$(resolve_tag_commit)" = "$GITHUB_SHA"
          fi

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-pages.json
          jq --arg tag "$RELEASE_TAG" \
            '[.[][] | select(.tag_name == $tag)]' \
            release-pages.json > matching-releases.json

          release_count="$(jq 'length' matching-releases.json)"
          if [ "$release_count" -gt 1 ]; then
            echo "Multiple releases use tag name $RELEASE_TAG; refusing recovery." >&2
            exit 1
          fi

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg target "$GITHUB_SHA" \
            --arg name "$RELEASE_TITLE" \
            --rawfile body release-notes.md \
            '{
              tag_name: $tag,
              target_commitish: $target,
              name: $name,
              body: $body,
              draft: true,
              prerelease: false
            }' > draft-release-request.json

          if [ "$release_count" -eq 0 ]; then
            if [ "$tag_exists" = "true" ]; then
              echo "Tag exists without a matching release; refusing takeover." >&2
              exit 1
            fi
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --input draft-release-request.json \
              > release.json
          else
            jq '.[0]' matching-releases.json > release.json
            if [ "$(jq -r '.draft' release.json)" = "true" ]; then
              release_id="$(jq -r '.id' release.json)"
              gh api \
                --method PATCH \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                --input draft-release-request.json \
                > release.json
            else
              test "$tag_exists" = "true"
            fi
          fi

          release_id="$(jq -r '.id' release.json)"
          test "$release_id" != "null"
          test "$(jq -r '.tag_name' release.json)" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' release.json)" = "$GITHUB_SHA"
          test "$(jq -r '.name' release.json)" = "$RELEASE_TITLE"
          test "$(jq -r '.prerelease' release.json)" = "false"
          printf 'RELEASE_ID=%s\n' "$release_id" >> "$GITHUB_ENV"

      - name: Upload and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          assets=(
            "$PAPER_FILE"
            "$RESEARCH_DIR/README-DEPOSIT.txt"
            "$RESEARCH_DIR/checksums.sha256"
            "$RESEARCH_DIR/citation.bib"
            "$RESEARCH_DIR/references.bib"
            "$RESEARCH_DIR/LICENSE-CC-BY-4.0.txt"
            "$RESEARCH_DIR/zenodo-deposit-metadata.json"
          )

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > release.json
          release_is_draft="$(jq -r '.draft' release.json)"
          upload_url="$(
            jq -r '.upload_url' release.json | sed 's/{.*$//'
          )"

          for source in "${assets[@]}"; do
            name="$(basename "$source")"
            matches="$(
              jq --arg name "$name" \
                '[.assets[] | select(.name == $name)] | length' \
                release.json
            )"
            if [ "$matches" -gt 1 ]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            if [ "$matches" -eq 0 ]; then
              if [ "$release_is_draft" != "true" ]; then
                echo "Published release is missing asset: $name" >&2
                exit 1
              fi
              encoded_name="$(
                jq -rn --arg value "$name" '$value | @uri'
              )"
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@$source" \
                "${upload_url}?name=${encoded_name}" \
                > uploaded-asset.json
              test "$(jq -r '.name' uploaded-asset.json)" = "$name"
              test "$(jq -r '.state' uploaded-asset.json)" = "uploaded"
            fi
          done

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > release.json
          printf '%s\n' "${assets[@]##*/}" | sort > expected-assets.txt
          jq -r '.assets[].name' release.json | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          test "$(jq -r '.assets | length' release.json)" = "7"
          test "$(
            jq '[.assets[] | select(.state != "uploaded")] | length' release.json
          )" = "0"

          mkdir -p release-verify
          for source in "${assets[@]}"; do
            name="$(basename "$source")"
            asset_url="$(
              jq -r --arg name "$name" \
                '.assets[] | select(.name == $name) | .url' \
                release.json
            )"
            test "$asset_url" != "null"
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "release-verify/$name" \
              "$asset_url"
            cmp "$source" "release-verify/$name"
          done

          printf '%s  %s\n' \
            "$PAPER_SHA256" \
            "release-verify/$(basename "$PAPER_FILE")" \
            | sha256sum -c -

      - name: Publish release and verify public state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local ref_json object_sha object_type
            ref_json="$(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            )"
            object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            object_type="$(jq -r '.object.type' <<<"$ref_json")"
            if [ "$object_type" = "tag" ]; then
              object_sha="$(
                gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                  --jq '.object.sha'
              )"
            fi
            printf '%s\n' "$object_sha"
          }

          release_json="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          )"
          draft="$(jq -r '.draft' <<<"$release_json")"
          if [ "$draft" = "true" ]; then
            printf '%s\n' \
              '{"draft":false,"prerelease":false,"make_latest":"false"}' \
              > publish-release-request.json
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              --input publish-release-request.json \
              > published-release.json
          fi

          release_json="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )"
          test "$(jq -r '.id' <<<"$release_json")" = "$RELEASE_ID"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$GITHUB_SHA"
          test "$(jq -r '.draft' <<<"$release_json")" = "false"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
          test "$(jq -r '.assets | length' <<<"$release_json")" = "7"
          test "$(resolve_tag_commit)" = "$GITHUB_SHA"

          mkdir -p public-release-verify
          while IFS=$'\t' read -r name public_url; do
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 2 \
              --output "public-release-verify/$name" \
              "$public_url"
            cmp \
              "$RESEARCH_DIR/$name" \
              "public-release-verify/$name"
          done < <(
            jq -r \
              '.assets[] | [.name, .browser_download_url] | @tsv' \
              <<<"$release_json"
          )

          cmp \
            "$PAPER_FILE" \
            "public-release-verify/$(basename "$PAPER_FILE")"
          jq -r '.html_url' <<<"$release_json"
