name: Commit Hardened Runtime Fix

on:
  push:
    branches:
      - agent/bind-runtime-protection-attestation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/bind-runtime-protection-attestation
          fetch-depth: 0
      - name: Apply already-tested non-workflow changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "apps/record_chain_intake_gateway/secure_entrypoint.py",
              "runtime.mark_protection_layer_active()\n",
              "runtime.mark_protection_layer_active(runtime.BASE_PROTECTION_ENTRYPOINT)\n",
          )
          replace_once(
              "apps/record_chain_intake_gateway/secure_entrypoint_hardened.py",
              "base._read_text = _deeply_verified_read_text\napp = base.app\n",
              "base._read_text = _deeply_verified_read_text\n"
              "base.runtime.mark_protection_layer_active(\n"
              "    base.runtime.HARDENED_PROTECTION_ENTRYPOINT\n"
              ")\n"
              "app = base.app\n",
          )

          path = Path("tests/test_hardened_render_deploy_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_runtime_reports_configured_hardened_entrypoint(monkeypatch) -> None:\n    monkeypatch.setenv("TRINITY_GATEWAY_PROTECTION_ENTRYPOINT", EXPECTED_ENTRYPOINT)\n    runtime.mark_protection_layer_active()\n    assert runtime.get_runtime_info()["protection_entrypoint"] == EXPECTED_ENTRYPOINT\n'''
          new = '''def test_runtime_reports_loaded_hardened_entrypoint(monkeypatch) -> None:\n    monkeypatch.setattr(runtime, "_protection_layer_active", False)\n    monkeypatch.setattr(runtime, "_protection_entrypoint", None)\n    monkeypatch.setenv(\n        "TRINITY_GATEWAY_PROTECTION_ENTRYPOINT",\n        runtime.BASE_PROTECTION_ENTRYPOINT,\n    )\n    runtime.mark_protection_layer_active(\n        runtime.HARDENED_PROTECTION_ENTRYPOINT\n    )\n    assert runtime.get_runtime_info()["protection_entrypoint"] == EXPECTED_ENTRYPOINT\n'''
          if text.count(old) != 1:
              raise SystemExit("stale hardened runtime test block not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Commit formal non-workflow changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/record_chain_intake_gateway/secure_entrypoint.py \
            apps/record_chain_intake_gateway/secure_entrypoint_hardened.py \
            tests/test_hardened_render_deploy_contract.py
          git commit -m "fix: bind hardened Gateway runtime proof"
          git push origin HEAD:agent/bind-runtime-protection-attestation
