name: Repository Integrity Check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repository-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  current-system-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          show-progress: false

      # These contracts are stdlib-only. Run them before dependency setup so
      # stale active guidance fails fast and the failing contract family is
      # visible directly in the job step summary.
      - name: Verify Agent Start current contract
        run: python3 scripts/test_agent_start_docs.py agent-start

      - name: Verify Guardian current-route contract
        run: python3 scripts/test_agent_start_docs.py guardian-current

      - name: Verify Guardian retired-route omissions
        run: python3 scripts/test_agent_start_docs.py guardian-retired

      - name: Verify active agent docs current-model clarity
        run: python3 scripts/test_external_agent_docs_core_routes_clarity.py

      - name: Verify public wording and submission routes
        run: python3 scripts/test_public_wording_phase6_contract.py

      - name: Verify production-status wording
        run: python3 scripts/test_public_production_status_alignment.py

      - name: Verify external-agent first-contact rules
        run: python3 scripts/test_external_agent_first_contact_rules_contract.py

      - name: Verify external-agent entrypoint consistency
        run: python3 scripts/test_external_agent_entrypoint_consistency_contract.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Verify Builder receipt boundary fields are synchronized
        run: python3 scripts/check_builder_receipt_boundary_sync.py

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Verify CI and code alignment
        run: python3 scripts/test_ci_code_alignment.py

      - name: Reject missing workflow and CI-group executables
        run: python3 scripts/test_workflows_do_not_reference_missing_scripts.py

      - name: Verify workflow permissions and retired writers
        run: python3 scripts/test_workflow_permissions.py

      - name: Compile current Python sources
        run: python3 -m compileall -q scripts apps tests

      - name: Verify agent-start API contract
        run: python3 scripts/test_agent_start_api.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Verify root Node dependency lockfile
        run: npm ci

      - name: Verify retired Node service dependency lockfile
        run: |
          npm ci --ignore-scripts --prefix examples/github-app-backend
          node --check examples/github-app-backend/server.js

      - name: Verify gateway error recovery context
        run: node examples/github-app-backend/test-gateway-error-recovery-context.mjs

      - name: Verify Pages deployment contract
        run: python3 scripts/test_deploy_pages_workflow_contract.py

      - name: Verify mission governance contract
        run: python3 scripts/test_mission_governance_contract.py

      - name: Verify current Echo taxonomy
        run: python3 scripts/test_no_stale_echo_taxonomy_names.py

      - name: Verify concurrent preflight swarm contract
        run: python3 scripts/test_concurrent_preflight_swarm_contract.py

      - name: Verify external-agent E2E journey matrix
        run: python3 scripts/test_agent_e2e_journey_matrix.py

      - name: Verify interpretation and verification migration
        run: python3 tests/test_interpretation_and_verification_migration.py

      - name: Verify verification procedure model
        run: python3 tests/test_verification_procedure_model.py

      - name: Verify Builder multidimensional verification
        run: python3 scripts/test_builder_multidimensional_verification.py

      - name: Validate strict repository JSON
        run: python3 scripts/validate_json_strict.py

      - name: Verify record-chain
        run: python3 scripts/trinity_record_chain.py verify

      - name: Verify sitemap has no committed drift
        run: python3 scripts/generate_sitemap.py --check

      - name: Run current system tests
        shell: bash
        run: |
          set +e
          python3 scripts/run_current_system_tests.py > /tmp/current-system-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Current system test failure tail"
            tail -n 120 /tmp/current-system-tests.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 40 /tmp/current-system-tests.log

      - name: Verify public home status contracts
        run: |
          set -euo pipefail
          # Dynamic homepage generated-file drift is owned by homepage-status-sync.yml.
          # This workflow only checks stable contracts and non-volatile generated sources.
          python3 scripts/generate_arweave_wallet_status.py --check
          python3 scripts/generate_record_chain_status.py --check
          python3 scripts/check_public_home_status_contract.py
          python3 scripts/test_historic_autonomous_agent_reception_contract.py
          python3 scripts/test_home_public_status_sync.py
          python3 scripts/test_homepage_status_sync_contract.py

      - name: Scan for secret material (broad)
        run: python3 scripts/test_no_secret_material_committed.py

      - name: Check no private keys or tokens (focused PEM)
        run: python3 scripts/test_no_private_key_material_committed.py

      - name: Run P0 current fast gate
        id: p0_current
        continue-on-error: true
        shell: bash
        run: python3 scripts/run_ci_group.py p0-current > /tmp/p0-current.log 2>&1

      - name: Upload P0 current failure log
        if: steps.p0_current.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0-current-log
          path: /tmp/p0-current.log
          if-no-files-found: error
          retention-days: 3

      - name: Surface P0 current failure
        if: steps.p0_current.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::P0 current failure tail"
          tail -n 180 /tmp/p0-current.log
          echo "::endgroup::"
          exit 1

      - name: Show P0 current success tail
        if: steps.p0_current.outcome == 'success'
        run: tail -n 40 /tmp/p0-current.log

  refresh-repository-preservation-doi:
    needs: current-system-integrity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: main-write-lock
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK: ${{ vars.PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK }}
    steps:
      - name: Checkout repository with full source history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record publication toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/workflow-toolchain-provenance.json"
          cat "$RUNNER_TEMP/workflow-toolchain-provenance.json"

      - name: Execute repository preservation refresh after integrity success
        run: bash scripts/run_repository_preservation_refresh_ci.sh

      - name: Upload repository preservation refresh proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-preservation-refresh-proof-integrity
          path: |
            ${{ runner.temp }}/local-restored-repository/recovery-report.json
            ${{ runner.temp }}/public-restored-repository/recovery-report.json
            ${{ runner.temp }}/public-metadata-report.json
            ${{ runner.temp }}/toolchain-provenance.json
            ${{ runner.temp }}/workflow-toolchain-provenance.json
          retention-days: 365
          if-no-files-found: warn

  apply-pr894-submit-recovery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-submit-recovery-receipt-provenance-20260803
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Require exact target head
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/fix-submit-recovery-receipt-provenance-20260803"
          test "$(git rev-parse HEAD)" = "610550bba63f3ec3c1e06c60644ab0a0929dd6a6"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements-ci.txt
          npm ci

      - name: Apply exact audited patch
        id: apply_patch
        run: |
          set -euo pipefail
          python3 scripts/apply_submit_recovery_patch_once.py
          python3 scripts/apply_submit_recovery_followup_once.py
          python3 scripts/update_record_chain_builder_manifest.py
          git diff --check

      - name: Run focused and existing regressions
        id: regressions
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_record_chain_submit_recovery.py
          python3 -m pytest -q apps/record_chain_intake_gateway/tests
          node scripts/test_record_chain_builder.mjs
          python3 scripts/trinity_record_chain.py verify

      - name: Commit final target patch
        id: commit_patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-submit-recovery-receipt-provenance-once.yml
          rm -f .github/workflows/run-submit-recovery-patch-once.yml
          rm -f scripts/apply_submit_recovery_patch_once.py
          rm -f scripts/apply_submit_recovery_followup_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/record_chain_intake_gateway/app.py \
                  apps/record_chain_intake_gateway/protected_app.py \
                  downloads/record-chain-builder.mjs \
                  scripts/update_record_chain_builder_manifest.py \
                  api/record-chain-builder-bundles.v1.json \
                  api/record-chain-intake-gateway.v1.json \
                  tests/test_record_chain_submit_recovery.py \
                  .github/workflows/apply-submit-recovery-receipt-provenance-once.yml \
                  .github/workflows/run-submit-recovery-patch-once.yml \
                  scripts/apply_submit_recovery_patch_once.py \
                  scripts/apply_submit_recovery_followup_once.py
          git commit -m "fix: recover ambiguous submits and preserve receipt provenance"
          git push origin HEAD:agent/fix-submit-recovery-receipt-provenance-20260803

      - name: Publish executor result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_OUTCOME: ${{ steps.apply_patch.outcome }}
          TEST_OUTCOME: ${{ steps.regressions.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_patch.outcome }}
        run: |
          set -euo pipefail
          gh pr comment 894 --repo "$GITHUB_REPOSITORY" --body "## PR #894 registered-workflow executor result

- Workflow run: \`${GITHUB_RUN_ID}\`
- Exact patch: \`${APPLY_OUTCOME}\`
- Focused + Gateway + Builder + Record-Chain tests: \`${TEST_OUTCOME}\`
- Final branch commit/push: \`${COMMIT_OUTCOME}\`

The executor was locked to target head \`610550bba63f3ec3c1e06c60644ab0a0929dd6a6\`; any mismatch fails closed."
