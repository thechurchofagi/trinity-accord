name: Manual Bitcoin Checkpoint Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/manual-bitcoin-checkpoint-dispatch.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch Bitcoin Consensus Checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/bitcoin-consensus-checkpoint.yml/dispatches" \
            -f ref=main \
            -F 'inputs[force_checkpoint]=false'
          echo "Bitcoin Consensus Checkpoint dispatch accepted."
