name: Reconcile Published Repository Preservation DOI V5

on:
  push:
    branches:
      - main
    paths:
      - preservation/publication-reconcile-public-v5.json

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  public-self-proof:
    if: >-
      github.actor == 'thechurchofagi' &&
      startsWith(github.event.head_commit.message, 'archive: reconcile first repository preservation DOI by public self-proof')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      PUBLIC_RECORD_ID: "21739344"
      EXPECTED_RECOVERY_COMMIT: 83a3ba042e8786ed1ce1234c3991110c06bde71c
      EXPECTED_TREE_OID: 47aa1f8b77f6f0c77237906b53929c08b665060f
    steps:
      - name: Checkout current production repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record reconciliation toolchain provenance
        run: |
          set -euo pipefail
          echo "toolchain-provenance-public-v5" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/public-v5-toolchain-provenance.json"
          cat "$RUNNER_TEMP/public-v5-toolchain-provenance.json"

      - name: Validate exact owner authorization and read-only V5 contract
        id: precheck
        run: |
          set -euo pipefail
          echo "authorization-precheck-public-v5" > "$RUNNER_TEMP/publication-stage.txt"
          test "$GITHUB_ACTOR" = "thechurchofagi"
          python3 - <<'PY'
          import json
          from pathlib import Path

          authorization = json.loads(
              Path("preservation/publication-authorization-v1.json").read_text(encoding="utf-8")
          )
          expected_authorization = {
              "schema": "trinityaccord.repository-preservation-publication-authorization.v1",
              "authorized_by": "thechurchofagi",
              "authorized_at": "2026-08-01T19:42:00+08:00",
              "authorization": "publish_first_repository_preservation_doi",
              "publication_confirmation": "PUBLISH_TRINITY_REPOSITORY_CAPSULE_V1",
              "rights_boundary_ack": "TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED",
              "access_right": "other-closed",
              "scope": {
                  "core_git_tracked_tree_only": True,
                  "external_large_binary_annex_embedded": False,
              },
          }
          if authorization != expected_authorization:
              raise SystemExit("owner publication authorization changed")

          marker = json.loads(
              Path("preservation/publication-reconcile-public-v5.json").read_text(encoding="utf-8")
          )
          expected_marker = {
              "schema": "trinityaccord.repository-preservation-public-record-reconciliation.v1",
              "authorized_by": "thechurchofagi",
              "authorized_at": "2026-08-01T19:42:00+08:00",
              "reconciliation_requested_at": "2026-08-01T21:22:00+08:00",
              "operation": "public_record_self_proof_only",
              "zenodo_write_allowed": False,
              "record_id": 21739344,
              "expected_capsule_id": "repository-484bdd7a8569",
              "expected_source_commit": "484bdd7a85694ad53fe7e6e9dcea94d0dee5617e",
              "expected_tree_oid": "47aa1f8b77f6f0c77237906b53929c08b665060f",
              "expected_recovery_commit": "83a3ba042e8786ed1ce1234c3991110c06bde71c",
              "expected_tracked_file_count": 4253,
              "acceptance_rule": "record_own_eight_files_hashes_rights_and_public_restore_must_pass",
              "scope": {
                  "core_git_tracked_tree_only": True,
                  "external_large_binary_annex_embedded": False,
              },
          }
          if marker != expected_marker:
              raise SystemExit("public-record reconciliation marker changed")

          state = json.loads(Path("preservation/zenodo-state.json").read_text(encoding="utf-8"))
          if state.get("publication_status") == "published":
              raise SystemExit("repository preservation DOI is already recorded as published")
          PY

      - name: Run public-record V5 regression tests
        run: |
          set -euo pipefail
          echo "public-v5-regression-tests" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/test_reconcile_published_zenodo_capsule_v5.py

      - name: Download and verify the published record without credentials
        id: reconcile
        run: |
          set -euo pipefail
          echo "public-record-self-proof" > "$RUNNER_TEMP/publication-stage.txt"
          env -u ZENODO_ACCESS_TOKEN python3 scripts/reconcile_published_zenodo_capsule_v5.py \
            --record-id "$PUBLIC_RECORD_ID" \
            --download-dir "$RUNNER_TEMP/public-zenodo-capsule" \
            --state preservation/zenodo-state.json \
            --observation preservation/zenodo-record-21739344-observation.json

      - name: Execute the published record's own DOI-only restore program
        run: |
          set -euo pipefail
          echo "independent-public-doi-cold-restore" > "$RUNNER_TEMP/publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/public-bootstrap"
          cp "$RUNNER_TEMP/public-zenodo-capsule/restore-trinity-accord.py" \
            "$RUNNER_TEMP/public-bootstrap/restore-trinity-accord.py"
          cd "$RUNNER_TEMP/public-bootstrap"
          env -u ZENODO_ACCESS_TOKEN python3 restore-trinity-accord.py \
            --zenodo-record-id "$PUBLIC_RECORD_ID" \
            --output-dir "$RUNNER_TEMP/public-doi-restore"
          test -f "$RUNNER_TEMP/public-doi-restore/recovery-report.json"
          test "$(git -C "$RUNNER_TEMP/public-doi-restore/repository" rev-parse HEAD)" = \
            "$EXPECTED_RECOVERY_COMMIT"
          test "$(git -C "$RUNNER_TEMP/public-doi-restore/repository" rev-parse 'HEAD^{tree}')" = \
            "$EXPECTED_TREE_OID"
          python3 "$RUNNER_TEMP/public-doi-restore/repository/scripts/audit_recovery_readiness.py"

      - name: Seal public restoration evidence in the observation
        run: |
          set -euo pipefail
          echo "seal-public-restoration-evidence" > "$RUNNER_TEMP/publication-stage.txt"
          python3 - <<'PY'
          import json
          from pathlib import Path

          observation_path = Path("preservation/zenodo-record-21739344-observation.json")
          observation = json.loads(observation_path.read_text(encoding="utf-8"))
          if observation.get("capsule_self_verification") != "passed":
              raise SystemExit("capsule self-verification was not passed")
          observation["independent_public_restore_required_before_state_commit"] = False
          observation["independent_public_doi_restore"] = {
              "status": "passed",
              "zenodo_record_id": 21739344,
              "recovery_commit_sha": "83a3ba042e8786ed1ce1234c3991110c06bde71c",
              "git_tree_oid": "47aa1f8b77f6f0c77237906b53929c08b665060f",
              "github_credentials_used": False,
              "zenodo_credentials_used": False,
              "recovery_readiness_audit": "passed",
          }
          observation_path.write_text(
              json.dumps(observation, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit only the publicly proven DOI state
        run: |
          set -euo pipefail
          echo "commit-publicly-proven-doi-state" > "$RUNNER_TEMP/publication-stage.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            preservation/zenodo-state.json \
            preservation/zenodo-record-21739344-observation.json
          if test -f preservation/publication-attempt-status.json; then
            git rm preservation/publication-attempt-status.json
          fi
          if git diff --cached --quiet; then
            echo "::error::Public record proof did not produce a DOI state update."
            exit 1
          fi
          git commit -m "archive: record publicly proven repository preservation DOI"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            git add \
              preservation/zenodo-state.json \
              preservation/zenodo-record-21739344-observation.json
            if test -f preservation/publication-attempt-status.json; then
              git rm preservation/publication-attempt-status.json
            fi
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Record a visible V5 proof failure
        if: failure()
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch preservation/zenodo-state.json >/dev/null 2>&1; then
            if ! git diff --cached --quiet -- preservation/zenodo-state.json; then
              git restore --staged preservation/zenodo-state.json
            fi
            if ! git diff --quiet -- preservation/zenodo-state.json; then
              git restore preservation/zenodo-state.json
            fi
          fi
          if git ls-files --error-unmatch preservation/zenodo-record-21739344-observation.json >/dev/null 2>&1; then
            if ! git diff --cached --quiet -- preservation/zenodo-record-21739344-observation.json; then
              git restore --staged preservation/zenodo-record-21739344-observation.json
            fi
            if ! git diff --quiet -- preservation/zenodo-record-21739344-observation.json; then
              git restore preservation/zenodo-record-21739344-observation.json
            fi
          elif test -f preservation/zenodo-record-21739344-observation.json; then
            rm preservation/zenodo-record-21739344-observation.json
          fi
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          stage_path = Path(os.environ["RUNNER_TEMP"]) / "publication-stage.txt"
          stage = stage_path.read_text(encoding="utf-8").strip() if stage_path.exists() else "unknown"
          value = {
              "schema": "trinityaccord.repository-preservation-publication-attempt.v1",
              "status": "failed",
              "stage": stage,
              "target_commit": "484bdd7a85694ad53fe7e6e9dcea94d0dee5617e",
              "zenodo_record_id_under_public_proof": 21739344,
              "zenodo_write_attempted": False,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "trigger_commit": os.environ["GITHUB_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
              "failed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "publication_status_after_failure": "not_verified",
          }
          Path("preservation/publication-attempt-status.json").write_text(
              json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/publication-attempt-status.json
          git commit -m "archive: record public DOI self-proof failure"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload public self-proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-preservation-public-record-v5-evidence
          path: |
            ${{ runner.temp }}/public-zenodo-capsule/
            ${{ runner.temp }}/public-doi-restore/recovery-report.json
            ${{ runner.temp }}/public-v5-toolchain-provenance.json
            preservation/zenodo-record-21739344-observation.json
          retention-days: 365
          if-no-files-found: warn
