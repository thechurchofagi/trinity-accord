name: Prepare UCT Paper A v1.1
on:
  push:
    branches: [research/uct-paper-a-v1-1-20260929]
    paths:
      - '.github/workflows/prepare-uct-paper-a-v11.yml'
      - 'research/unified-consciousness-theory-i/versions/v1.1/publication_common.py'
      - 'research/unified-consciousness-theory-i/versions/v1.1/prepare_zenodo.py'
      - 'research/unified-consciousness-theory-i/versions/v1.1/test_publication_safety.py'
      - 'research/unified-consciousness-theory-i/versions/v1.1/TRIGGER-PREPARE.txt'
permissions:
  contents: write
concurrency:
  group: uct-paper-a-zenodo-v1-1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta20-v11-prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/uct-paper-a-v1-1-20260929
          fetch-depth: 1
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex fonts-dejavu-core poppler-utils
      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py
      - name: Safety checks
        run: python3 research/unified-consciousness-theory-i/versions/v1.1/test_publication_safety.py
      - name: Reserve linked v1.1 and build exact DOI-bound package
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/unified-consciousness-theory-i/versions/v1.1/prepare_zenodo.py
      - name: Verify exact local package
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'research/unified-consciousness-theory-i/versions/v1.1')
          from publication_common import validate_local_package
          e,d=validate_local_package()
          print(e['doi'],e['file_count'],d)
          PY
      - name: Persist reservation and exact package
        if: always()
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'research/unified-consciousness-theory-i/versions/v1.1')
          from publication_common import persist
          persist()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ta20-uct-paper-a-v1.1-preparation
          path: |
            research/unified-consciousness-theory-i/versions/v1.1/published/
            research/unified-consciousness-theory-i/versions/v1.1/deposit.json
            research/unified-consciousness-theory-i/versions/v1.1/EXPECTED-PUBLICATION.json
            research/unified-consciousness-theory-i/versions/v1.1/format-checks.json
            research/unified-consciousness-theory-i/versions/v1.1/preparation-attempt.json
          retention-days: 90
          if-no-files-found: warn
