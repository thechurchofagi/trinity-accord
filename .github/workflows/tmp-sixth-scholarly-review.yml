name: Temporary sixth scholarly parser review applicator

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/tmp-sixth-scholarly-review.yml"

permissions:
  contents: write

jobs:
  apply-sixth-review-fixes:
    if: github.event.pull_request.number == 1071 && github.event.pull_request.head.ref == 'agent/close-final-scholarly-parser-gaps-2026-08-21'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0

      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py

      - name: Apply sixth-round Codex review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/check_deployment_freshness.py')
          tests_path = Path('tests/test_scholarly_parser_edge_cases.py')
          source = source_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:start_index] + replacement + text[end_index:]

          parser_class = r'''class ScholarlyHTMLParser(HTMLParser):
              """Extract browser-visible head citation meta and document-wide JSON-LD."""

              _SVG_HTML_INTEGRATION_POINTS = {"foreignobject", "desc", "title"}
              _MATHML_TEXT_INTEGRATION_POINTS = {"mi", "mo", "mn", "ms", "mtext"}
              _MATHML_HTML_ENCODINGS = {"text/html", "application/xhtml+xml"}

              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.meta: dict[str, list[str]] = {}
                  self.json_ld_blocks: list[str] = []
                  self.errors: list[str] = []
                  self._in_head = False
                  self._head_seen = False
                  self._body_started = False
                  self._template_depth = 0
                  # Retained as a diagnostic counter for open SVG/MathML-namespace
                  # elements. Namespace-sensitive decisions use _element_stack so
                  # HTML integration points are handled correctly.
                  self._foreign_content_depth = 0
                  self._element_stack: list[
                      tuple[str, str, dict[str, str | None]]
                  ] = []
                  self._head_text_stack: list[str] = []
                  self._in_noscript_raw = False
                  self._in_json_ld = False
                  self._json_ld_chunks: list[str] = []

              def _namespace_for_start(
                  self,
                  tag: str,
                  attributes: dict[str, str | None],
              ) -> str:
                  if not self._element_stack:
                      return "html"
                  parent_tag, parent_namespace, parent_attributes = self._element_stack[-1]
                  if parent_namespace == "html":
                      if tag == "svg":
                          return "svg"
                      if tag == "math":
                          return "math"
                      return "html"
                  if parent_namespace == "svg":
                      if parent_tag in self._SVG_HTML_INTEGRATION_POINTS:
                          if tag == "svg":
                              return "svg"
                          if tag == "math":
                              return "math"
                          return "html"
                      return "svg"
                  if parent_namespace == "math":
                      if (
                          parent_tag in self._MATHML_TEXT_INTEGRATION_POINTS
                          and tag not in {"mglyph", "malignmark"}
                      ):
                          if tag == "svg":
                              return "svg"
                          if tag == "math":
                              return "math"
                          return "html"
                      if parent_tag == "annotation-xml":
                          encoding = (parent_attributes.get("encoding") or "").lower()
                          if encoding in self._MATHML_HTML_ENCODINGS:
                              if tag == "svg":
                                  return "svg"
                              if tag == "math":
                                  return "math"
                              return "html"
                      return "math"
                  return "html"

              def _push_element(
                  self,
                  tag: str,
                  namespace: str,
                  attributes: dict[str, str | None],
              ) -> None:
                  self._element_stack.append((tag, namespace, attributes))
                  if namespace != "html":
                      self._foreign_content_depth += 1
                  if tag == "template" and namespace == "html":
                      self._template_depth += 1

              def _pop_through_matching_element(self, tag: str) -> str | None:
                  match_index = None
                  for index in range(len(self._element_stack) - 1, -1, -1):
                      if self._element_stack[index][0] == tag:
                          match_index = index
                          break
                  if match_index is None:
                      return None
                  matched_namespace = self._element_stack[match_index][1]
                  popped = self._element_stack[match_index:]
                  del self._element_stack[match_index:]
                  for popped_tag, namespace, _attributes in popped:
                      if namespace != "html":
                          self._foreign_content_depth = max(
                              0, self._foreign_content_depth - 1
                          )
                      if popped_tag == "template" and namespace == "html":
                          self._template_depth = max(0, self._template_depth - 1)
                  return matched_namespace

              def _handle_starttag(
                  self,
                  tag: str,
                  attrs: list[tuple[str, str | None]],
                  *,
                  self_closing: bool,
              ) -> None:
                  tag = tag.lower()
                  if self._in_noscript_raw:
                      return
                  attributes, duplicates, values = _first_attributes(attrs)
                  namespace = self._namespace_for_start(tag, attributes)

                  # A non-head HTML start tag implicitly ends the optional document
                  # head even when both </head> and <body> are omitted.
                  if (
                      namespace == "html"
                      and self._in_head
                      and self._template_depth == 0
                      and not self._head_text_stack
                      and tag not in HEAD_MODE_START_TAGS
                  ):
                      self._in_head = False
                      self._body_started = True

                  if (
                      namespace == "html"
                      and tag == "body"
                      and self._template_depth == 0
                      and not self._head_text_stack
                  ):
                      self._body_started = True
                      self._in_head = False

                  if (
                      namespace == "html"
                      and tag == "head"
                      and not self._head_seen
                      and not self._body_started
                  ):
                      self._head_seen = True
                      self._in_head = True

                  # Foreign-content self-closing syntax is acknowledged; HTML
                  # self-closing syntax on non-void elements is ignored.
                  should_push = not (
                      namespace != "html" and self_closing
                  ) and not (
                      namespace == "html" and tag in HTML_VOID_ELEMENTS
                  )
                  if should_push:
                      self._push_element(tag, namespace, attributes)

                  if (
                      namespace == "html"
                      and tag in HEAD_TEXT_TAGS
                      and self._in_head
                      and self._template_depth == 0
                  ):
                      self._head_text_stack.append(tag)

                  if namespace == "html" and tag == "noscript":
                      # With scripting enabled, noscript content is raw text.
                      self._in_noscript_raw = True

                  if (
                      namespace == "html"
                      and tag == "meta"
                      and self._in_head
                      and self._template_depth == 0
                  ):
                      name_values = [
                          value for value in values.get("name", []) if value is not None
                      ]
                      scholarly_candidate = any(
                          value in SCHOLARLY_META_EXPECTED for value in name_values
                      )
                      relevant_duplicates = duplicates & {"name", "content"}
                      if scholarly_candidate and relevant_duplicates:
                          self.errors.append(
                              "scholarly meta contains duplicate attribute(s): "
                              + ", ".join(sorted(relevant_duplicates))
                          )
                      name = attributes.get("name")
                      content = attributes.get("content")
                      if name is not None:
                          self.meta.setdefault(name, []).append(content or "")

                  if (
                      namespace == "html"
                      and tag == "script"
                      and self._template_depth == 0
                  ):
                      type_values = [
                          value for value in values.get("type", []) if value is not None
                      ]
                      contains_json_ld_type = any(
                          value.lower() == "application/ld+json" for value in type_values
                      )
                      if contains_json_ld_type and "type" in duplicates:
                          self.errors.append(
                              "scholarly JSON-LD script contains duplicate type attribute"
                          )
                      script_type = attributes.get("type") or ""
                      if script_type.lower() == "application/ld+json":
                          self._in_json_ld = True
                          self._json_ld_chunks = []

              def handle_starttag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  self._handle_starttag(tag, attrs, self_closing=False)

              def handle_startendtag(
                  self,
                  tag: str,
                  attrs: list[tuple[str, str | None]],
              ) -> None:
                  self._handle_starttag(tag, attrs, self_closing=True)

              def handle_data(self, data: str) -> None:
                  if self._in_json_ld:
                      self._json_ld_chunks.append(data)
                  if (
                      self._in_head
                      and self._template_depth == 0
                      and not self._head_text_stack
                      and data.strip()
                  ):
                      self._in_head = False
                      self._body_started = True

              def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  if self._in_noscript_raw:
                      if tag != "noscript":
                          return
                      self._in_noscript_raw = False
                  if tag == "script" and self._in_json_ld:
                      self.json_ld_blocks.append(
                          "".join(self._json_ld_chunks).strip()
                      )
                      self._in_json_ld = False
                      self._json_ld_chunks = []
                  if (
                      tag in {"body", "html", "br"}
                      and self._in_head
                      and self._template_depth == 0
                      and not self._head_text_stack
                  ):
                      self._in_head = False
                      self._body_started = True
                  if self._head_text_stack and tag == self._head_text_stack[-1]:
                      self._head_text_stack.pop()

                  matched_namespace = self._pop_through_matching_element(tag)

                  if (
                      tag == "head"
                      and matched_namespace == "html"
                      and self._in_head
                      and self._template_depth == 0
                  ):
                      self._in_head = False
                  if (
                      tag == "body"
                      and matched_namespace == "html"
                      and self._template_depth == 0
                  ):
                      self._body_started = True
                      self._in_head = False
          
          
          '''
          source = replace_between(
              source,
              'class ScholarlyHTMLParser(HTMLParser):',
              'def sha256(data: bytes) -> str:',
              parser_class,
              'namespace-aware HTML parser',
          )

          old_prefix = r'''def _prefix_mapping(
              definition: object,
              prefixes: dict[str, str],
          ) -> str | None:
              explicit_prefix = False
              if isinstance(definition, dict):
                  explicit_prefix = definition.get("@prefix") is True
                  definition = definition.get("@id")
              if not isinstance(definition, str):
                  return None
              expanded = _expand_compact_iri(definition, prefixes)
              if not expanded.startswith(("http://", "https://")):
                  return None
              if explicit_prefix or expanded.endswith(("/", "#")):
                  return expanded
              return None
          '''
          new_prefix = r'''def _prefix_mapping(
              definition: object,
              prefixes: dict[str, str],
          ) -> str | None:
              explicit_prefix: bool | None = None
              if isinstance(definition, dict):
                  if definition.get("@prefix") is False:
                      return None
                  if definition.get("@prefix") is True:
                      explicit_prefix = True
                  definition = definition.get("@id")
              if not isinstance(definition, str):
                  return None
              expanded = _expand_compact_iri(definition, prefixes)
              if not expanded.startswith(("http://", "https://")):
                  return None
              if explicit_prefix is True or (
                  explicit_prefix is None and expanded.endswith(("/", "#"))
              ):
                  return expanded
              return None
          '''
          if old_prefix not in source:
              raise SystemExit('explicit @prefix block not found')
          source = source.replace(old_prefix, new_prefix, 1)

          collect_block = r'''def _schema_article_term_is_valid(state: SchemaContextState) -> bool:
              return _schema_term_is_valid(state, "ScholarlyArticle")


          def _property_child_state(
              key: str,
              node_schema_state: SchemaContextState,
              child_schema_state: SchemaContextState,
              node_property_scopes: dict[str, object],
              child_property_scopes: dict[str, object],
          ) -> tuple[SchemaContextState, dict[str, object]]:
              """Return the active state for a property value before visiting it."""
              if key not in node_property_scopes:
                  return child_schema_state, child_property_scopes
              scoped_context = node_property_scopes[key]
              if not _context_propagates(scoped_context):
                  return DEFAULT_SCHEMA_CONTEXT_STATE, {}
              return (
                  _schema_context_state(scoped_context, node_schema_state),
                  _property_scoped_contexts(
                      scoped_context, child_property_scopes
                  ),
              )


          def collect_scholarly_articles(
              value: object,
              articles: list[
                  tuple[
                      dict,
                      SchemaContextState,
                      SchemaContextState,
                      SchemaContextState,
                      dict[str, object],
                      dict[str, object],
                  ]
              ],
              inherited_schema_context: SchemaContextState = DEFAULT_SCHEMA_CONTEXT_STATE,
              inherited_property_scopes: dict[str, object] | None = None,
          ) -> None:
              property_scopes = (
                  {} if inherited_property_scopes is None else dict(inherited_property_scopes)
              )
              if isinstance(value, dict):
                  schema_state = inherited_schema_context
                  child_schema_state = inherited_schema_context
                  node_property_scopes = property_scopes
                  child_property_scopes = property_scopes
                  if "@context" in value:
                      context = value.get("@context")
                      schema_state = _schema_context_state(context, inherited_schema_context)
                      node_property_scopes = _property_scoped_contexts(
                          context, property_scopes
                      )
                      if _context_propagates(context):
                          child_schema_state = schema_state
                          child_property_scopes = node_property_scopes
                      else:
                          child_schema_state = inherited_schema_context
                          child_property_scopes = property_scopes
                  else:
                      child_schema_state = schema_state

                  article_type = value.get("@type")
                  type_terms = (
                      [article_type]
                      if isinstance(article_type, str)
                      else [term for term in article_type if isinstance(term, str)]
                      if isinstance(article_type, list)
                      else []
                  )
                  # The activating @type is expanded before any type-scoped context
                  # defined by that term becomes active on the node properties.
                  type_validation_state = schema_state
                  for type_term in sorted(type_terms):
                      if type_term not in node_property_scopes:
                          continue
                      type_context = node_property_scopes[type_term]
                      schema_state = _schema_context_state(type_context, schema_state)
                      node_property_scopes = _property_scoped_contexts(
                          type_context, node_property_scopes
                      )
                      if _type_context_propagates(type_context):
                          child_schema_state = schema_state
                          child_property_scopes = node_property_scopes

                  if article_type == "ScholarlyArticle" or (
                      isinstance(article_type, list)
                      and "ScholarlyArticle" in article_type
                  ):
                      articles.append(
                          (
                              value,
                              type_validation_state,
                              schema_state,
                              child_schema_state,
                              node_property_scopes,
                              child_property_scopes,
                          )
                      )

                  for key, child in value.items():
                      if key == "@context":
                          continue
                      scoped_state, scoped_scopes = _property_child_state(
                          key,
                          schema_state,
                          child_schema_state,
                          node_property_scopes,
                          child_property_scopes,
                      )
                      collect_scholarly_articles(
                          child, articles, scoped_state, scoped_scopes
                      )
              elif isinstance(value, list):
                  for child in value:
                      collect_scholarly_articles(
                          child, articles, inherited_schema_context, property_scopes
                      )


          '''
          source = replace_between(
              source,
              'def _schema_article_term_is_valid(state: SchemaContextState) -> bool:',
              'def check_scholarly_landing(page: str, errors: list[str]) -> None:',
              collect_block,
              'article traversal state model',
          )

          old_articles = '''    articles: list[tuple[dict, SchemaContextState, dict[str, object]]] = []\n    for document in documents:\n        collect_scholarly_articles(document, articles)\n\n    matching = [\n        (article, schema_state, article_scopes)\n        for article, schema_state, article_scopes in articles\n        if article.get("name") == SCHOLARLY_TITLE\n    ]\n    if len(matching) != 1:\n        observed_names = [article.get("name") for article, _, _ in articles]\n        errors.append(\n            f"{SCHOLARLY_LANDING_PATH}: expected exactly one rendered ScholarlyArticle "\n            f"with the exact title; matching={len(matching)}, observed={observed_names!r}"\n        )\n        return\n\n    article, schema_state, article_scopes = matching[0]\n    if not _schema_article_term_is_valid(schema_state):\n'''
          new_articles = '''    articles: list[\n        tuple[\n            dict,\n            SchemaContextState,\n            SchemaContextState,\n            SchemaContextState,\n            dict[str, object],\n            dict[str, object],\n        ]\n    ] = []\n    for document in documents:\n        collect_scholarly_articles(document, articles)\n\n    matching = [\n        (\n            article,\n            type_state,\n            schema_state,\n            child_schema_state,\n            article_scopes,\n            child_scopes,\n        )\n        for (\n            article,\n            type_state,\n            schema_state,\n            child_schema_state,\n            article_scopes,\n            child_scopes,\n        ) in articles\n        if article.get("name") == SCHOLARLY_TITLE\n    ]\n    if len(matching) != 1:\n        observed_names = [article.get("name") for article, *_rest in articles]\n        errors.append(\n            f"{SCHOLARLY_LANDING_PATH}: expected exactly one rendered ScholarlyArticle "\n            f"with the exact title; matching={len(matching)}, observed={observed_names!r}"\n        )\n        return\n\n    (\n        article,\n        type_state,\n        schema_state,\n        child_schema_state,\n        article_scopes,\n        child_scopes,\n    ) = matching[0]\n    if not _schema_article_term_is_valid(type_state):\n'''
          if old_articles not in source:
              raise SystemExit('article matching block not found')
          source = source.replace(old_articles, new_articles, 1)

          old_encoding = '''    encoding_state = schema_state\n    if "encoding" in article_scopes:\n        encoding_context = article_scopes["encoding"]\n        if _context_propagates(encoding_context):\n            encoding_state = _schema_context_state(encoding_context, encoding_state)\n        else:\n            encoding_state = DEFAULT_SCHEMA_CONTEXT_STATE\n\n    encoding = article.get("encoding")\n'''
          new_encoding = '''    encoding_state, _encoding_scopes = _property_child_state(\n        "encoding",\n        schema_state,\n        child_schema_state,\n        article_scopes,\n        child_scopes,\n    )\n\n    encoding = article.get("encoding")\n'''
          if old_encoding not in source:
              raise SystemExit('encoding child-state block not found')
          source = source.replace(old_encoding, new_encoding, 1)

          old_identifier = '''    identifier_state = schema_state\n    if "identifier" in article_scopes:\n        identifier_context = article_scopes["identifier"]\n        if _context_propagates(identifier_context):\n            identifier_state = _schema_context_state(identifier_context, identifier_state)\n        else:\n            identifier_state = DEFAULT_SCHEMA_CONTEXT_STATE\n\n    identifiers = article.get("identifier", [])\n'''
          new_identifier = '''    identifier_state, _identifier_scopes = _property_child_state(\n        "identifier",\n        schema_state,\n        child_schema_state,\n        article_scopes,\n        child_scopes,\n    )\n\n    identifiers = article.get("identifier", [])\n'''
          if old_identifier not in source:
              raise SystemExit('identifier child-state block not found')
          source = source.replace(old_identifier, new_identifier, 1)

          test_block = r'''

          def test_foreign_template_end_does_not_close_outer_html_template() -> None:
              parser = deployment.ScholarlyHTMLParser()
              parser.feed(
                  "<!doctype html><html><head><template>"
                  "<svg><template/></svg>"
                  '<meta name="citation_title" content="still-inert">'
                  '<script type="application/ld+json">{"still":"inert"}</script>'
                  "</template></head><body></body></html>"
              )
              parser.close()

              assert "citation_title" not in parser.meta
              assert parser.json_ld_blocks == []
              assert parser._template_depth == 0
              assert parser._foreign_content_depth == 0


          def test_non_propagating_article_context_does_not_leak_to_nested_nodes() -> None:
              article = _valid_article(
                  **{
                      "@context": {
                          "@vocab": "https://schema.org/",
                          "@propagate": False,
                      }
                  }
              )
              page = _landing({"@graph": [article]})
              errors: list[str] = []
              deployment.check_scholarly_landing(page, errors)

              assert any(
                  "ScholarlyArticle.encoding.contentUrl is not mapped"
                  in error
                  for error in errors
              )
              assert any(
                  "ScholarlyArticle.identifier.propertyID is not mapped"
                  in error
                  for error in errors
              )


          def test_jsonld_script_inside_svg_foreignobject_is_html_content() -> None:
              parser = deployment.ScholarlyHTMLParser()
              parser.feed(
                  "<!doctype html><html><head></head><body>"
                  "<svg><foreignObject>"
                  '<script type="application/ld+json">{"ok":true}</script>'
                  "</foreignObject></svg>"
                  "</body></html>"
              )
              parser.close()

              assert parser.json_ld_blocks == ['{"ok":true}']
              assert parser._foreign_content_depth == 0


          def test_explicit_prefix_false_disables_compact_iri_prefix() -> None:
              page = _landing(
                  {
                      "@context": {
                          "@vocab": "https://schema.org/",
                          "schema": {
                              "@id": "https://schema.org/",
                              "@prefix": False,
                          },
                          "ScholarlyArticle": "schema:ScholarlyArticle",
                      },
                      "@graph": [_valid_article()],
                  }
              )
              errors: list[str] = []
              deployment.check_scholarly_landing(page, errors)

              assert any(
                  "lacks an applicable Schema.org JSON-LD context" in error
                  for error in errors
              )


          def test_type_scoped_context_does_not_rewrite_activating_type() -> None:
              page = _landing(
                  {
                      "@context": {
                          "@vocab": "https://schema.org/",
                          "ScholarlyArticle": {
                              "@id": "https://example.invalid/Fake",
                              "@context": {
                                  "ScholarlyArticle": (
                                      "https://schema.org/ScholarlyArticle"
                                  )
                              },
                          },
                      },
                      "@graph": [_valid_article()],
                  }
              )
              errors: list[str] = []
              deployment.check_scholarly_landing(page, errors)

              assert any(
                  "lacks an applicable Schema.org JSON-LD context" in error
                  for error in errors
              )
          '''
          test_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in test_block.splitlines())
          if 'def test_foreign_template_end_does_not_close_outer_html_template' in tests:
              raise SystemExit('sixth-round regressions already present unexpectedly')
          tests = tests.rstrip() + test_block.rstrip() + '\n'

          # The raw replacement blocks above are indented for YAML readability.
          # De-indent Python source blocks before writing them into the module.
          lines = source.splitlines()
          normalized = []
          in_generated = False
          for line in lines:
              # replace_between inserted class/collector blocks with 10 spaces of
              # workflow-script indentation embedded in the raw string. Strip it.
              if line.startswith('          class ScholarlyHTMLParser'):
                  in_generated = True
              if in_generated and line.startswith('          '):
                  line = line[10:]
              normalized.append(line)
              if in_generated and line == 'def sha256(data: bytes) -> str:':
                  in_generated = False
          source = '\n'.join(normalized) + '\n'

          # A second generated block starts at the context helper.
          source = source.replace('\n          def _schema_article_term_is_valid', '\ndef _schema_article_term_is_valid')
          generated_start = source.find('def _schema_article_term_is_valid')
          generated_end = source.find('def check_scholarly_landing', generated_start)
          if generated_start < 0 or generated_end < 0:
              raise SystemExit('generated collector normalization markers missing')
          collector = source[generated_start:generated_end]
          collector = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in collector.splitlines()
          ) + '\n\n'
          source = source[:generated_start] + collector + source[generated_end:]

          source_path.write_text(source, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python3 -m py_compile scripts/check_deployment_freshness.py
          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_scholarly_parser_edge_cases.py')
          focused = sorted(
              (name, fn) for name, fn in namespace.items()
              if name.startswith('test_') and callable(fn)
          )
          assert len(focused) == 30, f'expected 30 focused tests, got {len(focused)}'
          for name, fn in focused:
              fn()
              print(f'PASS {name}')
          PY
          git diff --check
          git diff -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py

      - name: Commit sixth-round review fixes and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/tmp-sixth-scholarly-review.yml
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git commit -m "fix: close sixth scholarly review findings"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
