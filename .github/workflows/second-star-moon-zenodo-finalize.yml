name: Second Star-Moon Witness Zenodo Finalize

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: ${{ vars.ZENODO_API_BASE || 'https://zenodo.org/api' }}
      RELEASE_TAG: second-star-moon-witness-encrypted-archive-v1
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py

      - name: Validate recovery finalizer and authorization
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/publish_second_star_moon_to_zenodo.py \
            scripts/finalize_second_star_moon_zenodo_draft.py
          if [ -z "${ZENODO_ACCESS_TOKEN:-}" ]; then
            echo "ZENODO_ACCESS_TOKEN is not configured" >&2
            exit 1
          fi
          echo "[ZENODO AUTH] token_configured=true api_base=$ZENODO_API_BASE"

      - name: Download exact source Release
        id: source
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/second-star-moon-release"
          mkdir -p "$src"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url,publishedAt > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json, os
          row=json.load(open(os.environ['RUNNER_TEMP']+'/release.json'))
          if row.get('tagName') != os.environ['RELEASE_TAG']:
              raise SystemExit('release tag mismatch')
          if row.get('isDraft') or row.get('isPrerelease'):
              raise SystemExit('source release is not a final public release')
          print('[SOURCE RELEASE] '+json.dumps(row, sort_keys=True))
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$src"
          count="$(find "$src" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          bytes="$(du -sb "$src" | awk '{print $1}')"
          echo "[SOURCE DOWNLOAD] files=$count bytes=$bytes"
          test "$count" = "14"
          test "$bytes" = "1203532071"
          echo "source_dir=$src" >> "$GITHUB_OUTPUT"

      - name: Finalize locked Zenodo draft and verify public bytes
        id: finalize
        run: |
          set -euo pipefail
          python3 scripts/finalize_second_star_moon_zenodo_draft.py \
            --source-dir "${{ steps.source.outputs.source_dir }}" \
            --state-file archive/second-star-moon-zenodo-state.json \
            --api-base "$ZENODO_API_BASE" | tee "$RUNNER_TEMP/zenodo-finalize.log"
          test -s archive/second-star-moon-zenodo-state.json
          python3 - <<'PY'
          import json, os
          row=json.load(open('archive/second-star-moon-zenodo-state.json'))
          assert row['record_id'] == 22159955
          assert row['doi'] == '10.5281/zenodo.22159955'
          assert row['verified_file_count'] == 14
          assert row['verified_total_bytes'] == 1203532071
          assert row['remote_full_readback_sha256_verified'] is True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('doi=10.5281/zenodo.22159955\n')
              f.write('record_id=22159955\n')
          print('[ZENODO VERIFIED] doi=10.5281/zenodo.22159955 record_id=22159955 files=14 bytes=1203532071')
          PY

      - name: Record verified Zenodo state in repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/second-star-moon-zenodo-state.json
          if git diff --cached --quiet; then
            echo "Zenodo state already recorded"
            exit 0
          fi
          git commit -m "archive: record Second Star-Moon Zenodo DOI"
          for attempt in 1 2 3 4; do
            git fetch origin main --prune
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "state push attempt $attempt failed; retrying" >&2
            sleep $((attempt * 5))
          done
          exit 1

      - name: Write publication summary
        if: always()
        run: |
          {
            echo "## Second Star-Moon Witness — Zenodo finalization"
            echo
            if [ -s archive/second-star-moon-zenodo-state.json ]; then
              python3 - <<'PY'
          import json
          r=json.load(open('archive/second-star-moon-zenodo-state.json'))
          print(f"- DOI: `{r.get('doi')}`")
          print(f"- Record: https://zenodo.org/records/{r.get('record_id')}")
          print(f"- Files verified: {r.get('verified_file_count')}")
          print(f"- Bytes verified: {r.get('verified_total_bytes')}")
          print(f"- Public full SHA-256 readback: {r.get('remote_full_readback_sha256_verified')}")
          PY
            else
              echo "- State file not produced; inspect the failed step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
