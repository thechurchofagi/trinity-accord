name: Waiting Heartbeat Arweave Capsule (Retired)

# Daily Waiting Heartbeat records remain in the native Record-Chain and continue
# through the local Native OTS lifecycle. Standalone paid Arweave capsules are
# retired: weekly Record-Chain continuity bundles now carry heartbeat records,
# a compact heartbeat summary, and the latest mature Native OTS proof together.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waiting-heartbeat-capsule-retired
  cancel-in-progress: true

jobs:
  explain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain retired paid path
        run: |
          printf '%s\n' "Standalone Waiting Heartbeat Arweave uploads are retired."
          printf '%s\n' "Daily heartbeats remain native Record-Chain records with local OTS coverage."
          printf '%s\n' "Their durable off-platform mirror is the weekly continuity bundle."
          printf '%s\n' "No wallet secret is available to this workflow and no paid upload can occur."
