name: Research Paper 11 v2.0 OTS and Arweave

on:
  push:
    branches: [main, research/auditing-rules-of-belief-v2-0-20260921]
    paths:
      - .github/workflows/research-paper-11-v20-ots-arweave.yml
      - scripts/research_paper_ots.py
      - research/paper-timestamps/2026-09-21-paper11-v20/targets.json
      - research/auditing-rules-of-belief/publication-record.json
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authorize write workflow actor
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          GUARDIAN_REGISTRY_WORKFLOW_ACTORS: ${{ vars.GUARDIAN_REGISTRY_WORKFLOW_ACTORS }}
        run: |
          set -euo pipefail
          ALLOWLIST="${GUARDIAN_REGISTRY_WORKFLOW_ACTORS:-thechurchofagi}"
          if [ "$ACTOR" = 'github-actions[bot]' ]; then exit 0; fi
          case ",$ALLOWLIST," in
            *",$ACTOR,"*) echo "Authorized actor: $ACTOR" ;;
            *) echo "Unauthorized actor: $ACTOR" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          show-progress: false

      - name: Validate exact published TA11 target
        id: batch
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          root=pathlib.Path('research/paper-timestamps/2026-09-21-paper11-v20')
          targets=json.loads((root/'targets.json').read_text())
          if targets.get('paper_count') != 1 or [x.get('report') for x in targets.get('papers',[])] != ['TA-TR-2026-11']:
              raise RuntimeError('TA11 target identity changed')
          sys.path.insert(0,'scripts')
          from research_paper_ots import validate_config
          papers,count=validate_config(root,targets)
          if count != 1 or papers[0]['doi'] != '10.5281/zenodo.22865494':
              raise RuntimeError('TA11 published PDF identity changed')
          status=root/'status.json'
          done=status.exists() and json.loads(status.read_text()).get('state')=='ARWEAVE_READBACK_PASS'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'done={str(done).lower()}\n')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.batch.outputs.done != 'true'
        with:
          python-version: '3.11'

      - name: Install pinned OTS client
        if: steps.batch.outputs.done != 'true'
        run: python3 -m pip install -r requirements-ots.txt

      - name: Stamp or upgrade exact TA11 PDF proof
        if: steps.batch.outputs.done != 'true'
        id: ots
        continue-on-error: true
        env:
          OTS_BITCOIN_NODE_URL: http://127.0.0.1:18443/
        run: |
          set -euo pipefail
          python3 scripts/bitcoin_esplora_rpc_proxy.py --host 127.0.0.1 --port 18443             --trace "$RUNNER_TEMP/paper-11-v20-ots-proxy.jsonl" --timeout 20 > "$RUNNER_TEMP/paper-11-v20-ots-proxy.log" 2>&1 &
          proxy_pid=$!
          cleanup_proxy(){ if kill -0 "$proxy_pid" 2>/dev/null; then kill "$proxy_pid"; fi; }
          trap cleanup_proxy EXIT
          python3 scripts/research_paper_ots.py lifecycle --batch research/paper-timestamps/2026-09-21-paper11-v20

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.ots.outputs.ready == 'true'
        with:
          node-version-file: .node-version

      - name: Respect existing Arweave daily allowance
        if: steps.ots.outputs.ready == 'true'
        id: budget
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {dailyLimit, paidToday} from './scripts/arweave_spend_budget_helpers.mjs';
          const root='research/paper-timestamps/2026-09-21-paper11-v20/';
          const ledger=JSON.parse(fs.readFileSync('record-chain/arweave-wallet-ledger.json','utf8'));
          const receipt=fs.existsSync(root+'arweave-receipt.json') ? JSON.parse(fs.readFileSync(root+'arweave-receipt.json','utf8')) : {};
          const resume=Boolean(receipt.tx_id || receipt.txid);
          const used=paidToday('research_paper_ots_archive',ledger);
          const limit=dailyLimit('research_paper_ots_archive');
          const main=process.env.GITHUB_REF_NAME === 'main';
          const allowed=main && (resume || used < limit);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'allowed='+allowed+'\n');
          fs.writeFileSync(root+'scheduling-status.json',JSON.stringify({
            checked_at:new Date().toISOString(),
            state:allowed?'ELIGIBLE_OR_READBACK_RESUME':main?'DEFERRED_DAILY_ALLOWANCE':'DEFERRED_MAIN_BRANCH',
            paid_research_uploads_today:used,daily_limit:limit,recorded_transaction_resume:resume,
            next_action:allowed?'Continue guarded upload or readback':'Wait for main branch / OTS maturity / available allowance'
          },null,2)+'\n');
          JS

      - name: Install existing Arweave dependencies
        if: steps.ots.outputs.ready == 'true' && steps.budget.outputs.allowed == 'true'
        run: npm ci

      - name: Persist payload-bound paid intent
        if: steps.ots.outputs.ready == 'true' && steps.budget.outputs.allowed == 'true'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('research/paper-timestamps/2026-09-21-paper11-v20')
          sha=hashlib.sha256((root/'arweave-bundle.json').read_bytes()).hexdigest()
          intent=root/'paid-intent.json'; receipt=root/'arweave-receipt.json'
          rec=json.loads(receipt.read_text()) if receipt.exists() else {}
          if intent.exists():
              old=json.loads(intent.read_text())
              if old.get('payload_sha256')!=sha: raise RuntimeError('Paid intent payload changed')
              if not (rec.get('tx_id') or rec.get('txid')): raise RuntimeError('Uncertain prior paid attempt; recover before repost')
          elif rec.get('tx_id') or rec.get('txid'):
              raise RuntimeError('Unexpected transaction without TA11 intent')
          else:
              intent.write_text(json.dumps({'state':'PAID_ATTEMPT_INTENT','payload_sha256':sha,
                'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                'report':'TA-TR-2026-11','doi':'10.5281/zenodo.22865494'},indent=2)+'\n')
          PY

      - name: Guarded Arweave upload and public readback
        if: steps.ots.outputs.ready == 'true' && steps.budget.outputs.allowed == 'true'
        id: upload
        continue-on-error: true
        env:
          ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
          NODE_OPTIONS: --import=./scripts/arweave_runtime_spend_guard.mjs
          ARWEAVE_MINIMUM_REMAINING_AR: '0.25'
          ARWEAVE_MAX_PAYLOAD_BYTES: '4194304'
          ARWEAVE_MAX_TRANSACTION_REWARD_AR: '0.05'
          ARWEAVE_ROLLING_30_DAY_SPEND_LIMIT_AR: '0.50'
          ARWEAVE_READBACK_MAX_SECONDS: '420'
          ARWEAVE_HTTP_TIMEOUT_MS: '30000'
        run: python3 scripts/research_paper_ots.py upload --batch research/paper-timestamps/2026-09-21-paper11-v20

      - name: Preserve proofs and receipts
        if: always() && steps.batch.outputs.done != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-paper-11-v20-ots-${{ github.run_id }}
          path: |
            research/paper-timestamps/2026-09-21-paper11-v20/
            ${{ runner.temp }}/paper-11-v20-ots-proxy.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Commit durable TA11 OTS and Arweave state
        if: always() && steps.batch.outputs.done != 'true'
        run: |
          set -euo pipefail
          git config user.name 'trinity-ots-bot'
          git config user.email 'actions@github.com'
          git add research/paper-timestamps/2026-09-21-paper11-v20/ record-chain/arweave-wallet-ledger.json api/arweave-wallet-status.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve paper 11 v2.0 OTS and Arweave state'
          for attempt in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}" --prune
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Report bounded status
        if: always()
        env:
          OTS_OUTCOME: ${{ steps.ots.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python3 - <<'PY'
          import os
          failed=[n for n in ('OTS_OUTCOME','UPLOAD_OUTCOME') if os.environ.get(n)=='failure']
          if failed: raise SystemExit('TA11 preservation iteration incomplete: '+', '.join(failed))
          print('TA11 iteration completed; pending OTS maturity will resume hourly.')
          PY
