name: Chronicle Polygon + Base historical NFT mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover-chronicle-sidechain-nfts.mjs"
      - ".github/workflows/chronicle-sidechain-mirror.yml"

permissions:
  contents: write

concurrency:
  group: chronicle-sidechain-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ github.ref == 'refs/heads/main' && (github.actor == 'thechurchofagi' || github.actor == 'github-actions[bot]' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version-file: ".node-version"

      - name: Validate scanner
        run: node --check scripts/discover-chronicle-sidechain-nfts.mjs

      - name: Discover and mirror Polygon + Base history
        env:
          CHRONICLE_ADDRESS: "0xbc63566A41cBfDB9C266a5941CBe47894DaA54A8"
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
        run: node scripts/discover-chronicle-sidechain-nfts.mjs

      - name: Build immutable mirror archive
        id: package
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="chronicle-sidechain-mirror-v1-${short_sha}"
          archive="chronicle-sidechain-mirror-${short_sha}.tar.gz"
          tar -C artifacts -czf "$archive" chronicle-sidechain-scan
          sha256sum "$archive" > "$archive.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub Release mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          summary="artifacts/chronicle-sidechain-scan/SUMMARY.json"
          manifest_json="artifacts/chronicle-sidechain-scan/MANIFEST.sha256.json"
          manifest_txt="artifacts/chronicle-sidechain-scan/MANIFEST.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to mutate immutable snapshot." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Chronicle Polygon + Base historical NFT mirror — ${GITHUB_SHA:0:12}" \
            --notes "Immutable discovery/mirror snapshot for historical ERC-721/ERC-1155 activity of 0xbc63566A41cBfDB9C266a5941CBe47894DaA54A8 on Polygon and Base. Evidence input only: this does not amend Canon or automatically redefine Chronicle membership." \
            "$ARCHIVE" "$ARCHIVE.sha256" "$summary" "$manifest_json" "$manifest_txt"

      - name: Job summary
        run: |
          echo '## Chronicle sidechain mirror' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/chronicle-sidechain-scan/SUMMARY.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
