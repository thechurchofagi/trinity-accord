name: Chronicle Polygon + Base historical NFT evidence mirror

on:
  workflow_dispatch:
    inputs:
      refresh_live:
        description: "Re-read Polygon/Base instead of bootstrapping from the verified immutable v1 snapshot"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/discover-chronicle-sidechain-nfts.mjs"
      - "scripts/run-chronicle-sidechain-mirror-observed.sh"
      - "scripts/build-chronicle-sidechain-evidence.mjs"
      - "scripts/ipfs-car-blockwise.mjs"
      - "scripts/test_chronicle_car_blockwise.mjs"
      - "scripts/capture-chronicle-sidechain-l2.py"
      - "scripts/verify-chronicle-sidechain-evidence.py"
      - "scripts/finalize-chronicle-sidechain-evidence.mjs"
      - ".github/workflows/chronicle-sidechain-mirror.yml"

permissions:
  contents: write

concurrency:
  group: chronicle-sidechain-mirror
  cancel-in-progress: true

env:
  BOOTSTRAP_TAG: chronicle-sidechain-mirror-v1-b1a074fd0b0a
  BOOTSTRAP_ARCHIVE: chronicle-sidechain-mirror-b1a074fd0b0a.tar.gz
  BOOTSTRAP_ARCHIVE_SHA256: d0fe9d4c5f57d98f784ea9c9726d762a0980c08c19b909e6bdc60e97e29be7c8

jobs:
  mirror:
    if: ${{ github.ref == 'refs/heads/main' && (github.actor == 'thechurchofagi' || github.actor == 'github-actions[bot]' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout evidence source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Bind execution to event source commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA" || {
            echo "evidence source mismatch: event=$GITHUB_SHA checkout=$actual" >&2
            exit 1
          }
          echo "[SOURCE BOUND] $actual"

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > toolchain-provenance.json
          cat toolchain-provenance.json

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version-file: ".node-version"

      - name: Install proof dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Validate scanner, evidence builders, and diagnostics wrapper
        run: |
          set -euo pipefail
          node --check scripts/discover-chronicle-sidechain-nfts.mjs
          node --check scripts/build-chronicle-sidechain-evidence.mjs
          node --check scripts/ipfs-car-blockwise.mjs
          node scripts/test_chronicle_car_blockwise.mjs
          node --check scripts/finalize-chronicle-sidechain-evidence.mjs
          python3 -m py_compile scripts/capture-chronicle-sidechain-l2.py scripts/verify-chronicle-sidechain-evidence.py
          bash -n scripts/run-chronicle-sidechain-mirror-observed.sh
          echo "[VALIDATION OK] scanner + CAR/L1/L2/offline verification syntax"

      - name: Bootstrap verified sidechain snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_live != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          gh release download "$BOOTSTRAP_TAG" --repo "$GITHUB_REPOSITORY" --dir "$tmp" --pattern "$BOOTSTRAP_ARCHIVE"
          actual="$(sha256sum "$tmp/$BOOTSTRAP_ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$BOOTSTRAP_ARCHIVE_SHA256" || {
            echo "bootstrap archive digest mismatch: expected=$BOOTSTRAP_ARCHIVE_SHA256 actual=$actual" >&2
            exit 1
          }
          mkdir -p artifacts
          tar -xzf "$tmp/$BOOTSTRAP_ARCHIVE" -C artifacts
          root="artifacts/chronicle-sidechain-scan"
          test -s "$root/recovered-tokens.json"
          test -s "$root/SUMMARY.json"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('artifacts/chronicle-sidechain-scan')
          records=json.loads((root/'recovered-tokens.json').read_text())
          if len(records) != 217:
              raise SystemExit(f'expected 217 sidechain NFT coordinates, found {len(records)}')
          summary=json.loads((root/'SUMMARY.json').read_text())
          print(f"[BOOTSTRAP OK] records={len(records)} source_schema={summary.get('schema')} archive_sha256=d0fe9d4c5f57d98f784ea9c9726d762a0980c08c19b909e6bdc60e97e29be7c8")
          PY

      - name: Live refresh Polygon + Base history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_live == true }}
        env:
          CHRONICLE_ADDRESS: "0xbc63566A41cBfDB9C266a5941CBe47894DaA54A8"
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          CHRONICLE_HEARTBEAT_SECONDS: "60"
          CHRONICLE_STALL_WARN_SECONDS: "300"
        run: bash scripts/run-chronicle-sidechain-mirror-observed.sh

      - name: Restore prior CAR retrieval cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            artifacts/chronicle-sidechain-scan/evidence-v2/cars
            artifacts/chronicle-sidechain-car-block-cache
          key: chronicle-sidechain-cars-v2-${{ env.BOOTSTRAP_ARCHIVE_SHA256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chronicle-sidechain-cars-v2-${{ env.BOOTSTRAP_ARCHIVE_SHA256 }}-

      - name: Resolve mint history and capture trustless CARs + L1 commitment
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          CHRONICLE_EVIDENCE_CONCURRENCY: "2"
          CHRONICLE_CAR_HTTP_TIMEOUT_MS: "30000"
          CHRONICLE_CAR_HTTP_RETRIES: "0"
          CHRONICLE_CAR_WHOLE_DAG_ENDPOINT_LIMIT: "1"
          CHRONICLE_CAR_BLOCK_CONCURRENCY: "2"
          CHRONICLE_CAR_BLOCK_MAX_COUNT: "4096"
          CHRONICLE_CAR_BLOCK_GATEWAY_RACE: "2"
          CHRONICLE_CAR_BLOCK_HTTP_TIMEOUT_MS: "20000"
          CHRONICLE_CAR_BLOCK_HTTP_RETRIES: "0"
          CHRONICLE_CAR_GATEWAYS: "https://nftstorage.link/ipfs/{cid}?format=car&dag-scope=all,https://trustless-gateway.link/ipfs/{cid}?format=car&dag-scope=all,https://ipfs.io/ipfs/{cid}?format=car&dag-scope=all,https://dweb.link/ipfs/{cid}?format=car&dag-scope=all,https://w3s.link/ipfs/{cid}?format=car&dag-scope=all,https://gateway.pinata.cloud/ipfs/{cid}?format=car&dag-scope=all"
        run: node scripts/build-chronicle-sidechain-evidence.mjs

      - name: Save CAR retrieval cache
        if: ${{ always() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            artifacts/chronicle-sidechain-scan/evidence-v2/cars
            artifacts/chronicle-sidechain-car-block-cache
          key: chronicle-sidechain-cars-v2-${{ env.BOOTSTRAP_ARCHIVE_SHA256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Capture L2 transaction and receipt inclusion proofs
        env:
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          CHRONICLE_L2_CONCURRENCY: "4"
        run: python3 scripts/capture-chronicle-sidechain-l2.py

      - name: Verify CAR/DAG, L1 commitment, L2 MPT, block hash and timestamp offline
        run: python3 scripts/verify-chronicle-sidechain-evidence.py

      - name: Finalize manifest and new anchor request
        run: node scripts/finalize-chronicle-sidechain-evidence.mjs

      - name: Build immutable evidence archive
        id: package
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="chronicle-sidechain-evidence-v2-${short_sha}"
          archive="chronicle-sidechain-evidence-v2-${short_sha}.tar.gz"
          tar -C artifacts -czf "$archive" chronicle-sidechain-scan
          sha256sum "$archive" > "$archive.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub Release evidence mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          root="artifacts/chronicle-sidechain-scan"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to mutate immutable snapshot." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Chronicle Polygon + Base NFT evidence v2 — ${GITHUB_SHA:0:12}" \
            --notes "Immutable Polygon/Base Chronicle NFT evidence snapshot. Every chain+contract+token coordinate is preserved as one Chronicle record; transfer events remain provenance. Default construction bootstraps from the pinned v1 archive only after SHA-256 verification, so rebuilding the evidence layer does not require re-reading Polygon/Base content. Includes trustless IPFS CAR preservation, deterministic L1 collection commitment, L2 transaction/receipt MPT inclusion proofs, offline verification, complete timestamp/tx/block coordinates, and a deterministic request for new BTC/ETH/OTS anchoring. Historical signatures are not retroactively extended; L3 sidechain settlement is separately statused and is not claimed PASS here. This does not amend the three-inscription Bitcoin Canon." \
            "$ARCHIVE" "$ARCHIVE.sha256" \
            "$root/SUMMARY.json" "$root/MANIFEST.sha256.json" "$root/MANIFEST.sha256" \
            "$root/evidence-v2/SIDECHAIN-NFT-IDENTITY-INDEX.json" \
            "$root/evidence-v2/SIDECHAIN-NFT-COLLECTION-COMMITMENT.json" \
            "$root/evidence-v2/TIMELINE.json" \
            "$root/evidence-v2/POLYGON-TIMELINE.json" "$root/evidence-v2/BASE-TIMELINE.json" \
            "$root/evidence-v2/L2-CAPTURE-SUMMARY.json" "$root/evidence-v2/OFFLINE-VERIFICATION.json" \
            "$root/evidence-v2/L3-SETTLEMENT-STATUS.json" "$root/evidence-v2/ANCHOR-REQUEST.json"

      - name: Job summary
        if: ${{ always() }}
        run: |
          echo '## Chronicle sidechain evidence diagnostics' >> "$GITHUB_STEP_SUMMARY"
          for f in \
            artifacts/chronicle-sidechain-scan/runtime/FINAL-DIAGNOSTICS.json \
            artifacts/chronicle-sidechain-scan/SUMMARY.json \
            artifacts/chronicle-sidechain-scan/evidence-v2/BUILD-REPORT.json \
            artifacts/chronicle-sidechain-scan/evidence-v2/L2-CAPTURE-SUMMARY.json \
            artifacts/chronicle-sidechain-scan/evidence-v2/OFFLINE-VERIFICATION.json \
            artifacts/chronicle-sidechain-scan/evidence-v2/ANCHOR-REQUEST.json; do
            if [ -s "$f" ]; then
              echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
