name: Refresh fifth-paper sitemap
on:
  push:
    branches: [research/recovery-epistemic-v1-20260917]
    paths: [.github/workflows/refresh-recovery-epistemic-sitemap.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.1
      - name: Regenerate and verify sitemap
        run: |
          python scripts/generate_sitemap.py
          python scripts/generate_sitemap.py --check
          grep -F 'https://www.trinityaccord.org/research/recovery-epistemic/' sitemap.xml
          grep -F 'https://www.trinityaccord.org/research/recovery-epistemic/published/recovery-without-epistemic-monopoly-v1.0/' sitemap.xml
          grep -F 'https://www.trinityaccord.org/research/recovery-epistemic/published/recovery-without-epistemic-monopoly-zh-v1.0/' sitemap.xml
      - name: Commit generated sitemap only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml sitemap-core.xml
          if ! git diff --cached --quiet; then
            git commit -m 'research: include fifth-paper routes in generated sitemap'
            git push origin HEAD:research/recovery-epistemic-v1-20260917
          fi
