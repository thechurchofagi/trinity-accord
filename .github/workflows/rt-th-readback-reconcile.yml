name: RT/TH reconcile published Zenodo bytes
on:
  push:
    branches: [research/rt-th-task-relative-continuity-v1-20261009]
    paths: [.github/workflows/rt-th-readback-reconcile.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/rt-th-task-relative-continuity-v1-20261009
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Verify actual public bytes, DOI in PDF, and nonempty source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request,urllib.parse,subprocess
          R=pathlib.Path("research/task-relative-continuity")
          d=json.loads((R/"deposit.json").read_text())
          rid=d["record_id"];doi=d["doi"]
          req=urllib.request.Request(f"https://zenodo.org/api/records/{rid}",headers={"User-Agent":"RTTH-Public-Byte-Reconcile/1.0"})
          with urllib.request.urlopen(req,timeout=60) as res:pub=json.load(res)
          assert pub["id"]==rid and pub["doi"]==doi
          out=R/"published";out.mkdir(exist_ok=True)
          rows=[]
          for f in pub["files"]:
              name=f["key"]
              assert "/" not in name and ".." not in name
              url=f"https://zenodo.org/records/{rid}/files/{urllib.parse.quote(name)}?download=1"
              with urllib.request.urlopen(url,timeout=90) as response:content=response.read(16000000)
              assert content and len(content)<16000000
              p=out/name;p.write_bytes(content)
              rows.append({"name":name,"bytes":len(content),"sha256":hashlib.sha256(content).hexdigest(),"remote_checksum":f.get("checksum")})
          rowmap={x["name"]:x for x in rows}
          assert "Task_Relative_Continuity_v1.0.0.pdf" in rowmap
          assert "Task_Relative_Continuity_v1.0.0.md" in rowmap
          pdf=out/"Task_Relative_Continuity_v1.0.0.pdf"
          assert pdf.read_bytes().startswith(b"%PDF")
          x=subprocess.check_output(["pdftotext",str(pdf),"-"],text=True)
          assert doi in x and "Task-Relative" in x
          md=(out/"Task_Relative_Continuity_v1.0.0.md").read_text()
          assert "route" in md.lower() and "continuity" in md.lower()
          frozen=json.loads((R/"frozen-package.json").read_text())
          expected={x["name"]:x["sha256"] for x in frozen["files"]}
          mismatches=[x["name"] for x in rows if expected.get(x["name"])!=x["sha256"]]
          state="PUBLIC_RECORD_READBACK_PASS_FROZEN_BUILD_DIFFERENCE" if mismatches else "PUBLISHED_AND_PUBLIC_READBACK_PASS"
          obj={"record_id":rid,"doi":doi,"report_number":"RT20261009","version":"1.0.0",
            "title":pub["metadata"]["title"],"state":state,
            "published":True,"submitted":True,"public_file_readback_pass":True,
            "files":rows,"frozen_build_mismatches":mismatches,"peer_reviewed":False,
            "boundary":"Authoritative OTS targets must be exact public Zenodo PDF, not local nondeterministic rebuild."}
          (R/"publication-record.json").write_text(json.dumps(obj,indent=2)+"\n")
          print(json.dumps({"doi":doi,"state":state,"files":rows,"differences":mismatches},indent=2))
          PY
      - name: Preserve exact public binary and readback checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/task-relative-continuity/published/ research/task-relative-continuity/publication-record.json
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Pin published RT/TH Zenodo exact public PDF and DOI-in-PDF readback'
            for i in 1 2 3; do
              if git push origin HEAD:research/rt-th-task-relative-continuity-v1-20261009; then exit 0; fi
              git fetch origin research/rt-th-task-relative-continuity-v1-20261009
              git rebase origin/research/rt-th-task-relative-continuity-v1-20261009 || exit 1
            done
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rt-th-public-readback-${{ github.run_id }}
          path: research/task-relative-continuity/publication-record.json
          if-no-files-found: warn
