name: One-time Sync Gateway Shadow Schema

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/context-readiness-contract-convergence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Synchronize exact schema bytes
        run: python3 scripts/one_time_sync_gateway_shadow_schema.py
      - name: Verify parity
        run: python3 scripts/test_gateway_schema_shadow_parity.py
      - name: Remove one-time tooling and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-sync-gateway-shadow-schema.yml
          git rm scripts/one_time_sync_gateway_shadow_schema.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: synchronize Gateway shadow schema'
          git push origin HEAD:${{ github.head_ref }}
