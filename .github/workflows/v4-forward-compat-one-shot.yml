name: V4 Forward Compatibility One Shot

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: v4-forward-compat-one-shot-agent-full-project-preservation
  cancel-in-progress: false

jobs:
  patch-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/full-project-preservation-staging-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/full-project-preservation-staging-v1
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Apply narrow historical-checkpoint forward compatibility fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/current_baseline_publication_v4.py')
          text = script.read_text(encoding='utf-8')
          marker = '''\ndef validate_consumed(auth: dict[str, Any], state: dict[str, Any], index: dict[str, Any]) -> None:\n'''
          helper = '''\ndef validate_consumed_repository_series_state(\n    state: dict[str, Any],\n    source: str,\n    doi: str,\n    record_id: int,\n    package: str,\n) -> None:\n    \"\"\"Validate immutable v4 history while allowing a later repository-series head.\"\"\"\n    require_equal(state.get(\"publication_status\"), \"published_and_publicly_restored\", \"state.publication_status\")\n    require_equal(state.get(\"concept_doi\"), CONCEPT_DOI, \"state.concept_doi\")\n    versions = state.get(\"versions\")\n    require(isinstance(versions, list), \"state.versions missing\")\n\n    checkpoint_matches = [\n        item for item in versions if isinstance(item, dict) and item.get(\"doi\") == doi\n    ]\n    require(len(checkpoint_matches) == 1, \"sequence-4 DOI must appear exactly once in preservation history\")\n    checkpoint = checkpoint_matches[0]\n    require_equal(checkpoint.get(\"record_id\"), record_id, \"state.checkpoint_history.record_id\")\n    require_equal(checkpoint.get(\"git_commit_sha\"), source, \"state.checkpoint_history.source\")\n    require_equal(\n        checkpoint.get(\"package_identity_sha256\"),\n        package,\n        \"state.checkpoint_history.package\",\n    )\n\n    current_doi = state.get(\"latest_doi\")\n    current_match = DOI_RE.fullmatch(str(current_doi))\n    require(current_match is not None, \"state latest DOI is invalid\")\n    current_record = state.get(\"latest_record_id\")\n    require(\n        isinstance(current_record, int) and int(current_match.group(1)) == current_record,\n        \"state latest DOI/record mismatch\",\n    )\n    current_source = state.get(\"latest_git_commit_sha\")\n    require(\n        isinstance(current_source, str) and COMMIT_RE.fullmatch(current_source) is not None,\n        \"state latest source commit is invalid\",\n    )\n    current_package = state.get(\"latest_package_identity_sha256\")\n    require(\n        isinstance(current_package, str) and SHA256_RE.fullmatch(current_package) is not None,\n        \"state latest package identity is invalid\",\n    )\n    current_matches = [\n        item for item in versions if isinstance(item, dict) and item.get(\"doi\") == current_doi\n    ]\n    require(len(current_matches) == 1, \"current repository DOI must appear exactly once in preservation history\")\n    current = current_matches[0]\n    require_equal(current.get(\"record_id\"), current_record, \"state.current_history.record_id\")\n    require_equal(current.get(\"git_commit_sha\"), current_source, \"state.current_history.source\")\n    require_equal(\n        current.get(\"package_identity_sha256\"),\n        current_package,\n        \"state.current_history.package\",\n    )\n\n\ndef validate_consumed(auth: dict[str, Any], state: dict[str, Any], index: dict[str, Any]) -> None:\n'''
          if marker not in text:
              raise SystemExit('validate_consumed marker not found')
          text = text.replace(marker, helper, 1)
          old = '''    require_equal(state.get("publication_status"), "published_and_publicly_restored", "state.publication_status")\n    require_equal(state.get("latest_git_commit_sha"), source, "state.latest_source")\n    require_equal(state.get("latest_doi"), doi, "state.latest_doi")\n    require_equal(state.get("latest_record_id"), record_id, "state.latest_record_id")\n    require_equal(state.get("latest_package_identity_sha256"), package, "state.latest_package")\n    require_equal(state.get("concept_doi"), CONCEPT_DOI, "state.concept_doi")\n'''
          new = '''    validate_consumed_repository_series_state(state, source, doi, record_id, package)\n'''
          if old not in text:
              raise SystemExit('old consumed top-level equality block not found')
          text = text.replace(old, new, 1)
          script.write_text(text, encoding='utf-8')

          test = Path('tests/test_current_baseline_publication_v4_contract.py')
          text = test.read_text(encoding='utf-8')
          old = '''        assert source_auth["published_doi"] == final["latest_doi"]\n        assert source_auth["published_source_baseline_commit_sha"] == final[\n            "latest_git_commit_sha"\n        ]\n        assert source_auth["published_package_identity_sha256"] == final[\n            "latest_package_identity_sha256"\n        ]\n'''
          new = '''        historical = [\n            item\n            for item in final["versions"]\n            if item.get("doi") == source_auth["published_doi"]\n        ]\n        assert len(historical) == 1\n        assert historical[0]["record_id"] == source_auth["published_record_id"]\n        assert historical[0]["git_commit_sha"] == source_auth[\n            "published_source_baseline_commit_sha"\n        ]\n        assert historical[0]["package_identity_sha256"] == source_auth[\n            "published_package_identity_sha256"\n        ]\n        current = [item for item in final["versions"] if item.get("doi") == final["latest_doi"]]\n        assert len(current) == 1\n        assert current[0]["record_id"] == final["latest_record_id"]\n        assert current[0]["git_commit_sha"] == final["latest_git_commit_sha"]\n        assert current[0]["package_identity_sha256"] == final[\n            "latest_package_identity_sha256"\n        ]\n'''
          if old not in text:
              raise SystemExit('old consumed terminal-state test block not found')
          text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/current_baseline_publication_v4.py
          python3 -m pytest -q tests/test_current_baseline_publication_v4_contract.py
          git diff --check -- scripts/current_baseline_publication_v4.py tests/test_current_baseline_publication_v4_contract.py

      - name: Commit exact compatibility fix to PR branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/current_baseline_publication_v4.py tests/test_current_baseline_publication_v4_contract.py
          git commit -m 'preservation: validate v4 checkpoint as immutable history after later DOI versions'
          git push origin HEAD:agent/full-project-preservation-staging-v1
