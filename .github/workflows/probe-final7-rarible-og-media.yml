name: Probe final seven Rarible OG media

on:
  push:
    branches: [agent/recover-final-8-archives]
    paths: [.github/workflows/probe-final7-rarible-og-media.yml]
  workflow_dispatch:

permissions:
  contents: write

env:
  KUBO_VERSION: 0.37.0
  KUBO_LINUX_AMD64_SHA512: b9243e8be52377fc934aedc66161bd51e7c49d1d52678b127b910e5654fa453983a070918e345d8e57e509f1f8c82574f59148d145d23b35d04bb20fed20f5b6

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/recover-final-8-archives
      - name: Install pinned Kubo
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/kubo.tgz"; t="$RUNNER_TEMP/tools"; mkdir -p "$t"
          curl --fail --silent --show-error --location --retry 3 "https://dist.ipfs.tech/kubo/v${KUBO_VERSION}/kubo_v${KUBO_VERSION}_linux-amd64.tar.gz" -o "$a"
          echo "$KUBO_LINUX_AMD64_SHA512  $a" | sha512sum --check --strict
          tar -xzf "$a" -C "$t" kubo/ipfs; chmod +x "$t/kubo/ipfs"
          echo "KUBO=$t/kubo/ipfs" >> "$GITHUB_ENV"
      - name: Extract OG tags, recursively decode media URLs, fetch and exact-CID verify
        run: |
          python3 - <<'PY'
          import html, json, os, pathlib, re, subprocess, tempfile, urllib.parse, urllib.request, urllib.error

          targets={
            'QmNTjiSRWuZfxzjH3QH9j5D3bEB957jS1psMuc9RFqB4QT':('POLYGON','0x9a3a7ddde5712b090181937bd7f0a6e2084707e6','0','media:image',None),
            'QmRX4GtfNvGrG2FgbtJdhUUx4ocyGk9aEqzgD7zsTEUAva':('POLYGON','0x001007e8ab86f6ba6f477712c8b8db84887d0175','0','media:image',None),
            'QmYxaovCTVY2EiXBWgvBdtpFCKyoom6bYSBTcxJ5UJweJ1':('BASE','0x3acfeebf6cd63f61ae6096dafc7dab7675bf7e77','0','media:image',None),
            'QmRTbRbkfpjnU3cW4p8FW4rjuKjHx7B2MuhE2n8qLZtMah':('BASE','0xf616ba3cfab4d17477d7c63d775666dcb1e5542d','0','media:image',None),
            'QmS4RcwE3J4JzNRAE1crQXM2Joex53TEgAXtN6nBDkWtRC':('BASE','0x1f26a5a197b4bed502e0a5a05d22b625406d05c1','0','media:image',None),
            'bafkreiddsyhct5vz2ludy2sgmh2hgx3vkk4sno2yaybukrnwrnmo4a6fcy':('POLYGON','0xad4bda0b463ace68dd640b14891b00a7fe1caccf','1','metadata',None),
            'bafybeieofybnvwz4qkmseon5zhye7fshzqosbsbsvl46buqoxtzzjzbf54':('POLYGON','0x5ed7eb7b81068ea23bc170be48b4a0e99262aa6d','1','metadata','token.json'),
          }
          kubo=os.environ['KUBO']; ua={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,application/json,image/avif,image/webp,*/*'}
          exact_dir=pathlib.Path('rarible-og-recovered'); exact_dir.mkdir(exist_ok=True)
          result={'schema':'trinity-accord/final-seven-rarible-og-media-probe/v1','exact_recovered':[],'targets':{}}

          def get(url,timeout=15,max_bytes=30_000_000):
            try:
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=timeout) as r:
                b=r.read(max_bytes+1)
                if len(b)>max_bytes: raise RuntimeError('body too large')
                return True,getattr(r,'status',200),r.geturl(),r.headers.get('content-type',''),b,None
            except urllib.error.HTTPError as e:
              return False,e.code,url,e.headers.get('content-type','') if e.headers else '',b'',str(e)
            except Exception as e:return False,None,url,'',b'',str(e)

          def unescape_all(s):
            old=None
            for _ in range(5):
              if s==old:break
              old=s
              s=html.unescape(s)
              s=s.replace('\\/','/').replace('\\u002F','/').replace('\\u002f','/').replace('\\u003A',':').replace('\\u003a',':').replace('\\u0026','&').replace('\\u003D','=').replace('\\u003d','=')
              s=urllib.parse.unquote(s)
            return s

          def urls_from_text(text):
            text=unescape_all(text)
            found=set(re.findall(r'https?://[^\\s"\'<>]+',text))
            # Pull quoted HTML attribute values separately; this avoids JS escape truncation.
            for m in re.finditer(r'(?:content|src|href)=["\']([^"\']+)["\']',text,re.I):
              v=unescape_all(m.group(1))
              if v.startswith('http'):found.add(v)
            queue=list(found)
            for u in list(queue):
              try:
                q=urllib.parse.parse_qs(urllib.parse.urlsplit(u).query)
                for vals in q.values():
                  for v in vals:
                    v=unescape_all(v)
                    if v.startswith('http'):found.add(v)
              except Exception:pass
            return sorted(u.rstrip('\\,)}];') for u in found if u.startswith('http'))

          def verify_file(cid,data):
            checks=[]
            with tempfile.TemporaryDirectory() as td:
              p=pathlib.Path(td)/'payload';p.write_bytes(data)
              modes=[('0','false')] if cid.startswith('Qm') else [('1','true'),('1','false')]
              for version,raw in modes:
                cmd=[kubo,'add','-Q','--only-hash','--pin=false',f'--cid-version={version}',f'--raw-leaves={raw}',str(p)]
                try:
                  got=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT,timeout=30).strip();checks.append({'cid_version':version,'raw_leaves':raw,'computed':got})
                  if got==cid:return True,checks
                except subprocess.CalledProcessError as e:checks.append({'cid_version':version,'raw_leaves':raw,'error':e.output[-400:]})
                except Exception as e:checks.append({'cid_version':version,'raw_leaves':raw,'error':str(e)[:300]})
            return False,checks

          def verify_directory(cid,data,leaf):
            checks=[]
            with tempfile.TemporaryDirectory() as td:
              d=pathlib.Path(td)/'root';d.mkdir();(d/leaf).write_bytes(data)
              for raw in ('true','false'):
                cmd=[kubo,'add','-Qr','--only-hash','--pin=false','--cid-version=1',f'--raw-leaves={raw}',str(d)]
                try:
                  lines=subprocess.check_output(cmd,text=True,stderr=subprocess.STDOUT,timeout=30).strip().splitlines();got=lines[-1];checks.append({'raw_leaves':raw,'computed_root':got})
                  if got==cid:return True,checks
                except subprocess.CalledProcessError as e:checks.append({'raw_leaves':raw,'error':e.output[-400:]})
                except Exception as e:checks.append({'raw_leaves':raw,'error':str(e)[:300]})
            return False,checks

          for cid,(chain,contract,token,role,leaf) in targets.items():
            page=f'https://og.rarible.com/token/{chain}-{contract}:{token}'
            ok,status,final,type_,body,error=get(page)
            text=body.decode('utf-8','replace') if body else ''
            tags=[]
            for m in re.finditer(r'<meta\\s+[^>]*>',text,re.I):
              tag=m.group(0)
              if any(x in tag.lower() for x in ['og:','twitter:','image','description']):tags.append(unescape_all(tag))
            candidates=urls_from_text(text)
            # Keep only URLs that might hold an NFT payload; exclude obvious scripts/assets.
            useful=[]
            for u in candidates:
              low=u.lower()
              if any(x in low for x in ['media.rarible','ipfs','pinata','cloudfront','amazonaws','storage','cdn','image','content','arweave','.png','.jpg','.jpeg','.webp','.gif','.svg','.json']):useful.append(u)
            # Seed the exact Rarible IPFS payload too, ordinary GET, including leaf path.
            suffix='/' + leaf if leaf else ''
            useful += [f'https://ipfs.raribleuserdata.com/ipfs/{cid}{suffix}',f'https://rarible.mypinata.cloud/ipfs/{cid}{suffix}']
            row={'coordinate':f'{chain}:{contract}:{token}','role':role,'page':{'url':page,'ok':ok,'status':status,'final_url':final,'type':type_,'bytes':len(body),'error':error},'meta_tags':tags[:40],'candidates':[],'exact':False}
            seen=set()
            for u in useful:
              u=unescape_all(u)
              if u in seen:continue
              seen.add(u)
              rok,rs,rfinal,rt,rb,re=get(u)
              item={'url':u,'ok':rok,'status':rs,'final_url':rfinal,'type':rt,'bytes':len(rb),'error':re}
              if rok and rb:
                vok,checks=verify_directory(cid,rb,leaf) if leaf else verify_file(cid,rb)
                item['cid_checks']=checks
                if vok:
                  row['exact']=True; item['exact']=True
                  ext='.json' if role=='metadata' else '.bin';p=exact_dir/(cid+ext);p.write_bytes(rb)
                  item['saved_file']=str(p);result['exact_recovered'].append({'root_cid':cid,'url':u,'bytes':len(rb),'file':str(p)})
              row['candidates'].append(item)
            result['targets'][cid]=row
            print(cid,'page',status,'tags',len(tags),'candidates',len(row['candidates']),'EXACT' if row['exact'] else 'no-exact')
          pathlib.Path('final7-rarible-og-media-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'exact_recovered':len(result['exact_recovered']),'cids':[x['root_cid'] for x in result['exact_recovered']]},indent=2))
          PY
      - name: Commit report and exact bytes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add final7-rarible-og-media-probe.json rarible-og-recovered
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Rarible OG media recovery probe"
          git push origin HEAD:agent/recover-final-8-archives
