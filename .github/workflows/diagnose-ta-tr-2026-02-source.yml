name: Diagnose TA-TR-2026-02 staged source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-ta-tr-2026-02-source.yml
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Diagnose staged source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64, lzma
          root=Path('research/writing-before-the-outcome/publication-source')
          ps=sorted(root.glob('extracted-v1.3.md.xz.b64.part*'))
          vals=[''.join(p.read_text(encoding='utf-8').split()) for p in ps]
          for i,(p,s) in enumerate(zip(ps,vals)):
              print(i,p.name,'len',len(s),'mod4',len(s)%4,'first',s[:16],'last',s[-16:])
          a,b,c=vals
          print('b-in-c',b in c,'b-pos-c',c.find(b),'suffix-equal',c.endswith(b))
          print('c-in-b',c in b,'c-pos-b',b.find(c))
          for x,y,label in ((a,b,'a-b'),(a,c,'a-c'),(b,c,'b-c')):
              best=0
              for k in range(1,min(len(x),len(y))+1):
                  if x[-k:]==y[:k]: best=k
              print('suffix-prefix-overlap',label,best)
          # locate c's first 64 chars inside a and b; locate a's last 64 chars in c
          for n in (16,32,64,128,256):
              print('c-prefix',n,'in-a',a.find(c[:n]),'in-b',b.find(c[:n]))
              print('a-suffix',n,'in-c',c.find(a[-n:]),'in-b',b.find(a[-n:]))
          target='4c2974797639b0ac761468060f332b853716e45f855df29af551e1efbdda25ea'
          def check(label,s):
              try:
                  raw=base64.b64decode(s,validate=True)
                  d=lzma.decompress(raw)
                  h=hashlib.sha256(d).hexdigest()
                  print('CHECK',label,'len',len(s),'hash',h,'TARGET',h==target)
                  return h==target
              except Exception as e:
                  print('CHECK',label,'len',len(s),'FAIL',type(e).__name__,str(e)[:100])
                  return False
          # likely overlap merges
          for k in range(0,min(len(a),len(c))+1):
              if k and a[-k:]==c[:k]:
                  check(f'a+c-overlap-{k}',a+c[k:])
          # Search all splice points from a prefix + c suffix that produce 31792 chars.
          # i chars from a + (31792-i) chars from end of c.
          found=False
          for i in range(4,len(a)+1,4):
              need=31792-i
              if 0 <= need <= len(c):
                  s=a[:i]+c[-need:]
                  try:
                      raw=base64.b64decode(s,validate=True)
                      d=lzma.decompress(raw)
                  except Exception:
                      continue
                  h=hashlib.sha256(d).hexdigest()
                  print('SPLICE-DECOMPRESSED','i',i,'c-suffix',need,'hash',h,'TARGET',h==target)
                  if h==target: found=True; break
          print('TARGET_SPLICE_FOUND',found)
          PY