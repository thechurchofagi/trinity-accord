name: Native OTS Upgrade Watch

on:
  schedule:
    # One bounded automatic lifecycle attempt per UTC day.
    - cron: "42 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "auto"
        type: choice
        options:
          - verify_only
          - auto

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NATIVE_OTS_RUN_ID: "native-ots-watch-${{ github.run_id }}"
      NODE_OPTIONS: "--import=./scripts/arweave_runtime_spend_guard.mjs"
      ARWEAVE_MINIMUM_REMAINING_AR: "0.25"

    steps:
      - name: Authorize write workflow actor
        run: |
          set -euo pipefail
          actor="${GITHUB_ACTOR:-}"
          if [[ "$actor" != "thechurchofagi" && "$actor" != "github-actions[bot]" ]]; then
            echo "Unauthorized actor: $actor" >&2
            exit 1
          fi

      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements-ci.txt
          python3 -m pip install -r requirements-ots.txt
          npm ci
          ots --help

      - name: Run Native OTS upgrade workflow contract test
        run: |
          python3 scripts/test_native_ots_upgrade_workflow_contract.py
          python3 scripts/test_native_ots_complete_staging_contract.py
          python3 -m pytest -q tests/test_arweave_cost_boundaries.py

      - name: Prepare Arweave JWK if available
        id: jwk
        env:
          ARKEY_CONFIGURED: ${{ secrets.ARKEY || vars.ARKEY }}
          ARWEAVE_JWK_CONFIGURED: ${{ secrets.ARWEAVE_JWK || vars.ARWEAVE_JWK }}
        run: |
          set -euo pipefail
          ARWEAVE_JWK_JSON="${ARKEY_CONFIGURED:-${ARWEAVE_JWK_CONFIGURED:-}}"
          if [ -z "${ARWEAVE_JWK_JSON:-}" ]; then
            echo "has_jwk=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$ARWEAVE_JWK_JSON"
          mkdir -p /tmp/arweave-secrets
          printf '%s' "$ARWEAVE_JWK_JSON" > /tmp/arweave-secrets/wallet.jwk.json
          chmod 600 /tmp/arweave-secrets/wallet.jwk.json
          python3 - <<'PY'
          import json
          json.load(open("/tmp/arweave-secrets/wallet.jwk.json"))
          PY
          echo "ARWEAVE_JWK_PATH=/tmp/arweave-secrets/wallet.jwk.json" >> "$GITHUB_ENV"
          echo "has_jwk=true" >> "$GITHUB_OUTPUT"

      - name: Resolve Native OTS mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'auto' }}
          HAS_JWK: ${{ steps.jwk.outputs.has_jwk }}
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          if [ "$EVENT_NAME" = "schedule" ]; then
            mode="auto"
          fi
          if [ "$HAS_JWK" != "true" ]; then
            mode="verify_only"
          fi
          case "$mode" in
            verify_only|auto) ;;
            *) echo "Invalid Native OTS mode: $mode" >&2; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run one bounded Native OTS lifecycle attempt
        env:
          NATIVE_OTS_MODE: ${{ steps.mode.outputs.mode }}
          ARWEAVE_JWK_PATH: ${{ env.ARWEAVE_JWK_PATH }}
          OTS_UPGRADE_TIMEOUT: "180"
        run: python3 scripts/run_native_ots_workflow_once.py

      - name: Upload Native OTS audit logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ots-watch-audit-${{ github.run_id }}
          path: record-chain/audit/native-ots/${{ env.NATIVE_OTS_RUN_ID }}/
          retention-days: 90
          if-no-files-found: warn
