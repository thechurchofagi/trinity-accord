name: Publish TA12 Training Governed Agent
on:
  push:
    branches: [research/training-governed-agent-v1-2-20260921]
    paths:
      - '.github/workflows/publish-training-governed-agent.yml'
      - 'research/training-governed-agent/PUBLISH-AUTHORIZATION.json'
permissions:
  contents: write
concurrency:
  group: training-governed-agent-zenodo-v1-2
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta12-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/training-governed-agent-v1-2-20260921
          fetch-depth: 0
      - name: Validate exact frozen package
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'research/training-governed-agent')
          from publication_common import validate_local_package
          e,d=validate_local_package()
          print('Validated TA12',e['doi'],d)
          PY
      - name: Publish only reserved TA12 record and verify anonymous readback
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/training-governed-agent/publish_zenodo.py
      - name: Preserve publication receipt
        if: always()
        run: python3 research/training-governed-agent/publication_common.py --persist-states
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ta12-publication
          path: |
            research/training-governed-agent/publication-record.json
            research/training-governed-agent/publication-attempt.json
            /tmp/ta12-public-readback/
          retention-days: 90
          if-no-files-found: warn
