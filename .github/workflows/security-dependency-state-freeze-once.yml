name: Freeze security dependency state once

on:
  push:
    branches:
      - agent/security-cryptography-50-0-1-20260828
    paths:
      - .github/workflows/security-dependency-state-freeze-once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/security-cryptography-50-0-1-20260828
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Rebuild exact candidate identity and self-delete
        shell: bash
        run: |
          set -euo pipefail
          capsule="$RUNNER_TEMP/offline-dependency-capsule"
          archive="$RUNNER_TEMP/offline-dependency-capsule.tar.gz"
          candidate="$RUNNER_TEMP/offline-dependency-state-candidate.json"

          python3 scripts/build_offline_dependency_capsule.py \
            --repository-root . \
            --output-dir "$capsule"
          python3 scripts/build_offline_dependency_capsule.py \
            --output-dir "$capsule" \
            --verify-only

          cd "$RUNNER_TEMP"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf offline-dependency-capsule.tar.gz offline-dependency-capsule
          cd "$GITHUB_WORKSPACE"

          python3 scripts/verify_offline_dependency_state.py \
            --write-state "$candidate" \
            --capsule-dir "$capsule" \
            --archive "$archive"

          CANDIDATE="$candidate" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["CANDIDATE"])
          state = json.loads(source.read_text(encoding="utf-8"))
          state.update({
              "retention_boundary": {
                  "committed_state_preserves_exact_capsule_and_dependency_identities": True,
                  "github_actions_is_not_long_term_preservation": True,
                  "institutional_binary_publication_requires_separate_rights_approval": True,
              },
              "source_git_commit_sha": os.environ["GITHUB_SHA"],
              "source_repository": "https://github.com/thechurchofagi/trinity-accord",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
          })
          Path("preservation/offline-dependency-state.json").write_text(
              json.dumps(state, ensure_ascii=False, sort_keys=True, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

          python3 scripts/verify_offline_dependency_state.py \
            --state preservation/offline-dependency-state.json \
            --capsule-dir "$capsule" \
            --archive "$archive"

          git rm .github/workflows/security-dependency-state-freeze-once.yml
          git add preservation/offline-dependency-state.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "preservation: freeze cryptography 50.0.1 dependency identity"
          git push origin HEAD:agent/security-cryptography-50-0-1-20260828
