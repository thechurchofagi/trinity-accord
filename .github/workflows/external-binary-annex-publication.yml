name: Complete External Binary Annex Publication

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/external-binary-annex-publication.yml

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  publish-annexes:
    if: >-
      (
        github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'fix: complete Trinity preservation publication')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.actor == 'thechurchofagi'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      EVIDENCE_PACKAGE_DIR: ${{ runner.temp }}/trinity-evidence-annex-v2
      NFT_PACKAGE_DIR: ${{ runner.temp }}/trinity-nft-annex-v2
      TRINITY_PUBLICATION_SOURCE_SHA: ${{ github.sha }}
      EXTERNAL_BINARY_ANNEX_RIGHTS_ACK: TRINITY_EXTERNAL_BINARY_ANNEX_RIGHTS_V1_APPROVED
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}

    steps:
      - name: Checkout the exact triggering source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Resolve one-time publication requirement
        id: precheck
        run: |
          set -euo pipefail
          echo "source-and-authorization-precheck" > "$RUNNER_TEMP/annex-publication-stage.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TRINITY_PUBLICATION_SOURCE_SHA" = "$GITHUB_SHA"
          test -n "$ZENODO_ACCESS_TOKEN"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(
              Path("preservation/external-binary-annex-state.json").read_text(
                  encoding="utf-8"
              )
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          if state.get("publication_status") == "published_and_publicly_restored":
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("required=false\n")
              raise SystemExit(0)

          authorization = json.loads(
              Path("preservation/external-binary-annex-authorization-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_authorization = {
              "schema": "trinityaccord.external-binary-annex-publication-authorization.v1",
              "authorized_by": "thechurchofagi",
              "authorized_at": "2026-08-01T21:45:00+08:00",
              "authorization": "publish_all_necessary_external_binary_annexes",
              "publication_confirmation": "PUBLISH_TRINITY_EXTERNAL_BINARY_ANNEXES_V1",
              "rights_boundary_ack": "TRINITY_EXTERNAL_BINARY_ANNEX_RIGHTS_V1_APPROVED",
              "core_repository_preservation_doi": "10.5281/zenodo.21739344",
              "scope": {
                  "all_custom_assets_from_named_valid_releases": True,
                  "evidence_annex": True,
                  "chronicle_nft_media_annex": True,
                  "already_public_release_bytes_only": True,
                  "deprecated_failed_nft_attempts": False,
                  "github_generated_source_archives": False,
                  "publicly_readable_for_preservation": True,
                  "deposit_grants_no_new_reuse_rights": True,
              },
              "user_authorization_text": (
                  "你把该做的都做了吧？你觉得该做的都做了，反正用程序做也简单。"
                  "你这个写程序写得又快又好。这不是什么那个，反正容量也有，对不对？"
                  "DOI 的容量是足够的，是不是？既然有容量，就把它全部做了呗。"
              ),
          }
          if authorization != expected_authorization:
              raise SystemExit("external-binary annex owner authorization changed")

          trigger = json.loads(
              Path("preservation/external-binary-annex-publication-trigger.json").read_text(
                  encoding="utf-8"
              )
          )
          if trigger != {
              "schema": "trinityaccord.external-binary-annex-publication-trigger.v1",
              "authorized_by": "thechurchofagi",
              "operation": "publish_evidence_and_nft_binary_annexes",
              "requested_at": "2026-08-01T21:45:00+08:00",
              "publication_confirmation": "PUBLISH_TRINITY_EXTERNAL_BINARY_ANNEXES_V1",
              "expected_core_doi": "10.5281/zenodo.21739344",
              "rights_boundary_ack": "TRINITY_EXTERNAL_BINARY_ANNEX_RIGHTS_V1_APPROVED",
              "expected_annex_types": ["evidence", "nft"],
          }:
              raise SystemExit("external-binary annex publication trigger changed")
          with output.open("a", encoding="utf-8") as handle:
              handle.write("required=true\n")
          PY

      - name: Set up Python
        if: steps.precheck.outputs.required == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install verification dependencies
        if: steps.precheck.outputs.required == 'true'
        run: python3 -m pip install -r requirements-ci.txt

      - name: Record publication toolchain provenance
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "toolchain-provenance" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/toolchain_provenance.py > \
            "$RUNNER_TEMP/external-annex-v2-toolchain-provenance.json"
          git --version
          curl --version
          python3 --version
          df -h

      - name: Verify the exact source before any Zenodo write
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "source-regression-tests" > "$RUNNER_TEMP/annex-publication-stage.txt"
          test "$(git rev-parse HEAD)" = "$TRINITY_PUBLICATION_SOURCE_SHA"
          python3 -m pytest -q \
            tests/test_external_binary_annex_v2.py \
            tests/test_preservation_capsule.py
          python3 scripts/trinity_record_chain.py verify
          python3 scripts/run_current_system_tests.py
          python3 scripts/test_no_secret_material_committed.py
          python3 scripts/test_no_private_key_material_committed.py

      - name: Build complete paginated evidence annex V2
        if: steps.precheck.outputs.required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "build-evidence-annex-v2" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/external_binary_annex_v2.py \
            --annex-type evidence \
            --output-dir "$EVIDENCE_PACKAGE_DIR" \
            --publication-date 2026-08-02 \
            --source-commit "$TRINITY_PUBLICATION_SOURCE_SHA"

      - name: Build complete paginated Chronicle NFT annex V2
        if: steps.precheck.outputs.required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "build-nft-annex-v2" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/external_binary_annex_v2.py \
            --annex-type nft \
            --output-dir "$NFT_PACKAGE_DIR" \
            --publication-date 2026-08-02 \
            --source-commit "$TRINITY_PUBLICATION_SOURCE_SHA"
          df -h

      - name: Publish or reconcile V2 annex records
        if: steps.precheck.outputs.required == 'true'
        id: publish
        run: |
          set -euo pipefail
          echo "zenodo-publish-or-reconcile-v2" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/publish_external_binary_annexes_to_zenodo_v2.py \
            --evidence-package-dir "$EVIDENCE_PACKAGE_DIR" \
            --nft-package-dir "$NFT_PACKAGE_DIR" \
            --state preservation/external-binary-annex-state.json \
            --rights-boundary-ack "$EXTERNAL_BINARY_ANNEX_RIGHTS_ACK" \
            --source-commit "$TRINITY_PUBLICATION_SOURCE_SHA"

      - name: Prove public DOI-only recovery of evidence annex V2
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "public-evidence-annex-v2-cold-restore" > "$RUNNER_TEMP/annex-publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/evidence-bootstrap"
          curl --fail --location --silent --show-error --retry 6 --retry-all-errors \
            "https://zenodo.org/records/${{ steps.publish.outputs.evidence_record_id }}/files/restore-trinity-annex.py?download=1" \
            -o "$RUNNER_TEMP/evidence-bootstrap/restore-trinity-annex.py"
          cd "$RUNNER_TEMP/evidence-bootstrap"
          env -u ZENODO_ACCESS_TOKEN python3 restore-trinity-annex.py \
            --zenodo-record-id "${{ steps.publish.outputs.evidence_record_id }}" \
            --output-dir "$RUNNER_TEMP/evidence-public-restore"
          cp "$RUNNER_TEMP/evidence-public-restore/recovery-report.json" \
            "$RUNNER_TEMP/evidence-public-recovery-report.json"
          rm -rf "$RUNNER_TEMP/evidence-public-restore" "$RUNNER_TEMP/evidence-bootstrap"

      - name: Prove public DOI-only recovery of Chronicle NFT annex V2
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "public-nft-annex-v2-cold-restore" > "$RUNNER_TEMP/annex-publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/nft-bootstrap"
          curl --fail --location --silent --show-error --retry 6 --retry-all-errors \
            "https://zenodo.org/records/${{ steps.publish.outputs.nft_record_id }}/files/restore-trinity-annex.py?download=1" \
            -o "$RUNNER_TEMP/nft-bootstrap/restore-trinity-annex.py"
          cd "$RUNNER_TEMP/nft-bootstrap"
          env -u ZENODO_ACCESS_TOKEN python3 restore-trinity-annex.py \
            --zenodo-record-id "${{ steps.publish.outputs.nft_record_id }}" \
            --output-dir "$RUNNER_TEMP/nft-public-restore"
          cp "$RUNNER_TEMP/nft-public-restore/recovery-report.json" \
            "$RUNNER_TEMP/nft-public-recovery-report.json"
          rm -rf "$RUNNER_TEMP/nft-public-restore" "$RUNNER_TEMP/nft-bootstrap"

      - name: Seal public state and synchronize recovery discovery
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "seal-public-annex-v2-state" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/seal_external_binary_annex_publication.py \
            --evidence-report "$RUNNER_TEMP/evidence-public-recovery-report.json" \
            --nft-report "$RUNNER_TEMP/nft-public-recovery-report.json" \
            --source-commit "$TRINITY_PUBLICATION_SOURCE_SHA"

      - name: Commit verified state and retire the one-time write entrypoint
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "commit-published-annex-v2-state" > "$RUNNER_TEMP/annex-publication-stage.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            preservation/external-binary-annex-state.json \
            preservation/external-binary-annex-observation.json \
            api/recovery-index.json
          git rm .github/workflows/external-binary-annex-publication.yml
          git rm preservation/external-binary-annex-publication-trigger.json
          if test -f preservation/external-binary-annex-publication-attempt.json; then
            git rm preservation/external-binary-annex-publication-attempt.json
          fi
          git commit -m "archive: record complete publicly restored binary annex V2 DOIs"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Record visible publication failure
        if: failure() && steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          git reset --hard "$TRINITY_PUBLICATION_SOURCE_SHA"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          stage_path = Path(os.environ["RUNNER_TEMP"]) / "annex-publication-stage.txt"
          stage = stage_path.read_text(encoding="utf-8").strip() if stage_path.exists() else "unknown"
          value = {
              "schema": "trinityaccord.external-binary-annex-publication-attempt.v2",
              "status": "failed",
              "stage": stage,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit_sha": os.environ["TRINITY_PUBLICATION_SOURCE_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
              "failed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "zenodo_publication_may_require_idempotent_reconciliation": stage in {
                  "zenodo-publish-or-reconcile-v2",
                  "public-evidence-annex-v2-cold-restore",
                  "public-nft-annex-v2-cold-restore",
                  "seal-public-annex-v2-state",
                  "commit-published-annex-v2-state",
              },
          }
          Path("preservation/external-binary-annex-publication-attempt.json").write_text(
              json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/external-binary-annex-publication-attempt.json
          git commit -m "archive: record external binary annex V2 publication failure"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload compact publication evidence
        if: always() && steps.precheck.outputs.required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-binary-annex-v2-publication-evidence
          path: |
            ${{ runner.temp }}/external-annex-v2-toolchain-provenance.json
            ${{ runner.temp }}/evidence-public-recovery-report.json
            ${{ runner.temp }}/nft-public-recovery-report.json
            ${{ runner.temp }}/trinity-evidence-annex-v2/annex-manifest.json
            ${{ runner.temp }}/trinity-nft-annex-v2/annex-manifest.json
            preservation/external-binary-annex-state.json
            preservation/external-binary-annex-observation.json
            preservation/external-binary-annex-publication-attempt.json
          retention-days: 365
          if-no-files-found: warn
