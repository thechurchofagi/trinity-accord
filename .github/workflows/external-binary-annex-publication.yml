name: Publish External Binary Annexes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - preservation/external-binary-annex-publication-trigger.json
      - .github/workflows/external-binary-annex-publication.yml

concurrency:
  group: main-write-lock
  cancel-in-progress: false

jobs:
  publish-annexes:
    if: >-
      github.actor == 'thechurchofagi' &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.event.head_commit.message, 'archive: publish Trinity external binary annexes')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      EVIDENCE_PACKAGE_DIR: ${{ runner.temp }}/trinity-evidence-annex
      NFT_PACKAGE_DIR: ${{ runner.temp }}/trinity-nft-annex
      EXTERNAL_BINARY_ANNEX_RIGHTS_ACK: TRINITY_EXTERNAL_BINARY_ANNEX_RIGHTS_V1_APPROVED
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}

    steps:
      - name: Checkout current production repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-ci.txt

      - name: Record annex publication toolchain provenance
        run: |
          set -euo pipefail
          echo "toolchain-provenance" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/external-annex-toolchain-provenance.json"
          git --version
          curl --version
          python3 --version
          df -h

      - name: Validate exact owner authorization and publication trigger
        run: |
          set -euo pipefail
          echo "authorization-precheck" > "$RUNNER_TEMP/annex-publication-stage.txt"
          test "$GITHUB_ACTOR" = "thechurchofagi"
          test -n "$ZENODO_ACCESS_TOKEN"
          python3 - <<'PY'
          import json
          from pathlib import Path

          authorization = json.loads(
              Path("preservation/external-binary-annex-authorization-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_authorization = {
              "schema": "trinityaccord.external-binary-annex-publication-authorization.v1",
              "authorized_by": "thechurchofagi",
              "authorized_at": "2026-08-01T21:45:00+08:00",
              "authorization": "publish_all_necessary_external_binary_annexes",
              "publication_confirmation": "PUBLISH_TRINITY_EXTERNAL_BINARY_ANNEXES_V1",
              "rights_boundary_ack": "TRINITY_EXTERNAL_BINARY_ANNEX_RIGHTS_V1_APPROVED",
              "core_repository_preservation_doi": "10.5281/zenodo.21739344",
              "scope": {
                  "all_custom_assets_from_named_valid_releases": True,
                  "evidence_annex": True,
                  "chronicle_nft_media_annex": True,
                  "already_public_release_bytes_only": True,
                  "deprecated_failed_nft_attempts": False,
                  "github_generated_source_archives": False,
                  "publicly_readable_for_preservation": True,
                  "deposit_grants_no_new_reuse_rights": True,
              },
              "user_authorization_text": (
                  "你把该做的都做了吧？你觉得该做的都做了，反正用程序做也简单。"
                  "你这个写程序写得又快又好。这不是什么那个，反正容量也有，对不对？"
                  "DOI 的容量是足够的，是不是？既然有容量，就把它全部做了呗。"
              ),
          }
          if authorization != expected_authorization:
              raise SystemExit("external-binary annex owner authorization changed")

          trigger = json.loads(
              Path("preservation/external-binary-annex-publication-trigger.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_trigger = {
              "schema": "trinityaccord.external-binary-annex-publication-trigger.v1",
              "authorized_by": "thechurchofagi",
              "requested_at": "2026-08-01T21:45:00+08:00",
              "operation": "publish_evidence_and_nft_binary_annexes",
              "publication_confirmation": "PUBLISH_TRINITY_EXTERNAL_BINARY_ANNEXES_V1",
              "rights_boundary_ack": "TRINITY_EXTERNAL_BINARY_ANNEX_RIGHTS_V1_APPROVED",
              "expected_core_doi": "10.5281/zenodo.21739344",
              "expected_annex_types": ["evidence", "nft"],
          }
          if trigger != expected_trigger:
              raise SystemExit("external-binary annex publication trigger changed")

          state = json.loads(
              Path("preservation/external-binary-annex-state.json").read_text(
                  encoding="utf-8"
              )
          )
          if state.get("publication_status") == "published_and_publicly_restored":
              raise SystemExit("external binary annexes are already fully published")
          PY

      - name: Run annex regression tests
        run: |
          set -euo pipefail
          echo "annex-regression-tests" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 -m pytest -q tests/test_external_binary_annex.py

      - name: Build complete evidence annex
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "build-evidence-annex" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/external_binary_annex.py \
            --annex-type evidence \
            --output-dir "$EVIDENCE_PACKAGE_DIR" \
            --publication-date 2026-08-01

      - name: Build complete Chronicle NFT media annex
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "build-nft-annex" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/external_binary_annex.py \
            --annex-type nft \
            --output-dir "$NFT_PACKAGE_DIR" \
            --publication-date 2026-08-01
          df -h

      - name: Publish or reconcile both Zenodo annex records
        id: publish
        run: |
          set -euo pipefail
          echo "zenodo-publish-or-reconcile" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/publish_external_binary_annexes_to_zenodo.py \
            --evidence-package-dir "$EVIDENCE_PACKAGE_DIR" \
            --nft-package-dir "$NFT_PACKAGE_DIR" \
            --state preservation/external-binary-annex-state.json \
            --rights-boundary-ack "$EXTERNAL_BINARY_ANNEX_RIGHTS_ACK"

      - name: Prove public DOI-only recovery of evidence annex
        run: |
          set -euo pipefail
          echo "public-evidence-annex-cold-restore" > "$RUNNER_TEMP/annex-publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/evidence-bootstrap"
          curl --fail --location --silent --show-error --retry 6 \
            "https://zenodo.org/records/${{ steps.publish.outputs.evidence_record_id }}/files/restore-trinity-annex.py?download=1" \
            -o "$RUNNER_TEMP/evidence-bootstrap/restore-trinity-annex.py"
          cd "$RUNNER_TEMP/evidence-bootstrap"
          env -u ZENODO_ACCESS_TOKEN python3 restore-trinity-annex.py --zenodo-record-id "${{ steps.publish.outputs.evidence_record_id }}" --output-dir "$RUNNER_TEMP/evidence-public-restore"
          cp "$RUNNER_TEMP/evidence-public-restore/recovery-report.json" \
            "$RUNNER_TEMP/evidence-public-recovery-report.json"
          rm -rf "$RUNNER_TEMP/evidence-public-restore" "$RUNNER_TEMP/evidence-bootstrap"

      - name: Prove public DOI-only recovery of Chronicle NFT annex
        run: |
          set -euo pipefail
          echo "public-nft-annex-cold-restore" > "$RUNNER_TEMP/annex-publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/nft-bootstrap"
          curl --fail --location --silent --show-error --retry 6 \
            "https://zenodo.org/records/${{ steps.publish.outputs.nft_record_id }}/files/restore-trinity-annex.py?download=1" \
            -o "$RUNNER_TEMP/nft-bootstrap/restore-trinity-annex.py"
          cd "$RUNNER_TEMP/nft-bootstrap"
          env -u ZENODO_ACCESS_TOKEN python3 restore-trinity-annex.py --zenodo-record-id "${{ steps.publish.outputs.nft_record_id }}" --output-dir "$RUNNER_TEMP/nft-public-restore"
          cp "$RUNNER_TEMP/nft-public-restore/recovery-report.json" \
            "$RUNNER_TEMP/nft-public-recovery-report.json"
          rm -rf "$RUNNER_TEMP/nft-public-restore" "$RUNNER_TEMP/nft-bootstrap"

      - name: Seal public restore state and recovery index
        run: |
          set -euo pipefail
          echo "seal-public-annex-state" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          state_path = Path("preservation/external-binary-annex-state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          temp = Path(os.environ["RUNNER_TEMP"])
          reports = {
              "evidence": json.loads(
                  (temp / "evidence-public-recovery-report.json").read_text(
                      encoding="utf-8"
                  )
              ),
              "nft": json.loads(
                  (temp / "nft-public-recovery-report.json").read_text(
                      encoding="utf-8"
                  )
              ),
          }
          for annex_type, report in reports.items():
              if report.get("status") != "passed" or report.get("annex_type") != annex_type:
                  raise SystemExit(f"public cold restore did not pass: {annex_type}")
              entry = state["annexes"][annex_type]
              if report.get("package_identity_sha256") != entry["package_identity_sha256"]:
                  raise SystemExit(f"public restore package identity mismatch: {annex_type}")
              if report.get("asset_count") != entry["asset_count"]:
                  raise SystemExit(f"public restore asset count mismatch: {annex_type}")
              if report.get("payload_bytes") != entry["payload_bytes"]:
                  raise SystemExit(f"public restore payload byte mismatch: {annex_type}")
              entry["public_cold_restore"] = "passed"
              entry["public_cold_restore_report"] = report
          state["publication_status"] = "published_and_publicly_restored"
          state["all_named_release_assets_embedded"] = True
          state["external_binary_payload_recovery_requires_github"] = False
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          observation = {
              "schema": "trinityaccord.external-binary-annex-public-observation.v1",
              "observed_without_github_credentials": True,
              "observed_without_zenodo_credentials": True,
              "core_repository_preservation_doi": state[
                  "core_repository_preservation_doi"
              ],
              "publication_status": state["publication_status"],
              "annexes": state["annexes"],
          }
          Path("preservation/external-binary-annex-observation.json").write_text(
              json.dumps(
                  observation, ensure_ascii=False, indent=2, allow_nan=False
              )
              + "\n",
              encoding="utf-8",
          )

          index_path = Path("api/recovery-index.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          index["recovery_entrypoints"]["external_binary_annex_state"] = (
              "preservation/external-binary-annex-state.json"
          )
          index["recovery_entrypoints"]["external_binary_annex_restore_cli"] = (
              "scripts/restore_external_binary_annex.py"
          )
          index["mirror_classes"]["external_binary_annex_zenodo"] = (
              "verified complete named-release-asset packages plus unauthenticated "
              "public DOI-only cold restoration"
          )
          index["latest_trusted_release"] = {
              "status": "published_and_publicly_restored",
              "repository_preservation_doi": "10.5281/zenodo.21739344",
              "external_binary_annexes": {
                  annex_type: {
                      "doi": entry["doi"],
                      "record_id": entry["record_id"],
                      "asset_count": entry["asset_count"],
                      "payload_bytes": entry["payload_bytes"],
                      "public_cold_restore": entry["public_cold_restore"],
                  }
                  for annex_type, entry in state["annexes"].items()
              },
          }
          limitation = (
              "The core repository capsule excludes large external payload bytes; "
              "the separately published evidence and Chronicle NFT binary annex DOI "
              "records preserve all custom assets from the named valid releases."
          )
          limitations = [
              item
              for item in index.get("limitations", [])
              if not (
                  isinstance(item, str)
                  and item.startswith(
                      "The core repository capsule does not embed the separately hosted "
                      "large binary"
                  )
              )
          ]
          if limitation not in limitations:
              limitations.append(limitation)
          index["limitations"] = limitations
          canonical = dict(index)
          canonical.pop("source_digest", None)
          index["source_digest"] = hashlib.sha256(
              json.dumps(
                  canonical,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")
          ).hexdigest()[:16]
          index_path.write_text(
              json.dumps(index, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit published annex DOI state
        run: |
          set -euo pipefail
          echo "commit-published-annex-state" > "$RUNNER_TEMP/annex-publication-stage.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            preservation/external-binary-annex-state.json \
            preservation/external-binary-annex-observation.json \
            api/recovery-index.json
          if test -f preservation/external-binary-annex-publication-attempt.json; then
            git rm preservation/external-binary-annex-publication-attempt.json
          fi
          if git diff --cached --quiet; then
            echo "::error::Annex publication produced no state change."
            exit 1
          fi
          git commit -m "archive: record publicly restored external binary annex DOIs"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            git add \
              preservation/external-binary-annex-state.json \
              preservation/external-binary-annex-observation.json \
              api/recovery-index.json
            if test -f preservation/external-binary-annex-publication-attempt.json; then
              git rm preservation/external-binary-annex-publication-attempt.json
            fi
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Record visible annex publication failure
        if: failure()
        run: |
          set -euo pipefail
          for path in \
            preservation/external-binary-annex-state.json \
            preservation/external-binary-annex-observation.json \
            api/recovery-index.json; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              if ! git diff --cached --quiet -- "$path"; then
                git restore --staged "$path"
              fi
              if ! git diff --quiet -- "$path"; then
                git restore "$path"
              fi
            elif test -f "$path"; then
              rm "$path"
            fi
          done
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          stage_path = Path(os.environ["RUNNER_TEMP"]) / "annex-publication-stage.txt"
          stage = (
              stage_path.read_text(encoding="utf-8").strip()
              if stage_path.exists()
              else "unknown"
          )
          value = {
              "schema": "trinityaccord.external-binary-annex-publication-attempt.v1",
              "status": "failed",
              "stage": stage,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "trigger_commit": os.environ["GITHUB_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
              "failed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "zenodo_publication_may_require_idempotent_reconciliation": stage
              in {
                  "zenodo-publish-or-reconcile",
                  "public-evidence-annex-cold-restore",
                  "public-nft-annex-cold-restore",
                  "seal-public-annex-state",
                  "commit-published-annex-state",
              },
          }
          Path(
              "preservation/external-binary-annex-publication-attempt.json"
          ).write_text(
              json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/external-binary-annex-publication-attempt.json
          git commit -m "archive: record external binary annex publication failure"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload compact annex publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-binary-annex-publication-evidence
          path: |
            ${{ runner.temp }}/external-annex-toolchain-provenance.json
            ${{ runner.temp }}/evidence-public-recovery-report.json
            ${{ runner.temp }}/nft-public-recovery-report.json
            ${{ runner.temp }}/trinity-evidence-annex/annex-manifest.json
            ${{ runner.temp }}/trinity-nft-annex/annex-manifest.json
            preservation/external-binary-annex-state.json
            preservation/external-binary-annex-observation.json
            preservation/external-binary-annex-publication-attempt.json
          retention-days: 365
          if-no-files-found: warn
