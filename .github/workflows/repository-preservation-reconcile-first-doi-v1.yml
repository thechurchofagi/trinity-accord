name: Reconcile First Repository Preservation DOI V1

on:
  push:
    branches:
      - main
    paths:
      - preservation/publication-reconcile-v1.json

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  publish-and-prove:
    if: >-
      github.actor == 'thechurchofagi' &&
      startsWith(github.event.head_commit.message, 'archive: reconcile first repository preservation DOI publication')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK: ${{ vars.PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK }}
      TARGET_COMMIT: 484bdd7a85694ad53fe7e6e9dcea94d0dee5617e
    steps:
      - name: Checkout current production tree and tag identities
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate reconciliation authorization and current state
        id: precheck
        run: |
          set -euo pipefail
          echo "authorization-precheck" > "$RUNNER_TEMP/publication-stage.txt"
          test "$GITHUB_ACTOR" = "thechurchofagi"
          test "$PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK" = \
            "TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED"
          test -n "$ZENODO_ACCESS_TOKEN"
          git cat-file -e "$TARGET_COMMIT^{commit}"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          marker = json.loads(Path("preservation/publication-reconcile-v1.json").read_text(encoding="utf-8"))
          expected_marker = {
              "schema": "trinityaccord.repository-preservation-publication-reconcile.v1",
              "authorized_by": "thechurchofagi",
              "authorized_at": "2026-08-01T19:42:00+08:00",
              "reconciliation_requested_at": "2026-08-01T20:05:00+08:00",
              "authorization": "publish_first_repository_preservation_doi",
              "publication_confirmation": "PUBLISH_TRINITY_REPOSITORY_CAPSULE_V1",
              "rights_boundary_ack": "TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED",
              "access_right": "other-closed",
              "target_commit": "484bdd7a85694ad53fe7e6e9dcea94d0dee5617e",
              "scope": {
                  "core_git_tracked_tree_only": True,
                  "external_large_binary_annex_embedded": False,
              },
          }
          if marker != expected_marker:
              raise SystemExit("publication reconciliation marker is not the exact approved contract")

          authorization = json.loads(Path("preservation/publication-authorization-v1.json").read_text(encoding="utf-8"))
          if authorization.get("publication_confirmation") != "PUBLISH_TRINITY_REPOSITORY_CAPSULE_V1":
              raise SystemExit("original publication authorization is missing")
          if authorization.get("access_right") != "other-closed":
              raise SystemExit("original publication rights boundary changed")
          if authorization.get("scope") != {
              "core_git_tracked_tree_only": True,
              "external_large_binary_annex_embedded": False,
          }:
              raise SystemExit("original publication scope changed")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["TARGET_COMMIT"], os.environ["GITHUB_SHA"]],
              text=True,
          ).splitlines()
          required = {
              ".github/workflows/repository-preservation-authorized-publish-v1.yml",
              ".github/workflows/repository-preservation-reconcile-first-doi-v1.yml",
              "preservation/publication-authorization-v1.json",
              "preservation/publication-reconcile-v1.json",
          }
          if not required.issubset(set(changed)):
              raise SystemExit(f"reconciliation commit is missing required authorization paths: {changed}")
          PY
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(Path("preservation/zenodo-state.json").read_text(encoding="utf-8"))
          published = state.get("publication_status") == "published" and bool(state.get("latest_doi"))
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"already_published={'true' if published else 'false'}\n")
          print("repository preservation DOI already published" if published else "publication reconciliation required")
          PY

      - name: Record publication toolchain provenance
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "toolchain-provenance" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/publication-toolchain-provenance.json"
          cat "$RUNNER_TEMP/publication-toolchain-provenance.json"

      - name: Build GitHub-independent repository capsule from authorized production tree
        if: steps.precheck.outputs.already_published != 'true'
        id: build
        run: |
          set -euo pipefail
          echo "build-capsule" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "$TARGET_COMMIT" \
            --output-dir "$RUNNER_TEMP/repository-preservation-capsule"

      - name: Simulate GitHub-zero one-command restore
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "local-cold-restore" > "$RUNNER_TEMP/publication-stage.txt"
          capsule="$RUNNER_TEMP/repository-preservation-capsule"
          bootstrap="$RUNNER_TEMP/standalone-bootstrap"
          mkdir -p "$bootstrap"
          cp "$capsule/restore-trinity-accord.py" "$bootstrap/restore-trinity-accord.py"
          cd "$bootstrap"
          python3 restore-trinity-accord.py \
            --deposit-dir "$capsule" \
            --output-dir "$RUNNER_TEMP/restored-trinity-accord"
          test "$(git -C "$RUNNER_TEMP/restored-trinity-accord/repository" rev-parse HEAD)" = \
            "${{ steps.build.outputs.recovery_commit_sha }}"
          test "$(git -C "$RUNNER_TEMP/restored-trinity-accord/repository" rev-parse 'HEAD^{tree}')" = \
            "${{ steps.build.outputs.git_tree_oid }}"
          python3 "$RUNNER_TEMP/restored-trinity-accord/repository/scripts/audit_recovery_readiness.py"

      - name: Reverify before irreversible publication reconciliation
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "pre-publication-reverify" > "$RUNNER_TEMP/publication-stage.txt"
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from preservation_capsule import verify_local_package
          result = verify_local_package(Path("${{ runner.temp }}/repository-preservation-capsule"))
          print(result["capsule_id"], result["package_identity_sha256"])
          PY

      - name: Publish or reconcile the authorized Zenodo version
        if: steps.precheck.outputs.already_published != 'true'
        id: publish
        run: |
          set -euo pipefail
          echo "zenodo-publish-or-reconcile" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/publish_preservation_capsule_to_zenodo.py \
            --capsule-dir "$RUNNER_TEMP/repository-preservation-capsule" \
            --api-base "$ZENODO_API_BASE" \
            --rights-boundary-ack "$PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK"

      - name: Prove public DOI-only recovery from a fresh directory
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "public-doi-cold-restore" > "$RUNNER_TEMP/publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/public-bootstrap"
          cp "$RUNNER_TEMP/repository-preservation-capsule/restore-trinity-accord.py" \
            "$RUNNER_TEMP/public-bootstrap/restore-trinity-accord.py"
          cd "$RUNNER_TEMP/public-bootstrap"
          python3 restore-trinity-accord.py \
            --zenodo-record-id "${{ steps.publish.outputs.record_id }}" \
            --output-dir "$RUNNER_TEMP/public-doi-restore"
          test -f "$RUNNER_TEMP/public-doi-restore/recovery-report.json"

      - name: Commit verified DOI state
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "commit-verified-doi-state" > "$RUNNER_TEMP/publication-stage.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/zenodo-state.json
          if git diff --cached --quiet; then
            echo "::error::Zenodo publication did not produce a repository state update."
            exit 1
          fi
          git commit -m "archive: record first repository preservation DOI"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            git add preservation/zenodo-state.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Zenodo published but verified DOI state could not be pushed."
          exit 1

      - name: Record a visible reconciliation failure
        if: failure()
        run: |
          set -euo pipefail
          stage="unknown"
          if test -f "$RUNNER_TEMP/publication-stage.txt"; then
            stage="$(cat "$RUNNER_TEMP/publication-stage.txt")"
          fi
          if ! git diff --cached --quiet -- preservation/zenodo-state.json; then
            git restore --staged preservation/zenodo-state.json
          fi
          if ! git diff --quiet -- preservation/zenodo-state.json; then
            git restore preservation/zenodo-state.json
          fi
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          stage_path = Path(os.environ["RUNNER_TEMP"]) / "publication-stage.txt"
          stage = stage_path.read_text(encoding="utf-8").strip() if stage_path.exists() else "unknown"
          value = {
              "schema": "trinityaccord.repository-preservation-publication-attempt.v1",
              "status": "failed",
              "stage": stage,
              "target_commit": os.environ["TARGET_COMMIT"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "trigger_commit": os.environ["GITHUB_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
              "failed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "publication_status_after_failure": "not_verified",
          }
          Path("preservation/publication-attempt-status.json").write_text(
              json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/publication-attempt-status.json
          git commit -m "archive: record repository DOI publication failure"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload capsule and recovery evidence
        if: always() && steps.precheck.outputs.already_published != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-repository-preservation-doi-reconciliation-evidence
          path: |
            ${{ runner.temp }}/repository-preservation-capsule/
            ${{ runner.temp }}/restored-trinity-accord/recovery-report.json
            ${{ runner.temp }}/public-doi-restore/recovery-report.json
            ${{ runner.temp }}/publication-toolchain-provenance.json
          retention-days: 365
          if-no-files-found: warn
