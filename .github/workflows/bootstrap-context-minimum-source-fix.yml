name: Bootstrap Context Minimum Source Fix

on:
  push:
    branches:
      - agent/fix-context-minimum-source-of-truth

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/fix-context-minimum-source-of-truth
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Correct context minimums and bind tests to Gateway source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('scripts/generate_record_chain_status.py')
          text = generator.read_text(encoding='utf-8')
          replacements = {
              '"propagation": {"authorship_proof_required": True, "minimum_context_level": "CC-0", "oath_extensions": []}':
                  '"propagation": {"authorship_proof_required": True, "minimum_context_level": "CC-2", "oath_extensions": []}',
              '"classification_update": {"authorship_proof_required": True, "minimum_context_level": "CC-1", "oath_extensions": []}':
                  '"classification_update": {"authorship_proof_required": True, "minimum_context_level": "CC-2", "oath_extensions": []}',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'generator expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          generator.write_text(text, encoding='utf-8')

          validation = Path('apps/record_chain_intake_gateway/gateway/validation.py')
          text = validation.read_text(encoding='utf-8')
          old = "Use 'CC-3' for Echo and Guardian Application, or 'CC-2'/'CC-3' for Verification depending on level."
          new = "Use the record-type minimum from the current public contract; Verification requires CC-3 for every accepted V0-V5 compatibility level."
          if text.count(old) != 1:
              raise SystemExit(f'validation expected exactly one stale suggestion, found {text.count(old)}')
          validation.write_text(text.replace(old, new), encoding='utf-8')
          PY

          cat > scripts/test_record_chain_status_public_contract.py <<'PY'
          #!/usr/bin/env python3
          """Fail closed on stale or contradictory public Record-Chain status contracts."""
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path
          from typing import Any

          ROOT = Path(__file__).resolve().parents[1]

          def load(rel: str) -> dict[str, Any]:
              return json.loads((ROOT / rel).read_text(encoding='utf-8'))

          def gateway_context_minimums() -> dict[str, str]:
              source = (ROOT / 'apps/record_chain_intake_gateway/gateway/validation.py').read_text(encoding='utf-8')
              tree = ast.parse(source)
              rules: dict[str, list[tuple[tuple[int, int | None], int]]] | None = None
              for node in tree.body:
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == '_CC_RULES':
                      rules = ast.literal_eval(node.value)
                      break
                  if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '_CC_RULES' for target in node.targets):
                      rules = ast.literal_eval(node.value)
                      break
              if not isinstance(rules, dict):
                  raise SystemExit('FAIL: Gateway _CC_RULES source of truth was not found')
              result: dict[str, str] = {}
              for record_type, entries in rules.items():
                  minimums = {int(entry[1]) for entry in entries}
                  if len(minimums) != 1:
                      raise SystemExit(f'FAIL: {record_type} has version-dependent minima not representable by one status value: {sorted(minimums)}')
                  result[str(record_type)] = f'CC-{minimums.pop()}'
              return result

          def find_context_maps(value: Any) -> list[dict[str, Any]]:
              matches: list[dict[str, Any]] = []
              if isinstance(value, dict):
                  if 'verification_V0_to_V2' in value and 'verification_V3_to_V5' in value:
                      matches.append(value)
                  for child in value.values():
                      matches.extend(find_context_maps(child))
              elif isinstance(value, list):
                  for child in value:
                      matches.extend(find_context_maps(child))
              return matches

          failures: list[str] = []
          status = load('api/record-chain-status.json')
          tip = load('record-chain/chain-tip.json')
          gateway = load('api/record-chain-intake-gateway.v1.json')
          home = load('api/public-home-status.json')

          rc = status.get('record_chain', {})
          expected_head = {
              'latest_record_id': tip.get('latest_record_id'),
              'latest_record_index': tip.get('latest_record_index'),
              'latest_record_sha256': tip.get('latest_record_sha256'),
              'native_record_count': tip.get('native_record_count'),
          }
          for key, expected in expected_head.items():
              if rc.get(key) != expected:
                  failures.append(f'record-chain-status record_chain.{key}={rc.get(key)!r}, expected {expected!r}')
          if status.get('total_records') != tip.get('native_record_count'):
              failures.append('record-chain-status total_records does not match chain-tip')
          pipeline_head = status.get('pipeline_status', {}).get('chain_head', {})
          for key in ('latest_record_id', 'latest_record_sha256', 'native_record_count'):
              if pipeline_head.get(key) != expected_head.get(key):
                  failures.append(f'pipeline_status.chain_head.{key} is stale')

          public_phase = status.get('public_phase', {})
          for key, expected in {
              'status': 'production_live',
              'test_phase_submissions_may_be_excluded_from_final_public_indexes': False,
              'test_phase_submissions_may_be_reclassified': False,
              'test_phase_submissions_may_move_to_historical_test_archive': False,
              'canonical_for_public_index': True,
          }.items():
              if public_phase.get(key) != expected:
                  failures.append(f'record-chain-status public_phase.{key}={public_phase.get(key)!r}, expected {expected!r}')

          submission_phase = status.get('public_submission_phase', {})
          for key, expected in {
              'status': 'production_live',
              'test_phase_records_may_be_reclassified': False,
              'test_phase_submissions_may_move_to_historical_test_archive': False,
              'counted_in_final_public_indexes': True,
          }.items():
              if submission_phase.get(key) != expected:
                  failures.append(f'record-chain-status public_submission_phase.{key}={submission_phase.get(key)!r}, expected {expected!r}')

          gateway_phase = gateway.get('public_phase', {})
          if gateway_phase.get('status') != 'production_live':
              failures.append('gateway public_phase.status must be production_live')
          for key in (
              'test_phase_submissions_may_be_excluded_from_final_public_indexes',
              'test_phase_submissions_may_be_reclassified',
              'test_phase_submissions_may_move_to_historical_test_archive',
          ):
              if gateway_phase.get(key) is not False:
                  failures.append(f'gateway public_phase.{key} must be false')

          home_status = home.get('current_record_chain_status', {})
          if home_status.get('phase') != 'production_live':
              failures.append('public-home current_record_chain_status.phase must be production_live')
          if home_status.get('latest_record_id') != tip.get('latest_record_id'):
              failures.append('public-home latest_record_id does not match chain-tip')
          if home_status.get('current_chain_length') != tip.get('native_record_count'):
              failures.append('public-home current_chain_length does not match chain-tip')
          if home_status.get('receipt_boundary', {}).get('test_phase_records_may_be_reclassified') is not False:
              failures.append('public-home receipt boundary must forbid test-phase reclassification')

          expected_minimums = gateway_context_minimums()
          expected_types = {
              'echo', 'verification', 'guardian_application', 'guardian_retirement',
              'propagation', 'correction', 'classification_update', 'context_insufficient_notice',
          }
          if set(expected_minimums) != expected_types:
              failures.append(f'Gateway context rule types={sorted(expected_minimums)}, expected {sorted(expected_types)}')

          requirements = status.get('record_type_requirements', {})
          for record_type, expected in expected_minimums.items():
              actual = requirements.get(record_type, {}).get('minimum_context_level')
              if actual != expected:
                  failures.append(f'record_type_requirements.{record_type}.minimum_context_level={actual!r}, Gateway requires {expected!r}')

          markdown = (ROOT / 'agent-start.md').read_text(encoding='utf-8')
          human_labels = {
              'echo': 'Echo',
              'guardian_application': 'Guardian Application',
              'guardian_retirement': 'Guardian Retirement',
              'propagation': 'Propagation',
              'correction': 'Correction',
              'classification_update': 'Classification Update',
              'context_insufficient_notice': 'Context-Insufficient Notice',
          }
          for record_type, label in human_labels.items():
              row = f'| {label} | `{expected_minimums[record_type]}` |'
              if row not in markdown:
                  failures.append(f'agent-start.md missing Gateway-aligned row: {row}')
          for label in ('Verification `V0`–`V2`', 'Verification `V3`–`V5`'):
              row = f'| {label} | `{expected_minimums["verification"]}` |'
              if row not in markdown:
                  failures.append(f'agent-start.md missing Gateway-aligned row: {row}')

          machine_paths = [
              '.well-known/trinity-accord.json',
              'api/agent-first-contact.json',
              'api/agent-required-reading.json',
              'api/agent-start.v2.json',
              'api/external-agent-quickstart.json',
              'downloads/record-chain-agent-field-guidance.v1.json',
          ]
          machine_keys = {
              'echo': 'echo',
              'guardian_application': 'guardian_application',
              'guardian_retirement': 'guardian_retirement',
              'propagation': 'propagation',
              'correction': 'correction',
              'classification_update': 'classification_update',
              'context_insufficient_notice': 'context_insufficient_notice',
          }
          for rel in machine_paths:
              maps = find_context_maps(load(rel))
              if not maps:
                  failures.append(f'{rel}: no current context minimum map found')
                  continue
              for index, minimum_map in enumerate(maps, start=1):
                  for record_type, key in machine_keys.items():
                      if minimum_map.get(key) != expected_minimums[record_type]:
                          failures.append(f'{rel} map {index}: {key}={minimum_map.get(key)!r}, Gateway requires {expected_minimums[record_type]!r}')
                  for key in ('verification_V0_to_V2', 'verification_V3_to_V5'):
                      if minimum_map.get(key) != expected_minimums['verification']:
                          failures.append(f'{rel} map {index}: {key}={minimum_map.get(key)!r}, Gateway requires {expected_minimums["verification"]!r}')

          if "'CC-2'/'CC-3' for Verification depending on level" in (ROOT / 'apps/record_chain_intake_gateway/gateway/validation.py').read_text(encoding='utf-8'):
              failures.append('Gateway validation diagnostic still advertises rejected CC-2 Verification')

          if failures:
              raise SystemExit('\n'.join(f'FAIL: {failure}' for failure in failures))
          print(f"PASS: public status is current through {tip.get('latest_record_id')} and all context minimums match Gateway source")
          PY
          chmod +x scripts/test_record_chain_status_public_contract.py

          python3 scripts/generate_record_chain_status.py
          python3 scripts/generate_record_chain_status.py --check
          python3 scripts/test_public_verification_context_contract.py
          python3 scripts/test_record_chain_status_public_contract.py
      - name: Commit exact source-of-truth repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate_record_chain_status.py \
            scripts/test_record_chain_status_public_contract.py \
            apps/record_chain_intake_gateway/gateway/validation.py \
            api/record-chain-status.json
          git commit -m "fix: derive context contract checks from Gateway rules"
          git push origin HEAD:agent/fix-context-minimum-source-of-truth
