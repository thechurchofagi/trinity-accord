name: Repository Preservation Refresh Executor

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/repository-preservation-refresh-executor.yml
      - preservation/repository-preservation-execution-v1.json

permissions:
  contents: read

jobs:
  execute-authorized-refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'thechurchofagi' &&
      github.event.pull_request.head.ref == 'agent/execute-repository-preservation-refresh-20260802' &&
      github.event.pull_request.title == 'archive: execute repository preservation refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK: TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED
    steps:
      - name: Checkout protected main with full source history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record publication toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/executor-toolchain-provenance.json"
          cat "$RUNNER_TEMP/executor-toolchain-provenance.json"

      - name: Execute exact-source repository preservation refresh
        run: bash scripts/run_repository_preservation_refresh_ci.sh

      - name: Upload complete refresh proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-preservation-refresh-proof-executor
          path: |
            ${{ runner.temp }}/local-restored-repository/recovery-report.json
            ${{ runner.temp }}/public-restored-repository/recovery-report.json
            ${{ runner.temp }}/public-metadata-report.json
            ${{ runner.temp }}/toolchain-provenance.json
            ${{ runner.temp }}/executor-toolchain-provenance.json
          retention-days: 365
          if-no-files-found: warn
