name: Capture Bitcoin inscription proof annex v2

on:
  pull_request:
    paths:
      - .github/workflows/capture-bitcoin-inscription-proof-annex-v2.yml
      - .github/workflows/sync-bitcoin-address-inscriptions.yml
      - evidence/bitcoin-inscription-proof-annex-v2/README.md
      - evidence/bitcoin-inscription-proof-annex-v2/verification/capture_proofs.py
      - evidence/bitcoin-inscription-proof-annex-v2/verification/verify_annex.py
      - bitcoin-inscription-mirrors/address-wide/classification.json
      - tests/test_bitcoin_inscription_proof_annex_v2_contract.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-bitcoin-inscription-proof-annex-v2.yml
      - .github/workflows/sync-bitcoin-address-inscriptions.yml
      - evidence/bitcoin-inscription-proof-annex-v2/README.md
      - evidence/bitcoin-inscription-proof-annex-v2/verification/capture_proofs.py
      - evidence/bitcoin-inscription-proof-annex-v2/verification/verify_annex.py
      - bitcoin-inscription-mirrors/address-wide/classification.json
      - tests/test_bitcoin_inscription_proof_annex_v2_contract.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitcoin-inscription-proof-annex-v2-${{ github.event_name }}
  cancel-in-progress: false

env:
  PROOF_BRANCH: automation/bitcoin-inscription-proof-annex-v2
  ANNEX_DIR: evidence/bitcoin-inscription-proof-annex-v2

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Compile proof programs
        run: >-
          python3 -m py_compile
          evidence/bitcoin-inscription-proof-annex-v2/verification/capture_proofs.py
          evidence/bitcoin-inscription-proof-annex-v2/verification/verify_annex.py

      - name: Verify v2 preparation contract
        run: python3 -m pytest -q tests/test_bitcoin_inscription_proof_annex_v2_contract.py

  capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout current main with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Compile proof programs
        run: >-
          python3 -m py_compile
          evidence/bitcoin-inscription-proof-annex-v2/verification/capture_proofs.py
          evidence/bitcoin-inscription-proof-annex-v2/verification/verify_annex.py

      - name: Capture four missing proofs and re-bind legacy eight
        run: python3 evidence/bitcoin-inscription-proof-annex-v2/verification/capture_proofs.py

      - name: Run network-free 12-item verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANNEX_DIR/reports"
          python3 "$ANNEX_DIR/verification/verify_annex.py" > "$ANNEX_DIR/reports/OFFLINE-VERIFICATION.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("evidence/bitcoin-inscription-proof-annex-v2/reports/OFFLINE-VERIFICATION.json").read_text())
          if report.get("result") != "PASS":
              raise SystemExit("12-item offline Bitcoin verification did not PASS")
          if report["L1_INSCRIPTION_CONTENT_METADATA_AND_TAPROOT_BINDING"].get("inscriptions") != 12:
              raise SystemExit("L1 does not cover all 12 inscriptions")
          if report["L2_BLOCK_AND_WITNESS_INCLUSION"].get("reveal_transactions") != 12:
              raise SystemExit("L2 does not cover all 12 inscriptions")
          if report["L3_CHECKPOINT_RELATIVE_POW_ANCESTRY"].get("anchors") != 12:
              raise SystemExit("L3 does not cover all 12 inscriptions")
          print("Bitcoin inscription proof annex v2: 12/12 L1/L2/L3 PASS")
          PY

      - name: Publish proof snapshot branch and open or update PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$ANNEX_DIR" \
             && [[ -z "$(git ls-files --others --exclude-standard "$ANNEX_DIR")" ]]; then
            echo "Proof annex v2 already matches main; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PROOF_BRANCH"
          git add -- "$ANNEX_DIR"
          git diff --cached --check
          git commit -m "proof: capture 12-item Bitcoin inscription annex v2"

          if git ls-remote --exit-code --heads origin "$PROOF_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PROOF_BRANCH:refs/remotes/origin/$PROOF_BRANCH"
          fi
          git push --force-with-lease origin "HEAD:refs/heads/$PROOF_BRANCH"

          existing="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --head "$PROOF_BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$existing" ]]; then
            echo "Updated existing proof PR #$existing"
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$PROOF_BRANCH" \
            --draft \
            --title "proof: complete 12-item Bitcoin L1/L2/L3 parity" \
            --body "Automated proof capture for the complete 12-item current authority-address snapshot. V2 preserves the immutable eight-item v1 proof checkpoint, adds the four recovered pre-canonical formation records, and verifies exact inscription bodies plus exact Ord tag-5 CBOR metadata bytes (or absence), Taproot/BIP340 binding, BIP141 witness inclusion, and 144-block checkpoint-relative PoW ancestry. The four formation records remain non-canonical; only the three Bitcoin Originals are canonical and no record amends them."
