name: Temporary final scholarly parser review applicator

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/workflows/tmp-close-final-scholarly-review.yml"

permissions:
  contents: write

jobs:
  apply-final-review-fixes:
    if: github.event.pull_request.number == 1071 && github.event.pull_request.head.ref == 'agent/close-final-scholarly-parser-gaps-2026-08-21'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0

      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py

      - name: Apply three final Codex review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/check_deployment_freshness.py')
          tests_path = Path('tests/test_scholarly_parser_edge_cases.py')
          source = source_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              '''        if tag == "script" and self._in_json_ld:\n            self.json_ld_blocks.append("".join(self._json_ld_chunks).strip())\n            self._in_json_ld = False\n            self._json_ld_chunks = []\n        if self._head_text_stack and tag == self._head_text_stack[-1]:\n''',
              '''        if tag == "script" and self._in_json_ld:\n            self.json_ld_blocks.append("".join(self._json_ld_chunks).strip())\n            self._in_json_ld = False\n            self._json_ld_chunks = []\n        if (\n            tag in {"body", "html", "br"}\n            and self._in_head\n            and self._template_depth == 0\n            and not self._head_text_stack\n        ):\n            # In the HTML tree builder's "in head" mode, these special end\n            # tags pop the optional head and are reprocessed after the head.\n            # Metadata that follows is therefore body-effective, not head meta.\n            self._in_head = False\n            self._body_started = True\n        if self._head_text_stack and tag == self._head_text_stack[-1]:\n''',
              'special end-tag head transition',
          )

          source = replace_once(
              source,
              '''    stripped = value.strip()\n    normalized = stripped.rstrip("/")\n    if normalized in SCHEMA_ORG_ARTICLE_IRIS:\n        return True\n''',
              '''    stripped = value.strip()\n    if stripped in SCHEMA_ORG_ARTICLE_IRIS:\n        return True\n''',
              'exact explicit article IRI matching',
          )

          source = replace_once(
              source,
              '''        # The canonical Schema.org remote context defines its own terms. For an\n        # unknown remote context, fail closed instead of preserving a stale term.\n        return (is_schema, True if is_schema else False)\n''',
              '''        # A canonical Schema.org remote context establishes the active\n        # vocabulary, not a permanent explicit ScholarlyArticle term override.\n        # This allows a later @vocab in a context list to replace that vocabulary.\n        # Unknown remote contexts still fail closed.\n        return (is_schema, None if is_schema else False)\n''',
              'remote schema context vocabulary state',
          )

          test_block = '''\n\ndef test_special_end_tags_implicitly_end_head() -> None:\n    for tag in ("html", "br"):\n        parser = deployment.ScholarlyHTMLParser()\n        parser.feed(\n            "<!doctype html><html><head>"\n            f"</{tag}>"\n            '<meta name="citation_title" content="body-effective">'\n        )\n        parser.close()\n\n        assert "citation_title" not in parser.meta\n        assert parser._body_started is True\n        assert parser._in_head is False\n\n\ndef test_explicit_schema_article_iri_with_trailing_slash_is_rejected() -> None:\n    page = _landing(\n        {\n            "@context": {\n                "@vocab": "https://example.invalid/",\n                "ScholarlyArticle": "https://schema.org/ScholarlyArticle/",\n            },\n            "@graph": [_valid_article()],\n        }\n    )\n    errors: list[str] = []\n    deployment.check_scholarly_landing(page, errors)\n\n    assert any(\n        "lacks an applicable Schema.org JSON-LD context" in error for error in errors\n    )\n\n\ndef test_later_vocab_overrides_remote_schema_context() -> None:\n    page = _landing(\n        {\n            "@context": [\n                "https://schema.org",\n                {"@vocab": "https://example.invalid/"},\n            ],\n            "@graph": [_valid_article()],\n        }\n    )\n    errors: list[str] = []\n    deployment.check_scholarly_landing(page, errors)\n\n    assert any(\n        "lacks an applicable Schema.org JSON-LD context" in error for error in errors\n    )\n'''
          if 'def test_special_end_tags_implicitly_end_head' in tests:
              raise SystemExit('final review regressions already present unexpectedly')
          tests = tests.rstrip() + test_block.rstrip() + '\n'

          source_path.write_text(source, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python3 -m py_compile scripts/check_deployment_freshness.py
          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path('tests/test_scholarly_parser_edge_cases.py')
          focused = sorted(
              (name, fn) for name, fn in namespace.items()
              if name.startswith('test_') and callable(fn)
          )
          assert len(focused) == 20, f'expected 20 focused tests, got {len(focused)}'
          for name, fn in focused:
              fn()
              print(f'PASS {name}')
          PY
          git diff --check
          git diff -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py

      - name: Commit final review fixes and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/tmp-close-final-scholarly-review.yml
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git commit -m "fix: close final scholarly review findings"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
