name: Prepare SCU paper exact Zenodo package
on:
  push:
    branches: [research/scu-source-use-v101-20261010]
    paths:
      - research/matched-behavior-source-use/**
      - .github/workflows/prepare-scu-source-use-v101.yml
permissions:
  contents: write
concurrency:
  group: scu-source-use-v101-zenodo-v1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[scu-prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/scu-source-use-v101-20261010
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install exact-package PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc texlive-xetex fonts-lmodern fonts-dejavu-core poppler-utils
      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"
      - name: Run focused offline gate tests
        run: python3 research/matched-behavior-source-use/test_publication.py
      - name: Reserve once and prepare same-record package
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/matched-behavior-source-use/publication.py prepare
      - name: Preserve state even after an incomplete attempt
        if: always()
        run: python3 research/matched-behavior-source-use/publication.py persist
      - name: Retain exact preparation files and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scu-source-use-v101-preparation-${{ github.run_id }}
          path: research/matched-behavior-source-use/
          retention-days: 30
