name: One-time Phase5C Guardian CC3 Fixture

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/context-readiness-contract-convergence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Apply bounded fixture update
        run: python3 scripts/one_time_phase5c_guardian_cc3_fixture.py
      - name: Verify Phase 5C suite
        run: python3 scripts/test_phase_5c_hotfix.py
      - name: Remove one-time tooling and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-phase5c-guardian-cc3-fixture.yml
          git rm scripts/one_time_phase5c_guardian_cc3_fixture.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: align Phase 5C Guardian fixture with CC-3'
          git push origin HEAD:${{ github.head_ref }}
