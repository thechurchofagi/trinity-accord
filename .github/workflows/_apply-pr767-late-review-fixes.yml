name: Apply PR 767 Late Review Fixes

on:
  push:
    branches:
      - fix/pr767-late-review-20260728
    paths:
      - ".github/workflows/_apply-pr767-late-review-fixes.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/_apply-pr767-late-review-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: fix/pr767-late-review-20260728
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Repair literal escaping in temporary patcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/_apply_pr767_late_review_fixes.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "        '''function buildSubmissionOathVerification(recordType, canonicalOath, readbackText) {{\n",
              "        r'''function buildSubmissionOathVerification(recordType, canonicalOath, readbackText) {{\n",
              2,
          )
          text = text.replace(
              "        '''function buildClientOathReadback(recordType, participantReadback) {{\n",
              "        r'''function buildClientOathReadback(recordType, participantReadback) {{\n",
              2,
          )
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile scripts/_apply_pr767_late_review_fixes.py

      - name: Apply deterministic fixes
        run: |
          set -o pipefail
          python3 scripts/_apply_pr767_late_review_fixes.py 2>&1 | tee /tmp/pr767-patch.log

      - name: Correct predecessor regression fixture sequencing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/test_contextual_oath_review_regressions.py")
          text = path.read_text(encoding="utf-8")
          mutation = '    downgraded_oath["oath_policy_version"] = "not-a-version"\n'
          position = text.index(mutation)
          snapshot = "    gateway_admitted_predecessor = copy.deepcopy(downgraded)\n\n"
          text = text[:position] + snapshot + text[position:]
          activation_start = text.index(
              "    activation = chain._guardian_activation_assessment(",
              position + len(snapshot),
          )
          activation_end = text.index(
              "\n\n    current = copy.deepcopy(downgraded)",
              activation_start,
          )
          activation = text[activation_start:activation_end].replace(
              "downgraded",
              "gateway_admitted_predecessor",
          )
          text = text[:activation_start] + activation + text[activation_end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Preserve audited Pages paths with an all-files trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages_path = Path(".github/workflows/deploy-pages.yml")
          pages = pages_path.read_text(encoding="utf-8")
          bare = "\n".join([
              "  push:",
              "    branches:",
              "      - main",
              "permissions:",
              "",
          ])
          path_entries = [
              "**",
              "api/**",
              "apps/record_chain_intake_gateway/**",
              "*.md",
              "*.json",
              "*.xml",
              "llms.txt",
              "llms-full.txt",
              "ai.txt",
              "CNAME",
              ".well-known/**",
              "_layouts/**",
              "_includes/**",
              "assets/**",
              "agent-record-chain-guidance/**",
              "bitcoin-inscription-mirrors/**",
              "builder-bundles/**",
              "context-ready/**",
              "docs/**",
              "downloads/**",
              "echoes/**",
              "evidence/**",
              "first-contact/**",
              "gateway-workflows/**",
              "identity/**",
              "nft-text-descriptions/**",
              "propagate/**",
              "record-chain-field-helper/**",
              "record-chain/index.md",
              "sitemap.xml",
              "scripts/**",
              "render.yaml",
              "tests/test_live_deployment_contract.py",
              "tests/test_round5_systemic_resilience.py",
              "_config.yml",
              ".github/workflows/deploy-pages.yml",
              ".github/workflows/render-manual-deploy.yml",
              ".github/workflows/homepage-status-sync.yml",
              ".github/workflows/waiting-heartbeat-status-sync.yml",
              ".github/workflows/homepage-deployment-receipt.yml",
          ]
          expanded_lines = [
              "  push:",
              "    branches:",
              "      - main",
              "    paths:",
              *[f'      - "{entry}"' for entry in path_entries],
              "permissions:",
              "",
          ]
          expanded = "\n".join(expanded_lines)
          if pages.count(bare) != 1:
              raise SystemExit("unexpected post-patch Pages trigger shape")
          pages_path.write_text(pages.replace(bare, expanded, 1), encoding="utf-8")

          test_path = Path("scripts/test_contextual_oath_review_regressions.py")
          test = test_path.read_text(encoding="utf-8")
          old = (
              "    require(\n"
              "        \"paths:\" not in push_block,\n"
              "        \"every main successor must trigger Pages so a stale-source abort cannot strand Gateway ahead\",\n"
              "    )\n"
          )
          new = (
              "    require(\n"
              "        '      - \"**\"' in push_block,\n"
              "        \"every main successor must trigger Pages so a stale-source abort cannot strand Gateway ahead\",\n"
              "    )\n"
          )
          if test.count(old) != 1:
              raise SystemExit("unexpected Pages regression assertion shape")
          test_path.write_text(test.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Persist patch failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          if test -f /tmp/pr767-patch.log; then
            cp /tmp/pr767-patch.log scripts/_apply_pr767_late_review_failure.log
            git config user.name "Trinity Agent"
            git config user.email "agent@trinityaccord.org"
            git add scripts/_apply_pr767_late_review_failure.log
            git commit -m "chore: capture late review patch failure" || true
            git push origin HEAD:fix/pr767-late-review-20260728
          fi

      - name: Install test dependencies
        if: success()
        env:
          PIP_PREFER_BINARY: "1"
          PIP_ONLY_BINARY: "cryptography,cffi"
        run: python3 -m pip install -r requirements-ci.txt

      - name: Run focused regressions
        if: success()
        run: |
          set -o pipefail
          {
            python3 scripts/test_contextual_oath_review_regressions.py
            python3 scripts/test_deploy_pages_workflow_contract.py
            python3 scripts/test_record_chain_intake_gateway_contract.py
            python3 scripts/test_deep_intake_append_transaction_invariants.py
            python3 scripts/trinity_record_chain.py verify
          } 2>&1 | tee /tmp/pr767-tests.log

      - name: Persist test failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          if test -f /tmp/pr767-tests.log; then
            cp /tmp/pr767-tests.log scripts/_apply_pr767_late_review_test_failure.log
            git config user.name "Trinity Agent"
            git config user.email "agent@trinityaccord.org"
            git add scripts/_apply_pr767_late_review_test_failure.log
            git commit -m "chore: capture late review test failure" || true
            git push origin HEAD:fix/pr767-late-review-20260728
          fi

      - name: Remove temporary patch machinery
        if: success()
        run: |
          rm scripts/_apply_pr767_late_review_fixes.py
          rm .github/workflows/_apply-pr767-late-review-fixes.yml
          rm -f scripts/_apply_pr767_late_review_failure.log
          rm -f scripts/_apply_pr767_late_review_test_failure.log

      - name: Commit and push verified fixes
        if: success()
        run: |
          set -euo pipefail
          git config user.name "Trinity Agent"
          git config user.email "agent@trinityaccord.org"
          git add -A
          git diff --cached --check
          git commit -m "fix: close late PR 767 review findings"
          git push origin HEAD:fix/pr767-late-review-20260728
