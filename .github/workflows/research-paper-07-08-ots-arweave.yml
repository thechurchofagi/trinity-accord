name: Research Papers 07 and 08 OTS and Arweave

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/research-paper-07-08-ots-arweave.yml
      - scripts/research_paper_ots.py
      - scripts/research_arweave_allowance.mjs
      - tests/test_research_arweave_allowance.py
      - tests/test_research_paper_ots.py
      - research/paper-timestamps/2026-09-19/targets.json
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Authorize write workflow actor
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          GUARDIAN_REGISTRY_WORKFLOW_ACTORS: ${{ vars.GUARDIAN_REGISTRY_WORKFLOW_ACTORS }}
        run: |
          set -euo pipefail
          ALLOWLIST="${GUARDIAN_REGISTRY_WORKFLOW_ACTORS:-thechurchofagi}"
          if [ "$ACTOR" = 'github-actions[bot]' ]; then exit 0; fi
          case ",$ALLOWLIST," in
            *",$ACTOR,"*) echo "Authorized actor: $ACTOR" ;;
            *) echo "Unauthorized actor: $ACTOR" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
          show-progress: false

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Check exact follow-up batch completion
        id: batch
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('research/paper-timestamps/2026-09-19')
          targets=json.loads((root/'targets.json').read_text())
          if targets.get('paper_count') != 2 or [x.get('report') for x in targets.get('papers',[])] != ['TA-TR-2026-07','TA-TR-2026-08']:
              raise RuntimeError('Follow-up target identity changed')
          status=root/'status.json'
          done=status.exists() and json.loads(status.read_text()).get('state')=='ARWEAVE_READBACK_PASS'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'done={str(done).lower()}\n')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.batch.outputs.done != 'true'
        with:
          python-version: '3.11'

      - name: Install the pinned OTS client and validate follow-up identity
        if: steps.batch.outputs.done != 'true'
        run: |
          python3 -m pip install -r requirements-ots.txt
          python3 -m unittest tests.test_research_paper_ots tests.test_research_arweave_allowance -v

      - name: Upgrade and verify the four exact PDF proofs
        if: steps.batch.outputs.done != 'true'
        id: ots
        continue-on-error: true
        env:
          OTS_BITCOIN_NODE_URL: http://127.0.0.1:18443/
        run: |
          set -euo pipefail
          python3 scripts/bitcoin_esplora_rpc_proxy.py --host 127.0.0.1 --port 18443 \
            --trace "$RUNNER_TEMP/paper-07-08-ots-proxy.jsonl" --timeout 20 > "$RUNNER_TEMP/paper-07-08-ots-proxy.log" 2>&1 &
          proxy_pid=$!
          cleanup_proxy() {
            if kill -0 "$proxy_pid" 2>/dev/null; then kill "$proxy_pid"; fi
          }
          trap cleanup_proxy EXIT
          python3 scripts/research_paper_ots.py lifecycle --batch research/paper-timestamps/2026-09-19

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.ots.outputs.ready == 'true'
        with:
          node-version-file: .node-version

      - name: Install existing Arweave dependencies
        if: steps.ots.outputs.ready == 'true'
        run: npm ci

      - name: Check daily allowance for budget
        if: steps.ots.outputs.ready == 'true'
        id: budget
        run: node scripts/research_arweave_allowance.mjs research/paper-timestamps/2026-09-19

      - name: Upload one guarded follow-up archive and verify public readback
        if: steps.ots.outputs.ready == 'true' && steps.budget.outputs.allowed == 'true'
        id: upload
        continue-on-error: true
        env:
          ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
          NODE_OPTIONS: --import=./scripts/arweave_runtime_spend_guard.mjs
          ARWEAVE_MINIMUM_REMAINING_AR: '0.25'
          ARWEAVE_MAX_PAYLOAD_BYTES: '4194304'
          ARWEAVE_MAX_TRANSACTION_REWARD_AR: '0.055'
          ARWEAVE_ROLLING_30_DAY_SPEND_LIMIT_AR: '0.50'
          ARWEAVE_READBACK_MAX_SECONDS: '420'
          ARWEAVE_HTTP_TIMEOUT_MS: '30000'
        run: python3 scripts/research_paper_ots.py upload --batch research/paper-timestamps/2026-09-19

      - name: Preserve exact proofs and remote-operation receipts
        if: always() && steps.batch.outputs.done != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-paper-07-08-ots-${{ github.run_id }}
          path: |
            research/paper-timestamps/2026-09-19/
            ${{ runner.temp }}/paper-07-08-ots-proxy.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Commit durable follow-up state without touching the first batch
        if: always() && steps.batch.outputs.done != 'true'
        run: |
          set -euo pipefail
          git config user.name 'trinity-ots-bot'
          git config user.email 'actions@github.com'
          git add research/paper-timestamps/2026-09-19/ record-chain/arweave-wallet-ledger.json api/arweave-wallet-status.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve papers 07 and 08 OTS and Arweave state'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main --prune
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo 'Recover the retained artifact before repeating an uncertain paid upload.' >&2
          exit 1

      - name: Report only follow-up batch failures
        if: always()
        env:
          OTS_OUTCOME: ${{ steps.ots.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python3 - <<'PY'
          import os
          failed=[name for name in ('OTS_OUTCOME','UPLOAD_OUTCOME') if os.environ.get(name)=='failure']
          if failed: raise SystemExit('Follow-up preservation remains incomplete: '+', '.join(failed))
          print('Follow-up iteration completed; pending proofs will resume on the next schedule.')
          PY
