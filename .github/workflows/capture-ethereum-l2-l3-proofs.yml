name: Capture Ethereum L2 L3 Proofs

on:
  push:
    branches: [agent/ethereum-l2-l3-proofs-v1]
    paths:
      - "evidence/ethereum-evidence-annex-v1/verification/generate_l2_l3_proofs.py"
      - "evidence/ethereum-evidence-annex-v1/verification/make_beacon_execution_proof.mjs"
      - ".github/workflows/capture-ethereum-l2-l3-proofs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install isolated proof-generation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            'trie==3.1.0' 'rlp==4.1.0' 'eth-hash[pycryptodome]==0.7.1'
          mkdir -p /tmp/eth-proof-node
          cd /tmp/eth-proof-node
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            '@lodestar/types@1.44.0' '@chainsafe/persistent-merkle-tree@1.3.0'
          ln -s /tmp/eth-proof-node/node_modules "$GITHUB_WORKSPACE/node_modules"
      - name: Capture and self-verify proof witnesses
        env:
          NODE_OPTIONS: --no-warnings
        run: |
          python3 evidence/ethereum-evidence-annex-v1/verification/generate_l2_l3_proofs.py \
            --manifest evidence/ethereum-evidence-annex-v1/ANNEX-MANIFEST.json \
            --out /tmp/ethereum-l2-l3-proofs \
            --node-helper evidence/ethereum-evidence-annex-v1/verification/make_beacon_execution_proof.mjs \
            --beacon https://ethereum-beacon-api.publicnode.com \
            --beacon https://docs-demo.quiknode.pro
      - name: Preserve exact proof bytes on capture branch
        shell: bash
        run: |
          set -euo pipefail
          proof_dir=evidence/ethereum-evidence-annex-v1/proof-material
          for d in /tmp/ethereum-l2-l3-proofs/0x*; do
            tx=$(basename "$d")
            mkdir -p "$proof_dir/$tx"
            cp "$d/L2-execution-witness.json" "$proof_dir/$tx/L2-execution-witness.json"
            cp "$d/L3-consensus-witness.json" "$proof_dir/$tx/L3-consensus-witness.json"
          done
          cp /tmp/ethereum-l2-l3-proofs/CAPTURE-SUMMARY.json "$proof_dir/L2-L3-CAPTURE-SUMMARY.json"
          test "$(find "$proof_dir" -name 'L2-execution-witness.json' | wc -l)" -eq 10
          test "$(find "$proof_dir" -name 'L3-consensus-witness.json' | wc -l)" -eq 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$proof_dir"
          git diff --cached --check
          git commit -m "evidence: preserve Ethereum L2 L3 proof witnesses"
          git push origin HEAD:agent/ethereum-l2-l3-proofs-v1
      - name: Upload proof capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ethereum-l2-l3-proof-capture
          path: /tmp/ethereum-l2-l3-proofs
          if-no-files-found: warn
          retention-days: 7
