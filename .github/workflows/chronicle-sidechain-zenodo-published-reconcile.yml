name: Chronicle Sidechain Zenodo Published Reconcile

on:
  push:
    branches: [main]
    paths:
      - "scripts/reconcile_chronicle_sidechain_zenodo_published.py"
      - ".github/workflows/chronicle-sidechain-zenodo-published-reconcile.yml"
  workflow_run:
    workflows: ["Chronicle Sidechain Zenodo Cold Recovery"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  reconcile-published-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: trinity/sidechain-zenodo
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: ${{ vars.ZENODO_API_BASE || 'https://zenodo.org/api' }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          provenance_dir="$RUNNER_TEMP/sidechain-zenodo-provenance"
          mkdir -p "$provenance_dir"
          python3 scripts/toolchain_provenance.py | tee "$provenance_dir/TOOLCHAIN-PROVENANCE.json"
          test -s "$provenance_dir/TOOLCHAIN-PROVENANCE.json"
          echo "[TOOLCHAIN PROVENANCE]"
          stat -c '%n bytes=%s' "$provenance_dir/TOOLCHAIN-PROVENANCE.json"
          sha256sum "$provenance_dir/TOOLCHAIN-PROVENANCE.json"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies and validate recovery code
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-ci.txt
          python3 -m py_compile \
            scripts/build_chronicle_sidechain_zenodo_deposit.py \
            scripts/publish_chronicle_sidechain_to_zenodo.py \
            scripts/reconcile_chronicle_sidechain_zenodo_published.py
          echo "[PUBLIC RECONCILE] run_id=$GITHUB_RUN_ID event=$GITHUB_EVENT_NAME sha=$GITHUB_SHA"

      - name: Resolve target status SHA
        id: target
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            target_sha="$(python3 - <<'PY'
          import json,os
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          print(event['workflow_run']['head_sha'])
          PY
          )"
          else
            target_sha="$GITHUB_SHA"
          fi
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "[PUBLIC RECONCILE TARGET] sha=$target_sha"

      - name: Mark published reconciliation pending
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending \
            -f context="$STATUS_CONTEXT" \
            -f description="Reconciling published Zenodo record via public Records API" \
            -f target_url="${run_url}#trinity-zenodo?state=public_reconcile" >/dev/null

      - name: Resolve and download latest immutable sidechain evidence release
        id: source
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sidechain-zenodo-public-source"
          mkdir -p "$root"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft,isPrerelease > "$root/releases.json"
          python3 - <<'PY' > "$root/source.env"
          import json,os,re
          root=os.environ['RUNNER_TEMP']+'/sidechain-zenodo-public-source'
          rows=json.load(open(root+'/releases.json'))
          rows=[r for r in rows if not r.get('isDraft') and not r.get('isPrerelease') and re.fullmatch(r'chronicle-sidechain-evidence-v2-[0-9a-f]{12}',r.get('tagName',''))]
          if not rows: raise SystemExit('no immutable sidechain v2 release found')
          rows.sort(key=lambda r:r.get('createdAt') or '')
          tag=rows[-1]['tagName']; short=tag.rsplit('-',1)[-1]
          print(f'SOURCE_TAG={tag}'); print(f'SOURCE_SHORT={short}')
          PY
          set -a
          . "$root/source.env"
          set +a
          git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "$SOURCE_TAG")"
          test "${SOURCE_SHA:0:12}" = "$SOURCE_SHORT"
          archive="chronicle-sidechain-evidence-v2-${SOURCE_SHORT}.tar.gz"
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root" --pattern "$archive" --pattern "$archive.sha256"
          (cd "$root" && sha256sum -c "$archive.sha256")
          mkdir "$root/extracted"
          tar -xzf "$root/$archive" -C "$root/extracted"
          test -s "$root/extracted/chronicle-sidechain-scan/evidence-v2/OFFLINE-VERIFICATION.json"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_short=$SOURCE_SHORT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "source_root=$root" >> "$GITHUB_OUTPUT"
          echo "[SOURCE VERIFIED] tag=$SOURCE_TAG sha=$SOURCE_SHA archive=$archive"

      - name: Cold-run sidechain offline verifier
        env:
          CHRONICLE_OUT: ${{ steps.source.outputs.source_root }}/extracted/chronicle-sidechain-scan
        run: |
          set -euo pipefail
          python3 scripts/verify-chronicle-sidechain-evidence.py
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['CHRONICLE_OUT'])/'evidence-v2'/'OFFLINE-VERIFICATION.json'
          r=json.loads(p.read_text())
          if r.get('pass') is not True: raise SystemExit('cold recovery offline verification did not pass')
          if r.get('records') != 217 or r.get('l2_records_checked') != 217: raise SystemExit('cold recovery is not 217/217')
          print(f"[COLD RECOVERY PASS] records={r['records']} cars={r.get('car_files_checked')} l2={r['l2_records_checked']}")
          PY

      - name: Rebuild deterministic DOI-ready deposit
        id: package
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_SHORT: ${{ steps.source.outputs.source_short }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
        run: |
          set -euo pipefail
          deposit=".sidechain-zenodo-deposit/${SOURCE_SHORT}"
          python3 scripts/build_chronicle_sidechain_zenodo_deposit.py \
            --archive "$SOURCE_ROOT/$ARCHIVE" \
            --archive-sha256 "$SOURCE_ROOT/$ARCHIVE.sha256" \
            --extracted-root "$SOURCE_ROOT/extracted/chronicle-sidechain-scan" \
            --source-tag "$SOURCE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --output-dir "$deposit" | tee "$RUNNER_TEMP/sidechain-zenodo-public-build.json"
          (cd "$deposit" && sha256sum -c SHA256SUMS)
          echo "deposit_dir=$deposit" >> "$GITHUB_OUTPUT"
          echo "[DOI PACKAGE REBUILT] deposit=$deposit"

      - name: Reconcile published Zenodo record through public Records API
        id: reconcile
        env:
          DEPOSIT_DIR: ${{ steps.package.outputs.deposit_dir }}
        run: |
          set -euo pipefail
          python3 scripts/reconcile_chronicle_sidechain_zenodo_published.py \
            --deposit-dir "$DEPOSIT_DIR" \
            --api-base "$ZENODO_API_BASE"
          test -s archive/chronicle-sidechain-zenodo-state.json
          python3 - <<'PY'
          import json
          r=json.load(open('archive/chronicle-sidechain-zenodo-state.json'))
          if not r.get('doi'): raise SystemExit('reconciled state missing DOI')
          if r.get('remote_full_readback_sha256_verified') is not True: raise SystemExit('public readback not verified')
          if r.get('remote_readback_surface') != 'public_records_api': raise SystemExit('wrong readback surface')
          print(f"[PUBLIC RECONCILE PASS] doi={r['doi']} record_id={r['record_id']} files={r.get('verified_file_count')}")
          PY

      - name: Commit verified DOI state
        id: state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/chronicle-sidechain-zenodo-state.json
          if git diff --cached --quiet; then
            echo "state_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "[DOI STATE] already current"
            exit 0
          fi
          git commit -m "archive: reconcile published sidechain evidence DOI"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "state_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "[DOI STATE PUSH PASS] commit=$(git rev-parse HEAD)"
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo "public Zenodo verification succeeded but DOI state push failed" >&2
          exit 1

      - name: Mark published reconciliation success
        if: success()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          STATE_COMMIT: ${{ steps.state.outputs.state_commit }}
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import json,shlex
          r=json.load(open('archive/chronicle-sidechain-zenodo-state.json'))
          print('DOI='+shlex.quote(str(r['doi'])))
          print('RECORD_ID='+shlex.quote(str(r['record_id'])))
          PY
          )"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=success \
            -f context="$STATUS_CONTEXT" \
            -f description="Sidechain DOI published and public SHA-256 readback verified" \
            -f target_url="${run_url}#trinity-zenodo?state=published&record=${RECORD_ID}&state_commit=${STATE_COMMIT}" >/dev/null
          echo "[ZENODO CLOSED] doi=$DOI record_id=$RECORD_ID state_commit=$STATE_COMMIT source=$SOURCE_TAG"

      - name: Mark published reconciliation failure
        if: failure()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          target_sha="${TARGET_SHA:-$GITHUB_SHA}"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$target_sha" \
            -f state=failure \
            -f context="$STATUS_CONTEXT" \
            -f description="Published Zenodo record reconciliation failed" \
            -f target_url="${run_url}#trinity-zenodo?state=public_reconcile_failure" >/dev/null || true

      - name: Upload reconciliation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronicle-sidechain-zenodo-public-reconcile-${{ github.run_id }}
          path: |
            .sidechain-zenodo-deposit/
            ${{ runner.temp }}/sidechain-zenodo-public-build.json
            ${{ runner.temp }}/sidechain-zenodo-provenance/
            archive/chronicle-sidechain-zenodo-state.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
