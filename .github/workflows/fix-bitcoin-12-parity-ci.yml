name: Fix Bitcoin 12 Parity CI

on:
  push:
    branches: [evidence/finalize-bitcoin-12-parity]
    paths:
      - .github/workflows/fix-bitcoin-12-parity-ci.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: evidence/finalize-bitcoin-12-parity
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CI dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Reconcile generator, digest and migration contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # Canonical final-inventory generator: keep historical v1 validation,
          # then apply the exact same verified v2 projection used by the parity finalizer.
          p = Path('scripts/build_final_evidence_inventory.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import subprocess\nimport sys\n', 'import subprocess\nimport sys\nimport tempfile\n')
          text = text.replace('from typing import Any\n', 'from typing import Any\n\nimport finalize_bitcoin_12_parity as bitcoin12\n')
          text = text.replace(
              '    btc_report = verified_report(\n        "evidence/bitcoin-inscription-proof-annex-v1/reports/OFFLINE-VERIFICATION.json",\n        "evidence/bitcoin-inscription-proof-annex-v1/verification/verify_annex.py",\n    )\n',
              '    btc_report = verified_report(\n        "evidence/bitcoin-inscription-proof-annex-v1/reports/OFFLINE-VERIFICATION.json",\n        "evidence/bitcoin-inscription-proof-annex-v1/verification/verify_annex.py",\n    )\n    btc_v2_manifest, btc_v2_report = bitcoin12.verified_inputs()\n'
          )
          marker = '    inventory["source_digest"] = canonical_digest(inventory)\n    return inventory\n'
          repl = '''    # Project the historical baseline through the same verified 12-item v2\n    # migration used by scripts/finalize_bitcoin_12_parity.py. This keeps the\n    # generated artifact and checked-in current truth structurally identical\n    # while preserving v1 as immutable publication history.\n    with tempfile.TemporaryDirectory() as tmp:\n        tmp_root = Path(tmp)\n        (tmp_root / "api").mkdir(parents=True, exist_ok=True)\n        temp_inventory = tmp_root / "api/final-evidence-inventory.v1.json"\n        temp_inventory.write_text(\n            json.dumps(inventory, ensure_ascii=False, indent=2, allow_nan=False) + "\\n",\n            encoding="utf-8",\n        )\n        original_root = bitcoin12.ROOT\n        try:\n            bitcoin12.ROOT = tmp_root\n            bitcoin12.update_final_inventory(btc_v2_manifest, btc_v2_report)\n            inventory = json.loads(temp_inventory.read_text(encoding="utf-8"))\n        finally:\n            bitcoin12.ROOT = original_root\n\n    inventory["source_digest"] = canonical_digest(inventory)\n    return inventory\n'''
          if marker not in text:
              raise SystemExit('build_final_evidence_inventory source-digest marker missing')
          text = text.replace(marker, repl, 1)
          text = text.replace('| Cryptographic evidence | 8 Bitcoin inscriptions, 12 non-NFT Ethereum anchors, 175 Chronicle NFTs |', '| Cryptographic evidence | {bitcoin[\'count\']} Bitcoin inscriptions, 12 non-NFT Ethereum anchors, 175 Chronicle NFTs |')
          text = text.replace('All 8 pass exact Ord-body/Taproot/BIP340 verification, txid inclusion, separate', 'All {bitcoin[\'count\']} pass exact Ord-body/tag-5-metadata-or-verified-absence/Taproot/BIP340 verification, txid inclusion, separate')
          p.write_text(text, encoding='utf-8')

          # Finalizer must recompute the evidence-manifest self-digest and also
          # move the current verification order to v2 without altering old DOI history.
          p = Path('scripts/finalize_bitcoin_12_parity.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import json\nfrom pathlib import Path\n', 'import hashlib\nimport json\nfrom pathlib import Path\n')
          insert = '''\n\ndef canonical_source_digest(doc: dict[str, Any]) -> str:\n    clone = dict(doc)\n    clone.pop("source_digest", None)\n    raw = json.dumps(clone, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")\n    return hashlib.sha256(raw).hexdigest()[:16]\n'''
          anchor = '\ndef verified_inputs() -> tuple[dict[str, Any], dict[str, Any]]:\n'
          if 'def canonical_source_digest' not in text:
              if anchor not in text:
                  raise SystemExit('finalizer verified_inputs marker missing')
              text = text.replace(anchor, insert + anchor, 1)
          old = '    bitcoin.pop("non_amending_ancillary", None)\n    dump(path, doc)\n\n\ndef update_evidence_manifest'
          new = '    bitcoin.pop("non_amending_ancillary", None)\n    if doc.get("verification_order"):\n        doc["verification_order"][0] = "verify the complete 12-item current Bitcoin proof annex v2 while preserving the historical v1 eight-item checkpoint"\n    dump(path, doc)\n\n\ndef update_evidence_manifest'
          if old not in text:
              raise SystemExit('finalizer inventory dump marker missing')
          text = text.replace(old, new, 1)
          old = '    dump(path, doc)\n\n\ndef update_relationship_map()'
          new = '    doc["source_digest"] = canonical_source_digest(doc)\n    dump(path, doc)\n\n\ndef update_relationship_map()'
          if old not in text:
              raise SystemExit('finalizer evidence manifest dump marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Current evidence contract: move assertions from historical v1 to current v2.
          p = Path('tests/test_evidence_manifest_current_proof_state.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('bitcoin-inscription-proof-annex-v1" / "reports"', 'bitcoin-inscription-proof-annex-v2" / "reports"', 1)
          text = text.replace('        "offline_verifiable_and_immutable_checkpoint_v4",\n', '        "offline_verifiable_and_immutable_checkpoint_v4",\n        "offline_verifiable_current_bitcoin_v2_plus_published_repository_checkpoint_v4",\n')
          text = text.replace('    assert bitcoin["inscription_count"] == 8\n    assert bitcoin["canonical_originals"] == 3\n    assert bitcoin["non_amending_ancillary"] == 5\n    assert bitcoin["l1_inscription_content_and_taproot_binding"] == "PASS"\n    assert bitcoin["bip340_tapscript_signatures"] == 8\n', '    assert bitcoin["inscription_count"] == 12\n    assert bitcoin["pre_canonical_formation"] == 4\n    assert bitcoin["canonical_originals"] == 3\n    assert bitcoin["post_canonical_non_amending"] == 5\n    assert bitcoin["l1_inscription_content_metadata_and_taproot_binding"] == "PASS"\n    assert bitcoin["tag5_metadata_present"] == 1\n    assert bitcoin["tag5_metadata_absent_verified"] == 11\n    assert bitcoin["bip340_tapscript_signatures"] == 12\n')
          text = text.replace('    assert bitcoin["bip141_witness_commitment_proofs"] == 8\n', '    assert bitcoin["bip141_witness_commitment_proofs"] == 12\n')
          text = text.replace('    assert bitcoin["valid_pow_headers"] == 1160\n', '    assert bitcoin["valid_pow_headers"] == 1740\n')
          text = text.replace('        assert preservation["live_repository_delta"]["status"] == "incorporated_into_published_checkpoint_v4"\n', '        assert preservation["live_repository_delta"]["status"] == "bitcoin_v2_verified_in_git_pending_next_repository_preservation_version"\n')
          text = text.replace('    assert btc_report["L1_INSCRIPTION_CONTENT_AND_TAPROOT_BINDING"]["status"] == bitcoin["l1_inscription_content_and_taproot_binding"]\n    assert btc_report["L1_INSCRIPTION_CONTENT_AND_TAPROOT_BINDING"]["inscriptions"] == bitcoin["inscription_count"]\n', '    assert btc_report["L1_INSCRIPTION_CONTENT_METADATA_AND_TAPROOT_BINDING"]["status"] == bitcoin["l1_inscription_content_metadata_and_taproot_binding"]\n    assert btc_report["L1_INSCRIPTION_CONTENT_METADATA_AND_TAPROOT_BINDING"]["inscriptions"] == bitcoin["inscription_count"]\n    assert btc_report["L1_INSCRIPTION_CONTENT_METADATA_AND_TAPROOT_BINDING"]["tag5_metadata_present"] == bitcoin["tag5_metadata_present"]\n    assert btc_report["L1_INSCRIPTION_CONTENT_METADATA_AND_TAPROOT_BINDING"]["tag5_metadata_absent_verified"] == bitcoin["tag5_metadata_absent_verified"]\n')
          p.write_text(text, encoding='utf-8')

          # Relationship profile contract now describes current v2, not the historical v1 checkpoint.
          p = Path('tests/test_evidence_relationship_profiles.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('{"canonical_originals": 3, "non_amending_ancillary": 5, "total": 8}', '{"pre_canonical_formation": 4, "canonical_originals": 3, "post_canonical_non_amending": 5, "total": 12}')
          text = text.replace('evidence/bitcoin-inscription-proof-annex-v1/ANNEX-MANIFEST.json', 'evidence/bitcoin-inscription-proof-annex-v2/ANNEX-MANIFEST.json')
          text = text.replace('evidence/bitcoin-inscription-proof-annex-v1/reports/OFFLINE-VERIFICATION.json', 'evidence/bitcoin-inscription-proof-annex-v2/reports/OFFLINE-VERIFICATION.json')
          text = text.replace('evidence/bitcoin-inscription-proof-annex-v1/verification/verify_annex.py', 'evidence/bitcoin-inscription-proof-annex-v2/verification/verify_annex.py')
          p.write_text(text, encoding='utf-8')
          PY

          python3 scripts/finalize_bitcoin_12_parity.py
          python3 scripts/build_final_evidence_inventory.py --write
          python3 scripts/build_final_evidence_inventory.py --check
          python3 scripts/current_baseline_publication_v4.py validate
          python3 -m pytest -q \
            tests/test_current_baseline_publication_contract.py \
            tests/test_current_baseline_publication_v3_contract.py \
            tests/test_current_baseline_publication_v4_contract.py \
            tests/test_evidence_manifest_current_proof_state.py \
            tests/test_evidence_relationship_profiles.py \
            tests/test_preservation_refresh_and_live_preflight_gate.py
      - name: Commit focused fix and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/fix-bitcoin-12-parity-ci.yml
          git config user.name actions-user
          git config user.email actions@github.com
          git add scripts/build_final_evidence_inventory.py scripts/finalize_bitcoin_12_parity.py \
            tests/test_evidence_manifest_current_proof_state.py tests/test_evidence_relationship_profiles.py \
            api/final-evidence-inventory.v1.json FINAL-EVIDENCE-FREEZE.md api/evidence-manifest.json \
            api/evidence-relationship-map.v1.json preservation/recovery-catalog.json \
            authority-address-inscriptions.md bitcoin-inscription-mirrors/README.md \
            .github/workflows/fix-bitcoin-12-parity-ci.yml
          git diff --cached --check
          git commit -m 'fix: make 12-item evidence state generator-derived'
          git push origin HEAD:evidence/finalize-bitcoin-12-parity
