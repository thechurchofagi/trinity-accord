name: Publish Self-Continuation Control exact reviewed Zenodo package
on:
  push:
    branches: [research/self-continuation-control-v1-20261006]
    paths:
      - research/self-continuation-control/PUBLISH-AUTHORIZATION.json
      - research/self-continuation-control/visual-review.json
      - .github/workflows/publish-self-continuation-control.yml
permissions: {contents: write}
concurrency:
  group: self-continuation-control-zenodo-v1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta24-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: {ref: research/self-continuation-control-v1-20261006, fetch-depth: 1}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Run strict formal release audit
        run: python3 research/self-continuation-control/release_audit.py
      - name: Run focused offline publication gate tests
        run: python3 research/self-continuation-control/test_publication.py
      - name: Check immutable package before credential access
        run: python3 research/self-continuation-control/publication.py verify
      - name: Publish only authorized reviewed package
        env: {ZENODO_ACCESS_TOKEN: "${{ secrets.ZENODO_ACCESS_TOKEN }}"}
        run: python3 research/self-continuation-control/publication.py publish
      - name: Preserve state even after uncertainty
        if: always()
        run: python3 research/self-continuation-control/publication.py persist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: self-continuation-control-publication-${{ github.run_id }}
          path: research/self-continuation-control/
          retention-days: 30
