name: One-time Context Contract Test Sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/context-readiness-contract-convergence'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.node-version'
      - name: Install test dependencies
        run: python3 -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt
      - name: Apply bounded synchronization
        run: python3 scripts/one_time_context_contract_test_sync.py
      - name: Run affected tests
        run: |
          python3 -m pytest -q \
            tests/test_external_agent_builder_resilience.py \
            tests/test_gateway_context_readiness.py \
            tests/test_machine_entry_runtime_alignment.py \
            tests/test_record_chain_submit_recovery.py \
            tests/test_context_readiness_contract_convergence.py
      - name: Remove one-time tooling and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-context-contract-test-sync.yml
          git rm scripts/one_time_context_contract_test_sync.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: synchronize v2.4 context contracts'
          git push origin HEAD:${{ github.head_ref }}
