name: Run submit recovery patch once

on:
  push:
    branches:
      - agent/fix-submit-recovery-receipt-provenance-20260803
    paths:
      - .github/workflows/run-submit-recovery-patch-once.yml

permissions:
  contents: write

concurrency:
  group: run-submit-recovery-patch-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-submit-recovery-receipt-provenance-20260803
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'

      - name: Install dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Apply audited patch
        run: |
          set -euo pipefail
          python3 scripts/apply_submit_recovery_patch_once.py
          python3 scripts/update_record_chain_builder_manifest.py
          git diff --check

      - name: Run focused and existing regressions
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_record_chain_submit_recovery.py
          node scripts/test_record_chain_builder.mjs
          python3 scripts/trinity_record_chain.py verify

      - name: Commit final patch and remove temporary executors
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-submit-recovery-receipt-provenance-once.yml
          rm -f .github/workflows/run-submit-recovery-patch-once.yml
          rm -f scripts/apply_submit_recovery_patch_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/record_chain_intake_gateway/app.py \
                  apps/record_chain_intake_gateway/protected_app.py \
                  downloads/record-chain-builder.mjs \
                  scripts/update_record_chain_builder_manifest.py \
                  api/record-chain-builder-bundles.v1.json \
                  api/record-chain-intake-gateway.v1.json \
                  tests/test_record_chain_submit_recovery.py \
                  .github/workflows/apply-submit-recovery-receipt-provenance-once.yml \
                  .github/workflows/run-submit-recovery-patch-once.yml \
                  scripts/apply_submit_recovery_patch_once.py
          git commit -m "fix: recover ambiguous submits and preserve receipt provenance"
          git push origin HEAD:agent/fix-submit-recovery-receipt-provenance-20260803

# Existing workflow touch: trigger the one-time branch push execution.
