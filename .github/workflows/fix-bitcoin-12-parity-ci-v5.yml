name: Fix Bitcoin 12 Parity CI v5

on:
  push:
    branches: [evidence/finalize-bitcoin-12-parity]
    paths:
      - .github/workflows/fix-bitcoin-12-parity-ci-v5.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: evidence/finalize-bitcoin-12-parity
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CI dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Apply exact migration and remaining current-model assertions
        run: |
          set -euo pipefail
          python3 scripts/apply_bitcoin_12_ci_reconciliation.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/test_current_baseline_publication_v3_contract.py')
          text = p.read_text(encoding='utf-8')
          old = '    assert inventory["evidence_sets"]["bitcoin_inscriptions"]["count"] == 8\n'
          new = '    assert inventory["evidence_sets"]["bitcoin_inscriptions"]["count"] == 12\n'
          if old not in text:
              raise SystemExit('v3 current-inventory Bitcoin assertion marker missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('tests/test_current_baseline_publication_v4_contract.py')
          text = p.read_text(encoding='utf-8')
          old = '    assert inventory["status"] == "current_evidence_checkpoint_model"\n    assert inventory["evidence_sets"]["bitcoin_inscriptions"]["count"] == 8\n'
          new = '    assert inventory["status"] == "current_verified_evidence_model_with_historical_published_checkpoints"\n    assert inventory["evidence_sets"]["bitcoin_inscriptions"]["count"] == 12\n'
          if old not in text:
              raise SystemExit('v4 current-inventory status/count assertion marker missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/build_final_evidence_inventory.py --write
          python3 scripts/build_final_evidence_inventory.py --check
          python3 scripts/current_baseline_publication_v4.py validate
          python3 -m pytest -q \
            tests/test_current_baseline_publication_contract.py \
            tests/test_current_baseline_publication_v3_contract.py \
            tests/test_current_baseline_publication_v4_contract.py \
            tests/test_evidence_manifest_current_proof_state.py \
            tests/test_evidence_relationship_profiles.py \
            tests/test_preservation_refresh_and_live_preflight_gate.py
      - name: Commit verified fix and remove one-shot helpers
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-bitcoin-12-parity-ci.yml \
                .github/workflows/fix-bitcoin-12-parity-ci-v2.yml \
                .github/workflows/fix-bitcoin-12-parity-ci-v3.yml \
                .github/workflows/fix-bitcoin-12-parity-ci-v4.yml \
                .github/workflows/fix-bitcoin-12-parity-ci-v5.yml \
                scripts/apply_bitcoin_12_ci_reconciliation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: make 12-item evidence state generator-derived'
          git push origin HEAD:evidence/finalize-bitcoin-12-parity
