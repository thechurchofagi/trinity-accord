name: Apply verified final-13 ordering patch

on:
  push:
    branches: [agent/research-final-13-cids]
    paths: [.github/workflows/apply-final13-order-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: agent/research-final-13-cids
      - name: Apply exact metadata ordering variant and regression guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/rebuild-chronicle-sidechain-cars-from-history.mjs')
          s=p.read_text()
          old="""    ['nft_common_name_description_image', orderedTopLevel(metadata, ['name', 'description', 'image', 'animation_url', 'external_url', 'attributes', 'properties'])],\n    ['nft_common_name_image_description', orderedTopLevel(metadata, ['name', 'image', 'description', 'animation_url', 'external_url', 'attributes', 'properties'])],"""
          new="""    ['nft_common_name_description_image', orderedTopLevel(metadata, ['name', 'description', 'image', 'animation_url', 'external_url', 'attributes', 'properties'])],\n    // Historical spam-airdrop metadata in the immutable v1 snapshot was serialized\n    // by Python-style JSON with external_url before image. Preserve that exact\n    // ordering as another candidate; acceptance still requires target CID equality.\n    ['nft_common_name_description_external_image', orderedTopLevel(metadata, ['name', 'description', 'external_url', 'image', 'animation_url', 'attributes', 'properties'])],\n    ['nft_common_name_image_description', orderedTopLevel(metadata, ['name', 'image', 'description', 'animation_url', 'external_url', 'attributes', 'properties'])],"""
          if old not in s: raise SystemExit('ordering patch anchor not found')
          p.write_text(s.replace(old,new,1))

          t=Path('scripts/test_chronicle_bootstrap_history.mjs')
          s=t.read_text()
          old="assert.match(rebuild, /HISTORICAL-CONTENT-RECOVERY\\.ndjson/);\n"
          new=old+"assert.match(rebuild, /'name', 'description', 'external_url', 'image'/);\n"
          if old not in s: raise SystemExit('test patch anchor not found')
          t.write_text(s.replace(old,new,1))
          PY
          node --check scripts/rebuild-chronicle-sidechain-cars-from-history.mjs
          node scripts/test_chronicle_bootstrap_history.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/rebuild-chronicle-sidechain-cars-from-history.mjs scripts/test_chronicle_bootstrap_history.mjs
          git commit -m "Recover four historical metadata roots by exact JSON order"
          git push origin HEAD:agent/research-final-13-cids
