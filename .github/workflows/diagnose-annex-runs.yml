name: Diagnose Annex Runs

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-runs.yml

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read external annex workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "external-binary-annex-publication.yml/runs?branch=main&per_page=20"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "trinity-annex-run-diagnosis/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              value = json.loads(response.read().decode("utf-8"))
          runs = value.get("workflow_runs") if isinstance(value, dict) else None
          if not isinstance(runs, list):
              raise SystemExit("workflow run response did not contain a list")
          print("ANNEX_RUN_DIAGNOSIS_BEGIN")
          for run in runs:
              print(json.dumps({
                  "id": run.get("id"),
                  "run_number": run.get("run_number"),
                  "run_attempt": run.get("run_attempt"),
                  "event": run.get("event"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
                  "created_at": run.get("created_at"),
                  "run_started_at": run.get("run_started_at"),
                  "updated_at": run.get("updated_at"),
                  "html_url": run.get("html_url"),
              }, sort_keys=True))
          print("ANNEX_RUN_DIAGNOSIS_END")
          PY
