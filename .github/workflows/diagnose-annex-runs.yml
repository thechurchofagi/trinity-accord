name: Diagnose Annex Runs

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-runs.yml

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read latest V4 execution and public record counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          def get(url, headers):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.loads(response.read().decode("utf-8"))

          repo = os.environ["REPOSITORY"]
          gh = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trinity-annex-final-run-diagnosis/1.1",
          }
          public = {
              "Accept": "application/json",
              "User-Agent": "trinity-annex-final-public-diagnosis/1.1",
          }
          runs = get(
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "external-binary-annex-publication-v4.yml/runs?branch=main&per_page=10",
              gh,
          ).get("workflow_runs", [])
          print("FINAL_V4_RUNS_BEGIN")
          for run in runs:
              summary = {
                  key: run.get(key)
                  for key in (
                      "id", "run_number", "run_attempt", "status", "conclusion",
                      "head_sha", "created_at", "run_started_at", "updated_at", "html_url"
                  )
              }
              print("RUN " + json.dumps(summary, sort_keys=True))
              jobs = get(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100",
                  gh,
              ).get("jobs", [])
              for job in jobs:
                  print("JOB " + json.dumps({
                      "run_id": run.get("id"),
                      "id": job.get("id"),
                      "name": job.get("name"),
                      "status": job.get("status"),
                      "conclusion": job.get("conclusion"),
                      "steps": [
                          {
                              "name": step.get("name"),
                              "status": step.get("status"),
                              "conclusion": step.get("conclusion"),
                          }
                          for step in job.get("steps", [])
                      ],
                  }, sort_keys=True))
          print("FINAL_V4_RUNS_END")

          for version in (
              "external-evidence-annex-v4",
              "chronicle-nft-media-annex-v4",
          ):
              query = f'metadata.version:"{version}"'
              url = "https://zenodo.org/api/records?" + urllib.parse.urlencode(
                  {"q": query, "size": 10, "sort": "newest"}
              )
              hits = get(url, public).get("hits", {}).get("hits", [])
              print("PUBLIC " + json.dumps({
                  "version": version,
                  "count": len(hits),
                  "records": [
                      {
                          "id": item.get("id"),
                          "doi": item.get("doi") or item.get("pids", {}).get("doi"),
                      }
                      for item in hits
                  ],
              }, sort_keys=True))
          PY
