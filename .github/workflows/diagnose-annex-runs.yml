name: Diagnose Annex Runs

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-runs.yml

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read final V4 run and public Zenodo records
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          def get(url, headers=None):
              request = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))

          repo = os.environ["REPOSITORY"]
          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trinity-annex-run-diagnosis/4.1",
          }
          runs = get(
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "external-binary-annex-publication-v4.yml/runs?branch=main&per_page=10",
              github_headers,
          ).get("workflow_runs", [])
          print("V4_RUNS_BEGIN")
          for run in runs:
              print(json.dumps({
                  key: run.get(key)
                  for key in (
                      "id", "run_number", "run_attempt", "status", "conclusion",
                      "head_sha", "created_at", "updated_at", "html_url",
                      "check_suite_id"
                  )
              }, sort_keys=True))
          print("V4_RUNS_END")

          public_headers = {
              "Accept": "application/json",
              "User-Agent": "trinity-annex-public-record-diagnosis/2.0",
          }
          for version in (
              "external-evidence-annex-v4",
              "chronicle-nft-media-annex-v4",
          ):
              query = f'metadata.version:"{version}"'
              search_url = "https://zenodo.org/api/records?" + urllib.parse.urlencode(
                  {"q": query, "size": 10, "sort": "newest"}
              )
              hits = get(search_url, public_headers).get("hits", {}).get("hits", [])
              print(f"ZENODO_{version}_BEGIN")
              print(json.dumps({"count": len(hits)}))
              for record in hits:
                  metadata = record.get("metadata") if isinstance(record.get("metadata"), dict) else {}
                  files = record.get("files")
                  if isinstance(files, dict):
                      entries = files.get("entries")
                      file_count = len(entries) if isinstance(entries, (dict, list)) else None
                  elif isinstance(files, list):
                      file_count = len(files)
                  else:
                      file_count = None
                  print(json.dumps({
                      "id": record.get("id"),
                      "doi": record.get("doi") or record.get("pids", {}).get("doi"),
                      "conceptrecid": record.get("conceptrecid") or record.get("parent", {}).get("id"),
                      "version": metadata.get("version") or record.get("version"),
                      "title": metadata.get("title") or record.get("title"),
                      "file_count": file_count,
                      "related_identifiers": metadata.get("related_identifiers") or record.get("related_identifiers"),
                      "license": metadata.get("license") or record.get("license"),
                  }, ensure_ascii=False, sort_keys=True))
              print(f"ZENODO_{version}_END")
          PY
