name: Diagnose Annex Runs

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-annex-runs.yml

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read immutable V4 public package identities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          HEADERS = {
              "Accept": "application/json",
              "User-Agent": "trinity-annex-immutable-package-diagnosis/1.0",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.loads(response.read().decode("utf-8"))

          def get_text(url):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read().decode("utf-8")

          for version in (
              "external-evidence-annex-v4",
              "chronicle-nft-media-annex-v4",
          ):
              query = f'metadata.version:"{version}"'
              search_url = "https://zenodo.org/api/records?" + urllib.parse.urlencode(
                  {"q": query, "size": 10, "sort": "newest"}
              )
              hits = get_json(search_url).get("hits", {}).get("hits", [])
              print("PUBLIC_VERSION " + json.dumps({"version": version, "count": len(hits)}))
              for record in hits:
                  record_id = int(record["id"])
                  direct = get_json(f"https://zenodo.org/api/records/{record_id}")
                  files = direct.get("files")
                  file_map = {}
                  if isinstance(files, dict):
                      entries = files.get("entries")
                      if isinstance(entries, dict):
                          file_map = entries
                      elif isinstance(entries, list):
                          file_map = {str(item.get("key") or item.get("filename")): item for item in entries if isinstance(item, dict)}
                  elif isinstance(files, list):
                      file_map = {str(item.get("key") or item.get("filename")): item for item in files if isinstance(item, dict)}

                  def file_url(name):
                      item = file_map[name]
                      links = item.get("links") if isinstance(item.get("links"), dict) else {}
                      return str(links.get("self") or links.get("content") or links.get("download"))

                  manifest = get_json(file_url("annex-manifest.json"))
                  checksums = get_text(file_url("checksums.sha256"))
                  print("PUBLIC_PACKAGE " + json.dumps({
                      "record_id": record_id,
                      "doi": direct.get("doi") or direct.get("pids", {}).get("doi"),
                      "conceptrecid": direct.get("conceptrecid") or direct.get("parent", {}).get("id"),
                      "annex_id": manifest.get("annex_id"),
                      "source_commit_sha": manifest.get("source_commit_sha"),
                      "package_identity_sha256": manifest.get("package_identity_sha256"),
                      "asset_count": manifest.get("asset_count"),
                      "payload_bytes": manifest.get("payload_bytes"),
                      "manifest_bytes": int(file_map["annex-manifest.json"].get("size") or file_map["annex-manifest.json"].get("filesize") or -1),
                      "payload_tar_bytes": int(file_map["payload.tar"].get("size") or file_map["payload.tar"].get("filesize") or -1),
                      "file_names": sorted(file_map),
                      "checksums": checksums.splitlines(),
                  }, sort_keys=True))
          PY
