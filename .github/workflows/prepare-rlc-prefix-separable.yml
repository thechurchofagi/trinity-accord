name: Prepare RLC Paper TA22
on:
  push:
    branches: [research/rlc-prefix-separable-v1-20261002]
    paths:
      - '.github/workflows/prepare-rlc-prefix-separable.yml'
      - 'research/rlc-prefix-separable/publication.py'
      - 'research/rlc-prefix-separable/source-*.md'
      - 'research/rlc-prefix-separable/AUDIT-RECEIPT.json'
permissions:
  contents: write
concurrency:
  group: rlc-ta22-zenodo-v1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta22-prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/rlc-prefix-separable-v1-20261002
          fetch-depth: 1
      - name: Install PDF and finite-verification toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex fonts-dejavu-core poppler-utils
          python3 -m pip install numpy==2.3.5
      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py
      - name: Check publication guards and independently rerun finite verification
        run: |
          python3 research/rlc-prefix-separable/test_publication.py
          python3 research/rlc-prefix-separable/verify_theorem.py --receipt "$RUNNER_TEMP/ta22-finite-checks.json"
      - name: Reserve exactly one TA22 record and build its DOI-bound package
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/rlc-prefix-separable/publication.py prepare
      - name: Verify exact package inventory and hashes
        run: python3 research/rlc-prefix-separable/publication.py verify
      - name: Persist reservation, generated package and operation receipts
        if: always()
        run: python3 research/rlc-prefix-separable/publication.py persist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ta22-rlc-preparation
          path: |
            research/rlc-prefix-separable/published/
            research/rlc-prefix-separable/create-intent.json
            research/rlc-prefix-separable/deposit.json
            research/rlc-prefix-separable/EXPECTED-PUBLICATION.json
            research/rlc-prefix-separable/format-checks.json
            research/rlc-prefix-separable/preparation-attempt.json
            ${{ runner.temp }}/ta22-finite-checks.json
          retention-days: 90
          if-no-files-found: warn
