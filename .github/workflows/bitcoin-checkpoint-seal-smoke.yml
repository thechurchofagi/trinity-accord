name: Bitcoin Checkpoint Seal Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bitcoin-checkpoint-seal-smoke.yml

permissions:
  contents: write

concurrency:
  group: bitcoin-checkpoint-seal-smoke
  cancel-in-progress: false

jobs:
  seal-smoke:
    name: Exercise non-authoritative checkpoint sealing path
    runs-on: ubuntu-24.04
    environment: release-publish
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Record toolchain provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Install seal-path tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd jq

      - name: Exercise split, upload, publish, readback, and cleanup
        shell: bash
        run: |
          set -Eeuo pipefail

          tag="bitcoin-consensus-seal-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_dir="${RUNNER_TEMP}/seal-smoke-source"
          asset_catalog="${RUNNER_TEMP}/seal-smoke-assets.tsv"
          part_prefix="${RUNNER_TEMP}/bitcoin-datadir.tar.zst.part-"
          smoke_manifest="${RUNNER_TEMP}/bitcoin-consensus-checkpoint.json"
          verify_dir="${RUNNER_TEMP}/seal-smoke-readback"
          assets_snapshot="${RUNNER_TEMP}/seal-smoke-release-assets.json"
          release_created=false
          release_published=false

          cleanup() {
            if [[ "$release_created" == "true" ]]; then
              if [[ "$release_published" == "true" ]]; then
                gh release delete "$tag" --yes --cleanup-tag
              else
                gh release delete "$tag" --yes
              fi
              release_created=false
            fi
          }
          trap cleanup EXIT

          mkdir -p "$source_dir" "$verify_dir"
          : > "$asset_catalog"
          dd if=/dev/urandom of="$source_dir/payload.bin" bs=1M count=3 status=none
          printf '%s\n' "non-authoritative Bitcoin checkpoint seal smoke test" > "$source_dir/README.txt"

          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Bitcoin checkpoint seal smoke ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Ephemeral non-authoritative smoke test. It is never part of the Bitcoin checkpoint lineage and is deleted after readback verification."
          release_created=true

          # A new draft can initially be exposed through an untagged-* URL. Address
          # the draft by its intended tag, matching the production checkpoint path.
          export CHECKPOINT_TAG="$tag"
          export ASSET_CATALOG="$asset_catalog"
          tar -C "$source_dir" -cf - . \
            | zstd -3 -T0 \
            | split -d -a 4 -b 1M - "$part_prefix" \
                --filter='
                  set -Eeuo pipefail
                  cat > "$FILE"
                  name="$(basename "$FILE")"
                  size="$(stat -c %s "$FILE")"
                  digest="$(sha256sum "$FILE" | awk "{print \$1}")"
                  gh release upload "$CHECKPOINT_TAG" "$FILE"
                  printf "%s\t%s\t%s\n" "$name" "$size" "$digest" >> "$ASSET_CATALOG"
                  rm -f "$FILE"
                '

          [[ -s "$asset_catalog" ]] || { echo "Smoke split produced no uploaded assets" >&2; exit 1; }
          asset_count="$(wc -l < "$asset_catalog" | tr -d ' ')"
          (( asset_count >= 2 )) || { echo "Smoke test expected multiple split assets" >&2; exit 1; }

          python3 - "$asset_catalog" "$smoke_manifest" <<'PY'
          import json
          import sys
          from pathlib import Path

          catalog = Path(sys.argv[1])
          output = Path(sys.argv[2])
          assets = []
          for line in catalog.read_text().splitlines():
              name, size, sha256 = line.split("\t")
              assets.append({"name": name, "size": int(size), "sha256": sha256})
          output.write_text(
              json.dumps(
                  {
                      "schema": "trinity-accord.bitcoin-consensus-seal-smoke.v1",
                      "authoritative": False,
                      "purpose": "exercise_release_sealing_transport_only",
                      "assets": assets,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n"
          )
          PY

          gh release upload "$tag" "$smoke_manifest"
          gh release edit "$tag" --draft=false
          release_published=true

          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          [[ "$(jq -r '.draft' <<<"$published")" == "false" ]] || { echo "Smoke Release did not publish" >&2; exit 1; }
          [[ "$(jq -r '.prerelease' <<<"$published")" == "false" ]] || { echo "Smoke Release unexpectedly became a prerelease" >&2; exit 1; }

          # GitHub can briefly expose the published Release before its asset list is
          # queryable through all read paths. Wait a bounded period for the exact
          # uploaded names to become visible, while logging the remote inventory.
          assets_ready=false
          for attempt in $(seq 1 12); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > "$assets_snapshot"
            echo "Remote Release assets (attempt ${attempt}/12):"
            jq -r '.assets[]? | [.name, (.size | tostring), (.state // ""), (.digest // "")] | @tsv' "$assets_snapshot"

            expected_visible=true
            while IFS=$'\t' read -r name size digest; do
              matches="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' "$assets_snapshot")"
              if [[ "$matches" != "1" ]]; then
                expected_visible=false
                break
              fi
              remote_size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' "$assets_snapshot")"
              remote_state="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state' "$assets_snapshot")"
              [[ "$remote_size" == "$size" ]] || { echo "Remote size mismatch for $name: expected=$size actual=$remote_size" >&2; exit 1; }
              [[ "$remote_state" == "uploaded" ]] || { expected_visible=false; break; }
              remote_digest="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | (.digest // "")' "$assets_snapshot")"
              if [[ "$remote_digest" == sha256:* ]]; then
                [[ "${remote_digest#sha256:}" == "$digest" ]] || { echo "Remote SHA-256 mismatch for $name" >&2; exit 1; }
              fi
            done < "$asset_catalog"

            manifest_matches="$(jq '[.assets[] | select(.name == "bitcoin-consensus-checkpoint.json")] | length' "$assets_snapshot")"
            if [[ "$manifest_matches" != "1" ]]; then
              expected_visible=false
            fi

            if [[ "$expected_visible" == "true" ]]; then
              assets_ready=true
              break
            fi
            sleep 5
          done

          [[ "$assets_ready" == "true" ]] || {
            echo "Expected smoke assets did not become visible within the bounded readback window" >&2
            cat "$assets_snapshot" >&2
            exit 1
          }

          while IFS=$'\t' read -r name size digest; do
            gh release download "$tag" --dir "$verify_dir" --pattern "$name"
            path="$verify_dir/$name"
            [[ -f "$path" ]] || { echo "Readback missing smoke asset: $name" >&2; exit 1; }
            [[ "$(stat -c %s "$path")" == "$size" ]] || { echo "Readback size mismatch: $name" >&2; exit 1; }
            [[ "$(sha256sum "$path" | awk '{print $1}')" == "$digest" ]] || { echo "Readback SHA-256 mismatch: $name" >&2; exit 1; }
          done < "$asset_catalog"

          gh release download "$tag" --dir "$verify_dir" --pattern 'bitcoin-consensus-checkpoint.json'
          cmp "$smoke_manifest" "$verify_dir/bitcoin-consensus-checkpoint.json"

          cleanup
          trap - EXIT
          echo "Full non-authoritative checkpoint sealing smoke test passed before Bitcoin IBD."
