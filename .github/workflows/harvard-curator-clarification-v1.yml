name: Harvard Curator Clarification v1

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/harvard-curator-clarification-trigger-v1'
      - '.github/workflows/harvard-curator-clarification-v1.yml'

permissions:
  contents: read

# Keep only one repository-fit clarification active at a time. This job is
# idempotent and fail-closed, but duplicate queued executions only increase
# runner-assignment pressure.
concurrency:
  group: harvard-curator-clarification-v1
  cancel-in-progress: true

jobs:
  clarify:
    # Lightweight, short-lived HTTP/Python orchestration is a good fit for the
    # single-CPU hosted pool and avoids the currently stalled standard-VM queue.
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install httpx
        run: python3 -m pip install httpx==0.27.0

      - name: Validate and apply curator clarification safely
        env:
          HD_API_TOKEN: ${{ secrets.HD }}
          OUTPUT_DIR: ${{ runner.temp }}/harvard-curator-clarification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/harvard_curator_clarification_v1.py \
            scripts/harvard_repository_fit_clarification_v1.py \
            scripts/harvard_repository_fit_orchestrator_v1.py
          test -s preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          grep -F 'human-led, generative-AI-assisted archival research and software project' preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          grep -F 'The research data in this deposit are the fixed digital artifacts and machine-readable evidence' preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          grep -F 'This deposit is organized as a **research dataset**, not as a live-site mirror.' preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          grep -F 'This deposit contains AI-generated and AI-assisted content.' preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          mkdir -p "$OUTPUT_DIR"
          python3 scripts/harvard_repository_fit_orchestrator_v1.py \
            2>&1 | tee "$OUTPUT_DIR/harvard-curator-clarification.log"
