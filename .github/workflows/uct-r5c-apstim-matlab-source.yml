name: UCT R5C recover original APStim Matlab source

on:
  push:
    branches:
      - ops/uct-r5c-apstim-matlab-source-20260928

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install remotezip
        run: python -m pip install remotezip
      - name: Extract Matlab source from Software.zip using HTTP range
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          import json,hashlib
          url="http://epi.fizica.unibuc.ro/apstim/Software.zip"
          wanted=["APSpectrum.m","APStim.m","APStimPopulation.m","APStimSimulation.m",
                  "CompareThresholds.m","NicoletFile.m","tdfd.m"]
          manifest=[]
          with RemoteZip(url) as z:
              names=z.namelist()
              Path("out/NAMELIST.txt").write_text("\n".join(names))
              for base in wanted:
                  hits=[n for n in names if n.endswith("/Matlab/"+base) or n.endswith("Matlab/"+base) or n==base]
                  if len(hits)!=1:
                      hits=[n for n in names if n.endswith(base)]
                  if len(hits)!=1:
                      raise RuntimeError(f"{base}: {hits}")
                  n=hits[0]
                  data=z.read(n)
                  p=Path("out/Matlab")/base
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(data)
                  manifest.append({"source_zip":url,"member":n,"file":base,"bytes":len(data),
                                   "sha256":hashlib.sha256(data).hexdigest()})
          Path("out/MANIFEST.json").write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uct-r5c-apstim-original-matlab-source
          path: out/
          retention-days: 7
          compression-level: 6
