name: Chronicle Sidechain Zenodo Cold Recovery

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_chronicle_sidechain_zenodo_deposit.py"
      - "scripts/publish_chronicle_sidechain_to_zenodo.py"
      - "archive/chronicle-sidechain-zenodo-rights-approval.json"
      - ".github/workflows/chronicle-sidechain-zenodo-cold-recovery.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  cold-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: trinity/sidechain-zenodo
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: ${{ vars.ZENODO_API_BASE || 'https://zenodo.org/api' }}
      CHRONICLE_SIDECHAIN_ZENODO_RIGHTS_ACK: ${{ vars.CHRONICLE_SIDECHAIN_ZENODO_RIGHTS_ACK }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"
          echo "[ZENODO RUN] run_id=$GITHUB_RUN_ID event_sha=$GITHUB_SHA started=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-ci.txt
          python3 -m py_compile scripts/build_chronicle_sidechain_zenodo_deposit.py scripts/publish_chronicle_sidechain_to_zenodo.py

      - name: Resolve and download latest immutable sidechain evidence release
        id: source
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sidechain-zenodo-source"
          mkdir -p "$root"
          echo "[SOURCE RESOLVE START] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft,isPrerelease > "$root/releases.json"
          python3 - <<'PY' > "$RUNNER_TEMP/sidechain-zenodo-source/source.env"
          import json,os,re
          root=os.environ['RUNNER_TEMP']+'/sidechain-zenodo-source'
          rows=json.load(open(root+'/releases.json'))
          rows=[r for r in rows if not r.get('isDraft') and not r.get('isPrerelease') and re.fullmatch(r'chronicle-sidechain-evidence-v2-[0-9a-f]{12}',r.get('tagName',''))]
          if not rows: raise SystemExit('no immutable sidechain v2 release found')
          rows.sort(key=lambda r:r.get('createdAt') or '')
          tag=rows[-1]['tagName']; short=tag.rsplit('-',1)[-1]
          print(f'SOURCE_TAG={tag}'); print(f'SOURCE_SHORT={short}')
          PY
          set -a
          . "$root/source.env"
          set +a
          git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "$SOURCE_TAG")"
          test "${SOURCE_SHA:0:12}" = "$SOURCE_SHORT" || {
            echo "source tag/commit mismatch tag=$SOURCE_TAG sha=$SOURCE_SHA" >&2
            exit 1
          }
          archive="chronicle-sidechain-evidence-v2-${SOURCE_SHORT}.tar.gz"
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$root" --pattern "$archive" --pattern "$archive.sha256"
          (cd "$root" && sha256sum -c "$archive.sha256")
          mkdir "$root/extracted"
          tar -xzf "$root/$archive" -C "$root/extracted"
          test -s "$root/extracted/chronicle-sidechain-scan/evidence-v2/OFFLINE-VERIFICATION.json"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_short=$SOURCE_SHORT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "source_root=$root" >> "$GITHUB_OUTPUT"
          echo "[SOURCE VERIFIED] tag=$SOURCE_TAG sha=$SOURCE_SHA archive=$archive sha256=$(awk '{print $1}' "$root/$archive.sha256")"

      - name: Cold-run sidechain offline verifier from extracted archive
        env:
          CHRONICLE_OUT: ${{ steps.source.outputs.source_root }}/extracted/chronicle-sidechain-scan
        run: |
          set -euo pipefail
          echo "[COLD VERIFY START] $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/verify-chronicle-sidechain-evidence.py
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['CHRONICLE_OUT'])/'evidence-v2'/'OFFLINE-VERIFICATION.json'
          r=json.loads(p.read_text())
          if r.get('pass') is not True: raise SystemExit('cold recovery offline verification did not pass')
          if r.get('records') != 217 or r.get('l2_records_checked') != 217: raise SystemExit('cold recovery is not 217/217')
          print(f"[COLD RECOVERY PASS] records={r['records']} cars={r.get('car_files_checked')} l2={r['l2_records_checked']}")
          PY

      - name: Build deterministic DOI-ready recovery deposit
        id: package
        env:
          SOURCE_ROOT: ${{ steps.source.outputs.source_root }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_SHORT: ${{ steps.source.outputs.source_short }}
          ARCHIVE: ${{ steps.source.outputs.archive }}
        run: |
          set -euo pipefail
          deposit=".sidechain-zenodo-deposit/${SOURCE_SHORT}"
          echo "[DOI PACKAGE START] source=$SOURCE_TAG output=$deposit"
          python3 scripts/build_chronicle_sidechain_zenodo_deposit.py \
            --archive "$SOURCE_ROOT/$ARCHIVE" \
            --archive-sha256 "$SOURCE_ROOT/$ARCHIVE.sha256" \
            --extracted-root "$SOURCE_ROOT/extracted/chronicle-sidechain-scan" \
            --source-tag "$SOURCE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --output-dir "$deposit" | tee "$RUNNER_TEMP/sidechain-zenodo-build.json"
          (cd "$deposit" && sha256sum -c SHA256SUMS)
          echo "deposit_dir=$deposit" >> "$GITHUB_OUTPUT"
          echo "[DOI READY] deposit=$deposit files=$(find "$deposit" -maxdepth 1 -type f | wc -l) bytes=$(du -sb "$deposit" | awk '{print $1}')"

      - name: Resolve publication authorization
        id: auth
        run: |
          set -euo pipefail
          token_configured=false
          rights_approved=false
          rights_ack=""
          approval_source="none"
          approval_file="archive/chronicle-sidechain-zenodo-rights-approval.json"
          if [ -n "${ZENODO_ACCESS_TOKEN:-}" ]; then token_configured=true; fi
          if [ "${CHRONICLE_SIDECHAIN_ZENODO_RIGHTS_ACK:-}" = "TRINITY_SIDECHAIN_EVIDENCE_MIXED_RIGHTS_V1_APPROVED" ]; then
            rights_approved=true
            rights_ack="TRINITY_SIDECHAIN_EVIDENCE_MIXED_RIGHTS_V1_APPROVED"
            approval_source="repository_variable"
          elif python3 - "$approval_file" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          if not p.is_file(): raise SystemExit(1)
          r=json.loads(p.read_text(encoding='utf-8'))
          if r.get('schema') != 'trinity-accord/chronicle-sidechain-zenodo-rights-approval/v1': raise SystemExit(1)
          if r.get('approval') != 'TRINITY_SIDECHAIN_EVIDENCE_MIXED_RIGHTS_V1_APPROVED': raise SystemExit(1)
          if r.get('status') != 'approved': raise SystemExit(1)
          boundary=str(r.get('boundary') or '')
          if 'does not claim ownership of third-party material' not in boundary: raise SystemExit(1)
          if 'does not relicense third-party material' not in boundary: raise SystemExit(1)
          print('[ZENODO RIGHTS FILE PASS] bounded mixed-rights publication approval validated')
          PY
          then
            rights_approved=true
            rights_ack="TRINITY_SIDECHAIN_EVIDENCE_MIXED_RIGHTS_V1_APPROVED"
            approval_source="versioned_file"
          fi
          publication_enabled=false
          if [ "$token_configured" = true ] && [ "$rights_approved" = true ]; then publication_enabled=true; fi
          echo "token_configured=$token_configured" >> "$GITHUB_OUTPUT"
          echo "rights_approved=$rights_approved" >> "$GITHUB_OUTPUT"
          echo "rights_ack=$rights_ack" >> "$GITHUB_OUTPUT"
          echo "approval_source=$approval_source" >> "$GITHUB_OUTPUT"
          echo "publication_enabled=$publication_enabled" >> "$GITHUB_OUTPUT"
          echo "[ZENODO AUTH] token_configured=$token_configured rights_approved=$rights_approved approval_source=$approval_source publication_enabled=$publication_enabled"

      - name: Publish observable authorization state
        env:
          TOKEN_CONFIGURED: ${{ steps.auth.outputs.token_configured }}
          RIGHTS_APPROVED: ${{ steps.auth.outputs.rights_approved }}
          APPROVAL_SOURCE: ${{ steps.auth.outputs.approval_source }}
          PUBLICATION_ENABLED: ${{ steps.auth.outputs.publication_enabled }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$PUBLICATION_ENABLED" = "true" ]; then
            target="${run_url}#trinity-zenodo?state=authorized&token=${TOKEN_CONFIGURED}&rights=${RIGHTS_APPROVED}&approval_source=${APPROVAL_SOURCE}"
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=pending \
              -f context="$STATUS_CONTEXT" \
              -f description="Zenodo authorization present; publication in progress" \
              -f target_url="$target" >/dev/null
            echo "[ZENODO AUTHORIZED] approval_source=$APPROVAL_SOURCE publication may proceed"
          else
            target="${run_url}#trinity-zenodo?state=authorization_missing&token=${TOKEN_CONFIGURED}&rights=${RIGHTS_APPROVED}&approval_source=${APPROVAL_SOURCE}"
            gh api --method POST -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure \
              -f context="$STATUS_CONTEXT" \
              -f description="Zenodo publication authorization incomplete" \
              -f target_url="$target" >/dev/null
            echo "[ZENODO AUTH BLOCKED] token_configured=$TOKEN_CONFIGURED rights_approved=$RIGHTS_APPROVED approval_source=$APPROVAL_SOURCE" >&2
            exit 1
          fi

      - name: Publish and full-readback verify independent Zenodo version
        id: publish
        if: steps.auth.outputs.publication_enabled == 'true' && success()
        env:
          DEPOSIT_DIR: ${{ steps.package.outputs.deposit_dir }}
          RIGHTS_ACK: ${{ steps.auth.outputs.rights_ack }}
        run: |
          set -euo pipefail
          test "$RIGHTS_ACK" = "TRINITY_SIDECHAIN_EVIDENCE_MIXED_RIGHTS_V1_APPROVED"
          echo "[ZENODO PUBLISH START] api_base=$ZENODO_API_BASE deposit=$DEPOSIT_DIR approval_source=${{ steps.auth.outputs.approval_source }}"
          python3 scripts/publish_chronicle_sidechain_to_zenodo.py \
            --deposit-dir "$DEPOSIT_DIR" \
            --api-base "$ZENODO_API_BASE" \
            --rights-boundary-ack "$RIGHTS_ACK"
          test -s archive/chronicle-sidechain-zenodo-state.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('archive/chronicle-sidechain-zenodo-state.json')
          r=json.loads(p.read_text())
          doi=r.get('doi') or r.get('version_doi')
          if not doi:
              raise SystemExit('Zenodo publisher returned without a DOI in state file')
          if r.get('remote_full_readback_sha256_verified') is not True:
              raise SystemExit('Zenodo state lacks full remote SHA-256 readback verification')
          print(f'[ZENODO PUBLISH PASS] doi={doi} concept_doi={r.get("concept_doi") or r.get("conceptdoi") or ""}')
          PY

      - name: Commit verified DOI state
        id: state
        if: steps.auth.outputs.publication_enabled == 'true' && success()
        run: |
          set -euo pipefail
          test -s archive/chronicle-sidechain-zenodo-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/chronicle-sidechain-zenodo-state.json
          if git diff --cached --quiet; then
            echo "[DOI STATE] already current"
            echo "state_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "archive: record sidechain evidence DOI"
          for attempt in 1 2 3; do
            echo "[DOI STATE PUSH] attempt=$attempt commit=$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              echo "state_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "[DOI STATE PUSH PASS] commit=$(git rev-parse HEAD)"
              exit 0
            fi
            echo "[DOI STATE PUSH RETRY] attempt=$attempt"
            git fetch origin main --prune
            git rebase origin/main
            git add archive/chronicle-sidechain-zenodo-state.json
            if ! git diff --cached --quiet; then git commit --amend --no-edit; fi
            sleep $((attempt * 5))
          done
          echo "Zenodo publication succeeded but DOI state could not be committed" >&2
          exit 1

      - name: Publish observable terminal success
        if: steps.auth.outputs.publication_enabled == 'true' && success()
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          STATE_COMMIT: ${{ steps.state.outputs.state_commit }}
        run: |
          set -euo pipefail
          test -s archive/chronicle-sidechain-zenodo-state.json
          eval "$(python3 - <<'PY'
          import json,shlex
          r=json.load(open('archive/chronicle-sidechain-zenodo-state.json'))
          doi=r.get('doi') or r.get('version_doi') or ''
          concept=r.get('concept_doi') or r.get('conceptdoi') or ''
          if not doi: raise SystemExit('missing DOI at terminal success gate')
          if r.get('remote_full_readback_sha256_verified') is not True: raise SystemExit('missing remote SHA-256 readback verification at terminal gate')
          print('DOI='+shlex.quote(str(doi)))
          print('CONCEPT_DOI='+shlex.quote(str(concept)))
          PY
          )"
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          target="${run_url}#trinity-zenodo?state=published&source=${SOURCE_TAG}&state_commit=${STATE_COMMIT}"
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="$STATUS_CONTEXT" \
            -f description="Sidechain Zenodo DOI published, read back, and state committed" \
            -f target_url="$target" >/dev/null
          echo "[ZENODO TERMINAL SUCCESS] doi=$DOI concept_doi=$CONCEPT_DOI state_commit=$STATE_COMMIT"

      - name: Publish observable terminal failure
        if: failure() && steps.auth.outputs.publication_enabled == 'true'
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          target="${run_url}#trinity-zenodo?state=publication_or_state_failure&run=${GITHUB_RUN_ID}"
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context="$STATUS_CONTEXT" \
            -f description="Zenodo publication/readback/state commit failed" \
            -f target_url="$target" >/dev/null
          echo "[ZENODO TERMINAL FAILURE] run_id=$GITHUB_RUN_ID"

      - name: Upload DOI-ready package and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronicle-sidechain-zenodo-${{ github.run_id }}
          path: |
            .sidechain-zenodo-deposit/
            ${{ runner.temp }}/sidechain-zenodo-build.json
            ${{ runner.temp }}/toolchain-provenance.json
            archive/chronicle-sidechain-zenodo-rights-approval.json
            archive/chronicle-sidechain-zenodo-state.json
          retention-days: 90
          if-no-files-found: warn

      - name: Cold recovery summary
        if: always()
        run: |
          printf 'source_tag=%s\n' '${{ steps.source.outputs.source_tag }}'
          printf 'source_sha=%s\n' '${{ steps.source.outputs.source_sha }}'
          printf 'deposit_dir=%s\n' '${{ steps.package.outputs.deposit_dir }}'
          printf 'zenodo_token_configured=%s\n' '${{ steps.auth.outputs.token_configured }}'
          printf 'zenodo_rights_approved=%s\n' '${{ steps.auth.outputs.rights_approved }}'
          printf 'zenodo_approval_source=%s\n' '${{ steps.auth.outputs.approval_source }}'
          printf 'zenodo_publication_enabled=%s\n' '${{ steps.auth.outputs.publication_enabled }}'
          printf 'doi=%s\n' '${{ steps.publish.outputs.doi }}'
          printf 'concept_doi=%s\n' '${{ steps.publish.outputs.concept_doi }}'
          printf 'state_commit=%s\n' '${{ steps.state.outputs.state_commit }}'
          printf 'run_id=%s\n' "$GITHUB_RUN_ID"
