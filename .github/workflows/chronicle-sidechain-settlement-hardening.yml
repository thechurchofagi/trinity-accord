name: Chronicle Sidechain Ethereum Settlement Hardening

on:
  push:
    branches: [main]
    paths:
      - "scripts/capture-chronicle-sidechain-settlement.py"
      - "scripts/verify-chronicle-sidechain-settlement.py"
      - ".github/workflows/chronicle-sidechain-settlement-hardening.yml"
  workflow_run:
    workflows: ["Chronicle Polygon + Base historical NFT evidence mirror"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chronicle-sidechain-settlement-hardening
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      CHRONICLE_ETH_RPC_FALLBACK_URLS: "https://ethereum-rpc.publicnode.com,https://eth.drpc.org"
      CHRONICLE_POLYGON_RPC_FALLBACK_URLS: "https://polygon.drpc.org,https://polygon-bor-rpc.publicnode.com"
      CHRONICLE_BASE_RPC_FALLBACK_URLS: "https://base.drpc.org,https://base-rpc.publicnode.com,https://mainnet.base.org"
      CHRONICLE_SETTLEMENT_CONCURRENCY: "12"
      CHRONICLE_SETTLEMENT_HTTP_TIMEOUT_SECONDS: "45"
      CHRONICLE_SETTLEMENT_HTTP_RETRIES: "2"
    steps:
      - name: Checkout current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned proof dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Validate settlement programs
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/capture-chronicle-sidechain-settlement.py scripts/verify-chronicle-sidechain-settlement.py

      - name: Resolve and verify latest immutable evidence release
        id: source
        run: |
          set -euo pipefail
          mkdir -p source-release
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft,isPrerelease > source-release/releases.json
          python3 - <<'PY' > source-release/source.env
          import json,re
          rows=json.load(open('source-release/releases.json'))
          rows=[r for r in rows if not r.get('isDraft') and not r.get('isPrerelease') and re.fullmatch(r'chronicle-sidechain-evidence-v2-[0-9a-f]{12}',r.get('tagName',''))]
          if not rows: raise SystemExit('no immutable sidechain evidence v2 release found')
          rows.sort(key=lambda r:r.get('createdAt') or '')
          tag=rows[-1]['tagName']; short=tag.rsplit('-',1)[-1]
          print(f'SOURCE_TAG={tag}'); print(f'SOURCE_SHORT={short}')
          PY
          set -a; . source-release/source.env; set +a
          git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "$SOURCE_TAG")"
          test "${SOURCE_SHA:0:12}" = "$SOURCE_SHORT"
          ARCHIVE="chronicle-sidechain-evidence-v2-${SOURCE_SHORT}.tar.gz"
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir source-release --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256"
          (cd source-release && sha256sum -c "$ARCHIVE.sha256")
          mkdir -p artifacts
          tar -xzf "source-release/$ARCHIVE" -C artifacts
          test -s artifacts/chronicle-sidechain-scan/evidence-v2/OFFLINE-VERIFICATION.json
          python3 - <<'PY'
          import json
          p='artifacts/chronicle-sidechain-scan/evidence-v2/OFFLINE-VERIFICATION.json'
          j=json.load(open(p))
          if not j.get('pass'): raise SystemExit('source evidence offline verification is not PASS')
          print('[SOURCE OFFLINE PASS]')
          PY
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_short=$SOURCE_SHORT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Capture Polygon checkpoint and Base L1-origin witnesses
        run: |
          set -euo pipefail
          python3 scripts/capture-chronicle-sidechain-settlement.py

      - name: Verify settlement package offline
        run: python3 scripts/verify-chronicle-sidechain-settlement.py

      - name: Build settlement manifest and anchor request
        env:
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.source_archive }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('artifacts/chronicle-sidechain-scan/evidence-v2/settlement-v1')
          files=[]
          for p in sorted(root.iterdir()):
              if p.is_file() and p.name not in {'SETTLEMENT-MANIFEST.sha256','SETTLEMENT-MANIFEST.json','SETTLEMENT-ANCHOR-REQUEST.json'}:
                  b=p.read_bytes(); files.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'SETTLEMENT-MANIFEST.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          (root/'SETTLEMENT-MANIFEST.sha256').write_text(''.join(f"{x['sha256']}  {x['name']}\n" for x in files))
          summary=json.load(open(root/'SETTLEMENT-SUMMARY.json'))
          payload={
            'schema':'trinity-accord/chronicle-sidechain-settlement-anchor-payload/v1',
            'source_release_tag':os.environ['SOURCE_TAG'],'source_commit_sha':os.environ['SOURCE_SHA'],
            'settlement_summary_sha256':hashlib.sha256((root/'SETTLEMENT-SUMMARY.json').read_bytes()).hexdigest(),
            'manifest_json_sha256':hashlib.sha256((root/'SETTLEMENT-MANIFEST.json').read_bytes()).hexdigest(),
            'polygon_status':summary['polygon']['status'],'base_status':summary['base']['status'],
            'canon_boundary':'non-amending; settlement witness is additive evidence only'
          }
          canonical=json.dumps(payload,sort_keys=True,separators=(',',':'))
          request={'schema':'trinity-accord/chronicle-sidechain-settlement-anchor-request/v1','payload':payload,'canonical_payload_json':canonical,'message_sha256':hashlib.sha256(canonical.encode()).hexdigest(),'ots':{'status':'pending_new_timestamp_anchor'},'ethereum_guardian_attestation':{'status':'optional_not_required_for_protocol_settlement_proofs'},'boundary':'Protocol settlement evidence and guardian attestation are separate dimensions.'}
          (root/'SETTLEMENT-ANCHOR-REQUEST.json').write_text(json.dumps(request,indent=2,sort_keys=True)+'\n')
          print('[SETTLEMENT ANCHOR]',request['message_sha256'])
          PY

      - name: Build immutable settlement archive
        id: package
        env:
          SOURCE_SHORT: ${{ steps.source.outputs.source_short }}
        run: |
          set -euo pipefail
          tag="chronicle-sidechain-settlement-v1-${SOURCE_SHORT}"
          archive="chronicle-sidechain-settlement-v1-${SOURCE_SHORT}.tar.gz"
          tar -C artifacts/chronicle-sidechain-scan/evidence-v2 -czf "$archive" settlement-v1
          sha256sum "$archive" > "$archive.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish immutable settlement Release
        env:
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          root="artifacts/chronicle-sidechain-scan/evidence-v2/settlement-v1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[IMMUTABLE RECONCILE] release already exists: $TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "Chronicle sidechain Ethereum settlement witness — ${SOURCE_SHA:0:12}" \
              --notes "Additive, non-amending settlement witness. Polygon: exact checkpoint Merkle membership plus Ethereum receipt/block inclusion and finalized-tag observation. Base: L1-origin binding is independently statused and is not mislabeled full OP settlement unless proven. Source evidence Release remains immutable." \
              "$ARCHIVE" "$ARCHIVE.sha256" \
              "$root/SETTLEMENT-SUMMARY.json" "$root/POLYGON-ETHEREUM-SETTLEMENT.json" "$root/BASE-ETHEREUM-SETTLEMENT.json" \
              "$root/OFFLINE-SETTLEMENT-VERIFICATION.json" "$root/SETTLEMENT-MANIFEST.json" "$root/SETTLEMENT-MANIFEST.sha256" \
              "$root/SETTLEMENT-ANCHOR-REQUEST.json" "$root/attempts.jsonl"
          fi

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronicle-sidechain-settlement-${{ github.run_id }}
          path: |
            artifacts/chronicle-sidechain-scan/evidence-v2/settlement-v1
            source-release/source.env
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: ${{ always() }}
        run: |
          echo '## Chronicle sidechain settlement hardening' >> "$GITHUB_STEP_SUMMARY"
          root='artifacts/chronicle-sidechain-scan/evidence-v2/settlement-v1'
          for f in SETTLEMENT-SUMMARY.json OFFLINE-SETTLEMENT-VERIFICATION.json SETTLEMENT-ANCHOR-REQUEST.json; do
            if [ -s "$root/$f" ]; then
              echo "### $f" >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat "$root/$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -s "$root/attempts.jsonl" ]; then
            echo '### attempts.jsonl tail' >> "$GITHUB_STEP_SUMMARY"; echo '```json' >> "$GITHUB_STEP_SUMMARY"; tail -n 100 "$root/attempts.jsonl" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
