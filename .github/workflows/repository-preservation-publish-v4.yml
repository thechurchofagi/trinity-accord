name: Publish Repository Preservation DOI V4 Fresh Draft

on:
  push:
    branches:
      - main
    paths:
      - preservation/publication-retry-v4.json

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  publish-and-prove:
    if: >-
      github.actor == 'thechurchofagi' &&
      startsWith(github.event.head_commit.message, 'archive: publish first repository preservation DOI from fresh V4 draft')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      TARGET_COMMIT: 484bdd7a85694ad53fe7e6e9dcea94d0dee5617e
      EXPECTED_PACKAGE_IDENTITY: a524924a7f7ee40d12fb269e7108c3be4810b8250f1c8db279ecee0474ae8ecc
      EXPECTED_BUNDLE_SHA256: e6f2feda70ee0d45e7ded27f023d29c1815d522477c9790bd764a20f87af53dd
      EXPECTED_BUNDLE_BYTES: "13403987"
    steps:
      - name: Checkout production tree and tag identities
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate exact owner authorization and V4 fresh-draft contract
        id: precheck
        run: |
          set -euo pipefail
          echo "authorization-precheck-v4" > "$RUNNER_TEMP/publication-stage.txt"
          test "$GITHUB_ACTOR" = "thechurchofagi"
          test -n "$ZENODO_ACCESS_TOKEN"
          git cat-file -e "$TARGET_COMMIT^{commit}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          authorization = json.loads(
              Path("preservation/publication-authorization-v1.json").read_text(encoding="utf-8")
          )
          expected_authorization = {
              "schema": "trinityaccord.repository-preservation-publication-authorization.v1",
              "authorized_by": "thechurchofagi",
              "authorized_at": "2026-08-01T19:42:00+08:00",
              "authorization": "publish_first_repository_preservation_doi",
              "publication_confirmation": "PUBLISH_TRINITY_REPOSITORY_CAPSULE_V1",
              "rights_boundary_ack": "TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED",
              "access_right": "other-closed",
              "scope": {
                  "core_git_tracked_tree_only": True,
                  "external_large_binary_annex_embedded": False,
              },
          }
          if authorization != expected_authorization:
              raise SystemExit("owner publication authorization changed")

          retry = json.loads(
              Path("preservation/publication-retry-v4.json").read_text(encoding="utf-8")
          )
          expected_retry = {
              "schema": "trinityaccord.repository-preservation-publication-retry.v4",
              "authorized_by": "thechurchofagi",
              "authorized_at": "2026-08-01T19:42:00+08:00",
              "retry_requested_at": "2026-08-01T20:55:00+08:00",
              "authorization": "publish_first_repository_preservation_doi",
              "publication_confirmation": "PUBLISH_TRINITY_REPOSITORY_CAPSULE_V1",
              "rights_boundary_source": "preservation/publication-authorization-v1.json",
              "rights_boundary_ack": "TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED",
              "access_right": "other-closed",
              "target_commit": "484bdd7a85694ad53fe7e6e9dcea94d0dee5617e",
              "reason": "delete_unpublished_stale_deposition_21739344_and_publish_from_fresh_draft",
              "stale_unpublished_deposition_id": 21739344,
              "expected_package_identity_sha256": os.environ["EXPECTED_PACKAGE_IDENTITY"],
              "expected_bundle_sha256": os.environ["EXPECTED_BUNDLE_SHA256"],
              "builder": "scripts/build_preservation_capsule_v2.py",
              "publisher": "scripts/publish_preservation_capsule_to_zenodo_v4.py",
              "scope": {
                  "core_git_tracked_tree_only": True,
                  "external_large_binary_annex_embedded": False,
              },
          }
          if retry != expected_retry:
              raise SystemExit("publication retry v4 marker changed")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(
                  "PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK="
                  + authorization["rights_boundary_ack"]
                  + "\n"
              )

          state = json.loads(Path("preservation/zenodo-state.json").read_text(encoding="utf-8"))
          published = state.get("publication_status") == "published" and bool(state.get("latest_doi"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"already_published={'true' if published else 'false'}\n")
          print("already published" if published else "fresh V4 deposition required")
          PY

      - name: Run V3 and V4 preservation regression tests
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "v4-regression-tests" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/test_repository_preservation_v3.py
          python3 scripts/test_repository_preservation_v4.py

      - name: Record publication toolchain provenance
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "toolchain-provenance" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/publication-toolchain-provenance.json"

      - name: Build twice and require exact deterministic capsule identity
        if: steps.precheck.outputs.already_published != 'true'
        id: build
        run: |
          set -euo pipefail
          echo "double-deterministic-build" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/build_preservation_capsule_v2.py \
            --repository-root . \
            --commit "$TARGET_COMMIT" \
            --output-dir "$RUNNER_TEMP/repository-preservation-capsule-a"
          python3 scripts/build_preservation_capsule_v2.py \
            --repository-root . \
            --commit "$TARGET_COMMIT" \
            --output-dir "$RUNNER_TEMP/repository-preservation-capsule-b"
          diff -qr \
            "$RUNNER_TEMP/repository-preservation-capsule-a" \
            "$RUNNER_TEMP/repository-preservation-capsule-b"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          a = root / "repository-preservation-capsule-a"
          b = root / "repository-preservation-capsule-b"
          manifest_a = json.loads((a / "preservation-manifest.json").read_text(encoding="utf-8"))
          manifest_b = json.loads((b / "preservation-manifest.json").read_text(encoding="utf-8"))
          identity = manifest_a["package_identity_sha256"]
          if identity != manifest_b["package_identity_sha256"]:
              raise SystemExit("double build package identities differ")
          if identity != os.environ["EXPECTED_PACKAGE_IDENTITY"]:
              raise SystemExit(f"unexpected deterministic package identity: {identity}")
          bundle = a / "trinity-accord-recovery.bundle"
          digest = hashlib.sha256(bundle.read_bytes()).hexdigest()
          if digest != os.environ["EXPECTED_BUNDLE_SHA256"]:
              raise SystemExit(f"unexpected deterministic bundle SHA-256: {digest}")
          if bundle.stat().st_size != int(os.environ["EXPECTED_BUNDLE_BYTES"]):
              raise SystemExit(f"unexpected deterministic bundle size: {bundle.stat().st_size}")
          print("DETERMINISTIC_CAPSULE_V4_OK", identity, digest, bundle.stat().st_size)
          PY

      - name: Prove local GitHub-zero restoration
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "local-cold-restore" > "$RUNNER_TEMP/publication-stage.txt"
          capsule="$RUNNER_TEMP/repository-preservation-capsule-a"
          mkdir -p "$RUNNER_TEMP/local-bootstrap"
          cp "$capsule/restore-trinity-accord.py" "$RUNNER_TEMP/local-bootstrap/restore-trinity-accord.py"
          cd "$RUNNER_TEMP/local-bootstrap"
          python3 restore-trinity-accord.py \
            --deposit-dir "$capsule" \
            --output-dir "$RUNNER_TEMP/local-doi-candidate-restore"
          test "$(git -C "$RUNNER_TEMP/local-doi-candidate-restore/repository" rev-parse HEAD)" = \
            "${{ steps.build.outputs.recovery_commit_sha }}"
          test "$(git -C "$RUNNER_TEMP/local-doi-candidate-restore/repository" rev-parse 'HEAD^{tree}')" = \
            "${{ steps.build.outputs.git_tree_oid }}"
          python3 "$RUNNER_TEMP/local-doi-candidate-restore/repository/scripts/audit_recovery_readiness.py"

      - name: Delete stale unpublished draft and publish from a fresh deposition
        if: steps.precheck.outputs.already_published != 'true'
        id: publish
        run: |
          set -euo pipefail
          echo "zenodo-fresh-draft-publish-v4" > "$RUNNER_TEMP/publication-stage.txt"
          python3 scripts/publish_preservation_capsule_to_zenodo_v4.py \
            --capsule-dir "$RUNNER_TEMP/repository-preservation-capsule-a" \
            --api-base "$ZENODO_API_BASE" \
            --rights-boundary-ack "$PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK"

      - name: Prove unauthenticated public DOI-only restoration
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "public-doi-cold-restore" > "$RUNNER_TEMP/publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/public-bootstrap"
          cp "$RUNNER_TEMP/repository-preservation-capsule-a/restore-trinity-accord.py" \
            "$RUNNER_TEMP/public-bootstrap/restore-trinity-accord.py"
          cd "$RUNNER_TEMP/public-bootstrap"
          env -u ZENODO_ACCESS_TOKEN python3 restore-trinity-accord.py \
            --zenodo-record-id "${{ steps.publish.outputs.record_id }}" \
            --output-dir "$RUNNER_TEMP/public-doi-restore"
          test -f "$RUNNER_TEMP/public-doi-restore/recovery-report.json"
          test "$(git -C "$RUNNER_TEMP/public-doi-restore/repository" rev-parse HEAD)" = \
            "${{ steps.build.outputs.recovery_commit_sha }}"
          test "$(git -C "$RUNNER_TEMP/public-doi-restore/repository" rev-parse 'HEAD^{tree}')" = \
            "${{ steps.build.outputs.git_tree_oid }}"
          python3 "$RUNNER_TEMP/public-doi-restore/repository/scripts/audit_recovery_readiness.py"

      - name: Commit publicly verified DOI state
        if: steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          echo "commit-verified-doi-state" > "$RUNNER_TEMP/publication-stage.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/zenodo-state.json
          if test -f preservation/publication-attempt-status.json; then
            git rm preservation/publication-attempt-status.json
          fi
          if git diff --cached --quiet; then
            echo "::error::Zenodo publication did not produce a repository state update."
            exit 1
          fi
          git commit -m "archive: record first repository preservation DOI"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            git add preservation/zenodo-state.json
            if test -f preservation/publication-attempt-status.json; then
              git rm preservation/publication-attempt-status.json
            fi
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Record visible V4 failure
        if: failure() && steps.precheck.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          if ! git diff --cached --quiet -- preservation/zenodo-state.json; then
            git restore --staged preservation/zenodo-state.json
          fi
          if ! git diff --quiet -- preservation/zenodo-state.json; then
            git restore preservation/zenodo-state.json
          fi
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          stage_path = Path(os.environ["RUNNER_TEMP"]) / "publication-stage.txt"
          stage = stage_path.read_text(encoding="utf-8").strip() if stage_path.exists() else "unknown"
          value = {
              "schema": "trinityaccord.repository-preservation-publication-attempt.v1",
              "status": "failed",
              "stage": stage,
              "target_commit": os.environ["TARGET_COMMIT"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "trigger_commit": os.environ["GITHUB_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
              "failed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "publication_status_after_failure": "not_verified",
          }
          Path("preservation/publication-attempt-status.json").write_text(
              json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/publication-attempt-status.json
          git commit -m "archive: record repository DOI publication failure"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload fresh-draft V4 evidence
        if: always() && steps.precheck.outputs.already_published != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-repository-preservation-doi-v4-evidence
          path: |
            ${{ runner.temp }}/repository-preservation-capsule-a/
            ${{ runner.temp }}/repository-preservation-capsule-b/
            ${{ runner.temp }}/local-doi-candidate-restore/recovery-report.json
            ${{ runner.temp }}/public-doi-restore/recovery-report.json
            ${{ runner.temp }}/publication-toolchain-provenance.json
          retention-days: 365
          if-no-files-found: warn
