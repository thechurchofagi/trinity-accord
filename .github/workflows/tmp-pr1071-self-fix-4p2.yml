name: Temporary PR 1071 trusted self-fix driver

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-pr-branch:
    if: >-
      github.event.pull_request.number == 1071 &&
      github.event.pull_request.head.ref == 'agent/close-final-scholarly-parser-gaps-2026-08-21'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0

      - name: Guard one-shot repair inputs
        shell: bash
        run: |
          test -f .tmp-pr1071-self-fix-trigger
          test -f .github/workflows/tmp-pr1071-self-fix-runner.yml
          git diff --quiet

      - name: Install focused test tooling
        run: python -m pip install --disable-pip-version-check pytest

      - name: Extract and run self-authored guarded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-pr1071-self-fix-runner.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index('          PY', start)
          code_lines = [
              line[10:] if line.startswith('          ') else line
              for line in lines[start:end]
          ]
          Path('/tmp/pr1071_self_fix.py').write_text(
              '\n'.join(code_lines) + '\n', encoding='utf-8'
          )
          PY
          python /tmp/pr1071_self_fix.py
          python -m pytest -q tests/test_scholarly_parser_edge_cases.py
          python -m py_compile scripts/check_deployment_freshness.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py "

      - name: Self-clean, commit and push exact two-file repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .tmp-pr1071-self-fix-trigger .github/workflows/tmp-pr1071-self-fix-runner.yml
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git commit -m "fix: close latest scholarly parser review gaps"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
