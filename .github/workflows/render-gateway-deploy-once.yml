name: One-Time Protected Render Gateway Deploy

# Temporary, self-path-limited deployment bridge. It runs only when this exact
# workflow file is first merged to main and must be removed after LIVE evidence.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-gateway-deploy-once.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: one-time-protected-render-gateway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'thechurchofagi/trinity-accord' && github.ref == 'refs/heads/main' && (github.actor == 'thechurchofagi' || github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: main

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Deploy exact main commit and reconcile protected health configuration
        id: deploy
        continue-on-error: true
        env:
          RENDER: ${{ secrets.RENDER }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          python scripts/render_manual_deploy.py \
            --service trinity-record-chain-gateway \
            --commit-id "$source_sha" \
            --wait \
            --deploy \
            --reconcile-config 2>&1 | tee "$RUNNER_TEMP/render-gateway-deploy.log"
          grep -q "RENDER_CONFIG_ATTESTED" "$RUNNER_TEMP/render-gateway-deploy.log"
          grep -q "health_check_path=/readyz" "$RUNNER_TEMP/render-gateway-deploy.log"
          grep -q "RENDER_DEPLOY_LIVE" "$RUNNER_TEMP/render-gateway-deploy.log"
          grep -q "GATEWAY_PROTECTION_ATTESTED" "$RUNNER_TEMP/render-gateway-deploy.log"
          grep -E "^(RENDER_CONFIG_ATTESTED|RENDER_DEPLOY_LIVE|GATEWAY_PROTECTION_ATTESTED)" \
            "$RUNNER_TEMP/render-gateway-deploy.log" > "$RUNNER_TEMP/render-gateway-evidence.txt"

      - name: Publish successful deployment evidence
        if: steps.deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.deploy.outputs.source_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          evidence="$(cat "$RUNNER_TEMP/render-gateway-evidence.txt")"
          body_file="$RUNNER_TEMP/render-live-comment.md"
          cat > "$body_file" <<EOF
          Render Gateway protected deployment: **LIVE**

          - exact deployed commit: \`$SOURCE_SHA\`
          - service: \`trinity-record-chain-gateway\`
          - workflow evidence: $RUN_URL

          Verified markers:

          \`\`\`text
          $evidence
          \`\`\`

          The workflow reconciled and read back the secure start command, \`healthCheckPath=/readyz\`, and runtime \`1.2.1-protected\`; waited for the exact commit to become Render LIVE; then verified protected \`/readyz\`, detailed readiness, and an oversized preflight rejection without submitting a record.
          EOF
          sed -i 's/^          //' "$body_file"
          gh pr comment 887 --repo "$GITHUB_REPOSITORY" --body-file "$body_file"

      - name: Publish failed or unconfirmed deployment evidence
        if: steps.deploy.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.deploy.outputs.source_sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/render-failed-comment.md"
          tail_text="$(tail -n 80 "$RUNNER_TEMP/render-gateway-deploy.log" 2>/dev/null || true)"
          cat > "$body_file" <<EOF
          Render Gateway protected deployment: **FAILED OR UNCONFIRMED**

          - attempted commit: \`${SOURCE_SHA:-unknown}\`
          - service: \`trinity-record-chain-gateway\`
          - workflow evidence: $RUN_URL

          Sanitized failure tail:

          \`\`\`text
          $tail_text
          \`\`\`

          No live-deployment claim should be made from this run.
          EOF
          sed -i 's/^          //' "$body_file"
          gh pr comment 887 --repo "$GITHUB_REPOSITORY" --body-file "$body_file"

      - name: Fail if deployment was not confirmed live
        if: steps.deploy.outcome != 'success'
        run: exit 1
