name: Publish Experience Intelligence and Self exact reviewed Zenodo package
on:
  push:
    branches: [research/experience-intelligence-self-v1-20261007]
    paths:
      - research/experience-intelligence-self/PUBLISH-AUTHORIZATION.json
      - research/experience-intelligence-self/visual-review.json
      - .github/workflows/publish-experience-intelligence-self.yml
permissions:
  contents: write
concurrency:
  group: experience-intelligence-self-zenodo-v1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta25-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/experience-intelligence-self-v1-20261007
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"
      - name: Run focused offline gate tests
        run: python3 research/experience-intelligence-self/test_publication.py
      - name: Check immutable package before credential access
        run: python3 research/experience-intelligence-self/publication.py verify
      - name: Publish only the authorized reviewed package
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/experience-intelligence-self/publication.py publish
      - name: Initialize exact published PDF timestamp targets
        run: |
          python3 - <<'PYSTAMP'
          import json,pathlib
          root=pathlib.Path('research/experience-intelligence-self')
          r=json.loads((root/'publication-record.json').read_text())
          assert r['submitted'] and r['public_file_readback_pass']
          assert r['report_number']=='TA-TR-2026-25' and r['version']=='1.0'
          batch=pathlib.Path('research/paper-timestamps/2026-10-07-paper25-v10')
          batch.mkdir(parents=True,exist_ok=True)
          target={'schema':'trinityaccord.paper-ots-targets.v1','batch':batch.name,'paper_count':1,'papers':[{'report':r['report_number'],'record_id':r['record_id'],'doi':r['doi'],'version':r['version'],'title':r['title'],'receipt_path':str(root/'publication-record.json'),'pdfs':[{'name':f['name'],'sha256':f['sha256'],'bytes':f['bytes']} for f in r['files'] if f['name'].endswith('.pdf')]}]}
          path=batch/'targets.json'
          if path.exists():assert json.loads(path.read_text())==target
          else:path.write_text(json.dumps(target,indent=2)+'\n')
          PYSTAMP
      - name: Submit exact published PDF to OTS calendars promptly
        run: |
          python3 -m pip install -r requirements-ots.txt
          python3 scripts/research_paper_ots.py stamp --batch research/paper-timestamps/2026-10-07-paper25-v10
      - name: Preserve OTS submission even while Bitcoin is pending
        if: always()
        run: |
          if [ ! -d research/paper-timestamps/2026-10-07-paper25-v10 ]; then exit 0; fi
          git config user.name 'trinity-ots-bot'
          git config user.email 'actions@github.com'
          git add research/paper-timestamps/2026-10-07-paper25-v10/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve TA25 initial OTS submission [skip ci]'
          git push origin HEAD:research/experience-intelligence-self-v1-20261007
      - name: Preserve same-record state even after uncertainty
        if: always()
        run: python3 research/experience-intelligence-self/publication.py persist
      - name: Retain exact publication state and public readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experience-intelligence-self-publication-${{ github.run_id }}
          path: research/experience-intelligence-self/
          retention-days: 30

