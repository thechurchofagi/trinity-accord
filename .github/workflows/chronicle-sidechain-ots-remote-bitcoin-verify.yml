name: Chronicle Sidechain OTS Remote Bitcoin Verify

on:
  pull_request:
    paths:
      - ".github/workflows/chronicle-sidechain-ots-remote-bitcoin-verify.yml"
      - "scripts/bitcoin_esplora_rpc_proxy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/chronicle-sidechain-ots-remote-bitcoin-verify.yml"
      - "scripts/bitcoin_esplora_rpc_proxy.py"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: chronicle-sidechain-ots-remote-bitcoin-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_CONTEXT: trinity/sidechain-ots
    steps:
      - name: Checkout current source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned OpenTimestamps client
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ots.txt
          python -m pip show opentimestamps-client
          ots --help >/dev/null
          python3 -m py_compile scripts/bitcoin_esplora_rpc_proxy.py

      - name: Resolve immutable source and anchor releases
        id: source
        run: |
          set -euo pipefail
          mkdir -p ots-remote-verify
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt,isDraft,isPrerelease > ots-remote-verify/releases.json
          python3 - <<'PY' > ots-remote-verify/source.env
          import json,re
          rows=json.load(open('ots-remote-verify/releases.json'))
          rows=[r for r in rows if not r.get('isDraft') and not r.get('isPrerelease') and re.fullmatch(r'chronicle-sidechain-evidence-v2-[0-9a-f]{12}',r.get('tagName',''))]
          if not rows:
              raise SystemExit('no immutable sidechain evidence v2 release found')
          rows.sort(key=lambda r:r.get('createdAt') or '')
          tag=rows[-1]['tagName']
          short=tag.rsplit('-',1)[-1]
          print(f'SOURCE_TAG={tag}')
          print(f'SOURCE_SHORT={short}')
          print(f'ANCHOR_TAG=chronicle-sidechain-ots-v2-{short}')
          print(f'CONFIRMATION_TAG=chronicle-sidechain-ots-bitcoin-v2-{short}')
          PY
          cat ots-remote-verify/source.env
          set -a
          . ots-remote-verify/source.env
          set +a
          git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          SOURCE_SHA="$(git rev-list -n 1 "$SOURCE_TAG")"
          test "${SOURCE_SHA:0:12}" = "$SOURCE_SHORT"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_short=$SOURCE_SHORT" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "anchor_tag=$ANCHOR_TAG" >> "$GITHUB_OUTPUT"
          echo "confirmation_tag=$CONFIRMATION_TAG" >> "$GITHUB_OUTPUT"
          echo "[SOURCE BOUND] source_tag=$SOURCE_TAG source_sha=$SOURCE_SHA anchor_tag=$ANCHOR_TAG confirmation_tag=$CONFIRMATION_TAG"

      - name: Download and validate exact OTS anchor release
        env:
          ANCHOR_TAG: ${{ steps.source.outputs.anchor_tag }}
        run: |
          set -euo pipefail
          mkdir -p ots-remote-verify/work
          cd ots-remote-verify/work
          echo "[ANCHOR DOWNLOAD] tag=$ANCHOR_TAG"
          gh release download "$ANCHOR_TAG" --repo "$GITHUB_REPOSITORY"
          test -s ANCHOR-REQUEST.json
          test -s anchor-payload.canonical.json
          test -s anchor-payload.canonical.json.ots
          test -s OTS-RECEIPT.json
          test -s SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "[ANCHOR VALID] tag=$ANCHOR_TAG"

      - name: Upgrade OTS proof to latest Bitcoin attestations
        id: upgrade
        run: |
          set -euo pipefail
          cd ots-remote-verify/work
          before_sha="$(sha256sum anchor-payload.canonical.json.ots | awk '{print $1}')"
          echo "[OTS UPGRADE START] proof_before=$before_sha"
          set +e
          timeout 240 ots upgrade anchor-payload.canonical.json.ots > OTS-UPGRADE.stdout.txt 2> OTS-UPGRADE.stderr.txt
          upgrade_rc=$?
          set -e
          after_sha="$(sha256sum anchor-payload.canonical.json.ots | awk '{print $1}')"
          echo "upgrade_rc=$upgrade_rc" >> "$GITHUB_OUTPUT"
          echo "proof_before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          echo "proof_after_sha=$after_sha" >> "$GITHUB_OUTPUT"
          echo "[OTS UPGRADE END] rc=$upgrade_rc proof_after=$after_sha"
          cat OTS-UPGRADE.stdout.txt
          cat OTS-UPGRADE.stderr.txt
          if [ "$upgrade_rc" -ne 0 ]; then
            exit "$upgrade_rc"
          fi
          ots info anchor-payload.canonical.json.ots > OTS-INFO.upgraded.txt 2>&1
          cat OTS-INFO.upgraded.txt
          grep -q 'BitcoinBlockHeaderAttestation' OTS-INFO.upgraded.txt
          echo "[OTS BITCOIN ATTESTATION PRESENT] upgraded proof contains BitcoinBlockHeaderAttestation"

      - name: Strictly verify upgraded OTS proof through dual-source Bitcoin RPC shim
        id: verify
        run: |
          set -euo pipefail
          proxy_trace="$GITHUB_WORKSPACE/ots-remote-verify/BITCOIN-RPC-PROXY.jsonl"
          proxy_stdout="$GITHUB_WORKSPACE/ots-remote-verify/BITCOIN-RPC-PROXY.stdout.txt"
          proxy_stderr="$GITHUB_WORKSPACE/ots-remote-verify/BITCOIN-RPC-PROXY.stderr.txt"
          python3 scripts/bitcoin_esplora_rpc_proxy.py \
            --host 127.0.0.1 \
            --port 18443 \
            --trace "$proxy_trace" \
            > "$proxy_stdout" 2> "$proxy_stderr" &
          proxy_pid=$!
          echo "[BITCOIN RPC PROXY START] pid=$proxy_pid providers=blockstream,mempool"
          cleanup_proxy() {
            if kill -0 "$proxy_pid" 2>/dev/null; then
              kill "$proxy_pid"
              wait "$proxy_pid" 2>/dev/null
            fi
          }
          trap cleanup_proxy EXIT
          python3 - <<'PY'
          import json,time,urllib.request
          url='http://127.0.0.1:18443/'
          last=None
          for attempt in range(1,31):
              try:
                  req=urllib.request.Request(
                      url,
                      data=json.dumps({'jsonrpc':'1.0','id':'preflight','method':'getblockcount','params':[]}).encode(),
                      headers={'Content-Type':'application/json'},
                      method='POST',
                  )
                  with urllib.request.urlopen(req,timeout=45) as r:
                      body=json.loads(r.read())
                  if body.get('error') is not None:
                      raise RuntimeError(body['error'])
                  height=body.get('result')
                  if not isinstance(height,int) or height < 963148:
                      raise RuntimeError(f'unexpected conservative Bitcoin tip: {height!r}')
                  print(f'[BITCOIN RPC PROXY PREFLIGHT PASS] conservative_tip={height} attempt={attempt}')
                  break
              except Exception as exc:
                  last=exc
                  print(f'[BITCOIN RPC PROXY PREFLIGHT RETRY] attempt={attempt} error={type(exc).__name__}: {exc}')
                  time.sleep(1)
          else:
              raise SystemExit(f'local Bitcoin RPC proxy never became healthy: {last}')
          PY
          cd ots-remote-verify/work
          echo "[OTS VERIFY START] rpc_source=dual_esplora_proxy:blockstream+mempool"
          set +e
          timeout 240 ots --bitcoin-node "http://127.0.0.1:18443/" verify anchor-payload.canonical.json.ots > OTS-VERIFY.stdout.txt 2> OTS-VERIFY.stderr.txt
          verify_rc=$?
          set -e
          echo "verify_rc=$verify_rc" >> "$GITHUB_OUTPUT"
          echo "[OTS VERIFY END] rc=$verify_rc"
          cat OTS-VERIFY.stdout.txt
          cat OTS-VERIFY.stderr.txt
          echo "[BITCOIN RPC PROXY TRACE]"
          cat "$proxy_trace"
          echo "[BITCOIN RPC PROXY STDOUT]"
          cat "$proxy_stdout"
          echo "[BITCOIN RPC PROXY STDERR]"
          cat "$proxy_stderr"
          if [ "$verify_rc" -ne 0 ]; then
            exit "$verify_rc"
          fi
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('.')
          text=(root/'OTS-VERIFY.stdout.txt').read_text(errors='replace')+(root/'OTS-VERIFY.stderr.txt').read_text(errors='replace')
          if 'Success! Bitcoin block' not in text:
              raise SystemExit('native ots verify returned zero without Bitcoin success transcript')
          print('[OTS STRICT BITCOIN VERIFY PASS] native OpenTimestamps verification returned zero with Bitcoin success transcript')
          PY

      - name: Build strict verification report
        if: success()
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_TAG: ${{ steps.source.outputs.source_tag }}
          ANCHOR_TAG: ${{ steps.source.outputs.anchor_tag }}
          CONFIRMATION_TAG: ${{ steps.source.outputs.confirmation_tag }}
          PROOF_BEFORE_SHA: ${{ steps.upgrade.outputs.proof_before_sha }}
          PROOF_AFTER_SHA: ${{ steps.upgrade.outputs.proof_after_sha }}
        run: |
          set -euo pipefail
          cd ots-remote-verify/work
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,re
          root=pathlib.Path('.')
          info=(root/'OTS-INFO.upgraded.txt').read_text(errors='replace')
          verify=(root/'OTS-VERIFY.stdout.txt').read_text(errors='replace')+(root/'OTS-VERIFY.stderr.txt').read_text(errors='replace')
          heights=sorted({int(x) for x in re.findall(r'BitcoinBlockHeaderAttestation\((\d+)\)',info)})
          success_blocks=sorted({int(x) for x in re.findall(r'Success! Bitcoin block (\d+)',verify)})
          if not heights or not success_blocks:
              raise SystemExit('strict verification report missing Bitcoin attestation/success block')
          report={
            'schema':'trinity-accord/chronicle-sidechain-ots-strict-bitcoin-verification/v1',
            'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),
            'source_commit_sha':os.environ['SOURCE_SHA'],
            'source_release_tag':os.environ['SOURCE_TAG'],
            'anchor_release_tag':os.environ['ANCHOR_TAG'],
            'confirmation_release_tag':os.environ['CONFIRMATION_TAG'],
            'rpc_source':'dual_esplora_proxy:blockstream+mempool',
            'rpc_consensus_rule':'exact block-hash and raw-header agreement; local double-SHA256 header-hash check',
            'upgrade_returncode':0,
            'verify_returncode':0,
            'bitcoin_verified':True,
            'bitcoin_attestation_heights':heights,
            'verified_success_blocks':success_blocks,
            'proof_before_sha256':os.environ['PROOF_BEFORE_SHA'],
            'upgraded_ots_sha256':os.environ['PROOF_AFTER_SHA'],
            'verify_transcript_sha256':hashlib.sha256(verify.encode()).hexdigest(),
            'boundary':'Strict native OpenTimestamps verification against a fail-closed local JSON-RPC shim backed by independent Blockstream and mempool.space Bitcoin mainnet header data. Confirmation applies only to the canonical sidechain v2 anchor payload.'
          }
          (root/'OTS-STRICT-BITCOIN-VERIFICATION.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          sha256sum \
            ANCHOR-REQUEST.json \
            anchor-payload.canonical.json \
            anchor-payload.canonical.json.ots \
            OTS-RECEIPT.json \
            OTS-INFO.upgraded.txt \
            OTS-UPGRADE.stdout.txt \
            OTS-UPGRADE.stderr.txt \
            OTS-VERIFY.stdout.txt \
            OTS-VERIFY.stderr.txt \
            OTS-STRICT-BITCOIN-VERIFICATION.json \
            ../BITCOIN-RPC-PROXY.jsonl \
            ../BITCOIN-RPC-PROXY.stdout.txt \
            ../BITCOIN-RPC-PROXY.stderr.txt > STRICT-BITCOIN-SHA256SUMS
          sha256sum -c STRICT-BITCOIN-SHA256SUMS

      - name: Publish immutable Bitcoin confirmation release
        if: github.event_name == 'push' && success()
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          CONFIRMATION_TAG: ${{ steps.source.outputs.confirmation_tag }}
        run: |
          set -euo pipefail
          cd ots-remote-verify/work
          if gh release view "$CONFIRMATION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "[BITCOIN CONFIRMATION ALREADY EXISTS] $CONFIRMATION_TAG"
            gh release download "$CONFIRMATION_TAG" --repo "$GITHUB_REPOSITORY" --dir existing-confirmation
            test -s existing-confirmation/OTS-STRICT-BITCOIN-VERIFICATION.json
            grep -q '"bitcoin_verified": true' existing-confirmation/OTS-STRICT-BITCOIN-VERIFICATION.json
            echo "[BITCOIN CONFIRMATION REVERIFIED] $CONFIRMATION_TAG"
          else
            gh release create "$CONFIRMATION_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "Chronicle sidechain OTS Bitcoin verification — ${SOURCE_SHA:0:12}" \
              --notes "Strict native OpenTimestamps verification succeeded for the canonical sidechain v2 anchor payload using a fail-closed local RPC shim requiring independent Blockstream and mempool.space agreement on Bitcoin mainnet block hashes and raw headers. The upgraded proof, verification transcript, proxy trace, and machine-readable report are preserved here. Non-amending." \
              anchor-payload.canonical.json \
              anchor-payload.canonical.json.ots \
              OTS-RECEIPT.json \
              OTS-INFO.upgraded.txt \
              OTS-UPGRADE.stdout.txt \
              OTS-UPGRADE.stderr.txt \
              OTS-VERIFY.stdout.txt \
              OTS-VERIFY.stderr.txt \
              OTS-STRICT-BITCOIN-VERIFICATION.json \
              STRICT-BITCOIN-SHA256SUMS \
              ../BITCOIN-RPC-PROXY.jsonl \
              ../BITCOIN-RPC-PROXY.stdout.txt \
              ../BITCOIN-RPC-PROXY.stderr.txt
            echo "[BITCOIN CONFIRMATION PUBLISHED] $CONFIRMATION_TAG"
          fi

      - name: Publish observable strict verification success
        if: github.event_name == 'push' && success()
        env:
          CONFIRMATION_TAG: ${{ steps.source.outputs.confirmation_tag }}
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          target="${run_url}#trinity-ots?state=bitcoin_verified&run=${GITHUB_RUN_ID}&upgrade_rc=0&verify_rc=0"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="$STATUS_CONTEXT" \
            -f description="strict OTS Bitcoin confirmation verified" \
            -f target_url="$target" >/dev/null
          echo "[OTS REMOTE VERIFY FINAL] state=success confirmation_tag=$CONFIRMATION_TAG run_id=$GITHUB_RUN_ID"

      - name: Publish observable strict verification failure
        if: github.event_name == 'push' && failure()
        run: |
          set -euo pipefail
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          target="${run_url}#trinity-ots?state=strict_verify_failure&run=${GITHUB_RUN_ID}"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context="$STATUS_CONTEXT" \
            -f description="strict OTS Bitcoin verification failed" \
            -f target_url="$target" >/dev/null
          echo "[OTS REMOTE VERIFY FAILURE] run_id=$GITHUB_RUN_ID"

      - name: Upload strict OTS verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chronicle-sidechain-ots-remote-verify-${{ github.run_id }}
          path: |
            ots-remote-verify/
            ${{ runner.temp }}/toolchain-provenance.json
          retention-days: 90
          if-no-files-found: warn
