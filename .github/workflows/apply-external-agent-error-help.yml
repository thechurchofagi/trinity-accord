name: Apply External-Agent Diagnostic Help

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/deep-audit-external-agent-intake-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "agent/deep-audit-external-agent-intake-20260803"
          git merge-base --is-ancestor 04bd17f8de251b9f9f3d2a445479004b689a9e21 HEAD

      - name: Set up Python and Node
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt

      - name: Apply fix and verify pinned bundle
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply_external_agent_error_help.py
          node --check downloads/record-chain-builder-core.mjs
          node --check downloads/record-chain-builder-recovery.mjs
          node --check downloads/record-chain-builder.mjs
          python -m json.tool api/record-chain-builder-bundles.v1.json >/dev/null
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path('api/record-chain-builder-bundles.v1.json').read_text())['canonical_builder']
          for path, sha, size in [
              ('downloads/record-chain-builder.mjs', m['sha256'], m['size_bytes']),
              ('downloads/record-chain-builder-recovery.mjs', m['recovery_wrapper']['sha256'], m['recovery_wrapper']['size_bytes']),
              ('downloads/record-chain-builder-core.mjs', m['core']['sha256'], m['core']['size_bytes']),
          ]:
              raw = Path(path).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == sha, path
              assert len(raw) == size, path
          print('PASS: three-layer Builder bundle pins')
          PY

      - name: Run focused external-agent tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="apps/record_chain_intake_gateway:." pytest -q \
            tests/test_external_agent_builder_resilience.py \
            apps/record_chain_intake_gateway/tests/test_external_agent_validation_contract.py

      - name: Run current system and complete suites
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_current_system_tests.py
          PYTHONPATH="apps/record_chain_intake_gateway:." pytest -q apps/record_chain_intake_gateway/tests
          PYTHONPATH="apps/record_chain_intake_gateway:." pytest -q tests

      - name: Commit product-only result
        shell: bash
        env:
          BRANCH: agent/deep-audit-external-agent-intake-20260803
        run: |
          set -euo pipefail
          rm -f .github/apply_external_agent_error_help.py
          rm -f .github/workflows/apply-external-agent-error-help.yml
          git config user.name "Trinity Audit Bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only --diff-filter=ACMR | grep -E '^\.github/(apply_external_agent_error_help\.py|workflows/apply-external-agent-error-help\.yml)$' || true)"
          test ! -e .github/apply_external_agent_error_help.py
          test ! -e .github/workflows/apply-external-agent-error-help.yml
          git commit -m "fix: document active external-agent diagnostics"
          git push origin "HEAD:${BRANCH}"
