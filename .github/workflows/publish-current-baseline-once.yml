name: Publish Current Baseline Once

on:
  push:
    branches: [main]
    paths:
      - preservation/current-baseline-publication-authorization-v1.json
      - .github/workflows/publish-current-baseline-once.yml
      - scripts/arweave_upload_homepage_snapshot.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK: ${{ vars.PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK }}
      ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Install locked Node dependencies
        run: npm ci

      - name: Inspect one-shot authorization
        id: auth
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = Path('preservation/current-baseline-publication-authorization-v1.json')
          a = json.loads(p.read_text())
          required = {
              'schema': 'trinityaccord.current-baseline-publication-authorization.v1',
              'sequence': 1,
              'authorized_by': 'thechurchofagi',
              'core_concept_doi': '10.5281/zenodo.21739343',
              'previous_core_version_doi': '10.5281/zenodo.21755827',
              'zenodo_rights_acknowledgement': 'TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED',
              'arweave_rights_acknowledgement': 'TRINITY_HOMEPAGE_SNAPSHOT_ARWEAVE_V1_APPROVED',
              'publication_confirmation': 'PUBLISH_TRINITY_CURRENT_BASELINE_V1',
              'non_amending_boundary': True,
              'live_main_equivalence_claimed': False,
          }
          for key, value in required.items():
              if a.get(key) != value:
                  raise SystemExit(f'authorization mismatch: {key}')
          if a.get('status') not in {'pending', 'prepared', 'consumed'}:
              raise SystemExit('invalid authorization status')
          print(f"status={a['status']}")
          PY

      - name: Stop after consumed authorization
        if: steps.auth.outputs.status == 'consumed'
        run: echo "Current-baseline publication already completed; no external write will run."

      - name: Prepare immutable publication state
        if: steps.auth.outputs.status == 'pending'
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          BASE_SHA="$base_sha" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          auth_path = Path('preservation/current-baseline-publication-authorization-v1.json')
          state_path = Path('preservation/repository-preservation-state-v2.json')
          index_path = Path('api/recovery-index.json')
          prepared_path = Path('preservation/current-baseline-publication-prepared-v1.json')
          auth = json.loads(auth_path.read_text())
          state = json.loads(state_path.read_text())
          index = json.loads(index_path.read_text())
          if state.get('latest_doi') != '10.5281/zenodo.21755827':
              raise SystemExit('authorized previous DOI is no longer current')
          previous = {
              'doi': state.get('latest_doi'),
              'record_id': state.get('latest_record_id'),
              'git_commit_sha': state.get('latest_git_commit_sha'),
              'package_identity_sha256': state.get('latest_package_identity_sha256'),
          }
          auth['status'] = 'prepared'
          auth['prepared_base_commit_sha'] = os.environ['BASE_SHA']
          state.update({
              'publication_status': 'prepared_for_current_baseline_publication',
              'prepared_base_commit_sha': os.environ['BASE_SHA'],
              'previous_verified_version': previous,
              'planned_homepage_arweave_snapshot': True,
              'live_main_equivalence_claimed': False,
          })
          index['publication_refresh'] = {
              'schema': auth['schema'], 'sequence': 1,
              'status': 'prepared_for_current_baseline_publication',
              'authorized_base_commit_sha': os.environ['BASE_SHA'],
              'previous_version_doi': auth['previous_core_version_doi'],
              'core_concept_doi': auth['core_concept_doi'],
              'homepage_arweave_snapshot_planned': True,
              'non_amending_boundary': True,
          }
          canonical = dict(index); canonical.pop('source_digest', None)
          index['source_digest'] = hashlib.sha256(json.dumps(canonical, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()).hexdigest()[:16]
          prepared = {
              'schema': 'trinityaccord.current-baseline-publication-prepared.v1',
              'sequence': 1, 'status': 'prepared',
              'base_commit_sha': os.environ['BASE_SHA'],
              'previous_version_doi': auth['previous_core_version_doi'],
              'core_concept_doi': auth['core_concept_doi'],
              'boundary': {'non_amending': True, 'bitcoin_originals_prevail': True, 'live_main_equivalence_claimed': False},
          }
          for path, value in ((auth_path, auth), (state_path, state), (index_path, index), (prepared_path, prepared)):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/current-baseline-publication-authorization-v1.json \
                  preservation/current-baseline-publication-prepared-v1.json \
                  preservation/repository-preservation-state-v2.json api/recovery-index.json
          git commit -m "archive: prepare current baseline publication v1"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          test "$pushed" = true

      - name: Resolve exact publication source
        if: steps.auth.outputs.status != 'consumed'
        id: source
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git checkout -B main origin/main
          source_sha="$(git log --format='%H' --fixed-strings --grep='archive: prepare current baseline publication v1' -1)"
          test -n "$source_sha"
          test "$(git show "$source_sha:preservation/current-baseline-publication-authorization-v1.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = prepared
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Build exact repository capsule
        if: steps.auth.outputs.status != 'consumed'
        run: |
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "${{ steps.source.outputs.sha }}" \
            --output-dir "$RUNNER_TEMP/current-baseline-capsule"

      - name: Prove local cold restore
        if: steps.auth.outputs.status != 'consumed'
        run: |
          python3 "$RUNNER_TEMP/current-baseline-capsule/restore-trinity-accord.py" \
            --deposit-dir "$RUNNER_TEMP/current-baseline-capsule" \
            --output-dir "$RUNNER_TEMP/local-restored"
          REPORT="$RUNNER_TEMP/local-restored/recovery-report.json" EXPECTED="${{ steps.source.outputs.sha }}" python3 - <<'PY'
          import json, os
          if json.load(open(os.environ['REPORT']))['source_git_commit_sha'] != os.environ['EXPECTED']:
              raise SystemExit('local restore source mismatch')
          PY

      - name: Enforce external publication credentials
        if: steps.auth.outputs.status != 'consumed'
        run: |
          test -n "$ZENODO_ACCESS_TOKEN"
          test "$PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK" = TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED
          test -n "$ARKEY"

      - name: Publish or reconcile Zenodo version
        if: steps.auth.outputs.status != 'consumed'
        id: zenodo
        run: |
          python3 scripts/publish_preservation_capsule_to_zenodo.py \
            --capsule-dir "$RUNNER_TEMP/current-baseline-capsule" \
            --state preservation/current-baseline-publish-work.json \
            --rights-boundary-ack "$PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK"

      - name: Prove public DOI-only cold restore
        if: steps.auth.outputs.status != 'consumed'
        run: |
          python3 "$RUNNER_TEMP/current-baseline-capsule/restore-trinity-accord.py" \
            --zenodo-record-id "${{ steps.zenodo.outputs.record_id }}" \
            --output-dir "$RUNNER_TEMP/public-restored"
          REPORT="$RUNNER_TEMP/public-restored/recovery-report.json" EXPECTED="${{ steps.source.outputs.sha }}" python3 - <<'PY'
          import json, os
          if json.load(open(os.environ['REPORT']))['source_git_commit_sha'] != os.environ['EXPECTED']:
              raise SystemExit('public restore source mismatch')
          PY

      - name: Build deterministic homepage and machine snapshot
        if: steps.auth.outputs.status != 'consumed'
        id: snapshot
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          VERSION_DOI: ${{ steps.zenodo.outputs.doi }}
        run: |
          python3 - <<'PY'
          import gzip, hashlib, io, json, os, re, subprocess, tarfile, urllib.request
          from pathlib import Path
          source = os.environ['SOURCE_SHA']; doi = os.environ['VERSION_DOI']
          paths = ['index.md','metadata.json','memory-seed.json','llms.txt','ai.txt','assets/css/trinity-home.css','assets/css/home-link-affordances.css','assets/css/home-editorial-doorway.css','api/links.json','api/agent-first-contact.json','api/recovery-index.json','preservation/repository-preservation-state-v2.json']
          root = Path(os.environ['RUNNER_TEMP']) / 'homepage-snapshot'; root.mkdir()
          files = []
          for name in paths:
              raw = subprocess.check_output(['git','show',f'{source}:{name}'])
              target = root / name; target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(raw)
              files.append({'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          marker = re.search(r'trinity-homepage-build[^>]+content=["\']([^"\']+)', (root/'index.md').read_text(), re.I)
          request = urllib.request.Request(f'https://www.trinityaccord.org/?preservation_source={source}', headers={'Cache-Control':'no-cache','User-Agent':'trinity-preservation/1.0'})
          live = urllib.request.urlopen(request, timeout=60).read()
          if not marker or marker.group(1).encode() not in live:
              raise SystemExit('live homepage build marker does not match source')
          (root/'rendered-homepage.html').write_bytes(live)
          files.append({'path':'rendered-homepage.html','bytes':len(live),'sha256':hashlib.sha256(live).hexdigest()})
          (root/'SOURCE-COMMIT.txt').write_text(source+'\n'); (root/'REPOSITORY-VERSION-DOI.txt').write_text(doi+'\n')
          manifest = {'schema':'trinityaccord.homepage-machine-snapshot.v1','source_git_commit_sha':source,'repository_version_doi':doi,'files':files,'boundary':{'mirror_only':True,'non_amending':True,'bitcoin_originals_prevail':True}}
          (root/'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n')
          checks = sorted(p for p in root.rglob('*') if p.is_file())
          (root/'checksums.sha256').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n' for p in checks))
          out = Path(os.environ['RUNNER_TEMP']) / f'trinity-homepage-machine-{source[:12]}.tar.gz'
          buffer = io.BytesIO()
          with tarfile.open(fileobj=buffer, mode='w') as tar:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  info = tar.gettarinfo(str(p), arcname=p.relative_to(root).as_posix()); info.mtime=0; info.uid=0; info.gid=0; info.uname=''; info.gname=''
                  with p.open('rb') as handle: tar.addfile(info, handle)
          with out.open('wb') as handle:
              with gzip.GzipFile(filename='', mode='wb', fileobj=handle, mtime=0) as gz: gz.write(buffer.getvalue())
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write(f'path={out}\nsha256={hashlib.sha256(out.read_bytes()).hexdigest()}\nbytes={out.stat().st_size}\n')
          PY

      - name: Enforce one-shot Arweave spend boundary
        if: steps.auth.outputs.status != 'consumed'
        run: |
          python3 - <<'PY'
          import datetime, json
          ledger = json.load(open('record-chain/arweave-wallet-ledger.json'))
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          paid = [e for e in ledger.get('entries',[]) if e.get('status') == 'paid' and str(e.get('paid_at',''))[:10] == today]
          if paid: raise SystemExit(f'{len(paid)} paid Arweave transaction(s) already recorded today')
          PY

      - name: Upload and verify Arweave snapshot
        if: steps.auth.outputs.status != 'consumed'
        env:
          NODE_OPTIONS: --import=./scripts/arweave_runtime_spend_guard.mjs
          ARWEAVE_DAILY_HOMEPAGE_SNAPSHOT_UPLOAD_LIMIT: "1"
          ARWEAVE_MINIMUM_REMAINING_AR: "0.25"
          ARWEAVE_MAX_PAYLOAD_BYTES: "8388608"
          ARWEAVE_MAX_TRANSACTION_REWARD_AR: "0.05"
          ARWEAVE_ROLLING_30_DAY_SPEND_LIMIT_AR: "0.50"
          ARWEAVE_READBACK_MAX_RETRIES: "30"
          ARWEAVE_READBACK_DELAY_MS: "10000"
          ARWEAVE_READBACK_MAX_SECONDS: "420"
        run: |
          node scripts/arweave_upload_homepage_snapshot.mjs \
            --payload "${{ steps.snapshot.outputs.path }}" \
            --out "$RUNNER_TEMP/homepage-arweave-receipt.json" \
            --source-sha "${{ steps.source.outputs.sha }}" \
            --doi "${{ steps.zenodo.outputs.doi }}"
          python3 scripts/record_arweave_upload_result.py \
            --upload-result-json "$RUNNER_TEMP/homepage-arweave-receipt.json" \
            --kind homepage_machine_snapshot \
            --source-path "${{ steps.snapshot.outputs.path }}"
          python3 scripts/generate_arweave_wallet_status.py

      - name: Seal verified publication state
        if: steps.auth.outputs.status != 'consumed'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = os.environ['SOURCE_SHA']
          authp=Path('preservation/current-baseline-publication-authorization-v1.json'); statep=Path('preservation/repository-preservation-state-v2.json'); workp=Path('preservation/current-baseline-publish-work.json'); prep=Path('preservation/current-baseline-publication-prepared-v1.json'); indexp=Path('api/recovery-index.json')
          auth=json.loads(authp.read_text()); old=json.loads(statep.read_text()); published=json.loads(workp.read_text()); recovery=json.load(open(os.environ['RUNNER_TEMP']+'/public-restored/recovery-report.json')); ar=json.load(open(os.environ['RUNNER_TEMP']+'/homepage-arweave-receipt.json')); index=json.loads(indexp.read_text())
          if auth.get('status') != 'prepared': raise SystemExit('authorization not prepared')
          if published.get('latest_git_commit_sha') != source or published.get('latest_doi') == auth.get('previous_core_version_doi'): raise SystemExit('Zenodo version mismatch')
          if recovery.get('result') != 'pass' or recovery.get('source_git_commit_sha') != source: raise SystemExit('public cold restore mismatch')
          if ar.get('result') != 'uploaded' or ar.get('hash_match') is not True or ar.get('source_git_commit_sha') != source or ar.get('repository_version_doi') != published.get('latest_doi'): raise SystemExit('Arweave receipt mismatch')
          previous = old.get('previous_verified_version')
          final=dict(old); final.update(published); final.update({'schema':'trinityaccord.repository-preservation-zenodo-state.v2','publication_status':'published_and_publicly_restored','source_baseline_commit_sha':source,'public_download_verification':'passed','public_metadata_verification':'passed','public_cold_restore':'passed','public_cold_restore_report':recovery,'homepage_machine_snapshot_arweave':ar,'previous_verified_version':previous,'github_required_for_discovery':False,'github_required_for_repository_recovery':False,'live_main_equivalence_claimed':False,'coverage_scope':'exact Git-tracked publication baseline named by latest_git_commit_sha'})
          auth.update({'status':'consumed','published_source_baseline_commit_sha':source,'published_record_id':published.get('latest_record_id'),'published_doi':published.get('latest_doi'),'published_package_identity_sha256':published.get('latest_package_identity_sha256'),'homepage_snapshot_arweave_txid':ar.get('txid'),'homepage_snapshot_sha256':ar.get('payload_sha256')})
          prepared=json.loads(prep.read_text()); prepared.update({'status':'published_verified','source_git_commit_sha':source,'version_doi':published.get('latest_doi'),'arweave_txid':ar.get('txid')})
          observation={'schema':'trinityaccord.current-baseline-publication-observation.v1','status':'passed','source_git_commit_sha':source,'version_doi':published.get('latest_doi'),'concept_doi':published.get('concept_doi'),'zenodo_record_id':published.get('latest_record_id'),'zenodo_package_identity_sha256':published.get('latest_package_identity_sha256'),'public_cold_restore':'passed','arweave_txid':ar.get('txid'),'arweave_payload_sha256':ar.get('payload_sha256'),'arweave_readback_sha256':ar.get('readback_sha256'),'boundary':{'non_amending':True,'bitcoin_originals_prevail':True,'repository_doi_is_exact_baseline_not_live_main':True,'homepage_arweave_snapshot_is_mirror_only':True}}
          index['publication_refresh']={'schema':auth['schema'],'sequence':1,'status':'published_verified_and_consumed','source_git_commit_sha':source,'version_doi':published.get('latest_doi'),'core_concept_doi':published.get('concept_doi'),'arweave_txid':ar.get('txid'),'arweave_payload_sha256':ar.get('payload_sha256'),'non_amending_boundary':True}
          canonical=dict(index); canonical.pop('source_digest',None); index['source_digest']=hashlib.sha256(json.dumps(canonical,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()[:16]
          for p,v in ((statep,final),(authp,auth),(prep,prepared),(Path('preservation/current-baseline-publication-observation-v1.json'),observation),(indexp,index)): p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n')
          workp.unlink()
          PY

      - name: Commit verified DOI and Arweave state
        if: steps.auth.outputs.status != 'consumed'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/current-baseline-publication-authorization-v1.json \
                  preservation/current-baseline-publication-prepared-v1.json \
                  preservation/current-baseline-publication-observation-v1.json \
                  preservation/repository-preservation-state-v2.json \
                  record-chain/arweave-wallet-ledger.json \
                  api/arweave-wallet-status.json api/recovery-index.json
          git commit -m "archive: record current baseline DOI and Arweave snapshot"
          pushed=false
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          test "$pushed" = true

      - name: Upload proof artifacts
        if: always() && steps.auth.outputs.status != 'consumed'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-baseline-publication-proof
          path: |
            ${{ runner.temp }}/local-restored/recovery-report.json
            ${{ runner.temp }}/public-restored/recovery-report.json
            ${{ runner.temp }}/homepage-arweave-receipt.json
            ${{ runner.temp }}/toolchain-provenance.json
            ${{ steps.snapshot.outputs.path }}
          retention-days: 365
          if-no-files-found: warn
