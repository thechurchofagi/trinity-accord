name: Museum design review
on:
  pull_request:
    paths: ['museum/**', '.github/workflows/museum-design-review.yml']
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    env:
      MUSEUM_QA_VIEWPORT: ${{ matrix.viewport }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: museum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install browser inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify scene, collision routes and released assets
        run: |
          python museum/scripts/validate.py
          node museum/scripts/check_spatial_layout.mjs
          node museum/scripts/check_walking_continuity.mjs
          node museum/scripts/check_guided_visit.mjs
      - name: Render production rooms and selected objects
        env:
          MUSEUM_QA_OUTPUT: ${{ runner.temp }}/museum-design
        run: python museum/scripts/check_design_review.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: museum-design-${{ matrix.viewport }}-${{ github.run_id }}
          path: ${{ runner.temp }}/museum-design
          retention-days: 14
