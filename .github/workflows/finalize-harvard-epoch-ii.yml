name: Finalize Harvard Preservation Epoch II

on:
  pull_request:
    paths:
      - .github/workflows/finalize-harvard-epoch-ii.yml
      - .github/harvard-epoch-ii-finalize-resume-v5
      - scripts/upload_harvard_epoch_ii.py
      - tests/test_upload_harvard_epoch_ii.py
      - preservation/epoch-ii/frozen/**
  push:
    branches: [main]
    paths:
      - .github/harvard-epoch-ii-finalize-resume-v5

permissions:
  actions: read
  contents: read

concurrency:
  group: harvard-preservation-epoch-ii-dvn-w9y3iv
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  MANIFEST: preservation/epoch-ii/frozen/DATASET-MANIFEST.json
  HARVARD_SUMS: preservation/epoch-ii/frozen/HARVARD-EPOCH-II-SHA256SUMS

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Verify immutable finalization-only contract
        run: |
          set -euo pipefail
          test "$(cat .github/harvard-epoch-ii-finalize-resume-v5)" = \
            "Harvard Preservation Epoch II finalization-only resume authorized using immutable PASS receipts from run 34706525207: doi:10.7910/DVN/W9Y3IV dataset-id=14229992 files=419"
          python3 -m unittest tests.test_upload_harvard_epoch_ii

  finalize-from-immutable-receipts:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout operational controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance-final-v5.json"
      - name: Download and verify immutable PASS receipt artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zips" "$RUNNER_TEMP/receipts"
          while read -r artifact_id digest artifact_name; do
            zip_path="$RUNNER_TEMP/zips/${artifact_name}.zip"
            curl --fail --location --retry 5 \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${artifact_id}/zip" \
              -o "$zip_path"
            echo "${digest}  ${zip_path}" | sha256sum -c -
            unzip -q -o "$zip_path" -d "$RUNNER_TEMP/receipts"
          done <<'ARTIFACTS'
          10302016244 50921f3a9b116b8a498b05996363436895462d69f3f296b1417a5b89c59420c1 epoch-ii-receipt-repository
          10302400831 0b044fadf59ea8f8dbdd31d9bdf251392419de303321ad1e34fd6221adce6e58 epoch-ii-receipt-release-0
          10301941869 214f2c76a39ceae037f255ecd99919e130946fda6bbf0e46f577a48a14802cee epoch-ii-receipt-release-1
          10302865065 b49b4b4a2b5d98e7fc14eea71e528c7aaadbfdc2623693db39c89b7de625069a epoch-ii-receipt-release-2
          10302042114 f8945cabd15029f177ddac132df7b2d630c6779c146d8649ca2f1f13c7fc0a88 epoch-ii-receipt-release-4
          10302252081 d911168f3ea8b40ed456b50a12ed6964d162cecabe172dcb53c19306a7e85e99 epoch-ii-receipt-release-5
          10302382205 1a34386e4fa7509e90a5a297d2770a06a8343950c8b6325fd16add4ad3374634 epoch-ii-receipt-release-6
          10302471189 cf425e371d4b2a52d33286a66cdb74a1883c2dbafb8e7803b0759121a27056e8 epoch-ii-receipt-release-7
          10301992875 8f108195d8f65ea7d2b31874eef148be4b25b52ba22bd1ff8c546c2428069735 epoch-ii-receipt-reused-successes
          ARTIFACTS
          test -f "$RUNNER_TEMP/receipts/reused-receipts/cold-recovery.json"
      - name: Verify 419-file closure and submit exactly once
        run: |
          set -euo pipefail
          python3 scripts/upload_harvard_epoch_ii.py \
            --manifest "$MANIFEST" --sums "$HARVARD_SUMS" finalize \
            --receipt-dir "$RUNNER_TEMP/receipts" \
            --cold-receipt "$RUNNER_TEMP/receipts/reused-receipts/cold-recovery.json" \
            --final-receipt "$RUNNER_TEMP/final-submission-receipt.json"
      - name: Preserve final submission receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epoch-ii-final-submission-receipt-v5
          path: |
            ${{ runner.temp }}/final-submission-receipt.json
            ${{ runner.temp }}/toolchain-provenance-final-v5.json
          retention-days: 90
          if-no-files-found: error
