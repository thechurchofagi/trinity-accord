name: Probe Beacon History

on:
  push:
    branches: [agent/ethereum-l2-l3-proofs-v1]
    paths:
      - ".github/workflows/probe-beacon-history.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe historical Beacon headers
        shell: bash
        run: |
          set +e
          slot=12525702
          for base in \
            https://ethereum-beacon-api.publicnode.com \
            https://lodestar-mainnet.chainsafe.io \
            https://eth-beacon.blockreq.com/v1/rpc/public \
            https://docs-demo.quiknode.pro \
            https://mainnet-checkpoint-sync.attestant.io
          do
            echo "=== $base ==="
            code=$(curl -L -sS --connect-timeout 10 --max-time 20 -o /tmp/out.json -w '%{http_code}' "$base/eth/v1/beacon/headers/$slot")
            echo "HTTP $code"
            python3 -c 'import json; d=json.load(open("/tmp/out.json")); x=d.get("data",{}); print("root=",x.get("root") if isinstance(x,dict) else None,"canonical=",x.get("canonical") if isinstance(x,dict) else None,"slot=",x.get("header",{}).get("message",{}).get("slot") if isinstance(x,dict) else None,"raw=",str(d)[:300])' || head -c 500 /tmp/out.json
            echo
          done
