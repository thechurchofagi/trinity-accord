name: Encrypted Literary Capsule Preservation
on:
  push:
    branches: [main]
    paths:
      - literary-capsules/yuhui-v1/AUTHORIZATION.json
      - .github/workflows/encrypted-literary-capsule.yml
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false
jobs:
  preserve:
    if: github.repository == 'thechurchofagi/trinity-accord' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BATCH: literary-capsules/yuhui-v1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1
          show-progress: false
      - name: Verify public allowlist and completion
        id: state
        run: |
          python3 scripts/literary_capsule_preserve.py validate
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['BATCH'])/'status.json'
          done=p.exists() and json.loads(p.read_text()).get('state')=='ARWEAVE_READBACK_PASS'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'done={str(done).lower()}\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.state.outputs.done != 'true'
        with:
          python-version: '3.11'
      - name: Install existing pinned proof client
        if: steps.state.outputs.done != 'true'
        run: python3 -m pip install -r requirements-ots.txt
      - name: Submit or upgrade exact manifest proof
        id: ots
        if: steps.state.outputs.done != 'true'
        env:
          OTS_BITCOIN_NODE_URL: http://127.0.0.1:18443/
        run: |
          python3 scripts/bitcoin_esplora_rpc_proxy.py --host 127.0.0.1 --port 18443 --trace "$RUNNER_TEMP/yuhui-ots-proxy.jsonl" --timeout 20 > "$RUNNER_TEMP/yuhui-ots-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          python3 scripts/literary_capsule_preserve.py prepare
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.ots.outputs.ready == 'true'
        with:
          node-version-file: .node-version
      - name: Install existing guarded uploader
        if: steps.ots.outputs.ready == 'true'
        run: npm ci
      - name: Checkpoint verified payload and paid intent
        if: steps.ots.outputs.ready == 'true'
        run: |
          python3 scripts/literary_capsule_preserve.py intent
          git config user.name 'trinity-ots-bot'
          git config user.email 'actions@github.com'
          git add "$BATCH"
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint encrypted Yu Hui proof and paid preservation intent'
            git push origin HEAD:main
          fi
      - name: Upload ciphertext and verified proofs with existing wallet guards
        if: steps.ots.outputs.ready == 'true'
        env:
          ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
          NODE_OPTIONS: --import=./scripts/arweave_runtime_spend_guard.mjs
          ARWEAVE_MAX_TRANSACTION_REWARD_AR: '0.01'
          ARWEAVE_MINIMUM_REMAINING_AR: '0.25'
          ARWEAVE_ROLLING_30_DAY_SPEND_LIMIT_AR: '0.50'
          ARWEAVE_MAX_PAYLOAD_BYTES: '1048576'
          ARWEAVE_READBACK_MAX_SECONDS: '420'
          ARWEAVE_HTTP_TIMEOUT_MS: '30000'
        run: python3 scripts/literary_capsule_preserve.py upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.state.outputs.done != 'true'
        with:
          name: yuhui-encrypted-preservation-${{ github.run_id }}
          path: |
            literary-capsules/yuhui-v1/
            ${{ runner.temp }}/yuhui-ots-proxy.jsonl
          retention-days: 90
          if-no-files-found: error
      - name: Persist public proofs and exact transaction receipts
        if: always() && steps.state.outputs.done != 'true'
        run: |
          git config user.name 'trinity-ots-bot'
          git config user.email 'actions@github.com'
          git add "$BATCH" record-chain/arweave-wallet-ledger.json api/arweave-wallet-status.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record encrypted Yu Hui preservation progress'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo 'Recover retained transaction artifacts before any repeated paid attempt.' >&2
          exit 1
