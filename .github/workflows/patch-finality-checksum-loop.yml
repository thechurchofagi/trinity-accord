name: One-shot Finality Checksum Loop Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-finality-checksum-loop.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact minimal patch and self-remove
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/chronicle-sidechain-finality-proof.yml')
          s = p.read_text()
          old = '            for path in *; do\n              [[ -f "$path" && "$path" != COLD-VERIFICATION.json ]] && sha256sum "$path"\n            done\n'
          new = '            for path in *; do\n              if [[ -f "$path" && "$path" != COLD-VERIFICATION.json ]]; then\n                sha256sum "$path"\n              fi\n            done\n'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one checksum-loop target, found {count}')
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/patch-finality-checksum-loop.yml
          git diff --check
          grep -F 'if [[ -f "$path" && "$path" != COLD-VERIFICATION.json ]]; then' .github/workflows/chronicle-sidechain-finality-proof.yml
          if grep -F '[[ -f "$path" && "$path" != COLD-VERIFICATION.json ]] && sha256sum "$path"' .github/workflows/chronicle-sidechain-finality-proof.yml; then
            echo 'old unsafe checksum loop still present' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/chronicle-sidechain-finality-proof.yml .github/workflows/patch-finality-checksum-loop.yml
          git commit -m 'Fix finality cold-receipt checksum loop [skip actions]'
          git push origin HEAD:main
