name: Apply Weekly Continuity Follow-up

on:
  push:
    branches:
      - feat/weekly-continuity-archive-zenodo
    paths:
      - .github/workflows/apply-weekly-continuity-followup.yml

permissions:
  contents: write

concurrency:
  group: weekly-continuity-followup
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.repository == 'thechurchofagi/trinity-accord' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: feat/weekly-continuity-archive-zenodo

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install current test dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Apply reviewed follow-up patch
        run: python3 scripts/apply_weekly_continuity_followup.py

      - name: Regenerate current heartbeat and public status semantics
        run: |
          set -euo pipefail
          python3 scripts/generate_waiting_heartbeat_status.py
          python3 scripts/update_public_generated_artifacts.py
          python3 scripts/generate_public_home_status.py --check
          python3 scripts/trinity_record_chain.py verify

      - name: Run focused weekly-continuity contracts
        run: |
          set -euo pipefail
          python3 scripts/test_record_chain_data_arweave_archive_contract.py
          python3 scripts/test_native_ots_upgrade_workflow_contract.py
          python3 scripts/test_native_ots_complete_staging_contract.py
          python3 -m pytest -q \
            tests/test_arweave_cost_boundaries.py \
            tests/test_weekly_continuity_archive_contract.py

      - name: Commit final implementation and remove temporary patch machinery
        run: |
          set -euo pipefail
          rm .github/workflows/apply-weekly-continuity-followup.yml
          rm scripts/apply_weekly_continuity_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align weekly continuity contracts and status semantics"
          git push origin HEAD:feat/weekly-continuity-archive-zenodo
