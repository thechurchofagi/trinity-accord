name: Bootstrap Recovery Test Fixture

on:
  push:
    branches:
      - agent/harden-submission-recovery-terminal-status

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/harden-submission-recovery-terminal-status
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Update legacy success fixture to a fully valid terminal state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_record_chain_submit_recovery.py')
          text = path.read_text(encoding='utf-8')
          old_import = '''def test_read_only_recovery_verifies_index_receipt_and_stored_submission(monkeypatch):
              from apps.record_chain_intake_gateway import secure_entrypoint
          '''
          new_import = '''def test_read_only_recovery_verifies_index_receipt_and_stored_submission(monkeypatch):
              from apps.record_chain_intake_gateway import app as core_gateway
              from apps.record_chain_intake_gateway import secure_entrypoint
          '''
          if text.count(old_import) != 1:
              raise SystemExit('expected one recovery success-test import block')
          text = text.replace(old_import, new_import)

          old_status = '''    final_status = {
                  "schema": "trinityaccord.record-chain-receipt-final-status.v1",
                  "receipt_id": index["receipt_id"],
                  "pending_file_path": index["pending_file_path"],
                  "append_status": "appended",
                  "final_record_id": "R-000000109",
              }
          '''
          new_status = '''    final_record_path = "record-chain/records/R-000000109.json"
              final_record = {
                  "record_id": "R-000000109",
                  "record_type": "verification",
                  "body": "verified recovery fixture",
              }
              final_record["record_sha256"] = core_gateway._record_chain_record_sha256(
                  final_record
              )
              final_status = {
                  "schema": "trinityaccord.record-chain-receipt-final-status.v1",
                  "receipt_id": index["receipt_id"],
                  "pending_file_path": index["pending_file_path"],
                  "append_status": "appended",
                  "final_record_id": "R-000000109",
                  "final_record_path": final_record_path,
                  "final_record_sha256": final_record["record_sha256"],
                  "rejection_path": None,
                  "rejection_code": None,
              }
          '''
          if text.count(old_status) != 1:
              raise SystemExit('expected one incomplete recovery terminal fixture')
          text = text.replace(old_status, new_status)

          old_mapping_end = '''        f"record-chain/receipt-status/{index['receipt_id']}.json": json.dumps(
                      final_status,
                      separators=(",", ":"),
                      sort_keys=True,
                  ),
              }
          '''
          new_mapping_end = '''        f"record-chain/receipt-status/{index['receipt_id']}.json": json.dumps(
                      final_status,
                      separators=(",", ":"),
                      sort_keys=True,
                  ),
                  final_record_path: json.dumps(
                      final_record,
                      separators=(",", ":"),
                      sort_keys=True,
                  ),
              }
          '''
          if text.count(old_mapping_end) != 1:
              raise SystemExit('expected one recovery success mapping block')
          text = text.replace(old_mapping_end, new_mapping_end)

          old_patch = '''    monkeypatch.setattr(secure_entrypoint, "get_file_text", fake_get_file_text)
              status, payload = asyncio.run(
          '''
          new_patch = '''    monkeypatch.setattr(secure_entrypoint, "get_file_text", fake_get_file_text)
              monkeypatch.setattr(core_gateway, "get_file_text", fake_get_file_text)
              status, payload = asyncio.run(
          '''
          # The same shallow patch line appears in several tests; change only the
          # first occurrence, which belongs to this success fixture.
          if old_patch not in text:
              raise SystemExit('expected recovery reader patch point')
          text = text.replace(old_patch, new_patch, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run recovery and current-system regressions
        env:
          TRINITY_GITHUB_TOKEN: test-only-placeholder
          TRINITY_REPO_FULL_NAME: test/repo
          PYTHONPATH: apps/record_chain_intake_gateway:.
        run: |
          python3 -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt
          python3 -m pytest -q \
            tests/test_record_chain_submit_recovery.py \
            apps/record_chain_intake_gateway/tests/test_secure_recovery_terminal_validation.py \
            apps/record_chain_intake_gateway/tests/test_deep_transaction_recovery.py
      - name: Commit updated permanent fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_record_chain_submit_recovery.py
          git commit -m "test: require complete recovery terminal fixture"
          git push origin HEAD:agent/harden-submission-recovery-terminal-status
