name: Live Core Entry Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-core-entry-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"

      - name: Verify deployed site matches repository
        run: python3 scripts/check_deployment_freshness.py --site https://www.trinityaccord.org --timeout 45

      - name: Verify human entry pages, Gateway, and Builder manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request

          SITE = "https://www.trinityaccord.org"
          pages = {
              "/": ["The Trinity Accord", "For AI agents: First Contact"],
              "/agent-first-contact/": ["Current phase: production live", "Use the canonical Builder only"],
              "/agent-start/": ["Required Builder flow", "Guardian Application"],
              "/agent-echo/": ["Echo is one current Record-Chain record type", "record-chain-builder.mjs echo"],
              "/verify/": ["Current digital profiles", "Legacy mapping"],
              "/guardian-join/": ["Current product decision: application intake only", "guardian-application"],
              "/agent-record-chain-guidance/": ["Current verification model", "Retired active guidance"],
          }

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "TrinityLiveCoreEntryValidation/1.0",
                  "Cache-Control": "no-cache, no-store, max-age=0",
                  "Pragma": "no-cache",
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = response.read()
                  if response.status != 200:
                      raise RuntimeError(f"GET {url} returned {response.status}")
                  return body

          for path, markers in pages.items():
              text = get(SITE + path + "?validation=20260728").decode("utf-8", errors="replace")
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  raise RuntimeError(f"{path} missing markers: {missing}")
              print(f"ENTRY {path}: PASS")

          contract = json.loads(get(SITE + "/api/record-chain-intake-gateway.v1.json?validation=20260728"))
          gateway = contract["base_url"].rstrip("/")
          endpoints = contract["endpoints"]
          assert endpoints["preflight"]["path"] == "/record-chain/preflight"
          assert endpoints["submit"]["path"] == "/record-chain/submit"
          assert endpoints["health"]["path"] == "/healthz"
          assert endpoints["readiness"]["path"] == "/record-chain/readiness"

          for path in ("/healthz", "/record-chain/readiness"):
              data = json.loads(get(gateway + path))
              print(f"GATEWAY {path}: PASS {json.dumps(data, ensure_ascii=False)[:500]}")

          manifest = json.loads(get(SITE + "/api/record-chain-builder-bundles.v1.json?validation=20260728"))
          spec = manifest["canonical_builder"]
          builder = get(SITE + spec["url"] + "?validation=20260728")
          actual_sha = hashlib.sha256(builder).hexdigest()
          assert len(builder) == spec["size_bytes"], (len(builder), spec["size_bytes"])
          assert actual_sha == spec["sha256"], (actual_sha, spec["sha256"])
          required = {"echo", "verification", "guardian_application", "preflight", "submit", "ed25519_authorship_proof"}
          assert required.issubset(set(spec["supports"]))
          print(f"BUILDER: PASS sha256={actual_sha} size={len(builder)}")
          print("HTTP methods in this step: GET only")
          PY

      - name: Validate participant-generated readback bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open("tmp/live-core-contextual-readbacks.json", encoding="utf-8"))
          assert p["schema"] == "trinityaccord.contextual-oath-readback-bundle.v1"
          assert set(p["readbacks"]) == {"echo", "verification", "guardian_application"}
          print("Participant-generated readback bundle is present for all three core routes.")
          PY

      - name: Run three live signed core preflights
        run: |
          python3 scripts/smoke_live_external_agent_three_core_preflight.py \
            --site https://www.trinityaccord.org \
            --readback-bundle tmp/live-core-contextual-readbacks.json \
            --timeout 120
          echo "Production submit requests issued: 0"
          echo "Production writes issued: 0"
