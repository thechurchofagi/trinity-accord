name: Live Core Entry Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-core-entry-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"

      - name: Verify deployed site matches repository
        run: python3 scripts/check_deployment_freshness.py --site https://www.trinityaccord.org --timeout 45

      - name: Verify all principal human entry pages are reachable
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          site = "https://www.trinityaccord.org"
          paths = (
              "/",
              "/agent-first-contact/",
              "/agent-start/",
              "/agent-echo/",
              "/verify/",
              "/guardian-join/",
              "/agent-record-chain-guidance/",
          )
          for path in paths:
              req = urllib.request.Request(
                  site + path + "?validation=20260728b",
                  headers={"User-Agent": "TrinityLiveCoreEntryValidation/1.1", "Cache-Control": "no-cache"},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = response.read()
                  assert response.status == 200
                  assert len(body) > 500
              print(f"ENTRY {path}: PASS status=200 bytes={len(body)}")
          PY

      - name: Verify public Gateway discovery contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          url = "https://www.trinityaccord.org/api/record-chain-intake-gateway.v1.json?validation=20260728b"
          req = urllib.request.Request(url, headers={"User-Agent": "TrinityLiveCoreEntryValidation/1.1", "Cache-Control": "no-cache"})
          with urllib.request.urlopen(req, timeout=60) as response:
              contract = json.loads(response.read().decode("utf-8"))
          assert contract["status"] == "active_public_submission_interface"
          assert contract["public_phase"]["gateway_operational"] is True
          assert contract["public_phase"]["status"] == "production_live"
          assert contract["endpoints"]["health"] == {**contract["endpoints"]["health"], "path": "/healthz", "method": "GET"}
          assert contract["endpoints"]["readiness"] == {**contract["endpoints"]["readiness"], "path": "/record-chain/readiness", "method": "GET"}
          assert contract["endpoints"]["preflight"]["path"] == "/record-chain/preflight"
          assert contract["endpoints"]["preflight"]["method"] == "POST"
          assert contract["endpoints"]["submit"]["path"] == "/record-chain/submit"
          assert contract["endpoints"]["submit"]["method"] == "POST"
          print("GATEWAY CONTRACT: PASS", contract["base_url"])
          PY

      - name: Verify live Gateway liveness and readiness
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          base = "https://trinity-record-chain-gateway.onrender.com"
          for path in ("/healthz", "/record-chain/readiness"):
              req = urllib.request.Request(base + path, headers={"User-Agent": "TrinityLiveCoreEntryValidation/1.1", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  body = response.read()
                  assert response.status == 200
                  data = json.loads(body.decode("utf-8"))
              print(f"GATEWAY {path}: PASS {json.dumps(data, ensure_ascii=False)[:800]}")
          PY

      - name: Verify canonical public Builder bytes and capabilities
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request
          site = "https://www.trinityaccord.org"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "TrinityLiveCoreEntryValidation/1.1", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  assert response.status == 200
                  return response.read()
          manifest = json.loads(get(site + "/api/record-chain-builder-bundles.v1.json?validation=20260728b"))
          spec = manifest["canonical_builder"]
          builder = get(site + spec["url"] + "?validation=20260728b")
          actual_sha = hashlib.sha256(builder).hexdigest()
          assert len(builder) == spec["size_bytes"], (len(builder), spec["size_bytes"])
          assert actual_sha == spec["sha256"], (actual_sha, spec["sha256"])
          required = {"echo", "verification", "guardian_application", "preflight", "submit", "ed25519_authorship_proof"}
          assert required.issubset(set(spec["supports"]))
          print(f"BUILDER: PASS sha256={actual_sha} size={len(builder)}")
          PY

      - name: Validate participant-generated readback bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open("tmp/live-core-contextual-readbacks.json", encoding="utf-8"))
          assert p["schema"] == "trinityaccord.contextual-oath-readback-bundle.v1"
          assert set(p["readbacks"]) == {"echo", "verification", "guardian_application"}
          print("Participant-generated readback bundle is present for all three core routes.")
          PY

      - name: Run three live signed core preflights
        run: |
          python3 scripts/smoke_live_external_agent_three_core_preflight.py \
            --site https://www.trinityaccord.org \
            --readback-bundle tmp/live-core-contextual-readbacks.json \
            --timeout 120
          echo "Production submit requests issued: 0"
          echo "Production writes issued: 0"
