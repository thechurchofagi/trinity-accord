name: Publish RT-TH v1.0.0 DOI-embedded preprint
on:
  push:
    branches: [research/rt-paper-v1-0-0-20261009]
    paths:
      - research/task-relative-continuity/PUBLISH-AUTHORIZATION.json
permissions:
  contents: write
concurrency:
  group: rt-th-v100-zenodo-create-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[rt-th-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/rt-paper-v1-0-0-20261009
          fetch-depth: 1
          persist-credentials: true
      - name: Authorize exact scope, PDF source and immutable reproduction ZIP
        shell: python
        run: |
          import json, pathlib,hashlib
          root=pathlib.Path('research/task-relative-continuity')
          auth=json.loads((root/'PUBLISH-AUTHORIZATION.json').read_text())
          assert auth['authorized'] is True and auth['report']=='RT20261009' and auth['version']=='1.0.0'
          assert auth['publication_kind']=='new-independent-preprint'
          for name,(digest,size) in auth['inputs'].items():
              b=(root/name).read_bytes()
              assert (hashlib.sha256(b).hexdigest(),len(b))==(digest,size)
          assert auth['doi_handling']=='reserve-first-inject-into-published-markdown-and-pdf-before-publish'
          print('AUTHOR_DIRECTED_RT_TH_INPUTS_VERIFIED')
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex fonts-dejavu-core poppler-utils
      - name: Verify immutable source and DOI-injection template without secrets
        run: |
          python3 research/task-relative-continuity/publication.py verify
          python3 research/task-relative-continuity/publication.py preview
      - name: Create one Zenodo DOI, embed real DOI in final PDF, publish and anonymously verify all bytes
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/task-relative-continuity/publication.py publish
      - name: Preserve exact draft and publication state even on failure
        if: always()
        run: python3 research/task-relative-continuity/publication.py persist
      - name: Retain frozen published bytes, DOI and error diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rt-th-v1-0-0-publication-${{ github.run_id }}
          path: |
            research/task-relative-continuity/create-intent.json
            research/task-relative-continuity/deposit.json
            research/task-relative-continuity/create-uncertain.json
            research/task-relative-continuity/publish-intent.json
            research/task-relative-continuity/publish-uncertain.json
            research/task-relative-continuity/publication-error.json
            research/task-relative-continuity/EXPECTED-PUBLICATION.json
            research/task-relative-continuity/format-checks.json
            research/task-relative-continuity/publication-record.json
            research/task-relative-continuity/published/
          retention-days: 90
          if-no-files-found: warn
