name: Publish RT/TH exact DOI-linked preprint
on:
  push:
    branches: [research/rt-th-task-relative-continuity-v1-20261009]
    paths:
      - research/task-relative-continuity/PUBLISH-AUTHORIZATION.json
permissions:
  contents: write
concurrency:
  group: rt-th-20261009-zenodo-create-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[rt-th-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout specific publication branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/rt-th-task-relative-continuity-v1-20261009
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify authorization and original source before using secret
        shell: bash
        run: |
          python3 -m py_compile research/task-relative-continuity/publication.py
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('research/task-relative-continuity')
          a=json.loads((root/'PUBLISH-AUTHORIZATION.json').read_text())
          s=(root/'source-main.md').read_bytes()
          assert (a['authorized'],a['report'],a['version'])==(True,'RT20261009','1.0.0')
          assert a['source_git_blob']==subprocess.check_output(['git','hash-object',str(root/'source-main.md')],text=True).strip()
          assert b'not peer reviewed' in s.lower()
          assert (root/'code/check_transport.py').is_file()
          print('RTTH_AUTHOR_AND_SOURCE_PREFLIGHT_PASS')
          PY
      - name: Install PDF text tools for exact published-record reconciliation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Execute once; reserve DOI, render DOI-correct PDF, upload exact package and verify anonymous bytes
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/task-relative-continuity/publication.py
      - name: Retain all publication intent and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rt-th-publication-${{ github.run_id }}
          path: |
            research/task-relative-continuity/create-intent.json
            research/task-relative-continuity/deposit.json
            research/task-relative-continuity/create-uncertain.json
            research/task-relative-continuity/frozen-package.json
            research/task-relative-continuity/upload-complete.json
            research/task-relative-continuity/publication-intent.json
            research/task-relative-continuity/publication-record.json
            research/task-relative-continuity/published/
          retention-days: 90
          if-no-files-found: warn
