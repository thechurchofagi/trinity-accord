name: RT/TH parallel research branch inactive (canonical publisher already exists)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  do-not-publish:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Canonical published DOI 10.5281/zenodo.23251651 is managed at research/rt-th-paper-v1-20261009."
