name: Harvard Dataverse HD Connectivity Check

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  connectivity:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/harvard-dataverse-hd-connectivity-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HD_TOKEN: ${{ secrets.HD }}
      DATAVERSE_URL: https://dataverse.harvard.edu
    steps:
      - name: Verify HD secret is available without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HD_TOKEN:-}" ]; then
            echo "HD_SECRET_PRESENT=false"
            exit 2
          fi
          echo "HD_SECRET_PRESENT=true"
          echo "HD_SECRET_LENGTH=${#HD_TOKEN}"

      - name: Probe authenticated API and AddDataset capability without mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ['DATAVERSE_URL'].rstrip('/')
          token = os.environ['HD_TOKEN']
          common_headers = {
              'X-Dataverse-key': token,
              'Accept': 'application/json',
              'User-Agent': 'trinity-accord-preservation-connectivity-check/1.3',
          }

          def call(path: str, method='GET', payload=None):
              headers = dict(common_headers)
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(base + path, headers=headers, data=data, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      code = response.status
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  code = exc.code
              except Exception as exc:
                  raise SystemExit(f'network_error path={path!r} type={type(exc).__name__}: {exc}')
              try:
                  body = json.loads(raw.decode('utf-8')) if raw else None
              except Exception:
                  body = {'non_json_body': True, 'bytes': len(raw)}
              return code, body

          summary = {'server': base, 'token_present': True}

          code, version = call('/api/info/version')
          summary['version_http'] = code
          if isinstance(version, dict):
              summary['version_status'] = version.get('status')
              data = version.get('data')
              if isinstance(data, dict):
                  summary['dataverse_version'] = data.get('version') or data.get('build')

          code, token_info = call('/api/users/token')
          summary['token_endpoint_http'] = code
          summary['token_endpoint_status'] = token_info.get('status') if isinstance(token_info, dict) else None
          if code != 200 or not isinstance(token_info, dict) or token_info.get('status') != 'OK':
              print(json.dumps(summary, indent=2, sort_keys=True))
              raise SystemExit('HD token was not accepted by Harvard Dataverse')

          code, me = call('/api/users/:me')
          summary['me_endpoint_http'] = code
          summary['me_endpoint_status'] = me.get('status') if isinstance(me, dict) else None
          if code != 200 or not isinstance(me, dict) or me.get('status') != 'OK':
              print(json.dumps(summary, indent=2, sort_keys=True))
              raise SystemExit('HD token authenticated but /api/users/:me did not return OK')

          # Resolve Harvard Dataverse's actual top-level collection alias from DB id 1.
          code, top = call('/api/dataverses/1')
          summary['top_collection_lookup_http'] = code
          alias = None
          if isinstance(top, dict):
              summary['top_collection_lookup_status'] = top.get('status')
              data = top.get('data')
              if isinstance(data, dict):
                  alias = data.get('alias')
                  if isinstance(alias, str):
                      summary['top_collection_alias'] = alias
          if code != 200 or not isinstance(alias, str) or not alias:
              print(json.dumps(summary, indent=2, sort_keys=True))
              raise SystemExit('could not resolve top-level Harvard Dataverse collection alias')

          quoted_alias = urllib.parse.quote(alias, safe='')
          code, permissions = call(f'/api/dataverses/{quoted_alias}/userPermissions')
          summary['top_user_permissions_http'] = code
          if isinstance(permissions, dict):
              summary['top_user_permissions_status'] = permissions.get('status')
              pdata = permissions.get('data')
              if isinstance(pdata, dict):
                  summary['top_user_permissions'] = {
                      k: v for k, v in pdata.items() if isinstance(v, bool)
                  }

          probe_dataset = {
              'datasetVersion': {
                  'metadataBlocks': {
                      'citation': {
                          'fields': [
                              {'typeName': 'title', 'multiple': False, 'typeClass': 'primitive', 'value': 'Trinity Accord preservation permission probe'},
                              {'typeName': 'author', 'multiple': True, 'typeClass': 'compound', 'value': [{'authorName': {'typeName': 'authorName', 'multiple': False, 'typeClass': 'primitive', 'value': 'Trinity Accord Preservation'}}]},
                              {'typeName': 'datasetContact', 'multiple': True, 'typeClass': 'compound', 'value': [{'datasetContactEmail': {'typeName': 'datasetContactEmail', 'multiple': False, 'typeClass': 'primitive', 'value': 'noreply@example.com'}}]},
                              {'typeName': 'dsDescription', 'multiple': True, 'typeClass': 'compound', 'value': [{'dsDescriptionValue': {'typeName': 'dsDescriptionValue', 'multiple': False, 'typeClass': 'primitive', 'value': 'Non-publishing API capability probe; no dataset is created.'}}]},
                              {'typeName': 'subject', 'multiple': True, 'typeClass': 'controlledVocabulary', 'value': ['Computer and Information Science']}
                          ]
                      }
                  }
              }
          }
          code, validation = call(f'/api/dataverses/{quoted_alias}/validateDatasetJson', method='POST', payload=probe_dataset)
          summary['add_dataset_permission_probe_http'] = code
          if isinstance(validation, dict):
              summary['add_dataset_permission_probe_status'] = validation.get('status')
              message = validation.get('message')
              if isinstance(message, str):
                  summary['add_dataset_permission_probe_message'] = message[:300]
          summary['authenticated_api_ok'] = True
          summary['can_invoke_add_dataset_validation'] = (code == 200)

          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
