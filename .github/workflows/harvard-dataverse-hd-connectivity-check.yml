name: Harvard Dataverse HD Connectivity Check

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  connectivity:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/harvard-dataverse-hd-connectivity-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HD_TOKEN: ${{ secrets.HD }}
      DATAVERSE_URL: https://dataverse.harvard.edu
    steps:
      - name: Verify HD secret is available without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HD_TOKEN:-}" ]; then
            echo "HD_SECRET_PRESENT=false"
            exit 2
          fi
          echo "HD_SECRET_PRESENT=true"
          echo "HD_SECRET_LENGTH=${#HD_TOKEN}"

      - name: Probe Harvard Dataverse authenticated API safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ['DATAVERSE_URL'].rstrip('/')
          token = os.environ['HD_TOKEN']
          headers = {
              'X-Dataverse-key': token,
              'Accept': 'application/json',
              'User-Agent': 'trinity-accord-preservation-connectivity-check/1.1',
          }

          def get(path: str):
              req = urllib.request.Request(base + path, headers=headers, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      code = response.status
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  code = exc.code
              except Exception as exc:
                  raise SystemExit(f'network_error path={path!r} type={type(exc).__name__}: {exc}')
              try:
                  payload = json.loads(raw.decode('utf-8')) if raw else None
              except Exception:
                  payload = {'non_json_body': True, 'bytes': len(raw)}
              return code, payload

          summary = {'server': base, 'token_present': True}

          code, token_info = get('/api/users/token')
          summary['token_endpoint_http'] = code
          summary['token_endpoint_status'] = token_info.get('status') if isinstance(token_info, dict) else None
          if code != 200 or not isinstance(token_info, dict) or token_info.get('status') != 'OK':
              print(json.dumps(summary, indent=2, sort_keys=True))
              raise SystemExit('HD token was not accepted by Harvard Dataverse')

          code, me = get('/api/users/:me')
          summary['me_endpoint_http'] = code
          summary['me_endpoint_status'] = me.get('status') if isinstance(me, dict) else None
          if code != 200 or not isinstance(me, dict) or me.get('status') != 'OK':
              print(json.dumps(summary, indent=2, sort_keys=True))
              raise SystemExit('HD token authenticated but /api/users/:me did not return OK')

          user = me.get('data') if isinstance(me.get('data'), dict) else {}
          summary['user_fields_present'] = sorted(k for k in user.keys() if k not in {'email', 'firstName', 'lastName', 'displayName'})

          code, root_user_perms = get('/api/dataverses/root/userPermissions')
          summary['root_user_permissions_http'] = code
          if isinstance(root_user_perms, dict):
              summary['root_user_permissions_status'] = root_user_perms.get('status')
              pdata = root_user_perms.get('data')
              if isinstance(pdata, dict):
                  safe = {}
                  for key, value in pdata.items():
                      if isinstance(value, bool):
                          safe[key] = value
                  summary['root_user_permissions'] = safe

          candidates = []
          for field in ('identifier', 'userName', 'username'):
              value = user.get(field)
              if isinstance(value, str) and value:
                  candidates.append((field, value))
                  if not value.startswith('@'):
                      candidates.append((field + '_at_prefixed', '@' + value))

          def allowed(permission: str):
              attempts = []
              for label, value in candidates:
                  ident = urllib.parse.quote(value, safe='')
                  p = urllib.parse.quote(permission, safe='')
                  code, payload = get(f'/api/users/{ident}/allowedCollections/{p}')
                  status = payload.get('status') if isinstance(payload, dict) else None
                  attempts.append({'candidate': label, 'http': code, 'status': status})
                  if code == 200 and isinstance(payload, dict) and status == 'OK':
                      pdata = payload.get('data')
                      result = {'http': code, 'status': status, 'candidate': label}
                      if isinstance(pdata, list):
                          result['count'] = len(pdata)
                          aliases = []
                          for item in pdata:
                              if isinstance(item, dict):
                                  alias = item.get('alias') or item.get('identifier')
                                  if alias:
                                      aliases.append(str(alias))
                          result['aliases'] = sorted(aliases)[:50]
                      return result
              return {'status': 'NO_OK_RESPONSE', 'attempts': attempts}

          summary['allowed_add_dataset'] = allowed('AddDataset')
          summary['allowed_edit_dataverse'] = allowed('EditDataverse')
          summary['authenticated_api_ok'] = True

          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY
