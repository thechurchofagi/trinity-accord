name: Bitcoin Release Permission Probe

on:
  push:
    paths:
      - '.github/workflows/bitcoin-release-permission-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Probe draft Release permission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="bitcoin-release-permission-probe-${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$tag" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Bitcoin release permission probe" \
            -f body="Ephemeral permission probe; not a checkpoint." \
            -F draft=true > "$RUNNER_TEMP/probe-release.json"
          id="$(jq -r '.id' "$RUNNER_TEMP/probe-release.json")"
          test -n "$id"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          echo "release permission probe succeeded"
