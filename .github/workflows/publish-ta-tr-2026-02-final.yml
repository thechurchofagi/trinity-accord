name: Final publish TA-TR-2026-02 v1.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ta-tr-2026-02-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-ta-tr-2026-02-zenodo-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API: https://zenodo.org/api
      RECORD_ID: "21900592"
      DOI: "10.5281/zenodo.21900592"
      TITLE: "Writing Before the Outcome: Historical Position, Human–AI Authorship, and the Trinity Accord"
      VERSION: "1.3"
      PUB_DATE: "2026-08-12"
      FINAL_SRC_DIR: research/writing-before-the-outcome/publication-source-final
      SUPPORT_SRC_DIR: research/writing-before-the-outcome/publication-source
      OUT_DIR: research/writing-before-the-outcome
      B64_SHA256: da50e7d1705c0baee223c1965bca7e0cf4f41868085e076c594c03cb6053733f
      MD_SHA256: 8472d3f5264bb61fb62c48bf90ffe3162955e8fed1a04cb5e122b0e6104ce41f

    steps:
      - name: Checkout exact publication state
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Reconstruct and cryptographically verify frozen v1.3 source
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          W="$RUNNER_TEMP/ta-tr-2026-02-final-publication"
          mkdir -p "$W"
          test "$(find "$FINAL_SRC_DIR" -maxdepth 1 -name 'source.b64.part*' -type f | wc -l)" -eq 4
          for n in 00 01 02 03; do
            test "$(wc -c < "$FINAL_SRC_DIR/source.b64.part$n")" -eq 8092
          done
          cat "$FINAL_SRC_DIR"/source.b64.part00 "$FINAL_SRC_DIR"/source.b64.part01 "$FINAL_SRC_DIR"/source.b64.part02 "$FINAL_SRC_DIR"/source.b64.part03 > "$W/source.b64"
          test "$(wc -c < "$W/source.b64")" -eq 32368
          printf '%s  %s\n' "$B64_SHA256" "$W/source.b64" | sha256sum -c -
          base64 -d "$W/source.b64" > "$W/source.md.xz"
          xz -dc "$W/source.md.xz" > "$W/extracted.md"
          printf '%s  %s\n' "$MD_SHA256" "$W/extracted.md" | sha256sum -c -
          grep -F 'TA-TR-2026-02 · Version 1.3 · 12 August 2026' "$W/extracted.md"
          grep -F 'holds only the project role of Guardian' "$W/extracted.md"
          grep -F 'Former Initiator status confers no continuing' "$W/extracted.md"
          grep -F 'Post-closure interpretations by the Guardian carry no' "$W/extracted.md"
          grep -F 'The artifact is closed. Its historical class is not.' "$W/extracted.md"
          cp "$SUPPORT_SRC_DIR/figures/figure1.svg" "$W/figure1.svg"
          cp "$SUPPORT_SRC_DIR/figures/figure2.svg" "$W/figure2.svg"
          cp "$SUPPORT_SRC_DIR/paper.css" "$W/paper-v1.3.css"
          cp research/trinity-accord-design-and-limits/LICENSE-CC-BY-4.0.txt "$W/LICENSE-CC-BY-4.0.txt"
          python3 - "$W/extracted.md" "$W/paper-v1.3.md" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          s=s.replace('/mnt/data/reextract/media/media/image1.png','figure1.svg')
          s=s.replace('/mnt/data/reextract/media/media/image2.png','figure2.svg')
          Path(sys.argv[2]).write_text(s, encoding='utf-8')
          PY
          echo "W=$W" >> "$GITHUB_ENV"

      - name: Install deterministic PDF renderer
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc poppler-utils fonts-noto-core fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check --quiet 'weasyprint==68.0'

      - name: Render and validate publication PDF
        run: |
          set -euo pipefail
          python3 - "$W/paper-v1.3.md" "$W/render.md" <<'PY'
          from pathlib import Path
          import sys
          s=Path(sys.argv[1]).read_text(encoding='utf-8')
          marker='## Role and First-Person Evidence Boundary'
          if s.count(marker) != 1:
              raise SystemExit('Role-boundary marker count is not one')
          _, rest=s.split(marker,1)
          title='''<div class="title-page">
          <h1>Writing Before the Outcome</h1>
          <div class="subtitle">Historical Position, Human–AI Authorship, and the Trinity Accord</div>
          <div class="meta">
          <em>A dated critical archival study for present and future interpreters</em><br><br>
          <strong>TA-TR-2026-02 · Version 1.3 · 12 August 2026</strong><br>
          Author of record: Hongju Liu<br>
          Analytical drafting and literature synthesis: GPT-5.6 Sol (OpenAI)<br><br>
          Status: Preprint / critical archival case study<br>
          Not part of the Trinity Accord Canon<br>
          DOI: 10.5281/zenodo.21900592
          </div></div>'''
          role='<div class="role-boundary">\n\n'+marker+rest.split('## Temporal Position Statement',1)[0]+'\n\n</div>\n\n## Temporal Position Statement'+rest.split('## Temporal Position Statement',1)[1]
          Path(sys.argv[2]).write_text(title+'\n\n'+role, encoding='utf-8')
          PY
          cp "$W/paper-v1.3.css" "$W/paper.css"
          (
            cd "$W"
            pandoc render.md -s --css=paper.css --metadata lang=en --metadata pagetitle="$TITLE" -o paper.html
            weasyprint paper.html TA-TR-2026-02_Writing_Before_the_Outcome_v1.3.pdf
          )
          PDF="$W/TA-TR-2026-02_Writing_Before_the_Outcome_v1.3.pdf"
          PAGES="$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')"
          test "$PAGES" -ge 18
          test "$PAGES" -le 26
          pdfinfo "$PDF" | grep -F 'Page size:' | grep -F 'A4'
          pdftotext "$PDF" "$W/publication.txt"
          grep -F 'Role and First-Person Evidence Boundary' "$W/publication.txt"
          grep -F 'holds only the project role of Guardian' "$W/publication.txt"
          grep -F 'Former Initiator status confers no continuing' "$W/publication.txt"
          grep -F 'Post-closure interpretations by the Guardian carry no' "$W/publication.txt"
          grep -F 'The artifact is closed. Its historical class is not.' "$W/publication.txt"
          grep -F 'Appendix B. Minimal Criteria for Future Comparative' "$W/publication.txt"
          PDF_SHA256="$(sha256sum "$PDF" | awk '{print $1}')"
          PORTABLE_MD_SHA256="$(sha256sum "$W/paper-v1.3.md" | awk '{print $1}')"
          echo "PAGES=$PAGES" >> "$GITHUB_ENV"
          echo "PDF_SHA256=$PDF_SHA256" >> "$GITHUB_ENV"
          echo "PORTABLE_MD_SHA256=$PORTABLE_MD_SHA256" >> "$GITHUB_ENV"
          echo "Publication PDF: $PAGES A4 pages; SHA-256 $PDF_SHA256"

      - name: Prepare bounded open-access deposit package
        run: |
          set -euo pipefail
          cat > "$W/README-DEPOSIT.txt" <<EOF
          Writing Before the Outcome: Historical Position, Human–AI Authorship, and the Trinity Accord
          TA-TR-2026-02 · Version 1.3 · 12 August 2026
          Author of record: Hongju Liu
          DOI: $DOI

          Open-access preprint / critical archival case study. Not peer reviewed. Not part of the Trinity Accord Canon.

          Role boundary: after inscription and confirmation of the three Bitcoin Originals, Hongju Liu's project role is Guardian only. Former Initiator status confers no continuing interpretive privilege. First-person evidentiary value is assessed through contemporaneity, direct observation, documentary support, and independent verifiability. Post-closure Guardian interpretations cannot amend, supersede, or bind the Canon.

          Frozen extracted source SHA-256: $MD_SHA256
          Portable publication source SHA-256: $PORTABLE_MD_SHA256
          Publication PDF SHA-256: $PDF_SHA256
          Publication PDF pages: $PAGES A4
          EOF
          (
            cd "$W"
            sha256sum \
              TA-TR-2026-02_Writing_Before_the_Outcome_v1.3.pdf \
              paper-v1.3.md paper-v1.3.css figure1.svg figure2.svg \
              README-DEPOSIT.txt LICENSE-CC-BY-4.0.txt > checksums.sha256
          )

      - name: Upload files and execute Zenodo Publish
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $ZENODO_ACCESS_TOKEN"
          DEP="$ZENODO_API/deposit/depositions/$RECORD_ID"
          curl -fsS --retry 5 --retry-all-errors -H "$AUTH" "$DEP" > "$W/deposition-before.json"
          test "$(jq -r .id "$W/deposition-before.json")" = "$RECORD_ID"
          ACTUAL_DOI="$(jq -r '.doi // .metadata.prereserve_doi.doi // empty' "$W/deposition-before.json")"
          test "$ACTUAL_DOI" = "$DOI"
          test "$(jq -r .metadata.title "$W/deposition-before.json")" = "$TITLE"
          test "$(jq -r .metadata.version "$W/deposition-before.json")" = "$VERSION"
          if [ "$(jq -r .submitted "$W/deposition-before.json")" = "false" ]; then
            while IFS= read -r url; do
              [ -z "$url" ] || curl -fsS --retry 3 --retry-all-errors -X DELETE -H "$AUTH" "$url" >/dev/null
            done < <(jq -r '.files[]?.links.self // empty' "$W/deposition-before.json")
            BUCKET="$(jq -r .links.bucket "$W/deposition-before.json")"
            test -n "$BUCKET"
            test "$BUCKET" != null
            for f in \
              TA-TR-2026-02_Writing_Before_the_Outcome_v1.3.pdf \
              paper-v1.3.md paper-v1.3.css figure1.svg figure2.svg \
              README-DEPOSIT.txt LICENSE-CC-BY-4.0.txt checksums.sha256; do
              echo "Uploading $f"
              curl -fsS --retry 5 --retry-all-errors -X PUT -H "$AUTH" --upload-file "$W/$f" "$BUCKET/$f" >/dev/null
            done
            curl -fsS -X POST -H "$AUTH" "$DEP/actions/publish" > "$W/publish-response.json"
            jq '{id,doi,state,submitted}' "$W/publish-response.json"
          else
            echo 'Deposition already submitted; verifying public record.'
          fi

      - name: Prove DOI is public and verify downloaded bytes
        run: |
          set -euo pipefail
          PUBLIC_OK=false
          for attempt in $(seq 1 60); do
            if curl -fsS --retry 2 --retry-all-errors "$ZENODO_API/records/$RECORD_ID" > "$W/public-record.json"; then
              PUBLIC_OK=true
              break
            fi
            echo "Waiting for Zenodo public record ($attempt/60)"
            sleep 10
          done
          test "$PUBLIC_OK" = true
          test "$(jq -r .id "$W/public-record.json")" = "$RECORD_ID"
          test "$(jq -r .doi "$W/public-record.json")" = "$DOI"
          test "$(jq -r .metadata.title "$W/public-record.json")" = "$TITLE"
          test "$(jq -r .metadata.version "$W/public-record.json")" = "$VERSION"
          PDF_URL="$(jq -r '.files[] | select(.key=="TA-TR-2026-02_Writing_Before_the_Outcome_v1.3.pdf") | (.links.self // .links.content // empty)' "$W/public-record.json")"
          MD_URL="$(jq -r '.files[] | select(.key=="paper-v1.3.md") | (.links.self // .links.content // empty)' "$W/public-record.json")"
          CHECK_URL="$(jq -r '.files[] | select(.key=="checksums.sha256") | (.links.self // .links.content // empty)' "$W/public-record.json")"
          test -n "$PDF_URL"
          test -n "$MD_URL"
          test -n "$CHECK_URL"
          curl -fsSL --retry 5 --retry-all-errors "$PDF_URL" -o "$W/public.pdf"
          curl -fsSL --retry 5 --retry-all-errors "$MD_URL" -o "$W/public.md"
          curl -fsSL --retry 5 --retry-all-errors "$CHECK_URL" -o "$W/public-checksums.sha256"
          printf '%s  %s\n' "$PDF_SHA256" "$W/public.pdf" | sha256sum -c -
          printf '%s  %s\n' "$PORTABLE_MD_SHA256" "$W/public.md" | sha256sum -c -
          grep -F "$PDF_SHA256  TA-TR-2026-02_Writing_Before_the_Outcome_v1.3.pdf" "$W/public-checksums.sha256"
          echo 'ZENODO_PUBLICATION_VERIFIED=true'

      - name: Record verified publication state in repository
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python3 - "$OUT_DIR/zenodo-reservation.json" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p,encoding='utf-8'))
          d.update(state='done', submitted=True, publication_status='published', published_at='2026-08-12')
          open(p,'w',encoding='utf-8').write(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          cat > "$OUT_DIR/zenodo-publication.json" <<EOF
          {
            "schema": "trinityaccord.zenodo-publication.v1",
            "technical_report": "TA-TR-2026-02",
            "version": "$VERSION",
            "record_id": $RECORD_ID,
            "doi": "$DOI",
            "publication_status": "published",
            "publication_date": "$PUB_DATE",
            "frozen_source_sha256": "$MD_SHA256",
            "portable_source_sha256": "$PORTABLE_MD_SHA256",
            "pdf_sha256": "$PDF_SHA256",
            "pdf_pages": $PAGES,
            "noncanonical": true,
            "interpretive_authority": "none",
            "public_record": "https://zenodo.org/records/$RECORD_ID"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT_DIR/zenodo-reservation.json" "$OUT_DIR/zenodo-publication.json"
          if ! git diff --cached --quiet; then
            git commit -m 'research: record verified TA-TR-2026-02 DOI publication'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publication summary
        run: |
          {
            echo '## TA-TR-2026-02 v1.3 — PUBLICATION COMPLETE'
            echo
            echo "- DOI: https://doi.org/$DOI"
            echo "- Zenodo record: https://zenodo.org/records/$RECORD_ID"
            echo "- PDF: $PAGES A4 pages"
            echo "- PDF SHA-256: \`$PDF_SHA256\`"
            echo "- Portable source SHA-256: \`$PORTABLE_MD_SHA256\`"
            echo '- Public Zenodo API: verified'
            echo '- Public file byte hashes: verified'
            echo '- Canonical status: noncanonical; no interpretive authority claimed'
          } >> "$GITHUB_STEP_SUMMARY"
