name: Chronicle sidechain L2 parallel preflight

on:
  pull_request:
    paths:
      - "scripts/build-chronicle-sidechain-evidence.mjs"
      - "scripts/test_chronicle_bootstrap_history.mjs"
      - "scripts/capture-chronicle-sidechain-l2.py"
      - "scripts/capture-chronicle-sidechain-l2-parallel.py"
      - "scripts/test_chronicle_sidechain_l2.py"
      - "scripts/test_chronicle_sidechain_l2_parallel.py"
      - "scripts/publish-chronicle-sidechain-progress.py"
      - "scripts/stream-chronicle-sidechain-progress.sh"
      - ".github/workflows/chronicle-sidechain-mirror-v3.yml"
      - ".github/workflows/chronicle-sidechain-l2-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version-file: ".node-version"
      - name: Install proof dependencies
        run: python3 -m pip install -r requirements-ci.txt
      - name: Run bootstrap, L2 regression, parallelism, and telemetry tests
        run: |
          set -euo pipefail
          node scripts/test_chronicle_bootstrap_history.mjs
          python3 scripts/test_chronicle_sidechain_l2.py
          python3 scripts/test_chronicle_sidechain_l2_parallel.py
          python3 -m py_compile \
            scripts/capture-chronicle-sidechain-l2.py \
            scripts/capture-chronicle-sidechain-l2-parallel.py \
            scripts/publish-chronicle-sidechain-progress.py
          bash -n scripts/stream-chronicle-sidechain-progress.sh
          echo "[PREFLIGHT PASS] bootstrap + legacy correctness + endpoint parallelism + telemetry"
