name: Archive backlog scan

on:
  workflow_dispatch:
  schedule:
    # Daily no-cost visibility scan after the normal archive windows.
    - cron: "47 8 * * *"

permissions:
  contents: read

concurrency:
  group: archive-backlog-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Detect archive backlog without paid actions
        run: python3 scripts/detect_archive_backlog.py --write

      - name: Preview one Record-Chain repair candidate
        run: >-
          python3 scripts/process_archive_backlog.py
          --kind record_chain_arweave
          --max-items 1
          --mode dry-run

      - name: Preview one Native OTS repair candidate
        run: >-
          python3 scripts/process_archive_backlog.py
          --kind native_ots_bundle
          --max-items 1
          --mode dry-run

      - name: Explain paid-repair boundary
        run: |
          printf '%s\n' "This scheduled workflow never uploads to Arweave and never writes to main."
          printf '%s\n' "Paid repair requires an explicit human dispatch of the primary bounded archive workflow."
