name: Publish Full Project Preservation to Harvard Dataverse

on:
  workflow_run:
    workflows:
      - Full Project Preservation Bundle
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Full Project Preservation Bundle run ID; leave blank to use latest successful main run
        required: false
        type: string
      source_head_sha:
        description: Optional exact source head SHA to cross-check
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/harvard-dataverse-publish-trigger-v1

permissions:
  actions: read
  contents: read

concurrency:
  group: harvard-full-project-preservation-publish-v1
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
      GITHUB_TOKEN: ${{ github.token }}
      HARVARD_RESUME_PID: doi:10.7910/DVN/YUCG12
    steps:
      - name: Checkout publisher from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'

      - name: Resolve exact source preservation run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_run_id=""
          source_head_sha=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            source_run_id='${{ github.event.workflow_run.id }}'
            source_head_sha='${{ github.event.workflow_run.head_sha }}'
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            source_run_id='${{ inputs.source_run_id }}'
            source_head_sha='${{ inputs.source_head_sha }}'
          fi
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
          echo "event=$GITHUB_EVENT_NAME source_run_id=${source_run_id:-latest-successful-main} source_head_sha=${source_head_sha:-api-resolved}"

      - name: Require explicit Harvard publication marker for automatic source runs
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.source_head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['SOURCE_HEAD_SHA']
          token=os.environ['GITHUB_TOKEN']
          url=f"https://api.github.com/repos/{repo}/contents/.github/full-project-preservation-trigger-v1?ref={sha}"
          req=urllib.request.Request(
              url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'trinity-accord-harvard-preservation/1.0',
              },
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              payload=json.load(response)
          text=base64.b64decode(payload['content']).decode('utf-8')
          marker='Harvard Dataverse publication authorized: v1'
          if marker not in text.splitlines():
              raise SystemExit(f'automatic Harvard publication denied: source commit {sha} lacks explicit marker')
          print(f'Harvard publication marker PASS source_sha={sha}')
          PY

      - name: Publish verified opaque artifact and perform full public readback
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.source_head_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/harvard-publication
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          args=(
            --repository "$GITHUB_REPOSITORY"
            --output-dir "$OUTPUT_DIR"
          )
          if [ -n "$SOURCE_RUN_ID" ]; then
            args+=(--source-run-id "$SOURCE_RUN_ID")
          fi
          if [ -n "$SOURCE_HEAD_SHA" ]; then
            args+=(--source-head-sha "$SOURCE_HEAD_SHA")
          fi
          python3 scripts/publish_full_project_bundle_to_harvard_dataverse_v3.py "${args[@]}" \
            2>&1 | tee "$RUNNER_TEMP/harvard-dataverse-publish.log"

      - name: Surface final publication receipt
        if: success()
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/harvard-publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['OUTPUT_DIR'])/'harvard-publication-receipt.json'
          receipt=json.loads(path.read_text(encoding='utf-8'))
          print(f"persistent_id={receipt['persistent_id']}")
          print(f"source_workflow_run_id={receipt['source_workflow_run_id']}")
          print(f"artifact_bytes={receipt['artifact_bytes']}")
          print(f"artifact_sha256={receipt['artifact_sha256']}")
          print(f"bundle_identity_sha256={receipt['bundle_identity_sha256']}")
          print(f"public_readback_verified={receipt['public_readback_verified']}")
          summary=Path(os.environ['GITHUB_STEP_SUMMARY'])
          summary.write_text(
              '# Harvard Dataverse Preservation\n\n'
              f"- Dataset PID: `{receipt['persistent_id']}`\n"
              f"- Source workflow run: `{receipt['source_workflow_run_id']}`\n"
              f"- Source Git SHA: `{receipt['source_git_commit_sha']}`\n"
              f"- Artifact bytes: **{receipt['artifact_bytes']}**\n"
              f"- Artifact SHA-256: `{receipt['artifact_sha256']}`\n"
              f"- Bundle identity: `{receipt['bundle_identity_sha256']}\n"
              '- Harvard full public-byte readback: **PASS**\n'
              '- Authority role: **non-amending archival mirror**\n',
              encoding='utf-8',
          )
          PY

      - name: Upload Harvard publication audit receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harvard-dataverse-publication-audit
          path: |
            ${{ runner.temp }}/harvard-dataverse-publish.log
            ${{ runner.temp }}/harvard-publication/harvard-publication-receipt.json
          retention-days: 90
          if-no-files-found: warn
