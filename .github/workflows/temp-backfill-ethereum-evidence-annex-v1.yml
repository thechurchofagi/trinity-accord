name: Temporary Backfill Ethereum Evidence Annex v1

on:
  push:
    branches:
      - agent/ethereum-proof-carrying-evidence-annex-v1
    paths:
      - .github/workflows/temp-backfill-ethereum-evidence-annex-v1.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout annex branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: agent/ethereum-proof-carrying-evidence-annex-v1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Capture transaction receipt and block JSON for all audited anchors
        env:
          ETH_RPC: https://ethereum-rpc.publicnode.com
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/eth-txs.txt
          import json
          from pathlib import Path
          p=Path('evidence/ethereum-evidence-annex-v1/ANNEX-MANIFEST.json')
          for a in json.loads(p.read_text())['anchors']:
              print(a['tx_hash'])
          PY
          while read -r tx; do
            out="evidence/ethereum-evidence-annex-v1/proof-material/$tx"
            python3 evidence/ethereum-evidence-annex-v1/verification/capture_eth_anchor.py \
              --rpc "$ETH_RPC" --tx "$tx" --out "$out"
            sleep 1
          done < /tmp/eth-txs.txt

      - name: Bind captures to historical byte commitments and block times
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root=Path('evidence/ethereum-evidence-annex-v1')
          mp=root/'ANNEX-MANIFEST.json'
          data=json.loads(mp.read_text(encoding='utf-8'))
          for a in data['anchors']:
              txh=a['tx_hash']
              d=root/'proof-material'/txh
              tx=json.loads((d/'transaction.json').read_text(encoding='utf-8'))
              rc=json.loads((d/'receipt.json').read_text(encoding='utf-8'))
              block=json.loads((d/'block.json').read_text(encoding='utf-8'))
              cap=json.loads((d/'capture-manifest.json').read_text(encoding='utf-8'))
              assert tx['hash'].lower()==txh.lower()
              assert rc['transactionHash'].lower()==txh.lower()
              assert tx['blockHash']==rc['blockHash']==block['hash']
              raw=bytes.fromhex(tx.get('input','0x')[2:])
              assert len(raw)==a['input_len'], (txh,len(raw),a['input_len'])
              assert hashlib.sha256(raw).hexdigest()==a['input_sha256'], txh
              assert cap['chain_id']=='0x1'
              ts=int(block['timestamp'],16)
              a['execution_reference']={
                  'block_number': int(block['number'],16),
                  'block_hash': block['hash'],
                  'block_timestamp_unix': ts,
                  'block_timestamp_utc': datetime.fromtimestamp(ts,tz=timezone.utc).isoformat().replace('+00:00','Z'),
                  'transaction_index': int(tx['transactionIndex'],16),
                  'receipt_status': rc.get('status'),
                  'reference_checked': True,
                  'reference_kind': 'preserved_rpc_capture',
                  'reference_capture_path': str(d/'capture-manifest.json'),
                  'reference_provider': 'https://ethereum-rpc.publicnode.com',
                  'claim_boundary': 'Provider-returned historical evidence preserved for future inspection; not by itself an offline Merkle inclusion or PoS finality proof.'
              }
              a['rpc_capture_status']='REFERENCE_CAPTURED'
          data['proof_material_policy']['rpc_history_capture']='PRESERVED_FOR_ALL_10_ANCHORS_REFERENCE_ONLY'
          data['proof_material_policy']['rpc_history_capture_boundary']='Preserving transaction/receipt/block JSON freezes the observed Ethereum block timestamp and commitment context, but does not upgrade L2/L3 without independent inclusion/finality proof validation.'
          mp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Repair preservation tests for the later current-baseline DOI publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/test_external_binary_annex_v2.py')
          s=p.read_text(encoding='utf-8')
          old='    assert current["latest_doi"] == "10.5281/zenodo.21755827"\n'
          new=(
              '    current_baseline = json.loads(\n'
              '        (ROOT / "preservation/current-baseline-publication-authorization-v1.json").read_text(encoding="utf-8")\n'
              '    )\n'
              '    assert current_baseline["status"] == "consumed"\n'
              '    assert current["latest_doi"] == current_baseline["published_doi"]\n'
          )
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('tests/test_repository_preservation_refresh_contract.py')
          s=p.read_text(encoding='utf-8')
          old='    assert state["latest_doi"] == auth["published_doi"]\n'
          new=(
              '    if state["latest_doi"] != auth["published_doi"]:\n'
              '        current_auth = load(\n'
              '            ROOT / "preservation/current-baseline-publication-authorization-v1.json"\n'
              '        )\n'
              '        assert current_auth["status"] == "consumed"\n'
              '        assert current_auth["previous_core_version_doi"] == auth["published_doi"]\n'
              '        assert state["latest_doi"] == current_auth["published_doi"]\n'
              '        return\n'
              '    assert state["latest_doi"] == auth["published_doi"]\n'
          )
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Validate captured evidence and fail-closed annex semantics
        run: |
          set -euo pipefail
          python3 evidence/ethereum-evidence-annex-v1/verification/verify_annex.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('evidence/ethereum-evidence-annex-v1')
          m=json.loads((root/'ANNEX-MANIFEST.json').read_text())
          assert len(m['anchors'])==10
          for a in m['anchors']:
              assert a['rpc_capture_status']=='REFERENCE_CAPTURED'
              assert a['proof_status']['L2_EXECUTION_INCLUSION']=='UNVERIFIED'
              assert a['proof_status']['L3_CONSENSUS_FINALITY']=='UNVERIFIED'
              ref=a['execution_reference']
              d=root/'proof-material'/a['tx_hash']
              tx=json.loads((d/'transaction.json').read_text())
              rc=json.loads((d/'receipt.json').read_text())
              block=json.loads((d/'block.json').read_text())
              raw=bytes.fromhex(tx['input'][2:])
              assert hashlib.sha256(raw).hexdigest()==a['input_sha256']
              assert len(raw)==a['input_len']
              assert ref['block_hash']==block['hash']==tx['blockHash']==rc['blockHash']
              assert ref['block_number']==int(block['number'],16)
              assert ref['block_timestamp_unix']==int(block['timestamp'],16)
          print('PASS: 10/10 Ethereum historical RPC captures bound to existing byte commitments')
          PY

      - name: Commit evidence and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-backfill-ethereum-evidence-annex-v1.yml
          git add evidence/ethereum-evidence-annex-v1 tests/test_external_binary_annex_v2.py tests/test_repository_preservation_refresh_contract.py
          git diff --cached --check
          git commit -m "evidence: freeze Ethereum historical block context"
          git push origin HEAD:agent/ethereum-proof-carrying-evidence-annex-v1
