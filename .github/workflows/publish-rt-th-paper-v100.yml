name: Publish RT-TH theoretical preprint v1.0.0
on:
  push:
    branches: [research/rt-th-paper-v1-20261009]
    paths:
      - research/rt-th-paper/PUBLISH-AUTHORIZATION.json
permissions:
  contents: write
concurrency:
  group: rt-th-v100-zenodo-once
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[rt-th-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/rt-th-paper-v1-20261009
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install PDF build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-latex-extra fonts-dejavu-core poppler-utils
      - name: Source identity and publication scope check before credentials
        run: |
          python3 research/rt-th-paper/publication.py verify
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('research/rt-th-paper/PUBLISH-AUTHORIZATION.json').read_text())
          assert d['authorized'] and d['version']=='1.0.0' and d['report']=='RT-TH-2026-01'
          assert d['publication_action']=='CREATE_NEW_INDEPENDENT_ZENODO_PREPRINT'
          PY
      - name: Reserve once, insert actual DOI into PDF, publish, and public byte-readback
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/rt-th-paper/publication.py publish
      - name: Retain complete operation state and files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rt-th-zenodo-${{ github.run_id }}
          path: |
            research/rt-th-paper/published/
            research/rt-th-paper/deposit.json
            research/rt-th-paper/create-intent.json
            research/rt-th-paper/preparation-error.json
            research/rt-th-paper/upload-check.json
            research/rt-th-paper/publication-intent.json
            research/rt-th-paper/publish-attempt.json
            research/rt-th-paper/publication-record.json
            research/rt-th-paper/build-qa.json
          retention-days: 90
          if-no-files-found: warn
