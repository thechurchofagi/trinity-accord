name: Publish Artificial Self Attribution
on:
  push:
    branches: [research/artificial-self-attribution-v1-1-20260919]
    paths:
      - '.github/workflows/publish-artificial-self-attribution.yml'
      - 'research/artificial-self-attribution/publish_zenodo.py'
      - 'research/artificial-self-attribution/publication_common.py'
      - 'research/artificial-self-attribution/EXPECTED-PUBLICATION.json'
      - 'research/artificial-self-attribution/visual-review.json'
permissions:
  contents: write
concurrency:
  group: artificial-self-attribution-zenodo-v1-1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta08-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/artificial-self-attribution-v1-1-20260919
      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > /tmp/ta08-toolchain-provenance.json
          cat /tmp/ta08-toolchain-provenance.json
      - name: Verify safety checks and exact reviewed package without credentials
        run: |
          python3 research/artificial-self-attribution/test_publication_safety.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'research/artificial-self-attribution')
          from publication_common import validate_local_package
          expected, digest = validate_local_package()
          print('TA08 exact reviewed package:', expected['file_count'], 'files; manifest', digest)
          PY
      - name: Publish only reserved eighth-paper record and read every file anonymously
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/artificial-self-attribution/publish_zenodo.py
      - name: Preserve actual publication state including failures
        if: always()
        run: python3 research/artificial-self-attribution/publication_common.py --persist-states
      - name: Retain exact files and public readback diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artificial-self-attribution-publication-v1.1
          path: |
            research/artificial-self-attribution/published/
            research/artificial-self-attribution/EXPECTED-PUBLICATION.json
            research/artificial-self-attribution/visual-review.json
            research/artificial-self-attribution/format-checks.json
            research/artificial-self-attribution/publication-record.json
            research/artificial-self-attribution/publication-attempt.json
            /tmp/ta08-public-readback/
            /tmp/ta08-toolchain-provenance.json
          retention-days: 90
          if-no-files-found: warn
