name: Complete External Binary Annex Publication V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/external-binary-annex-publication-v4.yml
      - scripts/external_binary_annex_v4.py
      - scripts/publish_external_binary_annexes_to_zenodo_v4.py
      - tests/test_external_binary_annex_v4.py

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  publish-annexes-v4:
    if: >-
      (
        github.event_name == 'push' &&
        startsWith(github.event.head_commit.message, 'fix: complete Trinity preservation publication')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.actor == 'thechurchofagi'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      TRINITY_PUBLICATION_SOURCE_SHA: ${{ github.sha }}
      EXTERNAL_BINARY_ANNEX_RIGHTS_ACK: TRINITY_EXTERNAL_BINARY_ANNEX_RIGHTS_V1_APPROVED
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}

    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Initialize runner-local V4 package paths
        run: |
          set -euo pipefail
          printf 'EVIDENCE_PACKAGE_DIR=%s\n' \
            "$RUNNER_TEMP/trinity-evidence-annex-v4" >> "$GITHUB_ENV"
          printf 'NFT_PACKAGE_DIR=%s\n' \
            "$RUNNER_TEMP/trinity-nft-annex-v4" >> "$GITHUB_ENV"

      - name: Resolve current main state and publication requirement
        id: precheck
        run: |
          set -euo pipefail
          echo "source-and-authorization-precheck-v4" > "$RUNNER_TEMP/annex-publication-stage.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TRINITY_PUBLICATION_SOURCE_SHA" = "$GITHUB_SHA"
          git fetch origin main --prune
          git show origin/main:preservation/external-binary-annex-state.json \
            > "$RUNNER_TEMP/current-main-external-annex-state.json"
          python3 scripts/external_annex_publication_precheck.py \
            --current-state "$RUNNER_TEMP/current-main-external-annex-state.json" \
            --authorization preservation/external-binary-annex-authorization-v1.json \
            --trigger preservation/external-binary-annex-publication-trigger.json \
            --github-output "$GITHUB_OUTPUT"
          if grep -qx 'required=true' "$GITHUB_OUTPUT"; then
            test -n "$ZENODO_ACCESS_TOKEN"
          fi

      - name: Retire stale publication entrypoints when current main is complete
        if: steps.precheck.outputs.required == 'false'
        run: |
          set -euo pipefail
          git checkout --detach origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in \
            .github/workflows/external-binary-annex-publication.yml \
            .github/workflows/external-binary-annex-publication-v4.yml \
            preservation/external-binary-annex-publication-trigger.json \
            preservation/external-binary-annex-publication-attempt.json; do
            if test -f "$path"; then
              git rm "$path"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: retire completed annex publication entrypoints"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Set up Python
        if: steps.precheck.outputs.required == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install verification dependencies
        if: steps.precheck.outputs.required == 'true'
        run: python3 -m pip install -r requirements-ci.txt

      - name: Record V4 publication toolchain provenance
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "toolchain-provenance-v4" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/toolchain_provenance.py > \
            "$RUNNER_TEMP/external-annex-v4-toolchain-provenance.json"
          git --version
          curl --version
          python3 --version
          df -h

      - name: Verify exact source before any V4 Zenodo write
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "source-regression-tests-v4" > "$RUNNER_TEMP/annex-publication-stage.txt"
          test "$(git rev-parse HEAD)" = "$TRINITY_PUBLICATION_SOURCE_SHA"
          python3 -m pytest -q \
            tests/test_external_binary_annex_v2.py \
            tests/test_external_binary_annex_nft_backup.py \
            tests/test_external_binary_annex_v4.py \
            tests/test_external_annex_workflow_contexts.py \
            tests/test_preservation_capsule.py
          python3 scripts/trinity_record_chain.py verify
          python3 scripts/run_current_system_tests.py
          python3 scripts/test_no_secret_material_committed.py
          python3 scripts/test_no_private_key_material_committed.py

      - name: Build complete paginated evidence annex V4
        if: steps.precheck.outputs.required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "build-evidence-annex-v4" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/external_binary_annex_v4.py \
            --annex-type evidence \
            --output-dir "$EVIDENCE_PACKAGE_DIR" \
            --publication-date 2026-08-02 \
            --source-commit "$TRINITY_PUBLICATION_SOURCE_SHA"

      - name: Build complete manifest-proven Chronicle NFT annex V4
        if: steps.precheck.outputs.required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "build-nft-annex-v4" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/external_binary_annex_v4.py \
            --annex-type nft \
            --output-dir "$NFT_PACKAGE_DIR" \
            --publication-date 2026-08-02 \
            --source-commit "$TRINITY_PUBLICATION_SOURCE_SHA"
          df -h

      - name: Publish or reconcile final V4 annex records
        if: steps.precheck.outputs.required == 'true'
        id: publish
        run: |
          set -euo pipefail
          echo "zenodo-publish-or-reconcile-v4" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/publish_external_binary_annexes_to_zenodo_v4.py \
            --evidence-package-dir "$EVIDENCE_PACKAGE_DIR" \
            --nft-package-dir "$NFT_PACKAGE_DIR" \
            --state preservation/external-binary-annex-state.json \
            --rights-boundary-ack "$EXTERNAL_BINARY_ANNEX_RIGHTS_ACK" \
            --source-commit "$TRINITY_PUBLICATION_SOURCE_SHA"

      - name: Prove public DOI-only recovery of evidence annex V4
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "public-evidence-annex-v4-cold-restore" > "$RUNNER_TEMP/annex-publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/evidence-bootstrap"
          curl --fail --location --silent --show-error --retry 6 --retry-all-errors \
            "https://zenodo.org/records/${{ steps.publish.outputs.evidence_record_id }}/files/restore-trinity-annex.py?download=1" \
            -o "$RUNNER_TEMP/evidence-bootstrap/restore-trinity-annex.py"
          cd "$RUNNER_TEMP/evidence-bootstrap"
          env -u ZENODO_ACCESS_TOKEN python3 restore-trinity-annex.py \
            --zenodo-record-id "${{ steps.publish.outputs.evidence_record_id }}" \
            --output-dir "$RUNNER_TEMP/evidence-public-restore"
          cp "$RUNNER_TEMP/evidence-public-restore/recovery-report.json" \
            "$RUNNER_TEMP/evidence-public-recovery-report.json"
          rm -rf "$RUNNER_TEMP/evidence-public-restore" "$RUNNER_TEMP/evidence-bootstrap"

      - name: Prove public DOI-only recovery of Chronicle NFT annex V4
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "public-nft-annex-v4-cold-restore" > "$RUNNER_TEMP/annex-publication-stage.txt"
          mkdir -p "$RUNNER_TEMP/nft-bootstrap"
          curl --fail --location --silent --show-error --retry 6 --retry-all-errors \
            "https://zenodo.org/records/${{ steps.publish.outputs.nft_record_id }}/files/restore-trinity-annex.py?download=1" \
            -o "$RUNNER_TEMP/nft-bootstrap/restore-trinity-annex.py"
          cd "$RUNNER_TEMP/nft-bootstrap"
          env -u ZENODO_ACCESS_TOKEN python3 restore-trinity-annex.py \
            --zenodo-record-id "${{ steps.publish.outputs.nft_record_id }}" \
            --output-dir "$RUNNER_TEMP/nft-public-restore"
          cp "$RUNNER_TEMP/nft-public-restore/recovery-report.json" \
            "$RUNNER_TEMP/nft-public-recovery-report.json"
          rm -rf "$RUNNER_TEMP/nft-public-restore" "$RUNNER_TEMP/nft-bootstrap"

      - name: Seal V4 public state and recovery discovery
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "seal-public-annex-v4-state" > "$RUNNER_TEMP/annex-publication-stage.txt"
          python3 scripts/seal_external_binary_annex_publication.py \
            --evidence-report "$RUNNER_TEMP/evidence-public-recovery-report.json" \
            --nft-report "$RUNNER_TEMP/nft-public-recovery-report.json" \
            --source-commit "$TRINITY_PUBLICATION_SOURCE_SHA"
          cp preservation/external-binary-annex-state.json \
            "$RUNNER_TEMP/final-external-binary-annex-state.json"
          cp preservation/external-binary-annex-observation.json \
            "$RUNNER_TEMP/final-external-binary-annex-observation.json"
          cp api/recovery-index.json "$RUNNER_TEMP/final-recovery-index.json"

      - name: Commit verified V4 state and retire publication entrypoints
        if: steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          echo "commit-published-annex-v4-state" > "$RUNNER_TEMP/annex-publication-stage.txt"
          git fetch origin main --prune
          git checkout --detach origin/main
          cp "$RUNNER_TEMP/final-external-binary-annex-state.json" \
            preservation/external-binary-annex-state.json
          cp "$RUNNER_TEMP/final-external-binary-annex-observation.json" \
            preservation/external-binary-annex-observation.json
          cp "$RUNNER_TEMP/final-recovery-index.json" api/recovery-index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            preservation/external-binary-annex-state.json \
            preservation/external-binary-annex-observation.json \
            api/recovery-index.json
          for path in \
            .github/workflows/external-binary-annex-publication.yml \
            .github/workflows/external-binary-annex-publication-v4.yml \
            preservation/external-binary-annex-publication-trigger.json \
            preservation/external-binary-annex-publication-attempt.json; do
            if test -f "$path"; then
              git rm "$path"
            fi
          done
          git commit -m "archive: record complete publicly restored binary annex V4 DOIs"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            cp "$RUNNER_TEMP/final-external-binary-annex-state.json" \
              preservation/external-binary-annex-state.json
            cp "$RUNNER_TEMP/final-external-binary-annex-observation.json" \
              preservation/external-binary-annex-observation.json
            cp "$RUNNER_TEMP/final-recovery-index.json" api/recovery-index.json
            git add \
              preservation/external-binary-annex-state.json \
              preservation/external-binary-annex-observation.json \
              api/recovery-index.json
            if test -f preservation/external-binary-annex-publication-attempt.json; then
              git rm preservation/external-binary-annex-publication-attempt.json
            fi
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Record visible V4 failure only when current main is incomplete
        if: failure() && steps.precheck.outputs.required == 'true'
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git show origin/main:preservation/external-binary-annex-state.json \
            > "$RUNNER_TEMP/latest-main-external-annex-state.json"
          if python3 scripts/external_annex_publication_precheck.py \
            --current-state "$RUNNER_TEMP/latest-main-external-annex-state.json" \
            --complete-only; then
            exit 0
          fi
          git checkout --detach origin/main
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          stage_path = Path(os.environ["RUNNER_TEMP"]) / "annex-publication-stage.txt"
          stage = stage_path.read_text(encoding="utf-8").strip() if stage_path.exists() else "unknown"
          value = {
              "schema": "trinityaccord.external-binary-annex-publication-attempt.v4",
              "status": "failed",
              "stage": stage,
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_commit_sha": os.environ["TRINITY_PUBLICATION_SOURCE_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
              "failed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "zenodo_publication_may_require_idempotent_reconciliation": stage in {
                  "zenodo-publish-or-reconcile-v4",
                  "public-evidence-annex-v4-cold-restore",
                  "public-nft-annex-v4-cold-restore",
                  "seal-public-annex-v4-state",
                  "commit-published-annex-v4-state",
              },
          }
          Path("preservation/external-binary-annex-publication-attempt.json").write_text(
              json.dumps(value, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/external-binary-annex-publication-attempt.json
          git commit -m "archive: record external binary annex V4 publication failure"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload compact V4 publication evidence
        if: always() && steps.precheck.outputs.required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-binary-annex-v4-publication-evidence
          path: |
            ${{ runner.temp }}/external-annex-v4-toolchain-provenance.json
            ${{ runner.temp }}/evidence-public-recovery-report.json
            ${{ runner.temp }}/nft-public-recovery-report.json
            ${{ runner.temp }}/trinity-evidence-annex-v4/annex-manifest.json
            ${{ runner.temp }}/trinity-nft-annex-v4/annex-manifest.json
            preservation/external-binary-annex-state.json
            preservation/external-binary-annex-observation.json
            preservation/external-binary-annex-publication-attempt.json
          retention-days: 365
          if-no-files-found: warn
