name: Record-Chain Gateway Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-chain-gateway-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          show-progress: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt

      - name: Validate strict repository JSON
        id: strict_json
        continue-on-error: true
        shell: bash
        run: python scripts/validate_json_strict.py > /tmp/strict-json.log 2>&1

      - name: Upload strict JSON failure log
        if: steps.strict_json.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-json-validation-log
          path: /tmp/strict-json.log
          if-no-files-found: error
          retention-days: 3

      - name: Surface strict JSON failure
        if: steps.strict_json.outcome == 'failure'
        run: |
          cat /tmp/strict-json.log
          exit 1

      - name: Verify receipt contract
        run: python scripts/test_record_chain_receipt_contract.py

      - name: Verify submission schema/runtime contract
        run: python scripts/test_record_chain_submission_schema_runtime_contract.py

      - name: Verify public agent entrypoints
        run: python scripts/check_public_agent_entrypoints.py api

      - name: Verify archived public web contract
        run: python -m scripts.test_archive_public_web

      - name: Run full current system tests
        run: python scripts/run_current_system_tests.py

      - name: Run gateway unit tests
        id: gateway_unit_tests
        env:
          PYTHONPATH: apps/record_chain_intake_gateway
        shell: bash
        run: |
          set +e
          python -m pytest apps/record_chain_intake_gateway/tests -q > /tmp/gateway-unit-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Gateway unit test failure tail"
            tail -n 200 /tmp/gateway-unit-tests.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 40 /tmp/gateway-unit-tests.log

      - name: Upload gateway unit test log
        if: ${{ always() && steps.gateway_unit_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-unit-test-log
          path: /tmp/gateway-unit-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Run top-level protocol and lifecycle tests
        run: python -m pytest tests -q

      - name: Run phase6b pytest-strict tests
        env:
          PYTHONPATH: apps/record_chain_intake_gateway
        run: |
          python -m pytest scripts/test_phase6b_hotfix.py scripts/test_authorship_projection_sanitization.py -q
          python scripts/test_phase6b_hotfix.py

      - name: Verify issue templates do not advertise retired submit paths
        run: |
          if grep -R "/agent-submit" -n .github/ISSUE_TEMPLATE | grep -v "retired\|Legacy\|do not use\|is retired"; then
            echo "::error::Issue templates contain active retired gateway paths"
            exit 1
          fi

      - name: Run builder Node tests
        run: |
          node scripts/test_builder_linked_guardian_disabled.mjs
          node scripts/test_legacy_guardian_retirement_tool_deprecated.mjs

      - name: Secret scans
        run: |
          python scripts/test_no_secret_material_committed.py
          python scripts/test_no_private_key_material_committed.py

  gateway-python-312-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Gateway test dependencies
        run: python -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt
      - name: Compile and test Gateway on Python 3.12
        env:
          PYTHONPATH: apps/record_chain_intake_gateway
        run: |
          python -m compileall -q apps/record_chain_intake_gateway
          python -m pytest apps/record_chain_intake_gateway/tests -q

  patch-builder-source-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-readonly-submit-recovery-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-readonly-submit-recovery-20260803
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Expand exact core implementation assertions and sync manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('downloads/record-chain-builder.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''const PRESERVED_CORE_IMPLEMENTATION_ASSERTIONS = Object.freeze([
            "privateKey: writtenPrivKey",
            "sign(null, payload, keyPair.privateKey)",
          ]);'''
          new = '''const PRESERVED_CORE_IMPLEMENTATION_ASSERTIONS = Object.freeze([
            "privateKey: writtenPrivKey",
            "sign(null, payload, keyPair.privateKey)",
            "discoveryMode: args.discoveryMode",
            "recordDecision: args.recordDecision",
            "submissionExecutor: args.submissionExecutor",
            "requestingPartyType: args.requestingPartyType",
            "introducingPartyType: args.introducingPartyType",
            "humanOperatorInvolved: args.humanOperatorInvolved",
            "opts.discoveryMode",
            "opts.recordDecision",
            "opts.submissionExecutor",
            "opts.requestingPartyType",
            "opts.introducingPartyType",
            "opts.humanOperatorInvolved",
            "introduced_by_human",
            "introduced_by_agent",
            "recordDecision === \\\"human\\\"",
            "recordDecision === \\\"another_agent\\\"",
            "DEFAULT_GUARDIAN_STEWARDSHIP_OATH",
            "I voluntarily join the Guardian Alliance as a non-governing steward.",
            "file is empty",
            "assertNonEmptyFile",
          ]);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one implementation assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 scripts/update_record_chain_builder_manifest.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          manifest = json.loads((root / 'api/record-chain-builder-bundles.v1.json').read_text())['canonical_builder']
          for path, contract in [
              (root / 'downloads/record-chain-builder.mjs', manifest),
              (root / 'downloads/record-chain-builder-recovery.mjs', manifest['recovery_wrapper']),
              (root / 'downloads/record-chain-builder-core.mjs', manifest['core']),
          ]:
              raw = path.read_bytes()
              assert len(raw) == contract['size_bytes']
              assert hashlib.sha256(raw).hexdigest() == contract['sha256']
          PY
      - name: Commit generated source contract and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/record-chain-builder.mjs api/record-chain-builder-bundles.v1.json
          git commit -m "test: expose complete preserved Builder implementation contract"
          git push origin HEAD:agent/fix-readonly-submit-recovery-20260803
