name: Record-Chain Gateway Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-chain-gateway-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          show-progress: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt

      - name: Validate strict repository JSON
        id: strict_json
        continue-on-error: true
        shell: bash
        run: python scripts/validate_json_strict.py > /tmp/strict-json.log 2>&1

      - name: Upload strict JSON failure log
        if: steps.strict_json.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strict-json-validation-log
          path: /tmp/strict-json.log
          if-no-files-found: error
          retention-days: 3

      - name: Surface strict JSON failure
        if: steps.strict_json.outcome == 'failure'
        run: |
          cat /tmp/strict-json.log
          exit 1

      - name: Verify receipt contract
        run: python scripts/test_record_chain_receipt_contract.py

      - name: Verify submission schema/runtime contract
        run: python scripts/test_record_chain_submission_schema_runtime_contract.py

      - name: Verify public agent entrypoints
        run: python scripts/check_public_agent_entrypoints.py api

      - name: Verify archived public web contract
        run: python -m scripts.test_archive_public_web

      - name: Run full current system tests
        run: python scripts/run_current_system_tests.py

      - name: Run gateway unit tests
        id: gateway_unit_tests
        env:
          PYTHONPATH: apps/record_chain_intake_gateway
        shell: bash
        run: |
          set +e
          python -m pytest apps/record_chain_intake_gateway/tests -q > /tmp/gateway-unit-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Gateway unit test failure tail"
            tail -n 200 /tmp/gateway-unit-tests.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 40 /tmp/gateway-unit-tests.log

      - name: Upload gateway unit test log
        if: ${{ always() && steps.gateway_unit_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-unit-test-log
          path: /tmp/gateway-unit-tests.log
          if-no-files-found: error
          retention-days: 3

      - name: Run top-level protocol and lifecycle tests
        run: python -m pytest tests -q

      - name: Run phase6b pytest-strict tests
        env:
          PYTHONPATH: apps/record_chain_intake_gateway
        run: |
          python -m pytest scripts/test_phase6b_hotfix.py scripts/test_authorship_projection_sanitization.py -q
          python scripts/test_phase6b_hotfix.py

      - name: Verify issue templates do not advertise retired submit paths
        run: |
          if grep -R "/agent-submit" -n .github/ISSUE_TEMPLATE | grep -v "retired\|Legacy\|do not use\|is retired"; then
            echo "::error::Issue templates contain active retired gateway paths"
            exit 1
          fi

      - name: Run builder Node tests
        run: |
          node scripts/test_builder_linked_guardian_disabled.mjs
          node scripts/test_legacy_guardian_retirement_tool_deprecated.mjs

      - name: Secret scans
        run: |
          python scripts/test_no_secret_material_committed.py
          python scripts/test_no_private_key_material_committed.py

  gateway-python-312-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install Gateway test dependencies
        run: python -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt
      - name: Compile and test Gateway on Python 3.12
        env:
          PYTHONPATH: apps/record_chain_intake_gateway
        run: |
          python -m compileall -q apps/record_chain_intake_gateway
          python -m pytest apps/record_chain_intake_gateway/tests -q

  apply-pr894-submit-recovery:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/trigger-pr894-final-pr-event'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-submit-recovery-receipt-provenance-20260803
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Require exact target head
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/fix-submit-recovery-receipt-provenance-20260803"
          test "$(git rev-parse HEAD)" = "cde002cbfdb100bab97799a99bc7fa447330aca7"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install executor dependencies
        run: |
          python3 -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt
          npm ci

      - name: Apply exact audited patch
        id: apply_patch
        run: |
          set -euo pipefail
          python3 scripts/apply_submit_recovery_patch_once.py
          python3 scripts/apply_submit_recovery_followup_once.py
          python3 scripts/update_record_chain_builder_manifest.py
          git diff --check

      - name: Run focused and existing regressions
        id: regressions
        env:
          PYTHONPATH: apps/record_chain_intake_gateway
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_record_chain_submit_recovery.py
          python3 -m pytest -q apps/record_chain_intake_gateway/tests
          node scripts/test_record_chain_builder.mjs
          python3 scripts/trinity_record_chain.py verify

      - name: Commit final target patch
        id: commit_patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-submit-recovery-receipt-provenance-once.yml
          rm -f .github/workflows/run-submit-recovery-patch-once.yml
          rm -f scripts/apply_submit_recovery_patch_once.py
          rm -f scripts/apply_submit_recovery_followup_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/record_chain_intake_gateway/app.py \
                  apps/record_chain_intake_gateway/protected_app.py \
                  downloads/record-chain-builder.mjs \
                  scripts/update_record_chain_builder_manifest.py \
                  api/record-chain-builder-bundles.v1.json \
                  api/record-chain-intake-gateway.v1.json \
                  tests/test_record_chain_submit_recovery.py \
                  .github/workflows/apply-submit-recovery-receipt-provenance-once.yml \
                  .github/workflows/run-submit-recovery-patch-once.yml \
                  scripts/apply_submit_recovery_patch_once.py \
                  scripts/apply_submit_recovery_followup_once.py
          git commit -m "fix: recover ambiguous submits and preserve receipt provenance"
          git push origin HEAD:agent/fix-submit-recovery-receipt-provenance-20260803

      - name: Publish executor result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_OUTCOME: ${{ steps.apply_patch.outcome }}
          TEST_OUTCOME: ${{ steps.regressions.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit_patch.outcome }}
        run: |
          set -euo pipefail
          gh pr comment 894 --repo "$GITHUB_REPOSITORY" --body "## PR #894 registered Gateway-workflow executor result

- Workflow run: \`${GITHUB_RUN_ID}\`
- Exact patch: \`${APPLY_OUTCOME}\`
- Focused + Gateway + Builder + Record-Chain tests: \`${TEST_OUTCOME}\`
- Final branch commit/push: \`${COMMIT_OUTCOME}\`

The executor was locked to target head \`cde002cbfdb100bab97799a99bc7fa447330aca7\`; any mismatch failed closed."
