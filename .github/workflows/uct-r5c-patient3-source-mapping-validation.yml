name: UCT R5C validate author surface mapping Patient3

on:
  push:
    branches:
      - ops/uct-r5c-apstim-patient3-validate-20260928

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install stack
        run: python -m pip install remotezip nibabel scipy pandas numpy

      - name: Recover source package and Patient3 surfaces
        run: |
          set -euo pipefail
          mkdir -p work/src work/p3
          curl --fail --location --retry 5             "http://epi.fizica.unibuc.ro/apstim/APStimStandalone.zip"             -o work/APStimStandalone.zip
          unzip -q work/APStimStandalone.zip -d work/src
          python - <<'PY'
          from remotezip import RemoteZip
          from pathlib import Path
          url="http://epi.fizica.unibuc.ro/apstim/Patient3.zip"
          wanted=[
            "FreeSurfer/surf/lh.pial","FreeSurfer/surf/rh.pial",
            "FreeSurfer/surf/lh.sphere.reg","FreeSurfer/surf/rh.sphere.reg",
            "FreeSurfer/mri/orig/001.mgh"
          ]
          with RemoteZip(url) as z:
              names=z.namelist()
              for suf in wanted:
                  hits=[n for n in names if n.endswith(suf)]
                  if len(hits)!=1:
                      raise RuntimeError(f"{suf}: hits={hits}")
                  n=hits[0]
                  p=Path("work/p3")/suf
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(n))
          PY
          git clone --depth 1 --filter=blob:none https://github.com/nemarDatasets/on005169.git work/ds

      - name: Validate current BIDS ScanRAS -> old patient surface -> fsaverage -> HCP-MMP
        run: |
          set -euo pipefail
          mkdir -p out
          cat > work/validate.py <<'PY'
          from pathlib import Path
          import numpy as np, pandas as pd, scipy.io as sio, json, re
          import nibabel as nib
          from nibabel.freesurfer.io import read_geometry, read_annot
          from scipy.spatial import cKDTree

          src=Path("work/src/APStim")
          p3=Path("work/p3/FreeSurfer")
          ds=Path("work/ds")
          subdir=ds/"sub-02"
          patient_id=67

          mgh=nib.load(str(p3/"mri/orig/001.mgh"))
          vox2ras=np.asarray(mgh.affine,float)
          vox2ras_tkr=np.asarray(mgh.header.get_vox2ras_tkr(),float)
          tk_to_scanner=vox2ras @ np.linalg.inv(vox2ras_tkr)

          fsavg=src/"FreeSurfer/fsaverage"
          hemi={}
          for h in ["lh","rh"]:
              pv,_=read_geometry(str(p3/f"surf/{h}.pial"))
              sv,_=read_geometry(str(p3/f"surf/{h}.sphere.reg"))
              favg_s,_=read_geometry(str(fsavg/f"surf/{h}.sphere.reg"))
              labels,ctab,names=read_annot(str(fsavg/f"label/{h}.HCPMMP1.annot"),orig_ids=False)
              # patient pial FreeSurfer tkReg RAS -> scanner RAS
              ph=np.c_[pv,np.ones(len(pv))]
              pscan=(tk_to_scanner @ ph.T).T[:,:3]
              hemi[h]={
                  "pial_scanner":pscan,
                  "sphere":sv,
                  "fsavg_sphere":favg_s,
                  "labels":labels,
                  "names":[x.decode() if isinstance(x,bytes) else str(x) for x in names],
                  "pial_tree":cKDTree(pscan),
                  "fs_sphere_tree":cKDTree(favg_s),
              }

          mat=sio.loadmat(str(src/"Data/stim.mat"),squeeze_me=True,struct_as_record=False)
          stim=np.atleast_1d(mat["stim"])

          def normpair(x):
              return str(x).replace(" ","").replace("’","'").upper()

          source_by={}
          for i,s in enumerate(stim):
              try: pid=int(s.patient_id)
              except: continue
              if pid!=patient_id: continue
              pair=normpair(s.stim_pair)
              cur=float(np.asarray(s.current).reshape(-1)[0])
              symptom=str(s.symptom).lower()
              if "visual" not in symptom: continue
              source_by.setdefault(pair,[]).append((i,s,cur,symptom))

          rows=[]
          debug={"source_visual_keys":sorted([(k,[(int(i),float(cur),sym) for i,_,cur,sym in v]) for k,v in source_by.items()]),"current_keys":[]}
          for ses in sorted(subdir.glob("ses-*")):
              ieeg=ses/"ieeg"
              evf=list(ieeg.glob("*_events.tsv"))
              elf=list(ieeg.glob("*_electrodes.tsv"))
              if len(evf)!=1 or len(elf)!=1: continue
              ev=pd.read_csv(evf[0],sep="\t",keep_default_na=False)
              st=ev[pd.to_numeric(ev["stim_intensity"],errors="coerce").notna()]
              if len(st)!=1: continue
              r=st.iloc[0]
              pair=normpair(r["stim_contacts"])
              cur=float(r["stim_intensity"])
              debug["current_keys"].append([ses.name,pair,cur])
              if pair not in source_by: continue

              eldf=pd.read_csv(elf[0],sep="\t",keep_default_na=False)
              el=eldf.set_index("name")
              a,b=str(r["stim_contacts"]).split("-")

              def parse_contact(name):
                  m=re.match(r"^(.*?)(\\d+)$",str(name).strip())
                  return None if not m else (m.group(1),int(m.group(2)))

              def coord_contact(name):
                  if name in el.index:
                      return el.loc[name,["x","y","z"]].astype(float).to_numpy(),False,0.0
                  pc=parse_contact(name)
                  if pc is None: raise RuntimeError(f"cannot parse contact {name}")
                  shaft,idx=pc
                  rr=[]
                  for _,er in eldf.iterrows():
                      q=parse_contact(er["name"])
                      if q is None or q[0]!=shaft: continue
                      try: xyz=np.array([float(er.x),float(er.y),float(er.z)])
                      except Exception: continue
                      rr.append((q[1],xyz))
                  if len(rr)<3: raise RuntimeError(f"not enough contacts to reconstruct {name}")
                  inds=np.array([x[0] for x in rr],float)
                  xyz=np.stack([x[1] for x in rr])
                  fits=[np.polyfit(inds,xyz[:,k],1) for k in range(3)]
                  pred=np.array([np.polyval(fits[k],idx) for k in range(3)])
                  fit=np.stack([np.polyval(fits[k],inds) for k in range(3)],axis=1)
                  rmse=float(np.sqrt(np.mean(np.sum((fit-xyz)**2,axis=1))))
                  return pred,True,rmse

              xa,ra,rma=coord_contact(a)
              xb,rb,rmb=coord_contact(b)
              mid=(xa+xb)/2
              was_reconstructed=bool(ra or rb)
              reconstruction_rmse=max(rma,rmb)

              # Match source-code convention: prime denotes left.
              h="lh" if "'" in a else "rh"
              d_native,vid=hemi[h]["pial_tree"].query(mid,k=1)
              sphere=hemi[h]["sphere"][vid]
              d_sphere,fsvid=hemi[h]["fs_sphere_tree"].query(sphere,k=1)
              lab=int(hemi[h]["labels"][fsvid])
              parcel=hemi[h]["names"][lab] if 0<=lab<len(hemi[h]["names"]) else "UNKNOWN"

              # source visual match by pair; current equality is audited explicitly
              for mat_idx,s,source_cur,source_symptom in source_by[pair]:
                  source_vid0=int(np.asarray(s.stim_template_vertice).reshape(-1)[0])-1
                  source_hemi=int(np.asarray(s.stim_hemi).reshape(-1)[0])
                  rows.append({
                      "session":ses.name,
                      "pair":pair,
                      "current":cur,
                      "mapped_hemi":h,
                      "stim_coordinate_reconstructed":was_reconstructed,
                      "stim_reconstruction_rmse_mm":float(reconstruction_rmse),
                      "native_nearest_pial_mm":float(d_native),
                      "sphere_nearest_fsaverage_mm":float(d_sphere),
                      "mapped_template_vertex_0based":int(fsvid),
                      "source_template_vertex_0based":source_vid0,
                      "template_vertex_exact_match":bool(int(fsvid)==source_vid0),
                      "template_vertex_index_absdiff":int(abs(int(fsvid)-source_vid0)),
                      "mapped_hcpmmp":parcel,
                      "source_stim_hemi":source_hemi,
                      "source_mat_idx":int(mat_idx),
                      "source_current":float(source_cur),
                      "current_difference_mA":float(cur-source_cur),
                      "source_symptom":source_symptom,
                  })

          out=pd.DataFrame(rows)
          out.to_csv("out/Patient3_sub02_surface_mapping_validation.csv",index=False)
          summary={
              "patient_folder":"Patient3",
              "current_sub":"sub-02",
              "seeg_id":67,
              "n_matched_rows":int(len(out)),
              "exact_template_vertex_matches":int(out.template_vertex_exact_match.sum()) if len(out) else 0,
              "exact_template_vertex_fraction":float(out.template_vertex_exact_match.mean()) if len(out) else None,
              "native_nearest_pial_mm_median":float(out.native_nearest_pial_mm.median()) if len(out) else None,
              "native_nearest_pial_mm_max":float(out.native_nearest_pial_mm.max()) if len(out) else None,
              "sphere_nearest_fsaverage_mm_median":float(out.sphere_nearest_fsaverage_mm.median()) if len(out) else None,
              "sphere_nearest_fsaverage_mm_max":float(out.sphere_nearest_fsaverage_mm.max()) if len(out) else None,
              "tk_to_scanner_matrix":tk_to_scanner.tolist(),
          }
          Path("out/Patient3_sub02_surface_mapping_validation.json").write_text(json.dumps(summary,indent=2))
          Path("out/Patient3_sub02_match_debug.json").write_text(json.dumps(debug,indent=2))
          print(json.dumps(summary,indent=2))
          print(out.to_string(index=False))
          PY
          python work/validate.py

      - name: Upload validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uct-r5c-patient3-source-mapping-validation
          path: out/
          retention-days: 7
