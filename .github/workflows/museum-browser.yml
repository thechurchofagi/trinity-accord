name: Museum browser acceptance
on:
  pull_request:
    paths: ['museum/**', '.github/workflows/museum-browser.yml']
permissions:
  contents: read
concurrency:
  group: museum-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: museum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install only browser inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Validate distributed sources and interaction regressions
        run: |
          python museum/scripts/validate.py
          node --check museum/dist/museum.js
          for script in museum/scripts/check_*.mjs; do echo "$script"; node "$script"; done
      - name: Exercise rendered desktop and mobile views
        env:
          MUSEUM_QA_OUTPUT: ${{ runner.temp }}/museum-browser
        run: python museum/scripts/check_browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: museum-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/museum-browser
          retention-days: 14
          if-no-files-found: warn
