name: Validate NFT Text Descriptions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > toolchain-provenance.json
          cat toolchain-provenance.json

      - name: Validate the checked-in 175-item text mirror
        run: python3 scripts/test_nft_text_description_mirror_integrity.py

      - name: Explain the recovery boundary
        run: |
          echo "The historical nft-arweave-mirror-175-v1 Release has zero custom assets."
          echo "Byte recovery uses nft-backup-v1 or Zenodo DOI 10.5281/zenodo.21754229."
