name: Publish RLC Paper TA22
on:
  push:
    branches: [research/rlc-prefix-separable-v1-20261002]
    paths:
      - '.github/workflows/publish-rlc-prefix-separable.yml'
      - 'research/rlc-prefix-separable/PUBLISH-AUTHORIZATION.json'
permissions:
  contents: write
concurrency:
  group: rlc-ta22-zenodo-v1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta22-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/rlc-prefix-separable-v1-20261002
          fetch-depth: 1
      - name: Verify publication guards and exact reviewed package
        run: |
          python3 research/rlc-prefix-separable/test_publication.py
          python3 research/rlc-prefix-separable/publication.py verify
      - name: Publish the same reserved record and verify anonymous exact-byte readback
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/rlc-prefix-separable/publication.py publish
      - name: Persist publication and readback receipts
        if: always()
        run: python3 research/rlc-prefix-separable/publication.py persist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ta22-rlc-publication
          path: |
            research/rlc-prefix-separable/published/
            research/rlc-prefix-separable/EXPECTED-PUBLICATION.json
            research/rlc-prefix-separable/FINAL-REVIEW.json
            research/rlc-prefix-separable/PUBLISH-AUTHORIZATION.json
            research/rlc-prefix-separable/publication-record.json
            research/rlc-prefix-separable/publication-attempt.json
          retention-days: 90
          if-no-files-found: warn
