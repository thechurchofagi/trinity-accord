name: Repository Preservation Capsule

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repository-preservation-capsule.yml
      - scripts/run_repository_preservation_refresh_ci.sh
      - scripts/run_current_baseline_publication_v4_ci.sh
      - scripts/current_baseline_publication_v4.py
      - preservation/repository-preservation-refresh-authorization.json
      - preservation/current-baseline-publication-authorization-v4.json
  schedule:
    - cron: "17 9 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      publish_to_zenodo:
        description: Publish this verified capsule as a new Zenodo version
        required: true
        default: false
        type: boolean
      publication_confirmation:
        description: Exact irreversible-publication confirmation phrase
        required: false
        default: ""
        type: string

concurrency:
  group: repository-preservation-capsule
  cancel-in-progress: false

jobs:
  refresh-published-recovery:
    if: github.event_name == 'push'
    concurrency:
      group: main-write-lock
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK: ${{ vars.PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK }}
    steps:
      - name: Checkout repository with full source history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install proof verification dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Execute transactional repository preservation refresh
        run: bash scripts/run_repository_preservation_refresh_ci.sh

      - name: Upload repository preservation refresh proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-preservation-refresh-proof
          path: |
            ${{ runner.temp }}/local-restored-repository/recovery-report.json
            ${{ runner.temp }}/public-restored-repository/recovery-report.json
            ${{ runner.temp }}/public-metadata-report.json
            ${{ runner.temp }}/toolchain-provenance.json
          retention-days: 365
          if-no-files-found: warn

  build-and-cold-restore:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout current production tree and tag identities
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Build GitHub-independent repository capsule
        id: build
        run: |
          set -euo pipefail
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit HEAD \
            --output-dir "$RUNNER_TEMP/repository-preservation-capsule"

      - name: Simulate GitHub-zero one-command restore
        run: |
          set -euo pipefail
          capsule="$RUNNER_TEMP/repository-preservation-capsule"
          bootstrap="$RUNNER_TEMP/standalone-bootstrap"
          mkdir -p "$bootstrap"
          cp "$capsule/restore-trinity-accord.py" "$bootstrap/restore-trinity-accord.py"
          cd "$bootstrap"
          python3 restore-trinity-accord.py \
            --deposit-dir "$capsule" \
            --output-dir "$RUNNER_TEMP/restored-trinity-accord"
          test "$(git -C "$RUNNER_TEMP/restored-trinity-accord/repository" rev-parse HEAD)" = \
            "${{ steps.build.outputs.recovery_commit_sha }}"
          test "$(git -C "$RUNNER_TEMP/restored-trinity-accord/repository" rev-parse 'HEAD^{tree}')" = \
            "${{ steps.build.outputs.git_tree_oid }}"
          python3 "$RUNNER_TEMP/restored-trinity-accord/repository/scripts/audit_recovery_readiness.py"

      - name: Upload verified capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-preservation-capsule
          path: ${{ runner.temp }}/repository-preservation-capsule/
          retention-days: 90
          if-no-files-found: error

      - name: Upload local cold-start report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-preservation-capsule-local-recovery
          path: ${{ runner.temp }}/restored-trinity-accord/recovery-report.json
          retention-days: 365
          if-no-files-found: error

  publish-and-public-restore:
    needs: build-and-cold-restore
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_to_zenodo == true
    concurrency:
      group: main-write-lock
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK: ${{ vars.PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK }}
      PUBLICATION_CONFIRMATION: ${{ inputs.publication_confirmation }}
    steps:
      - name: Enforce owner and irreversible-publication gates
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "thechurchofagi"
          test "$PUBLICATION_CONFIRMATION" = "PUBLISH_TRINITY_REPOSITORY_CAPSULE_V1"
          test "$PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK" = \
            "TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED"
          test -n "$ZENODO_ACCESS_TOKEN"

      - name: Checkout state writer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Record publication toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/publication-toolchain-provenance.json"
          cat "$RUNNER_TEMP/publication-toolchain-provenance.json"

      - name: Download verified capsule from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c6699f4d507c0
        with:
          name: repository-preservation-capsule
          path: ${{ runner.temp }}/repository-preservation-capsule

      - name: Reverify before irreversible publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from preservation_capsule import verify_local_package
          result = verify_local_package(Path("${{ runner.temp }}/repository-preservation-capsule"))
          print(result["capsule_id"], result["package_identity_sha256"])
          PY

      - name: Publish or reconcile independent Zenodo version
        id: publish
        run: |
          set -euo pipefail
          python3 scripts/publish_preservation_capsule_to_zenodo.py \
            --capsule-dir "$RUNNER_TEMP/repository-preservation-capsule" \
            --api-base "$ZENODO_API_BASE" \
            --rights-boundary-ack "$PRESERVATION_CAPSULE_ZENODO_RIGHTS_ACK"

      - name: Prove public DOI-only recovery from a fresh directory
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-bootstrap"
          cp "$RUNNER_TEMP/repository-preservation-capsule/restore-trinity-accord.py" \
            "$RUNNER_TEMP/public-bootstrap/restore-trinity-accord.py"
          cd "$RUNNER_TEMP/public-bootstrap"
          python3 restore-trinity-accord.py \
            --zenodo-record-id "${{ steps.publish.outputs.record_id }}" \
            --output-dir "$RUNNER_TEMP/public-doi-restore"
          test -f "$RUNNER_TEMP/public-doi-restore/recovery-report.json"

      - name: Commit verified DOI state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/zenodo-state.json
          if git diff --cached --quiet; then
            echo "Preservation DOI state already current."
            exit 0
          fi
          git commit -m "archive: record repository preservation DOI"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main --prune
            git rebase origin/main
            git add preservation/zenodo-state.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Zenodo published but verified DOI state could not be pushed."
          exit 1

      - name: Upload public DOI recovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-preservation-capsule-public-recovery
          path: ${{ runner.temp }}/public-doi-restore/recovery-report.json
          retention-days: 365
          if-no-files-found: error
