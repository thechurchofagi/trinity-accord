name: Temporary seventh scholarly parser review applicator

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - ".github/tmp-seventh-trigger.txt"
      - ".github/workflows/tmp-seventh-scholarly-review.yml"

permissions:
  contents: write

jobs:
  apply-seventh-review-fixes:
    if: github.event.pull_request.number == 1071 && github.event.pull_request.head.ref == 'agent/close-final-scholarly-parser-gaps-2026-08-21'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0

      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py

      - name: Apply seventh-round Codex review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('scripts/check_deployment_freshness.py')
          tests_path = Path('tests/test_scholarly_parser_edge_cases.py')
          source = source_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              '''SCHEMA_ORG_BASES = {"http://schema.org", "https://schema.org"}\nSCHEMA_ORG_VOCAB_BASES = {"http://schema.org/", "https://schema.org/"}\nSCHEMA_ORG_ARTICLE_IRIS = {\n''',
              '''SCHEMA_ORG_BASES = {"http://schema.org", "https://schema.org"}\nSCHEMA_ORG_VOCAB_BASES = {"http://schema.org/", "https://schema.org/"}\nSCHEMA_ORG_REMOTE_CONTEXTS = SCHEMA_ORG_BASES | SCHEMA_ORG_VOCAB_BASES\nSCHEMA_ORG_ARTICLE_IRIS = {\n''',
              'schema remote context constants',
          )

          source = replace_once(
              source,
              '''    _SVG_HTML_INTEGRATION_POINTS = {"foreignobject", "desc", "title"}\n    _MATHML_TEXT_INTEGRATION_POINTS = {"mi", "mo", "mn", "ms", "mtext"}\n    _MATHML_HTML_ENCODINGS = {"text/html", "application/xhtml+xml"}\n''',
              '''    _SVG_HTML_INTEGRATION_POINTS = {"foreignobject", "desc", "title"}\n    _MATHML_TEXT_INTEGRATION_POINTS = {"mi", "mo", "mn", "ms", "mtext"}\n    _MATHML_HTML_ENCODINGS = {"text/html", "application/xhtml+xml"}\n    _FOREIGN_HTML_BREAKOUT_TAGS = {\n        "b",\n        "big",\n        "blockquote",\n        "body",\n        "br",\n        "center",\n        "code",\n        "dd",\n        "div",\n        "dl",\n        "dt",\n        "em",\n        "embed",\n        "h1",\n        "h2",\n        "h3",\n        "h4",\n        "h5",\n        "h6",\n        "head",\n        "hr",\n        "i",\n        "img",\n        "li",\n        "listing",\n        "menu",\n        "meta",\n        "nobr",\n        "ol",\n        "p",\n        "pre",\n        "ruby",\n        "s",\n        "small",\n        "span",\n        "strong",\n        "strike",\n        "sub",\n        "sup",\n        "table",\n        "tt",\n        "u",\n        "ul",\n        "var",\n    }\n''',
              'foreign breakout tag set',
          )

          source = replace_once(
              source,
              '''        return "html"\n\n    def _push_element(\n''',
              '''        return "html"\n\n    @classmethod\n    def _is_foreign_html_breakout(\n        cls, tag: str, attributes: dict[str, str | None]\n    ) -> bool:\n        if tag in cls._FOREIGN_HTML_BREAKOUT_TAGS:\n            return True\n        return tag == "font" and any(\n            name in attributes for name in {"color", "face", "size"}\n        )\n\n    def _pop_open_foreign_content(self) -> None:\n        # HTML breakout start tags are reprocessed after foreign ancestors are\n        # popped back to an HTML-namespace element. Do not cross an HTML\n        # template boundary because it is already an HTML namespace element.\n        while self._element_stack and self._element_stack[-1][1] != "html":\n            _tag, namespace, _attributes = self._element_stack.pop()\n            if namespace != "html":\n                self._foreign_content_depth = max(\n                    0, self._foreign_content_depth - 1\n                )\n\n    def _push_element(\n''',
              'foreign breakout helper',
          )

          source = replace_once(
              source,
              '''        attributes, duplicates, values = _first_attributes(attrs)\n        namespace = self._namespace_for_start(tag, attributes)\n\n        # A non-head HTML start tag implicitly ends the optional document\n''',
              '''        attributes, duplicates, values = _first_attributes(attrs)\n        namespace = self._namespace_for_start(tag, attributes)\n        if (\n            namespace != "html"\n            and self._is_foreign_html_breakout(tag, attributes)\n        ):\n            self._pop_open_foreign_content()\n            namespace = self._namespace_for_start(tag, attributes)\n\n        # A non-head HTML start tag implicitly ends the optional document\n''',
              'foreign breakout start-tag handling',
          )

          source = replace_once(
              source,
              '''def _normalized_schema_url(value: object) -> str | None:\n    if not isinstance(value, str):\n        return None\n    return value.strip().rstrip("/")\n''',
              '''def _normalized_schema_url(value: object) -> str | None:\n    if not isinstance(value, str):\n        return None\n    # Remote JSON-LD context IRIs are exact strings. Do not trim whitespace or\n    # path characters into a different supported context URL.\n    return value\n''',
              'exact remote context normalization',
          )

          source = replace_once(
              source,
              '''def _expand_compact_iri(value: str, prefixes: dict[str, str]) -> str:\n    stripped = value.strip()\n    if ":" not in stripped:\n        return stripped\n    prefix, suffix = stripped.split(":", 1)\n    base = prefixes.get(prefix)\n    if base is None:\n        return stripped\n    return base + suffix\n''',
              '''def _expand_compact_iri(value: str, prefixes: dict[str, str]) -> str:\n    # Whitespace is significant in an IRI string; fail closed rather than\n    # silently canonicalizing an invalid spelling.\n    if value != value.strip():\n        return value\n    stripped = value\n    if ":" not in stripped:\n        return stripped\n    prefix, suffix = stripped.split(":", 1)\n    # A scheme-like IRI with // is already absolute and must not be rewritten\n    # merely because a context happens to define a term named http or https.\n    if suffix.startswith("//"):\n        return stripped\n    base = prefixes.get(prefix)\n    if base is None:\n        return stripped\n    return base + suffix\n''',
              'absolute compact IRI handling',
          )

          source = replace_once(
              source,
              '''    if isinstance(value, dict):\n        if "@id" not in value:\n            return vocab_is_schema\n        value = value.get("@id")\n''',
              '''    if isinstance(value, dict):\n        if "@reverse" in value:\n            # A reverse-property definition does not map the raw key to the\n            # required forward Schema.org property.\n            return False\n        if "@id" not in value:\n            return vocab_is_schema\n        value = value.get("@id")\n''',
              'reverse term definition handling',
          )

          source = replace_once(
              source,
              '''    if isinstance(context, str):\n        is_schema = _normalized_schema_url(context) in SCHEMA_ORG_BASES\n        if is_schema:\n            # Treat the known Schema.org remote context as the vocabulary source.\n            # It replaces earlier relevant term overrides, but remains overridable\n            # by a later local @vocab in a context list.\n            for term in SCHOLARLY_SCHEMA_TERMS:\n                term_overrides.pop(term, None)\n            return (True, term_overrides, prefixes, unsupported)\n        return (vocab_is_schema, term_overrides, prefixes, True)\n''',
              '''    if isinstance(context, str):\n        is_schema = _normalized_schema_url(context) in SCHEMA_ORG_REMOTE_CONTEXTS\n        if is_schema:\n            # Treat the known Schema.org remote context as a vocabulary source.\n            # Existing explicit term definitions remain active unless the remote\n            # context actually redefines them; this offline verifier does not\n            # fabricate such redefinitions.\n            return (True, term_overrides, prefixes, unsupported)\n        return (vocab_is_schema, term_overrides, prefixes, True)\n''',
              'remote schema context state',
          )

          source = replace_once(
              source,
              '''        if "@vocab" in context:\n            raw_vocab = context.get("@vocab")\n            vocab_is_schema = (\n                isinstance(raw_vocab, str)\n                and raw_vocab.strip() in SCHEMA_ORG_VOCAB_BASES\n            )\n''',
              '''        if "@vocab" in context:\n            raw_vocab = context.get("@vocab")\n            expanded_vocab = (\n                _expand_compact_iri(raw_vocab, prefixes)\n                if isinstance(raw_vocab, str)\n                else None\n            )\n            vocab_is_schema = expanded_vocab in SCHEMA_ORG_VOCAB_BASES\n''',
              'compact @vocab expansion',
          )

          source = replace_once(
              source,
              '''    encoding_state, _encoding_scopes = _property_child_state(\n        "encoding",\n        schema_state,\n        child_schema_state,\n        article_scopes,\n        child_scopes,\n    )\n\n    encoding = article.get("encoding")\n    if not isinstance(encoding, dict):\n        errors.append(f"{SCHOLARLY_LANDING_PATH}: ScholarlyArticle.encoding is missing")\n    else:\n        if "@context" in encoding:\n            encoding_state = _schema_context_state(\n                encoding.get("@context"), encoding_state\n            )\n        for field in ("contentUrl", "encodingFormat"):\n''',
              '''    encoding_state, encoding_scopes = _property_child_state(\n        "encoding",\n        schema_state,\n        child_schema_state,\n        article_scopes,\n        child_scopes,\n    )\n\n    encoding = article.get("encoding")\n    if not isinstance(encoding, dict):\n        errors.append(f"{SCHOLARLY_LANDING_PATH}: ScholarlyArticle.encoding is missing")\n    else:\n        if "@context" in encoding:\n            encoding_context = encoding.get("@context")\n            encoding_state = _schema_context_state(\n                encoding_context, encoding_state\n            )\n            encoding_scopes = _property_scoped_contexts(\n                encoding_context, encoding_scopes\n            )\n\n        encoding_type = encoding.get("@type")\n        encoding_type_terms = (\n            [encoding_type]\n            if isinstance(encoding_type, str)\n            else [term for term in encoding_type if isinstance(term, str)]\n            if isinstance(encoding_type, list)\n            else []\n        )\n        for type_term in sorted(encoding_type_terms):\n            if type_term not in encoding_scopes:\n                continue\n            type_context = encoding_scopes[type_term]\n            encoding_state = _schema_context_state(\n                type_context, encoding_state\n            )\n            encoding_scopes = _property_scoped_contexts(\n                type_context, encoding_scopes\n            )\n\n        for field in ("contentUrl", "encodingFormat"):\n''',
              'encoding type-scoped context validation',
          )

          additions = r'''


def test_html_breakout_tag_exits_svg_for_jsonld_script() -> None:
    parser = deployment.ScholarlyHTMLParser()
    parser.feed(
        "<!doctype html><html><head></head><body>"
        "<svg><p>"
        '<script type="application/ld+json">{"ok":true}</script>'
        "</p></svg></body></html>"
    )
    parser.close()

    assert parser.json_ld_blocks == ['{"ok":true}']
    assert parser._foreign_content_depth == 0


def test_reverse_definition_for_required_schema_term_is_rejected() -> None:
    page = _landing(
        {
            "@context": {
                "@vocab": "https://schema.org/",
                "name": {"@reverse": "https://example.invalid/not-name"},
            },
            "@graph": [_valid_article()],
        }
    )
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)

    assert any(
        "ScholarlyArticle.name is not mapped to Schema.org/name" in error
        for error in errors
    )


def test_encoding_type_scoped_context_is_applied_to_properties() -> None:
    page = _landing(
        {
            "@context": {
                "@vocab": "https://schema.org/",
                "MediaObject": {
                    "@id": "https://schema.org/MediaObject",
                    "@context": {
                        "contentUrl": "https://example.invalid/not-content-url"
                    },
                },
            },
            "@graph": [_valid_article()],
        }
    )
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)

    assert any(
        "ScholarlyArticle.encoding.contentUrl is not mapped" in error
        for error in errors
    )


def test_remote_schema_context_urls_are_matched_exactly() -> None:
    for context in (" https://schema.org ", "https://schema.org////"):
        page = _landing({"@context": context, "@graph": [_valid_article()]})
        errors: list[str] = []
        deployment.check_scholarly_landing(page, errors)

        assert any(
            "lacks an applicable Schema.org JSON-LD context" in error
            for error in errors
        )


def test_compact_iri_vocab_is_expanded_from_prior_prefix() -> None:
    page = _landing(
        {
            "@context": [
                {
                    "schema": {
                        "@id": "https://schema.org/",
                        "@prefix": True,
                    }
                },
                {"@vocab": "schema:"},
            ],
            "@graph": [_valid_article()],
        }
    )
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)

    assert errors == []


def test_remote_schema_context_preserves_prior_term_override() -> None:
    page = _landing(
        {
            "@context": [
                {"name": "https://example.invalid/not-name"},
                "https://schema.org",
            ],
            "@graph": [_valid_article()],
        }
    )
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)

    assert any(
        "ScholarlyArticle.name is not mapped to Schema.org/name" in error
        for error in errors
    )


def test_absolute_schema_iri_is_not_rewritten_by_https_prefix() -> None:
    page = _landing(
        {
            "@context": {
                "@vocab": "https://schema.org/",
                "https": "https://example.invalid/",
                "name": "https://schema.org/name",
            },
            "@graph": [_valid_article()],
        }
    )
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)

    assert errors == []
'''

          marker = 'def test_html_breakout_tag_exits_svg_for_jsonld_script()'
          if marker in tests:
              raise SystemExit('seventh-round tests already present unexpectedly')
          tests = tests.rstrip() + additions + '\n'

          source_path.write_text(source, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python3 - <<'PY'
          import inspect
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / 'tests'))
          import test_scholarly_parser_edge_cases as suite

          tests = sorted(
              (name, fn)
              for name, fn in vars(suite).items()
              if name.startswith('test_') and inspect.isfunction(fn)
          )
          if len(tests) != 37:
              raise SystemExit(f'expected 37 focused tests, found {len(tests)}')
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'focused scholarly regressions: {len(tests)}/{len(tests)} PASS')
          PY

          python3 -m py_compile scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git diff --check

      - name: Commit seventh-round fixes and remove temporary applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/tmp-seventh-scholarly-review.yml .github/tmp-seventh-trigger.txt
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git commit -m "fix: close seventh scholarly review findings"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
