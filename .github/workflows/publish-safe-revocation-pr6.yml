name: Publish PR-v6.0.0 Zenodo DOI (frozen assets)

on:
  push:
    branches:
      - research/safe-revocation-v6-20261011
    paths:
      - research/uct-agent-consciousness-workspace/records/ASI_CC_20261011_Control_and_Coexistence/paper_coexistence_v6.0.0/publication/PUBLISH-AUTHORIZATION.json

permissions:
  contents: write

concurrency:
  group: pr6-zenodo-publication-one-version
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[pr6-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      PUBLICATION_DIR: research/uct-agent-consciousness-workspace/records/ASI_CC_20261011_Control_and_Coexistence/paper_coexistence_v6.0.0/publication
    steps:
      - name: Checkout exact explicitly authorized commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare verifier
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 -m pip install --disable-pip-version-check requests==2.32.3
      - name: Verify frozen assets, rights and exact publication manifest
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          python3 "$PUBLICATION_DIR/scripts/publish_zenodo.py" verify
      - name: Publish one exact titled Zenodo preprint and read back every public file
        run: |
          set -euo pipefail
          python3 "$PUBLICATION_DIR/scripts/publish_zenodo.py" publish
      - name: Check DOI resolver independently without changing public record
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,requests,time
          from pathlib import Path
          p=Path(os.environ['PUBLICATION_DIR'])
          r=json.loads((p/'PUBLICATION-RECEIPT.json').read_text())
          url='https://doi.org/'+r['doi']; target='https://zenodo.org/records/'+str(r['record_id'])
          receipt={'doi':r['doi'],'expected_record_url':target,'status':'PENDING','authenticated':False}
          for k in range(8):
              try:
                  q=requests.get(url,timeout=20,allow_redirects=True)
                  receipt.update({'http_code':q.status_code,'resolved_to':q.url})
                  if q.status_code==200 and target in q.url:
                      receipt['status']='RESOLVER_PASS';break
              except requests.RequestException as e: receipt['error_type']=type(e).__name__
              time.sleep(min(2+k,8))
          (p/'DOI-RESOLUTION.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Retain exact publication attempt, receipt, and resolver observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr6-zenodo-publication-${{ github.run_id }}
          path: |
            ${{ env.PUBLICATION_DIR }}/EXPECTED-PUBLICATION.json
            ${{ env.PUBLICATION_DIR }}/PUBLISH-AUTHORIZATION.json
            ${{ env.PUBLICATION_DIR }}/PUBLICATION-ATTEMPT.json
            ${{ env.PUBLICATION_DIR }}/PUBLICATION-RECEIPT.json
            ${{ env.PUBLICATION_DIR }}/DOI-RESOLUTION.json
          retention-days: 90
          if-no-files-found: warn
      - name: Persist actual Zenodo state to publication branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for file in PUBLICATION-ATTEMPT.json PUBLICATION-RECEIPT.json DOI-RESOLUTION.json; do
            if test -f "$PUBLICATION_DIR/$file"; then git add "$PUBLICATION_DIR/$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'research: record PR-v6 Zenodo publication result [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:research/safe-revocation-v6-20261011; then exit 0; fi
            git fetch origin research/safe-revocation-v6-20261011
            git rebase origin/research/safe-revocation-v6-20261011
          done
          echo 'Publication result could not be pushed. Download retained workflow artifact; DO NOT create a duplicate Zenodo deposit.' >&2
          exit 1
