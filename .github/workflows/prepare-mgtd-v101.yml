name: MGTD v1.0.1 linked Zenodo version reservation
on:
  push:
    branches: [research/mgtd-method-v1-0-1-20261008]
    paths:
      - research/map-guided-theory-development/v1.0.1/PREPARE-AUTHORIZATION.json
permissions:
  contents: write
concurrency:
  group: mgtd-v101-zenodo-version-sequence
  cancel-in-progress: false
jobs:
  reserve:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[mgtd-v101-prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout specific new branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/mgtd-method-v1-0-1-20261008
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Check exactly authorized old DOI and new-version source
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('research/map-guided-theory-development/v1.0.1')
          a=json.loads((p/'PREPARE-AUTHORIZATION.json').read_text())
          assert a=={'authorized':True,'old_record_id':23241205,'old_doi':'10.5281/zenodo.23241205','new_version':'1.0.1','policy':'CREATE_LINKED_VERSION_ONCE_WITHOUT_PUBLISHING'}
          PY
          python3 research/map-guided-theory-development/v1.0.1/prepare_version.py verify
      - name: Reserve linked Zenodo v1.0.1 draft once (no publication)
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/map-guided-theory-development/v1.0.1/prepare_version.py prepare
      - name: Preserve uncertain or successful preparation state
        if: always()
        run: python3 research/map-guided-theory-development/v1.0.1/prepare_version.py persist
      - name: Retain operation state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mgtd-v101-version-reservation-${{ github.run_id }}
          path: |
            research/map-guided-theory-development/v1.0.1/version-intent.json
            research/map-guided-theory-development/v1.0.1/new-version-deposit.json
            research/map-guided-theory-development/v1.0.1/preparation-status.json
          retention-days: 90
          if-no-files-found: warn
