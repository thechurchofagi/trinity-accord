name: Temporary PR 1071 self fix runner

on:
  push:
    branches:
      - agent/close-final-scholarly-parser-gaps-2026-08-21

permissions:
  contents: write

jobs:
  self-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0

      - name: Guard exact pre-run state
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "75dfaa3f40405f6c4774ffae81ae7b058867aebd"
          test -f .tmp-pr1071-self-fix-trigger
          test -f .github/workflows/tmp-pr1071-self-fix-runner.yml

      - name: Install focused test tooling
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply four exact-head P2 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('scripts/check_deployment_freshness.py')
          tests_path = Path('tests/test_scholarly_parser_edge_cases.py')
          source = source_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_regex_once(text: str, pattern: str, new: str, label: str) -> str:
              result, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return result

          source = replace_once(
              source,
              '''SchemaContextState = tuple[\n    bool, dict[str, bool], dict[str, str], bool, frozenset[str]\n]\nDEFAULT_SCHEMA_CONTEXT_STATE: SchemaContextState = (\n    False, {}, {}, False, frozenset()\n)''',
              '''SchemaContextState = tuple[\n    bool, dict[str, bool], dict[str, str], bool, dict[str, str]\n]\nDEFAULT_SCHEMA_CONTEXT_STATE: SchemaContextState = (\n    False, {}, {}, False, {}\n)''',
              'track protected definitions instead of only term names',
          )

          source = replace_once(
              source,
              '''            if parent_tag == "annotation-xml":\n                encoding = (parent_attributes.get("encoding") or "").lower()\n                if encoding in self._MATHML_HTML_ENCODINGS:\n                    if tag == "svg":\n                        return "svg"\n                    if tag == "math":\n                        return "math"\n                    return "html"\n            return "math"''',
              '''            if parent_tag == "annotation-xml":\n                # HTML's foreign-content rules recognize an SVG start token in\n                # MathML annotation-xml regardless of the annotation encoding.\n                if tag == "svg":\n                    return "svg"\n                encoding = (parent_attributes.get("encoding") or "").lower()\n                if encoding in self._MATHML_HTML_ENCODINGS:\n                    if tag == "math":\n                        return "math"\n                    return "html"\n            return "math"''',
              'recognize svg start inside unencoded annotation-xml',
          )

          old_term_helper = '''def _term_maps_to_schema_term(\n    value: object,\n    term: str,\n    vocab_is_schema: bool,\n    prefixes: dict[str, str],\n) -> bool:\n    if isinstance(value, dict):\n        if "@reverse" in value:\n            return False\n        if "@id" not in value:\n            return vocab_is_schema\n        value = value.get("@id")\n    if not isinstance(value, str):\n        return False\n    stripped = value.strip()\n    expanded = _expand_compact_iri(stripped, prefixes)\n    if expanded in {f"{base}/{term}" for base in SCHEMA_ORG_BASES}:\n        return True\n    return vocab_is_schema and stripped == term\n'''
          new_term_helper = '''def _term_alias_key(term: str) -> str:\n    # Prefix entries and whole-term aliases share one internal mapping without\n    # colliding: only strings before a colon are consulted as compact prefixes.\n    return f"__jsonld_term_alias__:{term}"\n\n\ndef _raw_term_mapping(definition: object) -> str | None:\n    if isinstance(definition, dict):\n        if "@reverse" in definition:\n            return None\n        definition = definition.get("@id")\n    return definition if isinstance(definition, str) else None\n\n\ndef _expand_term_iri(value: str, prefixes: dict[str, str]) -> str:\n    """Expand compact IRIs and recursively resolve whole-term aliases."""\n    current = value\n    seen: set[str] = set()\n    for _ in range(len(prefixes) + 1):\n        if current != current.strip():\n            return current\n        compact = _expand_compact_iri(current, prefixes)\n        if compact != current or ":" in current:\n            return compact\n        if current in seen:\n            return current\n        seen.add(current)\n        mapped = prefixes.get(_term_alias_key(current))\n        if mapped is None:\n            return current\n        current = mapped\n    return current\n\n\ndef _protected_term_signature(definition: object, protected: bool) -> str:\n    canonical = definition\n    if isinstance(definition, dict):\n        canonical = dict(definition)\n        canonical.pop("@protected", None)\n    return json.dumps(\n        {"protected": protected, "definition": canonical},\n        ensure_ascii=False,\n        sort_keys=True,\n        separators=(",", ":"),\n    )\n\n\ndef _term_maps_to_schema_term(\n    value: object,\n    term: str,\n    vocab_is_schema: bool,\n    prefixes: dict[str, str],\n) -> bool:\n    if isinstance(value, dict):\n        if "@reverse" in value:\n            return False\n        if "@id" not in value:\n            return vocab_is_schema\n        value = value.get("@id")\n    if not isinstance(value, str):\n        return False\n    expanded = _expand_term_iri(value, prefixes)\n    if expanded in {f"{base}/{term}" for base in SCHEMA_ORG_BASES}:\n        return True\n    return vocab_is_schema and value == term\n'''
          source = replace_once(
              source, old_term_helper, new_term_helper,
              'add recursive term aliases and preserve explicit IRI whitespace',
          )

          new_schema_context = '''def _schema_context_state(\n    context: object,\n    inherited: SchemaContextState,\n) -> SchemaContextState:\n    """Track Schema vocabulary, term mappings, prefixes, unsupported contexts, and protection."""\n    if context is None:\n        return DEFAULT_SCHEMA_CONTEXT_STATE\n\n    (\n        vocab_is_schema,\n        inherited_overrides,\n        inherited_prefixes,\n        unsupported,\n        inherited_protected,\n    ) = inherited\n    term_overrides = dict(inherited_overrides)\n    prefixes = dict(inherited_prefixes)\n    protected_definitions = dict(inherited_protected)\n\n    if isinstance(context, str):\n        is_schema = _normalized_schema_url(context) in SCHEMA_ORG_REMOTE_CONTEXTS\n        if is_schema:\n            return (\n                True, term_overrides, prefixes, unsupported, dict(protected_definitions)\n            )\n        return (\n            vocab_is_schema, term_overrides, prefixes, True, dict(protected_definitions)\n        )\n\n    if isinstance(context, dict):\n        if "@import" in context:\n            return (\n                vocab_is_schema, term_overrides, prefixes, True, dict(protected_definitions)\n            )\n\n        if "@vocab" in context:\n            raw_vocab = context.get("@vocab")\n            expanded_vocab = (\n                _expand_compact_iri(raw_vocab, prefixes)\n                if isinstance(raw_vocab, str)\n                else None\n            )\n            vocab_is_schema = expanded_vocab in SCHEMA_ORG_VOCAB_BASES\n\n        definitions = [\n            (term, definition)\n            for term, definition in context.items()\n            if not term.startswith("@")\n        ]\n\n        context_protected = context.get("@protected") is True\n        for term, definition in definitions:\n            if term not in SCHOLARLY_SCHEMA_TERMS:\n                continue\n            if isinstance(definition, dict) and "@protected" in definition:\n                definition_protected = definition.get("@protected") is True\n            else:\n                definition_protected = context_protected\n            signature = _protected_term_signature(definition, definition_protected)\n            if term in protected_definitions:\n                if signature != protected_definitions[term]:\n                    unsupported = True\n            elif definition_protected:\n                protected_definitions[term] = signature\n\n        for term, _ in definitions:\n            prefixes.pop(term, None)\n            prefixes.pop(_term_alias_key(term), None)\n        for _ in range(max(1, len(definitions))):\n            changed = False\n            for term, definition in definitions:\n                mapping = _prefix_mapping(definition, prefixes)\n                if mapping is not None and prefixes.get(term) != mapping:\n                    prefixes[term] = mapping\n                    changed = True\n            if not changed:\n                break\n\n        for term, definition in definitions:\n            raw_mapping = _raw_term_mapping(definition)\n            if raw_mapping is not None:\n                prefixes[_term_alias_key(term)] = raw_mapping\n\n        for term in SCHOLARLY_SCHEMA_TERMS:\n            if term in context:\n                term_overrides[term] = _term_maps_to_schema_term(\n                    context.get(term), term, vocab_is_schema, prefixes\n                )\n        return (\n            vocab_is_schema,\n            term_overrides,\n            prefixes,\n            unsupported,\n            dict(protected_definitions),\n        )\n\n    if isinstance(context, list):\n        state = inherited\n        for item in context:\n            state = _schema_context_state(item, state)\n        return state\n\n    return (\n        vocab_is_schema, term_overrides, prefixes, True, dict(protected_definitions)\n    )\n'''
          source = replace_regex_once(
              source,
              r'def _schema_context_state\(.*?\n\ndef _context_propagates',
              new_schema_context + '\n\ndef _context_propagates',
              'replace schema context state with protected-definition and alias handling',
          )

          extra_tests = r'''


def test_explicit_schema_term_mapping_with_surrounding_whitespace_fails_closed() -> None:
    page = _landing({
        "@context": {
            "@vocab": "https://schema.org/",
            "name": " https://schema.org/name ",
        },
        "@graph": [_valid_article()],
    })
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)
    assert any(
        "ScholarlyArticle.name is not mapped to Schema.org/name" in error
        for error in errors
    )


def test_unencoded_annotation_xml_svg_foreignobject_exposes_html_jsonld() -> None:
    meta = "".join(
        f'<meta name="{html.escape(name, quote=True)}" '
        f'content="{html.escape(value, quote=True)}">'
        for name, value in deployment.SCHOLARLY_META_EXPECTED.items()
    )
    document = {
        "@context": "https://schema.org",
        "@graph": [_valid_article()],
    }
    json_ld = json.dumps(document)
    page = (
        "<!doctype html><html><head>" + meta + "</head><body>"
        "<math><annotation-xml><svg><foreignObject>"
        f'<script type="application/ld+json">{json_ld}</script>'
        "</foreignObject></svg></annotation-xml></math>"
        "</body></html>"
    )
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)
    assert errors == []


def test_identical_protected_schema_term_redefinition_is_allowed() -> None:
    protected_name = {
        "@id": "https://schema.org/name",
        "@protected": True,
    }
    page = _landing({
        "@context": [
            {"@vocab": "https://schema.org/", "name": protected_name},
            {"name": protected_name},
        ],
        "@graph": [_valid_article()],
    })
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)
    assert errors == []


def test_schema_term_mapping_can_resolve_through_term_alias() -> None:
    page = _landing({
        "@context": {
            "@vocab": "https://schema.org/",
            "schemaName": "https://schema.org/name",
            "name": "schemaName",
        },
        "@graph": [_valid_article()],
    })
    errors: list[str] = []
    deployment.check_scholarly_landing(page, errors)
    assert errors == []
'''
          for test_name in (
              'test_explicit_schema_term_mapping_with_surrounding_whitespace_fails_closed',
              'test_unencoded_annotation_xml_svg_foreignobject_exposes_html_jsonld',
              'test_identical_protected_schema_term_redefinition_is_allowed',
              'test_schema_term_mapping_can_resolve_through_term_alias',
          ):
              if test_name in tests:
                  raise SystemExit(f'test already present: {test_name}')
          tests = tests.rstrip() + extra_tests + '\n'

          source_path.write_text(source, encoding='utf-8')
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python -m pytest -q tests/test_scholarly_parser_edge_cases.py
          python -m py_compile scripts/check_deployment_freshness.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py "

      - name: Self-clean, commit and push exact two-file fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .tmp-pr1071-self-fix-trigger .github/workflows/tmp-pr1071-self-fix-runner.yml
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git commit -m "fix: close latest scholarly parser review gaps"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
