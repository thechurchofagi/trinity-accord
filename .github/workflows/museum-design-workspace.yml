name: Museum design workspace
on:
  push:
    branches: [codex/museum-six-rooms-guardian-v1-1]
    paths: ['.github/workflows/museum-design-workspace.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: museum-six-room-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          sparse-checkout: |
            museum
            nft-text-descriptions
            bitcoin-inscription-mirrors/raw
            .github/workflows
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recover already synthesized narration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: museum-six-room-build
          run-id: 34171789864
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/recovered
      - name: Install pinned build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libegl1 libxi6 libxrender1 fonts-noto-cjk
          python -m pip install bpy==4.5.3 edge-tts==7.2.8 Pillow==11.3.0 playwright==1.55.0
          python -m playwright install chromium
          cd museum && npm ci
      - name: Integrate spatial runtime and verify recovered recordings
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin e99669424e743eea42fb78cfa120c177199c209d
          python museum/scripts/prepare_spatial_layout.py
          python museum/scripts/recover_anniversary.py
          python museum/scripts/integrate_spatial_runtime.py
          tar -xzf "$RUNNER_TEMP/recovered/museum-six-room-build.tar.gz" museum/dist/assets/guides-v2 museum/dist/data/guide-audio.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('museum/dist/data/space-design.json');d=json.loads(p.read_text());d['edition']='museum-v1.32.0';p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          p=pathlib.Path('museum/dist/index.html');p.write_text(p.read_text().replace('V1.29.0','V1.32.0').replace('Corridor view','Room view'))
          p=pathlib.Path('museum/dist/museum.js');p.write_text(p.read_text().replace('长廊视角','展厅全景').replace('Corridor view','Room view').replace('长廊由 Blender','展厅由 Blender').replace('The corridor was modelled','The rooms were modelled'))
          PY
          node --check museum/dist/museum.js
          node museum/scripts/check_spatial_layout.mjs
          node museum/scripts/check_guided_visit.mjs
          node museum/scripts/check_recorded_guides.mjs
      - name: Bake and export corrected six-room model
        run: |
          set -euo pipefail
          python museum/scene/build_spatial_gallery.py 2>&1 | tee "$RUNNER_TEMP/blender.log"
      - name: Bind complete edition and run regressions
        run: |
          set -euo pipefail
          python museum/scripts/finalize_spatial_edition.py
          git restore .github/workflows/museum-edition.yml
          node museum/scripts/build_runtime.mjs
          python museum/scripts/build_archive.py
          python museum/scripts/validate.py
          node --check museum/dist/museum.js
          for check in navigation spatial_layout guided_visit recorded_guides music_playback language_preference wall_frames exterior earth_sequence captions word_captions progressive_loading; do
            echo "REGRESSION $check"
            node "museum/scripts/check_${check}.mjs"
          done
      - name: Render desktop and mobile; exercise bilingual guide
        env:
          MUSEUM_QA_OUTPUT: ${{ runner.temp }}/museum-browser-qa
        run: python museum/scripts/check_browser.py
      - name: Commit validated build only to isolated design branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/museum-six-rooms-guardian-v1-1
          git add museum
          if git diff --cached --name-only | grep -qv '^museum/'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='museum-edition-builder' -c user.email='actions@github.com' commit -m 'feat(museum): build six rooms, guardian display and timed bilingual tour'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/codex/museum-six-rooms-guardian-v1-1
          unset AUTH
      - name: Save inspectable outputs even after a failed step
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/museum-build-head.txt"
          tar --exclude='node_modules' --exclude='__pycache__' -czf "$RUNNER_TEMP/museum-six-room-build.tar.gz" museum
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: museum-six-room-build
          path: |
            ${{ runner.temp }}/museum-six-room-build.tar.gz
            ${{ runner.temp }}/museum-build-head.txt
            ${{ runner.temp }}/blender.log
            ${{ runner.temp }}/museum-browser-qa
          retention-days: 7
          if-no-files-found: error
