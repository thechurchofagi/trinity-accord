name: Publish UCT Paper B TA21
on:
  push:
    branches: [research/uct-paper-b-v1-20260928]
    paths:
      - '.github/workflows/publish-uct-paper-a.yml'
      - 'research/unified-consciousness-theory-ii/PUBLISH-AUTHORIZATION.json'
permissions:
  contents: write
concurrency:
  group: uct-paper-b-zenodo-v1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta21-publish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/uct-paper-b-v1-20260928
          fetch-depth: 1
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex fonts-dejavu-core poppler-utils
      - name: Record toolchain provenance
        run: python3 scripts/toolchain_provenance.py
      - name: Verify exact reviewed package
        run: python3 research/unified-consciousness-theory-ii/publication.py verify
      - name: Publish only the reserved TA21 record and verify anonymous exact-byte readback
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/unified-consciousness-theory-ii/publication.py publish
      - name: Preserve publication state
        if: always()
        run: python3 research/unified-consciousness-theory-ii/publication.py persist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ta21-uct-paper-b-publication
          path: |
            research/unified-consciousness-theory-ii/published/
            research/unified-consciousness-theory-ii/EXPECTED-PUBLICATION.json
            research/unified-consciousness-theory-ii/format-checks.json
            research/unified-consciousness-theory-ii/publication-record.json
            research/unified-consciousness-theory-ii/publication-attempt.json
          retention-days: 90
          if-no-files-found: warn
