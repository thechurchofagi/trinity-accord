name: Publish Current Repository DOI Capsule

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-current-repository-doi-v1.yml
      - preservation/current-repository-doi-publication-authorization-v1.json

permissions:
  contents: write

concurrency:
  group: main-write-lock
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == 'thechurchofagi'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
      ZENODO_API_BASE: https://zenodo.org/api
      RIGHTS_ACK: TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED
    steps:
      - name: Checkout exact main baseline with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install verification dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Verify owner authorization and current recovery baseline
        id: preflight
        run: |
          set -euo pipefail
          test -n "$ZENODO_ACCESS_TOKEN"
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          git merge-base --is-ancestor 4b9292afcefbe4b90bbc0600629d00dc13d164d7 "$source_sha"
          python3 scripts/audit_recovery_readiness.py
          python3 scripts/build_final_evidence_inventory.py --check
          python3 - <<'PY'
          import json
          auth=json.load(open('preservation/current-repository-doi-publication-authorization-v1.json'))
          required={
            'schema':'trinityaccord.current-repository-doi-publication-authorization.v1',
            'sequence':1,
            'status':'pending',
            'authorized_by':'thechurchofagi',
            'core_concept_doi':'10.5281/zenodo.21739343',
            'previous_repository_version_doi':'10.5281/zenodo.21930809',
            'required_ancestor_commit_sha':'4b9292afcefbe4b90bbc0600629d00dc13d164d7',
            'publish_new_repository_doi_version':True,
            'publish_new_repository_arweave_capsule':False,
            'arweave_publication_status':'deferred_by_owner_cost_boundary',
            'public_doi_cold_restore_required':True,
            'public_arweave_readback_required':False,
            'zenodo_rights_acknowledgement':'TRINITY_PRESERVATION_CAPSULE_RIGHTS_V1_APPROVED',
            'non_amending_boundary':True,
            'three_bitcoin_originals_remain_canonical':True,
            'live_main_equivalence_claimed':False,
          }
          for k,v in required.items():
              if auth.get(k)!=v: raise SystemExit(f'authorization mismatch: {k}: {auth.get(k)!r}')
          catalog=json.load(open('preservation/recovery-catalog.json'))
          core=catalog['core_repository']
          if core.get('current_verified_version_doi')!='10.5281/zenodo.21930809':
              raise SystemExit('recovery catalog previous DOI mismatch')
          state=json.load(open('preservation/zenodo-state.json'))
          if state.get('latest_doi')!='10.5281/zenodo.21930809':
              raise SystemExit('Zenodo state previous DOI mismatch')
          if state.get('concept_doi')!='10.5281/zenodo.21739343':
              raise SystemExit('Concept DOI mismatch')
          print('DOI-only repository refresh authorization PASS; Arweave disabled.')
          PY

      - name: Build exact full-repository preservation capsule
        id: capsule
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/repository-capsule"
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "$SOURCE_SHA" \
            --output-dir "$out"
          CAPSULE_DIR="$out" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from preservation_capsule import verify_local_package
          p=verify_local_package(Path(os.environ['CAPSULE_DIR']))
          print(f"capsule_id={p['capsule_id']}")
          print(f"package_sha={p['package_identity_sha256']}")
          print(f"git_tree_oid={p['git_tree_oid']}")
          PY

      - name: Prove local GitHub-zero cold recovery
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/repository-capsule/restore-trinity-accord.py" \
            --deposit-dir "$RUNNER_TEMP/repository-capsule" \
            --output-dir "$RUNNER_TEMP/local-restore"
          REPORT="$RUNNER_TEMP/local-restore/recovery-report.json" python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['REPORT']))
          if r.get('result')!='pass': raise SystemExit('local cold restore failed')
          if r.get('source_git_commit_sha')!=os.environ['SOURCE_SHA']:
              raise SystemExit('local cold restore source mismatch')
          PY

      - name: Publish new Zenodo repository version
        id: zenodo
        run: |
          set -euo pipefail
          cp preservation/zenodo-state.json "$RUNNER_TEMP/zenodo-work-state.json"
          python3 scripts/publish_preservation_capsule_to_zenodo_v3.py \
            --capsule-dir "$RUNNER_TEMP/repository-capsule" \
            --state "$RUNNER_TEMP/zenodo-work-state.json" \
            --api-base "$ZENODO_API_BASE" \
            --rights-boundary-ack "$RIGHTS_ACK"
          STATE="$RUNNER_TEMP/zenodo-work-state.json" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          s=json.load(open(os.environ['STATE']))
          if s.get('concept_doi')!='10.5281/zenodo.21739343': raise SystemExit('Concept DOI mismatch')
          if s.get('latest_doi')=='10.5281/zenodo.21930809': raise SystemExit('Zenodo series did not advance')
          print(f"doi={s['latest_doi']}")
          print(f"record_id={s['latest_record_id']}")
          print(f"package_sha={s['latest_package_identity_sha256']}")
          PY

      - name: Prove public DOI-only cold recovery
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
          RECORD_ID: ${{ steps.zenodo.outputs.record_id }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/repository-capsule/restore-trinity-accord.py" \
            --zenodo-record-id "$RECORD_ID" \
            --output-dir "$RUNNER_TEMP/doi-restore"
          REPORT="$RUNNER_TEMP/doi-restore/recovery-report.json" python3 - <<'PY'
          import json,os
          r=json.load(open(os.environ['REPORT']))
          if r.get('result')!='pass': raise SystemExit('public DOI cold restore failed')
          if r.get('source_git_commit_sha')!=os.environ['SOURCE_SHA']:
              raise SystemExit('public DOI source mismatch')
          PY

      - name: Seal verified DOI state without Arweave write
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
          CAPSULE_ID: ${{ steps.capsule.outputs.capsule_id }}
          PACKAGE_SHA: ${{ steps.capsule.outputs.package_sha }}
          GIT_TREE_OID: ${{ steps.capsule.outputs.git_tree_oid }}
          DOI: ${{ steps.zenodo.outputs.doi }}
          RECORD_ID: ${{ steps.zenodo.outputs.record_id }}
        run: |
          set -euo pipefail
          WORK_STATE="$RUNNER_TEMP/zenodo-work-state.json" python3 - <<'PY'
          import json,os
          from pathlib import Path

          def load(path): return json.loads(Path(path).read_text())
          def write(path,obj): Path(path).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')

          auth_path='preservation/current-repository-doi-publication-authorization-v1.json'
          auth=load(auth_path)
          auth.update({
            'status':'published_and_publicly_restored',
            'published_source_baseline_commit_sha':os.environ['SOURCE_SHA'],
            'published_repository_doi':os.environ['DOI'],
            'published_repository_record_id':int(os.environ['RECORD_ID']),
            'published_package_identity_sha256':os.environ['PACKAGE_SHA'],
            'arweave_publication_status':'deferred_by_owner_cost_boundary'
          })
          write(auth_path,auth)

          observation={
            'schema':'trinityaccord.current-repository-doi-publication-observation.v1',
            'status':'passed',
            'source_git_commit_sha':os.environ['SOURCE_SHA'],
            'git_tree_oid':os.environ['GIT_TREE_OID'],
            'capsule_id':os.environ['CAPSULE_ID'],
            'package_identity_sha256':os.environ['PACKAGE_SHA'],
            'repository_doi':os.environ['DOI'],
            'zenodo_record_id':int(os.environ['RECORD_ID']),
            'local_github_zero_cold_restore':'passed',
            'public_doi_only_cold_restore':'passed',
            'arweave_publication_status':'deferred_by_owner_cost_boundary',
            'new_arweave_transaction_created':False,
            'non_amending_boundary':True,
            'three_bitcoin_originals_remain_canonical':True,
            'live_main_equivalence_claimed':False
          }
          write('preservation/current-repository-doi-publication-observation-v1.json',observation)

          work=load(os.environ['WORK_STATE'])
          write('preservation/zenodo-state.json',work)

          v2_path='preservation/repository-preservation-state-v2.json'
          v2=load(v2_path)
          for key in ['latest_capsule_id','latest_git_commit_sha','latest_git_tree_oid','latest_record_id','latest_doi','latest_doi_url','concept_record_id','concept_doi','latest_package_identity_sha256']:
              v2[key]=work.get(key)
          v2['publication_status']='published_and_publicly_restored'
          versions=[x for x in v2.get('versions',[]) if isinstance(x,dict) and x.get('doi')!=work['latest_doi']]
          latest=next(x for x in work.get('versions',[]) if isinstance(x,dict) and x.get('doi')==work['latest_doi'])
          versions.append(latest)
          v2['versions']=versions
          write(v2_path,v2)

          catalog_path='preservation/recovery-catalog.json'
          catalog=load(catalog_path)
          core=catalog['core_repository']
          core['previous_verified_version_doi']='10.5281/zenodo.21930809'
          core['current_verified_version_doi']=os.environ['DOI']
          core['current_verified_source_git_commit_sha']=os.environ['SOURCE_SHA']
          core['current_verified_package_identity_sha256']=os.environ['PACKAGE_SHA']
          core['current_verified_record_id']=int(os.environ['RECORD_ID'])
          core['current_repository_arweave_publication_status']='deferred_by_owner_cost_boundary'
          write(catalog_path,catalog)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            preservation/current-repository-doi-publication-authorization-v1.json \
            preservation/current-repository-doi-publication-observation-v1.json \
            preservation/zenodo-state.json \
            preservation/repository-preservation-state-v2.json \
            preservation/recovery-catalog.json
          git diff --cached --check
          git commit -m 'preservation: record current repository DOI capsule'
          for attempt in 1 2 3 4 5; do
            git fetch origin main --prune
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo '::error::DOI publication succeeded but verified state could not be pushed.'
          exit 1

      - name: Upload cold-recovery proof reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-repository-doi-publication-proof
          path: |
            ${{ runner.temp }}/local-restore/recovery-report.json
            ${{ runner.temp }}/doi-restore/recovery-report.json
            ${{ runner.temp }}/toolchain-provenance.json
          retention-days: 365
          if-no-files-found: warn
