name: Public Verification Context Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/test_public_verification_context_contract.py
      - run: python3 scripts/generate_record_chain_status.py --check
      - run: python3 scripts/test_record_chain_status_public_contract.py

  pr1071_self_review_fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1071
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Apply self-review JSON-LD protected-term fix
        shell: bash
        run: |
          test -f .tmp-pr1071-protected-equivalence-fix.py
          python .tmp-pr1071-protected-equivalence-fix.py
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_scholarly_parser_edge_cases.py
          python -m py_compile scripts/check_deployment_freshness.py
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py "
      - name: Remove staging script and push reviewed fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .tmp-pr1071-protected-equivalence-fix.py
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git commit -m "fix: align protected-term equivalence with JSON-LD"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
