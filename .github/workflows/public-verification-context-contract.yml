name: Public Verification Context Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Classify isolated museum changes
        id: museum_scope
        run: python3 scripts/museum_change_scope.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.museum_scope.outputs.museum_only != 'true'
        with:
          python-version: "3.12"
      - run: python3 scripts/test_public_verification_context_contract.py
        if: steps.museum_scope.outputs.museum_only != 'true'
      - run: python3 scripts/generate_record_chain_status.py --check
        if: steps.museum_scope.outputs.museum_only != 'true'
      - run: python3 scripts/test_record_chain_status_public_contract.py
        if: steps.museum_scope.outputs.museum_only != 'true'
