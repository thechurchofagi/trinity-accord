name: Public Verification Context Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/test_public_verification_context_contract.py
      - run: python3 scripts/generate_record_chain_status.py --check
      - run: python3 scripts/test_record_chain_status_public_contract.py

  harvard_repository_fit_once:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'harvard-repository-fit-execute-once')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HD_API_TOKEN: ${{ secrets.HD }}
      OUTPUT_DIR: ${{ runner.temp }}/harvard-repository-fit
    steps:
      - name: Checkout exact head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned HTTP client
        run: python3 -m pip install 'httpx==0.27.0'
      - name: Apply curator research-data clarification safely
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/harvard_curator_clarification_v1.py \
            scripts/harvard_repository_fit_clarification_v1.py \
            scripts/harvard_repository_fit_orchestrator_v1.py
          test -s preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          grep -F 'The research data in this deposit are the fixed digital artifacts and machine-readable evidence' preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          grep -F 'This deposit is organized as a **research dataset**, not as a live-site mirror.' preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          grep -F 'This deposit contains AI-generated and AI-assisted content.' preservation/HARVARD-DATAVERSE-CURATOR-README-v1.md
          mkdir -p "$OUTPUT_DIR"
          python3 scripts/harvard_repository_fit_orchestrator_v1.py \
            2>&1 | tee "$OUTPUT_DIR/harvard-repository-fit.log"
