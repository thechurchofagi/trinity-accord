name: Run Current Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  current-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
      - run: python3 -m pip install -r requirements-ci.txt
      - name: Verify sitemap has no committed drift
        run: python3 scripts/generate_sitemap.py --check
      - name: Verify Ethereum evidence annex
        shell: bash
        run: |
          python3 -m py_compile \
            evidence/ethereum-evidence-annex-v1/verification/capture_eth_anchor.py \
            evidence/ethereum-evidence-annex-v1/verification/generate_l2_l3_proofs.py \
            evidence/ethereum-evidence-annex-v1/verification/verify_annex.py
          node --check evidence/ethereum-evidence-annex-v1/verification/make_beacon_execution_proof.mjs
          # This verifier is intentionally offline: checked-in proof bytes must
          # independently reconstruct L1/L2/L3 without contacting Ethereum RPCs.
          python3 evidence/ethereum-evidence-annex-v1/verification/verify_annex.py
      - name: Verify Bitcoin inscription cryptographic proof annex
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            evidence/bitcoin-inscription-proof-annex-v1/verification/bitcoin_proof_primitives_v1.py \
            evidence/bitcoin-inscription-proof-annex-v1/verification/capture_proofs.py \
            evidence/bitcoin-inscription-proof-annex-v1/verification/verify_annex.py \
            scripts/build_bitcoin_inscription_mirror_index.py \
            scripts/build_bitcoin_inscription_mirrors.py \
            scripts/verify_bitcoin_inscription_mirrors.py
          node --check scripts/bitcoin-inscription-offline-adapter.mjs
          node --check scripts/verify-bitcoin-tx-anchor.mjs
          node --check scripts/verify-full-evidence-chain.mjs
          node --check scripts/verify-dag-and-signed-cids.mjs
          python3 -m pytest -q \
            tests/test_bitcoin_inscription_proof_annex.py \
            tests/test_bitcoin_inscription_proof_annex_fail_closed.py
          # These checks consume only checked-in transaction, witness, Merkle,
          # coinbase and header bytes. No Bitcoin/Ordinals API is contacted.
          python3 evidence/bitcoin-inscription-proof-annex-v1/verification/verify_annex.py > /tmp/bitcoin-proof-offline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path('/tmp/bitcoin-proof-offline.json').read_text(encoding='utf-8'))
          checked = json.loads(Path('evidence/bitcoin-inscription-proof-annex-v1/reports/OFFLINE-VERIFICATION.json').read_text(encoding='utf-8'))
          assert generated == checked, 'checked-in Bitcoin inscription offline report is stale'
          assert generated['result'] == 'PASS', generated.get('failures')
          assert generated['L1_INSCRIPTION_CONTENT_AND_TAPROOT_BINDING']['inscriptions'] == 8
          assert all(item['tapscript_signature_status'] == 'PASS' for item in generated['l1_checks'])
          assert generated['L2_BLOCK_AND_WITNESS_INCLUSION']['txid_merkle_proofs'] == 8
          assert generated['L2_BLOCK_AND_WITNESS_INCLUSION']['bip141_witness_commitment_proofs'] == 8
          assert generated['L3_CHECKPOINT_RELATIVE_POW_ANCESTRY']['anchors'] == 8
          assert generated['L3_CHECKPOINT_RELATIVE_POW_ANCESTRY']['valid_pow_headers'] == 1160
          print('BITCOIN_INSCRIPTION_OFFLINE_VERIFICATION=PASS')
          print('BITCOIN_INSCRIPTIONS=8')
          print('BITCOIN_BIP340_TAPSCRIPT_SIGNATURES=8')
          print('BITCOIN_BIP141_WITNESS_COMMITMENTS=8')
          print('BITCOIN_VALID_POW_HEADERS=1160')
          PY
      - name: Verify NFT cryptographic proof annex
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/build_nft_cryptographic_commitment.py \
            evidence/ethereum-proof-primitives-v1/ethereum_proof_primitives_v1.py \
            evidence/nft-proof-annex-v1/verification/capture_compact_proofs.py \
            evidence/nft-proof-annex-v1/verification/verify_nft_proof_annex.py
          python3 -m pytest -q \
            tests/test_nft_proof_annex.py \
            tests/test_nft_proof_annex_fail_closed.py
          python3 scripts/build_nft_cryptographic_commitment.py --check
          # No RPC is used here. The checked-in compact witnesses must prove the
          # collection commitment, Ethereum execution inclusion, mint semantics,
          # cross-field identity bindings, and checkpoint-relative Beacon ancestry
          # entirely from repository bytes.
          python3 evidence/nft-proof-annex-v1/verification/verify_nft_proof_annex.py > /tmp/nft-proof-offline.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path('/tmp/nft-proof-offline.json').read_text(encoding='utf-8'))
          checked = json.loads(Path('evidence/nft-proof-annex-v1/reports/OFFLINE-VERIFICATION.json').read_text(encoding='utf-8'))
          assert generated == checked, 'checked-in NFT offline verification report is stale'
          assert generated['result'] == 'PASS', generated.get('failures')
          assert generated['L1_COLLECTION_COMMITMENT']['asset_count'] == 175
          assert generated['L2_EXECUTION_INCLUSION']['mint_transactions'] == 175
          assert generated['L3_CONSENSUS_FINALITY']['unique_execution_blocks'] == 175
          print('NFT_OFFLINE_VERIFICATION=PASS')
          print('NFT_MERKLE_ROOT=' + generated['L1_COLLECTION_COMMITMENT']['root_sha256'])
          print('NFT_L2_MINT_TRANSACTIONS=' + str(generated['L2_EXECUTION_INCLUSION']['mint_transactions']))
          print('NFT_L3_EXECUTION_BLOCKS=' + str(generated['L3_CONSENSUS_FINALITY']['unique_execution_blocks']))
          PY
      - name: Verify unified evidence and DOI checkpoint contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/build_final_evidence_inventory.py \
            scripts/current_baseline_publication_v3.py \
            scripts/current_baseline_publication_v4.py
          bash -n \
            scripts/run_current_baseline_publication_v3_ci.sh \
            scripts/run_current_baseline_publication_v4_ci.sh \
            scripts/run_repository_preservation_refresh_ci.sh
          python3 scripts/build_final_evidence_inventory.py --check
          python3 scripts/current_baseline_publication_v3.py validate
          python3 scripts/current_baseline_publication_v4.py validate
          python3 -m pytest -q \
            tests/test_current_baseline_publication_v3_contract.py \
            tests/test_current_baseline_publication_v4_contract.py \
            tests/test_evidence_manifest_current_proof_state.py
      - name: Run full current system tests
        id: current_system_tests
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/run_current_system_tests.py > /tmp/current-system-tests.log 2>&1
      - name: Upload current-system failure log
        if: steps.current_system_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-system-test-log
          path: /tmp/current-system-tests.log
          if-no-files-found: error
      - name: Surface current-system failure
        if: steps.current_system_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::Current system test failure tail"
          tail -n 80 /tmp/current-system-tests.log
          echo "::endgroup::"
          exit 1
      - name: Show current-system success tail
        if: steps.current_system_tests.outcome == 'success'
        run: tail -n 40 /tmp/current-system-tests.log

  seventh-scholarly-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 1071 && github.head_ref == 'agent/close-final-scholarly-parser-gaps-2026-08-21'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Record toolchain provenance
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"
      - name: Apply seventh-round fixes
        run: |
          set -euo pipefail
          python3 .github/tmp-seventh-apply.py
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import inspect
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'tests'))
          import test_scholarly_parser_edge_cases as suite
          tests = sorted((name, fn) for name, fn in vars(suite).items() if name.startswith('test_') and inspect.isfunction(fn))
          if len(tests) != 37:
              raise SystemExit(f'expected 37 focused tests, found {len(tests)}')
          for name, fn in tests:
              fn()
              print(f'PASS {name}')
          print(f'focused scholarly regressions: {len(tests)}/{len(tests)} PASS')
          PY
          python3 -m py_compile scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git diff --check
      - name: Commit fixes and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/run-current-tests.yml
          git rm -- .github/tmp-seventh-apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py .github/workflows/run-current-tests.yml
          git diff --cached --check
          git commit -m "fix: close seventh scholarly review findings"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
