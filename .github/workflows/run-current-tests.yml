name: Run Current Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  restore-llms-full:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/final-current-legacy-boundary'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore exact source and apply one bounded replacement
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:llms-full.txt > /tmp/llms-full.main.txt
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/llms-full.main.txt').read_text(encoding='utf-8')
          old = '''- https://www.trinityaccord.org/api/verification-levels.json
          - https://www.trinityaccord.org/api/mission-governance.v1.json
          - https://www.trinityaccord.org/api/echo-value-criteria.json
          - https://www.trinityaccord.org/api/echo-archive-policy.json
          - https://www.trinityaccord.org/api/echo-record-schema.v3.1.json
          - https://www.trinityaccord.org/api/record-chain-submission-schema.v1.json'''.replace('          - ', '- ')
          new = '''- https://www.trinityaccord.org/api/verification-profiles.v1.json
          - https://www.trinityaccord.org/api/verification-claim-model.v1.json
          - https://www.trinityaccord.org/api/mission-governance.v1.json
          - https://www.trinityaccord.org/api/echo-value-criteria.json
          - https://www.trinityaccord.org/api/echo-archive-policy.json
          - https://www.trinityaccord.org/api/record-chain-submission-schema.v1.json
          - https://www.trinityaccord.org/api/record-chain-field-helper.v1.json'''.replace('          - ', '- ')
          if source.count(old) != 1:
              raise SystemExit(f'unexpected source endpoint block count: {source.count(old)}')
          corrected = source.replace(old, new, 1)
          if corrected.replace(new, old, 1) != source:
              raise SystemExit('bounded replacement is not reversible')
          forbidden = ('trrinityaccord', '\x06', 'indepently hash', 'interpretative authority')
          for marker in forbidden:
              if marker in corrected:
                  raise SystemExit(f'corruption marker remains: {marker!r}')
          Path('llms-full.txt').write_text(corrected, encoding='utf-8')
          PY
          git show origin/main:.github/workflows/run-current-tests.yml > .github/workflows/run-current-tests.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add llms-full.txt .github/workflows/run-current-tests.yml
          git commit -m 'fix: restore llms context and update core endpoints'
          git push origin HEAD:${{ github.head_ref }}

  current-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
      - run: python3 -m pip install -r requirements-ci.txt
      - name: Verify sitemap has no committed drift
        run: python3 scripts/generate_sitemap.py --check
      - name: Run full current system tests
        id: current_system_tests
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/run_current_system_tests.py > /tmp/current-system-tests.log 2>&1
      - name: Upload current-system failure log
        if: steps.current_system_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-system-test-log
          path: /tmp/current-system-tests.log
          if-no-files-found: error
      - name: Surface current-system failure
        if: steps.current_system_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::Current system test failure tail"
          tail -n 80 /tmp/current-system-tests.log
          echo "::endgroup::"
          exit 1
      - name: Show current-system success tail
        if: steps.current_system_tests.outcome == 'success'
        run: tail -n 40 /tmp/current-system-tests.log
