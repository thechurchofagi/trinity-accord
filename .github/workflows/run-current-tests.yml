name: Run Current Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  current-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".node-version"
      - run: python3 -m pip install -r requirements-ci.txt
      - name: Verify sitemap has no committed drift
        run: python3 scripts/generate_sitemap.py --check
      - name: Run full current system tests
        id: current_system_tests
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/run_current_system_tests.py > /tmp/current-system-tests.log 2>&1
      - name: Upload current-system failure log
        if: steps.current_system_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: current-system-test-log
          path: /tmp/current-system-tests.log
          if-no-files-found: error
      - name: Surface current-system failure
        if: steps.current_system_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::Current system test failure tail"
          tail -n 80 /tmp/current-system-tests.log
          echo "::endgroup::"
          exit 1
      - name: Show current-system success tail
        if: steps.current_system_tests.outcome == 'success'
        run: tail -n 40 /tmp/current-system-tests.log

  verify-zenodo-once:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 826 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
    steps:
      - name: Verify Zenodo credential read-only
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          result=""
          detail=""
          if [ -z "${ZENODO_ACCESS_TOKEN:-}" ]; then
            result="ZENODO_SECRET_NOT_CONFIGURED"
          else
            response_file="$(mktemp)"
            if http_code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${ZENODO_ACCESS_TOKEN}" \
              --header 'Accept: application/json' \
              'https://zenodo.org/api/deposit/depositions?page=1&size=1')"; then
              case "$http_code" in
                200)
                  if count="$(python3 - "$response_file" <<'PY'
import json
import sys
from pathlib import Path
value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
if not isinstance(value, list):
    raise SystemExit(2)
print(len(value))
PY
                  )"; then
                    result="ZENODO_CREDENTIAL_OK"
                    detail="depositions_visible=${count}"
                  else
                    result="ZENODO_RESPONSE_INVALID"
                  fi
                  ;;
                401) result="ZENODO_AUTHENTICATION_FAILED" ;;
                403) result="ZENODO_PERMISSION_DENIED" ;;
                *)
                  result="ZENODO_UNEXPECTED_HTTP_STATUS"
                  detail="http_status=${http_code}"
                  ;;
              esac
            else
              result="ZENODO_NETWORK_ERROR"
            fi
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "$result"

      - name: Report result to verification PR
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.verify.outputs.result }}
          DETAIL: ${{ steps.verify.outputs.detail }}
        shell: bash
        run: |
          set -euo pipefail
          body="Zenodo credential verification: \`${RESULT}\`"
          if [ -n "${DETAIL:-}" ]; then
            body="${body} (${DETAIL})"
          fi
          jq -n --arg body "$body" '{body: $body}' > /tmp/comment.json
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/comment.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/826/comments" \
            > /dev/null

      - name: Enforce successful credential validation
        env:
          RESULT: ${{ steps.verify.outputs.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RESULT" = "ZENODO_CREDENTIAL_OK"
