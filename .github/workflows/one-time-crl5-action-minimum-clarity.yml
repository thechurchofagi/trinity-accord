name: One-time CRL5 Action Minimum Clarity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/context-readiness-contract-convergence'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply bounded JSON update
        run: python3 scripts/one_time_crl5_action_minimum_clarity.py
      - name: Validate JSON and focused contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool api/context-readiness-levels.json >/dev/null
          python3 -m json.tool api/crl-to-context-depth-mapping.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          readiness = json.loads((root / 'api/context-readiness-levels.json').read_text())
          crl5 = next(x for x in readiness['levels'] if x['id'] == 'CRL-5')
          assert crl5['min_context_depth'] == 'CC-1'
          assert crl5['context_minimum_is_action_dependent'] is True
          assert crl5['minimum_context_by_action']['verification'] == 'CC-3'
          assert crl5['minimum_context_by_action']['guardian_retirement'] == 'CC-1'
          mapping = json.loads((root / 'api/crl-to-context-depth-mapping.json').read_text())
          boundary = mapping['legacy_verification_level_action_minimums_boundary']
          assert boundary['not_current_public_submission_rule'] is True
          assert boundary['current_public_verification_minimum'] == 'CC-3'
          PY
          git diff --check
      - name: Remove one-time tooling and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-crl5-action-minimum-clarity.yml
          git rm scripts/one_time_crl5_action_minimum_clarity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make CRL-5 minimum action-dependent'
          git push origin HEAD:${{ github.head_ref }}
