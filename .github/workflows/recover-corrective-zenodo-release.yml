name: Recover Corrective Zenodo Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/recover-corrective-zenodo-release.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: recover-corrective-zenodo-release-controller
  cancel-in-progress: true

jobs:
  recover:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      TARGET_WORKFLOW: publish-corrective-zenodo-preprint-release.yml
      RELEASE_TAG: ta-tr-2026-01-v1.1-zenodo
      AUDIT_ISSUE: "786"

    steps:
      - name: Announce recovery controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          post_comment() {
            local body="$1"
            jq -n --arg body "$body" '{body: $body}' > issue-comment.json
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$AUDIT_ISSUE/comments" \
              --input issue-comment.json \
              >/dev/null
          }

          controller_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf -v comment_body '%s\n\n- Controller run: %s\n- Controller attempt: `%s`\n- Source commit: `%s`\n- Target workflow: `%s`\n- Target Release tag: `%s`' \
            '### Recovery controller started' \
            "$controller_url" \
            "$GITHUB_RUN_ATTEMPT" \
            "$GITHUB_SHA" \
            "$TARGET_WORKFLOW" \
            "$RELEASE_TAG"
          post_comment "$comment_body"

      - name: Cancel superseded target runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          post_comment() {
            local body="$1"
            jq -n --arg body "$body" '{body: $body}' > issue-comment.json
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$AUDIT_ISSUE/comments" \
              --input issue-comment.json \
              >/dev/null
          }

          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?per_page=100"

          cancel_or_verify_completed() {
            local run_id="$1"
            local action="$2"
            local output status

            if output="$(
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/$action" \
                2>&1
            )"; then
              return 0
            fi

            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              > cancel-state.json
            status="$(jq -r '.status' cancel-state.json)"
            if [ "$status" = "completed" ]; then
              echo "Run $run_id completed before $action was applied."
              return 0
            fi

            echo "$output" >&2
            echo "Run $run_id remains $status after failed $action request." >&2
            return 1
          }

          gh api "$endpoint" > target-runs.json
          jq -r '
            .workflow_runs[]
            | select(.status == "queued" or .status == "in_progress")
            | [.id, .status, .html_url]
            | @tsv
          ' target-runs.json > active-runs.tsv

          if [ -s active-runs.tsv ]; then
            active_markdown="$(
              awk -F '\t' '{printf "- `%s` — %s — %s\\n", $1, $2, $3}' \
                active-runs.tsv
            )"
            printf -v comment_body '%s\n\n%s' \
              '### Superseded target runs found' \
              "$active_markdown"
            post_comment "$comment_body"
          else
            printf -v comment_body '%s\n\n%s' \
              '### Superseded target runs' \
              'No queued or in-progress target runs were found.'
            post_comment "$comment_body"
          fi

          while IFS=$'\t' read -r run_id status run_url; do
            [ -n "$run_id" ] || continue
            echo "Cancel $run_id ($status): $run_url"
            cancel_or_verify_completed "$run_id" cancel
          done < active-runs.tsv

          for attempt in $(seq 1 20); do
            gh api "$endpoint" > target-runs.json
            jq -r '
              .workflow_runs[]
              | select(.status == "queued" or .status == "in_progress")
              | .id
            ' target-runs.json > still-active.txt
            if [ ! -s still-active.txt ]; then
              echo "All superseded target runs are stopped."
              break
            fi

            if [ "$attempt" -eq 8 ]; then
              while read -r run_id; do
                [ -n "$run_id" ] || continue
                echo "Force-cancel stale run $run_id"
                cancel_or_verify_completed "$run_id" force-cancel
              done < still-active.txt
            fi
            sleep 3
          done

          gh api "$endpoint" > target-runs.json
          remaining="$(
            jq '[.workflow_runs[] | select(
              .status == "queued" or .status == "in_progress"
            )] | length' target-runs.json
          )"
          test "$remaining" = "0"
          printf -v comment_body '%s\n\n%s' \
            '### Superseded target runs stopped' \
            "All older queued or in-progress runs of \`$TARGET_WORKFLOW\` are now stopped."
          post_comment "$comment_body"

      - name: Dispatch clean recovery run
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          post_comment() {
            local body="$1"
            jq -n --arg body "$body" '{body: $body}' > issue-comment.json
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$AUDIT_ISSUE/comments" \
              --input issue-comment.json \
              >/dev/null
          }

          endpoint="repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?per_page=100"
          gh api "$endpoint" > before-runs.json
          previous_max="$(jq '[.workflow_runs[].id] | max // 0' before-runs.json)"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -f ref=main \
            >/dev/null

          recovery_run_id=""
          for attempt in $(seq 1 30); do
            gh api "$endpoint" > after-runs.json
            recovery_run_id="$(
              jq -r --argjson previous "$previous_max" '
                [
                  .workflow_runs[]
                  | select(.id > $previous)
                  | select(.event == "workflow_dispatch")
                  | select(.head_branch == "main")
                ]
                | sort_by(.created_at)
                | last
                | .id // empty
              ' after-runs.json
            )"
            if [ -n "$recovery_run_id" ]; then
              break
            fi
            sleep 2
          done

          test -n "$recovery_run_id"
          printf 'recovery_run_id=%s\n' "$recovery_run_id" >> "$GITHUB_OUTPUT"
          recovery_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$recovery_run_id"
          printf -v comment_body '%s\n\n- Target run ID: `%s`\n- Target run: %s' \
            '### Clean target recovery dispatched' \
            "$recovery_run_id" \
            "$recovery_url"
          post_comment "$comment_body"

      - name: Wait for recovery and surface failure
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ steps.dispatch.outputs.recovery_run_id }}
        run: |
          set -euo pipefail
          test -n "$RECOVERY_RUN_ID"

          post_comment() {
            local body="$1"
            jq -n --arg body "$body" '{body: $body}' > issue-comment.json
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$AUDIT_ISSUE/comments" \
              --input issue-comment.json \
              >/dev/null
          }

          conclusion=""
          for attempt in $(seq 1 240); do
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID" \
              > recovery-run.json
            status="$(jq -r '.status' recovery-run.json)"
            conclusion="$(jq -r '.conclusion // empty' recovery-run.json)"
            echo "Target run status=$status conclusion=${conclusion:-pending}"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 5
          done

          test "$(jq -r '.status' recovery-run.json)" = "completed"
          recovery_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID"

          if [ "$conclusion" != "success" ]; then
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID/jobs?per_page=100" \
              > recovery-jobs.json
            jq -r '
              .jobs[]
              | select(.conclusion != "success")
              | "- Job: **\(.name)** — status=\(.status), conclusion=\(.conclusion)\n"
                + (
                    [.steps[] | select(.conclusion == "failure")
                      | "  - Failed step \(.number): \(.name)"]
                    | join("\n")
                  )
            ' recovery-jobs.json > failure-summary.md
            failure_summary="$(cat failure-summary.md)"
            printf -v comment_body '%s\n\n- Target run: %s\n- Conclusion: `%s`\n\n%s' \
              '### Target recovery failed' \
              "$recovery_url" \
              "$conclusion" \
              "$failure_summary"
            post_comment "$comment_body"
            exit 1
          fi

          printf -v comment_body '%s\n\n- Target run: %s\n- Conclusion: `success`' \
            '### Target recovery completed' \
            "$recovery_url"
          post_comment "$comment_body"

      - name: Verify public release tag and close audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          post_comment() {
            local body="$1"
            jq -n --arg body "$body" '{body: $body}' > issue-comment.json
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$AUDIT_ISSUE/comments" \
              --input issue-comment.json \
              >/dev/null
          }

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > release.json
          test "$(jq -r '.draft' release.json)" = "false"
          test "$(jq -r '.prerelease' release.json)" = "false"
          test "$(jq -r '.assets | length' release.json)" = "8"

          release_url="$(jq -r '.html_url' release.json)"
          asset_names="$(
            jq -r '.assets[].name | "- `" + . + "`"' release.json
          )"
          printf -v comment_body '%s\n\n- Release: %s\n- Tag: `%s`\n- Draft: `false`\n- Prerelease: `false`\n- Asset count: `8`\n\n#### Assets\n%s' \
            '### Corrective Release verified' \
            "$release_url" \
            "$RELEASE_TAG" \
            "$asset_names"
          post_comment "$comment_body"

          jq -n '{state: "closed", state_reason: "completed"}' > close-issue.json
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/issues/$AUDIT_ISSUE" \
            --input close-issue.json \
            >/dev/null

          echo "Corrective release verified: $release_url"
