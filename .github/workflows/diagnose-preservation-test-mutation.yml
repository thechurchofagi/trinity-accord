name: Diagnose Preservation Test Mutation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/render-async-deploy-id-recovery-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Locate direct source writers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== filename references ==='
          grep -R -n --exclude-dir=.git \
            'test_repository_preservation_semantics_v3_execution.py' \
            scripts tests .github || true
          echo '=== fixture source references ==='
          grep -R -n --exclude-dir=.git \
            'legacy_auth\["sequence"\] = 2' \
            scripts tests .github || true
          echo '=== migration invocations ==='
          grep -R -n --exclude-dir=.git \
            'migrate_repository_preservation_semantics_v3' \
            scripts tests .github || true
      - name: Isolate pytest mutation
        shell: bash
        run: |
          set -euo pipefail
          target=tests/test_repository_preservation_semantics_v3_execution.py
          baseline="$(sha256sum "$target" | cut -d' ' -f1)"
          echo "BASELINE_SHA=$baseline"

          PYTHONPATH=".:apps/record_chain_intake_gateway" pytest -q "$target"
          after_target="$(sha256sum "$target" | cut -d' ' -f1)"
          echo "AFTER_TARGET_TEST_SHA=$after_target"
          if [ "$after_target" != "$baseline" ]; then
            echo "MUTATED_BY=targeted_preservation_test"
            git diff -- "$target"
            exit 12
          fi

          PYTHONPATH=".:apps/record_chain_intake_gateway" pytest -q tests
          after_full="$(sha256sum "$target" | cut -d' ' -f1)"
          echo "AFTER_FULL_PYTEST_SHA=$after_full"
          if [ "$after_full" != "$baseline" ]; then
            echo "MUTATED_BY=another_top_level_test"
            git diff -- "$target"
            exit 13
          fi

          echo "PYTEST_DOES_NOT_MUTATE_TARGET"
