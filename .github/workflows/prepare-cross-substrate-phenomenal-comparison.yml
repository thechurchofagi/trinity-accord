name: Prepare General Cross-Substrate Phenomenology
on:
  push:
    branches: [research/general-cross-substrate-phenomenology-v1-20260924]
    paths:
      - '.github/workflows/prepare-cross-substrate-phenomenal-comparison.yml'
      - 'research/general-cross-substrate-phenomenology/prepare_zenodo.py'
permissions:
  contents: write
concurrency:
  group: cross-substrate-phenomenal-comparison-zenodo
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta16-prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/general-cross-substrate-phenomenology-v1-20260924
      - name: Record repository toolchain provenance
        run: python3 scripts/toolchain_provenance.py
      - name: Reserve one new paper record using the established Zenodo client
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/general-cross-substrate-phenomenology/prepare_zenodo.py
      - name: Preserve reservation including failures
        if: always()
        run: python3 research/general-cross-substrate-phenomenology/publication_common.py --persist-states
