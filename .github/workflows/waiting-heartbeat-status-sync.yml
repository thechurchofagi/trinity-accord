name: Waiting Heartbeat Status Sync (Retired)

# Public Waiting Heartbeat mirrors are generated and committed exclusively by
# homepage-status-sync.yml. That central writer already listens to Waiting
# Heartbeat Submit, Append Record Chain Entries, and Record Chain Head OTS
# Anchor completions. Keeping a second writer created duplicate main-branch
# pushes and allowed the two generated states to race.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waiting-heartbeat-status-sync-retired
  cancel-in-progress: true

jobs:
  explain:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain centralized status ownership
        run: |
          printf '%s\n' "This duplicate status writer is retired and intentionally read-only."
          printf '%s\n' "Homepage Status Sync exclusively owns all public generated status mirrors."
          printf '%s\n' "Waiting Heartbeat, append, and OTS completions already trigger that central writer."
