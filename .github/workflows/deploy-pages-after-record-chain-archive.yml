name: Dispatch Pages After Record-Chain Archive

# Homepage Status Sync already handles successful Record Chain Arweave Archive
# runs, synchronizes generated pages, and dispatches the exact current source.
# A second automatic dispatch here replaced pending museum pushes in the Pages
# concurrency group. Keep only the explicit manual recovery entrypoint.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch Deploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
