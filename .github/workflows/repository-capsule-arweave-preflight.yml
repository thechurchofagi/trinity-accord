name: Repository Capsule Arweave Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repository-capsule-arweave-preflight.yml

permissions:
  contents: read

concurrency:
  group: repository-capsule-arweave-preflight-20260802
  cancel-in-progress: false

jobs:
  build-verify-quote:
    if: github.head_ref == 'ops/repository-capsule-arweave-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_MAIN: c442b279225810c49578004a6836e60e391b0564
      ARKEY: ${{ secrets.ARKEY || vars.ARKEY }}
    steps:
      - name: Checkout exact current main with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Require exact freeze candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_MAIN}"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Record toolchain provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Build the capsule twice independently
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "${EXPECTED_MAIN}" \
            --output-dir "$RUNNER_TEMP/capsule-a"
          python3 scripts/build_preservation_capsule.py \
            --repository-root . \
            --commit "${EXPECTED_MAIN}" \
            --output-dir "$RUNNER_TEMP/capsule-b"

      - name: Verify package identities and exact file bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from preservation_capsule import verify_local_package

          a = Path("${{ runner.temp }}/capsule-a")
          b = Path("${{ runner.temp }}/capsule-b")
          va = verify_local_package(a)
          vb = verify_local_package(b)
          if va["package_identity_sha256"] != vb["package_identity_sha256"]:
              raise SystemExit("independent capsule package identities differ")
          files_a = sorted(p.name for p in a.iterdir() if p.is_file())
          files_b = sorted(p.name for p in b.iterdir() if p.is_file())
          if files_a != files_b:
              raise SystemExit("independent capsule file sets differ")
          entries = []
          for name in files_a:
              pa, pb = a / name, b / name
              ba, bb = pa.read_bytes(), pb.read_bytes()
              if ba != bb:
                  raise SystemExit(f"independent capsule bytes differ: {name}")
              entries.append({
                  "name": name,
                  "bytes": len(ba),
                  "sha256": hashlib.sha256(ba).hexdigest(),
                  "mode": oct(pa.stat().st_mode & 0o777),
              })
          summary = {
              "schema": "trinityaccord.repository-capsule-build-preflight.v1",
              "source_commit": "${{ env.EXPECTED_MAIN }}",
              "capsule_id": va["capsule_id"],
              "package_identity_sha256": va["package_identity_sha256"],
              "git_tree_oid": va["git_tree_oid"],
              "tracked_file_count": va["tracked_file_count"],
              "independent_builds_byte_identical": True,
              "files": entries,
              "total_file_bytes": sum(e["bytes"] for e in entries),
          }
          Path("${{ runner.temp }}/capsule-build-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Simulate GitHub-zero one-command cold restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/standalone-bootstrap"
          cp "$RUNNER_TEMP/capsule-a/restore-trinity-accord.py" \
            "$RUNNER_TEMP/standalone-bootstrap/restore-trinity-accord.py"
          cd "$RUNNER_TEMP/standalone-bootstrap"
          python3 restore-trinity-accord.py \
            --deposit-dir "$RUNNER_TEMP/capsule-a" \
            --output-dir "$RUNNER_TEMP/cold-restored"
          test "$(git -C "$RUNNER_TEMP/cold-restored/repository" rev-parse HEAD)" = "${EXPECTED_MAIN}"
          test "$(git -C "$RUNNER_TEMP/cold-restored/repository" rev-parse 'HEAD^{tree}')" = \
            "$(jq -r '.git_tree_oid' "$RUNNER_TEMP/capsule-build-summary.json")"
          python3 "$RUNNER_TEMP/cold-restored/repository/scripts/audit_recovery_readiness.py"

      - name: Build deterministic outer Arweave transport tar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          source = Path("${{ runner.temp }}/capsule-a")
          output = Path("${{ runner.temp }}/trinity-accord-repository-capsule.tar")
          with tarfile.open(output, "w", format=tarfile.GNU_FORMAT) as tf:
              for path in sorted(source.iterdir(), key=lambda p: p.name):
                  if not path.is_file():
                      continue
                  info = tf.gettarinfo(str(path), arcname=path.name)
                  info.mtime = 0
                  info.uid = 0
                  info.gid = 0
                  info.uname = ""
                  info.gname = ""
                  with path.open("rb") as handle:
                      tf.addfile(info, handle)
          raw = output.read_bytes()
          transport = {
              "schema": "trinityaccord.repository-capsule-arweave-transport.v1",
              "source_commit": "${{ env.EXPECTED_MAIN }}",
              "capsule_id": json.loads(Path("${{ runner.temp }}/capsule-build-summary.json").read_text())["capsule_id"],
              "package_identity_sha256": json.loads(Path("${{ runner.temp }}/capsule-build-summary.json").read_text())["package_identity_sha256"],
              "transport_filename": output.name,
              "transport_bytes": len(raw),
              "transport_sha256": hashlib.sha256(raw).hexdigest(),
              "format": "deterministic-uncompressed-gnu-tar",
          }
          Path("${{ runner.temp }}/transport-summary.json").write_text(
              json.dumps(transport, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(transport, indent=2, sort_keys=True))
          PY

      - name: Quote Arweave reward and verify wallet reserve without posting
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ARKEY}"
          cat > "$RUNNER_TEMP/quote-repository-capsule.mjs" <<'JS'
          import fs from "node:fs";
          import crypto from "node:crypto";
          import Arweave from "arweave";

          const parseKey = () => {
            const value = process.env.ARKEY?.trim();
            if (!value) throw new Error("ARKEY missing");
            return value.startsWith("{")
              ? JSON.parse(value)
              : JSON.parse(Buffer.from(value, "base64").toString("utf8"));
          };
          const winstonPerAr = 1_000_000_000_000n;
          const toAr = (value) => {
            const n = BigInt(String(value));
            return `${n / winstonPerAr}.${(n % winstonPerAr).toString().padStart(12, "0")}`;
          };
          const data = fs.readFileSync(process.env.TRANSPORT_PATH);
          const jwk = parseKey();
          const arweave = Arweave.init({host:"arweave.net",port:443,protocol:"https",timeout:30000,logging:false});
          const address = await arweave.wallets.jwkToAddress(jwk);
          const balance = BigInt(await arweave.wallets.getBalance(address));
          const tx = await arweave.createTransaction({data}, jwk);
          const reward = BigInt(tx.reward);
          const hardMax = 300_000_000_000n;
          const reserve = 250_000_000_000n;
          if (reward > hardMax) throw new Error(`reward exceeds 0.30 AR hard maximum: ${reward}`);
          if (balance - reward < reserve) throw new Error(`wallet reserve would fall below 0.25 AR`);
          const result = {
            schema: "trinityaccord.repository-capsule-arweave-quote.v1",
            payload_bytes: data.length,
            payload_sha256: crypto.createHash("sha256").update(data).digest("hex"),
            reward_winston: reward.toString(),
            reward_ar: toAr(reward),
            wallet_address_sha256: crypto.createHash("sha256").update(address).digest("hex"),
            balance_before_winston: balance.toString(),
            balance_before_ar: toAr(balance),
            estimated_remaining_winston: (balance - reward).toString(),
            estimated_remaining_ar: toAr(balance - reward),
            hard_max_reward_ar: "0.300000000000",
            minimum_remaining_ar: "0.250000000000",
            paid_post_performed: false,
          };
          fs.writeFileSync(process.env.QUOTE_PATH, JSON.stringify(result, null, 2) + "\n");
          console.log(JSON.stringify(result, null, 2));
          JS
          TRANSPORT_PATH="$RUNNER_TEMP/trinity-accord-repository-capsule.tar" \
          QUOTE_PATH="$RUNNER_TEMP/arweave-quote.json" \
          node "$RUNNER_TEMP/quote-repository-capsule.mjs"

      - name: Upload verified no-cost preflight artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-capsule-arweave-preflight
          path: |
            ${{ runner.temp }}/capsule-a/
            ${{ runner.temp }}/capsule-build-summary.json
            ${{ runner.temp }}/cold-restored/recovery-report.json
            ${{ runner.temp }}/toolchain-provenance.json
            ${{ runner.temp }}/trinity-accord-repository-capsule.tar
            ${{ runner.temp }}/transport-summary.json
            ${{ runner.temp }}/arweave-quote.json
          retention-days: 365
          if-no-files-found: error
