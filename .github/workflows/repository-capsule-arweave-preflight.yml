name: Repository Capsule Reproducibility Diagnosis

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repository-capsule-arweave-preflight.yml

permissions:
  contents: read

concurrency:
  group: repository-capsule-reproducibility-diagnosis-20260802
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.head_ref == 'ops/repository-capsule-arweave-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_MAIN: c442b279225810c49578004a6836e60e391b0564
    steps:
      - name: Checkout exact freeze candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Require exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_MAIN}"
          test -z "$(git status --porcelain)"

      - name: Build twice independently
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_preservation_capsule.py --repository-root . --commit "${EXPECTED_MAIN}" --output-dir "$RUNNER_TEMP/capsule-a"
          sleep 2
          python3 scripts/build_preservation_capsule.py --repository-root . --commit "${EXPECTED_MAIN}" --output-dir "$RUNNER_TEMP/capsule-b"

      - name: Produce exact per-file and JSON structural diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import hashlib
          import json
          from pathlib import Path

          a = Path("${{ runner.temp }}/capsule-a")
          b = Path("${{ runner.temp }}/capsule-b")
          report = {
              "schema": "trinityaccord.repository-capsule-reproducibility-diagnosis.v1",
              "source_commit": "${{ env.EXPECTED_MAIN }}",
              "files": [],
              "differing_files": [],
          }
          names = sorted({p.name for p in a.iterdir() if p.is_file()} | {p.name for p in b.iterdir() if p.is_file()})
          for name in names:
              pa, pb = a / name, b / name
              ba = pa.read_bytes() if pa.exists() else None
              bb = pb.read_bytes() if pb.exists() else None
              item = {
                  "name": name,
                  "present_a": ba is not None,
                  "present_b": bb is not None,
                  "bytes_a": len(ba) if ba is not None else None,
                  "bytes_b": len(bb) if bb is not None else None,
                  "sha256_a": hashlib.sha256(ba).hexdigest() if ba is not None else None,
                  "sha256_b": hashlib.sha256(bb).hexdigest() if bb is not None else None,
                  "byte_identical": ba == bb,
              }
              if ba != bb:
                  report["differing_files"].append(name)
                  if name.endswith(".json") and ba is not None and bb is not None:
                      try:
                          ja = json.loads(ba)
                          jb = json.loads(bb)
                          ta = json.dumps(ja, indent=2, sort_keys=True, ensure_ascii=False).splitlines()
                          tb = json.dumps(jb, indent=2, sort_keys=True, ensure_ascii=False).splitlines()
                          item["normalized_json_diff"] = list(difflib.unified_diff(ta, tb, fromfile=f"a/{name}", tofile=f"b/{name}", lineterm=""))[:400]
                      except Exception as exc:
                          item["json_diff_error"] = str(exc)
                  elif name.endswith((".txt", ".sha256", ".py")) and ba is not None and bb is not None:
                      try:
                          ta = ba.decode("utf-8").splitlines()
                          tb = bb.decode("utf-8").splitlines()
                          item["text_diff"] = list(difflib.unified_diff(ta, tb, fromfile=f"a/{name}", tofile=f"b/{name}", lineterm=""))[:400]
                      except Exception as exc:
                          item["text_diff_error"] = str(exc)
              report["files"].append(item)
          report["all_files_byte_identical"] = not report["differing_files"]
          Path("${{ runner.temp }}/capsule-reproducibility-diff.json").write_text(json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False))
          PY

      - name: Inspect recovery bundle semantic identity
        shell: bash
        run: |
          set -euo pipefail
          for side in a b; do
            bundle="$RUNNER_TEMP/capsule-${side}/trinity-accord-recovery.bundle"
            mkdir -p "$RUNNER_TEMP/bundle-${side}.git"
            git init --bare "$RUNNER_TEMP/bundle-${side}.git" >/dev/null
            git -C "$RUNNER_TEMP/bundle-${side}.git" fetch "$bundle" refs/heads/main:refs/heads/main >/dev/null
            git -C "$RUNNER_TEMP/bundle-${side}.git" rev-parse refs/heads/main > "$RUNNER_TEMP/bundle-${side}-commit.txt"
            git -C "$RUNNER_TEMP/bundle-${side}.git" rev-parse 'refs/heads/main^{tree}' > "$RUNNER_TEMP/bundle-${side}-tree.txt"
            git -C "$RUNNER_TEMP/bundle-${side}.git" fsck --full > "$RUNNER_TEMP/bundle-${side}-fsck.txt"
          done
          diff -u "$RUNNER_TEMP/bundle-a-commit.txt" "$RUNNER_TEMP/bundle-b-commit.txt" || true
          diff -u "$RUNNER_TEMP/bundle-a-tree.txt" "$RUNNER_TEMP/bundle-b-tree.txt" || true
          cat "$RUNNER_TEMP/bundle-a-commit.txt" "$RUNNER_TEMP/bundle-a-tree.txt"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-capsule-reproducibility-diagnosis
          path: |
            ${{ runner.temp }}/capsule-a/
            ${{ runner.temp }}/capsule-b/
            ${{ runner.temp }}/capsule-reproducibility-diff.json
            ${{ runner.temp }}/bundle-*-commit.txt
            ${{ runner.temp }}/bundle-*-tree.txt
            ${{ runner.temp }}/bundle-*-fsck.txt
          retention-days: 30
          if-no-files-found: error

      - name: Fail if not byte reproducible
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.all_files_byte_identical == true' "$RUNNER_TEMP/capsule-reproducibility-diff.json" >/dev/null
