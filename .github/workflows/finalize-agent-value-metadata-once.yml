name: One-time agent-value metadata finalization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/sitewide-formation-framing-sync' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sitewide-formation-framing-sync

      - name: Finalize structured fields and derived digest
        run: |
          python3 scripts/tmp_finalize_agent_value_metadata.py
          python3 -m json.tool api/agent-value.json >/dev/null
          python3 scripts/test_public_api_metadata_completeness.py
          python3 tests/test_sitewide_formation_framing.py
          git diff --check

      - name: Remove one-time tooling and commit
        run: |
          rm -f scripts/tmp_finalize_agent_value_metadata.py
          rm -f .github/workflows/finalize-agent-value-metadata-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize aligned agent-value metadata [metadata-finalization-applied]"
          git push origin HEAD:agent/sitewide-formation-framing-sync
