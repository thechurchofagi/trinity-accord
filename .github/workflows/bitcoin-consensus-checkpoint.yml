name: Bitcoin Consensus Checkpoint

on:
  workflow_dispatch:
    inputs:
      force_checkpoint:
        description: "Continue even if the latest sealed checkpoint already completed IBD"
        required: false
        type: boolean
        default: false
      recovery_from_tag:
        description: "Manual recovery source after the latest published checkpoint fails remote restore"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  checks: write

concurrency:
  group: bitcoin-consensus-checkpoint-mainnet
  cancel-in-progress: false

jobs:
  advance-checkpoint:
    name: Advance independently validated Bitcoin checkpoint
    runs-on: ubuntu-24.04
    environment: release-publish
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_CHECKPOINT: ${{ inputs.force_checkpoint || false }}
      RECOVERY_FROM_TAG: ${{ inputs.recovery_from_tag || '' }}
      BITCOIN_VERSION: "31.1"
      PRUNE_MIB: "550"
      SYNC_SECONDS: "14400"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Initialize runner-local checkpoint paths
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "DATADIR=$RUNNER_TEMP/bitcoin-mainnet"
            echo "CHECKPOINT_MANIFEST=$RUNNER_TEMP/bitcoin-consensus-checkpoint.json"
            echo "PREVIOUS_MANIFEST=$RUNNER_TEMP/previous-bitcoin-consensus-checkpoint.json"
            echo "RESTORE_MANIFEST=$RUNNER_TEMP/restore-bitcoin-consensus-checkpoint.json"
            echo "LATEST_RELEASE_JSON=$RUNNER_TEMP/latest-bitcoin-checkpoint-release.json"
            echo "RESTORE_RELEASE_JSON=$RUNNER_TEMP/restore-bitcoin-checkpoint-release.json"
            echo "ASSET_CATALOG=$RUNNER_TEMP/bitcoin-checkpoint-assets.tsv"
            echo "BITCOIN_LIVE_TELEMETRY_JSON=$RUNNER_TEMP/bitcoin-consensus-live.json"
            echo "BITCOIN_LIVE_CHECK_RUN_ID_FILE=$RUNNER_TEMP/bitcoin-consensus-live-check-id"
          } >> "$GITHUB_ENV"

      - name: Record toolchain provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/toolchain_provenance.py > "$RUNNER_TEMP/toolchain-provenance.json"
          cat "$RUNNER_TEMP/toolchain-provenance.json"

      - name: Reclaim runner disk and install checkpoint tools
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd jq
          df -h /
          python3 scripts/bitcoin_consensus_checkpoint.py --help >/dev/null
          python3 scripts/bitcoin_checkpoint_telemetry.py --help >/dev/null

      - name: Locate latest sealed checkpoint
        id: latest
        shell: bash
        run: |
          set -Eeuo pipefail
          releases="${RUNNER_TEMP}/bitcoin-releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases"

          jq '
            [
              .[]
              | select(.draft == false and .prerelease == false)
              | select(.tag_name | test("^bitcoin-consensus-checkpoint-[0-9]{6}$"))
            ]
            | sort_by(.tag_name)
            | last // null
          ' "$releases" > "$LATEST_RELEASE_JSON"

          latest_tag="$(jq -r 'if . == null then "" else .tag_name end' "$LATEST_RELEASE_JSON")"
          if [[ -z "$latest_tag" ]]; then
            echo "No sealed checkpoint exists; this run will start from a fresh Bitcoin Core datadir."
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          manifest_url="$(
            jq -r '
              .assets[]
              | select(.name == "bitcoin-consensus-checkpoint.json")
              | .url
            ' "$LATEST_RELEASE_JSON"
          )"
          if [[ -z "$manifest_url" || "$manifest_url" == "null" ]]; then
            echo "Published checkpoint release is missing its manifest" >&2
            exit 1
          fi

          gh api -H "Accept: application/octet-stream" "$manifest_url" > "$PREVIOUS_MANIFEST"
          python3 scripts/bitcoin_consensus_checkpoint.py validate-manifest "$PREVIOUS_MANIFEST"

          manifest_tag="$(jq -r '.checkpoint.tag' "$PREVIOUS_MANIFEST")"
          if [[ "$manifest_tag" != "$latest_tag" ]]; then
            echo "Release tag and checkpoint manifest tag disagree" >&2
            exit 1
          fi

          manifest_sha="$(python3 scripts/bitcoin_consensus_checkpoint.py manifest-sha256 "$PREVIOUS_MANIFEST")"
          echo "has_previous=true" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "previous_manifest_sha256=$manifest_sha" >> "$GITHUB_OUTPUT"

          cp "$LATEST_RELEASE_JSON" "$RESTORE_RELEASE_JSON"
          cp "$PREVIOUS_MANIFEST" "$RESTORE_MANIFEST"
          restore_tag="$latest_tag"
          restore_manifest_sha="$manifest_sha"
          recovery_mode=false

          if [[ -n "$RECOVERY_FROM_TAG" ]]; then
            if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              echo "Checkpoint recovery is available only through workflow_dispatch." >&2
              exit 1
            fi
            if [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
              echo "github-actions[bot] is forbidden from initiating checkpoint recovery." >&2
              exit 1
            fi
            if [[ "$FORCE_CHECKPOINT" != "true" ]]; then
              echo "Checkpoint recovery requires force_checkpoint=true." >&2
              exit 1
            fi
            if [[ ! "$RECOVERY_FROM_TAG" =~ ^bitcoin-consensus-checkpoint-[0-9]{6}$ ]]; then
              echo "Invalid recovery checkpoint tag." >&2
              exit 1
            fi

            latest_sequence="$(jq -r '.checkpoint.sequence' "$PREVIOUS_MANIFEST")"
            recovery_sequence="${RECOVERY_FROM_TAG##*-}"
            recovery_sequence=$((10#$recovery_sequence))
            if (( recovery_sequence + 1 != latest_sequence )); then
              echo "The recovery source must be exactly one sequence before the latest published checkpoint." >&2
              exit 1
            fi

            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RECOVERY_FROM_TAG}" > "$RESTORE_RELEASE_JSON"
            if ! jq -e '.draft == false and .prerelease == false' "$RESTORE_RELEASE_JSON" >/dev/null; then
              echo "Recovery source must be a public, non-prerelease checkpoint." >&2
              exit 1
            fi
            restore_manifest_url="$(
              jq -r '
                .assets[]
                | select(.name == "bitcoin-consensus-checkpoint.json")
                | .url
              ' "$RESTORE_RELEASE_JSON"
            )"
            if [[ -z "$restore_manifest_url" || "$restore_manifest_url" == "null" ]]; then
              echo "Recovery checkpoint release is missing its manifest." >&2
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" "$restore_manifest_url" > "$RESTORE_MANIFEST"
            python3 scripts/bitcoin_consensus_checkpoint.py validate-manifest "$RESTORE_MANIFEST"
            [[ "$(jq -r '.checkpoint.tag' "$RESTORE_MANIFEST")" == "$RECOVERY_FROM_TAG" ]] || {
              echo "Recovery release tag and manifest tag disagree." >&2
              exit 1
            }
            restore_tag="$RECOVERY_FROM_TAG"
            restore_manifest_sha="$(python3 scripts/bitcoin_consensus_checkpoint.py manifest-sha256 "$RESTORE_MANIFEST")"
            recovery_mode=true
            echo "Recovery mode will preserve $latest_tag as quarantined and restore state from $restore_tag."
          fi

          echo "restore_tag=$restore_tag" >> "$GITHUB_OUTPUT"
          echo "restore_manifest_sha256=$restore_manifest_sha" >> "$GITHUB_OUTPUT"
          echo "recovery_mode=$recovery_mode" >> "$GITHUB_OUTPUT"

          ibd="$(jq -r '.initialblockdownload' "$PREVIOUS_MANIFEST")"
          if [[ "$ibd" == "false" && "$recovery_mode" != "true" ]]; then
            echo "Latest sealed checkpoint already completed initial block download."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify checkpoint Release write permission
        if: steps.latest.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ steps.latest.outputs.has_previous }}" == "true" ]]; then
            previous_sequence="$(jq -r '.checkpoint.sequence' "$PREVIOUS_MANIFEST")"
            next_sequence=$(( previous_sequence + 1 ))
          else
            next_sequence=1
          fi
          next_tag="$(printf 'bitcoin-consensus-checkpoint-%06d' "$next_sequence")"

          # Exercise the exact cleanup path that sealing will need. A generic
          # create/delete probe can succeed even when an older draft cannot be
          # deleted, which would otherwise waste the entire IBD window before
          # failing at seal time.
          releases="${RUNNER_TEMP}/bitcoin-releases-preflight.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases"
          published_same_tag="$(
            jq -r --arg tag "$next_tag" '
              .[]
              | select(.tag_name == $tag and .draft == false)
              | .id
            ' "$releases" | head -n1
          )"
          [[ -z "$published_same_tag" ]] || {
            echo "Refusing to replace an already-published checkpoint: $next_tag" >&2
            exit 1
          }

          stale_id="$(
            jq -r --arg tag "$next_tag" '
              .[]
              | select(.tag_name == $tag and .draft == true)
              | .id
            ' "$releases" | head -n1
          )"
          if [[ -n "$stale_id" ]]; then
            echo "Removing incomplete draft during preflight: $next_tag"
            if ! gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${stale_id}"; then
              echo "Release preflight cannot remove stale draft $next_tag (release id $stale_id); refusing to start Bitcoin IBD." >&2
              exit 1
            fi
          fi

          probe_tag="bitcoin-consensus-release-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          probe_json="${RUNNER_TEMP}/bitcoin-release-preflight.json"
          probe_id=""

          cleanup_probe() {
            if [[ -n "$probe_id" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${probe_id}" >/dev/null
            fi
          }
          trap cleanup_probe EXIT

          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$probe_tag" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Bitcoin checkpoint Release permission preflight" \
            -f body="Ephemeral fail-fast permission probe; not a checkpoint and never authoritative." \
            -F draft=true > "$probe_json"
          probe_id="$(jq -r '.id // empty' "$probe_json")"
          [[ "$probe_id" =~ ^[0-9]+$ ]] || { echo "Release preflight returned no valid release id" >&2; exit 1; }

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${probe_id}"
          probe_id=""
          trap - EXIT
          echo "Checkpoint Release write preflight succeeded before Bitcoin IBD."

      - name: Restore previous checkpoint as a verified stream
        if: steps.latest.outputs.skip != 'true' && steps.latest.outputs.has_previous == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$DATADIR"
          tmp_part="${RUNNER_TEMP}/checkpoint-part.tmp"

          {
            while IFS= read -r name; do
              asset_url="$(
                jq -r --arg name "$name" '
                  .assets[]
                  | select(.name == $name)
                  | .url
                ' "$RESTORE_RELEASE_JSON"
              )"
              if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
                echo "Release is missing declared asset: $name" >&2
                exit 1
              fi
              rm -f "$tmp_part"
              gh api -H "Accept: application/octet-stream" "$asset_url" > "$tmp_part"
              python3 scripts/bitcoin_consensus_checkpoint.py \
                verify-asset "$RESTORE_MANIFEST" "$name" "$tmp_part"
              cat "$tmp_part"
              rm -f "$tmp_part"
            done < <(jq -r '.assets[].name' "$RESTORE_MANIFEST")
          } | zstd -d -c | tar --no-same-owner -xf - -C "$DATADIR"

          rm -f "$tmp_part"
          echo "Checkpoint restore completed only after every archive part passed SHA-256 and size validation."

      - name: Download and verify Bitcoin Core distribution
        if: steps.latest.outputs.skip != 'true'
        id: core
        shell: bash
        run: |
          set -Eeuo pipefail
          base="https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}"
          archive="bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 5 \
            --output "$archive" "$base/$archive"
          curl --fail --silent --show-error --location --retry 5 \
            --output SHA256SUMS "$base/SHA256SUMS"

          expected_line="$(awk -v archive="$archive" '$2 == archive && $1 ~ /^[0-9a-f]{64}$/ { print; exit }' SHA256SUMS)"
          if [[ -z "$expected_line" ]]; then
            echo "Official SHA256SUMS does not contain the expected Bitcoin Core archive" >&2
            exit 1
          fi
          printf '%s\n' "$expected_line" | sha256sum --check --strict -
          archive_sha="$(sha256sum "$archive" | awk '{print $1}')"
          echo "archive_sha256=$archive_sha" >> "$GITHUB_OUTPUT"

          tar -xzf "$archive"
          echo "${RUNNER_TEMP}/bitcoin-${BITCOIN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify restored chainstate matches its sealed predecessor
        if: steps.latest.outputs.skip != 'true' && steps.latest.outputs.has_previous == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          # Reopen under the exact prune contract recorded by the predecessor.
          # This remains correct if a later workflow intentionally changes its
          # prune target for the next checkpoint.
          sealed_prune_mib="$(jq -r '.prune_mib' "$RESTORE_MANIFEST")"
          if ! bitcoind -datadir="$DATADIR" -prune="$sealed_prune_mib" -assumevalid=0 -connect=0 -dnsseed=0 -listen=0 -daemonwait; then
            echo "Bitcoin Core could not reopen the restored predecessor; recent debug log follows." >&2
            if [[ -f "$DATADIR/debug.log" ]]; then
              tail -n 100 "$DATADIR/debug.log" >&2
            fi
            exit 1
          fi
          offline_info="$(bitcoin-cli -datadir="$DATADIR" getblockchaininfo)"

          expected_height="$(jq -r '.height' "$RESTORE_MANIFEST")"
          expected_hash="$(jq -r '.best_block_hash' "$RESTORE_MANIFEST")"
          actual_height="$(jq -r '.blocks' <<<"$offline_info")"
          actual_hash="$(jq -r '.bestblockhash' <<<"$offline_info")"

          if [[ "$actual_height" != "$expected_height" || "$actual_hash" != "$expected_hash" ]]; then
            echo "Restored Bitcoin Core state does not match the sealed predecessor manifest" >&2
            bitcoin-cli -datadir="$DATADIR" stop
            exit 1
          fi
          bitcoin-cli -datadir="$DATADIR" gettxoutsetinfo none \
            > "${RUNNER_TEMP}/restored-state-source-utxo-scan.json"

          bitcoin-cli -datadir="$DATADIR" stop >/dev/null
          while pgrep -f "[b]itcoind.*${DATADIR}" >/dev/null; do sleep 1; done
          echo "Restored chainstate exactly matches predecessor height/hash."

      - name: Advance Bitcoin Core consensus validation
        if: steps.latest.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$DATADIR"
          cat > "$DATADIR/bitcoin.conf" <<EOF
          server=1
          disablewallet=1
          prune=${PRUNE_MIB}
          assumevalid=0
          dbcache=1024
          listen=1
          dnsseed=1
          EOF

          stop_core() {
            bitcoin-cli -datadir="$DATADIR" stop >/dev/null 2>&1
          }
          trap stop_core EXIT INT TERM

          bitcoind -datadir="$DATADIR" -daemonwait
          start_height="$(bitcoin-cli -datadir="$DATADIR" getblockcount)"
          deadline=$(( $(date +%s) + SYNC_SECONDS ))
          live_chain_info="${RUNNER_TEMP}/live-chain-info.json"
          live_network_info="${RUNNER_TEMP}/live-network-info.json"

          while (( $(date +%s) < deadline )); do
            bitcoin-cli -datadir="$DATADIR" getblockchaininfo > "$live_chain_info"
            bitcoin-cli -datadir="$DATADIR" getnetworkinfo > "$live_network_info"
            info="$(cat "$live_chain_info")"
            height="$(jq -r '.blocks' <<<"$info")"
            headers="$(jq -r '.headers' <<<"$info")"
            progress="$(jq -r '.verificationprogress' <<<"$info")"
            ibd="$(jq -r '.initialblockdownload' <<<"$info")"
            free_kib="$(df --output=avail "$DATADIR" | tail -n1 | tr -d ' ')"
            now="$(date +%s)"
            remaining=$(( deadline - now ))
            if (( remaining < 0 )); then
              remaining=0
            fi

            printf 'height=%s headers=%s verificationprogress=%s ibd=%s free_kib=%s connections=%s\n' \
              "$height" "$headers" "$progress" "$ibd" "$free_kib" \
              "$(jq -r '.connections' "$live_network_info")"

            python3 scripts/bitcoin_checkpoint_telemetry.py \
              --phase syncing \
              --chain-info-file "$live_chain_info" \
              --network-info-file "$live_network_info" \
              --free-kib "$free_kib" \
              --seconds-remaining "$remaining"

            if [[ "$ibd" == "false" ]]; then
              echo "Bitcoin Core reports IBD complete."
              break
            fi
            if (( free_kib < 3145728 )); then
              echo "Free disk fell below 3 GiB; sealing a checkpoint before disk exhaustion."
              break
            fi
            sleep 60
          done

          python3 scripts/bitcoin_checkpoint_telemetry.py \
            --phase sync_window_finished \
            --chain-info-file "$live_chain_info" \
            --network-info-file "$live_network_info" \
            --free-kib "$(df --output=avail "$DATADIR" | tail -n1 | tr -d ' ')" \
            --seconds-remaining 0

          bitcoin-cli -datadir="$DATADIR" stop >/dev/null
          while pgrep -f "[b]itcoind.*${DATADIR}" >/dev/null; do sleep 1; done
          trap - EXIT INT TERM

          # Re-open with networking disabled so the manifest describes the exact
          # clean state that will be archived, with no race against a new block.
          bitcoind -datadir="$DATADIR" -connect=0 -dnsseed=0 -listen=0 -daemonwait
          bitcoin-cli -datadir="$DATADIR" getblockchaininfo > "${RUNNER_TEMP}/final-chain-info.json"
          bitcoin-cli -datadir="$DATADIR" stop >/dev/null
          while pgrep -f "[b]itcoind.*${DATADIR}" >/dev/null; do sleep 1; done

          python3 scripts/bitcoin_checkpoint_telemetry.py \
            --phase validated_clean_state \
            --chain-info-file "${RUNNER_TEMP}/final-chain-info.json" \
            --free-kib "$(df --output=avail "$DATADIR" | tail -n1 | tr -d ' ')" \
            --seconds-remaining 0

          final_height="$(jq -r '.blocks' "${RUNNER_TEMP}/final-chain-info.json")"
          if [[ "${{ steps.latest.outputs.has_previous }}" == "true" ]]; then
            previous_height="$(jq -r '.height' "$RESTORE_MANIFEST")"
            if (( final_height <= previous_height )); then
              echo "Bitcoin Core made no forward block-height progress; refusing to publish a duplicate checkpoint." >&2
              exit 1
            fi
          fi
          echo "Advanced independently validated chain from height ${start_height} to ${final_height}."

      - name: Seal immutable checkpoint into a draft Release
        if: steps.latest.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          : > "$ASSET_CATALOG"

          python3 scripts/bitcoin_checkpoint_telemetry.py \
            --phase sealing_checkpoint \
            --chain-info-file "${RUNNER_TEMP}/final-chain-info.json" \
            --free-kib "$(df --output=avail "$DATADIR" | tail -n1 | tr -d ' ')" \
            --seconds-remaining 0

          if [[ "${{ steps.latest.outputs.has_previous }}" == "true" ]]; then
            previous_sequence="$(jq -r '.checkpoint.sequence' "$PREVIOUS_MANIFEST")"
            sequence=$(( previous_sequence + 1 ))
          else
            sequence=1
          fi
          tag="$(printf 'bitcoin-consensus-checkpoint-%06d' "$sequence")"
          export CHECKPOINT_TAG="$tag"
          export ASSET_CATALOG

          # A killed job may have left this exact next checkpoint as an
          # unpublished draft. It is not authoritative and is safe to replace.
          all_releases="${RUNNER_TEMP}/all-releases-before-seal.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$all_releases"
          stale_id="$(
            jq -r --arg tag "$tag" '
              .[]
              | select(.tag_name == $tag and .draft == true)
              | .id
            ' "$all_releases" | head -n1
          )"
          published_same_tag="$(
            jq -r --arg tag "$tag" '
              .[]
              | select(.tag_name == $tag and .draft == false)
              | .id
            ' "$all_releases" | head -n1
          )"
          if [[ -n "$published_same_tag" ]]; then
            echo "Refusing to replace an already-published checkpoint: $tag" >&2
            exit 1
          fi
          if [[ -n "$stale_id" ]]; then
            echo "Removing incomplete draft from an interrupted prior attempt: $tag"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${stale_id}"
          fi

          release_notes="GitHub-hosted Bitcoin Core pruned-mainnet checkpoint. Persistence only; the manifest records the verification boundary."
          if [[ "${{ steps.latest.outputs.recovery_mode }}" == "true" ]]; then
            release_notes+=" Recovery: state restored from ${{ steps.latest.outputs.restore_tag }}; ${{ steps.latest.outputs.previous_tag }} is retained but quarantined after remote restore failure."
          fi

          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Bitcoin Consensus Checkpoint ${sequence}" \
            --notes "$release_notes"

          part_prefix="${RUNNER_TEMP}/bitcoin-datadir.tar.zst.part-"
          export GH_TOKEN CHECKPOINT_TAG ASSET_CATALOG
          tar -C "$DATADIR" \
            --exclude='./bitcoin.conf' \
            --exclude='./debug.log' \
            --exclude='./.cookie' \
            --exclude='./.lock' \
            -cf - . \
            | zstd -3 -T0 \
            | split -d -a 4 -b 900M - "$part_prefix" \
                --filter='
                  set -Eeuo pipefail
                  cat > "$FILE"
                  name="$(basename "$FILE")"
                  size="$(stat -c %s "$FILE")"
                  digest="$(sha256sum "$FILE" | awk "{print \$1}")"
                  gh release upload "$CHECKPOINT_TAG" "$FILE"
                  printf "%s\t%s\t%s\n" "$name" "$size" "$digest" >> "$ASSET_CATALOG"
                  rm -f "$FILE"
                '

          [[ -s "$ASSET_CATALOG" ]] || { echo "No checkpoint assets were produced" >&2; exit 1; }

          previous_args=()
          if [[ "${{ steps.latest.outputs.has_previous }}" == "true" ]]; then
            previous_args+=(
              --previous-tag "${{ steps.latest.outputs.previous_tag }}"
              --previous-manifest-sha256 "${{ steps.latest.outputs.previous_manifest_sha256 }}"
              --state-source-tag "${{ steps.latest.outputs.restore_tag }}"
              --state-source-manifest-sha256 "${{ steps.latest.outputs.restore_manifest_sha256 }}"
            )
            if [[ "${{ steps.latest.outputs.recovery_mode }}" == "true" ]]; then
              previous_args+=(
                --quarantined-tag "${{ steps.latest.outputs.previous_tag }}"
                --quarantined-manifest-sha256 "${{ steps.latest.outputs.previous_manifest_sha256 }}"
                --quarantine-reason remote_restore_failed
              )
            fi
          fi

          python3 scripts/bitcoin_consensus_checkpoint.py build-manifest \
            --catalog "$ASSET_CATALOG" \
            --chain-info "${RUNNER_TEMP}/final-chain-info.json" \
            --sequence "$sequence" \
            "${previous_args[@]}" \
            --bitcoin-core-version "$BITCOIN_VERSION" \
            --bitcoin-core-archive-sha256 "${{ steps.core.outputs.archive_sha256 }}" \
            --prune-mib "$PRUNE_MIB" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-sha "$GITHUB_SHA" \
            --created-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --output "$CHECKPOINT_MANIFEST"

          python3 scripts/bitcoin_consensus_checkpoint.py validate-manifest "$CHECKPOINT_MANIFEST"
          gh release upload "$tag" "$CHECKPOINT_MANIFEST#bitcoin-consensus-checkpoint.json"

          # Every draft must survive a remote round trip before publication.
          # This protects intermediate checkpoints too, so a bad archive can
          # never become the state source for the next scheduled run.
          {
            echo "Restoring and fully scanning the remote draft before publication."
            draft_snapshot="${RUNNER_TEMP}/final-checkpoint-draft.json"
            remote_manifest="${RUNNER_TEMP}/remote-bitcoin-consensus-checkpoint.json"
            expected_asset_count=$(( $(jq '.assets | length' "$CHECKPOINT_MANIFEST") + 1 ))
            draft_ready=false

            # GitHub can briefly expose a Release before every uploaded asset is
            # visible through the API. Wait for the exact draft inventory before
            # trusting any download URL.
            for attempt in $(seq 1 12); do
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                | jq --arg tag "$tag" '
                    [
                      .[]
                      | select(.tag_name == $tag and .draft == true)
                    ]
                    | first // null
                  ' > "$draft_snapshot"

              inventory_ok=true
              remote_asset_count="$(jq 'if . == null then 0 else (.assets | length) end' "$draft_snapshot")"
              if [[ "$remote_asset_count" != "$expected_asset_count" ]]; then
                inventory_ok=false
              fi
              while IFS= read -r expected_name; do
                if ! jq -e --arg name "$expected_name" '
                  [.assets[]? | select(.name == $name and .state == "uploaded")] | length == 1
                ' "$draft_snapshot" >/dev/null; then
                  inventory_ok=false
                  break
                fi
              done < <(
                jq -r '.assets[].name' "$CHECKPOINT_MANIFEST"
                printf '%s\n' 'bitcoin-consensus-checkpoint.json'
              )

              if [[ "$inventory_ok" == "true" ]]; then
                draft_ready=true
                break
              fi
              echo "Draft inventory is not complete yet (attempt ${attempt}/12)."
              sleep 5
            done
            [[ "$draft_ready" == "true" ]] || {
              echo "Draft never exposed the exact manifest-declared asset inventory; refusing publication." >&2
              exit 1
            }

            manifest_asset_url="$(
              jq -r '
                .assets[]
                | select(.name == "bitcoin-consensus-checkpoint.json")
                | .url
              ' "$draft_snapshot"
            )"
            gh api -H "Accept: application/octet-stream" "$manifest_asset_url" > "$remote_manifest"
            cmp "$CHECKPOINT_MANIFEST" "$remote_manifest" || {
              echo "Remote draft manifest differs from the locally validated manifest; refusing publication." >&2
              exit 1
            }

            # Reclaim the original datadir only after every upload is visible and
            # the remote manifest is byte-identical. The exact path assertion
            # prevents an accidental broad deletion if an environment variable is
            # ever changed.
            [[ -n "${RUNNER_TEMP:-}" && "$DATADIR" == "$RUNNER_TEMP/bitcoin-mainnet" ]] || {
              echo "Refusing to replace an unexpected datadir path during remote restore verification." >&2
              exit 1
            }
            rm -rf -- "$DATADIR"
            mkdir -p "$DATADIR"
            final_part="${RUNNER_TEMP}/final-checkpoint-part.tmp"

            {
              while IFS= read -r name; do
                asset_url="$(
                  jq -r --arg name "$name" '
                    .assets[]
                    | select(.name == $name)
                    | .url
                  ' "$draft_snapshot"
                )"
                rm -f "$final_part"
                gh api -H "Accept: application/octet-stream" "$asset_url" > "$final_part"
                python3 scripts/bitcoin_consensus_checkpoint.py \
                  verify-asset "$CHECKPOINT_MANIFEST" "$name" "$final_part"
                cat "$final_part"
                rm -f "$final_part"
              done < <(jq -r '.assets[].name' "$CHECKPOINT_MANIFEST")
            } | zstd -d -c | tar --no-same-owner -xf - -C "$DATADIR"
            rm -f "$final_part"

            restored_info="${RUNNER_TEMP}/remote-restored-final-chain-info.json"
            restored_core_started=false
            stop_restored_core() {
              if [[ "$restored_core_started" == "true" ]]; then
                if ! bitcoin-cli -datadir="$DATADIR" stop >/dev/null 2>&1; then
                  echo "Could not stop the remotely restored Bitcoin Core process during failure cleanup." >&2
                fi
              fi
            }
            trap stop_restored_core EXIT INT TERM
            if ! bitcoind -datadir="$DATADIR" -prune="$PRUNE_MIB" -assumevalid=0 -disablewallet=1 \
              -connect=0 -dnsseed=0 -listen=0 -daemonwait; then
              echo "Bitcoin Core could not reopen the remotely restored draft." >&2
              if [[ -f "$DATADIR/debug.log" ]]; then
                tail -n 100 "$DATADIR/debug.log" >&2
              fi
              exit 1
            fi
            restored_core_started=true
            bitcoin-cli -datadir="$DATADIR" getblockchaininfo > "$restored_info"

            expected_height="$(jq -r '.height' "$CHECKPOINT_MANIFEST")"
            expected_hash="$(jq -r '.best_block_hash' "$CHECKPOINT_MANIFEST")"
            expected_ibd="$(jq -r '.initialblockdownload' "$CHECKPOINT_MANIFEST")"
            restored_height="$(jq -r '.blocks' "$restored_info")"
            restored_hash="$(jq -r '.bestblockhash' "$restored_info")"
            restored_ibd="$(jq -r '.initialblockdownload' "$restored_info")"
            [[ "$restored_height" == "$expected_height" ]] || {
              echo "Remote final draft restored to height $restored_height, expected $expected_height." >&2
              exit 1
            }
            [[ "$restored_hash" == "$expected_hash" ]] || {
              echo "Remote final draft restored to hash $restored_hash, expected $expected_hash." >&2
              exit 1
            }
            [[ "$restored_ibd" == "$expected_ibd" ]] || {
              echo "Remote draft IBD state $restored_ibd differs from manifest value $expected_ibd; refusing publication." >&2
              exit 1
            }

            # Force a read of the complete UTXO LevelDB. Startup and a height/hash
            # query may touch only a small subset of SSTables and missed the
            # truncated tables in the invalid 000008 archive.
            utxo_scan="${RUNNER_TEMP}/remote-restored-utxo-scan.json"
            bitcoin-cli -datadir="$DATADIR" gettxoutsetinfo none > "$utxo_scan"
            [[ "$(jq -r '.height' "$utxo_scan")" == "$expected_height" ]] || {
              echo "Remote draft UTXO scan height differs from the manifest; refusing publication." >&2
              exit 1
            }
            [[ "$(jq -r '.bestblock' "$utxo_scan")" == "$expected_hash" ]] || {
              echo "Remote draft UTXO scan best block differs from the manifest; refusing publication." >&2
              exit 1
            }

            bitcoin-cli -datadir="$DATADIR" stop >/dev/null
            while pgrep -f "[b]itcoind.*${DATADIR}" >/dev/null; do sleep 1; done
            restored_core_started=false
            trap - EXIT INT TERM
            echo "Remote draft restored cleanly and passed a full UTXO scan; publication is authorized."
          }

          gh release edit "$tag" --draft=false

          python3 scripts/bitcoin_checkpoint_telemetry.py \
            --phase checkpoint_published \
            --chain-info-file "${RUNNER_TEMP}/final-chain-info.json" \
            --free-kib "$(df --output=avail "$DATADIR" | tail -n1 | tr -d ' ')" \
            --seconds-remaining 0

          echo "Published sealed checkpoint: $tag"
          python3 scripts/bitcoin_consensus_checkpoint.py manifest-sha256 "$CHECKPOINT_MANIFEST"

      - name: Finalize live telemetry check
        if: always()
        env:
          BITCOIN_TELEMETRY_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f "$BITCOIN_LIVE_CHECK_RUN_ID_FILE" ]]; then
            echo "No live telemetry check was created in this run."
            exit 0
          fi

          telemetry_args=()
          if [[ -f "${RUNNER_TEMP}/final-chain-info.json" ]]; then
            telemetry_args+=(--chain-info-file "${RUNNER_TEMP}/final-chain-info.json")
          fi

          python3 scripts/bitcoin_checkpoint_telemetry.py \
            --phase workflow_finished \
            "${telemetry_args[@]}" \
            --complete \
            --conclusion neutral
