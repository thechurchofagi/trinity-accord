name: Apply Core Receipt Integrity Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: core-receipt-integrity-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/deep-audit-read-integrity-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic patch
        run: |
          set -euo pipefail
          python3 .github/core-receipt-hmac-fix.py
          python3 .github/core-receipt-integrity-fix.py
          python3 .github/core-receipt-test-fixtures-fix.py
          rm -f .github/core-receipt-hmac-fix.py
          rm -f .github/core-receipt-integrity-fix.py
          rm -f .github/core-receipt-test-fixtures-fix.py
          rm -f .github/workflows/core-receipt-integrity-fix.yml
          python3 -m py_compile apps/record_chain_intake_gateway/app.py

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt

      - name: Run focused and complete Gateway tests
        env:
          PYTHONPATH: apps/record_chain_intake_gateway
        run: |
          set -euo pipefail
          python3 -m pytest \
            apps/record_chain_intake_gateway/tests/test_receipt.py \
            apps/record_chain_intake_gateway/tests/test_deep_audit_round3.py \
            tests/test_record_chain_submit_recovery.py \
            -q
          python3 -m pytest apps/record_chain_intake_gateway/tests -q

      - name: Commit final code only
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test ! -e .github/core-receipt-hmac-fix.py
          test ! -e .github/core-receipt-integrity-fix.py
          test ! -e .github/core-receipt-test-fixtures-fix.py
          test ! -e .github/workflows/core-receipt-integrity-fix.yml
          git config user.name 'trinity-deep-audit-bot'
          git config user.email 'actions@github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: verify core receipt route and stored submission bindings'
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${HEAD_BRANCH}"
