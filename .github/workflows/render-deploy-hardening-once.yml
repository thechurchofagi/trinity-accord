name: Render Hardened Deploy Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-deploy-hardening-once.yml

permissions:
  contents: read

jobs:
  deploy-once:
    if: ${{ github.actor == 'thechurchofagi' || github.actor == 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: main

      - name: Authorize one-time production deployment
        env:
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REF_NAME" = "refs/heads/main"
          if [[ "$ACTOR" != "thechurchofagi" && "$ACTOR" != "github-actions[bot]" ]]; then
            echo "Unauthorized one-time Render deployment actor: $ACTOR" >&2
            exit 1
          fi
          echo "Authorized one-time hardened deploy: $ACTOR on $REF_NAME"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Deploy exact merged commit and verify production
        env:
          RENDER: ${{ secrets.RENDER }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          python scripts/render_hardened_deploy.py \
            --service trinity-record-chain-gateway \
            --commit-id "$source_sha" \
            --deploy \
            --reconcile-config \
            --wait
