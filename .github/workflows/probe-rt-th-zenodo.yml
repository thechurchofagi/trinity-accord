name: RT-TH Zenodo existing-deposit identity probe
on:
  push:
    branches: [research/rt-paper-v1-0-0-20261009]
    paths:
      - research/task-relative-continuity/PROBE-AUTHORIZATION.json
permissions:
  contents: write
concurrency:
  group: rt-th-v100-zenodo-create-once
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[rt-th-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/rt-paper-v1-0-0-20261009
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect existing title/version in authorized Zenodo account; no POST
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/task-relative-continuity/publication.py probe
      - name: Retain sanitized identity report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rt-th-zenodo-collision-probe-${{ github.run_id }}
          path: research/task-relative-continuity/collision-report.json
          retention-days: 30
          if-no-files-found: warn
