name: Retired Example Dependency Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/retired-example-dependency-audit.yml
      - examples/github-app-backend/package.json
      - examples/github-app-backend/package-lock.json

permissions:
  contents: write

concurrency:
  group: retired-example-dependency-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  audit-and-repair:
    if: github.head_ref == 'fix/retired-example-dependencies-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/retired-example-dependencies-20260802
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1

      - name: Reproduce current audit result
        working-directory: examples/github-app-backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --json > "$RUNNER_TEMP/audit-before.json" || true
          jq '{metadata, vulnerabilities}' "$RUNNER_TEMP/audit-before.json"

      - name: Apply non-breaking lockfile repair
        working-directory: examples/github-app-backend
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --json > "$RUNNER_TEMP/audit-after.json" || true
          jq '{metadata, vulnerabilities}' "$RUNNER_TEMP/audit-after.json"
          high="$(jq -r '.metadata.vulnerabilities.high // 0' "$RUNNER_TEMP/audit-after.json")"
          critical="$(jq -r '.metadata.vulnerabilities.critical // 0' "$RUNNER_TEMP/audit-after.json")"
          test "$high" = "0"
          test "$critical" = "0"

      - name: Verify retired example remains executable
        working-directory: examples/github-app-backend
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          npm run test:dry

      - name: Commit repaired lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- examples/github-app-backend/package-lock.json; then
            echo "Lockfile already resolves without high or critical advisories."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/github-app-backend/package-lock.json
          git commit -m "fix: refresh retired example dependency lock"
          git push origin HEAD:fix/retired-example-dependencies-20260802
