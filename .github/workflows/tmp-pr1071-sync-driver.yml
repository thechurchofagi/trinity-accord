name: Temporary PR 1071 synchronize driver

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-pr-branch:
    if: github.event.pull_request.number == 1071
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/close-final-scholarly-parser-gaps-2026-08-21
          fetch-depth: 0
      - name: Apply guarded scholarly parser patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-close-scholarly-parser-p2.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = lines.index('          PY', start)
          code_lines = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          Path('/tmp/apply_scholarly_patch.py').write_text('\n'.join(code_lines) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_scholarly_patch.py
          python -m pytest -q tests/test_scholarly_parser_edge_cases.py
          python -m py_compile scripts/check_deployment_freshness.py
          python -m ruff check scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py || ruff check scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git diff --check
      - name: Remove temporary PR files and push final patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/tmp-close-scholarly-parser-p2.yml .github/workflows/tmp-run-scholarly-parser-closure.yml .tmp-scholarly-parser-trigger
          git add -- scripts/check_deployment_freshness.py tests/test_scholarly_parser_edge_cases.py
          git commit -m "fix: close final scholarly parser review gaps"
          git push origin HEAD:agent/close-final-scholarly-parser-gaps-2026-08-21
