name: Clone-Depth-Independent Capsule Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/clone-depth-independent-capsule-repair.yml
      - scripts/build_preservation_capsule.py
      - tests/test_preservation_capsule.py

permissions:
  contents: write

concurrency:
  group: clone-depth-independent-capsule-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.head_ref == 'fix/clone-depth-independent-capsule-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repair branch with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/clone-depth-independent-capsule-20260802
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Apply clean object-store repair and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          builder = Path('scripts/build_preservation_capsule.py')
          text = builder.read_text(encoding='utf-8')

          insertion_point = '\ndef delete_all_refs_and_set_main(bare: Path, commit: str) -> None:\n'
          helper = '''\ndef materialize_commit_tree_repository(\n    source: Path,\n    target: Path,\n    tree_oid: str,\n    tracked: dict[str, Any],\n) -> None:\n    """Create a clean history-free repository containing only the frozen tree.\n\n    Building from a bare clone leaks source-repository storage state, including\n    shallow-clone boundaries and pack layout, into the recovery bundle bytes.\n    Materializing the exact tracked blobs into a new repository makes the\n    published bundle a pure function of the frozen tree and controlled commit\n    metadata.\n    """\n    run(["git", "init", "-b", "main", str(target)])\n    git_text(target, "config", "core.filemode", "true")\n    blobs = batch_blob_bytes(\n        source, (item["git_blob_oid"] for item in tracked["files"])\n    )\n    for item in tracked["files"]:\n        destination = target / item["path"]\n        destination.parent.mkdir(parents=True, exist_ok=True)\n        destination.write_bytes(blobs[item["git_blob_oid"]])\n        destination.chmod(0o755 if item["mode"] == "100755" else 0o644)\n    git_text(target, "add", "-A")\n    rebuilt_tree = git_text(target, "write-tree")\n    if rebuilt_tree != tree_oid:\n        raise SystemExit(\n            "clean recovery repository tree mismatch: "\n            f"expected {tree_oid}, observed {rebuilt_tree}"\n        )\n\n\n'''
          if insertion_point not in text:
              raise SystemExit('delete_all_refs_and_set_main insertion point not found')
          if 'def materialize_commit_tree_repository(' not in text:
              text = text.replace(insertion_point, '\n' + helper + insertion_point.lstrip('\n'), 1)

          old_source = '''        bare = temp / "repository.git"\n        run(["git", "clone", "--bare", "--no-local", str(root), str(bare)])\n        recovery_commit = create_recovery_snapshot_commit(\n            bare, tree_oid, commit, commit_epoch\n        )\n        delete_all_refs_and_set_main(bare, recovery_commit)\n        secret_scan = scan_recovery_snapshot_for_secrets(bare)\n        references = reference_inventory(bare)\n'''
          new_source = '''        recovery_repo = temp / "repository"\n        materialize_commit_tree_repository(\n            root, recovery_repo, tree_oid, tracked\n        )\n        recovery_commit = create_recovery_snapshot_commit(\n            recovery_repo, tree_oid, commit, commit_epoch\n        )\n        delete_all_refs_and_set_main(recovery_repo, recovery_commit)\n        secret_scan = scan_recovery_snapshot_for_secrets(recovery_repo)\n        references = reference_inventory(recovery_repo)\n'''
          if text.count(old_source) != 1:
              raise SystemExit(f'expected one bare-clone source block, found {text.count(old_source)}')
          text = text.replace(old_source, new_source)

          text = text.replace(
              '            bare,\n            "-c",\n            "pack.threads=1",',
              '            recovery_repo,\n            "-c",\n            "pack.threads=1",',
              1,
          )
          text = text.replace(
              '        git_text(bare, "bundle", "verify", str(bundle))\n',
              '        git_text(recovery_repo, "bundle", "verify", str(bundle))\n',
              1,
          )
          text = text.replace(
              '        "The production commit and tag identities are recorded in the\\n"\n',
              '        "The production commit identity is recorded in the\\n"\n',
              1,
          )
          text = text.replace(
              '            "production_tag_identities_recorded": True,\n',
              '            "production_tag_identities_recorded": False,\n',
              1,
          )
          builder.write_text(text, encoding='utf-8')

          tests = Path('tests/test_preservation_capsule.py')
          test_text = tests.read_text(encoding='utf-8')
          assertion_anchor = '    assert report["production_tag_identity_count"] == 0\n'
          assertion = (
              '    assert verified["manifest"]["scope"]["production_tag_identities_recorded"] is False\n'
          )
          if assertion not in test_text:
              if assertion_anchor not in test_text:
                  raise SystemExit('production tag assertion anchor not found')
              test_text = test_text.replace(
                  assertion_anchor,
                  assertion_anchor + assertion,
                  1,
              )

          marker = 'def test_capsule_identity_is_independent_of_clone_depth'
          if marker not in test_text:
              test_text += '''\n\ndef test_capsule_identity_is_independent_of_clone_depth(tmp_path):\n    repo, frozen_commit = make_repository(tmp_path)\n    capsule_full = tmp_path / "capsule-full"\n    builder.build(repo, capsule_full, frozen_commit)\n\n    shallow = tmp_path / "shallow-repository"\n    subprocess.run(\n        [\n            "git",\n            "clone",\n            "--depth",\n            "1",\n            "--no-tags",\n            "--branch",\n            "main",\n            repo.resolve().as_uri(),\n            str(shallow),\n        ],\n        check=True,\n        capture_output=True,\n    )\n    assert subprocess.run(\n        ["git", "rev-parse", "--is-shallow-repository"],\n        cwd=shallow,\n        check=True,\n        capture_output=True,\n        text=True,\n    ).stdout.strip() == "true"\n    assert subprocess.run(\n        ["git", "rev-parse", "HEAD"],\n        cwd=shallow,\n        check=True,\n        capture_output=True,\n        text=True,\n    ).stdout.strip() == frozen_commit\n\n    capsule_shallow = tmp_path / "capsule-shallow"\n    builder.build(shallow, capsule_shallow, frozen_commit)\n\n    verified_full = package.verify_local_package(capsule_full)\n    verified_shallow = package.verify_local_package(capsule_shallow)\n    assert verified_full["package_identity_sha256"] == verified_shallow["package_identity_sha256"]\n    assert sorted(path.name for path in capsule_full.iterdir()) == sorted(\n        path.name for path in capsule_shallow.iterdir()\n    )\n    for path_full in capsule_full.iterdir():\n        path_shallow = capsule_shallow / path_full.name\n        assert path_full.read_bytes() == path_shallow.read_bytes(), path_full.name\n'''
          tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Run focused preservation suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r requirements-ci.txt
          python3 -m pytest tests/test_preservation_capsule.py -q

      - name: Commit verified repair to branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/build_preservation_capsule.py tests/test_preservation_capsule.py; then
            echo 'Repair already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_preservation_capsule.py tests/test_preservation_capsule.py
          git commit -m 'fix: make preservation capsule clone-depth independent'
          git push origin HEAD:fix/clone-depth-independent-capsule-20260802
