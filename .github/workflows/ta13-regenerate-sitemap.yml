name: TA13 Regenerate Sitemap
on:
  push:
    branches: [research/civilizational-intellectual-accounts-v1-0-20260921]
    paths:
      - '.github/workflows/ta13-regenerate-sitemap.yml'
permissions:
  contents: write
concurrency:
  group: ta13-sitemap-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/civilizational-intellectual-accounts-v1-0-20260921
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML==6.0.2
      - run: python3 scripts/generate_sitemap.py
      - name: Commit generated sitemaps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml sitemap-core.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: regenerate discovery sitemaps for TA13'
          git push origin HEAD:research/civilizational-intellectual-accounts-v1-0-20260921
