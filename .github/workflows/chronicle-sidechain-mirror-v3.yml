name: Chronicle Polygon + Base historical NFT evidence mirror

on:
  workflow_dispatch:
    inputs:
      refresh_live:
        description: "Re-read Polygon/Base instead of bootstrapping from the verified immutable v1 snapshot"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "scripts/discover-chronicle-sidechain-nfts.mjs"
      - "scripts/run-chronicle-sidechain-mirror-observed.sh"
      - "scripts/build-chronicle-sidechain-evidence.mjs"
      - "scripts/rebuild-chronicle-sidechain-cars-from-history.mjs"
      - "scripts/sidechain-debug-live.py"
      - "scripts/chronicle-sidechain-car-integrity.mjs"
      - "scripts/chronicle-sidechain-car-progress.mjs"
      - "scripts/chronicle-sidechain-car-trace.mjs"
      - "scripts/ipfs-car-blockwise.mjs"
      - "scripts/test_chronicle_car_blockwise.mjs"
      - "scripts/test_chronicle_bootstrap_history.mjs"
      - "scripts/capture-chronicle-sidechain-l2.py"
      - "scripts/capture-chronicle-sidechain-l2-parallel.py"
      - "scripts/test_chronicle_sidechain_l2.py"
      - "scripts/test_chronicle_sidechain_l2_parallel.py"
      - "scripts/publish-chronicle-sidechain-progress.py"
      - "scripts/stream-chronicle-sidechain-progress.sh"
      - "scripts/verify-chronicle-sidechain-evidence.py"
      - "scripts/finalize-chronicle-sidechain-evidence.mjs"
      - ".github/workflows/chronicle-sidechain-mirror-v3.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: chronicle-sidechain-mirror
  cancel-in-progress: true

env:
  BOOTSTRAP_TAG: chronicle-sidechain-mirror-v1-b1a074fd0b0a
  BOOTSTRAP_ARCHIVE: chronicle-sidechain-mirror-b1a074fd0b0a.tar.gz
  BOOTSTRAP_ARCHIVE_SHA256: d0fe9d4c5f57d98f784ea9c9726d762a0980c08c19b909e6bdc60e97e29be7c8
  LASSIE_VERSION: 0.25.0
  LASSIE_LINUX_AMD64_SHA256: cbd81ce9625a7db346a1c7f3bb67d4654fba4af0d8c5bdfdd1c0aaddd2c76286
  KUBO_VERSION: 0.37.0
  KUBO_LINUX_AMD64_SHA512: b9243e8be52377fc934aedc66161bd51e7c49d1d52678b127b910e5654fa453983a070918e345d8e57e509f1f8c82574f59148d145d23b35d04bb20fed20f5b6
  CHRONICLE_PROGRESS_ISSUE: "1020"
  CHRONICLE_DEBUG_PUBLISH_SECONDS: "15"
  CHRONICLE_PROGRESS_PUBLISH_SECONDS: "15"

jobs:
  mirror:
    if: ${{ github.ref == 'refs/heads/main' && (github.actor == 'thechurchofagi' || github.actor == 'github-actions[bot]' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout evidence source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Bind execution to event source commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA" || {
            echo "evidence source mismatch: event=$GITHUB_SHA checkout=$actual" >&2
            exit 1
          }
          echo "[SOURCE BOUND] $actual"

      - name: Initialize live progress
        env:
          GH_TOKEN: ${{ github.token }}
          CHRONICLE_L2_PROGRESS_FILE: ${{ runner.temp }}/chronicle-sidechain-l2-progress.json
        run: python3 scripts/publish-chronicle-sidechain-progress.py --phase setup --status running || true

      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > toolchain-provenance.json
          cat toolchain-provenance.json

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version-file: ".node-version"

      - name: Install proof dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Validate scanner, evidence builders, parallel L2, and telemetry
        run: |
          set -euo pipefail
          node --check scripts/discover-chronicle-sidechain-nfts.mjs
          node --check scripts/build-chronicle-sidechain-evidence.mjs
          node --check scripts/rebuild-chronicle-sidechain-cars-from-history.mjs
          node --check scripts/ipfs-car-blockwise.mjs
          node scripts/test_chronicle_car_blockwise.mjs
          node scripts/test_chronicle_bootstrap_history.mjs
          python3 scripts/test_chronicle_sidechain_l2.py
          python3 scripts/test_chronicle_sidechain_l2_parallel.py
          node --check scripts/finalize-chronicle-sidechain-evidence.mjs
          python3 -m py_compile \
            scripts/sidechain-debug-live.py \
            scripts/capture-chronicle-sidechain-l2.py \
            scripts/capture-chronicle-sidechain-l2-parallel.py \
            scripts/publish-chronicle-sidechain-progress.py \
            scripts/verify-chronicle-sidechain-evidence.py
          bash -n scripts/run-chronicle-sidechain-mirror-observed.sh
          bash -n scripts/stream-chronicle-sidechain-progress.sh
          echo "[VALIDATION OK] scanner + CAR/L1 + live debug + parallel L2 + telemetry + offline verification"

      - name: Bootstrap verified sidechain snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_live != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          gh release download "$BOOTSTRAP_TAG" --repo "$GITHUB_REPOSITORY" --dir "$tmp" --pattern "$BOOTSTRAP_ARCHIVE"
          actual="$(sha256sum "$tmp/$BOOTSTRAP_ARCHIVE" | awk '{print $1}')"
          test "$actual" = "$BOOTSTRAP_ARCHIVE_SHA256" || {
            echo "bootstrap archive digest mismatch: expected=$BOOTSTRAP_ARCHIVE_SHA256 actual=$actual" >&2
            exit 1
          }
          mkdir -p artifacts
          tar -xzf "$tmp/$BOOTSTRAP_ARCHIVE" -C artifacts
          root="artifacts/chronicle-sidechain-scan"
          test -s "$root/recovered-tokens.json"
          test -s "$root/SUMMARY.json"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('artifacts/chronicle-sidechain-scan')
          records=json.loads((root/'recovered-tokens.json').read_text())
          if len(records) != 217:
              raise SystemExit(f'expected 217 sidechain NFT coordinates, found {len(records)}')
          summary=json.loads((root/'SUMMARY.json').read_text())
          print(f"[BOOTSTRAP OK] records={len(records)} source_schema={summary.get('schema')} archive_sha256=d0fe9d4c5f57d98f784ea9c9726d762a0980c08c19b909e6bdc60e97e29be7c8")
          PY

      - name: Live refresh Polygon + Base history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_live == true }}
        env:
          CHRONICLE_ADDRESS: "0xbc63566A41cBfDB9C266a5941CBe47894DaA54A8"
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          CHRONICLE_HEARTBEAT_SECONDS: "60"
          CHRONICLE_STALL_WARN_SECONDS: "300"
        run: bash scripts/run-chronicle-sidechain-mirror-observed.sh

      - name: Restore complete CAR baseline cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: artifacts/chronicle-sidechain-scan/evidence-v2/cars
          key: chronicle-sidechain-cars-v2-d0fe9d4c5f57d98f784ea9c9726d762a0980c08c19b909e6bdc60e97e29be7c8-32078752685-1

      - name: Restore latest CAR and block recovery cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            artifacts/chronicle-sidechain-scan/evidence-v2/cars
            artifacts/chronicle-sidechain-car-block-cache
          key: chronicle-sidechain-cars-v2-${{ env.BOOTSTRAP_ARCHIVE_SHA256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            chronicle-sidechain-cars-v2-${{ env.BOOTSTRAP_ARCHIVE_SHA256 }}-

      - name: Install checksum-pinned provider fallbacks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lassie_${LASSIE_VERSION}_linux_amd64.tar.gz"
          tools="$RUNNER_TEMP/trinity-tools"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/filecoin-project/lassie/releases/download/v${LASSIE_VERSION}/lassie_${LASSIE_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${LASSIE_LINUX_AMD64_SHA256}  $archive" | sha256sum --check --strict
          mkdir -p "$tools"
          tar --no-same-owner -xzf "$archive" -C "$tools" lassie
          chmod 0755 "$tools/lassie"
          version="$("$tools/lassie" version)"
          test "$version" = "lassie version v${LASSIE_VERSION}-215cb2b"
          echo "[LASSIE PINNED] $version asset_sha256=$LASSIE_LINUX_AMD64_SHA256"
          kubo_archive="$RUNNER_TEMP/kubo_v${KUBO_VERSION}_linux-amd64.tar.gz"
          curl --fail --show-error --silent --location --retry 3 \
            "https://dist.ipfs.tech/kubo/v${KUBO_VERSION}/kubo_v${KUBO_VERSION}_linux-amd64.tar.gz" \
            --output "$kubo_archive"
          echo "${KUBO_LINUX_AMD64_SHA512}  $kubo_archive" | sha512sum --check --strict
          tar --no-same-owner -xzf "$kubo_archive" -C "$tools" kubo/ipfs
          chmod 0755 "$tools/kubo/ipfs"
          kubo_version="$("$tools/kubo/ipfs" version)"
          test "$kubo_version" = "ipfs version ${KUBO_VERSION}"
          export IPFS_PATH="$RUNNER_TEMP/chronicle-kubo-repo"
          "$tools/kubo/ipfs" init --profile server
          "$tools/kubo/ipfs" config --json Swarm.DisableNatPortMap true
          echo "[KUBO PINNED] $kubo_version asset_sha512=$KUBO_LINUX_AMD64_SHA512"

      - name: Publish CAR/L1 phase
        env:
          GH_TOKEN: ${{ github.token }}
          CHRONICLE_L2_PROGRESS_FILE: ${{ runner.temp }}/chronicle-sidechain-l2-progress.json
        run: python3 scripts/publish-chronicle-sidechain-progress.py --phase car_l1 --status running || true

      - name: Resolve mint history and capture trustless CARs + L1 commitment
        env:
          GH_TOKEN: ${{ github.token }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          CHRONICLE_EVIDENCE_REFRESH_HISTORY: "false"
          CHRONICLE_EVIDENCE_CONCURRENCY: "4"
          CHRONICLE_CAR_HTTP_TIMEOUT_MS: "10000"
          CHRONICLE_CAR_HTTP_RETRIES: "0"
          CHRONICLE_CAR_WHOLE_DAG_ENDPOINT_LIMIT: "4"
          CHRONICLE_CAR_BLOCK_CONCURRENCY: "2"
          CHRONICLE_CAR_BLOCK_MAX_COUNT: "4096"
          CHRONICLE_CAR_BLOCK_GATEWAY_RACE: "4"
          CHRONICLE_CAR_BLOCK_HTTP_TIMEOUT_MS: "12000"
          CHRONICLE_CAR_BLOCK_RAW_HTTP_TIMEOUT_MS: "12000"
          CHRONICLE_CAR_BLOCK_HTTP_RETRIES: "0"
          CHRONICLE_HISTORICAL_CHUNK_SIZES: "1048576,262144"
          CHRONICLE_LASSIE_BIN: ${{ runner.temp }}/trinity-tools/lassie
          CHRONICLE_LASSIE_VERSION: ${{ env.LASSIE_VERSION }}
          CHRONICLE_LASSIE_ASSET_SHA256: ${{ env.LASSIE_LINUX_AMD64_SHA256 }}
          CHRONICLE_LASSIE_GLOBAL_TIMEOUT_MS: "60000"
          CHRONICLE_LASSIE_PROVIDER_TIMEOUT_MS: "15000"
          CHRONICLE_LASSIE_DELEGATED_ROUTING_ENDPOINT: "https://delegated-ipfs.dev"
          CHRONICLE_LASSIE_DELEGATED_ROUTING_TIMEOUT_MS: "8000"
          IPFS_PATH: ${{ runner.temp }}/chronicle-kubo-repo
          CHRONICLE_KUBO_BIN: ${{ runner.temp }}/trinity-tools/kubo/ipfs
          CHRONICLE_KUBO_VERSION: ${{ env.KUBO_VERSION }}
          CHRONICLE_KUBO_ASSET_SHA512: ${{ env.KUBO_LINUX_AMD64_SHA512 }}
          CHRONICLE_KUBO_CONNECT_TIMEOUT_MS: "8000"
          CHRONICLE_KUBO_BLOCK_TIMEOUT_MS: "30000"
          CHRONICLE_CAR_GATEWAYS: "https://ipfs.raribleuserdata.com/ipfs/{cid}?format=car&dag-scope=all,https://rarible.mypinata.cloud/ipfs/{cid}?format=car&dag-scope=all,https://gw-seattle.crustcloud.io/ipfs/{cid}?format=car&dag-scope=all,https://nftstorage.link/ipfs/{cid}?format=car&dag-scope=all,https://trustless-gateway.link/ipfs/{cid}?format=car&dag-scope=all,https://ipfs.filebase.io/ipfs/{cid}?format=car&dag-scope=all,https://4everland.io/ipfs/{cid}?format=car&dag-scope=all,https://ipfs.io/ipfs/{cid}?format=car&dag-scope=all,https://dweb.link/ipfs/{cid}?format=car&dag-scope=all,https://w3s.link/ipfs/{cid}?format=car&dag-scope=all,https://gateway.pinata.cloud/ipfs/{cid}?format=car&dag-scope=all"
        run: |
          set -euo pipefail
          kubo_log="$RUNNER_TEMP/chronicle-kubo-daemon.log"
          "$CHRONICLE_KUBO_BIN" daemon --migrate=false >"$kubo_log" 2>&1 &
          kubo_pid=$!
          cleanup() {
            kill "$kubo_pid" 2>/dev/null || true
            wait "$kubo_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --request POST \
              http://127.0.0.1:5001/api/v0/version >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            sed -n '1,200p' "$kubo_log" >&2
            exit 1
          fi
          echo "[KUBO DAEMON READY] pid=$kubo_pid"
          node scripts/build-chronicle-sidechain-evidence.mjs

      - name: Save CAR retrieval cache
        if: ${{ always() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            artifacts/chronicle-sidechain-scan/evidence-v2/cars
            artifacts/chronicle-sidechain-car-block-cache
          key: chronicle-sidechain-cars-v2-${{ env.BOOTSTRAP_ARCHIVE_SHA256 }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Capture L2 transaction and receipt inclusion proofs in parallel
        env:
          GH_TOKEN: ${{ github.token }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          CHRONICLE_POLYGON_RPC_FALLBACK_URLS: "https://polygon.drpc.org,https://polygon-bor-rpc.publicnode.com"
          CHRONICLE_BASE_RPC_FALLBACK_URLS: "https://base.drpc.org,https://base-rpc.publicnode.com,https://mainnet.base.org"
          CHRONICLE_L2_CONCURRENCY: "8"
          CHRONICLE_L2_RPC_ENDPOINT_INFLIGHT: "1"
          CHRONICLE_L2_HTTP_RETRIES: "4"
          CHRONICLE_L2_RPC_MIN_INTERVAL_MS: "100"
          CHRONICLE_L2_PROGRESS_FILE: ${{ runner.temp }}/chronicle-sidechain-l2-progress.json
          CHRONICLE_PROGRESS_PUBLISH_SECONDS: "15"
        run: |
          set -u
          python3 scripts/capture-chronicle-sidechain-l2-parallel.py &
          capture_pid=$!
          bash scripts/stream-chronicle-sidechain-progress.sh "$capture_pid" &
          publisher_pid=$!
          set +e
          wait "$capture_pid"
          rc=$?
          set -e
          wait "$publisher_pid" || true
          exit "$rc"

      - name: Publish offline verification phase
        env:
          GH_TOKEN: ${{ github.token }}
          CHRONICLE_L2_PROGRESS_FILE: ${{ runner.temp }}/chronicle-sidechain-l2-progress.json
        run: python3 scripts/publish-chronicle-sidechain-progress.py --phase offline_verify --status running || true

      - name: Verify CAR/DAG, L1 commitment, L2 MPT, block hash and timestamp offline
        run: python3 scripts/verify-chronicle-sidechain-evidence.py

      - name: Publish finalization phase
        env:
          GH_TOKEN: ${{ github.token }}
          CHRONICLE_L2_PROGRESS_FILE: ${{ runner.temp }}/chronicle-sidechain-l2-progress.json
        run: python3 scripts/publish-chronicle-sidechain-progress.py --phase finalize --status running || true

      - name: Finalize manifest and new anchor request
        run: node scripts/finalize-chronicle-sidechain-evidence.mjs

      - name: Build immutable evidence archive
        id: package
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="chronicle-sidechain-evidence-v2-${short_sha}"
          archive="chronicle-sidechain-evidence-v2-${short_sha}.tar.gz"
          tar -C artifacts -czf "$archive" chronicle-sidechain-scan
          sha256sum "$archive" > "$archive.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Publish release phase
        env:
          GH_TOKEN: ${{ github.token }}
          CHRONICLE_L2_PROGRESS_FILE: ${{ runner.temp }}/chronicle-sidechain-l2-progress.json
        run: python3 scripts/publish-chronicle-sidechain-progress.py --phase release --status running || true

      - name: Publish immutable GitHub Release evidence mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          root="artifacts/chronicle-sidechain-scan"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to mutate immutable snapshot." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Chronicle Polygon + Base NFT evidence v2 — ${GITHUB_SHA:0:12}" \
            --notes "Immutable Polygon/Base Chronicle NFT evidence snapshot. Every chain+contract+token coordinate is preserved as one Chronicle record; transfer events remain provenance. Default construction bootstraps from the pinned v1 archive only after SHA-256 verification, so rebuilding the evidence layer does not require re-reading Polygon/Base content. Includes trustless IPFS CAR preservation, deterministic L1 collection commitment, L2 transaction/receipt MPT inclusion proofs, offline verification, complete timestamp/tx/block coordinates, and a deterministic request for new BTC/ETH/OTS anchoring. Historical signatures are not retroactively extended; L3 sidechain settlement is separately statused and is not claimed PASS here. This does not amend the three-inscription Bitcoin Canon." \
            "$ARCHIVE" "$ARCHIVE.sha256" \
            "$root/SUMMARY.json" "$root/MANIFEST.sha256.json" "$root/MANIFEST.sha256" \
            "$root/evidence-v2/SIDECHAIN-NFT-IDENTITY-INDEX.json" \
            "$root/evidence-v2/SIDECHAIN-NFT-COLLECTION-COMMITMENT.json" \
            "$root/evidence-v2/TIMELINE.json" \
            "$root/evidence-v2/POLYGON-TIMELINE.json" "$root/evidence-v2/BASE-TIMELINE.json" \
            "$root/evidence-v2/L2-CAPTURE-SUMMARY.json" "$root/evidence-v2/OFFLINE-VERIFICATION.json" \
            "$root/evidence-v2/L3-SETTLEMENT-STATUS.json" "$root/evidence-v2/ANCHOR-REQUEST.json"

      - name: Job summary
        if: ${{ always() }}
        run: |
          echo '## Chronicle sidechain evidence diagnostics' >> "$GITHUB_STEP_SUMMARY"
          for f in \
            artifacts/chronicle-sidechain-scan/runtime/SIDECHAIN-DEBUG.json \
            artifacts/chronicle-sidechain-scan/runtime/WORKFLOW-STAGE.json \
            artifacts/chronicle-sidechain-scan/runtime/HISTORICAL-CAR-ROOT-MAP.json \
            artifacts/chronicle-sidechain-scan/runtime/HISTORICAL-CAR-REBUILD.json \
            artifacts/chronicle-sidechain-scan/runtime/FINAL-DIAGNOSTICS.json \
            artifacts/chronicle-sidechain-scan/SUMMARY.json \
            artifacts/chronicle-sidechain-scan/evidence-v2/BUILD-REPORT.json \
            artifacts/chronicle-sidechain-scan/evidence-v2/L2-CAPTURE-SUMMARY.json \
            artifacts/chronicle-sidechain-scan/evidence-v2/OFFLINE-VERIFICATION.json \
            artifacts/chronicle-sidechain-scan/evidence-v2/ANCHOR-REQUEST.json \
            "$RUNNER_TEMP/chronicle-sidechain-l2-progress.json"; do
            if [ -s "$f" ]; then
              echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -s artifacts/chronicle-sidechain-scan/runtime/SIDECHAIN-DEBUG.jsonl ]; then
            echo '### SIDECHAIN-DEBUG.jsonl (last 80 events)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 artifacts/chronicle-sidechain-scan/runtime/SIDECHAIN-DEBUG.jsonl >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish terminal progress
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHRONICLE_L2_PROGRESS_FILE: ${{ runner.temp }}/chronicle-sidechain-l2-progress.json
        run: |
          python3 scripts/publish-chronicle-sidechain-progress.py --phase workflow_complete --status "${{ job.status }}" || true
          python3 scripts/sidechain-debug-live.py mark --phase workflow_complete --step terminal --status "${{ job.status }}" --detail "terminal workflow status" || true
