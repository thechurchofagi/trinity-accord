name: Read-Only Production Closure

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/_read-only-production-closure.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verification revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Confirm fix merge is an ancestor
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 3f1325319f7d49d686742e8eb9098b7cbc951517 HEAD
          echo "verified_fix_merge=3f1325319f7d49d686742e8eb9098b7cbc951517"
          echo "verification_head=$(git rev-parse HEAD)"

      - name: Wait for Pages to match current main site content
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Pages freshness attempt ${attempt}/12"
            if python3 scripts/check_deployment_freshness.py \
                --site https://www.trinityaccord.org \
                --timeout 30; then
              echo "PASS: Pages content matches the checked-out current-main site contract"
              exit 0
            fi
            sleep 30
          done
          echo "FAIL: Pages did not converge to the current-main site contract"
          exit 1

      - name: Verify Render and public contracts using GET only
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import urllib.request

          USER_AGENT = "TrinityReadOnlyProductionClosure/1.0"

          def get_bytes(url: str, timeout: int = 60) -> tuple[int, bytes]:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": USER_AGENT, "Cache-Control": "no-cache"},
                  method="GET",
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return int(response.status), response.read()

          def get_json(url: str) -> tuple[int, dict]:
              status, body = get_bytes(url)
              return status, json.loads(body.decode("utf-8"))

          health_status, health = get_json(
              "https://trinity-record-chain-gateway.onrender.com/healthz"
          )
          readiness_status, readiness = get_json(
              "https://trinity-record-chain-gateway.onrender.com/record-chain/readiness"
          )
          contract_status, contract = get_json(
              "https://www.trinityaccord.org/api/record-chain-intake-gateway.v1.json"
          )
          manifest_status, manifest = get_json(
              "https://www.trinityaccord.org/api/record-chain-builder-bundles.v1.json"
          )
          builder_status, builder = get_bytes(
              "https://www.trinityaccord.org/downloads/record-chain-builder.mjs"
          )

          statuses = {
              "healthz": health_status,
              "readiness": readiness_status,
              "gateway_contract": contract_status,
              "builder_manifest": manifest_status,
              "builder": builder_status,
          }
          if any(status != 200 for status in statuses.values()):
              raise SystemExit(f"non-200 production response: {statuses}")

          base_url = str(contract.get("base_url") or "").rstrip("/")
          endpoints = contract.get("endpoints") or {}
          if base_url != "https://trinity-record-chain-gateway.onrender.com":
              raise SystemExit(f"unexpected gateway base_url: {base_url}")
          if (endpoints.get("health") or {}).get("path") != "/healthz":
              raise SystemExit("health route mismatch")
          if (endpoints.get("readiness") or {}).get("path") != "/record-chain/readiness":
              raise SystemExit("readiness route mismatch")
          if (endpoints.get("preflight") or {}).get("path") != "/record-chain/preflight":
              raise SystemExit("preflight route mismatch")
          if contract.get("public_phase", {}).get("gateway_operational") is not True:
              raise SystemExit("gateway contract does not declare operational=true")
          if contract.get("public_phase", {}).get("status") != "production_live":
              raise SystemExit("gateway contract is not production_live")

          canonical = manifest.get("canonical_builder") or {}
          actual_sha = hashlib.sha256(builder).hexdigest()
          actual_size = len(builder)
          if actual_sha != canonical.get("sha256"):
              raise SystemExit(
                  f"builder sha mismatch: actual={actual_sha} expected={canonical.get('sha256')}"
              )
          if actual_size != canonical.get("size_bytes"):
              raise SystemExit(
                  f"builder size mismatch: actual={actual_size} expected={canonical.get('size_bytes')}"
              )

          print("healthz=" + json.dumps(health, sort_keys=True))
          print("readiness=" + json.dumps(readiness, sort_keys=True))
          print("http_statuses=" + json.dumps(statuses, sort_keys=True))
          print(f"builder_sha256={actual_sha}")
          print(f"builder_size_bytes={actual_size}")
          print("HTTP methods issued by this step: GET only")
          print("POST requests issued by this workflow: 0")
          print("PASS: Render liveness/readiness and public Builder contract are current")
          PY
