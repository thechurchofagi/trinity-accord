name: One-time agent-value grammar cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'agent/sitewide-formation-framing-sync' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sitewide-formation-framing-sync

      - name: Apply and validate grammar correction
        run: |
          python3 scripts/tmp_fix_agent_value_grammar.py
          python3 -m json.tool api/agent-value.json >/dev/null
          python3 tests/test_sitewide_formation_framing.py
          git diff --check

      - name: Remove one-time tooling and commit
        run: |
          rm -f scripts/tmp_fix_agent_value_grammar.py
          rm -f .github/workflows/fix-agent-value-grammar-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: polish aligned agent-value framing [grammar-cleanup-applied]"
          git push origin HEAD:agent/sitewide-formation-framing-sync
