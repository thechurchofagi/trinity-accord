name: Prepare Artificial Self Attribution DOI
on:
  push:
    branches: [research/artificial-self-attribution-v1-1-20260919]
    paths:
      - '.github/workflows/prepare-artificial-self-attribution.yml'
      - 'research/artificial-self-attribution/prepare_zenodo.py'
      - 'research/artificial-self-attribution/publication_common.py'
permissions:
  contents: write
concurrency:
  group: artificial-self-attribution-zenodo-v1-1
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'thechurchofagi/trinity-accord' && contains(github.event.head_commit.message, '[ta08-prepare]')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/artificial-self-attribution-v1-1-20260919
      - name: Record toolchain provenance
        run: |
          python3 scripts/toolchain_provenance.py > /tmp/ta08-toolchain-provenance.json
          cat /tmp/ta08-toolchain-provenance.json
      - name: Verify publisher safety checks before using the publication credential
        run: python3 research/artificial-self-attribution/test_publication_safety.py
      - name: Recover or reserve exactly one eighth-paper draft without publishing
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python3 research/artificial-self-attribution/prepare_zenodo.py
      - name: Preserve actual preparation state including failures
        if: always()
        run: python3 research/artificial-self-attribution/publication_common.py --persist-states
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: artificial-self-attribution-doi-preparation-v1.1
          path: |
            research/artificial-self-attribution/deposit.json
            research/artificial-self-attribution/create-intent.json
            research/artificial-self-attribution/preparation-attempt.json
            /tmp/ta08-toolchain-provenance.json
          retention-days: 90
          if-no-files-found: warn
