name: Prepare RT paper v1.0.0 (reserve and build, no publish)
on:
  push:
    branches: [research/task-relative-continuity-v1-20261009]
    paths: [research/task-relative-continuity/PREPARE-AUTHORIZATION.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rt-paper-zenodo-v1-create-once
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'thechurchofagi/trinity-accord'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout dedicated RT publication branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: research/task-relative-continuity-v1-20261009
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify full source capsule and rerun exact mathematical checks
        run: python research/task-relative-continuity/release.py checks
      - name: Install PDF build dependencies without publication secrets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core lmodern poppler-utils
      - name: Reserve one DOI for the reviewed source, never publish here
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: python research/task-relative-continuity/release.py reserve
      - name: Build and freeze DOI-bearing PDF and reproducibility supplement
        run: python research/task-relative-continuity/release.py build
      - name: Preserve any confirmed or uncertain stage without replay
        if: always()
        run: python research/task-relative-continuity/release.py persist
      - name: Make exact frozen files available for visual prepublication review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rt-paper-v100-prepublication-${{ github.run_id }}
          path: |
            research/task-relative-continuity/published/
            research/task-relative-continuity/checks/
            research/task-relative-continuity/deposit.json
            research/task-relative-continuity/BUILD_READY.json
            research/task-relative-continuity/EXPECTED-PUBLICATION.json
          retention-days: 90
          if-no-files-found: warn
