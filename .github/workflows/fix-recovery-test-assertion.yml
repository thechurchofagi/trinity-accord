name: Fix Recovery Test Assertion

on:
  push:
    branches:
      - agent/harden-submission-recovery-terminal-status

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/harden-submission-recovery-terminal-status
          fetch-depth: 0
      - name: Relax wording-only assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/record_chain_intake_gateway/tests/test_secure_recovery_terminal_validation.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "failed verification" in payload["message"]\n'
          new = ('    assert "could not be verified" in payload["message"]\n'
                 '    assert "hash recomputation failed" in payload["message"]\n')
          if text.count(old) != 1:
              raise SystemExit('expected exactly one wording-only assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run focused regression
        env:
          TRINITY_GITHUB_TOKEN: test-only-placeholder
          TRINITY_REPO_FULL_NAME: test/repo
          PYTHONPATH: apps/record_chain_intake_gateway:.
        run: |
          python3 -m pip install -r requirements-ci.txt -r apps/record_chain_intake_gateway/requirements.txt
          python3 -m pytest -q apps/record_chain_intake_gateway/tests/test_secure_recovery_terminal_validation.py
      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/record_chain_intake_gateway/tests/test_secure_recovery_terminal_validation.py
          git commit -m "test: assert recovery hash failure precisely"
          git push origin HEAD:agent/harden-submission-recovery-terminal-status
