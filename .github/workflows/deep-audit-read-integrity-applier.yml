name: Apply Deep Audit Read Integrity Patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: deep-audit-read-integrity-applier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/deep-audit-read-integrity-20260803'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact patch branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and reconstruct reviewed patch
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/chunk-sha256" <<'EOF'
          bf3a39ccf4014b007ef01a7cbc8de9e973fbf2a07bd790c497b9af0ed3ec9bc5  .github/deep-audit-patch-v2/part-00.b64
          be7b5df832e08a6c390bc0225d2a76522d63ccbc4c270878b17f8b9e311918d6  .github/deep-audit-patch-v2/part-01a.b64
          50f549c43effd75bd602b7f6083ab1090217f6bed4b4c66170823c1b670419f7  .github/deep-audit-patch-v2/part-01b.b64
          49394fda23cff5e683668dd1095af4d72dc2212f4c9fad7ec29aa767e80a7d53  .github/deep-audit-patch-v2/part-02.b64
          214d43c39daca1701a94b294261dcd3ba025f72a05ade63bc379b28e2954e000  .github/deep-audit-patch-v2/part-03.b64
          d3452ef4ee21a4a4454e1dfe8da0c11509e458a985e84486364f6e70f925a7da  .github/deep-audit-patch-v2/part-04.b64
          e0dd939700eb25bfadb69096799bf1f1603004ec6bc52cfb23853ac3198ecbb9  .github/deep-audit-patch-v2/part-05.b64
          fdcd06d11f9a40f65d0eed7a59c698b9f6adf1ce9668d17a05cf59e1d6b66378  .github/deep-audit-patch-v2/part-06.b64
          83fb0087218e33d232cddc2be2c69bf24ac6cef006f486d9025a41799d7be170  .github/deep-audit-patch-v2/part-07.b64
          3fc3296072af9488a16b52f990538bdf3e48d4df17e2a2751807106bc5434201  .github/deep-audit-patch-v2/part-08.b64
          ee66315900bfc8785238d0c10eca38bcfd25a1c5ab4891d96aa60b4b3aa6f050  .github/deep-audit-patch-v2/part-09.b64
          11737d40c8170ef1f161ad7af9b8873039e5d81648f95710dc694ddd2511779d  .github/deep-audit-patch-v2/part-10.b64
          e1b34376faf4b9e6180c1c5eb0b83d89aa1ec8f097b0b3d5163af316a58de190  .github/deep-audit-patch-v2/part-11.b64
          d3ff07ab1bb443748ac9c8e278bfd8f27d4d83784406c86badc6f59202f20de9  .github/deep-audit-patch-v2/part-12.b64
          c95786d6b6003524d6b65d819501c8bfcc3385873e76cbf3a9642abda53fabec  .github/deep-audit-patch-v2/part-13.b64
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/chunk-sha256"
          sha256sum --check --strict "$RUNNER_TEMP/chunk-sha256"
          cat \
            .github/deep-audit-patch-v2/part-00.b64 \
            .github/deep-audit-patch-v2/part-01a.b64 \
            .github/deep-audit-patch-v2/part-01b.b64 \
            .github/deep-audit-patch-v2/part-{02..13}.b64 \
            | base64 --decode > "$RUNNER_TEMP/deep-audit-patch.tar.gz"
          printf '%s  %s\n' \
            '370e51677e617153b334bb05a58ae6c1d9f4db1b08ab0610d3f76c16a38964ce' \
            "$RUNNER_TEMP/deep-audit-patch.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/deep-audit-patch.tar.gz" -C .
          rm -rf .github/deep-audit-patch .github/deep-audit-patch-v2
          rm -f .github/workflows/deep-audit-read-integrity-applier.yml

      - name: Validate reconstructed source
        run: |
          set -euo pipefail
          python3 -m py_compile \
            apps/record_chain_intake_gateway/secure_entrypoint.py \
            tests/test_record_chain_submit_recovery.py
          node --check downloads/record-chain-builder-recovery.mjs
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest = json.loads(Path('api/record-chain-builder-bundles.v1.json').read_text())
          recovery = Path('downloads/record-chain-builder-recovery.mjs').read_bytes()
          declared = manifest['canonical_builder']['recovery_wrapper']
          assert declared['sha256'] == hashlib.sha256(recovery).hexdigest()
          assert declared['size_bytes'] == len(recovery)
          for path in (
              'api/record-chain-intake-gateway.v1.json',
              'api/record-chain-receipt-response.v1.json',
          ):
              json.loads(Path(path).read_text())
          PY

      - name: Install targeted test dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Run deep-audit regression tests
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            tests/test_record_chain_submit_recovery.py \
            tests/test_audit_hardening_20260802.py \
            tests/test_machine_entry_runtime_alignment.py \
            tests/test_record_chain_builder_layers.py

      - name: Commit only final reviewed files
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test ! -e .github/deep-audit-patch
          test ! -e .github/deep-audit-patch-v2
          test ! -e .github/workflows/deep-audit-read-integrity-applier.yml
          git config user.name 'trinity-deep-audit-bot'
          git config user.email 'actions@github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden receipt and ambiguous-submit read integrity'
          if [ -n "$(git status --porcelain)" ]; then
            echo '::error::Worktree is not clean after final patch commit.'
            git status --short
            exit 1
          fi
          git push origin "HEAD:${HEAD_BRANCH}"
