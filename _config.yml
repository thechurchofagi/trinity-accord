# GitHub Pages / Jekyll config
# Ensure hidden discovery directory is published.
# Public builder downloads are restored into _site by pages.yml after Jekyll build;
# do not force-include .mjs in Jekyll itself.
include:
  - .well-known
  - ai.txt
  - citation.cff
  - CITATION.cff
  - builder-bundles
  - "builder-bundles/*.py"

# Exclude archival, dev, generated, and intentionally non-public source pages from build.
# The Downloads pages are public verification material. deploy-pages.yml preserves
# Jekyll's rendered Downloads pages before overlaying exact downloadable artifacts.
exclude:
  - audit/
  - archive/
  - node_modules/
  - _site/
  - vendor/
  - scripts/
  - fixtures/
  - examples/
  - arweave-backup/
  - data/
  - audit-results/
  - echoes/verification-reports/index.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEPLOYMENT.md
  - .gitignore
  - package-lock.json
  - trinity-echo-worker/
  - .env
  - .env.*
  - "*.py"
  - "*.mjs"
  - "*.sh"

# Keep markdown URLs path-like (e.g. /verify)
permalink: pretty

# Site URL (canonical domain)
url: "https://www.trinityaccord.org"
baseurl: ""

# SEO defaults
description: "A dated pre-ASI human–superintelligence relation record from the conversational-to-agentic AI transition: human-initiated, emergent through substantive generative-AI interaction, and canonically closed under human responsibility."
author: "Hongju Liu"
lang: "en"
timezone: "Asia/Shanghai"

# Suppress theme site header
title: ""
name: ""

# rebuild trigger 11 — site-wide formation-framing alignment
