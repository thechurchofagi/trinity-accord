# deploy-trigger: 2026-07-31T17:38:00+08:00 — secret-keyed intake cooldown, content limits, and cost boundary
services:
  # Legacy Issue Gateway v1 — retired-only compatibility surface.
  - type: web_service
    name: trinity-agent-issue-gateway
    runtime: node
    region: oregon
    plan: free
    rootDir: examples/github-app-backend
    buildCommand: pip install -r ../../requirements-ci.txt && npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    branch: main
    envVars:
      - key: NODE_VERSION
        value: "22.22.1"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TRINITY_LEGACY_ISSUE_GATEWAY_RETIRED
        value: "1"

  # Gateway deploy is manual or explicitly triggered only.
  # Record-chain data commits, OTS commits, sitemap commits, and homepage
  # status commits must not redeploy the Gateway runtime.
  - type: web_service
    name: trinity-record-chain-gateway
    runtime: python
    region: oregon
    plan: starter
    autoDeploy: false
    buildCommand: pip install -r apps/record_chain_intake_gateway/requirements.txt
    startCommand: uvicorn apps.record_chain_intake_gateway.secure_entrypoint:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TRINITY_REPO_FULL_NAME
        value: thechurchofagi/trinity-accord
      - key: TRINITY_TARGET_BRANCH
        value: main
      - key: TRINITY_GITHUB_TOKEN
        sync: false
      - key: TRINITY_COOLDOWN_SECRET
        sync: false
      - key: TRINITY_GATEWAY_BASE_URL
        value: https://trinity-record-chain-gateway.onrender.com
      - key: TRINITY_GATEWAY_RUNTIME_VERSION
        value: v1
      - key: TRINITY_MAX_SUBMISSION_BYTES
        value: "98304"
      - key: TRINITY_RECORD_DRAFT_MAX_BYTES
        value: "49152"
      - key: TRINITY_MAX_TEXT_FIELD_CHARS
        value: "4000"
      - key: TRINITY_MAX_URL_CHARS
        value: "2048"
      - key: TRINITY_MAX_JSON_DEPTH
        value: "12"
      - key: TRINITY_MAX_ARRAY_ITEMS
        value: "32"
      - key: TRINITY_MAX_REFERENCE_ITEMS
        value: "16"
      - key: TRINITY_SUBMIT_WRITE_MODE
        value: github_contents_pending
      - key: TRINITY_APPEND_WORKFLOW_FILE
        value: record-chain-append.yml
