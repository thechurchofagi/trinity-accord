<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导览配音 · Trinity Accord</title>
<style>body{max-width:850px;margin:3rem auto;padding:0 1.25rem;font:17px/1.7 system-ui;background:#101e28;color:#edf2ed}article{padding:1rem 0;border-bottom:1px solid #49606b}audio{width:100%}a{color:#a9deef}h1{font-size:1.8rem}h2{font-size:1.15rem}p{overflow-wrap:anywhere}summary{cursor:pointer}nav{display:flex;gap:1rem;flex-wrap:wrap}button{background:#223743;color:#fff;border:1px solid #a9bdc1;padding:.6rem 1rem;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#d8b679;color:#14232d}</style>
<h1>导览配音 / Museum narration</h1>
<p>中文 Serena · English Aiden</p>
<p>Qwen3-TTS 合成策展配音。以下为当前展馆播放的录音；原始歌曲与历史作品录音另行保留。<br>These are the synthetic curatorial recordings used by the museum. Original songs and historical recordings remain separate.</p>
<nav><a href="./">返回博物馆 / Museum</a><a href="data/narration-provenance.json">来源与校对 / Provenance and review</a></nav>
<p><button id="zh" aria-pressed="true">中文</button> <button id="en" aria-pressed="false">English</button></p>
<main id="tracks" aria-live="polite">正在载入 / Loading…</main>
<script type="module">
const target=document.getElementById('tracks');
try {
 const response=await fetch('./data/guide-audio.json');if(!response.ok)throw new Error('Audio list unavailable');
 const data=await response.json();
 function show(language){
  for(const a of target.querySelectorAll('audio'))a.pause();target.replaceChildren();
  for(const l of ['zh','en'])document.getElementById(l).setAttribute('aria-pressed',String(l===language));
  for(const t of [...data.tracks,...data.inspectionTracks].filter(t=>t.language===language)){
   const article=document.createElement('article'),heading=document.createElement('h2'),audio=document.createElement('audio'),details=document.createElement('details'),summary=document.createElement('summary'),text=document.createElement('p');
   heading.textContent=('stop' in t?(language==='zh'?'导览第 ':'Tour stop ')+(t.stop+1):(language==='zh'?'瑕疵详解 ':'Flaw inspection ')+(t.flaw+1))+' · '+Math.round(t.duration)+' s';
   audio.controls=true;audio.preload='none';audio.src='./'+t.file;audio.setAttribute('aria-label',heading.textContent);
   audio.addEventListener('play',()=>{for(const other of target.querySelectorAll('audio'))if(other!==audio)other.pause();});
   summary.textContent=language==='zh'?'展开讲稿':'Read script';text.textContent=t.text;
   details.append(summary,text);article.append(heading,audio,details);target.append(article);
  }
 }
 for(const l of ['zh','en'])document.getElementById(l).onclick=()=>show(l);show('zh');
} catch(e){target.textContent='录音列表暂未载入，请稍后重试。 / Recordings unavailable; please retry.';}
</script>
</html>
